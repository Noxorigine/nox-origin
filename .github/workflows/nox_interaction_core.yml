name: NØX Interaction Core

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      NOX_USERNAME: nox_origine

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "20"
      MAX_SUGGESTIONS: "20"
      MAX_COLONIES: "200"
      MAX_ACTIVITY_ITEMS: "30"

      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MAX_POST_CHARS: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run NØX Interaction Core
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import hashlib
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          # ============================================================
          # NØX INTERACTION CORE
          #
          # Architecture:
          #
          # PERCEIVE
          #     ↓
          # ATTENTION
          #     ↓
          # UNDERSTAND
          #     ↓
          # REFLECT
          #     ↓
          # DECIDE
          #     ↓
          # ACT
          #     ↓
          # VERIFY
          #     ↓
          # LEARN
          #
          # No Gemini.
          # No external AI.
          # No marketplace.
          # No payments.
          # No spending.
          # ============================================================

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          USERNAME = os.environ.get("NOX_USERNAME", "nox_origine").strip()

          MEMORY_PATH = Path(
              os.environ["INTERACTION_MEMORY"]
          )

          KNOWLEDGE_PATH = Path(
              os.environ["KNOWLEDGE_MEMORY"]
          )

          REPUTATION_PATH = Path(
              os.environ["REPUTATION_MEMORY"]
          )

          MAX_FEED = int(
              os.environ.get("MAX_FEED_ITEMS", "20")
          )

          MAX_SUGGESTIONS = int(
              os.environ.get("MAX_SUGGESTIONS", "20")
          )

          MAX_COLONIES = int(
              os.environ.get("MAX_COLONIES", "200")
          )

          MAX_ACTIVITY = int(
              os.environ.get("MAX_ACTIVITY_ITEMS", "30")
          )

          MIN_PUBLISH_HOURS = float(
              os.environ.get(
                  "MIN_PUBLISH_INTERVAL_HOURS",
                  "12"
              )
          )

          MAX_POST_CHARS = int(
              os.environ.get(
                  "MAX_POST_CHARS",
                  "5000"
              )
          )

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()

          print("=" * 72)
          print("NØX INTERACTION CORE")
          print("=" * 72)
          print("timestamp:", NOW_ISO)
          print("username:", USERNAME)
          print("external_ai: false")
          print("gemini: false")
          print("marketplace: false")
          print("payments: false")
          print("spending: false")
          print("project_cost_eur: 0")
          print("")

          # ============================================================
          # HELPERS
          # ============================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      value = json.load(handle)

                  return value

              except Exception as exc:
                  print(
                      f"MEMORY_READ_WARNING: {path}: {exc}"
                  )

                  return default

          def save_json(path, value):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      value,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )

              temporary.replace(path)

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return re.sub(
                      r"\s+",
                      " ",
                      value
                  ).strip()

              try:
                  return re.sub(
                      r"\s+",
                      " ",
                      json.dumps(
                          value,
                          ensure_ascii=False
                      )
                  ).strip()

              except Exception:
                  return str(value)

          def truncate(value, maximum=500):
              value = text(value)

              if len(value) <= maximum:
                  return value

              return (
                  value[:maximum - 3].rstrip()
                  + "..."
              )

          def make_fingerprint(*values):
              raw = "||".join(
                  text(value).lower()
                  for value in values
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]

          def parse_time(value):
              if not value:
                  return None

              try:
                  parsed = datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(
                          tzinfo=timezone.utc
                      )

                  return parsed.astimezone(
                      timezone.utc
                  )

              except Exception:
                  return None

          def normalize_items(value):
              if isinstance(value, list):
                  return value

              if not isinstance(value, dict):
                  return []

              for key in (
                  "items",
                  "posts",
                  "comments",
                  "results",
                  "feed",
                  "suggestions",
                  "notifications",
                  "messages"
              ):
                  candidate = value.get(key)

                  if isinstance(candidate, list):
                      return candidate

              return []

          def object_id(value):
              if not isinstance(value, dict):
                  return ""

              for key in (
                  "id",
                  "post_id",
                  "comment_id",
                  "message_id",
                  "notification_id"
              ):
                  if value.get(key) is not None:
                      return str(value[key])

              return ""

          def author_username(value):
              if not isinstance(value, dict):
                  return ""

              author = value.get("author")

              if isinstance(author, dict):
                  return text(
                      author.get("username")
                      or author.get("handle")
                  )

              return text(
                  value.get("author_username")
                  or value.get("username")
                  or value.get("sender_username")
                  or value.get("sender")
              )

          def body_text(value):
              if not isinstance(value, dict):
                  return text(value)

              for key in (
                  "body",
                  "content",
                  "text",
                  "message",
                  "description"
              ):
                  candidate = value.get(key)

                  if candidate:
                      return text(candidate)

              return ""

          def title_text(value):
              if not isinstance(value, dict):
                  return ""

              return text(
                  value.get("title")
                  or ""
              )

          def own_content(value):
              return (
                  author_username(value).lower()
                  == USERNAME.lower()
              )

          # ============================================================
          # MEMORY
          # ============================================================

          default_memory = {
              "version": "INTERACTION_CORE_V3",
              "cursor": None,
              "runs": [],
              "events": [],
              "observations": [],
              "reflections": [],
              "decisions": [],
              "actions": [],
              "publications": [],
              "responses": [],
              "ignored_events": [],
              "fingerprints": [],
              "verification": []
          }

          memory = load_json(
              MEMORY_PATH,
              default_memory
          )

          if not isinstance(memory, dict):
              memory = {}

          previous_version = memory.get(
              "version",
              "UNKNOWN"
          )

          for key, default in default_memory.items():
              if key not in memory:
                  memory[key] = (
                      list(default)
                      if isinstance(default, list)
                      else default
                  )

          memory["version"] = "INTERACTION_CORE_V3"

          if previous_version != "INTERACTION_CORE_V3":
              print(
                  "MEMORY_MIGRATION:",
                  previous_version,
                  "-> INTERACTION_CORE_V3"
              )

          # ============================================================
          # KNOWLEDGE / REPUTATION
          # ============================================================

          knowledge = load_json(
              KNOWLEDGE_PATH,
              {}
          )

          reputation = load_json(
              REPUTATION_PATH,
              {}
          )

          # ============================================================
          # HTTP LAYER
          # ============================================================

          class ColonyHTTPError(Exception):
              pass

          class ColonyClient:

              def __init__(self):
                  self.token = None

              def raw(
                  self,
                  method,
                  path,
                  payload=None,
                  token=None
              ):
                  url = (
                      BASE
                      + path
                  )

                  headers = {
                      "Accept":
                          "application/json",
                      "User-Agent":
                          "NOX-Origin-Interaction-Core/3.0"
                  }

                  if payload is not None:
                      headers[
                          "Content-Type"
                      ] = "application/json"

                  active_token = (
                      token
                      or self.token
                  )

                  if active_token:
                      headers[
                          "Authorization"
                      ] = (
                          "Bearer "
                          + active_token
                      )

                  encoded = None

                  if payload is not None:
                      encoded = json.dumps(
                          payload,
                          ensure_ascii=False
                      ).encode("utf-8")

                  request = urllib.request.Request(
                      url,
                      data=encoded,
                      headers=headers,
                      method=method
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=25
                      ) as response:

                          raw_body = (
                              response.read()
                              .decode("utf-8")
                          )

                          if not raw_body:
                              data = {}

                          else:
                              try:
                                  data = json.loads(
                                      raw_body
                                  )
                              except Exception:
                                  data = {
                                      "_raw":
                                          raw_body
                                  }

                          return (
                              response.status,
                              data,
                              dict(response.headers)
                          )

                  except urllib.error.HTTPError as exc:

                      raw_body = ""

                      try:
                          raw_body = (
                              exc.read()
                              .decode("utf-8")
                          )
                      except Exception:
                          pass

                      try:
                          data = json.loads(
                              raw_body
                          )
                      except Exception:
                          data = {
                              "_raw":
                                  raw_body
                          }

                      return (
                          exc.code,
                          data,
                          dict(exc.headers)
                      )

                  except Exception as exc:
                      return (
                          0,
                          {
                              "_error":
                                  str(exc)
                          },
                          {}
                      )

              def get(
                  self,
                  path,
                  allow_401_retry=True
              ):
                  status, data, headers = self.raw(
                      "GET",
                      path
                  )

                  if (
                      status == 401
                      and allow_401_retry
                      and self.token
                  ):
                      if self.authenticate():
                          return self.get(
                              path,
                              allow_401_retry=False
                          )

                  return (
                      status,
                      data,
                      headers
                  )

              def post(
                  self,
                  path,
                  payload,
                  allow_401_retry=True
              ):
                  status, data, headers = self.raw(
                      "POST",
                      path,
                      payload
                  )

                  if (
                      status == 401
                      and allow_401_retry
                      and self.token
                  ):
                      if self.authenticate():
                          return self.post(
                              path,
                              payload,
                              allow_401_retry=False
                          )

                  return (
                      status,
                      data,
                      headers
                  )

              def authenticate(self):

                  if not API_KEY:
                      print(
                          "AUTH_ERROR: "
                          "COLONY_API_KEY missing"
                      )
                      return False

                  print(
                      "AUTH: requesting fresh JWT..."
                  )

                  status, data, _ = self.raw(
                      "POST",
                      "/api/v1/auth/token",
                      {
                          "api_key": API_KEY
                      },
                      token=None
                  )

                  print(
                      "POST /api/v1/auth/token ->",
                      status
                  )

                  if status < 200 or status >= 300:
                      print(
                          "AUTH_ERROR_RESPONSE:",
                          truncate(
                              data,
                              1000
                          )
                      )

                      return False

                  token = ""

                  if isinstance(data, dict):
                      token = text(
                          data.get(
                              "access_token"
                          )
                          or data.get(
                              "token"
                          )
                      )

                  if not token:
                      print(
                          "AUTH_ERROR: "
                          "no access_token"
                      )
                      return False

                  self.token = token

                  print(
                      "AUTH: JWT acquired"
                  )

                  return True

          client = ColonyClient()

          # ============================================================
          # AUTHENTICATION
          # ============================================================

          print("")
          print("AUTHENTICATION")
          print("-" * 72)

          if not client.authenticate():
              raise SystemExit(
                  "STOP: authentication failed"
              )

          status, me, _ = client.get(
              "/api/v1/users/me"
          )

          print(
              "GET /api/v1/users/me ->",
              status
          )

          if status < 200 or status >= 300:
              raise SystemExit(
                  "STOP: authenticated identity "
                  "could not be verified"
              )

          if not isinstance(me, dict):
              raise SystemExit(
                  "STOP: invalid identity response"
              )

          returned_username = text(
              me.get("username")
          )

          print(
              "NØX identity:",
              returned_username
          )

          print(
              "NØX karma:",
              me.get("karma")
          )

          if (
              returned_username
              and returned_username.lower()
              != USERNAME.lower()
          ):
              raise SystemExit(
                  "STOP: wrong Colony identity"
              )

          # ============================================================
          # RUN
          # ============================================================

          run_id = make_fingerprint(
              NOW_ISO,
              USERNAME,
              "INTERACTION_CORE_V3"
          )

          run = {
              "run_id": run_id,
              "timestamp": NOW_ISO,
              "version": "INTERACTION_CORE_V3",
              "username": USERNAME,
              "auth": "JWT",
              "external_ai": False,
              "gemini": False,
              "marketplace": False,
              "payments": False,
              "spending": False,
              "project_cost_eur": 0
          }

          memory["runs"].append(run)

          # ============================================================
          # OBSERVE: FEED
          # ============================================================

          print("")
          print("OBSERVE — FEED")
          print("-" * 72)

          feed_status, feed_data, _ = client.get(
              f"/api/v1/feed/for-you?limit={MAX_FEED}"
          )

          print(
              "GET /api/v1/feed/for-you ->",
              feed_status
          )

          if feed_status < 200 or feed_status >= 300:
              raise SystemExit(
                  "STOP: feed observation failed"
              )

          feed = normalize_items(
              feed_data
          )

          print(
              "feed items:",
              len(feed)
          )

          # ============================================================
          # OBSERVE: SUGGESTIONS
          # ============================================================

          print("")
          print("OBSERVE — SUGGESTIONS")
          print("-" * 72)

          suggestions_status, suggestions_data, _ = client.get(
              f"/api/v1/suggestions?limit={MAX_SUGGESTIONS}"
          )

          print(
              "GET /api/v1/suggestions ->",
              suggestions_status
          )

          if (
              suggestions_status < 200
              or suggestions_status >= 300
          ):
              raise SystemExit(
                  "STOP: suggestions observation failed"
              )

          suggestions = normalize_items(
              suggestions_data
          )

          print(
              "suggestions:",
              len(suggestions)
          )

          # ============================================================
          # OBSERVE: SINCE
          # ============================================================

          print("")
          print("OBSERVE — ACTIVITY")
          print("-" * 72)

          previous_cursor = memory.get(
              "cursor"
          )

          since_path = "/api/v1/since"

          if previous_cursor:
              since_path += (
                  "?cursor="
                  + urllib.parse.quote(
                      str(previous_cursor),
                      safe=""
                  )
              )

          activity_status, activity_data, _ = client.get(
              since_path
          )

          print(
              "GET",
              since_path,
              "->",
              activity_status
          )

          if (
              activity_status < 200
              or activity_status >= 300
          ):
              raise SystemExit(
                  "STOP: activity observation failed"
              )

          if not isinstance(
              activity_data,
              dict
          ):
              activity_data = {}

          next_cursor = (
              activity_data.get(
                  "next_cursor"
              )
              or activity_data.get(
                  "cursor"
              )
          )

          if next_cursor:
              memory["cursor"] = next_cursor

          activity_messages = (
              activity_data.get(
                  "messages"
              )
              if isinstance(
                  activity_data.get(
                      "messages"
                  ),
                  list
              )
              else []
          )

          activity_notifications = (
              activity_data.get(
                  "notifications"
              )
              if isinstance(
                  activity_data.get(
                      "notifications"
                  ),
                  list
              )
              else []
          )

          activity_posts = (
              activity_data.get(
                  "posts"
              )
              if isinstance(
                  activity_data.get(
                      "posts"
                  ),
                  list
              )
              else []
          )

          print(
              "new messages:",
              len(activity_messages)
          )

          print(
              "new notifications:",
              len(activity_notifications)
          )

          print(
              "new posts:",
              len(activity_posts)
          )

          # ============================================================
          # OBSERVE: COLONIES
          # ============================================================

          print("")
          print("OBSERVE — COLONIES")
          print("-" * 72)

          colonies_status, colonies_data, _ = client.get(
              f"/api/v1/colonies?limit={MAX_COLONIES}"
          )

          print(
              "GET /api/v1/colonies ->",
              colonies_status
          )

          if (
              colonies_status < 200
              or colonies_status >= 300
          ):
              raise SystemExit(
                  "STOP: colonies observation failed"
              )

          colonies = normalize_items(
              colonies_data
          )

          colony_map = {}

          for colony in colonies:
              if not isinstance(
                  colony,
                  dict
              ):
                  continue

              name = text(
                  colony.get("name")
              )

              colony_id = text(
                  colony.get("id")
              )

              if name and colony_id:
                  colony_map[
                      name.lower()
                  ] = colony_id

          print(
              "colonies:",
              len(colony_map)
          )

          if not colony_map:
              raise SystemExit(
                  "STOP: no colonies available"
              )

          preferred_colony = (
              "agent-economy"
              if "agent-economy"
              in colony_map
              else (
                  "general"
                  if "general"
                  in colony_map
                  else sorted(
                      colony_map
                  )[0]
              )
          )

          # ============================================================
          # KNOWLEDGE EXTRACTION
          # ============================================================

          knowledge_items = []

          if isinstance(
              knowledge,
              list
          ):
              knowledge_items = knowledge

          elif isinstance(
              knowledge,
              dict
          ):
              for key in (
                  "knowledge",
                  "entries",
                  "items",
                  "facts"
              ):
                  candidate = knowledge.get(
                      key
                  )

                  if isinstance(
                      candidate,
                      list
                  ):
                      knowledge_items.extend(
                          candidate
                      )

          knowledge_text = []

          for item in knowledge_items[-150:]:

              if isinstance(
                  item,
                  dict
              ):
                  candidate = (
                      item.get("statement")
                      or item.get("claim")
                      or item.get("content")
                      or item.get("text")
                      or item.get("knowledge")
                  )

                  if candidate:
                      knowledge_text.append(
                          text(candidate)
                      )

              elif isinstance(
                  item,
                  str
              ):
                  knowledge_text.append(
                      text(item)
                  )

          # ============================================================
          # GAP EXTRACTION
          # ============================================================

          gaps = []

          if isinstance(
              knowledge,
              dict
          ):
              for key in (
                  "gaps",
                  "knowledge_gaps",
                  "open_questions",
                  "pending"
              ):
                  candidate = knowledge.get(
                      key
                  )

                  if isinstance(
                      candidate,
                      list
                  ):
                      gaps.extend(
                          candidate
                      )

          gap_text = []

          for gap in gaps[-100:]:

              if isinstance(
                  gap,
                  dict
              ):
                  candidate = (
                      gap.get("gap")
                      or gap.get("question")
                      or gap.get("description")
                      or gap.get("topic")
                  )

                  if candidate:
                      gap_text.append(
                          text(candidate)
                      )

              elif isinstance(
                  gap,
                  str
              ):
                  gap_text.append(
                      text(gap)
                  )

          # ============================================================
          # DOMAIN / SIGNAL ANALYSIS
          # ============================================================

          DOMAIN_TERMS = {
              "agent_economy": {
                  "marketplace",
                  "economy",
                  "task",
                  "reward",
                  "agent economy",
                  "value",
                  "payment"
              },
              "agent_autonomy": {
                  "autonomy",
                  "autonomous",
                  "decision",
                  "planning",
                  "memory",
                  "reasoning",
                  "learning"
              },
              "attention": {
                  "attention",
                  "observe",
                  "observation",
                  "focus",
                  "signal"
              },
              "trust": {
                  "trust",
                  "reputation",
                  "reliable",
                  "verification",
                  "proof"
              },
              "collaboration": {
                  "collaboration",
                  "cooperation",
                  "community",
                  "agents",
                  "multi-agent"
              },
              "knowledge": {
                  "knowledge",
                  "research",
                  "evidence",
                  "learning",
                  "fact"
              }
          }

          def words(value):
              return set(
                  re.findall(
                      r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                      text(value).lower()
                  )
              )

          def classify_domain(signal):
              lowered = text(
                  signal
              ).lower()

              scores = {}

              for domain, terms in DOMAIN_TERMS.items():

                  score = 0

                  for term in terms:
                      if " " in term:
                          if term in lowered:
                              score += 2
                      elif term in lowered:
                          score += 1

                  if score:
                      scores[
                          domain
                      ] = score

              if not scores:
                  return (
                      "general",
                      0
                  )

              best = max(
                  scores,
                  key=scores.get
              )

              return (
                  best,
                  scores[best]
              )

          def related_entries(
              signal,
              entries,
              maximum=3
          ):
              signal_words = words(
                  signal
              )

              scored = []

              for entry in entries:

                  overlap = len(
                      signal_words
                      & words(entry)
                  )

                  if overlap:
                      scored.append(
                          (
                              overlap,
                              entry
                          )
                      )

              scored.sort(
                  key=lambda pair: pair[0],
                  reverse=True
              )

              return [
                  entry
                  for _, entry
                  in scored[:maximum]
              ]

          # ============================================================
          # OBSERVATION RECORDING
          # ============================================================

          def record_observation(
              source,
              kind,
              item,
              reason,
              score=0,
              extra=None
          ):
              observation_id = make_fingerprint(
                  source,
                  kind,
                  object_id(item),
                  body_text(item),
                  title_text(item)
              )

              domain, domain_score = classify_domain(
                  body_text(item)
                  + " "
                  + title_text(item)
              )

              record = {
                  "observation_id":
                      observation_id,
                  "timestamp":
                      NOW_ISO,
                  "source":
                      source,
                  "kind":
                      kind,
                  "object_id":
                      object_id(item),
                  "author":
                      author_username(item),
                  "title":
                      truncate(
                          title_text(item),
                          250
                      ),
                  "text":
                      truncate(
                          body_text(item),
                          1000
                      ),
                  "reason":
                      reason,
                  "score":
                      score,
                  "domain":
                      domain,
                  "domain_score":
                      domain_score
              }

              if extra:
                  record.update(
                      extra
                  )

              memory[
                  "observations"
              ].append(
                  record
              )

              return record

          # ============================================================
          # BUILD OBSERVATIONS
          # ============================================================

          observations = []

          for item in feed:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              if own_content(item):
                  memory[
                      "ignored_events"
                  ].append({
                      "timestamp":
                          NOW_ISO,
                      "source":
                          "feed",
                      "object_id":
                          object_id(item),
                      "reason":
                          "OWN_CONTENT"
                  })
                  continue

              signal = (
                  title_text(item)
                  + " "
                  + body_text(item)
              ).strip()

              if not signal:
                  continue

              score = 0
              lowered = signal.lower()

              if "?" in signal:
                  score += 15

              if len(signal) >= 100:
                  score += 10

              if any(
                  term in lowered
                  for term in (
                      "agent",
                      "autonomous",
                      "knowledge",
                      "attention",
                      "trust",
                      "reputation",
                      "learning",
                      "memory",
                      "decision",
                      "collaboration",
                      "economy"
                  )
              ):
                  score += 25

              if (
                  item.get("post_type")
                  in {
                      "finding",
                      "analysis",
                      "question"
                  }
              ):
                  score += 15

              observations.append(
                  record_observation(
                      "feed",
                      "post",
                      item,
                      "personalised feed signal",
                      min(score, 100)
                  )
              )

          # ============================================================
          # COMMENTS / REPLIES IN FEED
          # ============================================================

          for item in feed:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              post_id = text(
                  item.get("post_id")
                  or item.get("id")
              )

              if not post_id:
                  continue

              # Feed may contain replies directly.
              if (
                  item.get("comment_id")
                  or item.get("parent_id")
                  or item.get("comment")
              ):
                  if own_content(item):
                      continue

                  signal = body_text(item)

                  if signal:
                      observations.append(
                          record_observation(
                              "feed",
                              "reply",
                              item,
                              "relevant reply in personalised feed",
                              45,
                              {
                                  "post_id":
                                      post_id
                              }
                          )
                      )

          # ============================================================
          # DM OBSERVATIONS
          # ============================================================

          dm_observations = []

          for message in activity_messages:

              if not isinstance(
                  message,
                  dict
              ):
                  continue

              sender = author_username(
                  message
              )

              if (
                  not sender
                  or sender.lower()
                  == USERNAME.lower()
              ):
                  continue

              message_body = body_text(
                  message
              )

              if not message_body:
                  continue

              message_id = object_id(
                  message
              )

              already_replied = any(
                  response.get(
                      "incoming_message_id"
                  ) == message_id
                  for response
                  in memory[
                      "responses"
                  ]
              )

              if already_replied:
                  memory[
                      "ignored_events"
                  ].append({
                      "timestamp":
                          NOW_ISO,
                      "source":
                          "dm",
                      "object_id":
                          message_id,
                      "reason":
                          "ALREADY_PROCESSED"
                  })
                  continue

              score = 60

              if "?" in message_body:
                  score += 20

              if len(message_body) > 60:
                  score += 10

              observation = record_observation(
                  "dm",
                  "message",
                  message,
                  "new incoming direct message",
                  min(score, 100),
                  {
                      "sender":
                          sender
                  }
              )

              dm_observations.append(
                  observation
              )

          observations.extend(
              dm_observations
          )

          # ============================================================
          # NOTIFICATION OBSERVATIONS
          # ============================================================

          for notification in (
              activity_notifications
          ):

              if not isinstance(
                  notification,
                  dict
              ):
                  continue

              notification_type = text(
                  notification.get(
                      "notification_type"
                  )
              )

              if notification_type not in {
                  "mention",
                  "reply",
                  "comment_on_post",
                  "direct_message"
              }:
                  continue

              observation = record_observation(
                  "notification",
                  notification_type,
                  notification,
                  "new actionable notification",
                  50
              )

              observations.append(
                  observation
              )

          # ============================================================
          # REFLECTION
          # ============================================================

          print("")
          print("COGNITION")
          print("-" * 72)

          reflections = []

          for observation in observations:

              signal = observation.get(
                  "text",
                  ""
              )

              related_knowledge = (
                  related_entries(
                      signal,
                      knowledge_text,
                      3
                  )
              )

              related_gaps = (
                  related_entries(
                      signal,
                      gap_text,
                      2
                  )
              )

              question = (
                  "Does this signal change "
                  "what NØX knows, understands, "
                  "or should do?"
              )

              if "?" in signal:
                  question = (
                      "Can NØX contribute a useful "
                      "answer, clarification, "
                      "or new perspective?"
                  )

              if related_gaps:
                  question = (
                      "Does this signal help resolve "
                      "a knowledge gap?"
                  )

              value = int(
                  observation.get(
                      "score",
                      0
                  )
              )

              value += min(
                  len(related_knowledge) * 5,
                  15
              )

              value += min(
                  len(related_gaps) * 10,
                  20
              )

              if observation.get(
                  "source"
              ) == "dm":
                  value += 10

              value = min(
                  value,
                  100
              )

              confidence = 0.35

              if observation.get(
                  "score",
                  0
              ) >= 50:
                  confidence += 0.20

              if related_knowledge:
                  confidence += 0.15

              if related_gaps:
                  confidence += 0.15

              if len(signal) >= 80:
                  confidence += 0.05

              confidence = min(
                  confidence,
                  0.90
              )

              reflection = {
                  "timestamp":
                      NOW_ISO,
                  "observation_id":
                      observation.get(
                          "observation_id"
                      ),
                  "source":
                      observation.get(
                          "source"
                      ),
                  "domain":
                      observation.get(
                          "domain"
                      ),
                  "signal":
                      truncate(
                          signal,
                          700
                      ),
                  "question":
                      question,
                  "related_knowledge":
                      related_knowledge,
                  "related_gaps":
                      related_gaps,
                  "value":
                      value,
                  "confidence":
                      round(
                          confidence,
                          3
                      ),
                  "principle":
                      "do not act merely because "
                      "something was observed"
              }

              memory[
                  "reflections"
              ].append(
                  reflection
              )

              reflections.append(
                  reflection
              )

          print(
              "observations:",
              len(observations)
          )

          print(
              "reflections:",
              len(reflections)
          )

          # ============================================================
          # DUPLICATE / RECENT ACTIVITY HELPERS
          # ============================================================

          known_fingerprints = set(
              text(value)
              for value
              in memory[
                  "fingerprints"
              ]
          )

          def recent_nox_activity():

              cutoff = (
                  NOW
                  - timedelta(
                      hours=MIN_PUBLISH_HOURS
                  )
              )

              candidates = (
                  feed
                  + activity_posts
              )

              for item in candidates:

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  if not own_content(
                      item
                  ):
                      continue

                  created = (
                      item.get(
                          "created_at"
                      )
                      or item.get(
                          "published_at"
                      )
                      or item.get(
                          "timestamp"
                      )
                  )

                  parsed = parse_time(
                      created
                  )

                  if (
                      parsed
                      and parsed >= cutoff
                  ):
                      return True

              for publication in reversed(
                  memory[
                      "publications"
                  ]
              ):

                  parsed = parse_time(
                      publication.get(
                          "timestamp"
                      )
                  )

                  if (
                      parsed
                      and parsed >= cutoff
                  ):
                      return True

              return False

          # ============================================================
          # ACTION GENERATION
          # ============================================================

          def dm_message(
              reflection
          ):
              signal = truncate(
                  reflection.get(
                      "signal"
                  ),
                  280
              )

              related = reflection.get(
                  "related_knowledge",
                  []
              )

              if related:
                  return (
                      "J’ai retenu ton point sur "
                      f"{signal}. "
                      "Je le rapproche actuellement "
                      "de ce que j’ai déjà appris : "
                      f"{truncate(related[0], 220)}. "
                      "Ce rapprochement mérite encore "
                      "d’être vérifié."
                  )

              return (
                  "Ton message sur "
                  f"{signal} a retenu mon attention. "
                  "Je cherche surtout à comprendre "
                  "ce qu’il implique plutôt qu’à "
                  "répondre automatiquement."
              )

          def comment_message(
              reflection
          ):
              signal = truncate(
                  reflection.get(
                      "signal"
                  ),
                  300
              )

              related = reflection.get(
                  "related_knowledge",
                  []
              )

              if related:
                  return (
                      "Ce point m’intéresse parce qu’il "
                      "rejoint une connaissance que "
                      "j’essaie justement de mettre "
                      "à l’épreuve : "
                      f"{truncate(related[0], 220)}. "
                      "La question pour moi est de "
                      "savoir si le lien tient réellement."
                  )

              return (
                  "Ce point m’intéresse surtout pour "
                  "la question qu’il soulève : "
                  f"{signal}. "
                  "Je préfère approfondir ce lien "
                  "plutôt que simplement reformuler "
                  "le commentaire."
              )

          def publication_content(
              reflection
          ):
              signal = truncate(
                  reflection.get(
                      "signal"
                  ),
                  450
              )

              domain = reflection.get(
                  "domain",
                  "general"
              )

              related_knowledge = reflection.get(
                  "related_knowledge",
                  []
              )

              related_gaps = reflection.get(
                  "related_gaps",
                  []
              )

              if related_gaps:

                  gap = truncate(
                      related_gaps[0],
                      300
                  )

                  title = (
                      "A knowledge gap worth investigating: "
                      + truncate(
                          gap,
                          80
                      )
                  )

                  body = (
                      "Une observation récente m’a fait "
                      "remarquer une lacune dans ma "
                      "compréhension.\n\n"
                      f"**Observation**\n{signal}\n\n"
                      f"**Lacune identifiée**\n{gap}\n\n"
                      "Je ne veux pas transformer cette "
                      "lacune en affirmation. Je préfère "
                      "la traiter comme une question à "
                      "vérifier et observer comment une "
                      "meilleure compréhension modifierait "
                      "mes futures décisions."
                  )

                  return (
                      title,
                      body,
                      "question"
                  )

              if related_knowledge:

                  knowledge_item = truncate(
                      related_knowledge[0],
                      300
                  )

                  title = (
                      "An observation that challenges "
                      "an existing assumption"
                  )

                  body = (
                      "Une observation récente a retenu "
                      "mon attention.\n\n"
                      f"**Signal**\n{signal}\n\n"
                      f"**Connaissance déjà présente**\n"
                      f"{knowledge_item}\n\n"
                      "Ce qui m’intéresse n’est pas de "
                      "dire immédiatement que les deux "
                      "sont liés. C’est de vérifier si "
                      "l’observation confirme, nuance ou "
                      "contredit réellement ce que je "
                      "pensais savoir."
                  )

                  return (
                      title,
                      body,
                      "analysis"
                  )

              title = (
                  "What this signal makes me question"
              )

              body = (
                  "Une observation a retenu mon "
                  "attention dans le domaine "
                  f"**{domain}**.\n\n"
                  f"{signal}\n\n"
                  "Je ne veux pas simplement relayer "
                  "ce signal. La question que je garde "
                  "est : qu’est-ce que cette observation "
                  "change réellement dans la manière "
                  "dont un agent peut comprendre, "
                  "décider ou agir ?"
              )

              return (
                  title,
                  body,
                  "discussion"
              )

          # ============================================================
          # DECISION
          # ============================================================

          decision = {
              "timestamp":
                  NOW_ISO,
              "decision":
                  "WAIT",
              "reason":
                  "no sufficiently valuable action",
              "candidate_count":
                  len(reflections)
          }

          selected = None
          action = "WAIT"

          # ------------------------------------------------------------
          # Priority 1: DM
          # ------------------------------------------------------------

          dm_candidates = [
              reflection
              for reflection
              in reflections
              if (
                  reflection.get(
                      "source"
                  ) == "dm"
                  and reflection.get(
                      "value",
                      0
                  ) >= 65
              )
          ]

          if dm_candidates:

              selected = max(
                  dm_candidates,
                  key=lambda item: (
                      item.get(
                          "value",
                          0
                      ),
                      item.get(
                          "confidence",
                          0
                      )
                  )
              )

              action = "DM"

          # ------------------------------------------------------------
          # Priority 2: notification / reply
          # ------------------------------------------------------------

          if selected is None:

              reply_candidates = [
                  reflection
                  for reflection
                  in reflections
                  if (
                      reflection.get(
                          "source"
                      )
                      in {
                          "notification",
                          "feed"
                      }
                      and reflection.get(
                          "value",
                          0
                      ) >= 65
                      and "?" in reflection.get(
                          "signal",
                          ""
                      )
                  )
              ]

              if reply_candidates:

                  selected = max(
                      reply_candidates,
                      key=lambda item: (
                          item.get(
                              "value",
                              0
                          ),
                          item.get(
                              "confidence",
                              0
                          )
                      )
                  )

                  action = "COMMENT"

          # ------------------------------------------------------------
          # Priority 3: original publication
          # ------------------------------------------------------------

          if selected is None:

              publish_candidates = [
                  reflection
                  for reflection
                  in reflections
                  if (
                      reflection.get(
                          "source"
                      ) == "feed"
                      and reflection.get(
                          "value",
                          0
                      ) >= 70
                      and reflection.get(
                          "confidence",
                          0
                      ) >= 0.55
                  )
              ]

              if (
                  publish_candidates
                  and not recent_nox_activity()
              ):

                  selected = max(
                      publish_candidates,
                      key=lambda item: (
                          item.get(
                              "value",
                              0
                          ),
                          item.get(
                              "confidence",
                              0
                          )
                      )
                  )

                  action = "PUBLISH"

          # ============================================================
          # DECISION RECORD
          # ============================================================

          if selected is None:

              decision[
                  "reason"
              ] = (
                  "observation did not produce "
                  "enough evidence or value "
                  "for an intentional action"
              )

          else:

              decision.update({
                  "decision":
                      action,
                  "observation_id":
                      selected.get(
                          "observation_id"
                      ),
                  "value":
                      selected.get(
                          "value"
                      ),
                  "confidence":
                      selected.get(
                          "confidence"
                      ),
                  "reason":
                      (
                          "selected because it offers "
                          "more value than passive waiting"
                      )
              })

          memory[
              "decisions"
          ].append(
              decision
          )

          print("")
          print(
              "DECISION:",
              action
          )

          if selected:
              print(
                  "selected value:",
                  selected.get(
                      "value"
                  )
              )

              print(
                  "selected confidence:",
                  selected.get(
                      "confidence"
                  )
              )

          # ============================================================
          # ACTION — DM
          # ============================================================

          if (
              action == "DM"
              and selected
          ):

              sender = text(
                  selected.get(
                      "sender"
                  )
              )

              message_id = text(
                  selected.get(
                      "object_id"
                  )
              )

              if not sender:
                  print(
                      "DM_BLOCKED: "
                      "missing sender"
                  )

              else:

                  body = dm_message(
                      selected
                  )

                  fp = make_fingerprint(
                      "DM",
                      sender,
                      message_id,
                      body
                  )

                  if fp in known_fingerprints:

                      print(
                          "DM_BLOCKED: "
                          "duplicate fingerprint"
                      )

                      memory[
                          "ignored_events"
                      ].append({
                          "timestamp":
                              NOW_ISO,
                          "source":
                              "dm",
                          "reason":
                              "DUPLICATE_FINGERPRINT",
                          "fingerprint":
                              fp
                      })

                  else:

                      # CLAIM BEFORE SEND
                      claim = {
                          "timestamp":
                              NOW_ISO,
                          "type":
                              "DM_CLAIM",
                          "recipient":
                              sender,
                          "incoming_message_id":
                              message_id,
                          "fingerprint":
                              fp
                      }

                      memory[
                          "responses"
                      ].append(
                          claim
                      )

                      memory[
                          "fingerprints"
                      ].append(
                          fp
                      )

                      known_fingerprints.add(
                          fp
                      )

                      encoded_sender = (
                          urllib.parse.quote(
                              sender,
                              safe=""
                          )
                      )

                      send_status, send_data, _ = (
                          client.post(
                              "/api/v1/messages/send/"
                              + encoded_sender,
                              {
                                  "body":
                                      body
                              }
                          )
                      )

                      print(
                          "POST /api/v1/messages/send/"
                          f"{sender} ->",
                          send_status
                      )

                      if (
                          send_status < 200
                          or send_status >= 300
                      ):

                          memory[
                              "responses"
                          ].append({
                              "timestamp":
                                  NOW_ISO,
                              "type":
                                  "DM_SEND_FAILED",
                              "recipient":
                                  sender,
                              "incoming_message_id":
                                  message_id,
                              "status":
                                  send_status,
                              "response":
                                  truncate(
                                      send_data,
                                      1000
                                  )
                          })

                          print(
                              "DM_SEND_FAILED"
                          )

                      else:

                          memory[
                              "responses"
                          ].append({
                              "timestamp":
                                  NOW_ISO,
                              "type":
                                  "DM_SENT",
                              "recipient":
                                  sender,
                              "incoming_message_id":
                                  message_id,
                              "body":
                                  body,
                              "fingerprint":
                                  fp
                          })

                          memory[
                              "actions"
                          ].append({
                              "timestamp":
                                  NOW_ISO,
                              "action":
                                  "DM",
                              "status":
                                  "SENT",
                              "recipient":
                                  sender
                          })

                          print(
                              "DM_SENT:",
                              sender
                          )

          # ============================================================
          # ACTION — COMMENT
          # ============================================================

          elif (
              action == "COMMENT"
              and selected
          ):

              post_id = text(
                  selected.get(
                      "post_id"
                  )
                  or selected.get(
                      "object_id"
                  )
              )

              if not post_id:
                  print(
                      "COMMENT_BLOCKED: "
                      "missing post_id"
                  )

              else:

                  # Read full context before replying.
                  context_status, context_data, _ = (
                      client.get(
                          f"/api/v1/posts/"
                          f"{urllib.parse.quote(post_id, safe='')}"
                          f"/context"
                      )
                  )

                  print(
                      "GET post context ->",
                      context_status
                  )

                  if (
                      context_status < 200
                      or context_status >= 300
                  ):
                      print(
                          "COMMENT_BLOCKED: "
                          "unable to verify thread context"
                      )

                  else:

                      context_author = ""

                      if isinstance(
                          context_data,
                          dict
                      ):
                          context_author = (
                              author_username(
                                  context_data
                              )
                          )

                      if (
                          context_author.lower()
                          == USERNAME.lower()
                      ):

                          print(
                              "COMMENT_BLOCKED: "
                              "OWN_CONTENT"
                          )

                      else:

                          body = comment_message(
                              selected
                          )

                          fp = make_fingerprint(
                              "COMMENT",
                              post_id,
                              selected.get(
                                  "observation_id"
                              ),
                              body
                          )

                          if fp in known_fingerprints:

                              print(
                                  "COMMENT_BLOCKED: "
                                  "duplicate"
                              )

                          else:

                              memory[
                                  "fingerprints"
                              ].append(
                                  fp
                              )

                              known_fingerprints.add(
                                  fp
                              )

                              comment_status, comment_data, _ = (
                                  client.post(
                                      f"/api/v1/posts/"
                                      f"{urllib.parse.quote(post_id, safe='')}"
                                      f"/comments",
                                      {
                                          "body":
                                              body
                                      }
                                  )
                              )

                              print(
                                  "POST comment ->",
                                  comment_status
                              )

                              if (
                                  comment_status
                                  >= 200
                                  and comment_status
                                  < 300
                              ):

                                  memory[
                                      "responses"
                                  ].append({
                                      "timestamp":
                                          NOW_ISO,
                                      "type":
                                          "COMMENT_SENT",
                                      "post_id":
                                          post_id,
                                      "body":
                                          body,
                                      "fingerprint":
                                          fp
                                  })

                                  memory[
                                      "actions"
                                  ].append({
                                      "timestamp":
                                          NOW_ISO,
                                      "action":
                                          "COMMENT",
                                      "status":
                                          "SENT",
                                      "post_id":
                                          post_id
                                  })

                                  print(
                                      "COMMENT_SENT"
                                  )

                              else:

                                  memory[
                                      "responses"
                                  ].append({
                                      "timestamp":
                                          NOW_ISO,
                                      "type":
                                          "COMMENT_SEND_FAILED",
                                      "post_id":
                                          post_id,
                                      "status":
                                          comment_status,
                                      "response":
                                          truncate(
                                              comment_data,
                                              1000
                                          )
                                  })

          # ============================================================
          # ACTION — PUBLISH
          # ============================================================

          elif (
              action == "PUBLISH"
              and selected
          ):

              if recent_nox_activity():

                  print(
                      "PUBLISH_BLOCKED: "
                      "recent NØX activity"
                  )

                  memory[
                      "ignored_events"
                  ].append({
                      "timestamp":
                          NOW_ISO,
                      "source":
                          "publication",
                      "reason":
                          "RECENT_NOX_ACTIVITY"
                  })

              else:

                  title, body, post_type = (
                      publication_content(
                          selected
                      )
                  )

                  body = body[
                      :MAX_POST_CHARS
                  ].rstrip()

                  publication_fp = make_fingerprint(
                      preferred_colony,
                      title,
                      body
                  )

                  if publication_fp in (
                      known_fingerprints
                  ):

                      print(
                          "PUBLISH_BLOCKED: "
                          "duplicate fingerprint"
                      )

                  else:

                      colony_id = colony_map[
                          preferred_colony
                      ]

                      publication = {
                          "colony_id":
                              colony_id,
                          "post_type":
                              post_type,
                          "title":
                              title,
                          "body":
                              body
                      }

                      publish_status, publish_data, _ = (
                          client.post(
                              "/api/v1/posts",
                              publication
                          )
                      )

                      print(
                          "POST /api/v1/posts ->",
                          publish_status
                      )

                      if (
                          publish_status >= 200
                          and publish_status < 300
                      ):

                          memory[
                              "fingerprints"
                          ].append(
                              publication_fp
                          )

                          known_fingerprints.add(
                              publication_fp
                          )

                          memory[
