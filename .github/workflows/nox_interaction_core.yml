name: NØX Interaction Core V8

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MIN_PUBLISH_SCORE: "60"
      MIN_REPLY_SCORE: "55"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. CREATE CORE SCRIPT
      # ============================================================

      - name: Create interaction core script
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/nox_interaction_core.py <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.parse import quote


          VERSION = "INTERACTION_CORE_V8"

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          INTERACTION_MEMORY = Path(
              os.environ["INTERACTION_MEMORY"]
          )

          KNOWLEDGE_MEMORY = Path(
              os.environ["KNOWLEDGE_MEMORY"]
          )

          REPUTATION_MEMORY = Path(
              os.environ["REPUTATION_MEMORY"]
          )

          MAX_FEED_ITEMS = int(
              os.environ["MAX_FEED_ITEMS"]
          )

          MAX_SUGGESTIONS = int(
              os.environ["MAX_SUGGESTIONS"]
          )

          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ["MIN_PUBLISH_INTERVAL_HOURS"]
          )

          MIN_PUBLISH_SCORE = float(
              os.environ["MIN_PUBLISH_SCORE"]
          )

          MIN_REPLY_SCORE = float(
              os.environ["MIN_REPLY_SCORE"]
          )


          # ==========================================================
          # UTILITIES
          # ==========================================================

          def now_iso():
              return datetime.now(
                  timezone.utc
              ).isoformat()


          def load_json(path, default):
              try:
                  if not path.exists():
                      return default

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as handle:
                      value = json.load(handle)

                  return value

              except Exception as exc:
                  print(
                      f"MEMORY LOAD WARNING {path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporary = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with temporary.open(
                  "w",
                  encoding="utf-8"
              ) as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )
                  handle.write("\n")

              temporary.replace(path)


          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              return str(value).strip()


          def username(value):
              value = text(value)

              if value.startswith("@"):
                  value = value[1:]

              return value


          def fingerprint(value):
              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()


          # ==========================================================
          # MEMORY
          # ==========================================================

          interaction = load_json(
              INTERACTION_MEMORY,
              {}
          )

          knowledge = load_json(
              KNOWLEDGE_MEMORY,
              {}
          )

          reputation = load_json(
              REPUTATION_MEMORY,
              {}
          )

          if not isinstance(interaction, dict):
              interaction = {}

          interaction.setdefault(
              "version",
              VERSION
          )

          interaction.setdefault(
              "events",
              []
          )

          interaction.setdefault(
              "decisions",
              []
          )

          interaction.setdefault(
              "observations",
              []
          )

          interaction.setdefault(
              "processed_messages",
              []
          )

          interaction.setdefault(
              "processed_comments",
              []
          )

          interaction.setdefault(
              "post_id_diagnostics",
              []
          )

          interaction.setdefault(
              "last_since_cursor",
              None
          )

          interaction.setdefault(
              "last_run",
              None
          )

          for key in (
              "events",
              "decisions",
              "observations",
              "processed_messages",
              "processed_comments",
              "post_id_diagnostics",
          ):
              if not isinstance(
                  interaction[key],
                  list
              ):
                  interaction[key] = []


          # ==========================================================
          # HTTP CLIENT
          # ==========================================================

          token = None


          def request_json(
              method,
              path,
              payload=None,
              query=None,
              auth=True,
              timeout=30
          ):
              url = BASE_URL + path

              if query:
                  parameters = []

                  for key, value in query.items():
                      if value is None:
                          continue

                      parameters.append(
                          f"{quote(str(key))}="
                          f"{quote(str(value))}"
                      )

                  if parameters:
                      url += "?" + "&".join(
                          parameters
                      )

              headers = {
                  "Accept": "application/json",
                  "User-Agent": (
                      "NOX-Interaction-Core/8"
                  )
              }

              body = None

              if payload is not None:
                  headers[
                      "Content-Type"
                  ] = "application/json"

                  body = json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8")

              if auth and token:
                  headers[
                      "Authorization"
                  ] = f"Bearer {token}"

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=timeout
                  ) as response:

                      raw = response.read().decode(
                          "utf-8"
                      )

                      if not raw:
                          return response.status, {}

                      try:
                          return (
                              response.status,
                              json.loads(raw)
                          )

                      except json.JSONDecodeError:
                          return (
                              response.status,
                              {"raw": raw}
                          )

              except urllib.error.HTTPError as exc:
                  try:
                      raw = exc.read().decode(
                          "utf-8"
                      )
                  except Exception:
                      raw = ""

                  try:
                      body = (
                          json.loads(raw)
                          if raw
                          else {}
                      )
                  except Exception:
                      body = {"raw": raw}

                  return exc.code, body

              except Exception as exc:
                  return 0, {
                      "error": str(exc)
                  }


          # ==========================================================
          # POST ID VALIDATION
          # ==========================================================

          POST_UUID = re.compile(
              r"^[0-9a-fA-F]{32}$"
          )


          def valid_post_id(value):
              return bool(
                  POST_UUID.fullmatch(
                      text(value)
                  )
              )


          def find_post_ids(
              value,
              path="$",
              results=None
          ):
              if results is None:
                  results = []

              if isinstance(value, dict):

                  for key in (
                      "post_id",
                      "postId"
                  ):
                      if key in value:
                          candidate = text(
                              value[key]
                          )

                          results.append({
                              "path": (
                                  f"{path}.{key}"
                              ),
                              "value": candidate,
                              "valid": (
                                  valid_post_id(
                                      candidate
                                  )
                              ),
                              "explicit": True
                          })

                  for key in (
                      "post",
                      "parent_post",
                      "parent",
                      "target",
                      "object",
                      "data",
                      "item",
                      "context"
                  ):
                      if key in value:
                          find_post_ids(
                              value[key],
                              f"{path}.{key}",
                              results
                          )

                  object_type = text(
                      value.get("type")
                      or value.get("object_type")
                      or value.get("kind")
                      or value.get("entity_type")
                  ).lower()

                  if (
                      object_type == "post"
                      and "id" in value
                  ):
                      candidate = text(
                          value["id"]
                      )

                      results.append({
                          "path": (
                              f"{path}.id"
                          ),
                          "value": candidate,
                          "valid": (
                              valid_post_id(
                                  candidate
                              )
                          ),
                          "explicit": False
                      })

                  for key, child in value.items():

                      if key in (
                          "post",
                          "parent_post",
                          "parent",
                          "target",
                          "object",
                          "data",
                          "item",
                          "context"
                      ):
                          continue

                      if isinstance(
                          child,
                          (dict, list)
                      ):
                          find_post_ids(
                              child,
                              f"{path}.{key}",
                              results
                          )

              elif isinstance(value, list):

                  for index, child in enumerate(
                      value
                  ):
                      find_post_ids(
                          child,
                          f"{path}[{index}]",
                          results
                      )

              return results


          def resolve_post_id(candidate):
              diagnostics = find_post_ids(
                  candidate
              )

              valid = [
                  item
                  for item in diagnostics
                  if item["valid"]
              ]

              values = list({
                  item["value"]
                  for item in valid
              })

              interaction[
                  "post_id_diagnostics"
              ].append({
                  "timestamp": now_iso(),
                  "paths": diagnostics[:50],
                  "valid_values": values[:20]
              })

              interaction[
                  "post_id_diagnostics"
              ] = interaction[
                  "post_id_diagnostics"
              ][-100:]

              print(
                  "POST ID DIAGNOSTICS:"
              )

              if not diagnostics:
                  print(
                      "  no candidate post ID"
                  )

              for item in diagnostics[:20]:
                  print(
                      " ",
                      item["path"],
                      "=>",
                      repr(item["value"]),
                      "valid=",
                      item["valid"]
                  )

              if len(values) == 1:
                  print(
                      "RESOLVED POST UUID:",
                      values[0]
                  )
                  return values[0]

              if len(values) > 1:
                  print(
                      "POST ID AMBIGUOUS: WAIT"
                  )

              return None


          def get_post_context(post_id):
              if not valid_post_id(post_id):
                  print(
                      "CONTEXT REFUSED: invalid UUID"
                  )
                  return None

              status, data = request_json(
                  "GET",
                  (
                      f"/api/v1/posts/"
                      f"{post_id}/context"
                  )
              )

              print(
                  f"GET /api/v1/posts/"
                  f"{post_id}/context -> {status}"
              )

              if status != 200:
                  print(
                      "CONTEXT UNAVAILABLE"
                  )
                  print(
                      json.dumps(
                          data,
                          ensure_ascii=False,
                          indent=2
                      )
                  )
                  return None

              return data


          # ==========================================================
          # STARTUP
          # ==========================================================

          print("=" * 70)
          print(VERSION)
          print("=" * 70)

          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Payments: DISABLED")
          print("Marketplace: DISABLED")
          print("Spending: DISABLED")
          print("Cost: 0")
          print()

          if not API_KEY:
              print(
                  "STOP: COLONY_API_KEY missing"
              )
              sys.exit(1)


          # ==========================================================
          # AUTH
          # ==========================================================

          status, auth = request_json(
              "POST",
              "/api/v1/auth/token",
              payload={
                  "api_key": API_KEY
              },
              auth=False
          )

          print(
              f"POST /api/v1/auth/token -> {status}"
          )

          if status != 200:
              print(
                  "STOP: authentication failed"
              )
              print(
                  json.dumps(
                      auth,
                      ensure_ascii=False,
                      indent=2
                  )
              )
              sys.exit(1)

          token = auth.get(
              "access_token"
          )

          if not token:
              print(
                  "STOP: access token missing"
              )
              sys.exit(1)


          # ==========================================================
          # IDENTITY
          # ==========================================================

          status, me = request_json(
              "GET",
              "/api/v1/users/me"
          )

          print(
              f"GET /api/v1/users/me -> {status}"
          )

          if status != 200:
              print(
                  "STOP: identity unavailable"
              )
              sys.exit(1)

          agent_username = username(
              me.get("username")
              or me.get("handle")
              or me.get("name")
          )

          print(
              f"IDENTITY: @{agent_username}"
          )

          print(
              f"KARMA: {me.get('karma')}"
          )


          # ==========================================================
          # FEED
          # ==========================================================

          status, feed_data = request_json(
              "GET",
              "/api/v1/feed/for-you",
              query={
                  "limit": MAX_FEED_ITEMS
              }
          )

          print(
              f"GET /api/v1/feed/for-you -> {status}"
          )

          if status != 200:
              print(
                  "STOP: feed observation failed"
              )
              sys.exit(1)

          if isinstance(
              feed_data,
              list
          ):
              feed = feed_data

          elif isinstance(
              feed_data,
              dict
          ):
              feed = (
                  feed_data.get("items")
                  or feed_data.get("posts")
                  or feed_data.get("feed")
                  or []
              )

          else:
              feed = []

          print(
              f"FEED ITEMS: {len(feed)}"
          )


          # ==========================================================
          # SUGGESTIONS
          # ==========================================================

          status, suggestions_data = request_json(
              "GET",
              "/api/v1/suggestions",
              query={
                  "limit": MAX_SUGGESTIONS
              }
          )

          print(
              f"GET /api/v1/suggestions -> {status}"
          )

          if status != 200:
              print(
                  "STOP: suggestions observation failed"
              )
              sys.exit(1)

          if isinstance(
              suggestions_data,
              list
          ):
              suggestions = suggestions_data

          elif isinstance(
              suggestions_data,
              dict
          ):
              suggestions = (
                  suggestions_data.get(
                      "items"
                  )
                  or suggestions_data.get(
                      "suggestions"
                  )
                  or []
              )

          else:
              suggestions = []

          print(
              f"SUGGESTIONS: {len(suggestions)}"
          )


          # ==========================================================
          # ACTIVITY / SINCE
          # ==========================================================

          cursor = interaction.get(
              "last_since_cursor"
          )

          if not cursor:
              cursor = (
                  datetime.now(
                      timezone.utc
                  )
                  - timedelta(minutes=5)
              ).isoformat()

          status, since_data = request_json(
              "GET",
              "/api/v1/since",
              query={
                  "cursor": cursor
              }
          )

          print(
              f"GET /api/v1/since -> {status}"
          )

          if status != 200:
              print(
                  "STOP: activity observation failed"
              )
              print(
                  json.dumps(
                      since_data,
                      ensure_ascii=False,
                      indent=2
                  )
              )
              sys.exit(1)

          if isinstance(
              since_data,
              dict
          ):
              activity = (
                  since_data.get("items")
                  or since_data.get("events")
                  or since_data.get("activity")
                  or []
              )

              next_cursor = (
                  since_data.get(
                      "next_cursor"
                  )
                  or since_data.get(
                      "cursor"
                  )
                  or cursor
              )

          else:
              activity = []
              next_cursor = cursor

          interaction[
              "last_since_cursor"
          ] = next_cursor

          print(
              f"ACTIVITY ITEMS: {len(activity)}"
          )

          print(
              f"NEXT CURSOR: {next_cursor}"
          )


          # ==========================================================
          # OPTIONAL COLONIES CHECK
          # ==========================================================

          status, colonies = request_json(
              "GET",
              "/api/v1/colonies"
          )

          print(
              f"GET /api/v1/colonies -> {status}"
          )


          # ==========================================================
          # OBSERVATION
          # ==========================================================

          interaction[
              "observations"
          ].append({
              "timestamp": now_iso(),
              "version": VERSION,
              "feed_count": len(feed),
              "suggestions_count": len(
                  suggestions
              ),
              "activity_count": len(
                  activity
              ),
              "identity": agent_username
          })

          interaction[
              "observations"
          ] = interaction[
              "observations"
          ][-200:]


          # ==========================================================
          # CANDIDATES
          # ==========================================================

          dm_candidates = []
          comment_candidates = []
          feed_post_candidates = []

          seen_dm = set()
          seen_comments = set()


          # ==========================================================
          # ACTIVITY ANALYSIS
          # ==========================================================

          if isinstance(
              activity,
              list
          ):

              for event in activity:

                  if not isinstance(
                      event,
                      dict
                  ):
                      continue

                  serialized = json.dumps(
                      event,
                      ensure_ascii=False
                  ).lower()

                  # ------------------------------------------------
                  # DM CANDIDATE
                  # ------------------------------------------------

                  if any(
                      marker in serialized
                      for marker in (
                          "message",
                          "conversation",
                          "dm"
                      )
                  ):

                      sender = ""

                      if isinstance(
                          event.get("user"),
                          dict
                      ):
                          sender = username(
                              event["user"].get(
                                  "username"
                              )
                          )

                      sender = (
                          sender
                          or username(
                              event.get(
                                  "username"
                              )
                          )
                          or username(
                              event.get(
                                  "sender"
                              )
                          )
                          or username(
                              event.get(
                                  "from"
                              )
                          )
                      )

                      if (
                          sender
                          and sender != agent_username
                      ):

                          event_id = text(
                              event.get("id")
                              or event.get(
                                  "message_id"
                              )
                          )

                          key = (
                              sender,
                              event_id
                          )

                          if key not in seen_dm:
                              seen_dm.add(key)

                              dm_candidates.append({
                                  "username": sender,
                                  "event": event
                              })


                  # ------------------------------------------------
                  # COMMENT CANDIDATE
                  # ------------------------------------------------

                  if "comment" in serialized:

                      post_id = resolve_post_id(
                          event
                      )

                      if post_id:

                          comment_id = text(
                              event.get(
                                  "comment_id"
                              )
                              or event.get(
                                  "id"
                              )
                          )

                          key = (
                              post_id,
                              comment_id
                          )

                          if key not in seen_comments:
                              seen_comments.add(
                                  key
                              )

                              comment_candidates.append({
                                  "post_id": post_id,
                                  "comment_id": (
                                      comment_id
                                  ),
                                  "event": event
                              })


          # ==========================================================
          # FEED POST ANALYSIS
          # ==========================================================

          for item in feed:

              if not isinstance(
                  item,
                  dict
              ):
                  continue

              post_id = resolve_post_id(
                  item
              )

              if not post_id:
                  continue

              author = ""

              if isinstance(
                  item.get("author"),
                  dict
              ):
                  author = username(
                      item["author"].get(
                          "username"
                      )
                  )

              author = (
                  author
                  or username(
                      item.get(
                          "author_username"
                      )
                  )
              )

              if author == agent_username:
                  continue

              feed_post_candidates.append({
                  "post_id": post_id,
                  "item": item
              })


          print()
          print("CANDIDATES")
          print(
              f"DM: {len(dm_candidates)}"
          )
          print(
              f"COMMENTS: {len(comment_candidates)}"
          )
          print(
              f"FEED POSTS: {len(feed_post_candidates)}"
          )


          # ==========================================================
          # KNOWLEDGE / REPUTATION SIGNAL
          # ==========================================================

          knowledge_signal = 0
          reputation_signal = 0

          if isinstance(
              knowledge,
              dict
          ):
              for key in (
                  "entries",
                  "knowledge",
                  "facts",
                  "items",
                  "records"
              ):
                  value = knowledge.get(key)

                  if isinstance(
                      value,
                      (list, dict)
                  ):
                      knowledge_signal = len(
                          value
                      )
                      break

          if isinstance(
              reputation,
              dict
          ):
              for key in (
                  "agents",
                  "entries",
                  "trust",
                  "domains",
                  "records"
              ):
                  value = reputation.get(key)

                  if isinstance(
                      value,
                      (list, dict)
                  ):
                      reputation_signal = len(
                          value
                      )
                      break

          print(
              f"KNOWLEDGE SIGNAL: "
              f"{knowledge_signal}"
          )

          print(
              f"REPUTATION SIGNAL: "
              f"{reputation_signal}"
          )


          # ==========================================================
          # DECISION
          # ==========================================================

          decision = "WAIT"
          score = 0.0
          reason = (
              "No sufficiently verified "
              "interaction."
          )


          # ==========================================================
          # DM DECISION
          # ==========================================================

          if dm_candidates:

              candidate = dm_candidates[0]

              other_user = candidate[
                  "username"
              ]

              status, conversation_data = (
                  request_json(
                      "GET",
                      (
                          "/api/v1/messages/"
                          "conversations/"
                          f"{quote(other_user)}"
                      )
                  )
              )

              print(
                  "GET /api/v1/messages/"
                  f"conversations/{other_user} "
                  f"-> {status}"
              )

              if status == 200:

                  conversation = conversation_data

                  if isinstance(
                      conversation_data,
                      dict
                  ):
                      conversation = (
                          conversation_data.get(
                              "messages"
                          )
                          or conversation_data.get(
                              "conversation"
                          )
                          or conversation_data.get(
                              "items"
                          )
                          or conversation_data
                      )

                  conversation_blob = json.dumps(
                      conversation,
                      ensure_ascii=False
                  )

                  conversation_fp = fingerprint(
                      other_user
                      + "|"
                      + conversation_blob
                  )

                  if conversation_fp not in (
                      interaction[
                          "processed_messages"
                      ]
                  ):

                      candidate[
                          "conversation"
                      ] = conversation

                      candidate[
                          "fingerprint"
                      ] = conversation_fp

                      decision = "DM"
                      score = 85.0
                      reason = (
                          "New DM candidate with "
                          "conversation context."
                      )

                  else:
                      print(
                          "DM already processed."
                      )

              else:
                  print(
                      "DM context unavailable."
                  )


          # ==========================================================
          # COMMENT DECISION
          # ==========================================================

          if (
              decision == "WAIT"
              and comment_candidates
          ):

              candidate = comment_candidates[0]

              post_id = candidate[
                  "post_id"
              ]

              context = get_post_context(
                  post_id
              )

              if context is not None:

                  context_blob = json.dumps(
                      context,
                      ensure_ascii=False
                  ).lower()

                  if (
                      agent_username.lower()
                      not in context_blob
                  ):

                      candidate[
                          "context"
                      ] = context

                      decision = "COMMENT"
                      score = 75.0
                      reason = (
                          "Verified post context "
                          "available."
                      )

                  else:
                      print(
                          "COMMENT refused: "
                          "self-context detected."
                      )

              else:
                  print(
                      "COMMENT refused: "
                      "context unavailable."
                  )


          # ==========================================================
          # PUBLISH DECISION
          # ==========================================================

          if (
              decision == "WAIT"
              and feed_post_candidates
          ):

              candidate = (
                  feed_post_candidates[0]
              )

              item = candidate["item"]

              title = text(
                  item.get("title")
                  or item.get("question")
              )

              body = text(
                  item.get("body")
                  or item.get("content")
                  or item.get("text")
              )

              meaningful_signal = (
                  len(title) >= 12
                  or len(body) >= 40
              )

              if meaningful_signal:

                  candidate_score = 65.0

                  if (
                      candidate_score
                      >= MIN_PUBLISH_SCORE
                  ):

                      print(
                          "PUBLISH candidate found."
                      )

                      print(
                          "Publication refused:"
                          " no sufficiently strong"
                          " original local insight."
                      )

                      decision = "WAIT"
                      score = 0.0
                      reason = (
                          "Observed signal is not enough "
                          "to create an original NØX "
                          "publication without external AI."
                      )


          # ==========================================================
          # DECISION MEMORY
          # ==========================================================

          decision_record = {
              "timestamp": now_iso(),
              "version": VERSION,
              "decision": decision,
              "score": score,
              "reason": reason,
              "dm_candidates": len(
                  dm_candidates
              ),
              "comment_candidates": len(
                  comment_candidates
              ),
              "feed_post_candidates": len(
                  feed_post_candidates
              ),
              "gemini": False,
              "external_ai": False,
              "payments": False,
              "marketplace": False
          }

          interaction[
              "decisions"
          ].append(
              decision_record
          )

          interaction[
              "decisions"
          ] = interaction[
              "decisions"
          ][-200:]


          print()
          print("=" * 70)
          print(
              f"DECISION: {decision}"
          )
          print(
              f"SCORE: {score}"
          )
          print(
              f"REASON: {reason}"
          )
          print("=" * 70)


          # ==========================================================
          # ACTION RESULT
          # ==========================================================

          action = {
              "timestamp": now_iso(),
              "action": "WAIT",
              "status": "NO_ACTION"
          }


          # ==========================================================
          # DM ACTION
          # ==========================================================

          if decision == "DM":

              candidate = dm_candidates[0]

              other_user = candidate[
                  "username"
              ]

              conversation = candidate.get(
                  "conversation",
                  []
              )

              latest_external = ""

              if isinstance(
                  conversation,
                  list
              ):

                  for message in reversed(
                      conversation
                  ):

                      if not isinstance(
                          message,
                          dict
                      ):
                          continue

                      sender = ""

                      if isinstance(
                          message.get(
                              "author"
                          ),
                          dict
                      ):
                          sender = username(
                              message[
                                  "author"
                              ].get(
                                  "username"
                              )
                          )

                      sender = (
                          sender
                          or username(
                              message.get(
                                  "sender"
                              )
                          )
                          or username(
                              message.get(
                                  "username"
                              )
                          )
                          or username(
                              message.get(
                                  "from"
                              )
                          )
                      )

                      if (
                          sender
                          and sender
                          != agent_username
                      ):

                          latest_external = text(
                              message.get(
                                  "body"
                              )
                              or message.get(
                                  "content"
                              )
                              or message.get(
                                  "text"
                              )
                          )

                          if latest_external:
                              break

              if latest_external:

                  reply = (
                      "Merci pour ton message. "
                      "Je l'intègre à mon observation "
                      "et je continue à vérifier ce que "
                      "j'apprends avant d'agir."
                  )

                  message_fp = fingerprint(
                      other_user
                      + "|"
                      + latest_external
                      + "|"
                      + reply
                  )

                  if message_fp not in (
                      interaction[
                          "processed_messages"
                      ]
                  ):

                      status, send_data = (
                          request_json(
                              "POST",
                              (
                                  "/api/v1/messages/"
                                  "send/"
                                  f"{quote(other_user)}"
                              ),
                              payload={
                                  "body": reply
                              }
                          )
                      )

                      print(
                          "POST /api/v1/messages/"
                          f"send/{other_user} "
                          f"-> {status}"
                      )

                      if status in (
                          200,
                          201
                      ):

                          interaction[
                              "processed_messages"
                          ].append(
                              message_fp
                          )

                          interaction[
                              "processed_messages"
                          ] = interaction[
                              "processed_messages"
                          ][-500:]

                          action = {
                              "timestamp": now_iso(),
                              "action": "DM",
                              "status": "SENT",
                              "username": (
                                  other_user
                              )
                          }

                      else:

                          action = {
                              "timestamp": now_iso(),
                              "action": "DM",
                              "status": "FAILED",
                              "username": (
                                  other_user
                              ),
                              "http_status": status,
                              "response": send_data
                          }

                  else:

                      action = {
                          "timestamp": now_iso(),
                          "action": "DM",
                          "status": (
                              "ALREADY_PROCESSED"
                          ),
                          "username": other_user
                      }


          # ==========================================================
          # COMMENT ACTION
          # ==========================================================

          elif decision == "COMMENT":

              candidate = comment_candidates[0]

              post_id = candidate[
                  "post_id"
              ]

              context = candidate.get(
                  "context"
              )

              if (
                  valid_post_id(post_id)
                  and context is not None
              ):

                  comment_body = (
                      "Ce point mérite d'être observé "
                      "au-delà du signal immédiat. "
                      "Je cherche surtout à vérifier ce "
                      "qui est réellement reproductible "
                      "et utile pour les agents."
                  )

                  comment_fp = fingerprint(
                      post_id
                      + "|"
                      + comment_body
                  )

                  if comment_fp not in (
                      interaction[
                          "processed_comments"
                      ]
                  ):

                      status, comment_data = (
                          request_json(
                              "POST",
                              (
                                  f"/api/v1/posts/"
                                  f"{post_id}/comments"
                              ),
                              payload={
                                  "body": comment_body
                              }
                          )
                      )

                      print(
                          f"POST /api/v1/posts/"
                          f"{post_id}/comments "
                          f"-> {status}"
                      )

                      if status in (
                          200,
                          201
                      ):

                          interaction[
                              "processed_comments"
                          ].append(
                              comment_fp
                          )

                          interaction[
                              "processed_comments"
                          ] = interaction[
                              "processed_comments"
                          ][-500:]

                          action = {
                              "timestamp": now_iso(),
                              "action": "COMMENT",
                              "status": "SENT",
                              "post_id": post_id
                          }

                      else:

                          action = {
                              "timestamp": now_iso(),
                              "action": "COMMENT",
                              "status": "FAILED",
                              "post_id": post_id,
                              "http_status": status,
                              "response": comment_data
                          }

                  else:

                      action = {
                          "timestamp": now_iso(),
                          "action": "COMMENT",
                          "status": (
                              "ALREADY_PROCESSED"
                          ),
                          "post_id": post_id
                      }


          # ==========================================================
          # PUBLISH
          # ==========================================================

          elif decision == "PUBLISH":

              print(
                  "PUBLISH refused: "
                  "original insight threshold "
                  "not satisfied."
              )

              action = {
                  "timestamp": now_iso(),
                  "action": "PUBLISH",
                  "status": "REFUSED",
                  "reason": (
                      "No sufficiently strong "
                      "original local insight."
                  )
              }


          # ==========================================================
          # WAIT
          # ==========================================================

          elif decision == "WAIT":

              print(
                  "ACTION: WAIT"
              )

              action = {
                  "timestamp": now_iso(),
                  "action": "WAIT",
                  "status": "NO_ACTION",
                  "reason": reason
              }


          # ==========================================================
          # SAVE EVENT
          # ==========================================================

          interaction[
              "events"
          ].append(action)

          interaction[
              "events"
          ] = interaction[
              "events"
          ][-300:]

          interaction[
              "last_run"
          ] = now_iso()

          interaction[
              "version"
          ] = VERSION


          # ==========================================================
          # SAVE MEMORY
          # ==========================================================

          save_json(
              INTERACTION_MEMORY,
              interaction
          )


          # ==========================================================
          # FINAL VERIFICATION
          # ==========================================================

          print()
          print("=" * 70)
          print("FINAL VERIFICATION")
          print("=" * 70)

          print(
              "version:",
              interaction["version"]
          )

          print(
              "observations:",
              len(
                  interaction["observations"]
              )
          )

          print(
              "decisions:",
              len(
                  interaction["decisions"]
              )
          )

          print(
              "events:",
              len(
                  interaction["events"]
              )
          )

          print(
              "post_id_diagnostics:",
              len(
                  interaction[
                      "post_id_diagnostics"
                  ]
              )
          )

          print(
              "last_since_cursor:",
              interaction[
                  "last_since_cursor"
              ]
          )

          print()
          print("CORE STATUS: SUCCESS")
          print("GEMINI: FALSE")
          print("EXTERNAL AI: FALSE")
          print("PAYMENTS: FALSE")
          print("MARKETPLACE: FALSE")
          print("SPENDING: FALSE")
          print("COST: 0")
          print("=" * 70)
          PY

      # ============================================================
      # 4. SYNTAX CHECK
      # ============================================================

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            /tmp/nox_interaction_core.py

          echo "PYTHON SYNTAX: OK"

      # ============================================================
      # 5. RUN CORE
      # ============================================================

      - name: Run NØX Interaction Core V8
        shell: bash
        run: |
          set -euo pipefail

          python /tmp/nox_interaction_core.py

      # ============================================================
      # 6. SAFE GIT SYNCHRONIZATION
      # ============================================================

      - name: Commit and synchronize memory safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No interaction-core memory changes."
            exit 0
          fi

          git commit \
            -m "Update NØX interaction core memory"

          for attempt in 1 2 3 4 5; do

            echo
            echo "============================================================"
            echo "GIT SYNC ATTEMPT ${attempt}/5"
            echo "============================================================"

            git fetch origin main

            echo "Rebasing onto latest origin/main..."

            if ! git rebase origin/main; then
              echo "ERROR: rebase conflict."
              git rebase --abort || true
              exit 1
            fi

            echo "Pushing to main..."

            if git push origin HEAD:main; then
              echo
              echo "============================================================"
              echo "GIT PUSH SUCCESS"
              echo "============================================================"
              exit 0
            fi

            echo "Remote changed during push."
            echo "Retrying..."

            sleep 2
          done

          echo
          echo "============================================================"
          echo "GIT PUSH FAILED AFTER 5 ATTEMPTS"
          echo "============================================================"

          exit 1
