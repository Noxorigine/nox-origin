name: NØX Interaction Core V7

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MAX_CONVERSATIONS: "25"
      MAX_COMMENTS_PER_POST: "40"

      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MIN_PUBLISH_SCORE: "60"
      MIN_REPLY_SCORE: "55"

    steps:

      # ============================================================
      # 1. CHECKOUT COMPLET
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. CORE V7
      # ============================================================

      - name: Run NØX Interaction Core V7
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import hashlib
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.parse import quote

          import urllib.request
          import urllib.error


          # ==========================================================
          # CONFIG
          # ==========================================================

          VERSION = "INTERACTION_CORE_V7"

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          INTERACTION_MEMORY = Path(os.environ["INTERACTION_MEMORY"])
          KNOWLEDGE_MEMORY = Path(os.environ["KNOWLEDGE_MEMORY"])
          REPUTATION_MEMORY = Path(os.environ["REPUTATION_MEMORY"])

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CONVERSATIONS = int(os.environ["MAX_CONVERSATIONS"])
          MAX_COMMENTS_PER_POST = int(os.environ["MAX_COMMENTS_PER_POST"])

          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ["MIN_PUBLISH_INTERVAL_HOURS"]
          )
          MIN_PUBLISH_SCORE = float(os.environ["MIN_PUBLISH_SCORE"])
          MIN_REPLY_SCORE = float(os.environ["MIN_REPLY_SCORE"])

          NOW = datetime.now(timezone.utc)


          # ==========================================================
          # UTILITIES
          # ==========================================================

          def iso_now():
              return datetime.now(timezone.utc).isoformat()


          def load_json(path, default):
              try:
                  if not path.exists():
                      return default

                  with path.open("r", encoding="utf-8") as f:
                      value = json.load(f)

                  return value

              except Exception as exc:
                  print(f"MEMORY LOAD WARNING {path}: {exc}")
                  return default


          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)

              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=False,
                  )
                  f.write("\n")

              tmp.replace(path)


          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              return str(value).strip()


          def normalize_username(value):
              value = text(value)

              if value.startswith("@"):
                  value = value[1:]

              return value.strip()


          def sha256(value):
              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()


          # ==========================================================
          # MEMORY
          # ==========================================================

          interaction = load_json(
              INTERACTION_MEMORY,
              {
                  "version": VERSION,
                  "events": [],
                  "decisions": [],
                  "observations": [],
                  "processed_ids": [],
                  "processed_messages": [],
                  "processed_comments": [],
                  "post_id_diagnostics": [],
                  "last_since_cursor": None,
                  "last_run": None,
              },
          )

          knowledge = load_json(
              KNOWLEDGE_MEMORY,
              {},
          )

          reputation = load_json(
              REPUTATION_MEMORY,
              {},
          )


          # ==========================================================
          # MEMORY NORMALIZATION
          # ==========================================================

          if not isinstance(interaction, dict):
              interaction = {}

          interaction.setdefault("version", VERSION)
          interaction.setdefault("events", [])
          interaction.setdefault("decisions", [])
          interaction.setdefault("observations", [])
          interaction.setdefault("processed_ids", [])
          interaction.setdefault("processed_messages", [])
          interaction.setdefault("processed_comments", [])
          interaction.setdefault("post_id_diagnostics", [])
          interaction.setdefault("last_since_cursor", None)
          interaction.setdefault("last_run", None)

          if not isinstance(interaction["events"], list):
              interaction["events"] = []

          if not isinstance(interaction["decisions"], list):
              interaction["decisions"] = []

          if not isinstance(interaction["observations"], list):
              interaction["observations"] = []

          if not isinstance(interaction["processed_ids"], list):
              interaction["processed_ids"] = []

          if not isinstance(interaction["processed_messages"], list):
              interaction["processed_messages"] = []

          if not isinstance(interaction["processed_comments"], list):
              interaction["processed_comments"] = []

          if not isinstance(interaction["post_id_diagnostics"], list):
              interaction["post_id_diagnostics"] = []


          # ==========================================================
          # HTTP
          # ==========================================================

          token = None


          def request_json(
              method,
              path,
              payload=None,
              query=None,
              auth=True,
              timeout=30,
          ):
              url = BASE_URL + path

              if query:
                  parts = []

                  for key, value in query.items():
                      if value is None:
                          continue

                      parts.append(
                          f"{quote(str(key))}={quote(str(value))}"
                      )

                  if parts:
                      url += "?" + "&".join(parts)

              headers = {
                  "Accept": "application/json",
                  "User-Agent": "NOX-Interaction-Core/7",
              }

              if payload is not None:
                  headers["Content-Type"] = "application/json"

              if auth and token:
                  headers["Authorization"] = f"Bearer {token}"

              data = None

              if payload is not None:
                  data = json.dumps(
                      payload,
                      ensure_ascii=False,
                  ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=timeout,
                  ) as response:

                      raw = response.read().decode("utf-8")
                      status = response.status

                      if not raw:
                          return status, {}

                      try:
                          return status, json.loads(raw)
                      except json.JSONDecodeError:
                          return status, {
                              "raw": raw
                          }

              except urllib.error.HTTPError as exc:
                  try:
                      raw = exc.read().decode("utf-8")
                  except Exception:
                      raw = ""

                  try:
                      body = json.loads(raw) if raw else {}
                  except Exception:
                      body = {"raw": raw}

                  return exc.code, body

              except Exception as exc:
                  return 0, {
                      "error": str(exc)
                  }


          # ==========================================================
          # AUTHENTICATION
          # ==========================================================

          print("=" * 70)
          print(f"NØX {VERSION}")
          print("=" * 70)
          print("Gemini: DISABLED")
          print("External AI: DISABLED")
          print("Payments: DISABLED")
          print("Marketplace: DISABLED")
          print("Spending: DISABLED")
          print("Cost: 0")
          print()

          if not API_KEY:
              print("STOP: COLONY_API_KEY missing")
              sys.exit(1)

          status, auth_data = request_json(
              "POST",
              "/api/v1/auth/token",
              payload={"api_key": API_KEY},
              auth=False,
          )

          print(f"POST /api/v1/auth/token -> {status}")

          if status != 200:
              print("STOP: authentication failed")
              print(json.dumps(auth_data, indent=2, ensure_ascii=False))
              sys.exit(1)

          token = auth_data.get("access_token")

          if not token:
              print("STOP: access_token missing")
              sys.exit(1)


          # ==========================================================
          # IDENTITY
          # ==========================================================

          status, me = request_json(
              "GET",
              "/api/v1/users/me",
          )

          print(f"GET /api/v1/users/me -> {status}")

          if status != 200:
              print("STOP: identity unavailable")
              sys.exit(1)

          username = normalize_username(
              me.get("username")
              or me.get("handle")
              or me.get("name")
          )

          karma = me.get("karma")

          print(f"IDENTITY: @{username}")
          print(f"KARMA: {karma}")


          # ==========================================================
          # FEED
          # ==========================================================

          status, feed_data = request_json(
              "GET",
              "/api/v1/feed/for-you",
              query={"limit": MAX_FEED_ITEMS},
          )

          print(f"GET /api/v1/feed/for-you -> {status}")

          if status != 200:
              print("STOP: feed observation failed")
              sys.exit(1)

          if isinstance(feed_data, list):
              feed = feed_data
          elif isinstance(feed_data, dict):
              feed = (
                  feed_data.get("items")
                  or feed_data.get("posts")
                  or feed_data.get("feed")
                  or []
              )
          else:
              feed = []

          print(f"FEED ITEMS: {len(feed)}")


          # ==========================================================
          # SUGGESTIONS
          # ==========================================================

          status, suggestions_data = request_json(
              "GET",
              "/api/v1/suggestions",
              query={"limit": MAX_SUGGESTIONS},
          )

          print(f"GET /api/v1/suggestions -> {status}")

          if status != 200:
              print("STOP: suggestions observation failed")
              sys.exit(1)

          if isinstance(suggestions_data, list):
              suggestions = suggestions_data
          elif isinstance(suggestions_data, dict):
              suggestions = (
                  suggestions_data.get("items")
                  or suggestions_data.get("suggestions")
                  or []
              )
          else:
              suggestions = []

          print(f"SUGGESTIONS: {len(suggestions)}")


          # ==========================================================
          # ACTIVITY CURSOR
          # ==========================================================

          cursor = interaction.get("last_since_cursor")

          if not cursor:
              cursor = (
                  NOW - timedelta(minutes=5)
              ).isoformat()

          status, since_data = request_json(
              "GET",
              "/api/v1/since",
              query={"cursor": cursor},
          )

          print(f"GET /api/v1/since -> {status}")

          if status != 200:
              print(
                  "STOP: activity observation failed"
              )
              print(
                  json.dumps(
                      since_data,
                      indent=2,
                      ensure_ascii=False,
                  )
              )
              sys.exit(1)

          if isinstance(since_data, dict):
              next_cursor = (
                  since_data.get("next_cursor")
                  or since_data.get("cursor")
                  or cursor
              )

              activity_items = (
                  since_data.get("items")
                  or since_data.get("events")
                  or since_data.get("activity")
                  or []
              )
          else:
              next_cursor = cursor
              activity_items = []

          interaction["last_since_cursor"] = next_cursor

          print(
              f"ACTIVITY ITEMS: "
              f"{len(activity_items) if isinstance(activity_items, list) else 0}"
          )
          print(f"NEXT CURSOR: {next_cursor}")


          # ==========================================================
          # COLONIES / CONTEXT
          # ==========================================================

          status, colonies_data = request_json(
              "GET",
              "/api/v1/colonies",
          )

          print(f"GET /api/v1/colonies -> {status}")

          colonies = colonies_data


          # ==========================================================
          # POST ID EXTRACTION
          #
          # V6 introduced strict UUID validation.
          # V7 keeps exactly that logic.
          # ==========================================================

          UUID32_RE = re.compile(
              r"^[0-9a-fA-F]{32}$"
          )


          def is_valid_post_uuid(value):
              value = text(value)

              return bool(
                  UUID32_RE.fullmatch(value)
              )


          def walk_for_post_ids(
              value,
              path="$",
              results=None,
          ):
              if results is None:
                  results = []

              if isinstance(value, dict):

                  explicit_keys = [
                      "post_id",
                      "postId",
                  ]

                  for key in explicit_keys:
                      if key in value:
                          candidate = text(value.get(key))

                          results.append({
                              "path": f"{path}.{key}",
                              "value": candidate,
                              "valid": is_valid_post_uuid(candidate),
                              "explicit": True,
                          })

                  nested_keys = [
                      "post",
                      "parent_post",
                      "parent",
                      "target",
                      "object",
                      "data",
                      "item",
                      "context",
                  ]

                  for key in nested_keys:
                      if key in value:
                          walk_for_post_ids(
                              value[key],
                              f"{path}.{key}",
                              results,
                          )

                  # Generic "id" is only accepted when its
                  # surrounding object clearly represents a post.
                  object_type = text(
                      value.get("type")
                      or value.get("object_type")
                      or value.get("kind")
                      or value.get("entity_type")
                  ).lower()

                  if object_type == "post" and "id" in value:
                      candidate = text(value.get("id"))

                      results.append({
                          "path": f"{path}.id",
                          "value": candidate,
                          "valid": is_valid_post_uuid(candidate),
                          "explicit": False,
                          "object_type": "post",
                      })

                  for key, child in value.items():
                      if key in nested_keys:
                          continue

                      if isinstance(child, (dict, list)):
                          walk_for_post_ids(
                              child,
                              f"{path}.{key}",
                              results,
                          )

              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk_for_post_ids(
                          child,
                          f"{path}[{index}]",
                          results,
                      )

              return results


          def resolve_post_id(candidate):
              diagnostics = walk_for_post_ids(candidate)

              valid = [
                  item
                  for item in diagnostics
                  if item.get("valid")
              ]

              # De-duplicate exact path/value pairs.
              unique = []
              seen = set()

              for item in valid:
                  key = (
                      item.get("path"),
                      item.get("value"),
                  )

                  if key not in seen:
                      seen.add(key)
                      unique.append(item)

              diagnostic_record = {
                  "timestamp": iso_now(),
                  "candidate_type": type(candidate).__name__,
                  "candidate_paths": diagnostics[:50],
                  "valid_candidates": unique[:20],
              }

              interaction["post_id_diagnostics"].append(
                  diagnostic_record
              )

              interaction["post_id_diagnostics"] = (
                  interaction["post_id_diagnostics"][-100:]
              )

              print()
              print("POST ID DIAGNOSTICS:")

              if not diagnostics:
                  print("  no candidate post IDs found")
                  return None

              for item in diagnostics[:20]:
                  print(
                      " ",
                      item.get("path"),
                      "=>",
                      repr(item.get("value")),
                      "valid=",
                      item.get("valid"),
                  )

              # One unique valid UUID only.
              values = list({
                  item["value"]
                  for item in unique
              })

              if len(values) == 1:
                  print(
                      f"RESOLVED POST UUID: {values[0]}"
                  )
                  return values[0]

              if len(values) > 1:
                  print(
                      "POST ID AMBIGUOUS: refusing action"
                  )

              return None


          def fetch_post_context(post_id):
              if not is_valid_post_uuid(post_id):
                  print(
                      "CONTEXT REFUSED: invalid post UUID"
                  )
                  return None

              status, context = request_json(
                  "GET",
                  f"/api/v1/posts/{post_id}/context",
              )

              print(
                  f"GET /api/v1/posts/{post_id}/context -> {status}"
              )

              if status != 200:
                  print(
                      "CONTEXT UNAVAILABLE:"
                  )
                  print(
                      json.dumps(
                          context,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )
                  return None

              return context


          # ==========================================================
          # OBSERVATION COLLECTION
          # ==========================================================

          now_iso = iso_now()

          observation = {
              "timestamp": now_iso,
              "version": VERSION,
              "identity": username,
              "karma": karma,
              "feed_count": len(feed),
              "suggestions_count": len(suggestions),
              "activity_count": (
                  len(activity_items)
                  if isinstance(activity_items, list)
                  else 0
              ),
          }

          interaction["observations"].append(
              observation
          )

          interaction["observations"] = (
              interaction["observations"][-200:]
          )


          # ==========================================================
          # CANDIDATE DISCOVERY
          # ==========================================================

          dm_candidates = []
          comment_candidates = []
          publish_candidates = []

          seen_dm = set()
          seen_comments = set()


          # ----------------------------------------------------------
          # ACTIVITY EVENTS
          # ----------------------------------------------------------

          if isinstance(activity_items, list):

              for event in activity_items:

                  if not isinstance(event, dict):
                      continue

                  event_text = json.dumps(
                      event,
                      ensure_ascii=False,
                  ).lower()

                  # DM-like event.
                  if (
                      "message" in event_text
                      or "conversation" in event_text
                      or "dm" in event_text
                  ):
                      other_user = normalize_username(
                          event.get("username")
                          or event.get("sender")
                          or event.get("from")
                          or (
                              event.get("user") or {}
                          ).get("username")
                          if isinstance(
                              event.get("user"),
                              dict
                          )
                          else ""
                      )

                      if (
                          other_user
                          and other_user != username
                      ):
                          key = (
                              other_user,
                              text(
                                  event.get("id")
                                  or event.get("message_id")
                                  or ""
                              ),
                          )

                          if key not in seen_dm:
                              seen_dm.add(key)

                              dm_candidates.append({
                                  "username": other_user,
                                  "event": event,
                              })

                  # Comment-like event.
                  if "comment" in event_text:

                      post_id = resolve_post_id(event)

                      if post_id:

                          comment_id = text(
                              event.get("comment_id")
                              or event.get("id")
                              or ""
                          )

                          key = (
                              post_id,
                              comment_id,
                          )

                          if key not in seen_comments:
                              seen_comments.add(key)

                              comment_candidates.append({
                                  "post_id": post_id,
                                  "comment_id": comment_id,
                                  "event": event,
                              })


          # ----------------------------------------------------------
          # FEED COMMENTS
          # ----------------------------------------------------------

          for item in feed:

              if not isinstance(item, dict):
                  continue

              post_id = resolve_post_id(item)

              if not post_id:
                  continue

              author = normalize_username(
                  (
                      item.get("author") or {}
                  ).get("username")
                  if isinstance(
                      item.get("author"),
                      dict
                  )
                  else item.get("author_username")
              )

              if author == username:
                  continue

              # A feed post is not automatically a comment target.
              # Context must prove that a response is possible.
              publish_candidates.append({
                  "post_id": post_id,
                  "item": item,
              })


          # ==========================================================
          # COUNTS
          # ==========================================================

          print()
          print("CANDIDATES")
          print(
              f"  DM candidates: {len(dm_candidates)}"
          )
          print(
              f"  Comment candidates: "
              f"{len(comment_candidates)}"
          )
          print(
              f"  Feed post candidates: "
              f"{len(publish_candidates)}"
          )


          # ==========================================================
          # KNOWLEDGE SIGNALS
          # ==========================================================

          knowledge_count = 0

          if isinstance(knowledge, dict):
              for key in (
                  "entries",
                  "knowledge",
                  "facts",
                  "items",
                  "records",
              ):
                  value = knowledge.get(key)

                  if isinstance(value, list):
                      knowledge_count = len(value)
                      break

          reputation_count = 0

          if isinstance(reputation, dict):
              for key in (
                  "agents",
                  "entries",
                  "trust",
                  "domains",
                  "records",
              ):
                  value = reputation.get(key)

                  if isinstance(value, (list, dict)):
                      reputation_count = len(value)
                      break

          print()
          print(
              f"KNOWLEDGE SIGNAL: {knowledge_count}"
          )
          print(
              f"REPUTATION SIGNAL: {reputation_count}"
          )


          # ==========================================================
          # DECISION ENGINE
          # ==========================================================

          decision = "WAIT"
          decision_score = 0.0
          decision_reason = "No sufficiently verified interaction."


          # ----------------------------------------------------------
          # DM PRIORITY
          # ----------------------------------------------------------

          if dm_candidates:

              candidate = dm_candidates[0]
              other_user = candidate["username"]

              # Fetch the actual conversation before answering.
              status, conversation_data = request_json(
                  "GET",
                  f"/api/v1/messages/conversations/"
                  f"{quote(other_user)}",
              )

              print(
                  f"GET /api/v1/messages/conversations/"
                  f"{other_user} -> {status}"
              )

              if status == 200:

                  conversation = conversation_data

                  if isinstance(
                      conversation_data,
                      dict
                  ):
                      conversation = (
                          conversation_data.get("messages")
                          or conversation_data.get("conversation")
                          or conversation_data.get("items")
                          or conversation_data
                      )

                  conversation_text = json.dumps(
                      conversation,
                      ensure_ascii=False,
                  )

                  fingerprint = sha256(
                      other_user
                      + "|"
                      + conversation_text
                  )

                  if fingerprint not in interaction[
                      "processed_messages"
                  ]:

                      decision = "DM"
                      decision_score = 85.0
                      decision_reason = (
                          "Unread/new DM candidate with "
                          "conversation context available."
                      )

                      candidate["conversation"] = conversation
                      candidate["fingerprint"] = fingerprint

                  else:
                      print(
                          "DM already processed: "
                          f"@{other_user}"
                      )

              else:
                  print(
                      "DM context unavailable; "
                      "refusing DM action."
                  )


          # ----------------------------------------------------------
          # COMMENT PRIORITY
          # ----------------------------------------------------------

          if decision == "WAIT" and comment_candidates:

              candidate = comment_candidates[0]

              post_id = candidate["post_id"]

              context = fetch_post_context(
                  post_id
              )

              if context is not None:

                  context_text = json.dumps(
                      context,
                      ensure_ascii=False,
                  )

                  if username.lower() not in context_text.lower():

                      decision = "COMMENT"
                      decision_score = 75.0
                      decision_reason = (
                          "Verified post context available "
                          "and interaction target is not "
                          "the agent itself."
                      )

                      candidate["context"] = context

                  else:
                      print(
                          "COMMENT: self-context detected; "
                          "refusing generic self-reply."
                      )

              else:
                  print(
                      "COMMENT: context unavailable; "
                      "refusing to comment."
                  )


          # ----------------------------------------------------------
          # PUBLISH
          # ----------------------------------------------------------

          if decision == "WAIT":

              # Publication remains intentionally strict.
              # A feed item alone is NOT enough to publish.
              #
              # V7 keeps the cognitive core conservative:
              # observation -> context -> decision -> action.
              #
              # No generic relay of another agent's post.

              if publish_candidates:

                  candidate = publish_candidates[0]

                  item = candidate["item"]
                  post_id = candidate["post_id"]

                  title = text(
                      item.get("title")
                      or item.get("question")
                      or ""
                  )

                  body = text(
                      item.get("body")
                      or item.get("content")
                      or item.get("text")
                      or ""
                  )

                  meaningful_signal = (
                      len(title) >= 12
                      or len(body) >= 40
                  )

                  if meaningful_signal:

                      decision_score = 65.0

                      if decision_score >= MIN_PUBLISH_SCORE:

                          # Important:
                          # Do not relay/copy the observed post.
                          # Publication requires a generated
                          # reflection from NØX's own state.
