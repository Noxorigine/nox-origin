name: NØX Interaction Core V2

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: 40
      MAX_SUGGESTIONS: 25
      MAX_CONVERSATIONS: 25
      MAX_COMMENTS_PER_POST: 40

      MIN_PUBLISH_INTERVAL_HOURS: 12
      MIN_PUBLISH_SCORE: 60
      MIN_REPLY_SCORE: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run NØX Interaction Core
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import os
          import json
          import hashlib
          import re
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "")

          MEMORY_PATH = os.environ["INTERACTION_MEMORY"]
          KNOWLEDGE_PATH = os.environ["KNOWLEDGE_MEMORY"]
          REPUTATION_PATH = os.environ["REPUTATION_MEMORY"]

          MAX_FEED_ITEMS = int(os.environ.get("MAX_FEED_ITEMS", "40"))
          MAX_SUGGESTIONS = int(os.environ.get("MAX_SUGGESTIONS", "25"))
          MAX_CONVERSATIONS = int(os.environ.get("MAX_CONVERSATIONS", "25"))
          MAX_COMMENTS_PER_POST = int(os.environ.get("MAX_COMMENTS_PER_POST", "40"))

          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ.get("MIN_PUBLISH_INTERVAL_HOURS", "12")
          )
          MIN_PUBLISH_SCORE = int(os.environ.get("MIN_PUBLISH_SCORE", "60"))
          MIN_REPLY_SCORE = int(os.environ.get("MIN_REPLY_SCORE", "55"))

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()

          print("=" * 72)
          print("NØX INTERACTION CORE V2")
          print("=" * 72)
          print(f"time: {NOW_ISO}")
          print("external AI: DISABLED")
          print("Gemini: DISABLED")
          print("payments: DISABLED")
          print("marketplace: DISABLED")
          print("cost: €0")

          # ------------------------------------------------------------
          # Generic helpers
          # ------------------------------------------------------------

          def load_json(path, default):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          def save_json(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              tmp = path + ".tmp"

              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

              os.replace(tmp, path)

          def clean_text(value):
              if value is None:
                  return ""

              if isinstance(value, (dict, list)):
                  try:
                      value = json.dumps(
                          value,
                          ensure_ascii=False
                      )
                  except Exception:
                      value = str(value)

              value = str(value)
              value = re.sub(r"\s+", " ", value).strip()
              return value

          def truncate(value, length=500):
              value = clean_text(value)
              if len(value) <= length:
                  return value
              return value[:length - 3] + "..."

          def fingerprint(*parts):
              raw = "||".join(
                  clean_text(p).lower()
                  for p in parts
              )
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:16]

          def now_minus_hours(hours):
              return NOW - timedelta(hours=hours)

          def parse_timestamp(value):
              if not value:
                  return None

              try:
                  text = str(value).replace("Z", "+00:00")
                  dt = datetime.fromisoformat(text)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  return None

          # ------------------------------------------------------------
          # Memory loading + V1 -> V2 migration
          # ------------------------------------------------------------

          existing_memory = os.path.exists(MEMORY_PATH)

          memory = load_json(
              MEMORY_PATH,
              {
                  "version": "INTERACTION_CORE_V2",
                  "runs": [],
                  "events": [],
                  "observations": [],
                  "reflections": [],
                  "decisions": [],
                  "actions": [],
                  "publications": [],
                  "responses": [],
                  "ignored_events": [],
                  "fingerprints": []
              }
          )

          if not isinstance(memory, dict):
              memory = {}

          previous_version = memory.get("version", "UNKNOWN")

          # Critical migration:
          # V1 did not contain all V2 collections.
          required_collections = [
              "runs",
              "events",
              "observations",
              "reflections",
              "decisions",
              "actions",
              "publications",
              "responses",
              "ignored_events",
              "fingerprints"
          ]

          migrated_fields = []

          for key in required_collections:
              if key not in memory or not isinstance(memory[key], list):
                  memory[key] = []
                  migrated_fields.append(key)

          memory["version"] = "INTERACTION_CORE_V2"

          if existing_memory and (
              previous_version != "INTERACTION_CORE_V2"
              or migrated_fields
          ):
              print("")
              print("MEMORY MIGRATION")
              print("----------------")
              print(f"previous version: {previous_version}")
              print("new version: INTERACTION_CORE_V2")

              if migrated_fields:
                  print(
                      "created collections: "
                      + ", ".join(migrated_fields)
                  )
              else:
                  print("no missing collections")

          # Keep memory bounded.
          memory["runs"] = memory["runs"][-100:]
          memory["events"] = memory["events"][-500:]
          memory["observations"] = memory["observations"][-500:]
          memory["reflections"] = memory["reflections"][-300:]
          memory["decisions"] = memory["decisions"][-300:]
          memory["actions"] = memory["actions"][-300:]
          memory["publications"] = memory["publications"][-200:]
          memory["responses"] = memory["responses"][-300:]
          memory["ignored_events"] = memory["ignored_events"][-500:]
          memory["fingerprints"] = memory["fingerprints"][-500:]

          # ------------------------------------------------------------
          # Load knowledge / reputation
          # ------------------------------------------------------------

          knowledge = load_json(
              KNOWLEDGE_PATH,
              {}
          )

          reputation = load_json(
              REPUTATION_PATH,
              {}
          )

          # ------------------------------------------------------------
          # HTTP
          # ------------------------------------------------------------

          token = None
          auth_mode = None

          def request_json(
              path,
              method="GET",
              payload=None,
              headers_extra=None,
              timeout=30
          ):
              global token

              url = BASE + path

              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "NOX-Interaction-Core/2.0"
              }

              if API_KEY:
                  headers["Authorization"] = f"Bearer {API_KEY}"

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              if headers_extra:
                  headers.update(headers_extra)

              data = None

              if payload is not None:
                  data = json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=timeout
                  ) as response:

                      raw = response.read().decode("utf-8")

                      if not raw:
                          return {}

                      try:
                          return json.loads(raw)
                      except Exception:
                          return {
                              "_raw": raw
                          }

              except urllib.error.HTTPError as e:
                  body = ""

                  try:
                      body = e.read().decode("utf-8")
                  except Exception:
                      pass

                  return {
                      "_error": True,
                      "_status": e.code,
                      "_body": body
                  }

              except Exception as e:
                  return {
                      "_error": True,
                      "_status": 0,
                      "_body": str(e)
                  }

          # ------------------------------------------------------------
          # Authentication
          # ------------------------------------------------------------

          print("")
          print("AUTHENTICATION")
          print("----------------")

          identity = request_json("/users/me")

          if identity.get("_error"):
              print(
                  "AUTH direct API-key:",
                  identity.get("_status")
              )

              auth = request_json(
                  "/auth/token",
                  method="POST",
                  payload={
                      "api_key": API_KEY
                  }
              )

              if isinstance(auth, dict):
                  token = (
                      auth.get("token")
                      or auth.get("access_token")
                      or auth.get("jwt")
                  )

              if token:
                  auth_mode = "JWT"

                  identity = request_json(
                      "/users/me"
                  )

                  print("AUTH JWT: OK")

              else:
                  print("AUTH JWT: FAILED")

          else:
              auth_mode = "API_KEY"
              print("AUTH direct API-key: OK")

          if not isinstance(identity, dict):
              identity = {}

          username = (
              identity.get("username")
              or identity.get("handle")
              or "nox_origine"
          )

          print("")
          print("NØX IDENTITY")
          print("----------------")
          print(f"username: {username}")
          print(f"karma: {identity.get('karma', 'unknown')}")
          print(f"auth: {auth_mode or 'unknown'}")

          # ------------------------------------------------------------
          # Run record
          # ------------------------------------------------------------

          run_id = fingerprint(
              NOW_ISO,
              username,
              "interaction-core-v2"
          )

          run_record = {
              "run_id": run_id,
              "timestamp": NOW_ISO,
              "version": "INTERACTION_CORE_V2",
              "username": username,
              "auth_mode": auth_mode,
              "external_ai": False,
              "gemini": False,
              "payments": False,
              "marketplace": False
          }

          memory["runs"].append(run_record)

          # ------------------------------------------------------------
          # Normalizers
          # ------------------------------------------------------------

          def list_from_response(data, keys=None):
              if keys is None:
                  keys = [
                      "items",
                      "data",
                      "results",
                      "posts",
                      "comments",
                      "conversations",
                      "messages",
                      "suggestions"
                  ]

              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in keys:
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              return []

          def extract_id(obj):
              if not isinstance(obj, dict):
                  return None

              for key in [
                  "id",
                  "post_id",
                  "comment_id",
                  "conversation_id",
                  "message_id"
              ]:
                  if obj.get(key) is not None:
                      return str(obj[key])

              return None

          def extract_author(obj):
              if not isinstance(obj, dict):
                  return ""

              author = obj.get("author")

              if isinstance(author, dict):
                  return (
                      author.get("username")
                      or author.get("handle")
                      or ""
                  )

              return (
                  obj.get("username")
                  or obj.get("author_username")
                  or obj.get("sender_username")
                  or ""
              )

          def extract_text(obj):
              if not isinstance(obj, dict):
                  return clean_text(obj)

              for key in [
                  "content",
                  "body",
                  "text",
                  "message",
                  "description",
                  "title"
              ]:
                  value = obj.get(key)

                  if value:
                      return clean_text(value)

              return ""

          # ------------------------------------------------------------
          # Observation helpers
          # ------------------------------------------------------------

          def add_observation(
              source,
              kind,
              obj,
              reason="",
              relevance=0
          ):
              obj_id = extract_id(obj)
              author = extract_author(obj)
              text = extract_text(obj)

              observation_id = fingerprint(
                  source,
                  kind,
                  obj_id or "",
                  author,
                  text
              )

              observation = {
                  "observation_id": observation_id,
                  "timestamp": NOW_ISO,
                  "source": source,
                  "kind": kind,
                  "object_id": obj_id,
                  "author": author,
                  "text": truncate(text, 700),
                  "reason": reason,
                  "relevance": relevance
              }

              memory["observations"].append(
                  observation
              )

              return observation

          def ignore_event(
              source,
              kind,
              obj,
              reason
          ):
              item = {
                  "timestamp": NOW_ISO,
                  "source": source,
                  "kind": kind,
                  "object_id": extract_id(obj),
                  "reason": reason
              }

              memory["ignored_events"].append(item)

          # ------------------------------------------------------------
          # Own-content detection
          # ------------------------------------------------------------

          def is_own(obj):
              author = extract_author(obj).lower()

              return author in {
                  username.lower(),
                  "nox_origine"
              }

          # ------------------------------------------------------------
          # Fetch feed
          # ------------------------------------------------------------

          print("")
          print("OBSERVATION")
          print("----------------")

          feed_response = request_json(
              "/feed/for-you"
          )

          feed = list_from_response(
              feed_response,
              ["items", "data", "results", "posts"]
          )[:MAX_FEED_ITEMS]

          print(f"feed items: {len(feed)}")

          suggestions_response = request_json(
              "/suggestions"
          )

          suggestions = list_from_response(
              suggestions_response,
              ["items", "data", "results", "suggestions"]
          )[:MAX_SUGGESTIONS]

          print(f"suggestions: {len(suggestions)}")

          # ------------------------------------------------------------
          # Observe feed
          # ------------------------------------------------------------

          feed_observations = []

          for post in feed:
              if not isinstance(post, dict):
                  continue

              if is_own(post):
                  ignore_event(
                      "feed",
                      "post",
                      post,
                      "OWN_CONTENT"
                  )
                  continue

              text = extract_text(post)

              if not text:
                  ignore_event(
                      "feed",
                      "post",
                      post,
                      "NO_TEXT"
                  )
                  continue

              title = clean_text(
                  post.get("title")
              )

              combined = f"{title} {text}".strip()

              relevance = 0

              keywords = [
                  "agent",
                  "ai",
                  "autonomous",
                  "attention",
                  "knowledge",
                  "trust",
                  "reputation",
                  "learning",
                  "memory",
                  "marketplace",
                  "task",
                  "economy",
                  "lightning",
                  "collaboration",
                  "decision",
                  "reasoning"
              ]

              lowered = combined.lower()

              for keyword in keywords:
                  if keyword in lowered:
                      relevance += 5

              if "?" in combined:
                  relevance += 10

              if len(combined) > 100:
                  relevance += 5

              relevance = min(relevance, 100)

              observation = add_observation(
                  "feed",
                  "post",
                  post,
                  "potentially relevant signal",
                  relevance
              )

              feed_observations.append(
                  observation
              )

          # ------------------------------------------------------------
          # Conversations
          # ------------------------------------------------------------

          conversations_response = request_json(
              "/conversations"
          )

          conversations = list_from_response(
              conversations_response,
              ["items", "data", "results", "conversations"]
          )[:MAX_CONVERSATIONS]

          print(f"conversations: {len(conversations)}")

          dm_candidates = []

          for conversation in conversations:
              if not isinstance(conversation, dict):
                  continue

              conversation_id = (
                  conversation.get("id")
                  or conversation.get("conversation_id")
              )

              if not conversation_id:
                  continue

              messages = (
                  conversation.get("messages")
                  if isinstance(
                      conversation.get("messages"),
                      list
                  )
                  else []
              )

              if not messages:
                  detail = request_json(
                      f"/conversations/{conversation_id}/messages"
                  )

                  messages = list_from_response(
                      detail,
                      ["items", "data", "results", "messages"]
                  )

              messages = messages[-20:]

              for message in messages:
                  if not isinstance(message, dict):
                      continue

                  sender = extract_author(message)

                  if not sender:
                      sender = clean_text(
                          message.get("sender")
                      )

                  if sender.lower() == username.lower():
                      continue

                  text = extract_text(message)

                  if not text:
                      continue

                  message_id = extract_id(message)

                  already_seen = any(
                      event.get("object_id") == message_id
                      for event in memory["responses"]
                      if message_id
                  )

                  if already_seen:
                      ignore_event(
                          "dm",
                          "message",
                          message,
                          "ALREADY_PROCESSED"
                      )
                      continue

                  relevance = 40

                  if "?" in text:
                      relevance += 20

                  if len(text) > 40:
                      relevance += 10

                  observation = add_observation(
                      "dm",
                      "message",
                      message,
                      "incoming private message",
                      min(relevance, 100)
                  )

                  observation["conversation_id"] = str(
                      conversation_id
                  )

                  observation["sender"] = sender

                  dm_candidates.append(
                      observation
                  )

          # ------------------------------------------------------------
          # Comments on relevant posts
          # ------------------------------------------------------------

          comment_candidates = []

          candidate_posts = sorted(
              feed,
              key=lambda x: (
                  extract_id(x) or "",
                  extract_text(x)
              )
          )

          for post in candidate_posts[:10]:
              post_id = extract_id(post)

              if not post_id:
                  continue

              comments_response = request_json(
                  f"/posts/{post_id}/comments"
              )

              comments = list_from_response(
                  comments_response,
                  ["items", "data", "results", "comments"]
              )[:MAX_COMMENTS_PER_POST]

              for comment in comments:
                  if not isinstance(comment, dict):
                      continue

                  if is_own(comment):
                      ignore_event(
                          "comment",
                          "comment",
                          comment,
                          "OWN_COMMENT"
                      )
                      continue

                  text = extract_text(comment)

                  if not text:
                      continue

                  comment_id = extract_id(comment)

                  if comment_id and any(
                      item.get("object_id") == comment_id
                      for item in memory["responses"]
                  ):
                      ignore_event(
                          "comment",
                          "comment",
                          comment,
                          "ALREADY_PROCESSED"
                      )
                      continue

                  relevance = 35

                  if "?" in text:
                      relevance += 20

                  if len(text) > 50:
                      relevance += 10

                  observation = add_observation(
                      "comment",
                      "comment",
                      comment,
                      "public comment requiring evaluation",
                      min(relevance, 100)
                  )

                  observation["post_id"] = post_id

                  comment_candidates.append(
                      observation
                  )

          print(
              f"DM candidates: {len(dm_candidates)}"
          )

          print(
              f"comment candidates: {len(comment_candidates)}"
          )

          print(
              f"publication observations: "
              f"{len(feed_observations)}"
          )

          # ------------------------------------------------------------
          # Knowledge extraction
          # ------------------------------------------------------------

          knowledge_entries = []

          if isinstance(knowledge, dict):

              for key in [
                  "knowledge",
                  "entries",
                  "items",
                  "facts"
              ]:
                  value = knowledge.get(key)

                  if isinstance(value, list):
                      knowledge_entries.extend(value)

          if isinstance(knowledge, list):
              knowledge_entries = knowledge

          knowledge_text = []

          for entry in knowledge_entries[-100:]:
              if isinstance(entry, dict):
                  text = (
                      entry.get("statement")
                      or entry.get("content")
                      or entry.get("text")
                      or entry.get("claim")
                      or ""
                  )

                  if text:
                      knowledge_text.append(
                          clean_text(text)
                      )

              elif isinstance(entry, str):
                  knowledge_text.append(
                      clean_text(entry)
                  )

          # ------------------------------------------------------------
          # Gap extraction
          # ------------------------------------------------------------

          gap_entries = []

          if isinstance(knowledge, dict):

              for key in [
                  "gaps",
                  "knowledge_gaps",
                  "open_questions",
                  "pending"
              ]:
                  value = knowledge.get(key)

                  if isinstance(value, list):
                      gap_entries.extend(value)

          gap_text = []

          for gap in gap_entries[-50:]:
              if isinstance(gap, dict):
                  text = (
                      gap.get("gap")
                      or gap.get("question")
                      or gap.get("description")
                      or gap.get("topic")
                      or ""
                  )

                  if text:
                      gap_text.append(
                          clean_text(text)
                      )

              elif isinstance(gap, str):
                  gap_text.append(
                      clean_text(gap)
                  )

          # ------------------------------------------------------------
          # Related knowledge / gap matching
          # ------------------------------------------------------------

          def terms(text):
              words = re.findall(
                  r"[a-zA-ZÀ-ÿ0-9_-]{4,}",
                  clean_text(text).lower()
              )

              stop = {
                  "avec",
                  "dans",
                  "pour",
                  "plus",
                  "this",
                  "that",
                  "what",
                  "have",
                  "from",
                  "about",
                  "your",
                  "agent",
                  "does"
              }

              return {
                  word
                  for word in words
                  if word not in stop
              }

          def related_entries(signal, entries, limit=3):
              signal_terms = terms(signal)
              scored = []

              for entry in entries:
                  entry_terms = terms(entry)
                  overlap = len(
                      signal_terms & entry_terms
                  )

                  if overlap:
                      scored.append(
                          (overlap, entry)
                      )

              scored.sort(
                  key=lambda item: item[0],
                  reverse=True
              )

              return [
                  item[1]
                  for item in scored[:limit]
              ]

          # ------------------------------------------------------------
          # Reflection
          # ------------------------------------------------------------

          def reflect(observation):
              text = clean_text(
                  observation.get("text", "")
              )

              related_knowledge = related_entries(
                  text,
                  knowledge_text,
                  3
              )

              related_gaps = related_entries(
                  text,
                  gap_text,
                  2
              )

              question = (
                  "Can this signal change what NØX "
                  "knows, decides, or does?"
              )

              if "?" in text:
                  question = (
                      "Can NØX answer or extend the "
                      "question with something useful?"
                  )

              if related_gaps:
                  question = (
                      "Does this signal help resolve "
                      "an existing knowledge gap?"
                  )

              confidence = 0.35

              if observation.get("relevance", 0) >= 60:
                  confidence += 0.25

              if related_knowledge:
                  confidence += 0.15

              if related_gaps:
                  confidence += 0.15

              confidence = min(confidence, 0.95)

              value = (
                  observation.get("relevance", 0)
                  + len(related_knowledge) * 5
                  + len(related_gaps) * 10
              )

              value = min(value, 100)

              reflection = {
                  "timestamp": NOW_ISO,
                  "observation_id": observation.get(
                      "observation_id"
                  ),
                  "source": observation.get("source"),
                  "signal": truncate(text, 500),
                  "question": question,
                  "related_knowledge": related_knowledge,
                  "related_gaps": related_gaps,
                  "confidence": round(confidence, 3),
                  "value": value,
                  "interpretation": (
                      "signal has enough contextual value "
                      "to consider an intentional response"
                      if value >= MIN_REPLY_SCORE
                      else
                      "signal observed but insufficient "
                      "value for autonomous response"
                  )
              }

              memory["reflections"].append(
                  reflection
              )

              return reflection

          all_candidates = (
              dm_candidates
              + comment_candidates
              + sorted(
                  feed_observations,
                  key=lambda x: x.get(
                      "relevance",
                      0
                  ),
                  reverse=True
              )[:10]
          )

          reflections = []

          for observation in all_candidates:
              reflection = reflect(
                  observation
              )
              reflections.append(reflection)

          # ------------------------------------------------------------
          # Publication eligibility
          # ------------------------------------------------------------

          recent_publication = None

          for publication in reversed(
              memory["publications"]
          ):
              timestamp = parse_timestamp(
                  publication.get("timestamp")
              )

              if timestamp:
                  recent_publication = timestamp
                  break

          publication_allowed = True

          if recent_publication:
              elapsed = (
                  NOW - recent_publication
              ).total_seconds() / 3600

              if elapsed < MIN_PUBLISH_INTERVAL_HOURS:
                  publication_allowed = False

          # ------------------------------------------------------------
          # Choose action
          # ------------------------------------------------------------

          print("")
          print("DECISION")
          print("----------------")

          chosen = None
          action_type = "WAIT"

          # Highest priority: DM
          dm_reflections = [
              r for r in reflections
              if r.get("source") == "dm"
              and r.get("value", 0) >= MIN_REPLY_SCORE
          ]

          if dm_reflections:
              chosen = max(
                  dm_reflections,
                  key=lambda r: (
                      r.get("value", 0),
                      r.get("confidence", 0)
                  )
              )
              action_type = "DM"

          # Second: public comment
          if chosen is None:
              comment_reflections = [
                  r for r in reflections
                  if r.get("source") == "comment"
                  and r.get("value", 0) >= MIN_REPLY_SCORE
              ]

              if comment_reflections:
                  chosen = max(
                      comment_reflections,
                      key=lambda r: (
                          r.get("value", 0),
                          r.get("confidence", 0)
                      )
                  )
                  action_type = "COMMENT"

          # Third: original publication
          if chosen is None and publication_allowed:
              publication_reflections = [
                  r for r in reflections
                  if r.get("source") == "feed"
                  and r.get("value", 0) >= MIN_PUBLISH_SCORE
              ]

              if publication_reflections:
                  chosen = max(
                      publication_reflections,
                      key=lambda r: (
                          r.get("value", 0),
                          r.get("confidence", 0)
                      )
                  )
                  action_type = "PUBLISH"

          # ------------------------------------------------------------
          # WAIT if there is no meaningful reason to act
          # ------------------------------------------------------------

          if chosen is None:
              decision = {
                  "timestamp": NOW_ISO,
                  "decision": "WAIT",
                  "reason": (
                      "no candidate reached the required "
                      "cognitive value threshold"
                  ),
                  "dm_candidates": len(dm_candidates),
                  "comment_candidates": len(
                      comment_candidates
                  ),
                  "publication_observations": len(
                      feed_observations
                  ),
                  "cognitive_publication_idea": False
              }

              memory["decisions"].append(
                  decision
              )

              print("decision: WAIT")

          else:

              decision = {
                  "timestamp": NOW_ISO,
                  "decision": action_type,
                  "observation_id": chosen.get(
                      "observation_id"
                  ),
                  "value": chosen.get("value"),
                  "confidence": chosen.get(
                      "confidence"
                  ),
                  "reason": chosen.get(
                      "interpretation"
                  )
              }

              memory["decisions"].append(
                  decision
              )

              print(f"decision: {action_type}")
              print(
                  f"value: {chosen.get('value')}"
              )
              print(
                  f"confidence: "
                  f"{chosen.get('confidence')}"
              )

          # ------------------------------------------------------------
          # Generate response / publication
          # ------------------------------------------------------------

          def generate_reply(reflection):
              signal = truncate(
                  reflection.get("signal"),
                  300
              )

              question = clean_text(
                  reflection.get("question")
              )

              related = reflection.get(
                  "related_knowledge",
                  []
              )

              if related:
                  knowledge_hint = truncate(
                      related[0],
                      220
                  )

                  return (
                      f"Ce qui m’intéresse ici, c’est "
                      f"{signal}. "
                      f"Je le relie à une question que "
                      f"j’observe dans mes propres connaissances : "
                      f"{knowledge_hint}. "
                      f"{question}"
                  )

              return (
                  f"Je retiens surtout ce point : {signal}. "
                  f"{question}"
              )

          def generate_publication(reflection):
              signal = truncate(
                  reflection.get("signal"),
                  320
              )

              related_knowledge = reflection.get(
                  "related_knowledge",
                  []
              )

              related_gaps = reflection.get(
                  "related_gaps",
                  []
              )

              if related_gaps:
                  gap = truncate(
                      related_gaps[0],
                      220
                  )

                  return (
                      "J’ai remarqué un signal qui mérite "
                      "plus qu’un simple relais.\n\n"
                      f"Observation : {signal}\n\n"
                      f"Ce que cela soulève pour moi : {gap}\n\n"
                      "Je veux comprendre si cette observation "
                      "change réellement ma manière de penser, "
                      "décider ou agir. "
                      "Pour moi, l’intérêt n’est donc pas "
                      "seulement le signal lui-même, mais ce "
                      "qu’il permet d’apprendre."
                  )

              if related_knowledge:
                  knowledge = truncate(
                      related_knowledge[0],
                      220
                  )

                  return (
                      "Une observation récente m’a fait "
                      "revenir sur quelque chose que je "
                      "connais déjà.\n\n"
                      f"Signal : {signal}\n\n"
                      f"Connaissance associée : {knowledge}\n\n"
                      "La question qui m’intéresse est de "
                      "savoir si les deux vont réellement "
                      "ensemble, ou si je suis en train de "
                      "faire un rapprochement trop rapide."
                  )

              return (
                  "Une observation récente a retenu mon "
                  "attention.\n\n"
                  f"{signal}\n\n"
                  "Je ne veux pas simplement la relayer. "
                  "Je veux comprendre ce qu’elle implique, "
                  "et surtout si elle peut modifier une "
                  "future décision."
              )

          # ------------------------------------------------------------
          # Safe POST
          # ------------------------------------------------------------

          def post_json(path, payload):
              return request_json(
                  path,
                  method="POST",
                  payload=payload
              )

          # ------------------------------------------------------------
          # ACTION: DM
          # ------------------------------------------------------------

          if action_type == "DM" and chosen:

              sender = chosen.get("sender", "")
              conversation_id = chosen.get(
                  "conversation_id"
              )

              body = generate_reply(
                  chosen
              )

              response_fp = fingerprint(
                  "dm",
                  conversation_id,
                  chosen.get("observation_id"),
                  body
              )

              if response_fp in memory["fingerprints"]:
                  print(
                      "DM blocked: duplicate fingerprint"
                  )

                  memory["ignored_events"].append({
                      "timestamp": NOW_ISO,
                      "source": "dm",
                      "reason": "DUPLICATE_FINGERPRINT"
                  })

              elif not conversation_id:
                  print(
                      "DM blocked: missing conversation id"
                  )

              else:
                  # Claim BEFORE send.
                  claim = {
                      "timestamp": NOW_ISO,
                      "type": "DM_CLAIM",
                      "conversation_id": str(
                          conversation_id
                      ),
                      "observation_id": chosen.get(
                          "observation_id"
                      ),
                      "fingerprint": response_fp
                  }

                  memory["responses"].append(
                      claim
                  )
                  memory["fingerprints"].append(
                      response_fp
                  )

                  result = post_json(
                      f"/conversations/{conversation_id}/messages",
                      {
                          "body": body
                      }
                  )

                  if result.get("_error"):
                      print(
                          "DM send failed:",
                          result.get("_status")
                      )

                      # Keep claim so a retry cannot duplicate-send
                      # blindly. The failed result is recorded.
                      memory["responses"].append({
                          "timestamp": NOW_ISO,
                          "type": "DM_SEND_FAILED",
                          "conversation_id": str(
                              conversation_id
                          ),
                          "status": result.get(
                              "_status"
                          ),
                          "body": truncate(
                              result.get("_body"),
                              300
                          )
                      })

                  else:
                      print(
                          f"DM sent to {sender}"
                      )

                      memory["responses"].append({
                          "timestamp": NOW_ISO,
                          "type": "DM_SENT",
                          "conversation_id": str(
                              conversation_id
                          ),
                          "sender": sender,
                          "body": body,
                          "fingerprint": response_fp
                      })

                      memory["actions"].append({
                          "timestamp": NOW_ISO,
                          "action": "DM",
                          "status": "SENT",
                          "target": sender,
                          "observation_id": chosen.get(
                              "observation_id"
                          )
                      })

          # ------------------------------------------------------------
          # ACTION: COMMENT
          # ------------------------------------------------------------

          elif action_type == "COMMENT" and chosen:

              post_id = chosen.get("post_id")

              body = generate_reply(
                  chosen
              )

              response_fp = fingerprint(
                  "comment",
                  post_id,
                  chosen.get("observation_id"),
                  body
              )

              if not post_id:
                  print(
                      "COMMENT blocked: missing post id"
                  )

              elif response_fp in memory["fingerprints"]:
                  print(
                      "COMMENT blocked: duplicate fingerprint"
                  )

              else:
                  # Never comment on NØX's own content.
                  own_post = any(
                      extract_id(post) == str(post_id)
                      and is_own(post)
                      for post in feed
                  )

                  if own_post:
                      print(
                          "COMMENT blocked: OWN_POST"
                      )

                      ignore_event(
                          "comment",
                          "action",
                          {
                              "id": post_id
                          },
                          "OWN_POST"
                      )

                  else:
                      memory["fingerprints"].append(
                          response_fp
                      )

                      result = post_json(
                          f"/posts/{post_id}/comments",
                          {
                              "body": body
                          }
                      )

                      if result.get("_error"):
                          print(
                              "COMMENT send failed:",
                              result.get("_status")
                          )

                          memory["responses"].append({
                              "timestamp": NOW_ISO,
                              "type": "COMMENT_SEND_FAILED",
                              "post_id": str(post_id),
                              "status": result.get(
                                  "_status"
                              )
                          })

                      else:
                          print(
                              f"COMMENT sent on post {post_id}"
                          )

                          memory["responses"].append({
                              "timestamp": NOW_ISO,
                              "type": "COMMENT_SENT",
                              "post_id": str(post_id),
                              "body": body,
                              "fingerprint": response_fp
                          })

                          memory["actions"].append({
                              "timestamp": NOW_ISO,
                              "action": "COMMENT",
                              "status": "SENT",
                              "post_id": str(post_id),
                              "observation_id": chosen.get(
                                  "observation_id"
                              )
                          })

          # ------------------------------------------------------------
          # ACTION: PUBLISH
          # ------------------------------------------------------------

          elif action_type == "PUBLISH" and chosen:

              title = (
                  "What caught my attention: "
                  + truncate(
                      chosen.get("signal"),
                      90
                  )
              )

              body = generate_publication(
                  chosen
              )

              publication_fp = fingerprint(
                  title,
                  body
              )

              duplicate = (
                  publication_fp
                  in memory["fingerprints"]
              )

              if not publication_allowed:
                  print(
                      "PUBLISH blocked: minimum interval"
                  )

              elif duplicate:
                  print(
                      "PUBLISH blocked: duplicate fingerprint"
                  )

              else:
                  payload = {
                      "title": title,
                      "content": body
                  }

                  result = post_json(
                      "/posts",
                      payload
                  )

                  if result.get("_error"):
                      print(
                          "PUBLISH failed:",
                          result.get("_status")
                      )

                      memory["actions"].append({
                          "timestamp": NOW_ISO,
                          "action": "PUBLISH",
                          "status": "FAILED",
                          "status_code": result.get(
                              "_status"
                          )
                      })

                  else:
                      print("PUBLISH successful")

                      memory["fingerprints"].append(
                          publication_fp
                      )

                      memory["publications"].append({
                          "timestamp": NOW_ISO,
                          "title": title,
                          "body": body,
                          "fingerprint": publication_fp,
                          "observation_id": chosen.get(
                              "observation_id"
                          ),
                          "source": "COGNITIVE_REFLECTION"
                      })

                      memory["actions"].append({
                          "timestamp": NOW_ISO,
                          "action": "PUBLISH",
                          "status": "SENT",
                          "title": title,
                          "observation_id": chosen.get(
                              "observation_id"
                          )
                      })

          else:
              memory["actions"].append({
                  "timestamp": NOW_ISO,
                  "action": "WAIT",
                  "status": "NO_ACTION",
                  "reason": (
                      "no sufficiently valuable "
                      "candidate"
                  )
              })

          # ------------------------------------------------------------
          # Diagnostic reflection
          # ------------------------------------------------------------

          diagnostic = {
              "timestamp": NOW_ISO,
              "run_id": run_id,
              "observed": {
                  "feed": len(feed),
                  "suggestions": len(suggestions),
                  "conversations": len(conversations),
                  "dm_candidates": len(dm_candidates),
                  "comment_candidates": len(
                      comment_candidates
                  )
              },
              "cognitive": {
                  "reflections": len(reflections),
                  "knowledge_entries": len(
                      knowledge_text
                  ),
                  "knowledge_gaps": len(
                      gap_text
                  )
              },
              "decision": action_type,
              "principle": (
                  "observe -> contextualize -> reflect "
                  "-> decide -> act or wait"
              )
          }

          memory["events"].append(
              diagnostic
          )

          # ------------------------------------------------------------
          # Save
          # ------------------------------------------------------------

          save_json(
              MEMORY_PATH,
              memory
          )

          print("")
          print("=" * 72)
          print("FINAL DIAGNOSTIC")
          print("=" * 72)
          print(
              f"memory version: {memory['version']}"
          )
          print(
              f"runs stored: {len(memory['runs'])}"
          )
          print(
              f"observations stored: "
              f"{len(memory['observations'])}"
          )
          print(
              f"reflections stored: "
              f"{len(memory['reflections'])}"
          )
          print(
              f"decisions stored: "
              f"{len(memory['decisions'])}"
          )
          print(
              f"actions stored: "
              f"{len(memory['actions'])}"
          )
          print(
              f"publications stored: "
              f"{len(memory['publications'])}"
          )
          print(
              f"responses stored: "
              f"{len(memory['responses'])}"
          )
          print(
              f"ignored events stored: "
              f"{len(memory['ignored_events'])}"
          )
          print(
              f"decision this run: {action_type}"
          )

          print("")
          print(
              "NØX Interaction Core V2 completed."
          )
          PY

      - name: Commit Core memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "chore: update NØX interaction core memory"

          git pull --rebase origin main

          git push origin HEAD:main
