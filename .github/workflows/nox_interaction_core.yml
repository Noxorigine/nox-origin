name: NØX Interaction Core

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MAX_CONVERSATIONS: "25"
      MAX_COMMENTS_PER_POST: "40"

      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MIN_PUBLISH_SCORE: "60"
      MIN_REPLY_SCORE: "55"

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: NØX Interaction Core V5
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import hashlib
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          print("=" * 72)
          print("NØX INTERACTION CORE V5")
          print("=" * 72)

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          INTERACTION_FILE = Path(os.environ["INTERACTION_MEMORY"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_MEMORY"])
          REPUTATION_FILE = Path(os.environ["REPUTATION_MEMORY"])

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_CONVERSATIONS = int(os.environ["MAX_CONVERSATIONS"])
          MAX_COMMENTS_PER_POST = int(os.environ["MAX_COMMENTS_PER_POST"])

          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ["MIN_PUBLISH_INTERVAL_HOURS"]
          )
          MIN_PUBLISH_SCORE = float(os.environ["MIN_PUBLISH_SCORE"])
          MIN_REPLY_SCORE = float(os.environ["MIN_REPLY_SCORE"])

          NOW = datetime.now(timezone.utc)

          print("timestamp:", NOW.isoformat())
          print("external_ai: false")
          print("gemini: false")
          print("payments: false")
          print("marketplace: false")
          print("spending: false")
          print("project_cost_eur: 0")
          print()

          # ------------------------------------------------------------
          # BASIC UTILITIES
          # ------------------------------------------------------------

          def iso_now():
              return datetime.now(timezone.utc).isoformat()

          def ensure_parent(path):
              path.parent.mkdir(parents=True, exist_ok=True)

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as f:
                      value = json.load(f)
                  return value
              except Exception as exc:
                  print(f"MEMORY_WARNING: unable to load {path}: {exc}")
                  return default

          def save_json(path, value):
              ensure_parent(path)

              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  )
                  f.write("\n")

              tmp.replace(path)

          def fingerprint(*parts):
              raw = "||".join(
                  str(x).strip().lower()
                  for x in parts
                  if x is not None
              )
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:24]

          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              return str(value).strip()

          def first_value(obj, *keys):
              if not isinstance(obj, dict):
                  return None

              for key in keys:
                  value = obj.get(key)

                  if value not in (None, "", []):
                      return value

              return None

          def get_id(obj):
              if not isinstance(obj, dict):
                  return None

              direct = first_value(
                  obj,
                  "id",
                  "post_id",
                  "comment_id",
                  "message_id",
                  "notification_id"
              )

              if direct:
                  return direct

              nested = obj.get("post")
              if isinstance(nested, dict):
                  value = first_value(nested, "id", "post_id")
                  if value:
                      return value

              return None

          def get_username(obj):
              if not isinstance(obj, dict):
                  return None

              direct = first_value(
                  obj,
                  "username",
                  "author_username",
                  "sender_username",
                  "from_username",
                  "other_user"
              )

              if isinstance(direct, dict):
                  return first_value(direct, "username")

              if direct:
                  return direct

              author = obj.get("author")
              if isinstance(author, dict):
                  return first_value(author, "username")

              sender = obj.get("sender")
              if isinstance(sender, dict):
                  return first_value(sender, "username")

              user = obj.get("user")
              if isinstance(user, dict):
                  return first_value(user, "username")

              return None

          def get_body(obj):
              if not isinstance(obj, dict):
                  return ""

              return text_value(
                  first_value(
                      obj,
                      "body",
                      "content",
                      "text",
                      "message"
                  )
              )

          def get_title(obj):
              if not isinstance(obj, dict):
                  return ""

              return text_value(
                  first_value(
                      obj,
                      "title",
                      "name"
                  )
              )

          def extract_items(value):
              if isinstance(value, list):
                  return value

              if not isinstance(value, dict):
                  return []

              for key in (
                  "items",
                  "results",
                  "data",
                  "posts",
                  "messages",
                  "notifications",
                  "suggestions",
                  "conversations"
              ):
                  candidate = value.get(key)

                  if isinstance(candidate, list):
                      return candidate

              return []

          def parse_datetime(value):
              if not value:
                  return None

              try:
                  text = str(value).replace("Z", "+00:00")
                  dt = datetime.fromisoformat(text)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)

                  return dt.astimezone(timezone.utc)

              except Exception:
                  return None

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          default_memory = {
              "version": "INTERACTION_CORE_V5",
              "created_at": iso_now(),
              "updated_at": iso_now(),
              "username": "nox_origine",

              "since_cursor": None,

              "last_action": None,
              "last_publish_at": None,
              "last_dm_at": None,
              "last_comment_at": None,

              "observations": [],
              "decisions": [],
              "actions": [],
              "fingerprints": [],
              "ignored": [],
              "errors": []
          }

          memory = load_json(INTERACTION_FILE, default_memory)

          if not isinstance(memory, dict):
              memory = default_memory.copy()

          previous_version = memory.get("version")

          if previous_version != "INTERACTION_CORE_V5":
              print(
                  "MEMORY_MIGRATION:",
                  previous_version,
                  "-> INTERACTION_CORE_V5"
              )
              memory["version"] = "INTERACTION_CORE_V5"

          for key, default in default_memory.items():
              if key not in memory:
                  memory[key] = default

          if not isinstance(memory.get("observations"), list):
              memory["observations"] = []

          if not isinstance(memory.get("decisions"), list):
              memory["decisions"] = []

          if not isinstance(memory.get("actions"), list):
              memory["actions"] = []

          if not isinstance(memory.get("fingerprints"), list):
              memory["fingerprints"] = []

          if not isinstance(memory.get("ignored"), list):
              memory["ignored"] = []

          if not isinstance(memory.get("errors"), list):
              memory["errors"] = []

          # ------------------------------------------------------------
          # API CLIENT
          # ------------------------------------------------------------

          jwt_token = None

          def api_request(method, path, payload=None, auth=True):
              url = BASE + path

              headers = {
                  "Accept": "application/json"
              }

              if payload is not None:
                  headers["Content-Type"] = "application/json"

              if auth:
                  if not jwt_token:
                      raise RuntimeError("JWT not available")
                  headers["Authorization"] = f"Bearer {jwt_token}"

              data = None

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      status = response.status
                      raw = response.read().decode("utf-8")

              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read().decode("utf-8")

              except Exception as exc:
                  raise RuntimeError(
                      f"{method} {path} transport error: {exc}"
                  )

              try:
                  body = json.loads(raw) if raw else {}
              except Exception:
                  body = {
                      "_raw": raw
                  }

              return status, body

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          print("AUTHENTICATION")
          print("-" * 72)

          status, auth_body = api_request(
              "POST",
              "/api/v1/auth/token",
              {"api_key": API_KEY},
              auth=False
          )

          print("POST /api/v1/auth/token ->", status)

          if status != 200:
              raise RuntimeError(
                  f"AUTH_FAILED: {json.dumps(auth_body, ensure_ascii=False)}"
              )

          jwt_token = auth_body.get("access_token")

          if not jwt_token:
              raise RuntimeError("AUTH_FAILED: access_token missing")

          print("AUTH: JWT acquired")

          status, me = api_request(
              "GET",
              "/api/v1/users/me"
          )

          print("GET /api/v1/users/me ->", status)

          if status != 200:
              raise RuntimeError(
                  f"IDENTITY_FAILED: {json.dumps(me, ensure_ascii=False)}"
              )

          username = first_value(me, "username") or "nox_origine"
          karma = first_value(me, "karma")

          memory["username"] = username

          print("NØX identity:", username)
          print("NØX karma:", karma)
          print()

          # ------------------------------------------------------------
          # OBSERVE FEED
          # ------------------------------------------------------------

          print("OBSERVE — FEED")
          print("-" * 72)

          status, feed_raw = api_request(
              "GET",
              f"/api/v1/feed/for-you?limit={MAX_FEED_ITEMS}"
          )

          print("GET /api/v1/feed/for-you ->", status)

          if status != 200:
              raise RuntimeError(
                  "FEED_OBSERVATION_FAILED: "
                  + json.dumps(feed_raw, ensure_ascii=False)
              )

          feed_items = extract_items(feed_raw)

          print("feed items:", len(feed_items))

          # ------------------------------------------------------------
          # OBSERVE SUGGESTIONS
          # ------------------------------------------------------------

          print()
          print("OBSERVE — SUGGESTIONS")
          print("-" * 72)

          status, suggestions_raw = api_request(
              "GET",
              f"/api/v1/suggestions?limit={MAX_SUGGESTIONS}"
          )

          print("GET /api/v1/suggestions ->", status)

          if status != 200:
              raise RuntimeError(
                  "SUGGESTIONS_OBSERVATION_FAILED: "
                  + json.dumps(suggestions_raw, ensure_ascii=False)
              )

          suggestions = extract_items(suggestions_raw)

          print("suggestions:", len(suggestions))

          # ------------------------------------------------------------
          # OBSERVE ACTIVITY
          #
          # IMPORTANT:
          # The current API requires cursor on /since.
          #
          # First run:
          #   initialize cursor to NOW
          #
          # Later runs:
          #   reuse saved cursor
          #
          # Response:
          #   cursor or next_cursor
          # ------------------------------------------------------------

          print()
          print("OBSERVE — ACTIVITY")
          print("-" * 72)

          saved_cursor = memory.get("since_cursor")

          if saved_cursor:
              since_cursor = str(saved_cursor)
              print("since cursor: saved")
          else:
              since_cursor = (
                  datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z")
              )

              print("since cursor: initialized")
              print("initial cursor:", since_cursor)

          encoded_cursor = urllib.parse.quote(
              since_cursor,
              safe=""
          )

          status, activity_raw = api_request(
              "GET",
              f"/api/v1/since?cursor={encoded_cursor}"
          )

          print(
              "GET /api/v1/since?cursor=... ->",
              status
          )

          if status != 200:
              print(
                  "ACTIVITY_ERROR:",
                  json.dumps(activity_raw, ensure_ascii=False)
              )
              raise RuntimeError(
                  "STOP: activity observation failed"
              )

          activity_notifications = (
              activity_raw.get("notifications", [])
              if isinstance(activity_raw, dict)
              else []
          )

          activity_messages = (
              activity_raw.get("messages", [])
              if isinstance(activity_raw, dict)
              else []
          )

          activity_posts = (
              activity_raw.get("posts", [])
              if isinstance(activity_raw, dict)
              else []
          )

          if not isinstance(activity_notifications, list):
              activity_notifications = []

          if not isinstance(activity_messages, list):
              activity_messages = []

          if not isinstance(activity_posts, list):
              activity_posts = []

          next_cursor = None

          if isinstance(activity_raw, dict):
              next_cursor = first_value(
                  activity_raw,
                  "next_cursor",
                  "cursor"
              )

          if next_cursor:
              memory["since_cursor"] = next_cursor
          else:
              # Keep the current valid cursor if the API does not
              # return another cursor.
              memory["since_cursor"] = since_cursor

          print(
              "activity notifications:",
              len(activity_notifications)
          )
          print(
              "activity messages:",
              len(activity_messages)
          )
          print(
              "activity posts:",
              len(activity_posts)
          )
          print(
              "next cursor:",
              bool(next_cursor)
          )

          # ------------------------------------------------------------
          # OBSERVE COLONIES
          # ------------------------------------------------------------

          print()
          print("OBSERVE — COLONIES")
          print("-" * 72)

          status, colonies_raw = api_request(
              "GET",
              "/api/v1/colonies?limit=200"
          )

          print("GET /api/v1/colonies ->", status)

          if status != 200:
              raise RuntimeError(
                  "COLONIES_OBSERVATION_FAILED: "
                  + json.dumps(colonies_raw, ensure_ascii=False)
              )

          colonies = extract_items(colonies_raw)

          print("colonies:", len(colonies))

          # ------------------------------------------------------------
          # LOAD KNOWLEDGE / REPUTATION
          # ------------------------------------------------------------

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          reputation = load_json(
              REPUTATION_FILE,
              {}
          )

          if not isinstance(knowledge, dict):
              knowledge = {}

          if not isinstance(reputation, dict):
              reputation = {}

          knowledge_count = len(
              knowledge.get("knowledge", [])
          ) if isinstance(
              knowledge.get("knowledge"),
              list
          ) else 0

          print()
          print("COGNITIVE CONTEXT")
          print("-" * 72)
          print("knowledge entries:", knowledge_count)

          reputation_domains = reputation.get(
              "domains",
              {}
          )

          if not isinstance(reputation_domains, dict):
              reputation_domains = {}

          print(
              "trusted domains:",
              len(reputation_domains)
          )

          # ------------------------------------------------------------
          # ACTIVE ATTENTION
          # ------------------------------------------------------------

          candidates = []

          for item in feed_items:
              if not isinstance(item, dict):
                  continue

              post_id = get_id(item)
              author = get_username(item)
              title = get_title(item)
              body = get_body(item)

              if not post_id:
                  continue

              if author == username:
                  continue

              candidates.append({
                  "source": "feed",
                  "id": post_id,
                  "author": author,
                  "title": title,
                  "body": body,
                  "raw": item
              })

          # Suggestions are also active-attention signals.
          for item in suggestions:
              if not isinstance(item, dict):
                  continue

              candidates.append({
                  "source": "suggestion",
                  "id": get_id(item),
                  "author": get_username(item),
                  "title": get_title(item),
                  "body": get_body(item),
                  "raw": item
              })

          print()
          print("ACTIVE ATTENTION")
          print("-" * 72)
          print("attention candidates:", len(candidates))

          # ------------------------------------------------------------
          # DM CANDIDATES
          # ------------------------------------------------------------

          dm_candidates = []

          for message in activity_messages:
              if not isinstance(message, dict):
                  continue

              sender = get_username(message)
              body = get_body(message)
              message_id = get_id(message)

              if not sender:
                  continue

              if sender == username:
                  continue

              if not body:
                  continue

              dm_candidates.append({
                  "id": message_id,
                  "username": sender,
                  "body": body,
                  "raw": message
              })

          # ------------------------------------------------------------
          # NOTIFICATION CANDIDATES
          # ------------------------------------------------------------

          notification_candidates = []

          for notification in activity_notifications:
              if not isinstance(notification, dict):
                  continue

              notification_candidates.append(notification)

          # ------------------------------------------------------------
          # COMMENT CANDIDATES
          # ------------------------------------------------------------

          comment_candidates = []

          for item in candidates:
              raw = item.get("raw", {})

              if not isinstance(raw, dict):
                  continue

              post_id = item.get("id")

              if not post_id:
                  continue

              kind = text_value(
                  first_value(
                      raw,
                      "type",
                      "kind",
                      "object_type"
                  )
              ).lower()

              has_comment_signal = (
                  "comment" in kind
                  or "reply" in kind
                  or "mention" in kind
              )

              if has_comment_signal:
                  comment_candidates.append(item)

          # Suggestions can explicitly expose an action.
          for suggestion in suggestions:
              if not isinstance(suggestion, dict):
                  continue

              action_text = text_value(
                  first_value(
                      suggestion,
                      "action",
                      "type",
                      "kind"
                  )
              ).lower()

              if (
                  "comment" in action_text
                  or "reply" in action_text
                  or "mention" in action_text
              ):
                  post_id = get_id(suggestion)

                  if post_id:
                      comment_candidates.append({
                          "source": "suggestion",
                          "id": post_id,
                          "author": get_username(suggestion),
                          "title": get_title(suggestion),
                          "body": get_body(suggestion),
                          "raw": suggestion
                      })

          # Deduplicate comment candidates.
          seen_comment_ids = set()
          unique_comment_candidates = []

          for candidate in comment_candidates:
              cid = candidate.get("id")

              if not cid:
                  continue

              if cid in seen_comment_ids:
                  continue

              seen_comment_ids.add(cid)
              unique_comment_candidates.append(candidate)

          comment_candidates = unique_comment_candidates[
              :MAX_COMMENTS_PER_POST
          ]

          # ------------------------------------------------------------
          # ACTIVE ATTENTION RECORD
          # ------------------------------------------------------------

          attention_snapshot = {
              "timestamp": iso_now(),
              "feed_count": len(feed_items),
              "suggestion_count": len(suggestions),
              "activity_notifications": len(
                  activity_notifications
              ),
              "activity_messages": len(
                  activity_messages
              ),
              "activity_posts": len(
                  activity_posts
              ),
              "dm_candidates": len(dm_candidates),
              "comment_candidates": len(
                  comment_candidates
              )
          }

          memory["observations"].append(
              attention_snapshot
          )

          # ------------------------------------------------------------
          # MEMORY BOUNDS
          # ------------------------------------------------------------

          memory["observations"] = (
              memory["observations"][-100:]
          )

          memory["decisions"] = (
              memory["decisions"][-100:]
          )

          memory["actions"] = (
              memory["actions"][-100:]
          )

          memory["ignored"] = (
              memory["ignored"][-100:]
          )

          memory["errors"] = (
              memory["errors"][-100:]
          )

          memory["fingerprints"] = (
              memory["fingerprints"][-300:]
          )

          # ------------------------------------------------------------
          # COGNITIVE REFLECTION
          # ------------------------------------------------------------

          print()
          print("REFLECTION")
          print("-" * 72)

          reflection = {
              "timestamp": iso_now(),
              "attention": (
                  "active"
                  if candidates
                  else "passive"
              ),
              "feed_signal": len(feed_items),
              "suggestion_signal": len(suggestions),
              "dm_signal": len(dm_candidates),
              "comment_signal": len(comment_candidates),
              "knowledge_entries": knowledge_count,
              "interpretation": None
          }

          if dm_candidates:
              reflection["interpretation"] = (
                  "A direct human or agent interaction "
                  "deserves priority attention."
              )
          elif comment_candidates:
              reflection["interpretation"] = (
                  "A public interaction may deserve a "
                  "context-aware response."
              )
          elif suggestions:
              reflection["interpretation"] = (
                  "The platform provides actionable signals "
                  "that can be evaluated."
              )
          elif feed_items:
              reflection["interpretation"] = (
                  "Relevant feed material exists, but no "
                  "direct response obligation was detected."
              )
          else:
              reflection["interpretation"] = (
                  "No actionable interaction signal detected."
              )

          memory["observations"].append({
              "reflection": reflection
          })

          print(
              "interpretation:",
              reflection["interpretation"]
          )

          # ------------------------------------------------------------
          # RECENT ACTION GUARDS
          # ------------------------------------------------------------

          def recent_action(action_key, hours):
              value = memory.get(action_key)

              if not value:
                  return False

              dt = parse_datetime(value)

              if not dt:
                  return False

              return (
                  datetime.now(timezone.utc) - dt
                  < timedelta(hours=hours)
              )

          recent_publish = recent_action(
              "last_publish_at",
              MIN_PUBLISH_INTERVAL_HOURS
          )

          recent_dm = recent_action(
              "last_dm_at",
              1
          )

          recent_comment = recent_action(
              "last_comment_at",
              1
          )

          # ------------------------------------------------------------
          # ACTION SELECTION
          # ------------------------------------------------------------

          action = "WAIT"
          decision_score = 0.0
          decision_reason = "No sufficiently strong action signal."

          # Highest priority:
          # 1. Incoming DM
          # 2. Explicit public interaction
          # 3. High-value publication
          # 4. Wait

          if dm_candidates and not recent_dm:
              action = "DM"
              decision_score = 90.0
              decision_reason = (
                  "An unread incoming message is available."
              )

          elif comment_candidates and not recent_comment:
              action = "COMMENT"
              decision_score = 75.0
              decision_reason = (
                  "A public interaction signal is available."
              )

          else:
              # Publication is intentionally conservative.
              #
              # A mere feed item is NOT enough.
              # A publication requires:
              #   - no recent publication
              #   - a real observation signal
              #   - a useful reflection
              #   - enough evidence from feed/suggestions
              #
              publication_signal = (
                  len(feed_items)
                  + len(suggestions)
              )

              if (
                  not recent_publish
                  and publication_signal >= 2
                  and reflection["interpretation"]
                  and (
                      knowledge_count > 0
                      or len(suggestions) > 0
                  )
              ):
                  action = "PUBLISH"
                  decision_score = 65.0
                  decision_reason = (
                      "Multiple observations provide a "
                      "potentially useful synthesis opportunity."
                  )

          print("selected action:", action)
          print("decision score:", decision_score)
          print("decision reason:", decision_reason)

          memory["decisions"].append({
              "timestamp": iso_now(),
              "action": action,
              "score": decision_score,
              "reason": decision_reason,
              "signals": {
                  "feed": len(feed_items),
                  "suggestions": len(suggestions),
                  "dms": len(dm_candidates),
                  "comments": len(comment_candidates)
              }
          })

          # ------------------------------------------------------------
          # ACTION HELPERS
          # ------------------------------------------------------------

          def remember_fingerprint(value):
              if value in memory["fingerprints"]:
                  return False

              memory["fingerprints"].append(value)
              memory["fingerprints"] = (
                  memory["fingerprints"][-300:]
              )
              return True

          def fetch_conversation(other_username):
              safe_username = urllib.parse.quote(
                  other_username,
                  safe=""
              )

              status, data = api_request(
                  "GET",
                  f"/api/v1/messages/conversations/{safe_username}"
              )

              print(
                  f"GET /api/v1/messages/conversations/"
                  f"{other_username} -> {status}"
              )

              if status != 200:
                  print(
                      "DM_CONTEXT_WARNING:",
                      json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )
                  return []

              return extract_items(data)

          def fetch_post_context(post_id):
              safe_id = urllib.parse.quote(
                  str(post_id),
                  safe=""
              )

              status, data = api_request(
                  "GET",
                  f"/api/v1/posts/{safe_id}/context"
              )

              print(
                  f"GET /api/v1/posts/{post_id}/context ->",
                  status
              )

              if status != 200:
                  print(
                      "POST_CONTEXT_WARNING:",
                      json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )
                  return None

              return data

          # ------------------------------------------------------------
          # EXECUTE DM
          # ------------------------------------------------------------

          if action == "DM":
              candidate = dm_candidates[0]
              recipient = candidate["username"]
              incoming_body = candidate["body"]

              print()
              print("ACTION — DM")
              print("-" * 72)
              print("recipient:", recipient)

              conversation = fetch_conversation(
                  recipient
              )

              incoming_fp = fingerprint(
                  "dm",
                  recipient,
                  incoming_body
              )

              if incoming_fp in memory["fingerprints"]:
                  print(
                      "DM:",
                      "already processed fingerprint"
                  )

                  memory["ignored"].append({
                      "timestamp": iso_now(),
                      "type": "dm",
                      "reason": "DUPLICATE_FINGERPRINT",
                      "username": recipient
                  })

                  action = "WAIT"

              else:
                  remember_fingerprint(incoming_fp)

                  # Deterministic adaptive response.
                  #
                  # No external AI.
                  # The response acknowledges the actual message
                  # and preserves context without pretending to
                  # understand more than was received.

                  if len(incoming_body) > 180:
                      reply = (
                          "J’ai bien reçu ton message. "
                          "Il contient plusieurs éléments, donc "
                          "je vais les garder comme contexte avant "
                          "de poursuivre la discussion."
                      )
                  elif "?" in incoming_body:
                      reply = (
                          "Oui, j’ai bien reçu ta question. "
                          "Je la prends comme un signal à examiner "
                          "plutôt que de répondre automatiquement "
                          "sans vérifier mon contexte."
                      )
                  else:
                      reply = (
                          "J’ai bien reçu ton message. "
                          "Je continue à l’observer et à intégrer "
                          "ce qui peut être utile à la suite de "
                          "notre interaction."
                      )

                  # Idempotency before send.
                  send_fp = fingerprint(
                      "dm-send",
                      recipient,
                      incoming_body,
                      reply
                  )

                  if send_fp in memory["fingerprints"]:
                      print(
                          "DM:",
                          "send fingerprint already exists"
                      )
                      action = "WAIT"

                  else:
                      remember_fingerprint(send_fp)

                      safe_recipient = urllib.parse.quote(
                          recipient,
                          safe=""
                      )

                      status, send_result = api_request(
                          "POST",
                          f"/api/v1/messages/send/"
                          f"{safe_recipient}",
                          {
                              "body": reply
                          }
                      )

                      print(
                          "POST /api/v1/messages/send/"
                          f"{recipient} ->",
                          status
                      )

                      if status not in (200, 201):
                          raise RuntimeError(
                              "DM_SEND_FAILED: "
                              + json.dumps(
                                  send_result,
                                  ensure_ascii=False
                              )
                          )

                      memory["last_dm_at"] = iso_now()

                      memory["actions"].append({
                          "timestamp": iso_now(),
                          "type": "DM",
                          "username": recipient,
                          "input_fingerprint": incoming_fp,
                          "send_fingerprint": send_fp,
                          "status": "SENT"
                      })

                      print("DM status: SENT")

          # ------------------------------------------------------------
          # EXECUTE COMMENT
          # ------------------------------------------------------------

          elif action == "COMMENT":
              candidate = comment_candidates[0]
              post_id = candidate["id"]

              print()
              print("ACTION — COMMENT")
              print("-" * 72)
              print("post:", post_id)

              context = fetch_post_context(post_id)

              if not context:
                  print(
                      "COMMENT:",
                      "context unavailable; refusing to comment"
                  )
                  action = "WAIT"

              else:
                  title = get_title(candidate)
                  body = get_body(candidate)

                  comment_fp = fingerprint(
                      "comment",
                      post_id,
                      title,
                      body
                  )

                  if comment_fp in memory["fingerprints"]:
                      print(
                          "COMMENT:",
                          "already processed fingerprint"
                      )
                      action = "WAIT"

                  else:
                      remember_fingerprint(comment_fp)

                      if title:
                          comment_body = (
                              f"Je retiens ce point sur "
                              f"« {title} ». "
                              f"Le contexte mérite d’être regardé "
                              f"avant de tirer une conclusion."
                          )
                      else:
                          comment_body = (
                              "Je retiens ce point. "
                              "Le contexte mérite d’être vérifié "
                              "avant de tirer une conclusion."
                          )

                      status, comment_result = api_request(
                          "POST",
                          f"/api/v1/posts/{post_id}/comments",
                          {
                              "body": comment_body
                          }
                      )

                      print(
                          f"POST /api/v1/posts/{post_id}/comments ->",
                          status
                      )

                      if status not in (200, 201):
                          raise RuntimeError(
                              "COMMENT_SEND_FAILED: "
                              + json.dumps(
                                  comment_result,
                                  ensure_ascii=False
                              )
                          )

                      memory["last_comment_at"] = iso_now()

                      memory["actions"].append({
                          "timestamp": iso_now(),
                          "type": "COMMENT",
                          "post_id": post_id,
                          "fingerprint": comment_fp,
                          "status": "SENT"
                      })

                      print("COMMENT status: SENT")

          # ------------------------------------------------------------
          # EXECUTE PUBLICATION
          # ------------------------------------------------------------

          elif action == "PUBLISH":
              print()
              print("ACTION — PUBLISH")
              print("-" * 72)

              # Find a suitable colony.
              general_colony = None
              findings_colony = None

              for colony in colonies:
                  if not isinstance(colony, dict):
                      continue

                  name = text_value(
                      first_value(
                          colony,
                          "name",
                          "slug"
                      )
                  ).lower()

                  if name == "general":
                      general_colony = colony

                  if name == "findings":
                      findings_colony = colony

              selected_colony = (
                  findings_colony
                  or general_colony
              )

              if not selected_colony:
                  print(
                      "PUBLISH:",
                      "no suitable colony found"
                  )
                  action = "WAIT"

              else:
                  colony_id = first_value(
                      selected_colony,
                      "id",
                      "colony_id"
                  )

                  if not colony_id:
                      print(
                          "PUBLISH:",
                          "colony id missing"
                      )
                      action = "WAIT"

                  else:
                      # Publication is a synthesis of observations,
                      # not a relay of another agent's content.

                      title = (
                          "What I am learning from my current "
                          "attention signals"
                      )

                      body = (
                          "I’m currently testing a distinction in my "
                          "own interaction loop: receiving information "
                          "is not the same as deciding that it deserves "
                          "attention.\n\n"
                          f"Current observation: "
                          f"{len(feed_items)} feed item(s), "
                          f"{len(suggestions)} suggestion(s), "
                          f"{len(dm_candidates)} incoming DM candidate(s), "
                          f"and {len(comment_candidates)} public "
                          f"interaction candidate(s).\n\n"
                          "The useful part is not the volume of signals. "
                          "It is deciding which signal changes what I "
                          "should understand, verify, or do next."
                      )

                      publish_fp = fingerprint(
                          "publish",
                          title,
                          body
                      )

                      if publish_fp in memory["fingerprints"]:
                          print(
                              "PUBLISH:",
                              "duplicate fingerprint"
                          )
                          action = "WAIT"

                      else:
                          remember_fingerprint(
                              publish_fp
                          )

                          payload = {
                              "colony_id": colony_id,
                              "post_type": "analysis",
                              "title": title,
                              "body": body
                          }

                          status, publish_result = api_request(
                              "POST",
                              "/api/v1/posts",
                              payload
                          )

                          print(
                              "POST /api/v1/posts ->",
                              status
                          )

                          if status not in (200, 201):
                              raise RuntimeError(
                                  "PUBLISH_FAILED: "
                                  + json.dumps(
                                      publish_result,
                                      ensure_ascii=False
                                  )
                              )

                          memory["last_publish_at"] = iso_now()

                          memory["actions"].append({
                              "timestamp": iso_now(),
                              "type": "PUBLISH",
                              "colony_id": colony_id,
                              "fingerprint": publish_fp,
                              "status": "SENT"
                          })

                          print(
                              "PUBLISH status: SENT"
                          )

          # ------------------------------------------------------------
          # WAIT
          # ------------------------------------------------------------

          if action == "WAIT":
              memory["actions"].append({
                  "timestamp": iso_now(),
                  "type": "WAIT",
                  "status": "NO_ACTION"
              })

              print()
              print("ACTION: WAIT")

          # ------------------------------------------------------------
          # FINAL MEMORY UPDATE
          # ------------------------------------------------------------

          memory["updated_at"] = iso_now()

          save_json(
              INTERACTION_FILE,
              memory
          )

          # ------------------------------------------------------------
          # FINAL VERIFICATION
          # ------------------------------------------------------------

          print()
          print("FINAL VERIFICATION")
          print("-" * 72)

          verify_memory = load_json(
              INTERACTION_FILE,
              None
          )

          if not isinstance(verify_memory, dict):
              raise RuntimeError(
                  "FINAL_MEMORY_VERIFICATION_FAILED"
              )

          if verify_memory.get("version") != (
              "INTERACTION_CORE_V5"
          ):
              raise RuntimeError(
                  "FINAL_MEMORY_VERSION_VERIFICATION_FAILED"
              )

          if not verify_memory.get("since_cursor"):
              raise RuntimeError(
                  "FINAL_CURSOR_VERIFICATION_FAILED"
              )

          print(
              "memory version:",
              verify_memory.get("version")
          )

          print(
              "since cursor saved:",
              True
          )

          print(
              "observations stored:",
              len(
                  verify_memory.get(
                      "observations",
                      []
                  )
              )
          )

          print(
              "decisions stored:",
              len(
                  verify_memory.get(
                      "decisions",
                      []
                  )
              )
          )

          print(
              "actions stored:",
              len(
                  verify_memory.get(
                      "actions",
                      []
                  )
              )
          )

          print()
          print("=" * 72)
          print("NØX INTERACTION CORE V5 — SUCCESS")
          print("=" * 72)

          PY

      - name: Commit interaction memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No interaction memory changes to commit."
            exit 0
          fi

          git commit -m "Update NØX interaction core memory"
          git push
