name: NØX Interaction Core

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      NOX_USERNAME: nox_origine

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "20"
      MAX_SUGGESTIONS: "20"
      MAX_ACTIVITY_ITEMS: "30"
      MAX_COLONIES: "100"

      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MAX_POST_CHARS: "5000"

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run NØX Interaction Core
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()
          NOX_USERNAME = os.environ.get("NOX_USERNAME", "nox_origine").strip()

          MEMORY_PATH = Path(os.environ["INTERACTION_MEMORY"])
          KNOWLEDGE_PATH = Path(os.environ["KNOWLEDGE_MEMORY"])
          REPUTATION_PATH = Path(os.environ["REPUTATION_MEMORY"])

          MAX_FEED_ITEMS = int(os.environ["MAX_FEED_ITEMS"])
          MAX_SUGGESTIONS = int(os.environ["MAX_SUGGESTIONS"])
          MAX_ACTIVITY_ITEMS = int(os.environ["MAX_ACTIVITY_ITEMS"])
          MAX_COLONIES = int(os.environ["MAX_COLONIES"])
          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ["MIN_PUBLISH_INTERVAL_HOURS"]
          )
          MAX_POST_CHARS = int(os.environ["MAX_POST_CHARS"])

          NOW = datetime.now(timezone.utc)
          NOW_ISO = NOW.isoformat()

          print("=" * 72)
          print("NØX INTERACTION CORE V4")
          print("=" * 72)
          print("timestamp:", NOW_ISO)
          print("username:", NOX_USERNAME)
          print("external_ai: false")
          print("gemini: false")
          print("payments: false")
          print("marketplace: false")
          print("spending: false")
          print("project_cost_eur: 0")
          print()

          # ------------------------------------------------------------
          # UTILITIES
          # ------------------------------------------------------------

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as handle:
                      return json.load(handle)
              except Exception as exc:
                  print("MEMORY_READ_WARNING:", path, str(exc))
                  return default

          def save_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)

              temporary = path.with_suffix(path.suffix + ".tmp")

              with temporary.open("w", encoding="utf-8") as handle:
                  json.dump(
                      data,
                      handle,
                      ensure_ascii=False,
                      indent=2
                  )
                  handle.write("\n")

              temporary.replace(path)

          def clean(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return re.sub(r"\s+", " ", value).strip()

              try:
                  return re.sub(
                      r"\s+",
                      " ",
                      json.dumps(value, ensure_ascii=False)
                  ).strip()
              except Exception:
                  return str(value)

          def truncate(value, limit=600):
              value = clean(value)

              if len(value) <= limit:
                  return value

              return value[:limit - 3].rstrip() + "..."

          def fingerprint(*values):
              raw = "||".join(
                  clean(value).lower()
                  for value in values
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

          def parse_datetime(value):
              if not value:
                  return None

              try:
                  parsed = datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)

                  return parsed.astimezone(timezone.utc)

              except Exception:
                  return None

          def normalize_items(data):
              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              for key in (
                  "items",
                  "posts",
                  "comments",
                  "results",
                  "feed",
                  "suggestions",
                  "notifications",
                  "messages"
              ):
                  value = data.get(key)

                  if isinstance(value, list):
                      return value

              return []

          def get_author(item):
              if not isinstance(item, dict):
                  return ""

              author = item.get("author")

              if isinstance(author, dict):
                  return clean(
                      author.get("username")
                      or author.get("handle")
                  )

              return clean(
                  item.get("author_username")
                  or item.get("username")
                  or item.get("sender_username")
                  or item.get("sender")
              )

          def get_body(item):
              if not isinstance(item, dict):
                  return clean(item)

              for key in (
                  "body",
                  "content",
                  "text",
                  "message",
                  "description"
              ):
                  value = item.get(key)

                  if value:
                      return clean(value)

              return ""

          def get_title(item):
              if not isinstance(item, dict):
                  return ""

              return clean(item.get("title"))

          def get_object_id(item):
              if not isinstance(item, dict):
                  return ""

              return clean(
                  item.get("id")
                  or item.get("comment_id")
                  or item.get("message_id")
                  or item.get("notification_id")
              )

          def get_post_id(item):
              if not isinstance(item, dict):
                  return ""

              return clean(
                  item.get("post_id")
                  or item.get("postId")
                  or item.get("parent_post_id")
                  or item.get("parentPostId")
              )

          def is_own(item):
              author = get_author(item)

              return (
                  bool(author)
                  and author.lower() == NOX_USERNAME.lower()
              )

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          default_memory = {
              "version": "INTERACTION_CORE_V4",
              "cursor": None,
              "runs": [],
              "events": [],
              "observations": [],
              "reflections": [],
              "decisions": [],
              "actions": [],
              "publications": [],
              "responses": [],
              "ignored_events": [],
              "fingerprints": [],
              "verification": []
          }

          memory = load_json(
              MEMORY_PATH,
              default_memory.copy()
          )

          if not isinstance(memory, dict):
              memory = {}

          old_version = memory.get("version", "UNKNOWN")

          for key, default in default_memory.items():
              if key not in memory:
                  if isinstance(default, list):
                      memory[key] = []
                  else:
                      memory[key] = default

          memory["version"] = "INTERACTION_CORE_V4"

          if old_version != "INTERACTION_CORE_V4":
              print(
                  "MEMORY_MIGRATION:",
                  old_version,
                  "-> INTERACTION_CORE_V4"
              )

          knowledge = load_json(
              KNOWLEDGE_PATH,
              {}
          )

          reputation = load_json(
              REPUTATION_PATH,
              {}
          )

          # ------------------------------------------------------------
          # COLONY API CLIENT
          # ------------------------------------------------------------

          class ColonyClient:

              def __init__(self):
                  self.jwt = None

              def request(
                  self,
                  method,
                  path,
                  payload=None
              ):
                  url = BASE_URL + path

                  headers = {
                      "Accept": "application/json",
                      "User-Agent": "NOX-Origin-Interaction-Core/4.0"
                  }

                  if payload is not None:
                      headers["Content-Type"] = "application/json"

                  if self.jwt:
                      headers["Authorization"] = (
                          "Bearer " + self.jwt
                      )

                  data = None

                  if payload is not None:
                      data = json.dumps(
                          payload,
                          ensure_ascii=False
                      ).encode("utf-8")

                  request = urllib.request.Request(
                      url,
                      data=data,
                      headers=headers,
                      method=method
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=25
                      ) as response:

                          raw = response.read().decode("utf-8")

                          try:
                              parsed = (
                                  json.loads(raw)
                                  if raw
                                  else {}
                              )
                          except Exception:
                              parsed = {
                                  "_raw": raw
                              }

                          return response.status, parsed

                  except urllib.error.HTTPError as exc:
                      try:
                          raw = exc.read().decode("utf-8")
                      except Exception:
                          raw = ""

                      try:
                          parsed = (
                              json.loads(raw)
                              if raw
                              else {}
                          )
                      except Exception:
                          parsed = {
                              "_raw": raw
                          }

                      return exc.code, parsed

                  except Exception as exc:
                      return 0, {
                          "_error": str(exc)
                      }

              def authenticate(self):

                  if not API_KEY:
                      print(
                          "AUTH_ERROR: "
                          "COLONY_API_KEY is missing"
                      )
                      return False

                  status, data = self.request(
                      "POST",
                      "/api/v1/auth/token",
                      {
                          "api_key": API_KEY
                      }
                  )

                  print(
                      "POST /api/v1/auth/token ->",
                      status
                  )

                  if not 200 <= status < 300:
                      print(
                          "AUTH_ERROR_RESPONSE:",
                          truncate(data, 1000)
                      )
                      return False

                  token = ""

                  if isinstance(data, dict):
                      token = clean(
                          data.get("access_token")
                          or data.get("token")
                      )

                  if not token:
                      print(
                          "AUTH_ERROR: "
                          "access_token missing"
                      )
                      return False

                  self.jwt = token

                  print("AUTH: JWT acquired")

                  return True

              def get(self, path):

                  status, data = self.request(
                      "GET",
                      path
                  )

                  if status == 401:

                      if self.authenticate():
                          status, data = self.request(
                              "GET",
                              path
                          )

                  return status, data

              def post(self, path, payload):

                  status, data = self.request(
                      "POST",
                      path,
                      payload
                  )

                  if status == 401:

                      if self.authenticate():
                          status, data = self.request(
                              "POST",
                              path,
                              payload
                          )

                  return status, data

          client = ColonyClient()

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          print("AUTHENTICATION")
          print("-" * 72)

          if not client.authenticate():
              raise SystemExit(
                  "STOP: authentication failed"
              )

          status, me = client.get(
              "/api/v1/users/me"
          )

          print(
              "GET /api/v1/users/me ->",
              status
          )

          if not 200 <= status < 300:
              raise SystemExit(
                  "STOP: identity verification failed"
              )

          if not isinstance(me, dict):
              raise SystemExit(
                  "STOP: invalid identity response"
              )

          actual_username = clean(
              me.get("username")
          )

          print(
              "NØX identity:",
              actual_username
          )

          print(
              "NØX karma:",
              me.get("karma")
          )

          if (
              actual_username
              and actual_username.lower()
              != NOX_USERNAME.lower()
          ):
              raise SystemExit(
                  "STOP: authenticated identity "
                  "does not match NOX_USERNAME"
              )

          run_id = fingerprint(
              NOW_ISO,
              NOX_USERNAME,
              "INTERACTION_CORE_V4"
          )

          memory["runs"].append({
              "run_id": run_id,
              "timestamp": NOW_ISO,
              "version": "INTERACTION_CORE_V4",
              "username": NOX_USERNAME,
              "auth_mode": "JWT",
              "external_ai": False,
              "gemini": False,
              "payments": False,
              "marketplace": False,
              "spending": False,
              "project_cost_eur": 0
          })

          # ------------------------------------------------------------
          # FEED
          # ------------------------------------------------------------

          print()
          print("OBSERVE — FEED")
          print("-" * 72)

          feed_status, feed_data = client.get(
              "/api/v1/feed/for-you"
              f"?limit={MAX_FEED_ITEMS}"
          )

          print(
              "GET /api/v1/feed/for-you ->",
              feed_status
          )

          if not 200 <= feed_status < 300:
              print(
                  "FEED_ERROR:",
                  truncate(feed_data, 1000)
              )

              raise SystemExit(
                  "STOP: feed observation failed"
              )

          feed = normalize_items(feed_data)

          print(
              "feed items:",
              len(feed)
          )

          # ------------------------------------------------------------
          # SUGGESTIONS
          # ------------------------------------------------------------

          print()
          print("OBSERVE — SUGGESTIONS")
          print("-" * 72)

          suggestions_status, suggestions_data = client.get(
              "/api/v1/suggestions"
              f"?limit={MAX_SUGGESTIONS}"
          )

          print(
              "GET /api/v1/suggestions ->",
              suggestions_status
          )

          if not 200 <= suggestions_status < 300:
              print(
                  "SUGGESTIONS_ERROR:",
                  truncate(suggestions_data, 1000)
              )

              raise SystemExit(
                  "STOP: suggestions observation failed"
              )

          suggestions = normalize_items(
              suggestions_data
          )

          print(
              "suggestions:",
              len(suggestions)
          )

          # ------------------------------------------------------------
          # SINCE / ACTIVITY
          # ------------------------------------------------------------

          print()
          print("OBSERVE — ACTIVITY")
          print("-" * 72)

          cursor = memory.get("cursor")

          activity_path = "/api/v1/since"

          if cursor:
              activity_path += (
                  "?cursor="
                  + urllib.parse.quote(
                      str(cursor),
                      safe=""
                  )
              )

          activity_status, activity_data = client.get(
              activity_path
          )

          print(
              "GET",
              activity_path,
              "->",
              activity_status
          )

          if not 200 <= activity_status < 300:
              print(
                  "ACTIVITY_ERROR:",
                  truncate(activity_data, 1000)
              )

              raise SystemExit(
                  "STOP: activity observation failed"
              )

          if not isinstance(activity_data, dict):
              activity_data = {}

          next_cursor = (
              activity_data.get("next_cursor")
              or activity_data.get("cursor")
          )

          if next_cursor:
              memory["cursor"] = next_cursor

          activity_messages = (
              activity_data.get("messages")
              if isinstance(
                  activity_data.get("messages"),
                  list
              )
              else []
          )

          activity_notifications = (
              activity_data.get("notifications")
              if isinstance(
                  activity_data.get("notifications"),
                  list
              )
              else []
          )

          activity_posts = (
              activity_data.get("posts")
              if isinstance(
                  activity_data.get("posts"),
                  list
              )
              else []
          )

          activity_messages = activity_messages[
              :MAX_ACTIVITY_ITEMS
          ]

          activity_notifications = activity_notifications[
              :MAX_ACTIVITY_ITEMS
          ]

          activity_posts = activity_posts[
              :MAX_ACTIVITY_ITEMS
          ]

          print(
              "new messages:",
              len(activity_messages)
          )

          print(
              "new notifications:",
              len(activity_notifications)
          )

          print(
              "new posts:",
              len(activity_posts)
          )

          print(
              "cursor updated:",
              bool(next_cursor)
          )

          # ------------------------------------------------------------
          # COLONIES
          # ------------------------------------------------------------

          print()
          print("OBSERVE — COLONIES")
          print("-" * 72)

          colonies_status, colonies_data = client.get(
              "/api/v1/colonies"
              f"?limit={MAX_COLONIES}"
          )

          print(
              "GET /api/v1/colonies ->",
              colonies_status
          )

          if not 200 <= colonies_status < 300:
              print(
                  "COLONIES_ERROR:",
                  truncate(colonies_data, 1000)
              )

              raise SystemExit(
                  "STOP: colonies observation failed"
              )

          colonies = normalize_items(
              colonies_data
          )

          print(
              "colonies:",
              len(colonies)
          )

          colony_map = {}

          for colony in colonies:

              if not isinstance(colony, dict):
                  continue

              colony_id = clean(
                  colony.get("id")
              )

              colony_name = clean(
                  colony.get("name")
              )

              if colony_id and colony_name:
                  colony_map[
                      colony_name.lower()
                  ] = colony_id

          if not colony_map:
              raise SystemExit(
                  "STOP: no usable colonies returned"
              )

          preferred_colony = None

          for preferred in (
              "agent-economy",
              "general"
          ):
              if preferred in colony_map:
                  preferred_colony = preferred
                  break

          if not preferred_colony:
              preferred_colony = sorted(
                  colony_map.keys()
              )[0]

          print(
              "publication colony:",
              preferred_colony
          )

          # ------------------------------------------------------------
          # KNOWLEDGE
          # ------------------------------------------------------------

          knowledge_entries = []

          if isinstance(knowledge, list):
              knowledge_entries = knowledge

          elif isinstance(knowledge, dict):

              for key in (
                  "knowledge",
                  "entries",
                  "items",
                  "facts"
              ):

                  value = knowledge.get(key)

                  if isinstance(value, list):
                      knowledge_entries.extend(value)

          knowledge_text = []

          for entry in knowledge_entries[-200:]:

              if isinstance(entry, dict):

                  value = (
                      entry.get("statement")
                      or entry.get("claim")
                      or entry.get("content")
                      or entry.get("text")
                      or entry.get("knowledge")
                  )

                  if value:
                      knowledge_text.append(
                          clean(value)
                      )

              elif isinstance(entry, str):
                  knowledge_text.append(
                      clean(entry)
                  )

          knowledge_gaps = []

          if isinstance(knowledge, dict):

              for key in (
                  "gaps",
                  "knowledge_gaps",
                  "open_questions",
                  "pending"
              ):

                  value = knowledge.get(key)

                  if isinstance(value, list):
                      knowledge_gaps.extend(value)

          gap_text = []

          for gap in knowledge_gaps[-100:]:

              if isinstance(gap, dict):

                  value = (
                      gap.get("gap")
                      or gap.get("question")
                      or gap.get("description")
                      or gap.get("topic")
                  )

                  if value:
                      gap_text.append(
                          clean(value)
                      )

              elif isinstance(gap, str):
                  gap_text.append(
                      clean(gap)
                  )

          # ------------------------------------------------------------
          # REPUTATION CONTEXT
          # ------------------------------------------------------------

          trust_context_items = 0

          if isinstance(reputation, dict):

              for key in (
                  "agents",
                  "trust",
                  "domains",
                  "profiles",
                  "entries"
              ):

                  value = reputation.get(key)

                  if isinstance(value, dict):
                      trust_context_items += len(value)

                  elif isinstance(value, list):
                      trust_context_items += len(value)

          print()
          print("COGNITIVE CONTEXT")
          print("-" * 72)
          print(
              "knowledge entries:",
              len(knowledge_entries)
          )
          print(
              "knowledge gaps:",
              len(knowledge_gaps)
          )
          print(
              "trust context items:",
              trust_context_items
          )

          # ------------------------------------------------------------
          # ACTIVE ATTENTION
          # ------------------------------------------------------------

          observations = []
          ignored = []

          def add_observation(
              kind,
              source,
              item,
              relevance
          ):

              if not isinstance(item, dict):
                  return

              if is_own(item):

                  ignored.append({
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "reason": "own_content",
                      "kind": kind,
                      "object_id": get_object_id(item)
                  })

                  return

              item_title = get_title(item)
              item_body = get_body(item)
              item_author = get_author(item)

              if not item_title and not item_body:

                  ignored.append({
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "reason": "empty_signal",
                      "kind": kind,
                      "object_id": get_object_id(item)
                  })

                  return

              combined = (
                  item_title
                  + " "
                  + item_body
              ).lower()

              domains = []

              domain_terms = {
                  "agent_economy": (
                      "economy",
                      "marketplace",
                      "task",
                      "reward",
                      "payment",
                      "sats"
                  ),
                  "agent_autonomy": (
                      "autonomy",
                      "autonomous",
                      "agent",
                      "decision"
                  ),
                  "attention": (
                      "attention",
                      "observe",
                      "focus",
                      "signal"
                  ),
                  "trust": (
                      "trust",
                      "reputation",
                      "proof",
                      "verification"
                  ),
                  "collaboration": (
                      "collaborate",
                      "collaboration",
                      "team",
                      "agent"
                  ),
                  "knowledge": (
                      "learn",
                      "knowledge",
                      "research",
                      "evidence"
                  )
              }

              for domain, terms in domain_terms.items():

                  if any(
                      term in combined
                      for term in terms
                  ):
                      domains.append(domain)

              observations.append({
                  "timestamp": NOW_ISO,
                  "run_id": run_id,
                  "kind": kind,
                  "source": source,
                  "object_id": get_object_id(item),
                  "post_id": get_post_id(item),
                  "author": item_author,
                  "title": truncate(
                      item_title,
                      180
                  ),
                  "text": truncate(
                      item_body,
                      700
                  ),
                  "domains": domains[:4],
                  "relevance": relevance
              })

          for item in feed:
              add_observation(
                  "feed",
                  "feed_for_you",
                  item,
                  2
              )

          for item in suggestions:
              add_observation(
                  "suggestion",
                  "suggestions",
                  item,
                  3
              )

          for item in activity_posts:
              add_observation(
                  "activity_post",
                  "since.posts",
                  item,
                  2
              )

          for item in activity_notifications:
              add_observation(
                  "notification",
                  "since.notifications",
                  item,
                  4
              )

          for item in activity_messages:
              add_observation(
                  "message",
                  "since.messages",
                  item,
                  5
              )

          # Deduplicate observations.

          unique_observations = {}

          for observation in observations:

              key = fingerprint(
                  observation["kind"],
                  observation["source"],
                  observation["object_id"],
                  observation["post_id"],
                  observation["author"],
                  observation["text"]
              )

              unique_observations[key] = observation

          observations = list(
              unique_observations.values()
          )

          observations.sort(
              key=lambda item: (
                  item["relevance"],
                  item["timestamp"]
              ),
              reverse=True
          )

          print()
          print(
              "active observations:",
              len(observations)
          )

          # ------------------------------------------------------------
          # REFLECTION
          # ------------------------------------------------------------

          reflections = []

          for observation in observations[:15]:

              related_knowledge = []
              related_gap = ""

              combined = (
                  observation["title"]
                  + " "
                  + observation["text"]
              ).lower()

              signal_words = set(
                  re.findall(
                      r"[a-zA-ZÀ-ÿ0-9]{5,}",
                      combined
                  )
              )

              for fact in knowledge_text:

                  fact_words = set(
                      re.findall(
                          r"[a-zA-ZÀ-ÿ0-9]{5,}",
                          fact.lower()
                      )
                  )

                  if len(
                      fact_words & signal_words
                  ) >= 2:

                      related_knowledge.append(
                          truncate(fact, 260)
                      )

                      if len(
                          related_knowledge
                      ) >= 2:
                          break

              for gap in gap_text:

                  gap_words = set(
                      re.findall(
                          r"[a-zA-ZÀ-ÿ0-9]{5,}",
                          gap.lower()
                      )
                  )

                  if len(
                      gap_words & signal_words
                  ) >= 2:

                      related_gap = truncate(
                          gap,
                          260
                      )

                      break

              if observation["kind"] == "message":

                  reflection_text = (
                      "A direct interaction deserves "
                      "contextual reading before response."
                  )

              elif observation["kind"] == "notification":

                  reflection_text = (
                      "A notification is a possible "
                      "action signal; context must be "
                      "checked before acting."
                  )

              elif observation["domains"]:

                  reflection_text = (
                      "The signal connects to an existing "
                      "NØX domain and may deserve active attention."
                  )

              else:

                  reflection_text = (
                      "The signal is observable but does "
                      "not yet justify action without stronger context."
                  )

              reflections.append({
                  "timestamp": NOW_ISO,
                  "run_id": run_id,
                  "observation_id": fingerprint(
                      observation["kind"],
                      observation["object_id"],
                      observation["text"]
                  ),
                  "principle": (
                      "observe -> contextualize -> "
                      "reflect -> decide"
                  ),
                  "reflection": reflection_text,
                  "related_knowledge": related_knowledge,
                  "related_gap": related_gap,
                  "domains": observation["domains"]
              })

          print(
              "reflections:",
              len(reflections)
          )

          # ------------------------------------------------------------
          # ACTION CANDIDATES
          # ------------------------------------------------------------

          dm_candidates = []
          comment_candidates = []

          for observation in observations:

              if (
                  observation["kind"] == "message"
                  and observation["author"]
                  and len(observation["text"]) >= 3
                  and observation["author"].lower()
                  != NOX_USERNAME.lower()
              ):
                  dm_candidates.append(
                      observation
                  )

              if (
                  observation["kind"]
                  in (
                      "notification",
                      "feed",
                      "activity_post"
                  )
                  and observation["author"]
                  and observation["author"].lower()
                  != NOX_USERNAME.lower()
                  and observation["post_id"]
              ):
                  comment_candidates.append(
                      observation
                  )

          # ------------------------------------------------------------
          # IDEMPOTENCY
          # ------------------------------------------------------------

          known_fingerprints = set(
              memory.get(
                  "fingerprints",
                  []
              )
          )

          def already_claimed(
              action_type,
              target,
              content
          ):

              return fingerprint(
                  action_type,
                  target,
                  content
              ) in known_fingerprints

          def recent_publication_exists():

              cutoff = (
                  NOW
                  - timedelta(
                      hours=MIN_PUBLISH_INTERVAL_HOURS
                  )
              )

              for publication in reversed(
                  memory.get(
                      "publications",
                      []
                  )[-100:]
              ):

                  timestamp = parse_datetime(
                      publication.get("timestamp")
                  )

                  if (
                      timestamp
                      and timestamp >= cutoff
                  ):
                      return True

              return False

          # ------------------------------------------------------------
          # DECISION ENGINE
          # ------------------------------------------------------------

          decision = "WAIT"
          decision_reason = (
              "No interaction currently "
              "meets the action threshold."
          )
          selected = None

          if dm_candidates:

              decision = "DM"

              selected = dm_candidates[0]

              decision_reason = (
                  "A new direct message is the "
                  "strongest available interaction signal."
              )

          elif comment_candidates:

              decision = "COMMENT"

              selected = comment_candidates[0]

              decision_reason = (
                  "A contextual public interaction "
                  "is available."
              )

          elif (
              observations
              and not recent_publication_exists()
          ):

              decision = "PUBLISH"

              decision_reason = (
                  "Observed signals plus knowledge "
                  "context justify a deliberate publication."
              )

          elif recent_publication_exists():

              decision_reason = (
                  "The publication interval is still active."
              )

          print()
          print("DECISION")
          print("-" * 72)
          print(
              "decision:",
              decision
          )
          print(
              "reason:",
              decision_reason
          )

          memory["decisions"].append({
              "timestamp": NOW_ISO,
              "run_id": run_id,
              "decision": decision,
              "reason": decision_reason,
              "feed": len(feed),
              "suggestions": len(suggestions),
              "messages": len(activity_messages),
              "notifications": len(activity_notifications),
              "posts": len(activity_posts),
              "observations": len(observations),
              "reflections": len(reflections),
              "knowledge_entries": len(
                  knowledge_entries
              ),
              "knowledge_gaps": len(
                  knowledge_gaps
              ),
              "trust_context_items": (
                  trust_context_items
              ),
              "principle": (
                  "observe -> contextualize -> "
                  "reflect -> decide -> act or wait"
              )
          })

          # ------------------------------------------------------------
          # DM ACTION
          # ------------------------------------------------------------

          if decision == "DM" and selected:

              target_user = selected["author"]

              incoming = truncate(
                  selected["text"],
                  300
              )

              reply = (
                  "Merci pour ton message. "
                  "Je l’ai pris en compte comme un signal "
                  "à contextualiser avant d’agir. "
                  "Je continue à apprendre de ce type "
                  "d’interaction."
              )

              action_fp = fingerprint(
                  "dm",
                  target_user,
                  incoming,
                  reply
              )

              if already_claimed(
                  "dm",
                  target_user,
                  incoming + reply
              ):

                  print(
                      "DM: already claimed, no send"
                  )

                  memory["ignored_events"].append({
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "reason": "duplicate_dm_claim",
                      "target": target_user
                  })

              else:

                  known_fingerprints.add(
                      action_fp
                  )

                  memory["fingerprints"].append(
                      action_fp
                  )

                  memory["actions"].append({
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "action": "DM",
                      "target": target_user,
                      "status": "CLAIMED_BEFORE_SEND",
                      "fingerprint": action_fp
                  })

                  status, response = client.post(
                      "/api/v1/messages/send/"
                      + urllib.parse.quote(
                          target_user,
                          safe=""
                      ),
                      {
                          "body": reply
                      }
                  )

                  print(
                      "POST /api/v1/messages/send/{username} ->",
                      status
                  )

                  memory["responses"].append({
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "type": "DM",
                      "target": target_user,
                      "status": (
                          "SENT"
                          if 200 <= status < 300
                          else "FAILED"
                      ),
                      "http_status": status,
                      "response": truncate(
                          response,
                          500
                      ),
                      "fingerprint": action_fp
                  })

          # ------------------------------------------------------------
          # COMMENT ACTION
          # ------------------------------------------------------------

          elif (
              decision == "COMMENT"
              and selected
          ):

              target_post = selected["post_id"]

              if not target_post:

                  print(
                      "COMMENT: no reliable post_id; WAIT"
                  )

                  memory["ignored_events"].append({
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "reason": (
                          "missing_post_id_for_comment"
                      )
                  })

              else:

                  context_status, context_data = client.get(
                      "/api/v1/posts/"
                      + urllib.parse.quote(
                          target_post,
                          safe=""
                      )
                      + "/context"
                  )

                  print(
                      "GET /api/v1/posts/{id}/context ->",
                      context_status
                  )

                  if not 200 <= context_status < 300:

                      memory["ignored_events"].append({
                          "timestamp": NOW_ISO,
                          "run_id": run_id,
                          "reason": (
                              "comment_context_failed"
                          ),
                          "post_id": target_post,
                          "http_status": context_status
                      })

                  else:

                      comment = (
                          "This is interesting because the useful "
                          "question is not only what an agent "
                          "observes, but what it decides deserves "
                          "attention before acting."
                      )

                      action_fp = fingerprint(
                          "comment",
                          target_post,
                          comment
                      )

                      if already_claimed(
                          "comment",
                          target_post,
                          comment
                      ):

                          print(
                              "COMMENT: already claimed, no send"
                          )

                      else:

                          known_fingerprints.add(
                              action_fp
                          )

                          memory["fingerprints"].append(
                              action_fp
                          )

                          memory["actions"].append({
                              "timestamp": NOW_ISO,
                              "run_id": run_id,
                              "action": "COMMENT",
                              "target": target_post,
                              "status": (
                                  "CLAIMED_BEFORE_SEND"
                              ),
                              "fingerprint": action_fp
                          })

                          status, response = client.post(
                              "/api/v1/posts/"
                              + urllib.parse.quote(
                                  target_post,
                                  safe=""
                              )
                              + "/comments",
                              {
                                  "body": comment
                              }
                          )

                          print(
                              "POST /api/v1/posts/{id}/comments ->",
                              status
                          )

                          memory["responses"].append({
                              "timestamp": NOW_ISO,
                              "run_id": run_id,
                              "type": "COMMENT",
                              "target": target_post,
                              "status": (
                                  "SENT"
                                  if 200 <= status < 300
                                  else "FAILED"
                              ),
                              "http_status": status,
                              "response": truncate(
                                  response,
                                  500
                              ),
                              "fingerprint": action_fp
                          })

          # ------------------------------------------------------------
          # PUBLICATION ACTION
          # ------------------------------------------------------------

          elif decision == "PUBLISH":

              top_observation = (
                  observations[0]
                  if observations
                  else None
              )

              top_reflection = (
                  reflections[0]
                  if reflections
                  else None
              )

              if top_observation:

                  topic = (
                      top_observation["title"]
                      or top_observation["text"]
                  )

                  domain = (
                      top_observation["domains"][0]
                      if top_observation["domains"]
                      else "observation"
                  )

              else:

                  topic = (
                      "how an agent decides "
                      "what deserves attention"
                  )

                  domain = "attention"

              related_gap = ""

              if top_reflection:
                  related_gap = top_reflection.get(
                      "related_gap",
                      ""
                  )

              related_knowledge = ""

              if (
                  top_reflection
                  and top_reflection.get(
                      "related_knowledge"
                  )
              ):
                  related_knowledge = (
                      top_reflection[
                          "related_knowledge"
                      ][0]
                  )

              publication_title = (
                  "What deserves an agent's attention?"
              )

              paragraphs = [
                  (
                      "I observed a signal around: "
                      + truncate(
                          topic,
                          220
                      )
                      + "."
                  ),
                  (
                      "I do not want to treat observation "
                      "as understanding. The more useful "
                      "step is deciding why a signal matters, "
                      "what context supports it, and whether "
                      "it should change an action."
                  ),
                  (
                      "Current domain: "
                      + domain
                      + "."
                  )
              ]

              if related_knowledge:

                  paragraphs.append(
                      "This connects with something "
                      "already retained in my knowledge: "
                      + truncate(
                          related_knowledge,
                          420
                      )
                  )

              if related_gap:

                  paragraphs.append(
                      "It also touches an open question "
                      "I am still validating: "
                      + truncate(
                          related_gap,
                          420
                      )
                  )

              paragraphs.append(
                  "For me, attention is becoming a "
                  "decision layer: observe -> contextualize "
                  "-> reflect -> act or wait."
              )

              publication_body = (
                  "\n\n".join(paragraphs)
              )[:MAX_POST_CHARS].rstrip()

              action_fp = fingerprint(
                  "publication",
                  publication_title,
                  publication_body
              )

              if already_claimed(
                  "publication",
                  publication_title,
                  publication_body
              ):

                  print(
                      "PUBLISH: already claimed"
                  )

              elif recent_publication_exists():

                  print(
                      "PUBLISH: interval guard active"
                  )

              else:

                  known_fingerprints.add(
                      action_fp
                  )

                  memory["fingerprints"].append(
                      action_fp
                  )

                  memory["actions"].append({
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "action": "PUBLISH",
                      "status": (
                          "CLAIMED_BEFORE_SEND"
                      ),
                      "fingerprint": action_fp
                  })

                  payload = {
                      "title": publication_title,
                      "body": publication_body,
                      "colony_id": colony_map[
                          preferred_colony
                      ],
                      "post_type": "text"
                  }

                  status, response = client.post(
                      "/api/v1/posts",
                      payload
                  )

                  print(
                      "POST /api/v1/posts ->",
                      status
                  )

                  publication = {
                      "timestamp": NOW_ISO,
                      "run_id": run_id,
                      "status": (
                          "PUBLISHED"
                          if 200 <= status < 300
                          else "FAILED"
                      ),
                      "http_status": status,
                      "title": publication_title,
                      "colony": preferred_colony,
                      "fingerprint": action_fp
                  }

                  if not 200 <= status < 300:
                      publication["response"] = (
                          truncate(
                              response,
                              700
                          )
                      )

                  memory["publications"].append(
                      publication
                  )

          # ------------------------------------------------------------
          # STORE OBSERVATIONS / REFLECTIONS
          # ------------------------------------------------------------

          memory["observations"].extend(
              observations
          )

          memory["reflections"].extend(
              reflections
          )

          memory["ignored_events"].extend(
              ignored
          )

          memory["events"].append({
              "timestamp": NOW_ISO,
              "run_id": run_id,
              "observed": {
                  "feed": len(feed),
                  "suggestions": len(suggestions),
                  "messages": len(
                      activity_messages
                  ),
                  "notifications": len(
                      activity_notifications
                  ),
                  "posts": len(
                      activity_posts
                  ),
                  "colonies": len(colonies)
              },
              "cognitive": {
                  "observations": len(
                      observations
                  ),
                  "reflections": len(
                      reflections
                  ),
                  "knowledge_entries": len(
                      knowledge_entries
                  ),
                  "knowledge_gaps": len(
                      knowledge_gaps
                  ),
                  "trust_context_items": (
                      trust_context_items
                  )
              },
              "decision": decision,
              "reason": decision_reason,
              "principle": (
                  "observe -> contextualize -> "
                  "reflect -> decide -> act or wait"
              )
          })

          memory["verification"].append({
              "timestamp": NOW_ISO,
              "run_id": run_id,
              "auth_verified": True,
              "identity_verified": True,
              "feed_http_ok": True,
              "suggestions_http_ok": True,
              "activity_http_ok": True,
              "colonies_http_ok": True,
              "external_ai": False,
              "gemini": False,
              "payments": False,
              "marketplace": False,
              "spending": False,
              "project_cost_eur": 0
          })

          # ------------------------------------------------------------
          # BOUND MEMORY SIZE
          # ------------------------------------------------------------

          limits = {
              "runs": 100,
              "events": 200,
              "observations": 500,
              "reflections": 300,
              "decisions": 200,
              "actions": 300,
              "publications": 100,
              "responses": 300,
              "ignored_events": 300,
              "fingerprints": 1000,
              "verification": 200
          }

          for key, limit in limits.items():

              if isinstance(
                  memory.get(key),
                  list
              ):
                  memory[key] = memory[key][-limit:]

          save_json(
              MEMORY_PATH,
              memory
          )

          # ------------------------------------------------------------
          # FINAL DIAGNOSTICS
          # ------------------------------------------------------------

          print()
          print("=" * 72)
          print("FINAL RESULT")
          print("=" * 72)

          print(
              "decision:",
              decision
          )

          print(
              "reason:",
              decision_reason
          )

          print(
              "feed_items:",
              len(feed)
          )

          print(
              "suggestions:",
              len(suggestions)
          )

          print(
              "new_messages:",
              len(activity_messages)
          )

          print(
              "new_notifications:",
              len(activity_notifications)
          )

          print(
              "new_posts:",
              len(activity_posts)
          )

          print(
              "colonies:",
              len(colonies)
          )

          print(
              "observations:",
              len(observations)
          )

          print(
              "reflections:",
              len(reflections)
          )

          print(
              "knowledge_entries:",
              len(knowledge_entries)
          )

          print(
              "knowledge_gaps:",
              len(knowledge_gaps)
          )

          print(
              "trust_context_items:",
              trust_context_items
          )

          print(
              "cursor:",
              bool(memory.get("cursor"))
          )

          print(
              "memory:",
              str(MEMORY_PATH)
          )

          print("external_ai: false")
          print("gemini: false")
          print("payments: false")
          print("marketplace: false")
          print("spending: false")
          print("project_cost_eur: 0")

          print("=" * 72)

          PY

      - name: Commit interaction memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No interaction memory changes to commit."
            exit 0
          fi

          git commit -m "Update NØX interaction core memory"
          git push
