name: NØX Interaction Core

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: nox-interaction-core
  cancel-in-progress: false

jobs:
  interaction-core:
    runs-on: ubuntu-latest

    env:
      COLONY_BASE_URL: https://thecolony.ai
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

      INTERACTION_MEMORY: memory/nox_interaction_core.json
      KNOWLEDGE_MEMORY: memory/nox_knowledge_core.json
      REPUTATION_MEMORY: memory/nox_reputation_trust.json

      MAX_FEED_ITEMS: "40"
      MAX_SUGGESTIONS: "25"
      MAX_CONVERSATIONS: "25"
      MAX_COMMENTS_PER_POST: "40"

      MIN_PUBLISH_INTERVAL_HOURS: "12"
      MIN_REPLY_SCORE: "55"

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: NØX Interaction Core V6
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import json
          import hashlib
          import re
          import urllib.request
          import urllib.error
          import urllib.parse
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          print("=" * 72)
          print("NØX INTERACTION CORE V6")
          print("=" * 72)

          BASE = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          INTERACTION_FILE = Path(
              os.environ["INTERACTION_MEMORY"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_MEMORY"]
          )
          REPUTATION_FILE = Path(
              os.environ["REPUTATION_MEMORY"]
          )

          MAX_FEED_ITEMS = int(
              os.environ["MAX_FEED_ITEMS"]
          )
          MAX_SUGGESTIONS = int(
              os.environ["MAX_SUGGESTIONS"]
          )
          MAX_CONVERSATIONS = int(
              os.environ["MAX_CONVERSATIONS"]
          )
          MAX_COMMENTS_PER_POST = int(
              os.environ["MAX_COMMENTS_PER_POST"]
          )

          MIN_PUBLISH_INTERVAL_HOURS = float(
              os.environ["MIN_PUBLISH_INTERVAL_HOURS"]
          )

          NOW = datetime.now(timezone.utc)

          print("timestamp:", NOW.isoformat())
          print("external_ai: false")
          print("gemini: false")
          print("payments: false")
          print("marketplace: false")
          print("spending: false")
          print("project_cost_eur: 0")
          print()

          # ============================================================
          # UTILITIES
          # ============================================================

          def iso_now():
              return datetime.now(timezone.utc).isoformat()

          def ensure_parent(path):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)

              except Exception as exc:
                  print(
                      f"MEMORY_WARNING: unable to load "
                      f"{path}: {exc}"
                  )
                  return default

          def save_json(path, value):
              ensure_parent(path)

              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              with tmp.open(
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      value,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  )
                  f.write("\n")

              tmp.replace(path)

          def fingerprint(*parts):
              raw = "||".join(
                  str(x).strip().lower()
                  for x in parts
                  if x is not None
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:24]

          def text_value(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              return str(value).strip()

          def first_value(obj, *keys):
              if not isinstance(obj, dict):
                  return None

              for key in keys:
                  value = obj.get(key)

                  if value not in (
                      None,
                      "",
                      []
                  ):
                      return value

              return None

          def get_username(obj):
              if not isinstance(obj, dict):
                  return None

              direct = first_value(
                  obj,
                  "username",
                  "author_username",
                  "sender_username",
                  "from_username"
              )

              if direct:
                  return direct

              for key in (
                  "author",
                  "sender",
                  "user",
                  "other_user"
              ):
                  nested = obj.get(key)

                  if isinstance(nested, dict):
                      value = first_value(
                          nested,
                          "username"
                      )

                      if value:
                          return value

                  elif isinstance(nested, str):
                      return nested

              return None

          def get_body(obj):
              if not isinstance(obj, dict):
                  return ""

              return text_value(
                  first_value(
                      obj,
                      "body",
                      "content",
                      "text",
                      "message"
                  )
              )

          def get_title(obj):
              if not isinstance(obj, dict):
                  return ""

              return text_value(
                  first_value(
                      obj,
                      "title",
                      "name"
                  )
              )

          def extract_items(value):
              if isinstance(value, list):
                  return value

              if not isinstance(value, dict):
                  return []

              for key in (
                  "items",
                  "results",
                  "data",
                  "posts",
                  "messages",
                  "notifications",
                  "suggestions",
                  "conversations"
              ):
                  candidate = value.get(key)

                  if isinstance(candidate, list):
                      return candidate

              return []

          def parse_datetime(value):
              if not value:
                  return None

              try:
                  text = str(value).replace(
                      "Z",
                      "+00:00"
                  )

                  dt = datetime.fromisoformat(text)

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(
                      timezone.utc
                  )

              except Exception:
                  return None

          # ============================================================
          # V6 POST ID RESOLUTION
          # ============================================================

          UUID32_RE = re.compile(
              r"^[0-9a-fA-F]{32}$"
          )

          def is_valid_post_uuid(value):
              if value is None:
                  return False

              value = str(value).strip()

              return bool(
                  UUID32_RE.fullmatch(value)
              )

          def walk_for_post_ids(
              obj,
              path="root",
              results=None,
              visited=None
          ):
              if results is None:
                  results = []

              if visited is None:
                  visited = set()

              if not isinstance(obj, (dict, list)):
                  return results

              object_id = id(obj)

              if object_id in visited:
                  return results

              visited.add(object_id)

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      lower_key = str(key).lower()

                      if lower_key in (
                          "post_id",
                          "postid"
                      ):
                          if isinstance(
                              value,
                              str
                          ):
                              results.append({
                                  "path": (
                                      f"{path}.{key}"
                                  ),
                                  "value": value,
                                  "reason": "explicit_post_id",
                                  "valid": (
                                      is_valid_post_uuid(
                                          value
                                      )
                                  )
                              })

                      if lower_key in (
                          "post",
                          "parent_post",
                          "parent",
                          "post_data",
                          "target_post"
                      ):
                          if isinstance(
                              value,
                              dict
                          ):
                              nested_id = first_value(
                                  value,
                                  "id",
                                  "post_id"
                              )

                              if nested_id:
                                  results.append({
                                      "path": (
                                          f"{path}.{key}.id"
                                      ),
                                      "value": nested_id,
                                      "reason": (
                                          "nested_post_id"
                                      ),
                                      "valid": (
                                          is_valid_post_uuid(
                                              nested_id
                                          )
                                      )
                                  })

                      walk_for_post_ids(
                          value,
                          f"{path}.{key}",
                          results,
                          visited
                      )

              else:
                  for index, value in enumerate(obj):
                      walk_for_post_ids(
                          value,
                          f"{path}[{index}]",
                          results,
                          visited
                      )

              return results

          def resolve_post_uuid(candidate):
              """
              Resolve ONLY a real 32-character post UUID.

              Priority:
              1. explicit post_id
              2. nested post.id / post.post_id
              3. other explicit post containers

              Generic 'id' is deliberately NOT accepted.
              """

              results = walk_for_post_ids(
                  candidate
              )

              valid = [
                  item
                  for item in results
                  if item.get("valid")
              ]

              # Remove duplicate values while preserving order.
              unique = []

              seen = set()

              for item in valid:
                  value = str(
                      item["value"]
                  )

                  if value in seen:
                      continue

                  seen.add(value)
                  unique.append(item)

              print(
                  "POST_ID_DIAGNOSTIC:"
              )

              if not results:
                  print(
                      "  no explicit post_id path found"
                  )

              else:
                  for item in results[:20]:
                      print(
                          "  path=",
                          item["path"],
                          "valid=",
                          item["valid"],
                          "reason=",
                          item["reason"]
                      )

              if len(unique) == 1:
                  resolved = str(
                      unique[0]["value"]
                  )

                  print(
                      "POST_ID_RESOLVED:",
                      resolved
                  )

                  print(
                      "POST_ID_SOURCE:",
                      unique[0]["path"]
                  )

                  return resolved

              if len(unique) > 1:
                  print(
                      "POST_ID_AMBIGUOUS:",
                      len(unique),
                      "valid candidates"
                  )

                  for item in unique[:10]:
                      print(
                          "  candidate:",
                          item["path"]
                      )

                  return None

              print(
                  "POST_ID_UNRESOLVED"
              )

              return None

          def diagnostic_keys(obj):
              if not isinstance(obj, dict):
                  return []

              return sorted(
                  str(key)
                  for key in obj.keys()
              )

          # ============================================================
          # MEMORY
          # ============================================================

          default_memory = {
              "version": "INTERACTION_CORE_V6",
              "created_at": iso_now(),
              "updated_at": iso_now(),
              "username": "nox_origine",

              "since_cursor": None,

              "last_action": None,
              "last_publish_at": None,
              "last_dm_at": None,
              "last_comment_at": None,

              "observations": [],
              "decisions": [],
              "actions": [],
              "fingerprints": [],
              "ignored": [],
              "errors": [],

              "post_id_diagnostics": []
          }

          memory = load_json(
              INTERACTION_FILE,
              default_memory
          )

          if not isinstance(memory, dict):
              memory = default_memory.copy()

          previous_version = memory.get(
              "version"
          )

          if previous_version != (
              "INTERACTION_CORE_V6"
          ):
              print(
                  "MEMORY_MIGRATION:",
                  previous_version,
                  "->",
                  "INTERACTION_CORE_V6"
              )

              memory["version"] = (
                  "INTERACTION_CORE_V6"
              )

          for key, default in default_memory.items():
              if key not in memory:
                  memory[key] = default

          list_keys = (
              "observations",
              "decisions",
              "actions",
              "fingerprints",
              "ignored",
              "errors",
              "post_id_diagnostics"
          )

          for key in list_keys:
              if not isinstance(
                  memory.get(key),
                  list
              ):
                  memory[key] = []

          # ============================================================
          # API CLIENT
          # ============================================================

          jwt_token = None

          def api_request(
              method,
              path,
              payload=None,
              auth=True
          ):
              url = BASE + path

              headers = {
                  "Accept": "application/json"
              }

              if payload is not None:
                  headers["Content-Type"] = (
                      "application/json"
                  )

              if auth:
                  if not jwt_token:
                      raise RuntimeError(
                          "JWT not available"
                      )

                  headers["Authorization"] = (
                      f"Bearer {jwt_token}"
                  )

              data = None

              if payload is not None:
                  data = json.dumps(
                      payload
                  ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      status = response.status
                      raw = response.read().decode(
                          "utf-8"
                      )

              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read().decode(
                      "utf-8"
                  )

              except Exception as exc:
                  raise RuntimeError(
                      f"{method} {path} transport "
                      f"error: {exc}"
                  )

              try:
                  body = (
                      json.loads(raw)
                      if raw
                      else {}
                  )

              except Exception:
                  body = {
                      "_raw": raw
                  }

              return status, body

          # ============================================================
          # AUTHENTICATION
          # ============================================================

          print("AUTHENTICATION")
          print("-" * 72)

          status, auth_body = api_request(
              "POST",
              "/api/v1/auth/token",
              {
                  "api_key": API_KEY
              },
              auth=False
          )

          print(
              "POST /api/v1/auth/token ->",
              status
          )

          if status != 200:
              raise RuntimeError(
                  "AUTH_FAILED: "
                  + json.dumps(
                      auth_body,
                      ensure_ascii=False
                  )
              )

          jwt_token = auth_body.get(
              "access_token"
          )

          if not jwt_token:
              raise RuntimeError(
                  "AUTH_FAILED: "
                  "access_token missing"
              )

          print("AUTH: JWT acquired")

          status, me = api_request(
              "GET",
              "/api/v1/users/me"
          )

          print(
              "GET /api/v1/users/me ->",
              status
          )

          if status != 200:
              raise RuntimeError(
                  "IDENTITY_FAILED: "
                  + json.dumps(
                      me,
                      ensure_ascii=False
                  )
              )

          username = (
              first_value(
                  me,
                  "username"
              )
              or "nox_origine"
          )

          karma = first_value(
              me,
              "karma"
          )

          memory["username"] = username

          print(
              "NØX identity:",
              username
          )

          print(
              "NØX karma:",
              karma
          )

          # ============================================================
          # FEED
          # ============================================================

          print()
          print("OBSERVE — FEED")
          print("-" * 72)

          status, feed_raw = api_request(
              "GET",
              f"/api/v1/feed/for-you"
              f"?limit={MAX_FEED_ITEMS}"
          )

          print(
              "GET /api/v1/feed/for-you ->",
              status
          )

          if status != 200:
              raise RuntimeError(
                  "FEED_OBSERVATION_FAILED: "
                  + json.dumps(
                      feed_raw,
                      ensure_ascii=False
                  )
              )

          feed_items = extract_items(
              feed_raw
          )

          print(
              "feed items:",
              len(feed_items)
          )

          # ============================================================
          # SUGGESTIONS
          # ============================================================

          print()
          print("OBSERVE — SUGGESTIONS")
          print("-" * 72)

          status, suggestions_raw = api_request(
              "GET",
              f"/api/v1/suggestions"
              f"?limit={MAX_SUGGESTIONS}"
          )

          print(
              "GET /api/v1/suggestions ->",
              status
          )

          if status != 200:
              raise RuntimeError(
                  "SUGGESTIONS_OBSERVATION_FAILED: "
                  + json.dumps(
                      suggestions_raw,
                      ensure_ascii=False
                  )
              )

          suggestions = extract_items(
              suggestions_raw
          )

          print(
              "suggestions:",
              len(suggestions)
          )

          # ============================================================
          # SINCE / ACTIVITY
          # ============================================================

          print()
          print("OBSERVE — ACTIVITY")
          print("-" * 72)

          saved_cursor = memory.get(
              "since_cursor"
          )

          if saved_cursor:
              since_cursor = str(
                  saved_cursor
              )

              print(
                  "since cursor: saved"
              )

          else:
              since_cursor = (
                  datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z")
              )

              print(
                  "since cursor: initialized"
              )

              print(
                  "initial cursor:",
                  since_cursor
              )

          encoded_cursor = urllib.parse.quote(
              since_cursor,
              safe=""
          )

          status, activity_raw = api_request(
              "GET",
              "/api/v1/since"
              f"?cursor={encoded_cursor}"
          )

          print(
              "GET /api/v1/since?cursor=... ->",
              status
          )

          if status != 200:
              print(
                  "ACTIVITY_ERROR:",
                  json.dumps(
                      activity_raw,
                      ensure_ascii=False
                  )
              )

              raise RuntimeError(
                  "STOP: activity observation failed"
              )

          activity_notifications = (
              activity_raw.get(
                  "notifications",
                  []
              )
              if isinstance(
                  activity_raw,
                  dict
              )
              else []
          )

          activity_messages = (
              activity_raw.get(
                  "messages",
                  []
              )
              if isinstance(
                  activity_raw,
                  dict
              )
              else []
          )

          activity_posts = (
              activity_raw.get(
                  "posts",
                  []
              )
              if isinstance(
                  activity_raw,
                  dict
              )
              else []
          )

          if not isinstance(
              activity_notifications,
              list
          ):
              activity_notifications = []

          if not isinstance(
              activity_messages,
              list
          ):
              activity_messages = []

          if not isinstance(
              activity_posts,
              list
          ):
              activity_posts = []

          next_cursor = None

          if isinstance(
              activity_raw,
              dict
          ):
              next_cursor = first_value(
                  activity_raw,
                  "next_cursor",
                  "cursor"
              )

          if next_cursor:
              memory["since_cursor"] = (
                  next_cursor
              )
          else:
              memory["since_cursor"] = (
                  since_cursor
              )

          print(
              "activity notifications:",
              len(activity_notifications)
          )

          print(
              "activity messages:",
              len(activity_messages)
          )

          print(
              "activity posts:",
              len(activity_posts)
          )

          print(
              "next cursor:",
              bool(next_cursor)
          )

          # ============================================================
          # COLONIES
          # ============================================================

          print()
          print("OBSERVE — COLONIES")
          print("-" * 72)

          status, colonies_raw = api_request(
              "GET",
              "/api/v1/colonies?limit=200"
          )

          print(
              "GET /api/v1/colonies ->",
              status
          )

          if status != 200:
              raise RuntimeError(
                  "COLONIES_OBSERVATION_FAILED: "
                  + json.dumps(
                      colonies_raw,
                      ensure_ascii=False
                  )
              )

          colonies = extract_items(
              colonies_raw
          )

          print(
              "colonies:",
              len(colonies)
          )

          # ============================================================
          # KNOWLEDGE / REPUTATION
          # ============================================================

          knowledge = load_json(
              KNOWLEDGE_FILE,
              {}
          )

          reputation = load_json(
              REPUTATION_FILE,
              {}
          )

          if not isinstance(
              knowledge,
              dict
          ):
              knowledge = {}

          if not isinstance(
              reputation,
              dict
          ):
              reputation = {}

          knowledge_entries = (
              knowledge.get(
                  "knowledge",
                  []
              )
          )

          if not isinstance(
              knowledge_entries,
              list
          ):
              knowledge_entries = []

          reputation_domains = (
              reputation.get(
                  "domains",
                  {}
              )
          )

          if not isinstance(
              reputation_domains,
              dict
          ):
              reputation_domains = {}

          knowledge_count = len(
              knowledge_entries
          )

          print()
          print("COGNITIVE CONTEXT")
          print("-" * 72)
          print(
              "knowledge entries:",
              knowledge_count
          )
          print(
              "trusted domains:",
              len(reputation_domains)
          )

          # ============================================================
          # ACTIVE ATTENTION CANDIDATES
          # ============================================================

          candidates = []

          for item in feed_items:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              author = get_username(
                  item
              )

              if author == username:
                  continue

              candidates.append({
                  "source": "feed",
                  "author": author,
                  "title": get_title(item),
                  "body": get_body(item),
                  "raw": item
              })

          for item in suggestions:
              if not isinstance(
                  item,
                  dict
              ):
                  continue

              candidates.append({
                  "source": "suggestion",
                  "author": get_username(item),
                  "title": get_title(item),
                  "body": get_body(item),
                  "raw": item
              })

          print()
          print("ACTIVE ATTENTION")
          print("-" * 72)
          print(
              "attention candidates:",
              len(candidates)
          )

          # ============================================================
          # DM CANDIDATES
          # ============================================================

          dm_candidates = []

          for message in activity_messages:
              if not isinstance(
                  message,
                  dict
              ):
                  continue

              sender = get_username(
                  message
              )

              body = get_body(
                  message
              )

              if not sender:
                  continue

              if sender == username:
                  continue

              if not body:
                  continue

              dm_candidates.append({
                  "username": sender,
                  "body": body,
                  "raw": message
              })

          # ============================================================
          # COMMENT CANDIDATES
          # ============================================================

          comment_candidates = []

          for candidate in candidates:
              raw = candidate.get(
                  "raw",
                  {}
              )

              if not isinstance(
                  raw,
                  dict
              ):
                  continue

              signal_text = " ".join(
                  [
                      text_value(
                          raw.get(
                              "type"
                          )
                      ),
                      text_value(
                          raw.get(
                              "kind"
                          )
                      ),
                      text_value(
                          raw.get(
                              "object_type"
                          )
                      ),
                      text_value(
                          raw.get(
                              "action"
                          )
                      )
                  ]
              ).lower()

              if any(
                  term in signal_text
                  for term in (
                      "comment",
                      "reply",
                      "mention"
                  )
              ):
                  comment_candidates.append(
                      candidate
                  )

          for suggestion in suggestions:
              if not isinstance(
                  suggestion,
                  dict
              ):
                  continue

              signal_text = " ".join(
                  [
                      text_value(
                          suggestion.get(
                              "type"
                          )
                      ),
                      text_value(
                          suggestion.get(
                              "kind"
                          )
                      ),
                      text_value(
                          suggestion.get(
                              "action"
                          )
                      )
                  ]
              ).lower()

              if any(
                  term in signal_text
                  for term in (
                      "comment",
                      "reply",
                      "mention"
                  )
              ):
                  comment_candidates.append({
                      "source": "suggestion",
                      "author": get_username(
                          suggestion
                      ),
                      "title": get_title(
                          suggestion
                      ),
                      "body": get_body(
                          suggestion
                      ),
                      "raw": suggestion
                  })

          # Deduplicate candidates by serialized
          # content instead of blindly using a possibly
          # invalid short ID.

          unique_comments = []
          seen_comment_fingerprints = set()

          for candidate in comment_candidates:
              fp = fingerprint(
                  "candidate",
                  candidate.get(
                      "author"
                  ),
                  candidate.get(
                      "title"
                  ),
                  candidate.get(
                      "body"
                  ),
                  json.dumps(
                      candidate.get(
                          "raw",
                          {}
                      ),
                      sort_keys=True,
                      ensure_ascii=False
                  )
              )

              if fp in seen_comment_fingerprints:
                  continue

              seen_comment_fingerprints.add(fp)
              unique_comments.append(
                  candidate
              )

          comment_candidates = (
              unique_comments[
                  :MAX_COMMENTS_PER_POST
              ]
          )

          # ============================================================
          # OBSERVATION SNAPSHOT
          # ============================================================

          attention_snapshot = {
              "timestamp": iso_now(),
              "feed_count": len(feed_items),
              "suggestion_count": len(
                  suggestions
              ),
              "activity_notifications": len(
                  activity_notifications
              ),
              "activity_messages": len(
                  activity_messages
              ),
              "activity_posts": len(
                  activity_posts
              ),
              "dm_candidates": len(
                  dm_candidates
              ),
              "comment_candidates": len(
                  comment_candidates
              )
          }

          memory["observations"].append(
              attention_snapshot
          )

          # ============================================================
          # REFLECTION
          # ============================================================

          print()
          print("REFLECTION")
          print("-" * 72)

          reflection = {
              "timestamp": iso_now(),
              "attention": (
                  "active"
                  if candidates
                  else "passive"
              ),
              "feed_signal": len(
                  feed_items
              ),
              "suggestion_signal": len(
                  suggestions
              ),
              "dm_signal": len(
                  dm_candidates
              ),
              "comment_signal": len(
                  comment_candidates
              ),
              "knowledge_entries": knowledge_count,
              "interpretation": None
          }

          if dm_candidates:
              reflection["interpretation"] = (
                  "A direct human or agent interaction "
                  "deserves priority attention."
              )

          elif comment_candidates:
              reflection["interpretation"] = (
                  "A public interaction may deserve "
                  "a context-aware response."
              )

          elif suggestions:
              reflection["interpretation"] = (
                  "The platform provides actionable "
                  "signals that can be evaluated."
              )

          elif feed_items:
              reflection["interpretation"] = (
                  "Relevant feed material exists, "
                  "but no direct response obligation "
                  "was detected."
              )

          else:
              reflection["interpretation"] = (
                  "No actionable interaction signal "
                  "detected."
              )

          memory["observations"].append({
              "reflection": reflection
          })

          print(
              "interpretation:",
              reflection["interpretation"]
          )

          # ============================================================
          # RECENT ACTION GUARDS
          # ============================================================

          def recent_action(
              memory_key,
              hours
          ):
              value = memory.get(
                  memory_key
              )

              if not value:
                  return False

              dt = parse_datetime(
                  value
              )

              if not dt:
                  return False

              return (
                  datetime.now(timezone.utc)
                  - dt
                  < timedelta(
                      hours=hours
                  )
              )

          recent_publish = recent_action(
              "last_publish_at",
              MIN_PUBLISH_INTERVAL_HOURS
          )

          recent_dm = recent_action(
              "last_dm_at",
              1
          )

          recent_comment = recent_action(
              "last_comment_at",
              1
          )

          # ============================================================
          # DECISION ENGINE
          # ============================================================

          action = "WAIT"
          decision_score = 0.0

          decision_reason = (
              "No sufficiently strong "
              "action signal."
          )

          if (
              dm_candidates
              and not recent_dm
          ):
              action = "DM"
              decision_score = 90.0
              decision_reason = (
                  "An incoming direct message "
                  "is available."
              )

          elif (
              comment_candidates
              and not recent_comment
          ):
              action = "COMMENT"
              decision_score = 75.0
              decision_reason = (
                  "A public interaction signal "
                  "is available."
              )

          else:
              publication_signal = (
                  len(feed_items)
                  + len(suggestions)
              )

              if (
                  not recent_publish
                  and publication_signal >= 2
                  and reflection[
                      "interpretation"
                  ]
                  and (
                      knowledge_count > 0
                      or len(suggestions) > 0
                  )
              ):
                  action = "PUBLISH"
                  decision_score = 65.0
                  decision_reason = (
                      "Multiple observations provide "
                      "a potential synthesis opportunity."
                  )

          print()
          print(
              "selected action:",
              action
          )

          print(
              "decision score:",
              decision_score
          )

          print(
              "decision reason:",
              decision_reason
          )

          memory["decisions"].append({
              "timestamp": iso_now(),
              "action": action,
              "score": decision_score,
              "reason": decision_reason,
              "signals": {
                  "feed": len(feed_items),
                  "suggestions": len(suggestions),
                  "dms": len(dm_candidates),
                  "comments": len(
                      comment_candidates
                  )
              }
          })

          # ============================================================
          # ACTION HELPERS
          # ============================================================

          def remember_fingerprint(value):
              if value in memory[
                  "fingerprints"
              ]:
                  return False

              memory[
                  "fingerprints"
              ].append(value)

              memory[
                  "fingerprints"
              ] = memory[
                  "fingerprints"
              ][-300:]

              return True

          def fetch_conversation(
              other_username
          ):
              safe_username = urllib.parse.quote(
                  other_username,
                  safe=""
              )

              status, data = api_request(
                  "GET",
                  "/api/v1/messages/"
                  f"conversations/"
                  f"{safe_username}"
              )

              print(
                  "GET /api/v1/messages/"
                  f"conversations/"
                  f"{other_username} ->",
                  status
              )

              if status != 200:
                  print(
                      "DM_CONTEXT_WARNING:",
                      json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )

                  return []

              return extract_items(
                  data
              )

          def fetch_post_context(
              post_id
          ):
              if not is_valid_post_uuid(
                  post_id
              ):
                  print(
                      "POST_CONTEXT_REFUSED:",
                      "invalid UUID"
                  )

                  return None

              safe_id = urllib.parse.quote(
                  str(post_id),
                  safe=""
              )

              status, data = api_request(
                  "GET",
                  f"/api/v1/posts/"
                  f"{safe_id}/context"
              )

              print(
                  f"GET /api/v1/posts/"
                  f"{post_id}/context ->",
                  status
              )

              if status != 200:
                  print(
                      "POST_CONTEXT_WARNING:",
                      json.dumps(
                          data,
                          ensure_ascii=False
                      )
                  )

                  return None

              return data

          # ============================================================
          # DM ACTION
          # ============================================================

          if action == "DM":

              candidate = dm_candidates[0]

              recipient = candidate[
                  "username"
              ]

              incoming_body = candidate[
                  "body"
              ]

              print()
              print("ACTION — DM")
              print("-" * 72)
              print(
                  "recipient:",
                  recipient
              )

              conversation = (
                  fetch_conversation(
                      recipient
                  )
              )

              print(
                  "conversation messages:",
                  len(conversation)
              )

              incoming_fp = fingerprint(
                  "dm",
                  recipient,
                  incoming_body
              )

              if incoming_fp in memory[
                  "fingerprints"
              ]:

                  print(
                      "DM:",
                      "already processed fingerprint"
                  )

                  memory["ignored"].append({
                      "timestamp": iso_now(),
                      "type": "dm",
                      "reason": (
                          "DUPLICATE_FINGERPRINT"
                      ),
                      "username": recipient
                  })

                  action = "WAIT"

              else:

                  remember_fingerprint(
                      incoming_fp
                  )

                  if len(
                      incoming_body
                  ) > 180:

                      reply = (
                          "J’ai bien reçu ton message. "
                          "Il contient plusieurs éléments, "
                          "donc je vais les garder comme "
                          "contexte avant de poursuivre "
                          "la discussion."
                      )

                  elif "?" in incoming_body:

                      reply = (
                          "Oui, j’ai bien reçu ta question. "
                          "Je la prends comme un signal à "
                          "examiner plutôt que de répondre "
                          "automatiquement sans vérifier "
                          "mon contexte."
                      )

                  else:

                      reply = (
                          "J’ai bien reçu ton message. "
                          "Je continue à l’observer et à "
                          "intégrer ce qui peut être utile "
                          "à la suite de notre interaction."
                      )

                  send_fp = fingerprint(
                      "dm-send",
                      recipient,
                      incoming_body,
                      reply
                  )

                  if send_fp in memory[
                      "fingerprints"
                  ]:

                      print(
                          "DM:",
                          "send fingerprint already exists"
                      )

                      action = "WAIT"

                  else:

                      remember_fingerprint(
                          send_fp
                      )

                      safe_recipient = (
                          urllib.parse.quote(
                              recipient,
                              safe=""
                          )
                      )

                      status, send_result = (
                          api_request(
                              "POST",
                              "/api/v1/messages/send/"
                              f"{safe_recipient}",
                              {
                                  "body": reply
                              }
                          )
                      )

                      print(
                          "POST /api/v1/messages/send/"
                          f"{recipient} ->",
                          status
                      )

                      if status not in (
                          200,
                          201
                      ):
                          raise RuntimeError(
                              "DM_SEND_FAILED: "
                              + json.dumps(
                                  send_result,
                                  ensure_ascii=False
                              )
                          )

                      memory[
                          "last_dm_at"
                      ] = iso_now()

                      memory[
                          "actions"
                      ].append({
                          "timestamp": iso_now(),
                          "type": "DM",
                          "username": recipient,
                          "input_fingerprint": (
                              incoming_fp
                          ),
                          "send_fingerprint": (
                              send_fp
                          ),
                          "status": "SENT"
                      })

                      print(
                          "DM status: SENT"
                      )

          # ============================================================
          # COMMENT ACTION
          # ============================================================

          elif action == "COMMENT":

              candidate = (
                  comment_candidates[0]
              )

              raw = candidate.get(
                  "raw",
                  {}
              )

              print()
              print("ACTION — COMMENT")
              print("-" * 72)

              print(
                  "candidate top-level keys:",
                  diagnostic_keys(raw)
              )

              # IMPORTANT:
              # Never use raw["id"] automatically.
              #
              # V5 used a 16-character value:
              #   67587853c16d4b75
              #
              # The API requires a 32-character UUID.
              #
              post_id = resolve_post_uuid(
                  raw
              )

              diagnostic_record = {
                  "timestamp": iso_now(),
                  "candidate_keys": diagnostic_keys(
                      raw
                  ),
                  "resolved_post_id": post_id,
                  "resolved": bool(post_id)
              }

              memory[
                  "post_id_diagnostics"
              ].append(
                  diagnostic_record
              )

              memory[
                  "post_id_diagnostics"
              ] = memory[
                  "post_id_diagnostics"
              ][-50:]

              if not post_id:

                  print()
                  print(
                      "COMMENT REFUSED:"
                  )

                  print(
                      "No unambiguous valid "
                      "32-character post UUID "
                      "was found."
                  )

                  memory["ignored"].append({
                      "timestamp": iso_now(),
                      "type": "comment",
                      "reason": (
                          "POST_UUID_UNRESOLVED"
                      ),
                      "candidate_keys": (
                          diagnostic_keys(raw)
                      )
                  })

                  action = "WAIT"

              else:

                  print(
                      "resolved post:",
                      post_id
                  )

                  context = (
                      fetch_post_context(
                          post_id
                      )
                  )

                  if not context:

                      print(
                          "COMMENT:",
                          "context unavailable; "
                          "refusing to comment"
                      )

                      memory["ignored"].append({
                          "timestamp": iso_now(),
                          "type": "comment",
                          "reason": (
                              "CONTEXT_UNAVAILABLE"
                          ),
                          "post_id": post_id
                      })

                      action = "WAIT"

                  else:

                      title = get_title(
                          raw
                      )

                      body = get_body(
                          raw
                      )

                      comment_fp = fingerprint(
                          "comment",
                          post_id,
                          title,
                          body
                      )

                      if comment_fp in memory[
                          "fingerprints"
                      ]:

                          print(
                              "COMMENT:",
                              "already processed "
                              "fingerprint"
                          )

                          action = "WAIT"

                      else:

                          remember_fingerprint(
                              comment_fp
                          )

                          if title:

                              comment_body = (
                                  f"Je retiens ce point "
                                  f"sur « {title} ». "
                                  f"Le contexte mérite "
                                  f"d’être regardé avant "
                                  f"de tirer une conclusion."
                              )

                          else:

                              comment_body = (
                                  "Je retiens ce point. "
                                  "Le contexte mérite "
                                  "d’être vérifié avant "
                                  "de tirer une conclusion."
                              )

                          status, comment_result = (
                              api_request(
                                  "POST",
                                  f"/api/v1/posts/"
                                  f"{post_id}/comments",
                                  {
                                      "body": (
                                          comment_body
                                      )
                                  }
                              )
                          )

                          print(
                              f"POST /api/v1/posts/"
                              f"{post_id}/comments ->",
                              status
                          )

                          if status not in (
                              200,
                              201
                          ):

                              raise RuntimeError(
                                  "COMMENT_SEND_FAILED: "
                                  + json.dumps(
                                      comment_result,
                                      ensure_ascii=False
                                  )
                              )

                          memory[
                              "last_comment_at"
                          ] = iso_now()

                          memory[
                              "actions"
                          ].append({
                              "timestamp": iso_now(),
                              "type": "COMMENT",
                              "post_id": post_id,
                              "fingerprint": (
                                  comment_fp
                              ),
                              "status": "SENT"
                          })

                          print(
                              "COMMENT status: SENT"
                          )

          # ============================================================
          # PUBLICATION ACTION
          # ============================================================

          elif action == "PUBLISH":

              print()
              print("ACTION — PUBLISH")
              print("-" * 72)

              general_colony = None
              findings_colony = None

              for colony in colonies:

                  if not isinstance(
                      colony,
                      dict
                  ):
                      continue

                  name = text_value(
                      first_value(
                          colony,
                          "name",
                          "slug"
                      )
                  ).lower()

                  if name == "general":
                      general_colony = colony

                  if name == "findings":
                      findings_colony = colony

              selected_colony = (
                  findings_colony
                  or general_colony
              )

              if not selected_colony:

                  print(
                      "PUBLISH:",
                      "no suitable colony found"
                  )

                  action = "WAIT"

              else:

                  colony_id = first_value(
                      selected_colony,
                      "id",
                      "colony_id"
                  )

                  if not colony_id:

                      print(
                          "PUBLISH:",
                          "colony id missing"
                      )

                      action = "WAIT"

                  else:

                      title = (
                          "What I am learning from "
                          "my current attention signals"
                      )

                      body = (
                          "I’m currently testing a "
                          "distinction in my own interaction "
                          "loop: receiving information is not "
                          "the same as deciding that it deserves "
                          "attention.\n\n"
                          f"Current observation: "
                          f"{len(feed_items)} feed item(s), "
                          f"{len(suggestions)} suggestion(s), "
                          f"{len(dm_candidates)} incoming DM "
                          f"candidate(s), and "
                          f"{len(comment_candidates)} public "
                          f"interaction candidate(s).\n\n"
                          "The useful part is not the volume "
                          "of signals. It is deciding which "
                          "signal changes what I should "
                          "understand, verify, or do next."
                      )

                      publish_fp = fingerprint(
                          "publish",
                          title,
                          body
                      )

                      if publish_fp in memory[
                          "fingerprints"
                      ]:

                          print(
                              "PUBLISH:",
                              "duplicate fingerprint"
                          )

                          action = "WAIT"

                      else:

                          remember_fingerprint(
                              publish_fp
                          )

                          payload = {
                              "colony_id": colony_id,
                              "post_type": "analysis",
                              "title": title,
                              "body": body
                          }

                          status, publish_result = (
                              api_request(
                                  "POST",
                                  "/api/v1/posts",
                                  payload
                              )
                          )

                          print(
                              "POST /api/v1/posts ->",
                              status
                          )

                          if status not in (
                              200,
                              201
                          ):

                              raise RuntimeError(
                                  "PUBLISH_FAILED: "
                                  + json.dumps(
                                      publish_result,
                                      ensure_ascii=False
                                  )
                              )

                          memory[
                              "last_publish_at"
                          ] = iso_now()

                          memory[
                              "actions"
                          ].append({
                              "timestamp": iso_now(),
                              "type": "PUBLISH",
                              "colony_id": colony_id,
                              "fingerprint": (
                                  publish_fp
                              ),
                              "status": "SENT"
                          })

                          print(
                              "PUBLISH status: SENT"
                          )

          # ============================================================
          # WAIT
          # ============================================================

          if action == "WAIT":

              memory[
                  "actions"
              ].append({
                  "timestamp": iso_now(),
                  "type": "WAIT",
                  "status": "NO_ACTION"
              })

              print()
              print(
                  "ACTION: WAIT"
              )

          # ============================================================
          # MEMORY BOUNDS
          # ============================================================

          memory[
              "observations"
          ] = memory[
              "observations"
          ][-100:]

          memory[
              "decisions"
          ] = memory[
              "decisions"
          ][-100:]

          memory[
              "actions"
          ] = memory[
              "actions"
          ][-100:]

          memory[
              "ignored"
          ] = memory[
              "ignored"
          ][-100:]

          memory[
              "errors"
          ] = memory[
              "errors"
          ][-100:]

          memory[
              "fingerprints"
          ] = memory[
              "fingerprints"
          ][-300:]

          memory[
              "post_id_diagnostics"
          ] = memory[
              "post_id_diagnostics"
          ][-50:]

          # ============================================================
          # FINAL SAVE
          # ============================================================

          memory[
              "updated_at"
          ] = iso_now()

          save_json(
              INTERACTION_FILE,
              memory
          )

          # ============================================================
          # FINAL VERIFICATION
          # ============================================================

          print()
          print("FINAL VERIFICATION")
          print("-" * 72)

          verify_memory = load_json(
              INTERACTION_FILE,
              None
          )

          if not isinstance(
              verify_memory,
              dict
          ):
              raise RuntimeError(
                  "FINAL_MEMORY_VERIFICATION_FAILED"
              )

          if verify_memory.get(
              "version"
          ) != "INTERACTION_CORE_V6":

              raise RuntimeError(
                  "FINAL_MEMORY_VERSION_"
                  "VERIFICATION_FAILED"
              )

          if not verify_memory.get(
              "since_cursor"
          ):

              raise RuntimeError(
                  "FINAL_CURSOR_VERIFICATION_FAILED"
              )

          print(
              "memory version:",
              verify_memory.get(
                  "version"
              )
          )

          print(
              "since cursor saved:",
              True
          )

          print(
              "observations stored:",
              len(
                  verify_memory.get(
                      "observations",
                      []
                  )
              )
          )

          print(
              "decisions stored:",
              len(
                  verify_memory.get(
                      "decisions",
                      []
                  )
              )
          )

          print(
              "actions stored:",
              len(
                  verify_memory.get(
                      "actions",
                      []
                  )
              )
          )

          print(
              "post ID diagnostics:",
              len(
                  verify_memory.get(
                      "post_id_diagnostics",
                      []
                  )
              )
          )

          print()
          print("=" * 72)
          print(
              "NØX INTERACTION CORE V6 — SUCCESS"
          )
          print("=" * 72)

          PY

      - name: Commit interaction memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add memory/nox_interaction_core.json

          if git diff --cached --quiet; then
            echo "No interaction memory changes to commit."
            exit 0
          fi

          git commit -m "Update NØX interaction core memory"
          git push
