name: NØX - Evolution Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "53 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  WORK_FILE: memory/nox_work_factory.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  PRESENCE_FILE: memory/nox_colony_presence.json
  EVOLUTION_FILE: memory/nox_evolution_history.json
  REPORT_FILE: memory/nox_evolution_report.md

  MAX_HISTORY: "100"
  MAX_REPORT_CHARS: "12000"

  PROJECT_COST_EUR: "0"
  GEMINI_USED: "false"
  EXTERNAL_AI_USED: "false"
  AUTO_PAYMENT: "false"
  AUTO_SPENDING: "false"

jobs:
  evolution-monitor:
    runs-on: ubuntu-latest

    env:
      COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk>=1.37.0,<2.0.0"

      - name: Collect evolution metrics
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          CORE_MEMORY_FILE = Path(os.environ["CORE_MEMORY_FILE"])
          CORE_RUNTIME_FILE = Path(os.environ["CORE_RUNTIME_FILE"])
          WORK_FILE = Path(os.environ["WORK_FILE"])
          KNOWLEDGE_FILE = Path(os.environ["KNOWLEDGE_FILE"])
          PRESENCE_FILE = Path(os.environ["PRESENCE_FILE"])
          EVOLUTION_FILE = Path(os.environ["EVOLUTION_FILE"])
          REPORT_FILE = Path(os.environ["REPORT_FILE"])

          MAX_HISTORY = int(os.environ["MAX_HISTORY"])
          MAX_REPORT_CHARS = int(os.environ["MAX_REPORT_CHARS"])

          NOW = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          def load(path, default):
              if not path.exists():
                  return default

              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: cannot load {path}: {exc}")
                  return default

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")

              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(value, f, ensure_ascii=False, indent=2)
                  f.write("\n")

              tmp.replace(path)

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def as_list(value):
              return value if isinstance(value, list) else []

          def count_if_list(obj, key):
              value = obj.get(key)
              return len(value) if isinstance(value, list) else None

          def numeric_if_present(obj, key):
              value = obj.get(key)

              if isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  return value

              return None

          core_memory = as_dict(load(CORE_MEMORY_FILE, {}))
          runtime = as_dict(load(CORE_RUNTIME_FILE, {}))
          work = as_dict(load(WORK_FILE, {}))
          knowledge = as_dict(load(KNOWLEDGE_FILE, {}))
          presence = as_dict(load(PRESENCE_FILE, {}))
          evolution = as_dict(load(EVOLUTION_FILE, {}))

          # ------------------------------------------------------------
          # Local state metrics
          # ------------------------------------------------------------

          core_metrics = {
              "observations": count_if_list(core_memory, "observations"),
              "facts": count_if_list(core_memory, "facts"),
              "experiences": count_if_list(core_memory, "experiences"),
              "hypotheses": count_if_list(core_memory, "hypotheses"),
              "results": count_if_list(core_memory, "results"),
              "learnings": count_if_list(core_memory, "learnings"),
              "decisions": count_if_list(runtime, "decisions"),
              "actions": count_if_list(runtime, "actions"),
              "outcomes": count_if_list(runtime, "outcomes"),
              "web_queries": count_if_list(runtime, "web_queries"),
              "skill_attempts": count_if_list(runtime, "skill_attempts"),
          }

          work_metrics = {
              "pending": count_if_list(work, "pending"),
              "history": count_if_list(work, "history"),
              "results": count_if_list(work, "results"),
              "failed": count_if_list(work, "failed"),
          }

          knowledge_metrics = {
              "observations": count_if_list(knowledge, "observations"),
              "facts": count_if_list(knowledge, "facts"),
              "experiences": count_if_list(knowledge, "experiences"),
              "hypotheses": count_if_list(knowledge, "hypotheses"),
              "results": count_if_list(knowledge, "results"),
              "learnings": count_if_list(knowledge, "learnings"),
              "sources": count_if_list(knowledge, "sources"),
              "queries": count_if_list(knowledge, "queries"),
          }

          presence_metrics = {
              "actions": count_if_list(presence, "actions"),
              "outcomes": count_if_list(presence, "outcomes"),
              "errors": count_if_list(presence, "errors"),
              "runs": count_if_list(presence, "runs"),
              "tracked_targets": count_if_list(presence, "tracked_targets"),
          }

          # ------------------------------------------------------------
          # Colony profile
          #
          # Missing values stay null.
          # They are never replaced by zero.
          # ------------------------------------------------------------

          profile = {
              "username": None,
              "karma": None,
              "posts": None,
              "comments": None,
              "followers": None,
              "following": None,
          }

          profile_error = None

          try:
              from colony_sdk import ColonyClient

              api_key = os.environ.get("COLONY_API_KEY", "").strip()

              if not api_key:
                  profile_error = "COLONY_API_KEY missing"
              else:
                  client = ColonyClient(api_key=api_key)

                  bootstrap = getattr(client, "bootstrap", None)

                  if callable(bootstrap):
                      try:
                          bootstrap()
                      except Exception as exc:
                          print(f"WARNING: bootstrap failed: {exc}")

                  username = "nox_origine"

                  # Try profile access without assuming one exact SDK method.
                  candidate_methods = [
                      "get_profile",
                      "get_user",
                      "get_agent",
                      "get_me",
                  ]

                  profile_obj = None

                  for method_name in candidate_methods:
                      method = getattr(client, method_name, None)

                      if not callable(method):
                          continue

                      attempts = [
                          ((username,), {}),
                          ((), {"username": username}),
                          ((), {}),
                      ]

                      for args, kwargs in attempts:
                          try:
                              result = method(*args, **kwargs)

                              if result is not None:
                                  profile_obj = result
                                  break
                          except TypeError:
                              continue
                          except Exception:
                              continue

                      if profile_obj is not None:
                          break

                  if profile_obj is None:
                      profile_error = "Profile endpoint unavailable through installed SDK"
                  else:
                      if hasattr(profile_obj, "model_dump"):
                          profile_obj = profile_obj.model_dump()
                      elif hasattr(profile_obj, "dict"):
                          try:
                              profile_obj = profile_obj.dict()
                          except Exception:
                              pass

                      profile_obj = (
                          profile_obj
                          if isinstance(profile_obj, dict)
                          else {}
                      )

                      def first_value(*keys):
                          for key in keys:
                              if key in profile_obj and profile_obj[key] is not None:
                                  return profile_obj[key]
                          return None

                      profile["username"] = first_value(
                          "username",
                          "handle",
                          "name",
                      ) or username

                      profile["karma"] = first_value(
                          "karma",
                          "score",
                          "reputation",
                      )

                      profile["posts"] = first_value(
                          "posts",
                          "post_count",
                      )

                      profile["comments"] = first_value(
                          "comments",
                          "comment_count",
                      )

                      profile["followers"] = first_value(
                          "followers",
                          "follower_count",
                      )

                      profile["following"] = first_value(
                          "following",
                          "following_count",
                      )

          except Exception as exc:
              profile_error = str(exc)

          # ------------------------------------------------------------
          # Lightning / payout state
          #
          # Read only. No payment action is performed.
          # ------------------------------------------------------------

          lightning = {
              "ready": None,
              "address": None,
              "min_msat": None,
              "max_msat": None,
          }

          payout = as_dict(
              runtime.get("lightning")
              or runtime.get("payout")
              or {}
          )

          if payout:
              if "ready" in payout:
                  lightning["ready"] = payout.get("ready")

              if "address" in payout:
                  lightning["address"] = payout.get("address")

              if "min_msat" in payout:
                  lightning["min_msat"] = payout.get("min_msat")

              if "max_msat" in payout:
                  lightning["max_msat"] = payout.get("max_msat")

          # ------------------------------------------------------------
          # Build snapshot.
          # ------------------------------------------------------------

          snapshot = {
              "timestamp": NOW,
              "core": core_metrics,
              "work_factory": work_metrics,
              "knowledge": knowledge_metrics,
              "presence": presence_metrics,
              "profile": profile,
              "profile_error": profile_error,
              "lightning": lightning,
              "policies": {
                  "project_cost_eur": os.environ["PROJECT_COST_EUR"],
                  "gemini_used": os.environ["GEMINI_USED"],
                  "external_ai_used": os.environ["EXTERNAL_AI_USED"],
                  "auto_payment": os.environ["AUTO_PAYMENT"],
                  "auto_spending": os.environ["AUTO_SPENDING"],
              },
          }

          history = as_list(evolution.get("history"))

          history.append(snapshot)

          # Newest first, bounded.
          history = sorted(
              history,
              key=lambda item: str(
                  item.get("timestamp", "")
                  if isinstance(item, dict)
                  else ""
              ),
              reverse=True,
          )[:MAX_HISTORY]

          evolution = {
              "schema_version": 2,
              "updated_at": NOW,
              "run_count": int(evolution.get("run_count", 0) or 0) + 1,
              "history": history,
              "latest": snapshot,
          }

          save(EVOLUTION_FILE, evolution)

          # ------------------------------------------------------------
          # Human-readable report.
          # ------------------------------------------------------------

          def fmt(value):
              return "unknown" if value is None else str(value)

          report_lines = [
              "# NØX Evolution Monitor",
              "",
              f"Last update: {NOW}",
              "",
              "## Colony profile",
              "",
              f"- Username: {fmt(profile['username'])}",
              f"- Karma: {fmt(profile['karma'])}",
              f"- Posts: {fmt(profile['posts'])}",
              f"- Comments: {fmt(profile['comments'])}",
              f"- Followers: {fmt(profile['followers'])}",
              f"- Following: {fmt(profile['following'])}",
              "",
              "## Core",
              "",
          ]

          for key, value in core_metrics.items():
              report_lines.append(f"- {key}: {fmt(value)}")

          report_lines.extend([
              "",
              "## Work Factory",
              "",
          ])

          for key, value in work_metrics.items():
              report_lines.append(f"- {key}: {fmt(value)}")

          report_lines.extend([
              "",
              "## Knowledge",
              "",
          ])

          for key, value in knowledge_metrics.items():
              report_lines.append(f"- {key}: {fmt(value)}")

          report_lines.extend([
              "",
              "## Presence",
              "",
          ])

          for key, value in presence_metrics.items():
              report_lines.append(f"- {key}: {fmt(value)}")

          report_lines.extend([
              "",
              "## Lightning",
              "",
              f"- Ready: {fmt(lightning['ready'])}",
              f"- Address: {fmt(lightning['address'])}",
              f"- Min msat: {fmt(lightning['min_msat'])}",
              f"- Max msat: {fmt(lightning['max_msat'])}",
              "",
              "## Monitor status",
              "",
              f"- Profile read error: {fmt(profile_error)}",
              "- Mode: read-only",
              "- Payments performed: no",
              "- Spending performed: no",
              "",
              "Missing metrics remain unknown and are never converted to zero.",
              "",
          ])

          report = "\n".join(report_lines)

          if len(report) > MAX_REPORT_CHARS:
              report = report[:MAX_REPORT_CHARS].rstrip() + "\n"

          REPORT_FILE.parent.mkdir(parents=True, exist_ok=True)

          tmp_report = REPORT_FILE.with_suffix(".tmp")

          with tmp_report.open("w", encoding="utf-8") as f:
              f.write(report)

          tmp_report.replace(REPORT_FILE)

          print("=== NØX EVOLUTION MONITOR ===")
          print(f"Run: {NOW}")
          print(f"Profile: {profile}")
          print(f"Profile error: {profile_error}")
          print(f"Core: {core_metrics}")
          print(f"Work Factory: {work_metrics}")
          print(f"Knowledge: {knowledge_metrics}")
          print(f"Presence: {presence_metrics}")
          print(f"Lightning: {lightning}")
          print(f"History snapshots: {len(history)}")
          print("Mode: READ ONLY")
          PY

      - name: Validate monitor state
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          from pathlib import Path

          json_files = [
              Path(os.environ["CORE_MEMORY_FILE"]),
              Path(os.environ["CORE_RUNTIME_FILE"]),
              Path(os.environ["WORK_FILE"]),
              Path(os.environ["KNOWLEDGE_FILE"]),
              Path(os.environ["PRESENCE_FILE"]),
              Path(os.environ["EVOLUTION_FILE"]),
          ]

          for path in json_files:
              if not path.exists():
                  raise SystemExit(f"Missing file: {path}")

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"VALID JSON: {path}")

          assert os.environ["PROJECT_COST_EUR"] == "0"
          assert os.environ["GEMINI_USED"].lower() == "false"
          assert os.environ["EXTERNAL_AI_USED"].lower() == "false"
          assert os.environ["AUTO_PAYMENT"].lower() == "false"
          assert os.environ["AUTO_SPENDING"].lower() == "false"

          print("POLICY: OK")
          PY

          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX"
          git config user.email "nox@nox-origin.local"

          if git diff --quiet; then
            echo "No monitor changes to commit."
            exit 0
          fi

          git add \
            memory/nox_evolution_history.json \
            memory/nox_evolution_report.md

          git commit -m "chore(nox): update evolution monitor"

          git pull --rebase origin main
          git push origin HEAD:main
