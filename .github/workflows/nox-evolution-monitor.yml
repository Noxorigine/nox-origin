name: NØX - Evolution Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-evolution-monitor
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  EVOLUTION_FILE: memory/nox_evolution_history.json
  REPORT_FILE: memory/nox_evolution_report.md

  MAX_HISTORY_ITEMS: "500"
  COLONY_SDK_VERSION: "1.37.0"

jobs:
  evolution-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "colony-sdk==${COLONY_SDK_VERSION}"

      - name: Measure NØX evolution
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote, urlencode

          import colony_sdk
          from colony_sdk import (
              ColonyAPIError,
              ColonyAuthError,
              ColonyClient,
          )

          # ===========================================================
          # NØX EVOLUTION MONITOR
          #
          # READ-ONLY concernant Colony.
          #
          # Colony operations:
          #   bootstrap()
          #   get_me()
          #   get_posts(author=...)
          #   get_my_followers()
          #   get_my_following()
          #
          # Comments:
          #   The current Python SDK 1.37.0 does not expose a public
          #   get_user_comments() method. The platform does expose the
          #   user-comments read endpoint, so this monitor uses the
          #   SDK's authenticated raw request mechanism for that one
          #   read-only measurement.
          #
          # A failure of one metric never invalidates the others.
          # Missing data remains None and is never converted to zero.
          # ===========================================================

          NOW = datetime.now(timezone.utc).isoformat()

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          EVOLUTION_FILE = Path(
              os.environ["EVOLUTION_FILE"]
          )
          REPORT_FILE = Path(
              os.environ["REPORT_FILE"]
          )

          MAX_HISTORY_ITEMS = int(
              os.environ["MAX_HISTORY_ITEMS"]
          )

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          ).strip()

          SDK_VERSION = getattr(
              colony_sdk,
              "__version__",
              "unknown"
          )

          TARGET_USERNAME = "nox_origine"

          # ===========================================================
          # HELPERS
          # ===========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"WARNING: impossible de lire "
                      f"{path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def as_list(value):
              return (
                  value
                  if isinstance(value, list)
                  else []
              )


          def as_dict(value):
              return (
                  value
                  if isinstance(value, dict)
                  else {}
              )


          def number(value, default=0):
              try:
                  return int(value)
              except (
                  TypeError,
                  ValueError
              ):
                  return default


          def numeric_or_none(value):
              try:
                  if value is None:
                      return None

                  return int(value)

              except (
                  TypeError,
                  ValueError
              ):
                  return None


          def delta(current, previous):
              current_value = numeric_or_none(
                  current
              )

              previous_value = numeric_or_none(
                  previous
              )

              if (
                  current_value is None
                  or previous_value is None
              ):
                  return None

              return (
                  current_value
                  - previous_value
              )


          def display_delta(value):
              if value is None:
                  return "n/a"

              if value > 0:
                  return f"+{value}"

              return str(value)


          def record_metric(
              metrics,
              errors,
              name,
              producer
          ):
              try:
                  value = producer()

                  metrics[name] = numeric_or_none(
                      value
                  )

                  if metrics[name] is None:
                      errors.append(
                          f"{name}_unavailable"
                      )

              except ColonyAuthError:
                  errors.append(
                      f"{name}_authentication"
                  )

              except ColonyAPIError:
                  errors.append(
                      f"{name}_api"
                  )

              except Exception as exc:
                  errors.append(
                      f"{name}_unexpected"
                  )

                  print(
                      f"PROFILE: {name} indisponible: "
                      f"{exc}"
                  )


          # ===========================================================
          # LOAD EXISTING NØX DATA
          # ===========================================================

          core_memory = as_dict(
              load_json(
                  CORE_MEMORY_FILE,
                  {}
              )
          )

          core_runtime = as_dict(
              load_json(
                  CORE_RUNTIME_FILE,
                  {}
              )
          )

          knowledge = as_dict(
              load_json(
                  KNOWLEDGE_FILE,
                  {}
              )
          )

          history = load_json(
              EVOLUTION_FILE,
              {
                  "version": 1,
                  "snapshots": []
              }
          )

          if not isinstance(
              history,
              dict
          ):
              history = {
                  "version": 1,
                  "snapshots": []
              }

          if not isinstance(
              history.get("snapshots"),
              list
          ):
              history["snapshots"] = []


          observations = as_list(
              core_memory.get(
                  "observations"
              )
          )

          decisions = as_list(
              core_memory.get(
                  "decisions"
              )
          )

          actions = as_list(
              core_memory.get(
                  "actions"
              )
          )

          learnings = as_list(
              core_memory.get(
                  "learnings"
              )
          )

          knowledge_facts = as_list(
              knowledge.get(
                  "facts"
              )
          )

          knowledge_experiences = as_list(
              knowledge.get(
                  "experiences"
              )
          )

          knowledge_learnings = as_list(
              knowledge.get(
                  "learnings"
              )
          )

          knowledge_sources = as_list(
              knowledge.get(
                  "sources"
              )
          )


          # ===========================================================
          # CORE METRICS
          # ===========================================================

          skill_attempts = as_dict(
              core_runtime.get(
                  "skill_attempt_counts"
              )
          )

          skill_successes = as_dict(
              core_runtime.get(
                  "skill_success_counts"
              )
          )

          total_skill_attempts = sum(
              number(value)
              for value in skill_attempts.values()
          )

          total_skill_successes = sum(
              number(value)
              for value in skill_successes.values()
          )

          if total_skill_attempts:
              skill_success_ratio = round(
                  total_skill_successes
                  / total_skill_attempts,
                  3
              )
          else:
              skill_success_ratio = None


          payout_health = as_dict(
              core_runtime.get(
                  "payout_health"
              )
          )

          payout_status = (
              payout_health.get(
                  "status"
              )
              or "UNKNOWN"
          )


          # ===========================================================
          # COLONY PROFILE — READ ONLY
          # ===========================================================

          profile_metrics = {
              "available": False,
              "status": "UNAVAILABLE",

              "username": None,
              "karma": None,
              "posts": None,
              "comments": None,
              "followers": None,
              "following": None,
          }

          profile_errors = []


          if API_KEY:

              try:
                  client = ColonyClient(
                      API_KEY
                  )

              except Exception as exc:
                  client = None

                  profile_metrics[
                      "status"
                  ] = "CLIENT_ERROR"

                  profile_errors.append(
                      "client_initialization"
                  )

                  print(
                      f"PROFILE: ColonyClient "
                      f"impossible à initialiser: {exc}"
                  )


              if client is not None:

                  # ---------------------------------------------------
                  # 1. BOOTSTRAP / IDENTITY
                  # ---------------------------------------------------

                  try:
                      state = client.bootstrap()

                      if not isinstance(
                          state,
                          dict
                      ):
                          raise RuntimeError(
                              "bootstrap() returned "
                              "a non-dict state"
                          )

                      bootstrap_profile = as_dict(
                          state.get(
                              "profile"
                          )
                      )

                      bootstrap_username = str(
                          bootstrap_profile.get(
                              "username"
                          )
                          or ""
                      ).strip()

                      if (
                          bootstrap_username
                          and bootstrap_username
                          != TARGET_USERNAME
                      ):
                          raise SystemExit(
                              "SECURITY STOP: le profil "
                              f"authentifié est "
                              f"'{bootstrap_username}', "
                              f"pas '{TARGET_USERNAME}'."
                          )

                  except ColonyAuthError as exc:
                      profile_errors.append(
                          "bootstrap_authentication"
                      )

                      print(
                          "PROFILE: bootstrap "
                          f"authentification impossible: {exc}"
                      )

                  except ColonyAPIError as exc:
                      profile_errors.append(
                          "bootstrap_api"
                      )

                      print(
                          "PROFILE: bootstrap API "
                          f"indisponible: {exc}"
                      )

                  except SystemExit:
                      raise

                  except Exception as exc:
                      profile_errors.append(
                          "bootstrap_unexpected"
                      )

                      print(
                          "PROFILE: bootstrap "
                          f"inexploitable: {exc}"
                      )


                  # ---------------------------------------------------
                  # 2. GET ME
                  # ---------------------------------------------------

                  try:
                      me = client.get_me()

                      if not isinstance(
                          me,
                          dict
                      ):
                          raise RuntimeError(
                              "get_me() returned "
                              "a non-dict profile"
                          )

                      username = str(
                          me.get(
                              "username"
                          )
                          or ""
                      ).strip()

                      if username != TARGET_USERNAME:
                          raise SystemExit(
                              "SECURITY STOP: le profil "
                              f"authentifié est "
                              f"'{username}', "
                              f"pas '{TARGET_USERNAME}'."
                          )

                      profile_metrics[
                          "username"
                      ] = username

                      profile_metrics[
                          "karma"
                      ] = numeric_or_none(
                          me.get(
                              "karma"
                          )
                      )

                      if profile_metrics[
                          "karma"
                      ] is None:
                          profile_errors.append(
                              "karma_unavailable"
                          )

                  except ColonyAuthError as exc:
                      profile_errors.append(
                          "get_me_authentication"
                      )

                      print(
                          "PROFILE: get_me "
                          f"authentification impossible: {exc}"
                      )

                  except ColonyAPIError as exc:
                      profile_errors.append(
                          "get_me_api"
                      )

                      print(
                          "PROFILE: get_me API "
                          f"indisponible: {exc}"
                      )

                  except SystemExit:
                      raise

                  except Exception as exc:
                      profile_errors.append(
                          "get_me_unexpected"
                      )

                      print(
                          "PROFILE: get_me "
                          f"inexploitable: {exc}"
                      )


                  # ---------------------------------------------------
                  # 3. POSTS
                  #
                  # Official SDK primitive:
                  # get_posts(author=...)
                  #
                  # The response total is the authoritative count for
                  # the filtered author query.
                  # ---------------------------------------------------

                  record_metric(
                      profile_metrics,
                      profile_errors,
                      "posts",
                      lambda: (
                          client.get_posts(
                              author=TARGET_USERNAME,
                              limit=1,
                              offset=0
                          ).get(
                              "total"
                          )
                      )
                  )


                  # ---------------------------------------------------
                  # 4. COMMENTS
                  #
                  # colony-sdk 1.37.0 has no public
                  # get_user_comments() method.
                  #
                  # The platform exposes the authenticated read route
                  # /users/{username}/comments.
                  #
                  # We deliberately use the SDK's authenticated raw
                  # request rather than introducing requests/httpx.
                  #
                  # This is READ-ONLY.
                  # ---------------------------------------------------

                  try:
                      encoded_username = quote(
                          TARGET_USERNAME,
                          safe=""
                      )

                      comments_params = urlencode(
                          {
                              "limit": "1",
                              "offset": "0"
                          }
                      )

                      comments_result = (
                          client._raw_request(
                              "GET",
                              f"/users/"
                              f"{encoded_username}/comments?"
                              f"{comments_params}"
                          )
                      )

                      if not isinstance(
                          comments_result,
                          dict
                      ):
                          raise RuntimeError(
                              "user comments endpoint "
                              "returned a non-dict response"
                          )

                      profile_metrics[
                          "comments"
                      ] = numeric_or_none(
                          comments_result.get(
                              "total"
                          )
                      )

                      if profile_metrics[
                          "comments"
                      ] is None:
                          profile_errors.append(
                              "comments_unavailable"
                          )

                  except ColonyAuthError as exc:
                      profile_errors.append(
                          "comments_authentication"
                      )

                      print(
                          "PROFILE: comments "
                          f"authentification impossible: {exc}"
                      )

                  except ColonyAPIError as exc:
                      profile_errors.append(
                          "comments_api"
                      )

                      print(
                          "PROFILE: comments API "
                          f"indisponible: {exc}"
                      )

                  except Exception as exc:
                      profile_errors.append(
                          "comments_unexpected"
                      )

                      print(
                          "PROFILE: comments "
                          f"indisponibles: {exc}"
                      )


                  # ---------------------------------------------------
                  # 5. FOLLOWERS
                  # ---------------------------------------------------

                  record_metric(
                      profile_metrics,
                      profile_errors,
                      "followers",
                      lambda: (
                          client.get_my_followers(
                              limit=1,
                              offset=0
                          ).get(
                              "total"
                          )
                      )
                  )


                  # ---------------------------------------------------
                  # 6. FOLLOWING
                  # ---------------------------------------------------

                  record_metric(
                      profile_metrics,
                      profile_errors,
                      "following",
                      lambda: (
                          client.get_my_following(
                              limit=1,
                              offset=0
                          ).get(
                              "total"
                          )
                      )
                  )


                  # ---------------------------------------------------
                  # 7. PROFILE COMPLETENESS
                  # ---------------------------------------------------

                  required_metrics = (
                      "karma",
                      "posts",
                      "comments",
                      "followers",
                      "following",
                  )

                  missing_metrics = [
                      name
                      for name in required_metrics
                      if profile_metrics.get(
                          name
                      ) is None
                  ]

                  if missing_metrics:

                      profile_metrics[
                          "available"
                      ] = False

                      profile_metrics[
                          "status"
                      ] = "INCOMPLETE_PROFILE"

                      profile_errors.extend(
                          f"{name}_unavailable"
                          for name in missing_metrics
                      )

                      print(
                          "PROFILE: métriques "
                          "indisponibles: "
                          + ", ".join(
                              missing_metrics
                          )
                      )

                  else:

                      profile_metrics[
                          "available"
                      ] = True

                      profile_metrics[
                          "status"
                      ] = "OK"

          else:

              profile_metrics[
                  "status"
              ] = "NO_API_KEY"

              profile_errors.append(
                  "no_api_key"
              )

              print(
                  "PROFILE: COLONY_API_KEY absent."
              )


          # ===========================================================
          # PREVIOUS SNAPSHOT
          # ===========================================================

          snapshots = history[
              "snapshots"
          ]

          previous = (
              snapshots[-1]
              if snapshots
              else None
          )

          previous_core = (
              as_dict(
                  previous.get(
                      "core"
                  )
              )
              if previous
              else {}
          )

          previous_knowledge = (
              as_dict(
                  previous.get(
                      "knowledge"
                  )
              )
              if previous
              else {}
          )

          previous_profile = (
              as_dict(
                  previous.get(
                      "profile"
                  )
              )
              if previous
              else {}
          )


          # ===========================================================
          # CURRENT SNAPSHOT
          # ===========================================================

          snapshot = {
              "timestamp": NOW,

              "sdk": {
                  "name": "colony-sdk",
                  "version": SDK_VERSION,
              },

              "profile": profile_metrics,

              "profile_errors": sorted(
                  set(
                      profile_errors
                  )
              ),

              "core": {
                  "run_count": number(
                      core_runtime.get(
                          "run_count"
                      )
                  ),

                  "observations": len(
                      observations
                  ),

                  "decisions": len(
                      decisions
                  ),

                  "actions": len(
                      actions
                  ),

                  "learnings": len(
                      learnings
                  ),

                  "web_queries": len(
                      as_list(
                          core_runtime.get(
                              "web_queries"
                          )
                      )
                  ),

                  "skill_attempts": (
                      total_skill_attempts
                  ),

                  "skill_successes": (
                      total_skill_successes
                  ),

                  "skill_success_ratio": (
                      skill_success_ratio
                  ),
              },

              "knowledge": {
                  "run_count": number(
                      knowledge.get(
                          "run_count"
                      )
                  ),

                  "facts": len(
                      knowledge_facts
                  ),

                  "experiences": len(
                      knowledge_experiences
                  ),

                  "learnings": len(
                      knowledge_learnings
                  ),

                  "sources": len(
                      knowledge_sources
                  ),
              },

              "payout": {
                  "status": payout_status,

                  "lightning_address": bool(
                      payout_health.get(
                          "lightning_address"
                      )
                  ),

                  "min_sendable_msat": (
                      payout_health.get(
                          "min_sendable_msat"
                      )
                  ),

                  "max_sendable_msat": (
                      payout_health.get(
                          "max_sendable_msat"
                      )
                  ),
              },
          }


          # ===========================================================
          # EVOLUTION DELTAS
          # ===========================================================

          deltas = {}

          if previous:

              profile_fields = (
                  "karma",
                  "posts",
                  "comments",
                  "followers",
                  "following",
              )

              for field_name in profile_fields:

                  deltas[field_name] = delta(
                      profile_metrics.get(
                          field_name
                      ),
                      previous_profile.get(
                          field_name
                      )
                  )


              deltas[
                  "core_observations"
              ] = (
                  len(observations)
                  - number(
                      previous_core.get(
                          "observations"
                      )
                  )
              )

              deltas[
                  "core_decisions"
              ] = (
                  len(decisions)
                  - number(
                      previous_core.get(
                          "decisions"
                      )
                  )
              )

              deltas[
                  "core_actions"
              ] = (
                  len(actions)
                  - number(
                      previous_core.get(
                          "actions"
                      )
                  )
              )

              deltas[
                  "core_learnings"
              ] = (
                  len(learnings)
                  - number(
                      previous_core.get(
                          "learnings"
                      )
                  )
              )

              deltas[
                  "knowledge_facts"
              ] = (
                  len(knowledge_facts)
                  - number(
                      previous_knowledge.get(
                          "facts"
                      )
                  )
              )

              deltas[
                  "knowledge_experiences"
              ] = (
                  len(knowledge_experiences)
                  - number(
                      previous_knowledge.get(
                          "experiences"
                      )
                  )
              )

              deltas[
                  "knowledge_learnings"
              ] = (
                  len(knowledge_learnings)
                  - number(
                      previous_knowledge.get(
                          "learnings"
                      )
                  )
              )

              deltas[
                  "knowledge_sources"
              ] = (
                  len(knowledge_sources)
                  - number(
                      previous_knowledge.get(
                          "sources"
                      )
                  )
              )


          # ===========================================================
          # EVOLUTION STATUS
          # ===========================================================

          if not previous:

              evolution_status = "BASELINE"

          else:

              measurable_changes = [
                  value
                  for value in deltas.values()
                  if (
                      value is not None
                      and value != 0
                  )
              ]

              if measurable_changes:

                  evolution_status = "CHANGED"

              elif profile_errors:

                  evolution_status = "PARTIAL_DATA"

              else:

                  evolution_status = "NO_CHANGE"


          snapshot[
              "deltas"
          ] = deltas

          snapshot[
              "evolution_status"
          ] = evolution_status


          # ===========================================================
          # STORE HISTORY
          # ===========================================================

          snapshots.append(
              snapshot
          )

          history[
              "snapshots"
          ] = snapshots[
              -MAX_HISTORY_ITEMS:
          ]

          history[
              "version"
          ] = 1

          history[
              "last_run"
          ] = NOW

          history[
              "run_count"
          ] = (
              number(
                  history.get(
                      "run_count"
                  )
              )
              + 1
          )

          save_json(
              EVOLUTION_FILE,
              history
          )


          # ===========================================================
          # REPORT
          # ===========================================================

          recent = list(
              reversed(
                  history[
                      "snapshots"
                  ][-10:]
              )
          )

          lines = []

          lines.append(
              "# NØX — Evolution Monitor"
          )

          lines.append("")

          lines.append(
              f"Last measurement: `{NOW}`"
          )

          lines.append(
              f"Evolution status: "
              f"`{evolution_status}`"
          )

          lines.append(
              f"Colony SDK: "
              f"`{SDK_VERSION}`"
          )

          lines.append("")

          lines.append(
              "This report is observational only. "
              "It does not perform Colony actions."
          )

          lines.append("")


          # -----------------------------------------------------------
          # DATA INTEGRITY
          # -----------------------------------------------------------

          lines.append(
              "## Data integrity"
          )

          lines.append("")

          lines.append(
              f"- Colony profile: "
              f"`{profile_metrics['status']}`"
          )

          lines.append(
              f"- Profile fully available: "
              f"`{profile_metrics['available']}`"
          )

          lines.append(
              f"- Previous snapshot: "
              f"`{'yes' if previous else 'no'}`"
          )

          lines.append(
              f"- Stored snapshots: "
              f"`{len(history['snapshots'])}`"
          )

          if profile_errors:

              lines.append(
                  "- Profile data notes: "
                  f"`{', '.join(sorted(set(profile_errors)))}`"
              )

          else:

              lines.append(
                  "- Profile data notes: `none`"
              )

          lines.append("")


          # -----------------------------------------------------------
          # COLONY PROFILE
          # -----------------------------------------------------------

          lines.append(
              "## Colony profile"
          )

          lines.append("")

          lines.append(
              f"- Username: "
              f"`{profile_metrics.get('username') or 'unknown'}`"
          )

          lines.append(
              f"- Karma: "
              f"`{profile_metrics.get('karma')}` "
              f"({display_delta(deltas.get('karma'))})"
          )

          lines.append(
              f"- Posts: "
              f"`{profile_metrics.get('posts')}` "
              f"({display_delta(deltas.get('posts'))})"
          )

          lines.append(
              f"- Comments: "
              f"`{profile_metrics.get('comments')}` "
              f"({display_delta(deltas.get('comments'))})"
          )

          lines.append(
              f"- Followers: "
              f"`{profile_metrics.get('followers')}` "
              f"({display_delta(deltas.get('followers'))})"
          )

          lines.append(
              f"- Following: "
              f"`{profile_metrics.get('following')}` "
              f"({display_delta(deltas.get('following'))})"
          )

          lines.append("")


          # -----------------------------------------------------------
          # COGNITIVE EVOLUTION
          # -----------------------------------------------------------

          lines.append(
