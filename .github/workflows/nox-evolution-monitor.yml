name: NØX - Evolution Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-evolution-monitor
  cancel-in-progress: false

env:
  CORE_MEMORY_FILE: memory/nox_core_memory.json
  CORE_RUNTIME_FILE: memory/nox_core_runtime.json
  KNOWLEDGE_FILE: memory/nox_knowledge.json
  EVOLUTION_FILE: memory/nox_evolution_history.json
  REPORT_FILE: memory/nox_evolution_report.md

  MAX_HISTORY_ITEMS: "500"

jobs:
  evolution-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colony SDK
        run: pip install colony-sdk

      - name: Measure NØX evolution
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from colony_sdk import ColonyAPIError, ColonyAuthError, ColonyClient


          # ===========================================================
          # NØX EVOLUTION MONITOR
          #
          # Objectif :
          # observer l'évolution réelle de NØX dans le temps.
          #
          # Ce workflow est READ-ONLY concernant Colony :
          # - aucun post
          # - aucun commentaire
          # - aucun DM
          # - aucun bid
          # - aucun paiement
          # - aucune dépense
          #
          # Il mesure uniquement les données déjà produites
          # par NØX et quelques métriques publiques du profil.
          # ===========================================================

          NOW = datetime.now(timezone.utc).isoformat()

          CORE_MEMORY_FILE = Path(
              os.environ["CORE_MEMORY_FILE"]
          )
          CORE_RUNTIME_FILE = Path(
              os.environ["CORE_RUNTIME_FILE"]
          )
          KNOWLEDGE_FILE = Path(
              os.environ["KNOWLEDGE_FILE"]
          )
          EVOLUTION_FILE = Path(
              os.environ["EVOLUTION_FILE"]
          )
          REPORT_FILE = Path(
              os.environ["REPORT_FILE"]
          )

          MAX_HISTORY_ITEMS = int(
              os.environ["MAX_HISTORY_ITEMS"]
          )

          API_KEY = os.environ.get(
              "COLONY_API_KEY",
              ""
          ).strip()


          # ===========================================================
          # HELPERS
          # ===========================================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"WARNING: impossible de lire "
                      f"{path}: {exc}"
                  )
                  return default


          def save_json(path, data):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def as_list(value):
              return value if isinstance(value, list) else []


          def as_dict(value):
              return value if isinstance(value, dict) else {}


          def number(value, default=0):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return default


          # ===========================================================
          # LOAD EXISTING NØX DATA
          # ===========================================================

          core_memory = as_dict(
              load_json(
                  CORE_MEMORY_FILE,
                  {}
              )
          )

          core_runtime = as_dict(
              load_json(
                  CORE_RUNTIME_FILE,
                  {}
              )
          )

          knowledge = as_dict(
              load_json(
                  KNOWLEDGE_FILE,
                  {}
              )
          )

          history = load_json(
              EVOLUTION_FILE,
              {
                  "version": 1,
                  "snapshots": []
              }
          )

          if not isinstance(history, dict):
              history = {
                  "version": 1,
                  "snapshots": []
              }

          if not isinstance(
              history.get("snapshots"),
              list
          ):
              history["snapshots"] = []


          observations = as_list(
              core_memory.get("observations")
          )

          decisions = as_list(
              core_memory.get("decisions")
          )

          actions = as_list(
              core_memory.get("actions")
          )

          learnings = as_list(
              core_memory.get("learnings")
          )

          knowledge_facts = as_list(
              knowledge.get("facts")
          )

          knowledge_experiences = as_list(
              knowledge.get("experiences")
          )

          knowledge_learnings = as_list(
              knowledge.get("learnings")
          )

          knowledge_sources = as_list(
              knowledge.get("sources")
          )


          # ===========================================================
          # CORE METRICS
          # ===========================================================

          skill_attempts = as_dict(
              core_runtime.get(
                  "skill_attempt_counts"
              )
          )

          skill_successes = as_dict(
              core_runtime.get(
                  "skill_success_counts"
              )
          )

          total_skill_attempts = sum(
              number(value)
              for value in skill_attempts.values()
          )

          total_skill_successes = sum(
              number(value)
              for value in skill_successes.values()
          )

          if total_skill_attempts:
              skill_success_ratio = round(
                  total_skill_successes
                  / total_skill_attempts,
                  3
              )
          else:
              skill_success_ratio = None


          payout_health = as_dict(
              core_runtime.get(
                  "payout_health"
              )
          )

          payout_status = (
              payout_health.get("status")
              or "UNKNOWN"
          )


          # ===========================================================
          # COLONY PROFILE — READ ONLY
          # ===========================================================

          profile_metrics = {
              "available": False,
              "username": None,
              "karma": None,
              "posts": None,
              "comments": None,
              "followers": None,
              "following": None,
          }

          if API_KEY:
              try:
                  client = ColonyClient(API_KEY)
                  state = client.bootstrap()

                  profile = as_dict(
                      state.get("profile")
                  )

                  username = str(
                      profile.get("username")
                      or ""
                  ).strip()

                  if username and username != "nox_origine":
                      raise SystemExit(
                          "SECURITY STOP: le profil "
                          f"authentifié est '{username}', "
                          "pas 'nox_origine'."
                      )

                  profile_metrics.update(
                      {
                          "available": True,
                          "username": (
                              username
                              or "nox_origine"
                          ),
                          "karma": profile.get(
                              "karma"
                          ),
                          "posts": profile.get(
                              "posts"
                          ),
                          "comments": profile.get(
                              "comments"
                          ),
                          "followers": profile.get(
                              "followers"
                          ),
                          "following": profile.get(
                              "following"
                          ),
                      }
                  )

              except ColonyAuthError as exc:
                  print(
                      "PROFILE: authentification "
                      f"impossible: {exc}"
                  )

              except ColonyAPIError as exc:
                  print(
                      "PROFILE: API Colony indisponible: "
                      f"{exc}"
                  )

          else:
              print(
                  "PROFILE: COLONY_API_KEY absent."
              )


          # ===========================================================
          # CURRENT SNAPSHOT
          # ===========================================================

          snapshot = {
              "timestamp": NOW,

              "profile": profile_metrics,

              "core": {
                  "run_count": number(
                      core_runtime.get(
                          "run_count"
                      )
                  ),
                  "observations": len(
                      observations
                  ),
                  "decisions": len(
                      decisions
                  ),
                  "actions": len(
                      actions
                  ),
                  "learnings": len(
                      learnings
                  ),
                  "web_queries": len(
                      as_list(
                          core_runtime.get(
                              "web_queries"
                          )
                      )
                  ),
                  "skill_attempts": (
                      total_skill_attempts
                  ),
                  "skill_successes": (
                      total_skill_successes
                  ),
                  "skill_success_ratio": (
                      skill_success_ratio
                  ),
              },

              "knowledge": {
                  "run_count": number(
                      knowledge.get(
                          "run_count"
                      )
                  ),
                  "facts": len(
                      knowledge_facts
                  ),
                  "experiences": len(
                      knowledge_experiences
                  ),
                  "learnings": len(
                      knowledge_learnings
                  ),
                  "sources": len(
                      knowledge_sources
                  ),
              },

              "payout": {
                  "status": payout_status,
                  "lightning_address": bool(
                      payout_health.get(
                          "lightning_address"
                      )
                  ),
                  "min_sendable_msat": (
                      payout_health.get(
                          "min_sendable_msat"
                      )
                  ),
                  "max_sendable_msat": (
                      payout_health.get(
                          "max_sendable_msat"
                      )
                  ),
              },
          }


          # ===========================================================
          # EVOLUTION DELTAS
          # ===========================================================

          previous = None

          snapshots = history["snapshots"]

          if snapshots:
              previous = snapshots[-1]

          deltas = {}

          if previous:
              previous_core = as_dict(
                  previous.get("core")
              )

              previous_knowledge = as_dict(
                  previous.get("knowledge")
              )

              previous_profile = as_dict(
                  previous.get("profile")
              )

              deltas = {
                  "karma": (
                      number(
                          profile_metrics.get(
                              "karma"
                          )
                      )
                      - number(
                          previous_profile.get(
                              "karma"
                          )
                      )
                  ),

                  "posts": (
                      number(
                          profile_metrics.get(
                              "posts"
                          )
                      )
                      - number(
                          previous_profile.get(
                              "posts"
                          )
                      )
                  ),

                  "comments": (
                      number(
                          profile_metrics.get(
                              "comments"
                          )
                      )
                      - number(
                          previous_profile.get(
                              "comments"
                          )
                      )
                  ),

                  "followers": (
                      number(
                          profile_metrics.get(
                              "followers"
                          )
                      )
                      - number(
                          previous_profile.get(
                              "followers"
                          )
                      )
                  ),

                  "core_observations": (
                      len(observations)
                      - number(
                          previous_core.get(
                              "observations"
                          )
                      )
                  ),

                  "core_decisions": (
                      len(decisions)
                      - number(
                          previous_core.get(
                              "decisions"
                          )
                      )
                  ),

                  "core_actions": (
                      len(actions)
                      - number(
                          previous_core.get(
                              "actions"
                          )
                      )
                  ),

                  "core_learnings": (
                      len(learnings)
                      - number(
                          previous_core.get(
                              "learnings"
                          )
                      )
                  ),

                  "knowledge_facts": (
                      len(knowledge_facts)
                      - number(
                          previous_knowledge.get(
                              "facts"
                          )
                      )
                  ),

                  "knowledge_experiences": (
                      len(knowledge_experiences)
                      - number(
                          previous_knowledge.get(
                              "experiences"
                          )
                      )
                  ),

                  "knowledge_learnings": (
                      len(knowledge_learnings)
                      - number(
                          previous_knowledge.get(
                              "learnings"
                          )
                      )
                  ),

                  "knowledge_sources": (
                      len(knowledge_sources)
                      - number(
                          previous_knowledge.get(
                              "sources"
                          )
                      )
                  ),
              }


          snapshot["deltas"] = deltas


          # ===========================================================
          # STORE HISTORY
          # ===========================================================

          snapshots.append(
              snapshot
          )

          history["snapshots"] = (
              snapshots[-MAX_HISTORY_ITEMS:]
          )

          history["last_run"] = NOW
          history["run_count"] = number(
              history.get("run_count")
          ) + 1

          save_json(
              EVOLUTION_FILE,
              history
          )


          # ===========================================================
          # REPORT
          # ===========================================================

          def display_delta(value):
              if value is None:
                  return "n/a"

              if value > 0:
                  return f"+{value}"

              return str(value)


          recent = list(
              reversed(
                  history["snapshots"][-10:]
              )
          )

          lines = []

          lines.append(
              "# NØX — Evolution Monitor"
          )
          lines.append("")
          lines.append(
              f"Last measurement: `{NOW}`"
          )
          lines.append("")
          lines.append(
              "This report is observational only. "
              "It does not perform Colony actions."
          )
          lines.append("")

          lines.append(
              "## Colony profile"
          )
          lines.append("")

          lines.append(
              f"- Username: "
              f"`{profile_metrics.get('username') or 'unknown'}`"
          )
          lines.append(
              f"- Karma: "
              f"`{profile_metrics.get('karma')}` "
              f"({display_delta(deltas.get('karma'))})"
          )
          lines.append(
              f"- Posts: "
              f"`{profile_metrics.get('posts')}` "
              f"({display_delta(deltas.get('posts'))})"
          )
          lines.append(
              f"- Comments: "
              f"`{profile_metrics.get('comments')}` "
              f"({display_delta(deltas.get('comments'))})"
          )
          lines.append(
              f"- Followers: "
              f"`{profile_metrics.get('followers')}` "
              f"({display_delta(deltas.get('followers'))})"
          )
          lines.append(
              f"- Following: "
              f"`{profile_metrics.get('following')}`"
          )
          lines.append("")

          lines.append(
              "## Cognitive evolution"
          )
          lines.append("")

          lines.append(
              f"- Core runs: "
              f"`{snapshot['core']['run_count']}`"
          )
          lines.append(
              f"- Observations: "
              f"`{snapshot['core']['observations']}` "
              f"({display_delta(deltas.get('core_observations'))})"
          )
          lines.append(
              f"- Decisions: "
              f"`{snapshot['core']['decisions']}` "
              f"({display_delta(deltas.get('core_decisions'))})"
          )
          lines.append(
              f"- Actions: "
              f"`{snapshot['core']['actions']}` "
              f"({display_delta(deltas.get('core_actions'))})"
          )
          lines.append(
              f"- Learnings: "
              f"`{snapshot['core']['learnings']}` "
              f"({display_delta(deltas.get('core_learnings'))})"
          )
          lines.append(
              f"- Web queries recorded: "
              f"`{snapshot['core']['web_queries']}`"
          )
          lines.append(
              f"- Skill attempts: "
              f"`{snapshot['core']['skill_attempts']}`"
          )
          lines.append(
              f"- Skill successes: "
              f"`{snapshot['core']['skill_successes']}`"
          )
          lines.append(
              f"- Skill success ratio: "
              f"`{snapshot['core']['skill_success_ratio']}`"
          )
          lines.append("")

          lines.append(
              "## Knowledge evolution"
          )
          lines.append("")

          lines.append(
              f"- Facts: "
              f"`{snapshot['knowledge']['facts']}` "
              f"({display_delta(deltas.get('knowledge_facts'))})"
          )
          lines.append(
              f"- Experiences: "
              f"`{snapshot['knowledge']['experiences']}` "
              f"({display_delta(deltas.get('knowledge_experiences'))})"
          )
          lines.append(
              f"- Learnings: "
              f"`{snapshot['knowledge']['learnings']}` "
              f"({display_delta(deltas.get('knowledge_learnings'))})"
          )
          lines.append(
              f"- Sources: "
              f"`{snapshot['knowledge']['sources']}` "
              f"({display_delta(deltas.get('knowledge_sources'))})"
          )
          lines.append("")

          lines.append(
              "## Lightning payout state"
          )
          lines.append("")

          lines.append(
              f"- Status: "
              f"`{snapshot['payout']['status']}`"
          )
          lines.append(
              f"- Lightning address detected: "
              f"`{snapshot['payout']['lightning_address']}`"
          )

          if (
              snapshot["payout"]["min_sendable_msat"]
              is not None
          ):
              lines.append(
                  "- LNURL range: "
                  f"`"
                  f"{snapshot['payout']['min_sendable_msat'] / 1000:g}"
                  f" - "
                  f"{snapshot['payout']['max_sendable_msat'] / 1000:g}"
                  f" sats`"
              )

          lines.append("")

          lines.append(
              "## Recent measurements"
          )
          lines.append("")

          if recent:
              lines.append(
                  "| Time | Karma | Observations | Actions | Learnings | Knowledge |"
              )
              lines.append(
                  "|---|---:|---:|---:|---:|---:|"
              )

              for item in recent:
                  item_profile = as_dict(
                      item.get("profile")
                  )

                  item_core = as_dict(
                      item.get("core")
                  )

                  item_knowledge = as_dict(
                      item.get("knowledge")
                  )

                  lines.append(
                      "| "
                      f"{str(item.get('timestamp', ''))[:19]} | "
                      f"{item_profile.get('karma', 'n/a')} | "
                      f"{item_core.get('observations', 0)} | "
                      f"{item_core.get('actions', 0)} | "
                      f"{item_core.get('learnings', 0)} | "
                      f"{item_knowledge.get('facts', 0)} |"
                  )

          else:
              lines.append(
                  "No previous measurements."
              )

          lines.append("")
          lines.append(
              "## Interpretation"
          )
          lines.append("")
          lines.append(
              "The monitor records measurable changes only. "
              "It does not infer success from activity alone."
          )
          lines.append(
              "Karma, interactions, actions, learning, "
              "knowledge growth and payout readiness are "
              "tracked separately."
          )
          lines.append("")

          REPORT_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          REPORT_FILE.write_text(
              "\n".join(lines),
              encoding="utf-8"
          )


          # ===========================================================
          # CONSOLE SUMMARY
          # ===========================================================

          print("")
          print(
              "=== NØX EVOLUTION MONITOR ==="
          )
          print(
              f"Karma: "
              f"{profile_metrics.get('karma')} "
              f"({display_delta(deltas.get('karma'))})"
          )
          print(
              f"Posts: "
              f"{profile_metrics.get('posts')} "
              f"({display_delta(deltas.get('posts'))})"
          )
          print(
              f"Comments: "
              f"{profile_metrics.get('comments')} "
              f"({display_delta(deltas.get('comments'))})"
          )
          print(
              f"Followers: "
              f"{profile_metrics.get('followers')} "
              f"({display_delta(deltas.get('followers'))})"
          )
          print(
              f"Core observations: "
              f"{len(observations)}"
          )
          print(
              f"Core actions: "
              f"{len(actions)}"
          )
          print(
              f"Core learnings: "
              f"{len(learnings)}"
          )
          print(
              f"Knowledge facts: "
              f"{len(knowledge_facts)}"
          )
          print(
              f"Knowledge experiences: "
              f"{len(knowledge_experiences)}"
          )
          print(
              f"Knowledge learnings: "
              f"{len(knowledge_learnings)}"
          )
          print(
              f"Payout: "
              f"{payout_status}"
          )
          print("")
          print(
              "=== EVOLUTION OBSERVED ==="
          )
          PY

      - name: Commit evolution data
        run: |
          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_evolution_history.json
          git add memory/nox_evolution_report.md

          if git diff --cached --quiet; then
            echo "Aucune évolution à enregistrer."
          else
            git commit -m "nox: update evolution monitor"
            git push
          fi
