name: NØX - Evolution Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-state
  cancel-in-progress: false

jobs:
  monitor-evolution:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run read-only evolution audit
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          from hashlib import sha256
          policy={"PROJECT_COST_EUR":"0","AUTO_PAYMENT":"false","AUTO_SPENDING":"false","GEMINI_USED":"false","EXTERNAL_AI_USED":"false"}
          for k,v in policy.items():
              if os.environ.get(k,v).lower()!=v: raise SystemExit(f"SECURITY STOP: {k} must remain {v}")
          files=[Path("memory/nox_core_memory.json"),Path("memory/nox_core_runtime.json"),Path("memory/nox_work_factory.json"),Path("memory/nox_colony_presence.json"),Path("memory/nox_knowledge.json"),Path("memory/nox_self_evolution.json")]
          def load(p):
              if not p.exists(): return None
              try: obj=json.loads(p.read_text(encoding="utf-8"))
              except Exception as e: raise SystemExit(f"STATE SAFETY STOP: invalid JSON in {p}: {e}")
              if not isinstance(obj,dict): raise SystemExit(f"STATE SAFETY STOP: {p} root is not object")
              return obj
          checks=[]
          for p in files:
              obj=load(p)
              checks.append({"file":str(p),"exists":obj is not None,"bytes":p.stat().st_size if obj is not None else 0,"version":obj.get("version") if obj else None,"root_type":"object" if obj is not None else "missing"})
          now=datetime.now(timezone.utc).isoformat()
          report={"timestamp":now,"mode":"read_only","files":checks,"automatic_patching":False,"external_ai":False,"payments":False,"spending":False}
          signature=sha256(json.dumps(report,sort_keys=True).encode()).hexdigest()[:20]
          print(json.dumps({"signature":signature,**report},ensure_ascii=False,indent=2))
          # Deliberately does not modify source files or create an automatic patch.
          PY
