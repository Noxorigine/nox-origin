      - name: Commit evolution data
        run: |
          git config user.name "NOX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_evolution_history.json
          git add memory/nox_evolution_report.md

          if git diff --cached --quiet; then
            echo "Aucune nouvelle mesure à enregistrer."
            exit 0
          fi

          git commit -m "nox: update evolution monitor"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Evolution data pushed successfully."
              exit 0
            fi

            echo "Push failed; synchronisation avec origin/main (attempt ${attempt}/3)."

            git fetch origin main
            git rebase origin/main
          done

          echo "ERROR: impossible de pousser les données d'évolution après 3 tentatives."
          exit 1
