name: NØX ACT 02 - DM Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: nox-act02-dm-diagnostic
  cancel-in-progress: false

jobs:
  dm-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Diagnose DM notifications
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python -u - <<'PY'
          import json
          import os
          import sys
          import requests

          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ["COLONY_API_KEY"]

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "NOX-ACT02-DM-DIAGNOSTIC/1.0",
          })

          def safe_keys(obj):
              if isinstance(obj, dict):
                  return sorted(obj.keys())
              return []

          def safe_type(value):
              if value is None:
                  return "null"
              return type(value).__name__

          def summarize_sender(value):
              if value is None:
                  return None

              if isinstance(value, str):
                  return {
                      "type": "string",
                      "value_present": bool(value),
                  }

              if isinstance(value, dict):
                  result = {
                      "type": "object",
                      "keys": sorted(value.keys()),
                  }

                  username_fields = [
                      "username",
                      "handle",
                      "name",
                      "user_name",
                  ]

                  found = {}

                  for field in username_fields:
                      if field in value:
                          found[field] = {
                              "type": safe_type(value[field]),
                              "value_present": bool(value[field]),
                          }

                  if found:
                      result["identity_fields"] = found

                  return result

              return {
                  "type": safe_type(value),
              }

          def extract_notification_list(payload):
              if isinstance(payload, list):
                  return payload

              if not isinstance(payload, dict):
                  return []

              for key in [
                  "notifications",
                  "data",
                  "items",
                  "results",
              ]:
                  value = payload.get(key)

                  if isinstance(value, list):
                      return value

                  if isinstance(value, dict):
                      for nested_key in [
                          "notifications",
                          "items",
                          "results",
                          "data",
                      ]:
                          nested = value.get(nested_key)

                          if isinstance(nested, list):
                              return nested

              return []

          print(
              "=== ACT02 DM DIAGNOSTIC START ===",
              flush=True,
          )

          # ------------------------------------------------------------
          # AUTHENTICATION
          # ------------------------------------------------------------

          auth_url = f"{BASE_URL}/auth/token"

          try:
              auth = session.post(
                  auth_url,
                  json={
                      "api_key": API_KEY
                  },
                  timeout=10,
              )
          except Exception as exc:
              print(
                  f"AUTH EXCEPTION {type(exc).__name__}",
                  flush=True,
              )
              sys.exit(1)

          print(
              f"AUTH STATUS {auth.status_code}",
              flush=True,
          )

          if auth.status_code not in (200, 201):
              print(
                  "AUTH FAILED",
                  flush=True,
              )
              print(
                  "AUTH RESPONSE TYPE",
                  auth.headers.get(
                      "content-type",
                      "unknown",
                  ),
                  flush=True,
              )
              sys.exit(1)

          try:
              auth_data = auth.json()
          except Exception:
              print(
                  "AUTH JSON PARSE FAILED",
                  flush=True,
              )
              sys.exit(1)

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              print(
                  "AUTH TOKEN NOT FOUND",
                  flush=True,
              )
              print(
                  "AUTH JSON KEYS",
                  sorted(auth_data.keys())
                  if isinstance(auth_data, dict)
                  else [],
                  flush=True,
              )
              sys.exit(1)

          session.headers["Authorization"] = (
              f"Bearer {token}"
          )

          # ------------------------------------------------------------
          # IDENTITY
          # ------------------------------------------------------------

          try:
              identity = session.get(
                  f"{BASE_URL}/users/me",
                  timeout=10,
              )

              print(
                  f"IDENTITY STATUS {identity.status_code}",
                  flush=True,
              )

              if identity.status_code == 200:
                  try:
                      identity_data = identity.json()

                      print(
                          "IDENTITY KEYS",
                          safe_keys(identity_data),
                          flush=True,
                      )

                      username = None

                      if isinstance(identity_data, dict):
                          username = (
                              identity_data.get("username")
                              or identity_data.get("handle")
                          )

                          user_obj = identity_data.get("user")

                          if (
                              not username
                              and isinstance(user_obj, dict)
                          ):
                              username = (
                                  user_obj.get("username")
                                  or user_obj.get("handle")
                              )

                      if username:
                          print(
                              f"NOX USERNAME {username}",
                              flush=True,
                          )

                  except Exception:
                      print(
                          "IDENTITY JSON PARSE FAILED",
                          flush=True,
                      )

          except Exception as exc:
              print(
                  f"IDENTITY EXCEPTION {type(exc).__name__}",
                  flush=True,
              )

          # ------------------------------------------------------------
          # NOTIFICATIONS
          # ------------------------------------------------------------

          notifications_url = (
              f"{BASE_URL}/notifications"
          )

          try:
              response = session.get(
                  notifications_url,
                  params={
                      "unread_only": "true",
                      "limit": "50",
                  },
                  timeout=10,
              )

          except Exception as exc:
              print(
                  f"DM NOTIFICATIONS EXCEPTION "
                  f"{type(exc).__name__}",
                  flush=True,
              )
              sys.exit(1)

          print(
              f"DM NOTIFICATIONS STATUS {response.status_code}",
              flush=True,
          )

          if response.status_code != 200:
              print(
                  "DM NOTIFICATIONS FAILED",
                  flush=True,
              )
              print(
                  "CONTENT TYPE",
                  response.headers.get(
                      "content-type",
                      "unknown",
                  ),
                  flush=True,
              )
              sys.exit(1)

          try:
              payload = response.json()

          except Exception:
              print(
                  "DM NOTIFICATIONS JSON PARSE FAILED",
                  flush=True,
              )
              sys.exit(1)

          print(
              "TOP LEVEL RESPONSE TYPE",
              safe_type(payload),
              flush=True,
          )

          if isinstance(payload, dict):
              print(
                  "TOP LEVEL KEYS",
                  safe_keys(payload),
                  flush=True,
              )

          notifications = extract_notification_list(
              payload
          )

          print(
              f"NOTIFICATIONS FOUND {len(notifications)}",
              flush=True,
          )

          # ------------------------------------------------------------
          # SAFE STRUCTURE DIAGNOSTIC
          #
          # IMPORTANT:
          # Message body/content/text is NEVER printed.
          # ------------------------------------------------------------

          for index, notification in enumerate(
              notifications,
              start=1,
          ):

              print(
                  "",
                  flush=True,
              )

              print(
                  f"--- NOTIFICATION {index} ---",
                  flush=True,
              )

              if not isinstance(notification, dict):
                  print(
                      "TYPE",
                      safe_type(notification),
                      flush=True,
                  )
                  continue

              print(
                  "KEYS",
                  sorted(notification.keys()),
                  flush=True,
              )

              # --------------------------------------------------------
              # IDENTIFIERS
              # --------------------------------------------------------

              for field in [
                  "id",
                  "notification_id",
                  "message_id",
                  "conversation_id",
                  "post_id",
                  "comment_id",
              ]:

                  if field in notification:

                      value = notification[field]

                      if value is None:
                          print(
                              f"{field}: null",
                              flush=True,
                          )
                      else:
                          print(
                              f"{field}: PRESENT "
                              f"type={safe_type(value)}",
                              flush=True,
                          )

              # --------------------------------------------------------
              # NOTIFICATION TYPE
              # --------------------------------------------------------

              for field in [
                  "notification_type",
                  "type",
                  "kind",
                  "event_type",
              ]:

                  if field in notification:

                      value = notification[field]

                      if isinstance(
                          value,
                          (
                              str,
                              int,
                              float,
                              bool,
                          ),
                      ):
                          print(
                              f"{field}: {value!r}",
                              flush=True,
                          )
                      else:
                          print(
                              f"{field}: "
                              f"type={safe_type(value)}",
                              flush=True,
                          )

              # --------------------------------------------------------
              # SENDER FIELDS
              #
              # Only metadata is printed.
              # --------------------------------------------------------

              for field in [
                  "sender",
                  "sender_username",
                  "from_username",
                  "author",
                  "author_username",
                  "user",
                  "from",
              ]:

                  if field in notification:

                      print(
                          f"{field}:",
                          json.dumps(
                              summarize_sender(
                                  notification[field]
                              ),
                              ensure_ascii=False,
                              sort_keys=True,
                          ),
                          flush=True,
                      )

              # --------------------------------------------------------
              # POSSIBLE NESTED OBJECTS
              # --------------------------------------------------------

              for field in [
                  "message",
                  "direct_message",
                  "dm",
                  "data",
                  "payload",
                  "metadata",
              ]:

                  if field not in notification:
                      continue

                  value = notification[field]

                  print(
                      f"{field} TYPE "
                      f"{safe_type(value)}",
                      flush=True,
                  )

                  if isinstance(value, dict):

                      print(
                          f"{field} KEYS "
                          f"{sorted(value.keys())}",
                          flush=True,
                      )

                      for sender_field in [
                          "sender",
                          "sender_username",
                          "from_username",
                          "author",
                          "author_username",
                          "user",
                          "from",
                      ]:

                          if sender_field in value:

                              print(
                                  f"{field}."
                                  f"{sender_field}:",
                                  json.dumps(
                                      summarize_sender(
                                          value[
                                              sender_field
                                          ]
                                      ),
                                      ensure_ascii=False,
                                      sort_keys=True,
                                  ),
                                  flush=True,
                              )

              # --------------------------------------------------------
              # SENSITIVE FIELDS
              #
              # Presence only. Values are hidden.
              # --------------------------------------------------------

              for sensitive_field in [
                  "body",
                  "content",
                  "text",
                  "message_body",
                  "message_content",
              ]:

                  if sensitive_field in notification:

                      print(
                          f"{sensitive_field}: "
                          f"PRESENT (VALUE HIDDEN)",
                          flush=True,
                      )

          print(
              "",
              flush=True,
          )

          print(
              "=== ACT02 DM DIAGNOSTIC COMPLETE ===",
              flush=True,
          )
          PY
