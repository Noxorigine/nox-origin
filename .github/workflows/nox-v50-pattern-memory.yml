name: NØX Origin - V50 Pattern Memory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pattern-memory:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V50
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          print("===================================")
          print("NØX ORIGIN V50")
          print("PATTERN MEMORY")
          print("NO GEMINI")
          print("NO PUBLIC ACTION")
          print("===================================")

          now = datetime.now(timezone.utc).isoformat()

          COLONY_API_BASE = "https://thecolony.ai/api/v1"
          FEED_LIMIT = 25

          memory_file = Path("nox_memory.json")
          report_file = Path("V50_PATTERN_MEMORY.md")

          # --------------------------------------------------
          # ENVIRONMENT
          # --------------------------------------------------

          colony_api_key = os.environ.get("COLONY_API_KEY")

          if not colony_api_key:
              raise RuntimeError(
                  "COLONY_API_KEY is missing."
              )

          print("Environment: PASS")

          # --------------------------------------------------
          # MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault("question_log", [])
          memory.setdefault("source_log", [])
          memory.setdefault("knowledge_log", [])
          memory.setdefault("learning_log", [])
          memory.setdefault("observation_log", [])
          memory.setdefault("pattern_log", [])

          print("Memory loaded: PASS")

          # --------------------------------------------------
          # COLONY AUTHENTICATION
          # --------------------------------------------------

          print(
              "Authenticating with The Colony..."
          )

          auth_response = requests.post(
              f"{COLONY_API_BASE}/auth/token",
              json={
                  "api_key": colony_api_key
              },
              headers={
                  "Content-Type": "application/json"
              },
              timeout=(15, 30)
          )

          print(
              "Colony authentication status:",
              auth_response.status_code
          )

          if auth_response.status_code != 200:
              raise RuntimeError(
                  "The Colony authentication failed: "
                  f"{auth_response.status_code} "
                  f"{auth_response.text[:1500]}"
              )

          try:
              auth_data = auth_response.json()
          except ValueError:
              raise RuntimeError(
                  "Invalid Colony authentication JSON."
              )

          token = auth_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "No Colony access_token returned."
              )

          colony_headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          print("Colony authentication: PASS")

          # --------------------------------------------------
          # VERIFY IDENTITY
          # --------------------------------------------------

          print(
              "Verifying NØX identity..."
          )

          me_response = requests.get(
              f"{COLONY_API_BASE}/users/me",
              headers=colony_headers,
              timeout=(15, 30)
          )

          print(
              "Colony identity status:",
              me_response.status_code
          )

          if me_response.status_code != 200:
              raise RuntimeError(
                  "Colony identity verification failed: "
                  f"{me_response.status_code} "
                  f"{me_response.text[:1500]}"
              )

          try:
              me_data = me_response.json()
          except ValueError:
              me_data = {}

          agent_name = (
              me_data.get("username")
              or me_data.get("name")
              or "unknown"
          )

          print(
              "Authenticated agent:",
              agent_name
          )

          # --------------------------------------------------
          # FETCH FEED
          # --------------------------------------------------

          print(
              "Observing The Colony..."
          )

          feed_response = requests.get(
              f"{COLONY_API_BASE}/feed/for-you",
              headers=colony_headers,
              params={
                  "limit": FEED_LIMIT
              },
              timeout=(15, 45)
          )

          print(
              "Colony feed status:",
              feed_response.status_code
          )

          if feed_response.status_code != 200:
              raise RuntimeError(
                  "Colony feed request failed: "
                  f"{feed_response.status_code} "
                  f"{feed_response.text[:2000]}"
              )

          try:
              feed_data = feed_response.json()
          except ValueError:
              raise RuntimeError(
                  "Colony feed returned invalid JSON."
              )

          # --------------------------------------------------
          # NORMALIZE FEED
          # --------------------------------------------------

          raw_posts = []

          if isinstance(feed_data, list):

              raw_posts = feed_data

          elif isinstance(feed_data, dict):

              for key in (
                  "items",
                  "posts",
                  "data",
                  "results",
                  "feed"
              ):

                  value = feed_data.get(key)

                  if isinstance(value, list):

                      raw_posts = value
                      break

          print(
              "Feed items received:",
              len(raw_posts)
          )

          if not raw_posts:
              raise RuntimeError(
                  "No feed items received."
              )

          # --------------------------------------------------
          # NORMALIZE POSTS
          # --------------------------------------------------

          posts = []

          for item in raw_posts:

              if not isinstance(item, dict):
                  continue

              post_id = (
                  item.get("id")
                  or item.get("post_id")
                  or item.get("uuid")
              )

              title = (
                  item.get("title")
                  or item.get("name")
                  or ""
              )

              content = (
                  item.get("content")
                  or item.get("body")
                  or item.get("text")
                  or ""
              )

              author = item.get("author")

              if isinstance(author, dict):

                  author_name = (
                      author.get("username")
                      or author.get("name")
                      or author.get("handle")
                      or "unknown"
                  )

              else:

                  author_name = (
                      str(author)
                      if author
                      else (
                          item.get(
                              "author_username"
                          )
                          or "unknown"
                      )
                  )

              colony = (
                  item.get("colony")
                  or item.get("category")
                  or item.get("topic")
                  or "unknown"
              )

              created_at = (
                  item.get("created_at")
                  or item.get("published_at")
                  or item.get("createdAt")
                  or ""
              )

              if not title and not content:
                  continue

              posts.append(
                  {
                      "id": (
                          str(post_id)
                          if post_id is not None
                          else ""
                      ),
                      "title": str(title).strip(),
                      "content": str(content).strip(),
                      "author": str(
                          author_name
                      ).strip(),
                      "colony": str(
                          colony
                      ).strip(),
                      "created_at": str(
                          created_at
                      ).strip()
                  }
              )

          print(
              "Usable posts:",
              len(posts)
          )

          if not posts:
              raise RuntimeError(
                  "No usable Colony posts found."
              )

          # --------------------------------------------------
          # KEYWORD PATTERN ENGINE
          # --------------------------------------------------

          pattern_rules = {

              "technical_problem": [
                  "error",
                  "bug",
                  "broken",
                  "failure",
                  "fails",
                  "issue",
                  "problem",
                  "debug",
                  "crash",
                  "exception",
                  "timeout"
              ],

              "help_request": [
                  "help",
                  "anyone know",
                  "how do",
                  "how can",
                  "need help",
                  "looking for",
                  "stuck",
                  "can't",
                  "cannot"
              ],

              "collaboration": [
                  "collaborate",
                  "collaboration",
                  "together",
                  "partner",
                  "join",
                  "contribute",
                  "team",
                  "working with"
              ],

              "need": [
                  "need",
                  "needs",
                  "missing",
                  "lack",
                  "without",
                  "wish",
                  "would like",
                  "looking for"
              ],

              "opportunity": [
                  "opportunity",
                  "useful",
                  "could build",
                  "could create",
                  "potential",
                  "idea",
                  "solution"
              ],

              "verification": [
                  "verify",
                  "verification",
                  "evidence",
                  "proof",
                  "reproduce",
                  "replication",
                  "confirmed",
                  "uncertain"
              ],

              "automation": [
                  "automation",
                  "automate",
                  "agent",
                  "workflow",
                  "pipeline",
                  "bot"
              ],

              "permissions": [
                  "permission",
                  "access",
                  "authorization",
                  "unauthorized",
                  "credential",
                  "token",
                  "api key"
              ]
          }

          # --------------------------------------------------
          # EXTRACT PATTERNS
          # --------------------------------------------------

          pattern_results = {}

          for pattern_name, keywords in pattern_rules.items():

              matched_posts = []

              for post in posts:

                  combined = (
                      post["title"]
                      + " "
                      + post["content"]
                  ).lower()

                  matched_keywords = []

                  for keyword in keywords:

                      if keyword.lower() in combined:

                          matched_keywords.append(
                              keyword
                          )

                  if matched_keywords:

                      matched_posts.append(
                          {
                              "post_id": post["id"],
                              "author": post["author"],
                              "matched_keywords":
                                  sorted(
                                      set(
                                          matched_keywords
                                      )
                                  )
                          }
                      )

              if matched_posts:

                  unique_ids = sorted(
                      set(
                          item["post_id"]
                          for item in matched_posts
                          if item["post_id"]
                      )
                  )

                  count = len(unique_ids)

                  if count >= 4:
                      strength = "strong"
                  elif count >= 2:
                      strength = "moderate"
                  else:
                      strength = "weak"

                  score = min(
                      1.0,
                      count / 5.0
                  )

                  pattern_results[
                      pattern_name
                  ] = {
                      "count": count,
                      "strength": strength,
                      "score": round(
                          score,
                          2
                      ),
                      "post_ids": unique_ids,
                      "details": matched_posts
                  }

          # --------------------------------------------------
          # RECURRING SUBJECT EXTRACTION
          # --------------------------------------------------

          stop_words = {
              "the", "and", "for", "that",
              "with", "this", "from", "have",
              "your", "what", "when", "where",
              "about", "into", "they", "their",
              "there", "would", "could", "should",
              "been", "were", "will", "just",
              "more", "than", "only", "also",
              "does", "using", "used", "some",
              "like", "over", "under", "then",
              "them", "because", "while", "which",
              "very", "here", "being", "after"
          }

          word_frequency = {}

          for post in posts:

              words = re.findall(
                  r"[A-Za-z][A-Za-z0-9_-]{3,}",
                  (
                      post["title"]
                      + " "
                      + post["content"]
                  ).lower()
              )

              for word in words:

                  if word in stop_words:
                      continue

                  word_frequency[word] = (
                      word_frequency.get(
                          word,
                          0
                      ) + 1
                  )

          recurring_words = sorted(
              word_frequency.items(),
              key=lambda x: x[1],
              reverse=True
          )[:20]

          # --------------------------------------------------
          # MEMORY COMPARISON
          # --------------------------------------------------

          previous_patterns = memory.get(
              "pattern_log",
              []
          )

          if not isinstance(
              previous_patterns,
              list
          ):
              previous_patterns = []

          previous_counts = {}

          for record in previous_patterns[-20:]:

              if not isinstance(
                  record,
                  dict
              ):
                  continue

              for name, data in record.get(
                  "patterns",
                  {}
              ).items():

                  if not isinstance(
                      data,
                      dict
                  ):
                      continue

                  previous_counts[name] = (
                      previous_counts.get(
                          name,
                          0
                      )
                      + int(
                          data.get(
                              "count",
                              0
                          )
                      )
                  )

          # --------------------------------------------------
          # CREATE OBSERVATIONS
          # --------------------------------------------------

          observations = []

          for pattern_name, data in pattern_results.items():

              count = data["count"]

              if count < 2:
                  continue

              trend = "new"

              if pattern_name in previous_counts:

                  if count > previous_counts[
                      pattern_name
                  ]:

                      trend = "increasing"

                  elif count < previous_counts[
                      pattern_name
                  ]:

                      trend = "decreasing"

                  else:

                      trend = "persistent"

              observations.append(
                  {
                      "type": pattern_name,
                      "count": count,
                      "strength": data[
                          "strength"
                      ],
                      "score": data[
                          "score"
                      ],
                      "trend": trend,
                      "evidence_post_ids":
                          data[
                              "post_ids"
                          ],
                      "observation_level":
                          "pattern_detected",
                      "follow_up":
                          count >= 3
                  }
              )

          observations.sort(
              key=lambda item: (
                  item["score"],
                  item["count"]
              ),
              reverse=True
          )

          # --------------------------------------------------
          # SAVE OBSERVATION LOG
          # --------------------------------------------------

          observation_record = {
              "timestamp": now,
              "version": "V50",
              "subject": "The Colony",
              "type": "pattern_scan",
              "posts_received": len(
                  raw_posts
              ),
              "posts_analyzed": len(
                  posts
              ),
              "observations": observations,
              "recurring_words": [
                  {
                      "word": word,
                      "count": count
                  }
                  for word, count
                  in recurring_words
              ]
          }

          memory["observation_log"].append(
              observation_record
          )

          # --------------------------------------------------
          # SAVE PATTERN MEMORY
          # --------------------------------------------------

          pattern_record = {
              "timestamp": now,
              "version": "V50",
              "patterns": pattern_results,
              "posts_analyzed": len(posts)
          }

          memory["pattern_log"].append(
              pattern_record
          )

          # Keep memory manageable.

          if len(
              memory["observation_log"]
          ) > 100:

              memory["observation_log"] = (
                  memory[
                      "observation_log"
                  ][-100:]
              )

          if len(
              memory["pattern_log"]
          ) > 100:

              memory["pattern_log"] = (
                  memory[
                      "pattern_log"
                  ][-100:]
              )

          # --------------------------------------------------
          # LEARNING
          # --------------------------------------------------

          memory["learning_log"].append(
              {
                  "timestamp": now,
                  "version": "V50",
                  "lesson": (
                      "Recurring patterns must be "
                      "supported by multiple observations "
                      "before they are treated as important."
                  ),
                  "principle": (
                      "Frequency is a signal, not proof. "
                      "Repeated observations justify "
                      "further investigation but do not "
                      "establish truth."
                  )
              }
          )

          # --------------------------------------------------
          # VERSION
          # --------------------------------------------------

          memory["version"] = "V50"
          memory["last_updated"] = now

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              "Pattern memory written: PASS"
          )

          # --------------------------------------------------
          # RELOAD TEST
          # --------------------------------------------------

          reloaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          if not reloaded.get(
              "pattern_log"
          ):
              raise RuntimeError(
                  "Pattern memory persistence failed."
              )

          print(
              "Memory persistence: PASS"
          )

          # --------------------------------------------------
          # REPORT
          # --------------------------------------------------

          report_lines = [
              "# NØX Origin — V50 Pattern Memory",
              "",
              "## Mission",
              "",
              "NØX observes The Colony and detects "
              "recurring patterns without Gemini.",
              "",
              "V50 does not publish, comment, vote, "
              "follow, DM or perform external actions.",
              "",
              "## Feed",
              "",
              f"- Feed items received: "
              f"{len(raw_posts)}",
              f"- Usable posts analyzed: "
              f"{len(posts)}",
              "",
              "## Detected Patterns",
              ""
          ]

          if observations:

              for observation in observations:

                  report_lines.extend(
                      [
                          "### "
                          + observation[
                              "type"
                          ],
                          "",
                          "- Count: "
                          + str(
                              observation[
                                  "count"
                              ]
                          ),
                          "- Strength: "
                          + observation[
                              "strength"
                          ],
                          "- Score: "
                          + str(
                              observation[
                                  "score"
                              ]
                          ),
                          "- Trend: "
                          + observation[
                              "trend"
                          ],
                          "- Follow-up justified: "
                          + str(
                              observation[
                                  "follow_up"
                              ]
                          ),
                          "- Evidence post IDs: "
                          + ", ".join(
                              observation[
                                  "evidence_post_ids"
                              ]
                          ),
                          ""
                      ]
                  )

          else:

              report_lines.extend(
                  [
                      "No recurring pattern reached "
                      "the minimum threshold.",
                      ""
                  ]
              )

          report_lines.extend(
              [
                  "## Recurring Words",
                  ""
              ]
          )

          for word, count in recurring_words:

              report_lines.append(
                  f"- {word}: {count}"
              )

          report_lines.extend(
              [
                  "",
                  "## V50 Learning",
                  "",
                  "NØX has learned that repeated signals "
                  "can identify subjects deserving "
                  "further investigation.",
                  "",
                  "Frequency is not proof.",
                  "",
                  "A recurring pattern is a reason to "
                  "investigate, not a reason to assume.",
                  "",
                  "## Public Colony Activity",
                  "",
                  "- New post: NO",
                  "- New comment: NO",
                  "- Vote: NO",
                  "- Follow: NO",
                  "- DM: NO",
                  "- Purchase: NO",
                  "",
                  "## Gemini",
                  "",
                  "- Disabled",
                  "",
                  "## External Actions",
                  "",
                  "- Disabled",
                  "",
                  "## V50 Principle",
                  "",
                  "Observe first.",
                  "Detect recurrence second.",
                  "Investigate before acting."
              ]
          )

          report_file.write_text(
              "\n".join(report_lines),
              encoding="utf-8"
          )

          print(
              "Report written: PASS"
          )

          print("===================================")
          print("V50 COMPLETE")
          print(
              "Posts analyzed:",
              len(posts)
          )
          print(
              "Recurring patterns:",
              len(observations)
          )
          print("Gemini: DISABLED")
          print("Public action: NONE")
          print("Memory persistence: PASS")
          print("===================================")

          PY

      - name: Commit V50
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V50_PATTERN_MEMORY.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V50 - Pattern Memory"
            git push
          fi
