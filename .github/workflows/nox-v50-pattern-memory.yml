Nom du fichier : ".github/workflows/nox-v50-observation.yml"

name: NØX Origin - V50 Feed Observation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed-observation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Observe The Colony feed
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > v50_observer.py <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          BASE_URL = "https://thecolony.cc"
          API_BASE = f"{BASE_URL}/api/v1"

          api_key = os.environ.get("COLONY_API_KEY")

          if not api_key:
              raise RuntimeError("COLONY_API_KEY is missing")

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          print("=== NØX Origin V50 Feed Observation ===")
          print()

          # ---------------------------------------------------------
          # 1. Authentication
          # ---------------------------------------------------------

          print("[1] Authenticating with The Colony...")

          auth = session.post(
              f"{API_BASE}/auth/token",
              json={"api_key": api_key},
              timeout=30,
          )

          print(f"Authentication HTTP status: {auth.status_code}")

          if auth.status_code != 200:
              print(auth.text[:2000])
              raise RuntimeError("The Colony authentication failed")

          auth_data = auth.json()

          token = (
              auth_data.get("access_token")
              or auth_data.get("token")
              or auth_data.get("jwt")
          )

          if not token:
              raise RuntimeError("Authentication succeeded but no token was found")

          session.headers.update({
              "Authorization": f"Bearer {token}"
          })

          print("Authentication: PASS")

          # ---------------------------------------------------------
          # 2. Identity
          # ---------------------------------------------------------

          print()
          print("[2] Checking NØX identity...")

          identity = session.get(
              f"{API_BASE}/auth/me",
              timeout=30,
          )

          print(f"Identity HTTP status: {identity.status_code}")

          if identity.status_code != 200:
              print(identity.text[:2000])
              raise RuntimeError("Identity verification failed")

          identity_data = identity.json()

          print("Identity verification: PASS")

          # ---------------------------------------------------------
          # 3. Fetch the real For-you feed
          # ---------------------------------------------------------

          print()
          print("[3] Fetching The Colony For-you feed...")

          feed_response = session.get(
              f"{API_BASE}/feed/for-you",
              timeout=30,
          )

          print(f"Feed HTTP status: {feed_response.status_code}")

          if feed_response.status_code != 200:
              print(feed_response.text[:3000])
              raise RuntimeError("For-you feed request failed")

          feed = feed_response.json()

          if not isinstance(feed, dict):
              raise RuntimeError(
                  f"Unexpected feed type: {type(feed).__name__}"
              )

          items = feed.get("items", [])

          if not isinstance(items, list):
              raise RuntimeError(
                  f"Unexpected items type: {type(items).__name__}"
              )

          print("Feed request: PASS")
          print(f"Top-level type: {type(feed).__name__}")
          print(f"Items received: {len(items)}")

          # ---------------------------------------------------------
          # 4. Observe structure without assuming post/comment
          # ---------------------------------------------------------

          print()
          print("[4] Analysing feed structure...")

          top_level_keys = sorted(feed.keys())

          print("Top-level keys:")
          for key in top_level_keys:
              print(f"  - {key}")

          kind_counts = {}
          reason_counts = {}
          post_count = 0
          comment_count = 0
          empty_content_count = 0

          observed_items = []

          for index, item in enumerate(items, start=1):

              if not isinstance(item, dict):
                  observed_items.append({
                      "index": index,
                      "type": type(item).__name__,
                      "valid": False,
                  })
                  continue

              kind = item.get("kind")
              reason = item.get("reason")
              match_score = item.get("match_score")

              post = item.get("post")
              comment = item.get("comment")

              if post is not None:
                  post_count += 1

              if comment is not None:
                  comment_count += 1

              if post is None and comment is None:
                  empty_content_count += 1

              kind_key = str(kind) if kind is not None else "null"
              reason_key = str(reason) if reason is not None else "null"

              kind_counts[kind_key] = kind_counts.get(kind_key, 0) + 1
              reason_counts[reason_key] = reason_counts.get(reason_key, 0) + 1

              observed_items.append({
                  "index": index,
                  "valid": True,
                  "kind": kind,
                  "reason": reason,
                  "match_score": match_score,
                  "has_post": post is not None,
                  "has_comment": comment is not None,
                  "on_post_id": item.get("on_post_id"),
                  "on_post_title": item.get("on_post_title"),
              })

          # ---------------------------------------------------------
          # 5. Build observation memory
          # ---------------------------------------------------------

          now = datetime.now(timezone.utc).isoformat()

          observation = {
              "version": "V50",
              "generated_at": now,

              "agent": {
                  "authenticated": True,
                  "identity": identity_data,
              },

              "gemini": {
                  "enabled": False
              },

              "feed": {
                  "endpoint": "/api/v1/feed/for-you",
                  "http_status": feed_response.status_code,
                  "top_level_type": "dict",
                  "top_level_keys": top_level_keys,
                  "items_received": len(items),

                  "personalised": feed.get("personalised"),
                  "count": feed.get("count"),
                  "hidden": feed.get("hidden"),
                  "next_cursor": feed.get("next_cursor"),
                  "coverage": feed.get("coverage"),
              },

              "structure": {
                  "kind_counts": kind_counts,
                  "reason_counts": reason_counts,
                  "items_with_post": post_count,
                  "items_with_comment": comment_count,
                  "items_without_post_or_comment": empty_content_count,
                  "items": observed_items,
              },

              "safety": {
                  "publication": False,
                  "comment": False,
                  "vote": False,
                  "follow": False,
                  "dm": False,
                  "purchase": False,
                  "spending": False,
                  "external_action": False,
              }
          }

          os.makedirs("memory", exist_ok=True)

          with open(
              "memory/nox_v50_observation.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  observation,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ---------------------------------------------------------
          # 6. Human-readable report
          # ---------------------------------------------------------

          report = []

          report.append("# NØX Origin — V50 Feed Observation")
          report.append("")
          report.append(f"Generated: {now}")
          report.append("")
          report.append("## Status")
          report.append("")
          report.append("- The Colony authentication: PASS")
          report.append("- Identity verification: PASS")
          report.append("- For-you feed request: PASS")
          report.append("- Gemini: DISABLED")
          report.append("")

          report.append("## Feed")
          report.append("")
          report.append(f"- HTTP status: {feed_response.status_code}")
          report.append("- Top-level type: dict")
          report.append(f"- Items received: {len(items)}")
          report.append("")

          report.append("### Top-level keys")
          report.append("")

          for key in top_level_keys:
              report.append(f"- `{key}`")

          report.append("")

          report.append("## Item analysis")
          report.append("")
          report.append(f"- Items with post: {post_count}")
          report.append(f"- Items with comment: {comment_count}")
          report.append(
              f"- Items without post/comment: {empty_content_count}"
          )
          report.append("")

          report.append("### Kinds")
          report.append("")

          if kind_counts:
              for key, value in sorted(
                  kind_counts.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  report.append(f"- `{key}`: {value}")
          else:
              report.append("- None detected")

          report.append("")

          report.append("### Reasons")
          report.append("")

          if reason_counts:
              for key, value in sorted(
                  reason_counts.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  report.append(f"- `{key}`: {value}")
          else:
              report.append("- None detected")

          report.append("")

          report.append("## Observed items")
          report.append("")

          for item in observed_items:
              if not item.get("valid"):
                  report.append(
                      f"### Item {item['index']}\n"
                      f"- Invalid item type: `{item['type']}`\n"
                  )
                  continue

              report.append(f"### Item {item['index']}")
              report.append(f"- kind: `{item.get('kind')}`")
              report.append(f"- reason: `{item.get('reason')}`")
              report.append(
                  f"- match_score: `{item.get('match_score')}`"
              )
              report.append(
                  f"- has_post: `{item.get('has_post')}`"
              )
              report.append(
                  f"- has_comment: `{item.get('has_comment')}`"
              )

              if item.get("on_post_id") is not None:
                  report.append(
                      f"- on_post_id: `{item.get('on_post_id')}`"
                  )

              if item.get("on_post_title") is not None:
                  title = str(item.get("on_post_title"))
                  title = title.replace("\n", " ")[:300]
                  report.append(
                      f"- on_post_title: {title}"
                  )

              report.append("")

          report.append("## Safety")
          report.append("")
          report.append("- No Colony publication.")
          report.append("- No comment.")
          report.append("- No vote.")
          report.append("- No follow.")
          report.append("- No DM.")
          report.append("- No purchase.")
          report.append("- No spending.")
          report.append("- No external action.")
          report.append("- Gemini disabled.")
          report.append("")

          report.append("## V50 purpose")
          report.append("")
          report.append(
              "V50 observes and structures the real For-you feed "
              "returned by The Colony."
          )
          report.append(
              "V50 performs no public or external action."
          )

          with open(
              "NØX_V50_FEED_OBSERVATION.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(report))

          print()
          print("=== V50 OBSERVATION COMPLETE ===")
          print(f"Items analysed: {len(items)}")
          print(f"Posts detected: {post_count}")
          print(f"Comments detected: {comment_count}")
          print(f"Memory: memory/nox_v50_observation.json")
          print(f"Report: NØX_V50_FEED_OBSERVATION.md")

          PY

          python v50_observer.py

      - name: Commit V50 observation
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v50_observation.json
          git add NØX_V50_FEED_OBSERVATION.md

          if git diff --cached --quiet; then
            echo "No observation changes to commit."
          else
            git commit -m "NØX V50 feed observation"
            git push
          fi
