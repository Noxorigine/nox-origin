name: NØX Origin - V17 Experiment Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  nox-v17:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NØX V17
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          memory_dir = Path("memory")
          memory_dir.mkdir(exist_ok=True)

          memory_file = memory_dir / "nox_memory.json"
          v16_file = memory_dir / "nox_v16_action_plans.json"
          v17_file = memory_dir / "nox_v17_validation.json"

          print("======================================")
          print("NØX ORIGIN - V17 EXPERIMENT VALIDATION")
          print("======================================")

          # ==========================================
          # HELPERS
          # ==========================================

          def load_json(path, default):
              if not path.exists():
                  return default

              try:
                  return json.loads(
                      path.read_text()
                  )
              except Exception:
                  return default

          # ==========================================
          # 1. LOAD V16
          # ==========================================

          print("")
          print("[1/6] Loading V16 action plans...")

          memory = load_json(
              memory_file,
              {}
          )

          v16_history = load_json(
              v16_file,
              []
          )

          if not v16_history:
              raise RuntimeError(
                  "No V16 action plans found"
              )

          latest_v16 = v16_history[-1]

          plans = latest_v16.get(
              "plans",
              []
          )

          print(
              f"Plans received: {len(plans)}"
          )

          # ==========================================
          # 2. VALIDATION MODEL
          # ==========================================

          print("")
          print("[2/6] Evaluating testability...")

          validated = []

          for plan in plans:

              score = float(
                  plan.get(
                      "score",
                      0
                  )
              )

              priority = plan.get(
                  "priority",
                  "LOW"
              )

              persistence = plan.get(
                  "persistence",
                  "UNKNOWN"
              )

              # Base evidence score
              evidence_score = min(
                  score * 0.45,
                  45
              )

              # Priority
              priority_score = {
                  "VERY_HIGH": 20,
                  "HIGH": 15,
                  "MEDIUM": 10,
                  "LOW": 5
              }.get(
                  priority,
                  5
              )

              # Persistence
              persistence_score = {
                  "STRONG": 15,
                  "MODERATE": 10,
                  "EMERGING": 6,
                  "NEW": 2
              }.get(
                  persistence,
                  2
              )

              # Reversibility
              reversibility_score = 10

              # Financial safety
              financial_safety_score = 10

              confidence = round(
                  min(
                      evidence_score
                      + priority_score
                      + persistence_score
                      + reversibility_score
                      + financial_safety_score,
                      100
                  ),
                  2
              )

              # ======================================
              # DECISION
              # ======================================

              if confidence >= 75:
                  decision = "TEST_RECOMMENDED"

              elif confidence >= 55:
                  decision = "TEST_LATER"

              elif confidence >= 35:
                  decision = "INSUFFICIENT_EVIDENCE"

              else:
                  decision = "REJECT"

              validated.append(
                  {
                      "opportunity":
                          plan.get(
                              "opportunity",
                              "unknown"
                          ),

                      "original_score":
                          score,

                      "priority":
                          priority,

                      "persistence":
                          persistence,

                      "confidence":
                          confidence,

                      "decision":
                          decision,

                      "components":
                          {
                              "evidence":
                                  round(
                                      evidence_score,
                                      2
                                  ),

                              "priority":
                                  priority_score,

                              "persistence":
                                  persistence_score,

                              "reversibility":
                                  reversibility_score,

                              "financial_safety":
                                  financial_safety_score
                          }
                  }
              )

          validated.sort(
              key=lambda item:
                  item["confidence"],
              reverse=True
          )

          # ==========================================
          # 3. SAFETY GATE
          # ==========================================

          print("")
          print("[3/6] Applying safety gate...")

          safety_rules = {
              "financial_transactions": False,
              "capital_deployment": False,
              "paid_services": False,
              "automatic_external_actions": False,
              "irreversible_actions": False
          }

          for item in validated:

              item["safety_gate"] = (
                  "PASS"
              )

              item["execution_allowed"] = False

          # ==========================================
          # 4. BUILD DECISION REPORT
          # ==========================================

          print("")
          print("[4/6] Building validation report...")

          recommended = [
              item
              for item in validated
              if item["decision"]
              == "TEST_RECOMMENDED"
          ]

          later = [
              item
              for item in validated
              if item["decision"]
              == "TEST_LATER"
          ]

          insufficient = [
              item
              for item in validated
              if item["decision"]
              == "INSUFFICIENT_EVIDENCE"
          ]

          rejected = [
              item
              for item in validated
              if item["decision"]
              == "REJECT"
          ]

          report = {
              "version": "V17",

              "timestamp":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "plans_evaluated":
                  len(validated),

              "test_recommended":
                  len(recommended),

              "test_later":
                  len(later),

              "insufficient_evidence":
                  len(insufficient),

              "rejected":
                  len(rejected),

              "safety_gate":
                  safety_rules,

              "decisions":
                  validated
          }

          # ==========================================
          # 5. SAVE V17
          # ==========================================

          print("")
          print("[5/6] Saving V17 validation...")

          history = load_json(
              v17_file,
              []
          )

          history.append(
              report
          )

          history = history[-20:]

          v17_file.write_text(
              json.dumps(
                  history,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # 6. UPDATE MEMORY
          # ==========================================

          print("")
          print("[6/6] Updating NØX memory...")

          memory["last_v17_analysis"] = (
              report["timestamp"]
          )

          memory["v17"] = {
              "plans_evaluated":
                  len(validated),

              "test_recommended":
                  len(recommended),

              "test_later":
                  len(later),

              "insufficient_evidence":
                  len(insufficient),

              "rejected":
                  len(rejected),

              "execution_allowed":
                  False
          }

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              )
          )

          # ==========================================
          # SUCCESS
          # ==========================================

          print("")
          print("======================================")
          print("NØX V17 COMPLETED SUCCESSFULLY")
          print("======================================")

          print(
              f"Plans evaluated      : {len(validated)}"
          )

          print(
              f"Test recommended     : {len(recommended)}"
          )

          print(
              f"Test later           : {len(later)}"
          )

          print(
              f"Insufficient evidence: "
              f"{len(insufficient)}"
          )

          print(
              f"Rejected             : {len(rejected)}"
          )

          print("")
          print("NØX VALIDATION RANKING:")

          for index, item in enumerate(
              validated,
              start=1
          ):

              print(
                  f"{index}. "
                  f"{item['opportunity']} | "
                  f"confidence="
                  f"{item['confidence']} | "
                  f"decision="
                  f"{item['decision']}"
              )

          print("")
          print("======================================")
          print("SAFETY GATE")
          print("======================================")

          print(
              "Financial transactions : BLOCKED"
          )

          print(
              "Capital deployment     : BLOCKED"
          )

          print(
              "Paid services          : BLOCKED"
          )

          print(
              "External actions       : BLOCKED"
          )

          print(
              "Irreversible actions   : BLOCKED"
          )

          print("")
          print(
              "Execution allowed      : FALSE"
          )

          PY

      - name: Commit NØX V17 validation
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_memory.json
          git add memory/nox_v17_validation.json

          if git diff --cached --quiet; then
            echo "No new V17 validation to commit."
          else
            git commit -m "NØX V17 experiment validation"
            git push
          fi
