name: ACT20_V2.yml

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act20-learning-loop
  cancel-in-progress: false

jobs:
  autonomous-learning-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ACT20 V2 learning loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          decision_path = Path("memory/nox_act_19_decisions.json")
          knowledge_path = Path("memory/nox_knowledge_core.json")
          output_path = Path("memory/nox_act_20_learning_loop.json")

          if not decision_path.exists():
              raise SystemExit(
                  "ERROR: memory/nox_act_19_decisions.json not found."
              )

          if not knowledge_path.exists():
              raise SystemExit(
                  "ERROR: memory/nox_knowledge_core.json not found."
              )

          with decision_path.open("r", encoding="utf-8") as f:
              decision_memory = json.load(f)

          with knowledge_path.open("r", encoding="utf-8") as f:
              knowledge = json.load(f)

          if not isinstance(decision_memory, dict):
              raise SystemExit(
                  "ERROR: ACT19 decision memory is not a JSON object."
              )

          if not isinstance(knowledge, dict):
              raise SystemExit(
                  "ERROR: knowledge core is not a JSON object."
              )

          final_decision = decision_memory.get("final_decision")

          if not isinstance(final_decision, dict):
              raise SystemExit(
                  "ERROR: ACT19 final_decision section not found."
              )

          selected_candidate = final_decision.get("selected_candidate")
          recommended_action = final_decision.get("recommended_action")
          decision_score = final_decision.get("decision_score")
          confidence = final_decision.get("confidence")
          risk = final_decision.get("risk")
          expected_value = final_decision.get("expected_value")
          decision_status = final_decision.get("status")
          decision_source = final_decision.get("source")
          decision_reason = final_decision.get("reason")

          required_fields = {
              "selected_candidate": selected_candidate,
              "recommended_action": recommended_action,
              "decision_score": decision_score,
              "confidence": confidence,
              "risk": risk,
              "expected_value": expected_value
          }

          missing = [
              name
              for name, value in required_fields.items()
              if value is None
          ]

          if missing:
              raise SystemExit(
                  "ERROR: Missing ACT19 decision fields: "
                  + ", ".join(missing)
              )

          decision_score = float(decision_score)
          confidence = float(confidence)
          risk = float(risk)
          expected_value = float(expected_value)

          knowledge_items = knowledge.get("knowledge", [])
          active_attention = knowledge.get("active_attention", {})
          contradictions = knowledge.get("contradictions", [])

          if not isinstance(knowledge_items, list):
              knowledge_items = []

          if not isinstance(active_attention, dict):
              active_attention = {}

          if not isinstance(contradictions, list):
              contradictions = []

          action_mode = "non_destructive"

          safe_actions = {
              "cross_check",
              "deepen_attention",
              "connect_to_knowledge",
              "verify_contradictions",
              "analyze",
              "observe",
              "prioritize"
          }

          if recommended_action in safe_actions:
              action_status = "PLANNED"
          else:
              action_status = "REQUIRES_VALIDATION"

          evaluation_score = round(
              (
                  decision_score * 0.35
                  + confidence * 0.30
                  + expected_value * 0.25
                  + (1.0 - risk) * 0.10
              ),
              4
          )

          if evaluation_score >= 0.75:
              learning_signal = "STRONG"
              next_step = "continue_with_selected_direction"
          elif evaluation_score >= 0.55:
              learning_signal = "MODERATE"
              next_step = "gather_more_evidence"
          else:
              learning_signal = "WEAK"
              next_step = "reconsider_decision"

          external_action_executed = False
          result_status = "NO_EXTERNAL_RESULT"

          if action_status == "PLANNED":
              execution_learning = (
                  "Decision is coherent and ready for a future "
                  "non-destructive execution stage."
              )
          else:
              execution_learning = (
                  "Decision requires additional validation before execution."
              )

          learning_record = {
              "version": "ACT20_V2",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "status": "LEARNING_LOOP_RECORDED",

              "source_decision": {
                  "file": str(decision_path),
                  "version": decision_memory.get("version"),
                  "status": decision_status,
                  "source": decision_source,
                  "selected_candidate": selected_candidate,
                  "recommended_action": recommended_action,
                  "decision_score": decision_score,
                  "confidence": confidence,
                  "risk": risk,
                  "expected_value": expected_value,
                  "reason": decision_reason
              },

              "action": {
                  "mode": action_mode,
                  "status": action_status,
                  "external_action_executed": external_action_executed,
                  "result_status": result_status
              },

              "evaluation": {
                  "evaluation_score": evaluation_score,
                  "decision_quality": (
                      "high"
                      if evaluation_score >= 0.75
                      else "moderate"
                      if evaluation_score >= 0.55
                      else "low"
                  ),
                  "decision_is_coherent": (
                      decision_status == "DECISION_READY"
                      and selected_candidate is not None
                      and recommended_action is not None
                  )
              },

              "learning": {
                  "signal": learning_signal,
                  "next_step": next_step,
                  "execution_learning": execution_learning,
                  "real_result_available": False,
                  "result_fabricated": False,
                  "learning_from_real_result": False
              },

              "context": {
                  "knowledge_items": len(knowledge_items),
                  "active_attention_items": len(active_attention),
                  "contradictions": len(contradictions)
              },

              "policy": {
                  "non_destructive": True,
                  "no_payment": True,
                  "no_external_ai": True,
                  "gemini_used": False,
                  "project_cost_eur": 0
              }
          }

          output_path.parent.mkdir(parents=True, exist_ok=True)

          with output_path.open("w", encoding="utf-8") as f:
              json.dump(
                  learning_record,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print("ACT20 V2 learning loop completed.")
          print(f"ACT19 status: {decision_status}")
          print(f"Selected candidate: {selected_candidate}")
          print(f"Recommended action: {recommended_action}")
          print(f"Decision score: {decision_score}")
          print(f"Confidence: {confidence}")
          print(f"Risk: {risk}")
          print(f"Expected value: {expected_value}")
          print(f"Evaluation score: {evaluation_score}")
          print(f"Action status: {action_status}")
          print(f"Learning signal: {learning_signal}")
          print(f"Next step: {next_step}")
          print(f"Knowledge items: {len(knowledge_items)}")
          print(f"Active attention items: {len(active_attention)}")
          print(f"Contradictions: {len(contradictions)}")
          print("External action executed: false")
          print("Real result available: false")
          print("Result fabricated: false")
          print("Gemini used: false")
          print("Project cost: 0 EUR")
          PY

      - name: Commit ACT20 V2 learning memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_20_learning_loop.json

          if git diff --cached --quiet; then
            echo "No ACT20 V2 changes to commit."
            exit 0
          fi

          git commit -m "ACT20 V2: fix decision learning loop"

      - name: Synchronize with main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push ACT20 V2 result
        run: |
          git push origin HEAD:main
