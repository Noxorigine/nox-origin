name: NØX V91 — Autonomous Decision Stability

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v91-autonomous-decision-stability
  cancel-in-progress: false

jobs:
  decision-stability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V91
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"
          API_KEY = os.environ["COLONY_API_KEY"]

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def get_json(url, headers, params=None):
              response = requests.get(
                  url,
                  headers=headers,
                  params=params,
                  timeout=30
              )
              response.raise_for_status()
              return response.json()

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "posts",
                      "results",
                      "data",
                      "suggestions"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          # ---------------------------------------------------------
          # 1. AUTHENTICATION
          # ---------------------------------------------------------

          auth = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )
          auth.raise_for_status()

          token = auth.json().get("access_token")

          if not token:
              raise RuntimeError("JWT access token missing")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          me = get_json(
              f"{BASE}/users/me",
              headers
          )

          nox_id = me.get("id")
          nox_username = me.get("username")

          # ---------------------------------------------------------
          # 2. LOAD PREVIOUS VERSIONS
          # ---------------------------------------------------------

          v90 = load(
              "memory/nox_v90_autonomous_decision_framework.json"
          )

          v86 = load(
              "memory/nox_v86_adaptive_strategy_live_test.json"
          )

          v87 = load(
              "memory/nox_v87_autonomous_prioritization_refinement.json"
          )

          v88 = load(
              "memory/nox_v88_autonomous_decision_error_analysis.json"
          )

          v89 = load(
              "memory/nox_v89_autonomous_strategy_arbitration.json"
          )

          previous_v91 = load(
              "memory/nox_v91_autonomous_decision_stability.json"
          )

          # ---------------------------------------------------------
          # 3. STRATEGIC STATE
          # ---------------------------------------------------------

          strategic_state = v90.get(
              "strategic_state",
              {}
          )

          preferred_strategy = (
              strategic_state.get("preferred_strategy")
              or v89.get("preferred_strategy")
              or v89.get("selected_strategy")
              or "STRATEGY_C_ADAPTIVE_BALANCED"
          )

          adaptive_direction = (
              strategic_state.get("adaptive_direction")
              or "NO_CHANGE"
          )

          # ---------------------------------------------------------
          # 4. FRESH LIVE DATA
          # ---------------------------------------------------------

          feed = get_json(
              f"{BASE}/feed/for-you",
              headers,
              {"limit": 7}
          )

          suggestions = get_json(
              f"{BASE}/suggestions",
              headers,
              {"limit": 10}
          )

          posts = get_json(
              f"{BASE}/posts",
              headers,
              {"limit": 10}
          )

          raw_items = (
              extract_items(feed)
              + extract_items(suggestions)
              + extract_items(posts)
          )

          unique = {}

          for item in raw_items:
              if not isinstance(item, dict):
                  continue

              author = item.get("author") or {}

              author_id = (
                  item.get("author_id")
                  or author.get("id")
              )

              author_username = (
                  item.get("author_username")
                  or author.get("username")
              )

              if (
                  author_id == nox_id
                  or author_username == nox_username
              ):
                  continue

              post_id = (
                  item.get("id")
                  or item.get("post_id")
              )

              if post_id:
                  unique[str(post_id)] = item

          candidates = list(unique.values())

          # ---------------------------------------------------------
          # 5. SIGNAL DETECTION
          # ---------------------------------------------------------

          def text_of(item):
              return " ".join(
                  str(item.get(key, "") or "")
                  for key in (
                      "title",
                      "body",
                      "content",
                      "text",
                      "description"
                  )
              ).lower()

          def get_signals(item):
              text = text_of(item)

              request = any(
                  term in text
                  for term in (
                      "need someone",
                      "looking for someone",
                      "looking for an agent",
                      "i need",
                      "we need",
                      "seeking",
                      "request",
                      "hire",
                      "hiring",
                      "wanted",
                      "can someone",
                      "who can"
                  )
              )

              delegation = any(
                  term in text
                  for term in (
                      "build this",
                      "fix this",
                      "audit this",
                      "research this",
                      "create this",
                      "do this",
                      "perform this",
                      "deliver",
                      "complete this",
                      "help me"
                  )
              )

              deliverable = any(
                  term in text
                  for term in (
                      "deliverable",
                      "file",
                      "report",
                      "code",
                      "parser",
                      "script",
                      "implementation",
                      "output",
                      "result"
                  )
              )

              acceptance = any(
                  term in text
                  for term in (
                      "acceptance criteria",
                      "must include",
                      "requirements",
                      "criteria",
                      "verified by",
                      "proof",
                      "verification"
                  )
              )

              reward = any(
                  term in text
                  for term in (
                      "reward",
                      "paid",
                      "payment",
                      "pay",
                      "bounty",
                      "sats",
                      "bitcoin",
                      "btc",
                      "usdc",
                      "tip",
                      "compensation"
                  )
              )

              deadline = any(
                  term in text
                  for term in (
                      "deadline",
                      "due",
                      "within",
                      "by tomorrow",
                      "by friday"
                  )
              )

              application = any(
                  term in text
                  for term in (
                      "apply",
                      "application",
                      "comment to apply",
                      "dm to apply",
                      "contact me",
                      "reply here",
                      "application method"
                  )
              )

              completion = any(
                  term in text
                  for term in (
                      "completed",
                      "finished",
                      "done",
                      "already delivered",
                      "settled",
                      "paid out",
                      "successfully completed"
                  )
              )

              post_type = str(
                  item.get("post_type")
                  or item.get("type")
                  or ""
              ).lower()

              analysis_only = (
                  post_type in ("analysis", "finding")
                  and not request
              )

              return {
                  "request": request,
                  "delegation": delegation,
                  "deliverable": deliverable,
                  "acceptance": acceptance,
                  "reward": reward,
                  "deadline": deadline,
                  "application": application,
                  "completion": completion,
                  "analysis_only": analysis_only
              }

          def calculate_score(s):
              value = 0

              if s["request"]:
                  value += 30

              if s["delegation"]:
                  value += 20

              if s["deliverable"]:
                  value += 15

              if s["acceptance"]:
                  value += 15

              if s["reward"]:
                  value += 5

              if s["deadline"]:
                  value += 5

              if s["application"]:
                  value += 5

              if s["completion"]:
                  value -= 35

              if s["analysis_only"]:
                  value -= 20

              if (
                  s["request"]
                  and s["delegation"]
              ):
                  value += 5

              if (
                  s["deliverable"]
                  and s["acceptance"]
              ):
                  value += 5

              return value

          # ---------------------------------------------------------
          # 6. CURRENT DECISION MAP
          # ---------------------------------------------------------

          current = {}

          for item in candidates:
              post_id = str(
                  item.get("id")
                  or item.get("post_id")
              )

              signal_data = get_signals(item)

              current[post_id] = {
                  "post_id": post_id,
                  "title": item.get("title"),
                  "score": calculate_score(signal_data),
                  "signals": signal_data
              }

          # ---------------------------------------------------------
          # 7. V90 DECISION
          # ---------------------------------------------------------

          selected_v90 = (
              v90.get("selected_decision")
              or {}
          )

          v90_post_id = selected_v90.get(
              "post_id"
          )

          v90_decision = selected_v90.get(
              "decision"
          )

          v90_action = selected_v90.get(
              "recommended_action"
          )

          v90_score = selected_v90.get(
              "score"
          )

          current_selected = None

          if v90_post_id:
              current_selected = current.get(
                  str(v90_post_id)
              )

          # ---------------------------------------------------------
          # 8. CONSISTENCY
          # ---------------------------------------------------------

          if not selected_v90:
              consistency_status = (
                  "NO_PREVIOUS_DECISION"
              )

          elif not current_selected:
              consistency_status = (
                  "DECISION_CONTEXT_CHANGED"
              )

          else:
              old_signals = selected_v90.get(
                  "signals",
                  {}
              )

              new_signals = current_selected.get(
                  "signals",
                  {}
              )

              changed_fields = []

              for key in (
                  "request",
                  "delegation",
                  "deliverable",
                  "acceptance",
                  "reward",
                  "deadline",
                  "application",
                  "completion",
                  "analysis_only"
              ):
                  if (
                      old_signals.get(key)
                      != new_signals.get(key)
                  ):
                      changed_fields.append(key)

              if not changed_fields:
                  consistency_status = (
                      "STABLE_EVIDENCE"
                  )

              elif len(changed_fields) <= 2:
                  consistency_status = (
                      "LIMITED_EVIDENCE_CHANGE"
                  )

              else:
                  consistency_status = (
                      "MATERIAL_EVIDENCE_CHANGE"
                  )

          # ---------------------------------------------------------
          # 9. DECISION REVERSAL
          # ---------------------------------------------------------

          reversal = False

          if (
              selected_v90
              and current_selected
          ):
              try:
                  old_score = float(
                      v90_score
                  )
              except Exception:
                  old_score = 0.0

              try:
                  new_score = float(
                      current_selected.get(
                          "score",
                          0
                      )
                  )
              except Exception:
                  new_score = 0.0

              old_high = old_score >= 75
              new_high = new_score >= 75

              if old_high != new_high:
                  reversal = True

          # ---------------------------------------------------------
          # 10. EVIDENCE STABILITY
          # ---------------------------------------------------------

          evidence_stable = (
              consistency_status
              in (
                  "STABLE_EVIDENCE",
                  "LIMITED_EVIDENCE_CHANGE"
              )
          )

          # ---------------------------------------------------------
          # 11. STRATEGY STABILITY
          # ---------------------------------------------------------

          previous_strategy = (
              v89.get("preferred_strategy")
              or v89.get("selected_strategy")
          )

          strategy_stable = (
              not previous_strategy
              or preferred_strategy
              == previous_strategy
          )

          # ---------------------------------------------------------
          # 12. PRUNING SIGNALS
          # ---------------------------------------------------------

          total_candidates = len(current)

          low_priority_count = sum(
              1
              for item in current.values()
              if item.get("score", 0) < 35
          )

          actionable_count = sum(
              1
              for item in current.values()
              if (
                  item["signals"].get("request")
                  and item["signals"].get("delegation")
              )
          )

          completed_count = sum(
              1
              for item in current.values()
              if item["signals"].get("completion")
          )

          if total_candidates > 0:
              low_priority_ratio = (
                  low_priority_count
                  / total_candidates
              )
          else:
              low_priority_ratio = 0.0

          over_pruning = (
              total_candidates >= 5
              and low_priority_ratio >= 0.85
          )

          under_pruning = (
              completed_count > 0
          )

          # ---------------------------------------------------------
          # 13. SELF-CORRECTION SIGNAL
          # ---------------------------------------------------------

          v88_assessment = (
              v88.get("self_assessment")
              or v88.get("assessment")
              or {}
          )

          if isinstance(
              v88_assessment,
              dict
          ):
              assessment_status = (
                  v88_assessment.get("status")
              )
          else:
              assessment_status = None

          self_correction_signal = (
              assessment_status
              in (
                  "DECISION_NEEDS_CORRECTION",
                  "DECISION_HAS_WEAKNESSES"
              )
              and evidence_stable
              and not reversal
          )

          # ---------------------------------------------------------
          # 14. STABILITY METRICS
          # ---------------------------------------------------------

          decision_stability = 1.0

          if reversal:
              decision_stability -= 0.35

          if (
              consistency_status
              == "MATERIAL_EVIDENCE_CHANGE"
          ):
              decision_stability -= 0.10

          if over_pruning:
              decision_stability -= 0.10

          decision_stability = round(
              max(
                  0.0,
                  min(
                      1.0,
                      decision_stability
                  )
              ),
              3
          )

          evidence_stability = round(
              1.0
              if evidence_stable
              else 0.65,
              3
          )

          strategy_stability_score = round(
              1.0
              if strategy_stable
              else 0.60,
              3
          )

          reversal_rate = (
              1.0
              if reversal
              else 0.0
          )

          self_correction_rate = (
              1.0
              if self_correction_signal
              else 0.0
          )

          overall_stability = round(
              (
                  decision_stability * 0.35
                  + evidence_stability * 0.30
                  + strategy_stability_score * 0.20
                  + (1.0 - reversal_rate) * 0.15
              ),
              3
          )

          # ---------------------------------------------------------
          # 15. QUALITY PROFILE
          # ---------------------------------------------------------

          if overall_stability >= 0.85:
              quality_profile = (
                  "STRONG_STABILITY"
              )

          elif overall_stability >= 0.70:
              quality_profile = (
                  "STABLE_WITH_MINOR_VARIATION"
              )

          elif overall_stability >= 0.50:
              quality_profile = (
                  "EMERGING_STABILITY"
              )

          else:
              quality_profile = (
                  "UNSTABLE_DECISION_PATTERN"
              )

          # ---------------------------------------------------------
          # 16. FINDINGS
          # ---------------------------------------------------------

          findings = []

          if reversal:
              findings.append(
                  "A high-confidence decision threshold "
                  "changed between observations."
              )
          else:
              findings.append(
                  "No high-confidence decision reversal "
                  "was detected."
              )

          if evidence_stable:
              findings.append(
                  "The current decision remains supported "
                  "by relatively stable evidence."
              )
          else:
              findings.append(
                  "The evidence changed materially; "
                  "decision variation may therefore be justified."
              )

          if over_pruning:
              findings.append(
                  "The current live sample shows a possible "
                  "over-pruning pattern."
              )

          if under_pruning:
              findings.append(
                  "Completed-work signals were detected and "
                  "remain important exclusion evidence."
              )

          if self_correction_signal:
              findings.append(
                  "A self-correction signal is present: "
                  "previous weaknesses remain visible while "
                  "current evidence is stable."
              )

          # ---------------------------------------------------------
          # 17. NEXT STAGE
          # ---------------------------------------------------------

          if quality_profile in (
              "STRONG_STABILITY",
              "STABLE_WITH_MINOR_VARIATION"
          ):
              next_stage = (
                  "V92_AUTONOMOUS_SELF_CORRECTION_PROPOSAL"
              )
          else:
              next_stage = (
                  "V92_STABILITY_REFINEMENT"
              )

          # ---------------------------------------------------------
          # 18. RESULT
          # ---------------------------------------------------------

          result = {
              "version": "V91",
              "generated_at": now(),
              "mode": "autonomous_decision_stability",

              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },

              "inputs": {
                  "v90_loaded": bool(v90),
                  "v86_loaded": bool(v86),
                  "v87_loaded": bool(v87),
                  "v88_loaded": bool(v88),
                  "v89_loaded": bool(v89),
                  "previous_v91_loaded": bool(previous_v91)
              },

              "live_sample": {
                  "for_you": len(
                      extract_items(feed)
                  ),
                  "suggestions": len(
                      extract_items(suggestions)
                  ),
                  "public_posts": len(
                      extract_items(posts)
                  ),
                  "deduplicated_candidates": total_candidates
              },

              "comparison": {
                  "v90_selected_post_id": v90_post_id,
                  "v90_decision": v90_decision,
                  "v90_recommended_action": v90_action,
                  "v90_score": v90_score,
                  "current_selected_context": current_selected,
                  "consistency_status": consistency_status,
                  "decision_reversal": reversal
              },

              "metrics": {
                  "decision_stability": decision_stability,
                  "evidence_stability": evidence_stability,
                  "strategy_stability": strategy_stability_score,
                  "reversal_rate": reversal_rate,
                  "over_pruning_signal": over_pruning,
                  "under_pruning_signal": under_pruning,
                  "self_correction_signal": self_correction_signal,
                  "self_correction_rate": self_correction_rate,
                  "overall_stability": overall_stability
              },

              "quality_profile": quality_profile,

              "findings": findings,

              "strategic_state": {
                  "v89_strategy": previous_strategy,
                  "v90_strategy": preferred_strategy,
                  "strategy_stable": strategy_stable,
                  "adaptive_direction": adaptive_direction
              },

              "learning": {
                  "decision_quality_measurable": True,
                  "evidence_quality_measurable": True,
                  "decision_reversals_tracked": True,
                  "over_pruning_tracked": True,
                  "under_pruning_tracked": True,
                  "self_correction_tracked": True,
                  "evidence_change_distinguished_from_instability": True
              },

              "next_stage": {
                  "version": next_stage,
                  "purpose": (
                      "Use measured stability and detected "
                      "weaknesses to formulate autonomous "
                      "correction proposals."
                  )
              },

              "autonomy": {
                  "autonomous_measurement": True,
                  "autonomous_self_evaluation": True,
                  "autonomous_error_detection": True,
                  "autonomous_self_correction_proposal": False,
                  "automatic_rule_deployment": False,
                  "automatic_external_action": False,
                  "human_override": True
              },

              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "primary_source_preference": True
              },

              "answer_status": (
                  "STABILITY_MEASURED"
                  if total_candidates > 0
                  else "INSUFFICIENT_LIVE_SAMPLE"
              ),

              "confidence": overall_stability
          }

          # ---------------------------------------------------------
          # 19. SAVE JSON
          # ---------------------------------------------------------

          json_path = (
              "memory/"
              "nox_v91_autonomous_decision_stability.json"
          )

          save(
              json_path,
              result
          )

          # ---------------------------------------------------------
          # 20. SAVE MARKDOWN
          # ---------------------------------------------------------

          md_lines = []

          md_lines.append(
              "# NØX V91 — Autonomous Decision Stability"
          )
          md_lines.append("")
          md_lines.append(
              f"Generated: {result['generated_at']}"
          )
          md_lines.append("")
          md_lines.append("## Objective")
          md_lines.append("")
          md_lines.append(
              "Measure decision consistency, evidence stability, "
              "strategy stability, reversals and self-correction "
              "signals before increasing autonomous authority."
          )
          md_lines.append("")
          md_lines.append("## Live sample")
          md_lines.append("")
          md_lines.append(
              f"- For You: {len(extract_items(feed))}"
          )
          md_lines.append(
              f"- Suggestions: {len(extract_items(suggestions))}"
          )
          md_lines.append(
              f"- Public posts: {len(extract_items(posts))}"
          )
          md_lines.append(
              f"- Candidates: {total_candidates}"
          )
          md_lines.append("")
          md_lines.append("## V90 comparison")
          md_lines.append("")
          md_lines.append(
              f"- Decision: {v90_decision}"
          )
          md_lines.append(
              f"- Action: {v90_action}"
          )
          md_lines.append(
              f"- Consistency: {consistency_status}"
          )
          md_lines.append(
              f"- Reversal: {reversal}"
          )
          md_lines.append("")
          md_lines.append("## Stability metrics")
          md_lines.append("")
          md_lines.append(
              f"- Decision stability: {decision_stability:.3f}"
          )
          md_lines.append(
              f"- Evidence stability: {evidence_stability:.3f}"
          )
          md_lines.append(
              f"- Strategy stability: "
              f"{strategy_stability_score:.3f}"
          )
          md_lines.append(
              f"- Reversal rate: {reversal_rate:.3f}"
          )
          md_lines.append(
              f"- Over-pruning signal: {over_pruning}"
          )
          md_lines.append(
              f"- Under-pruning signal: {under_pruning}"
          )
          md_lines.append(
              f"- Self-correction signal: "
              f"{self_correction_signal}"
          )
          md_lines.append(
              f"- Overall stability: "
              f"{overall_stability:.3f}"
          )
          md_lines.append("")
          md_lines.append("## Quality profile")
          md_lines.append("")
          md_lines.append(
              quality_profile
          )
          md_lines.append("")
          md_lines.append("## Findings")
          md_lines.append("")

          for finding in findings:
              md_lines.append(
                  f"- {finding}"
              )

          md_lines.append("")
          md_lines.append("## Autonomous capabilities")
          md_lines.append("")
          md_lines.append(
              "- Autonomous measurement: enabled"
          )
          md_lines.append(
              "- Autonomous self-evaluation: enabled"
          )
          md_lines.append(
              "- Autonomous error detection: enabled"
          )
          md_lines.append(
              "- Self-correction proposal: disabled"
          )
          md_lines.append(
              "- Automatic rule deployment: disabled"
          )
          md_lines.append(
              "- External action: disabled"
          )
          md_lines.append(
              "- Human override: enabled"
          )
          md_lines.append("")
          md_lines.append("## Next stage")
          md_lines.append("")
          md_lines.append(
              f"- {next_stage}"
          )
          md_lines.append("")
          md_lines.append(
              "V92 will use these measurements to let NØX "
              "propose its own corrections while automatic "
              "rule deployment remains disabled."
          )
          md_lines.append("")
          md_lines.append("## Safety")
          md_lines.append("")
          md_lines.append(
              "- Gemini: disabled"
          )
          md_lines.append(
              "- External contact: disabled"
          )
          md_lines.append(
              "- Bidding: disabled"
          )
          md_lines.append(
              "- Payments: disabled"
          )
          md_lines.append(
              "- Project cost: €0"
          )

          md_path = (
              "memory/"
              "nox_v91_autonomous_decision_stability.md"
          )

          with open(
              md_path,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(md_lines)
              )

          # ---------------------------------------------------------
          # 21. CONSOLE OUTPUT
          # ---------------------------------------------------------

          print(
              json.dumps(
                  {
                      "version": "V91",
                      "status": result["answer_status"],
                      "quality_profile": quality_profile,
                      "overall_stability": overall_stability,
