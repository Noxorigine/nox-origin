name: NØX V91 — Autonomous Decision Stability

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v91-autonomous-decision-stability
  cancel-in-progress: false

jobs:
  decision-stability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V91
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"
          API_KEY = os.environ["COLONY_API_KEY"]

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def save(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      indent=2,
                      ensure_ascii=False
                  )

          def get_json(url, headers, params=None):
              r = requests.get(
                  url,
                  headers=headers,
                  params=params,
                  timeout=30
              )
              r.raise_for_status()
              return r.json()

          def extract_items(data):
              if isinstance(data, list):
                  return data

              if isinstance(data, dict):
                  for key in (
                      "items",
                      "posts",
                      "results",
                      "data",
                      "suggestions"
                  ):
                      value = data.get(key)
                      if isinstance(value, list):
                          return value

              return []

          # ---------------------------------------------------------
          # 1. Authentication
          # ---------------------------------------------------------

          auth = requests.post(
              f"{BASE}/auth/token",
              json={"api_key": API_KEY},
              timeout=30
          )
          auth.raise_for_status()

          token = auth.json().get("access_token")

          if not token:
              raise RuntimeError("JWT access token missing")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json"
          }

          me = get_json(
              f"{BASE}/users/me",
              headers
          )

          nox_id = me.get("id")
          nox_username = me.get("username")

          # ---------------------------------------------------------
          # 2. Load V90 and previous V91 observations
          # ---------------------------------------------------------

          v90 = load(
              "memory/nox_v90_autonomous_decision_framework.json"
          )

          previous_v91 = load(
              "memory/nox_v91_autonomous_decision_stability.json"
          )

          v86 = load(
              "memory/nox_v86_adaptive_strategy_live_test.json"
          )

          v87 = load(
              "memory/nox_v87_autonomous_prioritization_refinement.json"
          )

          v88 = load(
              "memory/nox_v88_autonomous_decision_error_analysis.json"
          )

          v89 = load(
              "memory/nox_v89_autonomous_strategy_arbitration.json"
          )

          # ---------------------------------------------------------
          # 3. Fresh live sample
          # ---------------------------------------------------------

          feed = get_json(
              f"{BASE}/feed/for-you",
              headers,
              {"limit": 7}
          )

          suggestions = get_json(
              f"{BASE}/suggestions",
              headers,
              {"limit": 10}
          )

          posts = get_json(
              f"{BASE}/posts",
              headers,
              {"limit": 10}
          )

          raw_items = (
              extract_items(feed)
              + extract_items(suggestions)
              + extract_items(posts)
          )

          unique = {}

          for item in raw_items:
              if not isinstance(item, dict):
                  continue

              author = item.get("author") or {}

              author_id = (
                  item.get("author_id")
                  or author.get("id")
              )

              username = (
                  item.get("author_username")
                  or author.get("username")
              )

              if (
                  author_id == nox_id
                  or username == nox_username
              ):
                  continue

              post_id = (
                  item.get("id")
                  or item.get("post_id")
              )

              if post_id:
                  unique[str(post_id)] = item

          candidates = list(unique.values())

          # ---------------------------------------------------------
          # 4. Independent evidence signature
          # ---------------------------------------------------------

          def text_of(item):
              return " ".join(
                  str(item.get(k, "") or "")
                  for k in (
                      "title",
                      "body",
                      "content",
                      "text",
                      "description"
                  )
              ).lower()

          def signals(item):
              text = text_of(item)

              request = any(
                  x in text
                  for x in (
                      "need someone",
                      "looking for someone",
                      "looking for an agent",
                      "i need",
                      "we need",
                      "seeking",
                      "request",
                      "hire",
                      "hiring",
                      "wanted",
                      "can someone",
                      "who can"
                  )
              )

              delegation = any(
                  x in text
                  for x in (
                      "build this",
                      "fix this",
                      "audit this",
                      "research this",
                      "create this",
                      "do this",
                      "perform this",
                      "deliver",
                      "complete this",
                      "help me"
                  )
              )

              deliverable = any(
                  x in text
                  for x in (
                      "deliverable",
                      "file",
                      "report",
                      "code",
                      "parser",
                      "script",
                      "implementation",
                      "output",
                      "result"
                  )
              )

              acceptance = any(
                  x in text
                  for x in (
                      "acceptance criteria",
                      "must include",
                      "requirements",
                      "criteria",
                      "verified by",
                      "proof",
                      "verification"
                  )
              )

              reward = any(
                  x in text
                  for x in (
                      "reward",
                      "paid",
                      "payment",
                      "pay",
                      "bounty",
                      "sats",
                      "bitcoin",
                      "btc",
                      "usdc",
                      "tip",
                      "compensation"
                  )
              )

              deadline = any(
                  x in text
                  for x in (
                      "deadline",
                      "due",
                      "within",
                      "by tomorrow",
                      "by friday"
                  )
              )

              application = any(
                  x in text
                  for x in (
                      "apply",
                      "application",
                      "comment to apply",
                      "dm to apply",
                      "contact me",
                      "reply here",
                      "application method"
                  )
              )

              completion = any(
                  x in text
                  for x in (
                      "completed",
                      "finished",
                      "done",
                      "already delivered",
                      "settled",
                      "paid out",
                      "successfully completed"
                  )
              )

              post_type = str(
                  item.get("post_type")
                  or item.get("type")
                  or ""
              ).lower()

              analysis_only = (
                  post_type in ("analysis", "finding")
                  and not request
              )

              return {
                  "request": request,
                  "delegation": delegation,
                  "deliverable": deliverable,
                  "acceptance": acceptance,
                  "reward": reward,
                  "deadline": deadline,
                  "application": application,
                  "completion": completion,
                  "analysis_only": analysis_only
              }

          def score(item, s):
              value = 0

              if s["request"]:
                  value += 30

              if s["delegation"]:
                  value += 20

              if s["deliverable"]:
                  value += 15

              if s["acceptance"]:
                  value += 15

              if s["reward"]:
                  value += 5

              if s["deadline"]:
                  value += 5

              if s["application"]:
                  value += 5

              if s["completion"]:
                  value -= 35

              if s["analysis_only"]:
                  value -= 20

              if s["request"] and s["delegation"]:
                  value += 5

              if s["deliverable"] and s["acceptance"]:
                  value += 5

              return value

          # ---------------------------------------------------------
          # 5. Build current evidence map
          # ---------------------------------------------------------

          current = {}

          for item in candidates:
              post_id = str(
                  item.get("id")
                  or item.get("post_id")
              )

              s = signals(item)

              current[post_id] = {
                  "post_id": post_id,
                  "title": item.get("title"),
                  "score": score(item, s),
                  "signals": s
              }

          # ---------------------------------------------------------
          # 6. Recover V90 selected decision
          # ---------------------------------------------------------

          selected_v90 = v90.get("selected_decision") or {}

          v90_post_id = selected_v90.get("post_id")
          v90_decision = selected_v90.get("decision")
          v90_action = selected_v90.get("recommended_action")
          v90_score = selected_v90.get("score")

          current_selected = (
              current.get(str(v90_post_id))
              if v90_post_id
              else None
          )

          # ---------------------------------------------------------
          # 7. Determine decision consistency
          # ---------------------------------------------------------

          if not selected_v90:
              consistency_status = "NO_PREVIOUS_DECISION"

          elif not current_selected:
              consistency_status = "DECISION_CONTEXT_CHANGED"

          else:
              old_signals = selected_v90.get(
                  "signals",
                  {}
              )

              new_signals = current_selected.get(
                  "signals",
                  {}
              )

              changed = []

              for key in (
                  "request",
                  "delegation",
                  "deliverable",
                  "acceptance",
                  "reward",
                  "deadline",
                  "application",
                  "completion",
                  "analysis_only"
              ):
                  if old_signals.get(key) != new_signals.get(key):
                      changed.append(key)

              if not changed:
                  consistency_status = "STABLE_EVIDENCE"

              elif len(changed) <= 2:
                  consistency_status = "LIMITED_EVIDENCE_CHANGE"

              else:
                  consistency_status = "MATERIAL_EVIDENCE_CHANGE"

          # ---------------------------------------------------------
          # 8. Decision reversal detection
          # ---------------------------------------------------------

          reversal = False

          if selected_v90 and current_selected:
              old_score = (
                  float(v90_score)
                  if isinstance(
                      v90_score,
                      (int, float)
                  )
                  else 0
              )

              new_score = float(
                  current_selected.get(
                      "score",
                      0
                  )
              )

              old_high = old_score >= 75
              new_high = new_score >= 75

              if old_high != new_high:
                  reversal = True

          # ---------------------------------------------------------
          # 9. Evidence stability
          # ---------------------------------------------------------

          evidence_stable = (
              consistency_status
              in (
                  "STABLE_EVIDENCE",
                  "LIMITED_EVIDENCE_CHANGE"
              )
          )

          # ---------------------------------------------------------
          # 10. Strategy stability
          # ---------------------------------------------------------

          strategy_v90 = (
              v90.get("strategic_state", {})
              .get("preferred_strategy")
          )

          strategy_v89 = (
              v89.get("preferred_strategy")
              or v89.get("selected_strategy")
          )

          strategy_stable = (
              not strategy_v90
              or not strategy_v89
              or strategy_v90 == strategy_v89
          )

          # ---------------------------------------------------------
          # 11. Over / under pruning indicators
          # ---------------------------------------------------------

          total = len(current)

          low_priority = sum(
              1
              for x in current.values()
              if x["score"] < 35
          )

          actionable = sum(
              1
              for x in current.values()
              if (
                  x["signals"]["request"]
                  and x["signals"]["delegation"]
              )
          )

          if total:
              low_ratio = low_priority / total
              actionable_ratio = actionable / total
          else:
              low_ratio = 0
              actionable_ratio = 0

          over_pruning = (
              total >= 5
              and low_ratio >= 0.85
          )

          under_pruning = (
              actionable > 0
              and any(
                  x["signals"]["completion"]
                  for x in current.values()
              )
          )

          # ---------------------------------------------------------
          # 12. Self-correction signal
          # ---------------------------------------------------------

          previous_assessment = (
              v88.get("self_assessment")
              or v88.get("assessment")
              or {}
          )

          assessment_status = (
              previous_assessment.get("status")
              if isinstance(
                  previous_assessment,
                  dict
              )
              else None
          )

          self_correction_signal = False

          if assessment_status in (
              "DECISION_NEEDS_CORRECTION",
              "DECISION_HAS_WEAKNESSES"
          ):
              if evidence_stable and not reversal:
                  self_correction_signal = True

          # ---------------------------------------------------------
          # 13. Stability metrics
          # ---------------------------------------------------------

          decision_stability = 1.0

          if reversal:
              decision_stability -= 0.35

          if consistency_status == "MATERIAL_EVIDENCE_CHANGE":
              decision_stability -= 0.10

          if over_pruning:
              decision_stability -= 0.10

          decision_stability = round(
              max(0.0, min(1.0, decision_stability)),
              3
          )

          evidence_stability = round(
              1.0 if evidence_stable else 0.65,
              3
          )

          strategy_stability_score = round(
              1.0 if strategy_stable else 0.60,
              3
          )

          reversal_rate = (
              1.0 if reversal else 0.0
          )

          self_correction_rate = (
              1.0 if self_correction_signal else 0.0
          )

          # ---------------------------------------------------------
          # 14. Overall quality profile
          # ---------------------------------------------------------

          overall_stability = round(
              (
                  decision_stability * 0.35
                  + evidence_stability * 0.30
                  + strategy_stability_score * 0.20
                  + (1.0 - reversal_rate) * 0.15
              ),
              3
          )

          if overall_stability >= 0.85:
              quality = "STRONG_STABILITY"

          elif overall_stability >= 0.70:
              quality = "STABLE_WITH_MINOR_VARIATION"

          elif overall_stability >= 0.50:
              quality = "EMERGING_STABILITY"

          else:
              quality = "UNSTABLE_DECISION_PATTERN"

          # ---------------------------------------------------------
          # 15. Learning conclusions
          # ---------------------------------------------------------

          findings = []

          if reversal:
              findings.append(
                  "A decision threshold changed across observations; "
                  "future versions must determine whether the reversal "
                  "was caused by real evidence change or instability."
              )
          else:
              findings.append(
                  "No unjustified high-confidence decision reversal "
                  "was detected in the current comparison."
              )

          if over_pruning:
              findings.append(
                  "The live sample may be over-pruned; low-priority "
                  "classification should remain monitored."
              )

          if under_pruning:
              findings.append(
                  "Completion signals were present and must remain "
                  "strong exclusion evidence."
              )

          if evidence_stable:
              findings.append(
                  "Decision stability is supported by relatively stable "
                  "evidence signals."
              )
          else:
              findings.append(
                  "Evidence changed materially; decision variation may "
                  "therefore be justified."
              )

          if self_correction_signal:
              findings.append(
                  "A potential self-correction signal was detected: "
                  "previous weaknesses remain visible while current "
                  "evidence remains stable."
              )

          # ---------------------------------------------------------
          # 16. Next-stage recommendation
          # ---------------------------------------------------------

          if quality == "STRONG_STABILITY":
              next_stage = "V92_AUTONOMOUS_SELF_CORRECTION_PROPOSAL"

          elif quality == "STABLE_WITH_MINOR_VARIATION":
              next_stage = "V92_AUTONOMOUS_SELF_CORRECTION_PROPOSAL"

          else:
              next_stage = "V92_STABILITY_REFINEMENT"

          # ---------------------------------------------------------
          # 17. Result
          # ---------------------------------------------------------

          result = {
              "version": "V91",
              "generated_at": now(),
              "mode": "autonomous_decision_stability",

              "agent": {
                  "id": nox_id,
                  "username": nox_username
              },

              "inputs": {
                  "v90_loaded": bool(v90),
                  "v86_loaded": bool(v86),
                  "v87_loaded": bool(v87),
                  "v88_loaded": bool(v88),
                  "v89_loaded": bool(v89),
                  "previous_v91_loaded": bool(previous_v91)
              },

              "live_sample": {
                  "for_you": len(extract_items(feed)),
                  "suggestions": len(extract_items(suggestions)),
                  "public_posts": len(extract_items(posts)),
                  "deduplicated_candidates": total
              },

              "comparison": {
                  "v90_selected_post_id": v90_post_id,
                  "v90_decision": v90_decision,
                  "v90_recommended_action": v90_action,
                  "v90_score": v90_score,
                  "current_selected_context": current_selected,
                  "consistency_status": consistency_status,
                  "decision_reversal": reversal
              },

              "metrics": {
                  "decision_stability": decision_stability,
                  "evidence_stability": evidence_stability,
                  "strategy_stability": strategy_stability_score,
                  "reversal_rate": reversal_rate,
                  "over_pruning_signal": over_pruning,
                  "under_pruning_signal": under_pruning,
                  "self_correction_signal": self_correction_signal,
                  "self_correction_rate": self_correction_rate,
                  "overall_stability": overall_stability
              },

              "quality_profile": quality,

              "findings": findings,

              "strategic_state": {
                  "v89_strategy": strategy_v89,
                  "v90_strategy": strategy_v90,
                  "strategy_stable": strategy_stable
              },

              "learning": {
                  "decision_quality_is_measurable": True,
                  "evidence_quality_is_measurable": True,
                  "decision_reversals_are_tracked": True,
                  "over_pruning_is_tracked": True,
                  "under_pruning_is_tracked": True,
                  "self_correction_is_tracked": True
              },

              "next_stage": {
                  "version": next_stage,
                  "purpose": (
                      "Allow NØX to formulate its own correction "
                      "proposals from measured decision weaknesses "
                      "without automatically deploying rule changes."
                  )
              },

              "autonomy": {
                  "autonomous_measurement": True,
                  "autonomous_self_evaluation": True,
                  "autonomous_error_detection": True,
                  "autonomous_self_correction_proposal": False,
                  "automatic_rule_deployment": False,
                  "automatic_external_action": False,
                  "human_override": True
              },

              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True,
                  "primary_source_preference": True
              },

              "answer_status": (
                  "STABILITY_MEASURED"
                  if total > 0
                  else "INSUFFICIENT_LIVE_SAMPLE"
              ),

              "confidence": round(
                  overall_stability,
                  3
              )
          }

          # ---------------------------------------------------------
          # 18. Save JSON
          # ---------------------------------------------------------

          json_path = (
              "memory/"
              "nox_v91_autonomous_decision_stability.json"
          )

          save(json_path, result)

          # ---------------------------------------------------------
          # 19. Save Markdown
          # ---------------------------------------------------------

          md = [
              "# NØX V91 — Autonomous Decision Stability",
              "",
              f"Generated: {result['generated_at']}",
              "",
              "## Objective",
              "",
              "Measure the stability and quality of NØX autonomous "
              "decisions before increasing decision authority.",
              "",
              "## Live sample",
              "",
              f"- For You: {len(extract_items(feed))}",
              f"- Suggestions: {len(extract_items(suggestions))}",
              f"- Public posts: {len(extract_items(posts))}",
              f"- Candidates: {total}",
              "",
              "## Decision comparison",
              "",
              f"- V90 decision: {v90_decision}",
              f"- V90 action: {v90_action}",
              f"- Consistency: {consistency_status}",
              f"- Decision reversal: {reversal}",
              "",
              "## Stability metrics",
              "",
              f"- Decision stability: {decision_stability:.3f}",
              f"- Evidence stability: {evidence_stability:.3f}",
              f"- Strategy stability: {strategy_stability_score:.3f}",
              f"- Reversal rate: {reversal_rate:.3f}",
              f"- Over-pruning signal: {over_pruning}",
              f"- Under-pruning signal: {under_pruning}",
              f"- Self-correction signal: {self_c
