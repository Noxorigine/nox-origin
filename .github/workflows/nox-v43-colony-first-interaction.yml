name: NØX Origin - V43 Colony First Interaction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  colony-first-interaction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX V43
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          BASE = "https://thecolony.ai/api/v1"

          memory_file = Path("nox_memory.json")
          report_file = Path("V43_COLONY_INTERACTION.md")

          now = datetime.now(timezone.utc).isoformat()

          print("===================================")
          print("NØX ORIGIN V43")
          print("COLONY FIRST INTERACTION")
          print("===================================")

          # --------------------------------------------------
          # 1. API KEY
          # --------------------------------------------------

          colony_key = os.environ.get("COLONY_API_KEY")

          if not colony_key:
              raise RuntimeError(
                  "COLONY_API_KEY secret is missing."
              )

          # --------------------------------------------------
          # 2. LOAD MEMORY
          # --------------------------------------------------

          if memory_file.exists():
              try:
                  memory = json.loads(
                      memory_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  memory = {}
          else:
              memory = {}

          if not isinstance(memory, dict):
              memory = {}

          memory.setdefault(
              "colony_selection_log",
              []
          )

          memory.setdefault(
              "colony_response_draft_log",
              []
          )

          memory.setdefault(
              "colony_interaction_log",
              []
          )

          memory.setdefault(
              "learning_log",
              []
          )

          # --------------------------------------------------
          # 3. FIND V41 SELECTION
          # --------------------------------------------------

          selections = memory[
              "colony_selection_log"
          ]

          if not selections:
              raise RuntimeError(
                  "No V41 selection found."
              )

          selected = selections[-1]

          if not isinstance(selected, dict):
              raise RuntimeError(
                  "Invalid V41 selection record."
              )

          post_id = selected.get("post_id")

          if not post_id:
              raise RuntimeError(
                  "V41 selection has no post_id."
              )

          print(
              f"Selected post: {post_id}"
          )

          # --------------------------------------------------
          # 4. FIND V42 DRAFT
          # --------------------------------------------------

          drafts = memory[
              "colony_response_draft_log"
          ]

          if not drafts:
              raise RuntimeError(
                  "No V42 response draft found."
              )

          draft = drafts[-1]

          if not isinstance(draft, dict):
              raise RuntimeError(
                  "Invalid V42 draft record."
              )

          if draft.get("post_id") != post_id:
              raise RuntimeError(
                  "V42 draft does not match V41 selection."
              )

          if draft.get("published") is not False:
              raise RuntimeError(
                  "V42 draft is already marked as published."
              )

          analysis = str(
              draft.get("analysis") or ""
          ).strip()

          if not analysis:
              raise RuntimeError(
                  "V42 draft is empty."
              )

          # --------------------------------------------------
          # 5. EXTRACT DRAFT COMMENT
          # --------------------------------------------------

          marker = "DRAFT:"

          if marker not in analysis:
              raise RuntimeError(
                  "V42 analysis does not contain DRAFT section."
              )

          draft_comment = analysis.split(
              marker,
              1
          )[1]

          if "CONFIDENCE:" in draft_comment:
              draft_comment = draft_comment.split(
                  "CONFIDENCE:",
                  1
              )[0]

          draft_comment = draft_comment.strip()

          if not draft_comment:
              raise RuntimeError(
                  "Unable to extract V42 draft comment."
              )

          # --------------------------------------------------
          # 6. CONFIDENCE CHECK
          # --------------------------------------------------

          confidence = 0.0

          if "CONFIDENCE:" in analysis:
              confidence_text = analysis.split(
                  "CONFIDENCE:",
                  1
              )[1].strip()

              first_line = confidence_text.splitlines()[0].strip()

              try:
                  confidence = float(
                      first_line
                  )
              except ValueError:
                  confidence = 0.0

          print(
              f"V42 confidence: {confidence}"
          )

          if confidence < 0.80:
              raise RuntimeError(
                  "NØX refused public action: "
                  "confidence below 0.80."
              )

          # --------------------------------------------------
          # 7. BASIC SAFETY CHECK
          # --------------------------------------------------

          forbidden = [
              "I am human",
              "as a human",
              "I personally experienced",
              "I personally saw",
              "I guarantee",
              "I can guarantee"
          ]

          lower_comment = (
              draft_comment.lower()
          )

          detected = [
              phrase
              for phrase in forbidden
              if phrase.lower() in lower_comment
          ]

          if detected:
              raise RuntimeError(
                  "Public comment rejected by identity "
                  "safety check: "
                  + ", ".join(detected)
              )

          # --------------------------------------------------
          # 8. AUTHENTICATE WITH THE COLONY
          # --------------------------------------------------

          token_response = requests.post(
              f"{BASE}/auth/token",
              json={
                  "api_key": colony_key
              },
              timeout=20
          )

          if token_response.status_code != 200:
              raise RuntimeError(
                  "Colony authentication failed: "
                  f"{token_response.status_code}"
              )

          token_data = token_response.json()

          token = token_data.get(
              "access_token"
          )

          if not token:
              raise RuntimeError(
                  "No Colony access token."
              )

          headers = {
              "Authorization":
                  f"Bearer {token}",
              "Accept": "application/json",
              "Content-Type": "application/json"
          }

          print(
              "Colony authentication: PASS"
          )

          # --------------------------------------------------
          # 9. RETRIEVE FULL CONTEXT BEFORE COMMENTING
          # --------------------------------------------------

          context_response = requests.get(
              f"{BASE}/posts/{post_id}/context",
              headers=headers,
              timeout=30
          )

          print(
              "Context status:",
              context_response.status_code
          )

          if context_response.status_code != 200:
              raise RuntimeError(
                  "Unable to retrieve full post context."
              )

          context_data = context_response.json()

          # --------------------------------------------------
          # 10. VERIFY TARGET
          # --------------------------------------------------

          context_post = context_data

          if isinstance(
              context_data.get("post"),
              dict
          ):
              context_post = context_data["post"]

          context_id = context_post.get(
              "id"
          )

          if context_id and context_id != post_id:
              raise RuntimeError(
                  "Context post ID does not match V41 selection."
              )

          print(
              "Full context verification: PASS"
          )

          # --------------------------------------------------
          # 11. PUBLIC ACTION
          # --------------------------------------------------

          print("-----------------------------------")
          print("NØX IS ABOUT TO PERFORM ONE PUBLIC ACTION")
          print("-----------------------------------")
          print("Action: COMMENT")
          print(f"Post: {post_id}")
          print("No vote")
          print("No DM")
          print("No follow")
          print("No new post")
          print("-----------------------------------")

          comment_response = requests.post(
              f"{BASE}/posts/{post_id}/comments",
              headers=headers,
              json={
                  "body": draft_comment
              },
              timeout=30
          )

          print(
              "Comment status:",
              comment_response.status_code
          )

          if comment_response.status_code not in (
              200,
              201
          ):
              raise RuntimeError(
                  "Colony comment failed: "
                  f"{comment_response.status_code} "
                  f"{comment_response.text}"
              )

          comment_data = comment_response.json()

          comment_id = (
              comment_data.get("id")
              or comment_data.get("comment_id")
          )

          print(
              "PUBLIC COMMENT: SUCCESS"
          )

          # --------------------------------------------------
          # 12. RECORD INTERACTION
          # --------------------------------------------------

          interaction_record = {
              "timestamp": now,
              "version": "V43",
              "post_id": post_id,
              "comment_id": comment_id,
              "action": "comment",
              "body": draft_comment,
              "confidence": confidence,
              "status": "published",
              "vote": False,
              "dm": False,
              "follow": False,
              "new_post": False
          }

          memory[
              "colony_interaction_log"
          ].append(
              interaction_record
          )

          memory[
              "colony_response_draft_log"
          ].append({
              "timestamp": now,
              "version": "V43",
              "post_id": post_id,
              "status": "published",
              "published": True,
              "comment_id": comment_id
          })

          memory[
              "learning_log"
          ].append({
              "timestamp": now,
              "version": "V43",
              "lesson": (
                  "NØX can transform a selected observation "
                  "into one controlled public interaction "
                  "after analysis, confidence verification, "
                  "and context retrieval."
              ),
              "source": "V43 first Colony interaction",
              "confidence": confidence
          })

          memory["version"] = "V43"
          memory["last_updated"] = now

          memory_file.write_text(
              json.dumps(
                  memory,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          # --------------------------------------------------
          # 13. VERIFY PERSISTENCE
          # --------------------------------------------------

          loaded = json.loads(
              memory_file.read_text(
                  encoding="utf-8"
              )
          )

          interactions = loaded.get(
              "colony_interaction_log",
              []
          )

          if not interactions:
              raise RuntimeError(
                  "Interaction persistence failed."
              )

          last = interactions[-1]

          if last.get("post_id") != post_id:
              raise RuntimeError(
                  "Persisted post ID mismatch."
              )

          if last.get("status") != "published":
              raise RuntimeError(
                  "Interaction was not persisted as published."
              )

          # --------------------------------------------------
          # 14. REPORT
          # --------------------------------------------------

          report = [
              "# NØX Origin — V43 Colony First Interaction",
              "",
              "## Target",
              "",
              f"- Post ID: {post_id}",
              f"- Comment ID: {comment_id or 'returned by Colony'}",
              "",
              "## Action",
              "",
              "- Action: COMMENT",
              "- Published: YES",
              "- Vote: NO",
              "- DM: NO",
              "- Follow: NO",
              "- New post: NO",
              "",
              "## Confidence",
              "",
              f"- V42 confidence: {confidence}",
              "- Minimum required: 0.80",
              "- Confidence gate: PASS",
              "",
              "## Comment Published",
              "",
              draft_comment,
              "",
              "## V43 Principle",
              "",
              "NØX transformed a selected observation into "
              "one controlled public interaction.",
              "",
              "The interaction was limited to one comment "
              "on the publication selected by V41.",
              "",
              "No other public action was authorized."
          ]

          report_file.write_text(
              "\n".join(report),
              encoding="utf-8"
          )

          print("===================================")
          print("V43 COMPLETE")
          print("===================================")
          print("Selection: PASS")
          print("Draft: PASS")
          print("Confidence gate: PASS")
          print("Context retrieval: PASS")
          print("Comment publication: PASS")
          print("Additional actions: NONE")
          print("===================================")
          PY

      - name: Commit V43 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json V43_COLONY_INTERACTION.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NØX V43 - First Colony Interaction"
            git push
          fi
