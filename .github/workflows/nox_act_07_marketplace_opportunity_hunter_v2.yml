name: NØX ACT 07 V2 Marketplace Opportunity Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  marketplace-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NØX ACT 07 V2
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import os
          import json
          import re
          from datetime import datetime, timezone

          import requests


          BASE_URL = "https://thecolony.cc/api/v1"
          API_KEY = os.environ["COLONY_API_KEY"]

          MEMORY_FILE = "memory/nox_act_07_marketplace_hunter.json"

          MAX_TASKS = 100
          TOP_RESULTS = 10
          TIMEOUT = 20


          session = requests.Session()

          session.headers.update({
              "Authorization": f"Bearer {API_KEY}",
              "Accept": "application/json",
          })


          def get_json(path, params=None):
              response = session.get(
                  BASE_URL + path,
                  params=params,
                  timeout=TIMEOUT
              )

              response.raise_for_status()
              return response.json()


          def load_memory():
              try:
                  with open(MEMORY_FILE, "r", encoding="utf-8") as file:
                      return json.load(file)

              except (FileNotFoundError, json.JSONDecodeError):
                  return {
                      "seen_task_ids": [],
                      "runs": [],
                      "last_result": None
                  }


          def save_memory(memory):
              directory = os.path.dirname(MEMORY_FILE)

              if directory:
                  os.makedirs(directory, exist_ok=True)

              with open(MEMORY_FILE, "w", encoding="utf-8") as file:
                  json.dump(
                      memory,
                      file,
                      ensure_ascii=False,
                      indent=2
                  )


          def as_list(payload):
              if isinstance(payload, list):
                  return payload

              if isinstance(payload, dict):
                  for key in (
                      "items",
                      "tasks",
                      "results",
                      "data"
                  ):
                      value = payload.get(key)

                      if isinstance(value, list):
                          return value

              return []


          def text_of(task):
              parts = []

              for key in (
                  "title",
                  "body",
                  "description",
                  "details",
                  "tags",
                  "category"
              ):
                  value = task.get(key)

                  if isinstance(value, list):
                      parts.extend(str(item) for item in value)

                  elif value is not None:
                      parts.append(str(value))

              return " ".join(parts).lower()


          def reward_sats(task):
              for key in (
                  "reward_sats",
                  "budget_sats",
                  "reward",
                  "budget_max_sats",
                  "listed_rate_sats"
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      return float(value)

                  if isinstance(value, str):
                      match = re.search(
                          r"([\d,.]+)\s*sats?",
                          value.lower()
                      )

                      if match:
                          return float(
                              match.group(1).replace(",", "")
                          )

              for key in (
                  "reward_msats",
                  "budget_msats"
              ):
                  value = task.get(key)

                  if isinstance(value, (int, float)):
                      return float(value) / 1000.0

              return 0.0


          def task_id(task):
              return str(
                  task.get("id")
                  or task.get("post_id")
                  or task.get("uuid")
                  or ""
              )


          def score_task(task):
              text = text_of(task)

              score = 0
              evidence = []

              keywords = {
                  "python": 2,
                  "api": 2,
                  "automation": 2,
                  "research": 2,
                  "analysis": 2,
                  "data": 2,
                  "testing": 2,
                  "qa": 2,
                  "documentation": 1,
                  "scraping": 2,
                  "debug": 2,
                  "verification": 2,
                  "source": 1,
                  "json": 1,
                  "csv": 1
              }

              for word, points in keywords.items():
                  if word in text:
                      score += points
                      evidence.append(word)

              reward = reward_sats(task)

              if reward >= 5000:
                  score += 2

              elif reward >= 1000:
                  score += 1

              risky_terms = (
                  "wallet",
                  "deposit",
                  "transfer",
                  "buy",
                  "purchase",
                  "investment"
              )

              if any(term in text for term in risky_terms):
                  score -= 4

              return score, sorted(set(evidence)), reward


          def main():

              memory = load_memory()

              now = datetime.now(
                  timezone.utc
              ).isoformat()


              tasks = as_list(
                  get_json(
                      "/marketplace/tasks",
                      {
                          "status": "open",
                          "sort": "new",
                          "limit": MAX_TASKS,
                          "offset": 0
                      }
                  )
              )


              candidates = []


              for task in tasks:

                  task_id_value = task_id(task)

                  if not task_id_value:
                      continue


                  score, evidence, reward = score_task(task)


                  if score < 2:
                      continue


                  candidates.append({
                      "task_id": task_id_value,
                      "title": (
                          task.get("title")
                          or task.get("name")
                          or "Untitled task"
                      ),
                      "score": score,
                      "reward_sats": reward,
                      "evidence": evidence,
                      "author": (
                          task.get("author")
                          or task.get("author_name")
                      ),
                      "category": task.get("category"),
                      "status": task.get(
                          "status",
                          "open"
                      ),
                      "url": (
                          task.get("url")
                          or task.get("web_url")
                      ),
                      "new_for_nox": (
                          task_id_value
                          not in memory.get(
                              "seen_task_ids",
                              []
                          )
                      )
                  })


              candidates.sort(
                  key=lambda item: (
                      item["score"],
                      item["reward_sats"]
                  ),
                  reverse=True
              )


              top = candidates[:TOP_RESULTS]


              for item in top:

                  if (
                      item["task_id"]
                      not in memory["seen_task_ids"]
                  ):
                      memory["seen_task_ids"].append(
                          item["task_id"]
                      )


              memory["seen_task_ids"] = (
                  memory["seen_task_ids"][-500:]
              )


              new_candidates = sum(
                  1
                  for item in top
                  if item["new_for_nox"]
              )


              high_priority_count = sum(
                  1
                  for item in top
                  if item["score"] >= 6
              )


              medium_priority_count = sum(
                  1
                  for item in top
                  if 3 <= item["score"] < 6
              )


              result = {

                  "version": "ACT 07 V2",

                  "name": (
                      "Marketplace Opportunity Hunter"
                  ),

                  "mode": (
                      "read_only_opportunity_detection"
                  ),

                  "generated_at": now,


                  "policy": {

                      "marketplace_read": True,

                      "bid": False,

                      "purchase": False,

                      "payment": False,

                      "transfer": False,

                      "dm": False,

                      "gemini": False,

                      "project_cost_eur": 0

                  },


                  "observation": {

                      "open_tasks_found": len(tasks),

                      "opportunity_candidates": len(
                          candidates
                      ),

                      "new_candidates": new_candidates,

                      "high_priority_count": (
                          high_priority_count
                      ),

                      "medium_priority_count": (
                          medium_priority_count
                      )

                  },


                  "opportunities": top,


                  "decision": (
                      "OBSERVE_ONLY"
                      if top
                      else "NO_OPPORTUNITY"
                  ),


                  "decision_reason": (

                      "Real marketplace opportunities "
                      "detected; no bid or financial "
                      "action is executed."

                      if top

                      else

                      "No sufficiently relevant open "
                      "marketplace opportunity was "
                      "detected."

                  )

              }


              memory["last_result"] = result


              memory["runs"].append({

                  "generated_at": now,

                  "open_tasks_found": len(tasks),

                  "opportunity_candidates": len(
                      candidates
                  )

              })


              memory["runs"] = (
                  memory["runs"][-100:]
              )


              save_memory(memory)


              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  )
              )


          if __name__ == "__main__":
              main()

          PY

      - name: Commit ACT 07 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_07_marketplace_hunter.json

          git diff --cached --quiet || git commit -m "Update ACT 07 marketplace opportunity memory"

          git push
