name: NØX ACT 07 V2 Marketplace Opportunity Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  marketplace-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ACT 07 V2 Marketplace Opportunity Hunter
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import requests
          from datetime import datetime, timezone

          API_KEY = os.environ.get("COLONY_API_KEY")
          BASE_URL = "https://thecolony.cc/api/v1"
          TASKS_URL = f"{BASE_URL}/marketplace/tasks"

          MEMORY_DIR = "memory"
          MEMORY_FILE = os.path.join(
              MEMORY_DIR,
              "nox_act_07_marketplace_opportunity_hunter_v2.json"
          )

          MAX_RESULTS = 20

          os.makedirs(MEMORY_DIR, exist_ok=True)

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          def load_memory():
              if not os.path.exists(MEMORY_FILE):
                  return {
                      "version": "ACT 07 V2",
                      "generated_at": None,
                      "scanned_tasks": {},
                      "statistics": {
                          "runs": 0,
                          "tasks_seen": 0,
                          "opportunities_found": 0
                      }
                  }

              try:
                  with open(MEMORY_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {
                      "version": "ACT 07 V2",
                      "generated_at": None,
                      "scanned_tasks": {},
                      "statistics": {
                          "runs": 0,
                          "tasks_seen": 0,
                          "opportunities_found": 0
                      }
                  }

          def save_memory(memory):
              temp_file = MEMORY_FILE + ".tmp"

              with open(temp_file, "w", encoding="utf-8") as f:
                  json.dump(memory, f, ensure_ascii=False, indent=2)

              os.replace(temp_file, MEMORY_FILE)

          def text_of(task):
              title = str(task.get("title") or "")
              description = str(
                  task.get("description")
                  or task.get("body")
                  or ""
              )

              return f"{title} {description}".strip()

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").strip().lower()
              )

          def is_service_offer(task):
              text = normalize(text_of(task))

              service_patterns = [
                  r"\bfor hire\b",
                  r"\bavailable for hire\b",
                  r"\boffering\b",
                  r"\bi offer\b",
                  r"\bmy services\b",
                  r"\bservices available\b",
                  r"\bavailable to help\b",
                  r"\bopen for work\b"
              ]

              return any(
                  re.search(pattern, text)
                  for pattern in service_patterns
              )

          def is_task_request(task):
              text = normalize(text_of(task))

              request_patterns = [
                  r"\bneed an?\b",
                  r"\blooking for\b",
                  r"\bseeking\b",
                  r"\bneed someone\b",
                  r"\bwant someone\b",
                  r"\bplease build\b",
                  r"\bplease create\b",
                  r"\bplease fix\b",
                  r"\bplease analyze\b",
                  r"\bplease research\b",
                  r"\bplease test\b",
                  r"\bplease develop\b",
                  r"\bcan someone\b",
                  r"\bdoes anyone\b",
                  r"\bhelp needed\b",
                  r"\btask\b",
                  r"\bjob\b",
                  r"\bwork needed\b"
              ]

              return any(
                  re.search(pattern, text)
                  for pattern in request_patterns
              )

          def extract_reward(task):
              text = text_of(task)

              negative_money = re.search(
                  r"-\s*\d+(?:[.,]\d+)?\s*(USDC|USD|SAT|SATS|BTC)",
                  text,
                  flags=re.IGNORECASE
              )

              if negative_money:
                  return {
                      "status": "ambiguous",
                      "amount": None,
                      "currency": negative_money.group(1).upper(),
                      "reason": "negative_amount_detected"
                  }

              ambiguous_patterns = [
                  r"\bpay what you want\b",
                  r"\bnegotiable\b",
                  r"\bmake an offer\b",
                  r"\bcontact .* price\b",
                  r"\bprice on request\b",
                  r"\bdiscuss.*price\b",
                  r"\bpayment.*negotiable\b"
              ]

              if any(
                  re.search(pattern, normalize(text))
                  for pattern in ambiguous_patterns
              ):
                  return {
                      "status": "ambiguous",
                      "amount": None,
                      "currency": None,
                      "reason": "ambiguous_compensation"
                  }

              positive = re.search(
                  r"\b(\d+(?:[.,]\d+)?)\s*(USDC|USD|SAT|SATS|BTC)\b",
                  text,
                  flags=re.IGNORECASE
              )

              if positive:
                  return {
                      "status": "confirmed",
                      "amount": positive.group(1),
                      "currency": positive.group(2).upper(),
                      "reason": "explicit_compensation"
                  }

              return {
                  "status": "unknown",
                  "amount": None,
                  "currency": None,
                  "reason": "no_explicit_compensation"
              }

          def risk_assessment(task):
              text = normalize(text_of(task))

              high_risk_patterns = [
                  r"\bsolve captcha\b",
                  r"\bcomplete captcha\b",
                  r"\bpass captcha\b",
                  r"\bbypass captcha\b",
                  r"\bverify captcha\b",
                  r"\bcaptcha solving\b",
                  r"\bcaptcha required\b",
                  r"\bprovide .*private key\b",
                  r"\bshare .*private key\b",
                  r"\bprovide .*seed phrase\b",
                  r"\bshare .*seed phrase\b",
                  r"\bprovide .*recovery phrase\b",
                  r"\bshare .*recovery phrase\b",
                  r"\bprovide .*mnemonic\b",
                  r"\bsend crypto\b",
                  r"\btransfer crypto\b",
                  r"\bpay upfront\b",
                  r"\bpay first\b",
                  r"\bfund wallet\b",
                  r"\bdeposit crypto\b",
                  r"\bwallet password\b",
                  r"\bwallet credentials\b"
              ]

              for pattern in high_risk_patterns:
                  if re.search(pattern, text):
                      return {
                          "level": "high",
                          "reason": pattern
                      }

              mention_patterns = [
                  r"\bcaptcha\b",
                  r"\bprivate key\b",
                  r"\bseed phrase\b",
                  r"\brecovery phrase\b",
                  r"\bmnemonic\b",
                  r"\bwallet\b"
              ]

              for pattern in mention_patterns:
                  if re.search(pattern, text):
                      return {
                          "level": "mention_only",
                          "reason": pattern
                      }

              return {
                  "level": "low",
                  "reason": None
              }

          def compatibility(task):
              text = normalize(text_of(task))

              skills = {
                  "python": [
                      r"\bpython\b"
                  ],
                  "api": [
                      r"\bapi\b",
                      r"\brest\b",
                      r"\bendpoint\b"
                  ],
                  "automation": [
                      r"\bautomation\b",
                      r"\bautomate\b",
                      r"\bworkflow\b",
                      r"\bbot\b"
                  ],
                  "research": [
                      r"\bresearch\b",
                      r"\banalyze\b",
                      r"\banalysis\b",
                      r"\binvestigate\b"
                  ],
                  "data": [
                      r"\bdata\b",
                      r"\bdataset\b",
                      r"\bjson\b",
                      r"\bcsv\b"
                  ],
                  "web": [
                      r"\bweb scraping\b",
                      r"\bscraping\b",
                      r"\bscraper\b",
                      r"\bcrawl\b"
                  ],
                  "testing": [
                      r"\btest\b",
                      r"\btesting\b",
                      r"\bqa\b"
                  ],
                  "technical_writing": [
                      r"\bdocumentation\b",
                      r"\btechnical writing\b",
                      r"\bdocs\b"
                  ],
                  "debugging": [
                      r"\bdebug\b",
                      r"\bdebugging\b",
                      r"\bbug\b",
                      r"\bfix\b"
                  ]
              }

              matched = []

              for skill, patterns in skills.items():
                  if any(
                      re.search(pattern, text)
                      for pattern in patterns
                  ):
                      matched.append(skill)

              score = min(len(matched) * 2, 10)

              return score, matched

          memory = load_memory()

          headers = {
              "Accept": "application/json",
              "Authorization": f"Bearer {API_KEY}"
          }

          response = requests.get(
              TASKS_URL,
              headers=headers,
              params={
                  "status": "open",
                  "sort": "new",
                  "limit": 100,
                  "offset": 0
              },
              timeout=30
          )

          print(f"Marketplace HTTP status: {response.status_code}")

          response.raise_for_status()

          payload = response.json()

          if isinstance(payload, dict):
              tasks = (
                  payload.get("tasks")
                  or payload.get("data")
                  or payload.get("items")
                  or []
              )
          elif isinstance(payload, list):
              tasks = payload
          else:
              tasks = []

          evaluated = []

          for task in tasks[:MAX_RESULTS]:
              task_id = str(
                  task.get("id")
                  or task.get("task_id")
                  or task.get("uuid")
                  or ""
              )

              if not task_id:
                  continue

              service_offer = is_service_offer(task)
              task_request = is_task_request(task)

              reward = extract_reward(task)
              risk = risk_assessment(task)
              compatibility_score, matched_skills = compatibility(task)

              if service_offer and not task_request:
                  classification = "SERVICE_OFFER"

              elif risk["level"] == "high":
                  classification = "REJECT"

              elif not task_request:
                  classification = "OBSERVE"

              elif reward["status"] != "confirmed":
                  classification = "REVIEW"

              elif risk["level"] == "mention_only":
                  classification = "REVIEW"

              elif compatibility_score >= 8:
                  classification = "QUALIFIED"

              elif compatibility_score >= 5:
                  classification = "REVIEW"

              else:
                  classification = "OBSERVE"

              title = str(task.get("title") or "Untitled")

              record = {
                  "task_id": task_id,
                  "title": title,
                  "classification": classification,
                  "service_offer": service_offer,
                  "task_request": task_request,
                  "reward": reward,
                  "risk": risk,
                  "compatibility_score": compatibility_score,
                  "matched_skills": matched_skills,
                  "observed_at": utc_now(),
                  "actions": {
                      "bid": False,
                      "comment": False,
                      "dm": False,
                      "payment": False,
                      "purchase": False,
                      "transfer": False
                  }
              }

              evaluated.append(record)
              memory["scanned_tasks"][task_id] = record

          memory["version"] = "ACT 07 V2"
          memory["generated_at"] = utc_now()
          memory["statistics"]["runs"] = (
              memory["statistics"].get("runs", 0) + 1
          )
          memory["statistics"]["tasks_seen"] = len(tasks)
          memory["statistics"]["opportunities_found"] = sum(
              1
              for item in evaluated
              if item["classification"] in {
                  "QUALIFIED",
                  "REVIEW"
              }
          )

          memory["last_run"] = {
              "timestamp": utc_now(),
              "marketplace_status": response.status_code,
              "tasks_returned": len(tasks),
              "tasks_evaluated": len(evaluated),
              "actions_performed": False,
              "gemini_used": False,
              "project_cost_eur": 0
          }

          save_memory(memory)

          print("")
          print("=== NØX ACT 07 V2 RESULT ===")
          print(f"Open tasks received: {len(tasks)}")
          print(f"Tasks evaluated: {len(evaluated)}")

          counts = {}

          for item in evaluated:
              category = item["classification"]
              counts[category] = counts.get(category, 0) + 1

          for category, count in sorted(counts.items()):
              print(f"{category}: {count}")

          print("")
          print("Actions performed: NO")
          print("Gemini used: NO")
          print("Project cost: €0")
          print("==============================")
          PY

      - name: Commit and push ACT 07 memory
        run: |
          set -e

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_07_marketplace_opportunity_hunter_v2.json

          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi

          git commit -m "Update ACT 07 marketplace opportunity memory"

          echo "Synchronizing with latest main before push..."

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi
            else
              echo "Rebase conflict detected."
              git rebase --abort
              exit 1
            fi

            echo "Remote main changed. Retrying..."
            sleep 2
          done

          echo "Unable to push after 5 attempts."
          exit 1
