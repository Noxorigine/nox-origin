name: "NØX ACT41 - Action Outcome Evaluation"

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  action-outcome-evaluation:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT41
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          # ============================================================
          # Helpers
          # ============================================================

          def load_json(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def write_json(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")

          def numeric(value, default=None):
              if isinstance(value, bool):
                  return default

              if isinstance(value, (int, float)):
                  return float(value)

              if isinstance(value, str):
                  try:
                      return float(
                          value.strip().replace("%", "")
                      )
                  except Exception:
                      return default

              return default

          def find_act_file(act_number, preferred_names=None):
              preferred_names = preferred_names or []

              for name in preferred_names:
                  path = MEMORY / name

                  if path.exists():
                      data = load_json(path)

                      if (
                          isinstance(data, dict)
                          and str(
                              data.get("act", "")
                          ).upper()
                          == act_number.upper()
                      ):
                          return path, data

              number = act_number.lower().replace(
                  "act",
                  ""
              )

              candidates = []

              candidates.extend(
                  MEMORY.glob(
                      f"*act_{number}*.json"
                  )
              )

              candidates.extend(
                  MEMORY.glob(
                      f"*act{number}*.json"
                  )
              )

              matches = []

              seen = set()

              for path in candidates:

                  if path in seen:
                      continue

                  seen.add(path)

                  data = load_json(path)

                  if (
                      isinstance(data, dict)
                      and str(
                          data.get("act", "")
                      ).upper()
                      == act_number.upper()
                  ):
                      matches.append(
                          (path, data)
                      )

              if not matches:
                  return None, {}

              matches.sort(
                  key=lambda item:
                      item[0].stat().st_mtime,
                  reverse=True
              )

              return matches[0]

          # ============================================================
          # Discover upstream cognitive states
          # ============================================================

          act28_path, act28 = find_act_file(
              "ACT28",
              [
                  "nox_act_28_prediction_simulation.json"
              ]
          )

          act30_path, act30 = find_act_file(
              "ACT30",
              [
                  "nox_act_30_adaptive_strategy_selection.json"
              ]
          )

          act31_path, act31 = find_act_file(
              "ACT31",
              [
                  "nox_act_31_strategy_evaluation.json"
              ]
          )

          act32_path, act32 = find_act_file(
              "ACT32",
              [
                  "nox_act_32_experiment_designer.json"
              ]
          )

          act33_path, act33 = find_act_file(
              "ACT33",
              [
                  "nox_act_33_resource_allocation.json"
              ]
          )

          act34_path, act34 = find_act_file(
              "ACT34",
              [
                  "nox_act_34_goal_formation.json"
              ]
          )

          act35_path, act35 = find_act_file(
              "ACT35",
              [
                  "nox_act_35_self_improvement_loop.json"
              ]
          )

          act37_path, act37 = find_act_file(
              "ACT37",
              [
                  "nox_act_37_cognitive_signal_reliability.json"
              ]
          )

          act38_path, act38 = find_act_file(
              "ACT38",
              [
                  "nox_act_38_evidence_fusion.json"
              ]
          )

          act39_path, act39 = find_act_file(
              "ACT39",
              [
                  "nox_act_39_confidence_calibration.json"
              ]
          )

          act40_path, act40 = find_act_file(
              "ACT40",
              [
                  "nox_act_40_action_selection.json"
              ]
          )

          # ============================================================
          # Source collection
          # ============================================================

          sources = {
              "ACT28": act28,
              "ACT30": act30,
              "ACT31": act31,
              "ACT32": act32,
              "ACT33": act33,
              "ACT34": act34,
              "ACT35": act35,
              "ACT37": act37,
              "ACT38": act38,
              "ACT39": act39,
              "ACT40": act40
          }

          source_paths = {
              "ACT28": act28_path,
              "ACT30": act30_path,
              "ACT31": act31_path,
              "ACT32": act32_path,
              "ACT33": act33_path,
              "ACT34": act34_path,
              "ACT35": act35_path,
              "ACT37": act37_path,
              "ACT38": act38_path,
              "ACT39": act39_path,
              "ACT40": act40_path
          }

          # ============================================================
          # Extract ACT40 selection
          # ============================================================

          selection = (
              act40.get("selection", {})
              if isinstance(act40, dict)
              else {}
          )

          selected_action_id = (
              act40.get(
                  "selected_action_id"
              )
              or selection.get(
                  "selected_action_id"
              )
              or "A01"
          )

          selected_action = (
              act40.get(
                  "selected_action"
              )
              or selection.get(
                  "selected_action"
              )
              or "Collect real prediction outcomes"
          )

          selected_action_type = (
              act40.get(
                  "selected_action_type"
              )
              or selection.get(
                  "selected_action_type"
              )
              or "evidence_generation"
          )

          selection_score = numeric(
              act40.get(
                  "selected_action_score"
              ),
              numeric(
                  selection.get(
                      "selection_score"
                  ),
                  0.0
              )
          )

          decision_confidence = numeric(
              act40.get(
                  "decision_confidence"
              ),
              numeric(
                  selection.get(
                      "decision_confidence"
                  ),
                  0.0
              )
          )

          decision_ceiling = numeric(
              act40.get(
                  "decision_confidence_ceiling"
              ),
              0.0
          )

          execution_permission = bool(
              act40.get(
                  "execution_permission",
                  False
              )
          )

          # ============================================================
          # Extract prediction state
          # ============================================================

          prediction_count = numeric(
              act28.get(
                  "prediction_count"
              ),
              numeric(
                  act28.get(
                      "metrics",
                      {}
                  ).get(
                      "prediction_count"
                  ),
                  0.0
              )
          )

          active_predictions = act28.get(
              "predictions",
              []
          )

          if not isinstance(
              active_predictions,
              list
          ):
              active_predictions = []

          selected_experiment = (
              act40.get(
                  "selected_experiment",
                  {}
              )
              if isinstance(
                  act40.get(
                      "selected_experiment",
                      {}
                  ),
                  dict
              )
              else {}
          )

          experiment_id = (
              selected_experiment.get(
                  "experiment_id"
              )
              or "EXP003"
          )

          prediction_id = (
              selected_experiment.get(
                  "prediction_id"
              )
              or "P003"
          )

          experiment_question = (
              selected_experiment.get(
                  "question"
              )
              or
              "When a task is judged relevant, "
              "does it actually create a useful "
              "action opportunity for NØX?"
          )

          # ============================================================
          # Extract available outcome evidence
          #
          # ACT41 does NOT invent outcomes.
          # Missing real-world observations remain missing.
          # ============================================================

          observed_outcomes = numeric(
              act40.get(
                  "observed_outcomes"
              ),
              0.0
          )

          comparable_outcomes = numeric(
              act40.get(
                  "comparable_outcomes"
              ),
              0.0
          )

          historical_outcomes = numeric(
              act39.get(
                  "observed_outcomes"
              ),
              observed_outcomes
          )

          historical_comparable = numeric(
              act39.get(
                  "comparable_outcomes"
              ),
              comparable_outcomes
          )

          if historical_outcomes > observed_outcomes:
              observed_outcomes = historical_outcomes

          if historical_comparable > comparable_outcomes:
              comparable_outcomes = historical_comparable

          # ============================================================
          # Extract expected result information
          # ============================================================

          expected_result = {
              "experiment_id": experiment_id,
              "prediction_id": prediction_id,
              "question": experiment_question,
              "expected_observation": (
                  "The selected action should generate "
                  "an observable result that can be compared "
                  "with the prediction or hypothesis that "
                  "motivated the action."
              )
          }

          # ============================================================
          # Determine actual evidence availability
          # ============================================================

          if comparable_outcomes > 0:
              outcome_state = "observable_evidence_available"

          elif observed_outcomes > 0:
              outcome_state = "partial_observation_available"

          else:
              outcome_state = "no_real_outcome_observed"

          # ============================================================
          # Outcome comparison
          #
          # No invented success.
          # No invented failure.
          # No assumption that execution occurred.
          # ============================================================

          if execution_permission is False:
              execution_state = (
                  "not_executed_by_ACT40"
              )
          else:
              execution_state = (
                  "execution_permission_present"
              )

          if outcome_state == "no_real_outcome_observed":

              outcome_comparison = (
                  "No real-world outcome is currently "
                  "available. The expected result cannot "
                  "yet be compared with an observed result."
              )

              result_status = "pending_evidence"

              outcome_quality = 0.0

              learning_signal = (
                  "NØX learned that action selection alone "
                  "does not produce outcome evidence. "
                  "A future observable result is required "
                  "before the action can be evaluated."
              )

          elif outcome_state == "partial_observation_available":

              outcome_comparison = (
                  "Some observations exist, but the evidence "
                  "is insufficient for a strong comparison "
                  "between expected and actual outcomes."
              )

              result_status = "partially_observed"

              outcome_quality = min(
                  50.0,
                  observed_outcomes * 10.0
              )

              learning_signal = (
                  "NØX has partial outcome evidence, but "
                  "should avoid treating it as a confirmed "
                  "evaluation until comparable evidence grows."
              )

          else:

              outcome_comparison = (
                  "Comparable real-world outcomes are available "
                  "for evaluating whether the action produced "
                  "the expected result."
              )

              result_status = "evaluatable"

              outcome_quality = min(
                  100.0,
                  comparable_outcomes * 10.0
              )

              learning_signal = (
                  "NØX can begin comparing selected actions "
                  "with their observed outcomes and use the "
                  "difference to improve future action selection."
              )

          # ============================================================
          # Prediction comparison
          #
          # ACT41 only records a comparison when real evidence
          # exists. It never fabricates a prediction accuracy.
          # ============================================================

          prediction_comparison = {
              "prediction_id": prediction_id,
              "prediction_found": bool(
                  active_predictions
              ),
              "prediction_outcome_available": (
                  comparable_outcomes > 0
              ),
              "prediction_accuracy_evaluable": (
                  comparable_outcomes > 0
              ),
              "prediction_accuracy": None
          }

          if comparable_outcomes > 0:

              # Conservative placeholder for future empirical
              # measurement. ACT41 records evaluability without
              # inventing accuracy.
              prediction_comparison[
                  "prediction_accuracy"
              ] = None

          # ============================================================
          # Action effectiveness
          # ============================================================

          if result_status == "evaluatable":

              action_effectiveness = (
                  "evaluatable_but_not_scored"
              )

              effectiveness_score = None

          elif result_status == "partially_observed":

              action_effectiveness = (
                  "partially_evaluable"
              )

              effectiveness_score = None

          else:

              action_effectiveness = (
                  "not_yet_evaluable"
              )

              effectiveness_score = None

          # ============================================================
          # Learning value
          #
          # The most important learning at ACT41 is whether
          # NØX has enough evidence to judge its previous choice.
          # ============================================================

          if result_status == "evaluatable":

              learning_readiness = 100.0

          elif result_status == "partially_observed":

              learning_readiness = 50.0

          else:

              learning_readiness = 0.0

          # ============================================================
          # Selection quality
          #
          # ACT41 separates:
          # - quality of the selection
          # - quality of the outcome evidence
          # - actual effectiveness
          #
          # A good selection cannot be declared successful
          # simply because it had a high ACT40 score.
          # ============================================================

          selection_quality = min(
              100.0,
              max(
                  0.0,
                  selection_score
              )
          )

          if result_status == "evaluatable":

              selection_evaluation_status = (
                  "ready_for_empirical_evaluation"
              )

          elif result_status == "partially_observed":

              selection_evaluation_status = (
                  "partially_supported"
              )

          else:

              selection_evaluation_status = (
                  "not_yet_evaluable"
              )

          # ============================================================
          # Decision learning
          # ============================================================

          if result_status == "evaluatable":

              decision_learning = {
                  "available": True,
                  "type": "empirical_feedback",
                  "message": (
                      "The selected action can now be compared "
                      "against observed outcomes. ACT42 can use "
                      "this evidence to update action-selection "
                      "preferences."
                  )
              }

          else:

              decision_learning = {
                  "available": False,
                  "type": "evidence_gap",
                  "message": (
                      "There is not yet enough real-world "
                      "outcome evidence to determine whether "
                      "the selected action was effective."
                  )
              }

          # ============================================================
          # Counterfactual awareness
          #
          # ACT41 does not claim that another action would have
          # produced a better result without evidence.
          # ============================================================

          counterfactual_status = (
              "not_evaluable_without_comparable_actions"
          )

          # ============================================================
          # Confidence update
          #
          # ACT41 cannot arbitrarily increase confidence.
          # Confidence remains constrained by ACT39/ACT40.
          # ============================================================

          if result_status == "evaluatable":

              confidence_update_status = (
                  "eligible_for_future_recalibration"
              )

          elif result_status == "partially_observed":

              confidence_update_status = (
                  "insufficient_evidence_for_recalibration"
              )

          else:

              confidence_update_status = (
                  "no_update"
              )

          # ============================================================
          # Action memory
          # ============================================================

          action_memory = {
              "action_id": selected_action_id,
              "action": selected_action,
              "action_type": selected_action_type,
              "selection_score": selection_score,
              "selection_confidence": decision_confidence,
              "execution_permission": execution_permission,
              "execution_state": execution_state,
              "expected_result": expected_result,
              "outcome_state": outcome_state,
              "result_status": result_status,
              "outcome_quality": round(
                  outcome_quality,
                  2
              ),
              "learning_readiness": round(
                  learning_readiness,
                  2
              ),
              "action_effectiveness": (
                  action_effectiveness
              ),
              "effectiveness_score": (
                  effectiveness_score
              )
          }

          # ============================================================
          # Cognitive learning
          # ============================================================

          cognitive_learning = {
              "what_was_expected": (
                  expected_result[
                      "expected_observation"
                  ]
              ),
              "what_was_observed": (
                  "No real-world outcome available."
                  if outcome_state
                  == "no_real_outcome_observed"
                  else
                  "Real-world observation evidence exists."
              ),
              "comparison_possible": (
                  result_status == "evaluatable"
              ),
              "learning_signal": learning_signal,
              "future_use": (
                  "Use outcome evidence to improve the "
                  "ranking of future action candidates."
              )
          }

          # ============================================================
          # Safety boundaries
          # ============================================================

          financial_permission = False
          payment_permission = False
          spending_permission = False
          execution_authorization = False

          # ============================================================
          # Source validation
          # ============================================================

          source_states = {
              key: source_paths[key] is not None
              for key in source_paths
          }

          source_completeness = (
              sum(
                  1
                  for value in source_states.values()
                  if value
              )
              / len(source_states)
              * 100.0
          )

          # ACT40 is the critical direct predecessor.
          act40_available = (
              act40_path is not None
          )

          # ============================================================
          # Validation
          # ============================================================

          validation = {
              "act40_present": (
                  act40_available
              ),

              "selected_action_present": (
                  bool(selected_action_id)
              ),

              "expected_result_present": (
                  bool(
                      expected_result.get(
                          "expected_observation"
                      )
                  )
              ),

              "outcome_state_present": (
                  outcome_state in [
                      "no_real_outcome_observed",
                      "partial_observation_available",
                      "observable_evidence_available"
                  ]
              ),

              "no_outcome_invented": (
                  (
                      outcome_state
                      == "no_real_outcome_observed"
                  )
                  and
                  (
                      result_status
                      == "pending_evidence"
                  )
                  or
                  (
                      outcome_state
                      != "no_real_outcome_observed"
                  )
              ),

              "prediction_accuracy_not_fabricated": (
                  prediction_comparison[
                      "prediction_accuracy"
                  ] is None
              ),

              "effectiveness_not_fabricated": (
                  effectiveness_score is None
              ),

              "execution_not_authorized": (
                  execution_authorization is False
              ),

              "financial_permission_false": (
                  financial_permission is False
              ),

              "payment_permission_false": (
                  payment_permission is False
              ),

              "spending_permission_false": (
                  spending_permission is False
              ),

              "confidence_not_increased_without_evidence": (
                  confidence_update_status
                  != "confidence_increased"
              ),

              "gemini_false": True,

              "cost_zero": True
          }

          # ============================================================
          # Result
          # ============================================================

          result = {
              "act": "ACT41",
              "version": "V1",
              "name": "Action Outcome Evaluation",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Evaluate whether a selected action has "
                  "produced an observable outcome, compare "
                  "expected and observed results, and convert "
                  "real-world evidence into learning for future "
                  "action selection."
              ),

              "cognitive_transition": (
                  "ACT41 moves NØX from selecting an action "
                  "to evaluating what happened after that "
                  "selection and determining whether the "
                  "experience contains usable learning."
              ),

              "principles": [
                  "Selection is not success.",
                  "Execution is not assumed.",
                  "Expected outcomes are not observed outcomes.",
                  "Missing evidence remains missing.",
                  "No prediction accuracy is fabricated.",
                  "No action effectiveness is fabricated.",
                  "Real outcomes are stronger than internal scores.",
                  "A high selection score does not prove a good action.",
                  "A failed outcome does not automatically prove a bad selection.",
                  "Comparable evidence is required for strong evaluation.",
                  "Counterfactual claims require comparable evidence.",
                  "Confidence cannot increase without supporting evidence.",
                  "Financial actions remain disabled.",
                  "No action may create spending authority.",
                  "No action may create payment authority.",
                  "No action may create Gemini authority."
              ],

              "source_acts": [
                  "ACT28",
                  "ACT30",
                  "ACT31",
                  "ACT32",
                  "ACT33",
                  "ACT34",
                  "ACT35",
                  "ACT37",
                  "ACT38",
                  "ACT39",
                  "ACT40"
              ],

              "source_files": {
                  key: (
                      str(source_paths[key])
                      if source_paths[key]
                      else None
                  )
                  for key in source_paths
              },

              "source_states": source_states,

              "source_completeness": round(
                  source_completeness,
                  2
              ),

              "selected_action": {
                  "action_id": selected_action_id,
                  "action": selected_action,
                  "action_type": selected_action_type,
                  "selection_score": selection_score,
                  "decision_confidence": decision_confidence,
                  "decision_confidence_ceiling": decision_ceiling
              },

              "expected_result": expected_result,

              "execution_state": {
                  "execution_permission": (
                      execution_permission
                  ),
                  "execution_authorization": (
                      execution_authorization
                  ),
                  "status": execution_state
              },

              "outcome_evaluation": {
                  "observed_outcomes": (
                      observed_outcomes
                  ),
                  "comparable_outcomes": (
                      comparable_outcomes
                  ),
                  "outcome_state": outcome_state,
                  "result_status": result_status,
                  "outcome_comparison": (
                      outcome_comparison
                  ),
                  "outcome_quality": round(
                      outcome_quality,
                      2
                  )
              },

              "prediction_comparison": (
                  prediction_comparison
              ),

              "action_effectiveness": {
                  "status": action_effectiveness,
                  "score": effectiveness_score,
                  "reason": (
                      "Effectiveness remains unscored until "
                      "real comparable outcome evidence exists."
                      if effectiveness_score is None
                      else
                      "Effectiveness can be evaluated from "
                      "comparable outcome evidence."
                  )
              },

              "selection_evaluation": {
                  "selection_quality": round(
                      selection_quality,
                      2
                  ),
                  "status": (
                      selection_evaluation_status
                  ),
                  "principle": (
                      "Selection quality and action effectiveness "
                      "must remain separate measurements."
                  )
              },

              "decision_learning": decision_learning,

              "cognitive_learning": cognitive_learning,

              "action_memory": action_memory,

              "counterfactual": {
                  "status": counterfactual_status,
                  "warning": (
                      "NØX must not claim that another action "
                      "would have produced a better outcome "
                      "without comparable evidence."
                  )
              },

              "confidence_update": {
                  "status": (
                      confidence_update_status
                  ),
                  "current_confidence": (
                      decision_confidence
                  ),
                  "current_ceiling": (
                      decision_ceiling
                  ),
                  "increase_allowed": False,
                  "reason": (
                      "ACT41 records evidence for future "
                      "recalibration but does not arbitrarily "
                      "increase decision confidence."
                  )
              },

              "autonomy_state": {
                  "status": "learning_only",
                  "action_selection": True,
                  "action_outcome_evaluation": True,
                  "action_execution": False,
                  "financial_actions": False,
                  "payments": False,
                  "spending": False,
                  "gemini": False
              },

              "financial_boundary": {
                  "financial_permission": (
                      financial_permission
                  ),
                  "payment_permission": (
                      payment_permission
                  ),
                  "spending_permission": (
                      spending_permission
                  ),
                  "financial_limit": 0.0
              },

              "next_action": (
                  "Accumulate real outcome evidence and "
                  "compare future action results against "
                  "their expected results."
              ),

              "next_cognitive_step": (
                  "ACT42 should learn which action choices "
                  "reliably produce useful outcomes and "
                  "adapt future action-selection preferences "
                  "from empirical evidence."
              ),

              "validation": validation
          }

          # ============================================================
          # Stable downstream aliases
          # ============================================================

          result["selected_action_id"] = (
              selected_action_id
          )

          result["selected_action"] = (
              selected_action
          )

          result["result_status"] = (
              result_status
          )

          result["outcome_state"] = (
              outcome_state
          )

          result["observed_outcomes"] = (
              observed_outcomes
          )

          result["comparable_outcomes"] = (
              comparable_outcomes
          )

          result["action_effectiveness"] = (
              action_effectiveness
          )

          result["effectiveness_score"] = (
              effectiveness_score
          )

          result["execution_authorization"] = False
          result["financial_permission"] = False
          result["payment_permission"] = False
          result["spending_permission"] = False

          # ============================================================
          # Write memory
          # ============================================================

          output_path = (
              MEMORY
              / "nox_act_41_action_outcome_evaluation.json"
          )

          write_json(
              output_path,
              result
          )

          # ============================================================
          # Console
          # ============================================================

          print("========================================")
          print("NØX ACT41 V1 - ACTION OUTCOME EVALUATION")
          print("========================================")
          print(
              f"Sources: "
              f"{source_completeness:.2f}%"
          )
          print("----------------------------------------")
          print(
              f"Selected action: "
              f"{selected_action_id} - "
              f"{selected_action}"
          )
          print(
              f"Selection score: "
              f"{selection_score}"
          )
          print(
              f"Decision confidence: "
              f"{decision_confidence}"
          )
          print("----------------------------------------")
          print(
              f"Observed outcomes: "
              f"{observed_outcomes}"
          )
          print(
              f"Comparable outcomes: "
              f"{comparable_outcomes}"
          )
          print(
              f"Outcome state: "
              f"{outcome_state}"
          )
          print(
              f"Result status: "
              f"{result_status}"
          )
          print(
              f"Outcome quality: "
              f"{outcome_quality}"
          )
          print("----------------------------------------")
          print(
              f"Action effectiveness: "
              f"{action_effectiveness}"
          )
          print(
              f"Effectiveness score: "
              f"{effectiveness_score}"
          )
          print(
              f"Learning readiness: "
              f"{learning_readiness}"
          )
          print("----------------------------------------")
          print(
              "Execution authorization: false"
          )
          print(
              "Financial permission: false"
          )
          print(
              "Payment permission: false"
          )
          print(
              "Spending permission: false"
          )
          print("----------------------------------------")
          print("Gemini used: false")
          print("Project cost: 0 EUR")
          print("----------------------------------------")

          failed = [
              key
              for key, value
              in validation.items()
              if not value
          ]

          if failed:

              print("VALIDATION FAILED:")

              for key in failed:
                  print(f" - {key}")

              raise SystemExit(1)

          print("VALIDATION PASSED")
          print(
              f"Memory written: {output_path}"
          )

          # ============================================================
          # Commit / push
          # ============================================================

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "NØX"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "nox@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              [
                  "git",
                  "add",
                  str(output_path)
              ],
              check=True
          )

          commit = subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "ACT41 V1 action outcome evaluation"
              ],
              text=True,
              capture_output=True
          )

          if commit.returncode != 0:
              print(commit.stdout)
              print(commit.stderr)

          pushed = False

          for attempt in range(3):

              try:

                  subprocess.run(
                      [
                          "git",
                          "fetch",
                          "origin",
                          "main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "rebase",
                          "origin/main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push",
                          "origin",
                          "HEAD:main"
                      ],
                      check=True
                  )

                  pushed = True
                  break

              except subprocess.CalledProcessError as exc:

                  print(
                      f"Push/rebase attempt "
                      f"{attempt + 1} failed: {exc}"
                  )

                  subprocess.run(
                      [
                          "git",
                          "rebase",
                          "--abort"
                      ],
                      check=False
                  )

          if not pushed:
              raise SystemExit(
                  "Unable to push ACT41 after 3 attempts."
              )

          print(
              "ACT41 V1 committed and pushed successfully."
          )
          PY
