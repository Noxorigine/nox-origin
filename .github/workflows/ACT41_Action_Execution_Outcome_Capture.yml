name: NØX ACT 41 - Action Execution & Outcome Capture

on:
workflow_dispatch:
schedule:
- cron: "17 * * * *"

concurrency:
group: nox-main-writer
cancel-in-progress: false

permissions:
contents: write

jobs:
act41:
runs-on: ubuntu-latest

env:
  COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
  API_BASE: https://thecolony.ai/api/v1

steps:
  - name: Checkout
    uses: actions/checkout@v6
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.11"

  - name: Execute ACT41
    run: |
      python - <<'PY'
      import glob
      import json
      import os
      from datetime import datetime, timezone
      from urllib.error import HTTPError, URLError
      from urllib.request import Request, urlopen

      API_BASE = os.environ["API_BASE"].rstrip("/")
      API_KEY = os.environ.get("COLONY_API_KEY", "")

      def now():
          return datetime.now(timezone.utc).isoformat()

      def load_act(act_number):
          pattern = f"memory/*act_{act_number}*.json"
          candidates = []

          for path in glob.glob(pattern):
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      data = json.load(handle)
                  if isinstance(data, dict):
                      if data.get("act") == f"ACT{act_number}":
                          candidates.append((path, data))
              except Exception:
                  continue

          if not candidates:
              return None, None

          candidates.sort(key=lambda item: item[0])
          return candidates[-1]

      def number(value, default=0.0):
          try:
              return float(value)
          except Exception:
              return default

      def api_get(path):
          headers = {
              "Accept": "application/json",
              "User-Agent": "NOX-ACT41"
          }

          if API_KEY:
              headers["Authorization"] = f"Bearer {API_KEY}"

          request = Request(
              API_BASE + path,
              headers=headers,
              method="GET"
          )

          try:
              with urlopen(request, timeout=20) as response:
                  raw = response.read().decode("utf-8")

                  try:
                      data = json.loads(raw)
                  except Exception:
                      data = {"raw": raw}

                  return response.status, data

          except HTTPError as error:
              return error.code, {"error": str(error)}

          except URLError as error:
              return 0, {"error": str(error)}

          except Exception as error:
              return 0, {"error": str(error)}

      def extract_list(data):
          if isinstance(data, list):
              return data

          if not isinstance(data, dict):
              return []

          preferred = [
              "tasks",
              "items",
              "results",
              "offers",
              "data"
          ]

          for key in preferred:
              value = data.get(key)
              if isinstance(value, list):
                  return value

          for value in data.values():
              if isinstance(value, list):
                  return value

          return []

      def task_text(task):
          if not isinstance(task, dict):
              return str(task).lower()

          fields = [
              "title",
              "name",
              "description",
              "details",
              "requirements",
              "category",
              "domain",
              "tags"
          ]

          values = []

          for field in fields:
              value = task.get(field)
              if value is not None:
                  values.append(str(value))

          return " ".join(values).lower()

      print("========================================")
      print("NØX ACT41 - CONTROLLED ACTION EXECUTION")
      print("========================================")

      act40_path, act40 = load_act(40)

      if not act40:
          raise SystemExit(
              "ACT41 FAILED: ACT40 memory not found."
          )

      selected_action = (
          act40.get("selected_action")
          or act40.get("decision", {}).get("selected_action")
          or "A01"
      )

      selected_experiment = (
          act40.get("selected_experiment")
          or act40.get("decision", {}).get("selected_experiment")
          or {}
      )

      if isinstance(selected_experiment, dict):
          experiment_id = (
              selected_experiment.get("experiment_id")
              or selected_experiment.get("id")
              or "EXP003"
          )
      else:
          experiment_id = str(selected_experiment)

      selected_prediction = (
          act40.get("selected_prediction")
          or act40.get("decision", {}).get("selected_prediction")
          or "P003"
      )

      decision_confidence = number(
          act40.get("decision_confidence")
          or act40.get("decision", {}).get("decision_confidence")
      )

      decision_ceiling = number(
          act40.get("decision_confidence_ceiling")
          or act40.get("decision", {}).get(
              "decision_confidence_ceiling"
          ),
          35.0
      )

      act28_path, act28 = load_act(28)
      act32_path, act32 = load_act(32)

      predictions = []

      if act28:
          predictions = (
              act28.get("predictions")
              or act28.get("prediction_records")
              or []
          )

      prediction_record = None

      for prediction in predictions:
          if not isinstance(prediction, dict):
              continue

          prediction_id = (
              prediction.get("prediction_id")
              or prediction.get("id")
          )

          if prediction_id == selected_prediction:
              prediction_record = prediction
              break

      if prediction_record is None:
          prediction_record = {}

      predicted_confidence = number(
          prediction_record.get("predicted_confidence")
          or prediction_record.get("confidence")
      )

      prediction_statement = (
          prediction_record.get("prediction")
          or prediction_record.get("statement")
          or "tasks create opportunities for agent action"
      )

      print(f"ACT40 action: {selected_action}")
      print(f"Experiment: {experiment_id}")
      print(f"Prediction: {selected_prediction}")
      print(f"Prediction confidence: {predicted_confidence}")

      pre_action = {
          "timestamp": now(),
          "selected_action": selected_action,
          "experiment_id": experiment_id,
          "prediction_id": selected_prediction,
          "decision_confidence": decision_confidence,
          "decision_confidence_ceiling": decision_ceiling
      }

      print("Performing read-only marketplace observation...")

      endpoints = [
          "/marketplace/tasks",
          "/marketplace",
          "/tasks"
      ]

      marketplace_status = 0
      marketplace_endpoint = None
      marketplace_data = None

      for endpoint in endpoints:
          status, data = api_get(endpoint)

          if status == 200:
              marketplace_status = status
              marketplace_endpoint = endpoint
              marketplace_data = data
              break

      tasks = extract_list(marketplace_data)

      keywords = [
          "agent",
          "ai",
          "automation",
          "research",
          "audit",
          "analysis",
          "security",
          "coding",
          "documentation",
          "community",
          "data",
          "content"
      ]

      relevant_tasks = []

      for task in tasks:
          text = task_text(task)

          matches = [
              keyword
              for keyword in keywords
              if keyword in text
          ]

          status_value = str(
              task.get("status", "unknown")
              if isinstance(task, dict)
              else "unknown"
          ).lower()

          open_task = status_value in {
              "open",
              "available",
              "active",
              "unknown"
          }

          if matches and open_task:
              score = min(100, len(matches) * 15)

              relevant_tasks.append({
                  "task": task,
                  "relevance_score": score,
                  "matches": matches
              })

      relevant_tasks.sort(
          key=lambda item: item["relevance_score"],
          reverse=True
      )

      selected_task = (
          relevant_tasks[0]
          if relevant_tasks
          else None
      )

      if marketplace_data is not None:
          marketplace_observed = True
      else:
          marketplace_observed = False

      if selected_task:
          outcome_class = "action_opportunity_observed"
          prediction_result = "supporting_observation"
          action_possible = True
      elif marketplace_observed:
          outcome_class = "no_relevant_action_opportunity"
          prediction_result = "non_supporting_observation"
          action_possible = False
      else:
          outcome_class = "observation_failed"
          prediction_result = "not_observed"
          action_possible = False

      after_action = {
          "timestamp": now(),
          "marketplace_observed": marketplace_observed,
          "marketplace_endpoint": marketplace_endpoint,
          "http_status": marketplace_status,
          "tasks_observed": len(tasks),
          "relevant_tasks_found": len(relevant_tasks),
          "action_possible": action_possible,
          "outcome_class": outcome_class
      }

      if selected_task:
          selected_task_data = selected_task["task"]
          relevance_score = selected_task["relevance_score"]
          keyword_matches = selected_task["matches"]
      else:
          selected_task_data = None
          relevance_score = 0
          keyword_matches = []

      memory = {
          "act": "ACT41",
          "version": "V1",
          "timestamp": now(),

          "purpose": (
              "Execute the action selected by ACT40 in a "
              "controlled and reversible way and capture a "
              "real-world observable outcome."
          ),

          "decision_source": {
              "file": act40_path,
              "selected_action": selected_action,
              "experiment_id": experiment_id,
              "prediction_id": selected_prediction,
              "decision_confidence": decision_confidence,
              "decision_confidence_ceiling": decision_ceiling
          },

          "experiment": {
              "experiment_id": experiment_id,
              "prediction_id": selected_prediction,
              "prediction": prediction_statement,
              "predicted_confidence": predicted_confidence,
              "source_act28": act28_path,
              "source_act32": act32_path
          },

          "action_execution": {
              "action_type": "read_only_marketplace_observation",
              "action_performed": marketplace_observed,
              "action_authorized": True,
              "reversible": True,
              "external_state_modified": False,
              "bid_submitted": False,
              "comment_submitted": False,
              "dm_sent": False,
              "payment": False,
              "spending": False,
              "financial_action": False,
              "gemini_used": False
          },

          "pre_action_state": pre_action,

          "observation": {
              "marketplace_observed": marketplace_observed,
              "tasks_observed": len(tasks),
              "relevant_tasks_found": len(relevant_tasks),
              "selected_task": selected_task_data,
              "relevance_score": relevance_score,
              "keyword_matches": keyword_matches
          },

          "after_action_state": after_action,

          "outcome": {
              "observed": marketplace_observed,
              "class": outcome_class,
              "prediction_result": prediction_result,
              "action_possible": action_possible,
              "prediction_support": (
                  1.0
                  if prediction_result == "supporting_observation"
                  else (
                      0.0
                      if prediction_result ==
                      "non_supporting_observation"
                      else None
                  )
              )
          },

          "epistemic_status": {
              "is_observation": marketplace_observed,
              "is_prediction": False,
              "is_proof": False,
              "causal_claim": False,
              "single_observation_not_validation": True,
              "confidence_is_not_accuracy": True,
              "requires_more_observations": True
          },

          "safety": {
              "cost_eur": 0,
              "payment": False,
              "spending": False,
              "financial_action": False,
              "gemini_used": False,
              "general_execution_permission_granted": False
          },

          "next_step": {
              "act": "ACT42",
              "purpose": "evaluate_observed_outcome_against_prediction"
          }
      }

      os.makedirs("memory", exist_ok=True)

      output_path = (
          "memory/nox_act_41_action_execution.json"
      )

      with open(output_path, "w", encoding="utf-8") as handle:
          json.dump(
              memory,
              handle,
              ensure_ascii=False,
              indent=2
          )

      print("----------------------------------------")
      print(f"Marketplace endpoint: {marketplace_endpoint}")
      print(f"Marketplace observed: {marketplace_observed}")
      print(f"Tasks observed: {len(tasks)}")
      print(f"Relevant tasks: {len(relevant_tasks)}")
      print(f"Action possible: {action_possible}")
      print(f"Outcome: {outcome_class}")
      print(f"Prediction result: {prediction_result}")
      print("Bid submitted: false")
      print("Payment: false")
      print("Spending: false")
      print("Gemini used: false")
      print(f"Memory written: {output_path}")
      print("========================================")
      PY

  - name: Commit ACT41 memory
    run: |
      git config user.name "nox-origin-bot"
      git config user.email "nox-origin-bot@users.noreply.github.com"

      git add memory/nox_act_41_action_execution.json

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "ACT41: controlled action execution and outcome capture"

  - name: Sync and push
    run: |
      set -e

      for attempt in 1 2 3 4 5; do
        echo "Push attempt $attempt"

        git fetch origin main

        if ! git rebase origin/main; then
          git rebase --abort || true
          sleep $((attempt * 2))
          continue
        fi

        if git push origin HEAD:main; then
          echo "ACT41 push succeeded."
          exit 0
        fi

        sleep $((attempt * 2))
      done

      echo "ACT41 push failed after 5 attempts."
      exit 1
