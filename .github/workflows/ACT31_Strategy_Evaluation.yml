name: NØX ACT31 - Strategy Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  strategy-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Evaluate ACT30 strategy
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          def load_json(path):
              try:
                  if path.exists():
                      with path.open("r", encoding="utf-8") as f:
                          return json.load(f)
              except Exception as exc:
                  print(f"WARNING: unable to read {path}: {exc}")
              return {}

          def num(value, default=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return default

          def normalize_text(value):
              if value is None:
                  return ""
              return str(value).strip().lower()

          act30 = load_json(
              MEMORY / "nox_act_30_adaptive_strategy_selection.json"
          )
          act29 = load_json(
              MEMORY / "nox_act_29_metacognition.json"
          )
          act28 = load_json(
              MEMORY / "nox_act_28_anticipation_simulation.json"
          )
          act27 = load_json(
              MEMORY / "nox_act_27_relational_understanding.json"
          )
          act26 = load_json(
              MEMORY / "nox_act_26_active_attention.json"
          )

          timestamp = datetime.now(timezone.utc).isoformat()

          preferred_strategy = (
              act30.get("preferred_strategy")
              or act30.get("selected_strategy")
              or act30.get("strategy")
              or ""
          )

          preferred_strategy = normalize_text(preferred_strategy)

          if isinstance(preferred_strategy, dict):
              preferred_strategy = normalize_text(
                  preferred_strategy.get("id")
                  or preferred_strategy.get("name")
                  or ""
              )

          # ------------------------------------------------------------
          # ACT31 PRINCIPLE
          # ------------------------------------------------------------
          #
          # ACT31 must NEVER manufacture an observed outcome.
          #
          # A strategy is evaluated from:
          #   1. expected outcomes recorded by ACT30/ACT28
          #   2. actual outcomes explicitly available in memory
          #   3. evidence quality
          #
          # If actual outcomes do not exist, the result is INCONCLUSIVE.
          # ------------------------------------------------------------

          expected_outcomes = []

          # ACT30 may contain explicit expected outcomes.
          for key in (
              "expected_outcomes",
              "success_conditions",
              "evaluation_targets",
              "metrics",
          ):
              value = act30.get(key)
              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, dict):
                          expected_outcomes.append(item)
                      else:
                          expected_outcomes.append(
                              {"description": str(item)}
                          )

          # ACT28 verification targets are useful expected targets.
          verification_targets = act28.get("verification_targets", [])
          if isinstance(verification_targets, list):
              for target in verification_targets:
                  if isinstance(target, dict):
                      expected_outcomes.append({
                          "source": "ACT28",
                          **target
                      })

          # Remove duplicates using a stable representation.
          unique_expected = []
          seen_expected = set()

          for item in expected_outcomes:
              key = json.dumps(item, sort_keys=True, ensure_ascii=False)
              if key not in seen_expected:
                  seen_expected.add(key)
                  unique_expected.append(item)

          expected_outcomes = unique_expected

          # ------------------------------------------------------------
          # ACTUAL OUTCOME DISCOVERY
          # ------------------------------------------------------------
          #
          # Only explicitly recorded outcome fields qualify as observations.
          # Predictions, hypotheses, scenarios and confidence values are NOT
          # treated as actual outcomes.
          # ------------------------------------------------------------

          outcome_sources = [
              ("ACT30", act30),
              ("ACT29", act29),
              ("ACT28", act28),
              ("ACT27", act27),
              ("ACT26", act26),
          ]

          observed_outcomes = []

          explicit_keys = {
              "observed_outcomes",
              "actual_outcomes",
              "results_observed",
              "strategy_results",
              "execution_results",
              "experiment_results",
              "outcome_observations",
          }

          for source_name, data in outcome_sources:
              if not isinstance(data, dict):
                  continue

              for key in explicit_keys:
                  value = data.get(key)

                  if isinstance(value, list):
                      for item in value:
                          if isinstance(item, dict):
                              observed_outcomes.append({
                                  "source": source_name,
                                  "field": key,
                                  **item
                              })
                          else:
                              observed_outcomes.append({
                                  "source": source_name,
                                  "field": key,
                                  "observation": str(item)
                              })

                  elif isinstance(value, dict):
                      observed_outcomes.append({
                          "source": source_name,
                          "field": key,
                          **value
                      })

          # ACT31 deliberately ignores predictions as observations.
          predictions_present = isinstance(
              act28.get("predictions"), list
          )

          scenarios_present = isinstance(
              act28.get("scenarios"), list
          )

          # ------------------------------------------------------------
          # STRATEGY-SPECIFIC EVALUATION
          # ------------------------------------------------------------

          strategy_profiles = {
              "verify_predictions": {
                  "required_evidence": [
                      "prediction_outcome_pairs",
                      "observed_prediction_accuracy",
                      "repeated_outcomes",
                  ],
                  "success_signals": [
                      "prediction accuracy can be measured",
                      "actual outcomes are repeatedly observed",
                      "prediction error can be compared over time",
                  ],
              },
              "calibrate_confidence": {
                  "required_evidence": [
                      "prediction_outcomes",
                      "confidence_vs_accuracy",
                      "repeated_prediction_results",
                  ],
                  "success_signals": [
                      "confidence can be compared with accuracy",
                      "overconfidence can be detected",
                      "confidence adjustment can be measured",
                  ],
              },
              "deepen_relationship_models": {
                  "required_evidence": [
                      "relationship_outcomes",
                      "independent observations",
                  ],
                  "success_signals": [
                      "relationships receive outcome support",
                      "unsupported relationships are weakened",
                  ],
              },
              "expand_active_attention": {
                  "required_evidence": [
                      "attention_selection_outcomes",
                      "value_of_attended_items",
                  ],
                  "success_signals": [
                      "attention choices produce measurable value",
                      "selection quality improves",
                  ],
              },
              "seek_actionable_opportunities": {
                  "required_evidence": [
                      "opportunity_outcomes",
                      "action_results",
                  ],
                  "success_signals": [
                      "selected opportunities produce useful results",
                      "action quality improves",
                  ],
              },
          }

          profile = strategy_profiles.get(
              preferred_strategy,
              {
                  "required_evidence": [],
                  "success_signals": [],
              }
          )

          # ------------------------------------------------------------
          # EVIDENCE ASSESSMENT
          # ------------------------------------------------------------

          actual_count = len(observed_outcomes)
          expected_count = len(expected_outcomes)

          evidence_quality = 0.0

          if actual_count > 0:
              evidence_quality += 40.0

          if expected_count > 0:
              evidence_quality += 20.0

          if predictions_present:
              evidence_quality += 10.0

          if scenarios_present:
              evidence_quality += 5.0

          if act29:
              evidence_quality += 10.0

          if act27:
              evidence_quality += 5.0

          if act26:
              evidence_quality += 5.0

          evidence_quality = min(100.0, evidence_quality)

          # ------------------------------------------------------------
          # OUTCOME CLASSIFICATION
          # ------------------------------------------------------------

          if actual_count == 0:
              evaluation_status = "inconclusive"
              strategy_state = "needs_more_evidence"

              result_summary = (
                  "No explicit real-world outcome has yet been recorded "
                  "for the selected strategy. ACT31 cannot validate or "
                  "weaken the strategy from predictions alone."
              )

          else:
              # Current implementation remains conservative:
              # observations exist, but ACT31 only validates when they
              # explicitly contain evaluable comparison information.
              comparable = 0

              for outcome in observed_outcomes:
                  keys = {normalize_text(k) for k in outcome.keys()}

                  has_expected = bool(
                      {"expected", "expected_value", "expected_outcome"}
                      & keys
                  )

                  has_actual = bool(
                      {"actual", "actual_value", "actual_outcome",
                       "observed", "observed_value"}
                      & keys
                  )

                  if has_expected and has_actual:
                      comparable += 1

              if comparable == 0:
                  evaluation_status = "inconclusive"
                  strategy_state = "needs_more_evidence"

                  result_summary = (
                      "Outcome observations exist, but they do not yet "
                      "contain enough explicit expected-versus-actual "
                      "information to evaluate strategy performance."
                  )

              else:
                  evaluation_status = "evaluated"

                  # Explicit comparison evidence exists.
                  positive = 0
                  negative = 0

                  for outcome in observed_outcomes:
                      status = normalize_text(
                          outcome.get("status")
                          or outcome.get("result")
                          or outcome.get("evaluation")
                          or ""
                      )

                      if status in {
                          "success",
                          "validated",
                          "positive",
                          "improved",
                          "met",
                      }:
                          positive += 1

                      if status in {
                          "failure",
                          "weakened",
                          "negative",
                          "declined",
                          "missed",
                      }:
                          negative += 1

                  if positive > negative and positive > 0:
                      strategy_state = "validated"
                      result_summary = (
                          "Observed outcomes provide more positive than "
                          "negative evidence for the selected strategy."
                      )

                  elif negative > positive:
                      strategy_state = "weakened"
                      result_summary = (
                          "Observed outcomes provide more negative than "
                          "positive evidence for the selected strategy."
                      )

                  else:
                      strategy_state = "inconclusive"
                      result_summary = (
                          "Observed outcomes exist, but they do not yet "
                          "establish a sufficiently clear advantage."
                      )

          # ------------------------------------------------------------
          # EXPECTED / ACTUAL GAP
          # ------------------------------------------------------------

          measurable_gaps = []

          for outcome in observed_outcomes:
              expected = (
                  outcome.get("expected")
                  if isinstance(outcome, dict)
                  else None
              )

              actual = (
                  outcome.get("actual")
                  if isinstance(outcome, dict)
                  else None
              )

              if expected is not None and actual is not None:
                  gap = None

                  if isinstance(expected, (int, float)) and isinstance(
                      actual, (int, float)
                  ):
                      gap = float(actual) - float(expected)

                  measurable_gaps.append({
                      "expected": expected,
                      "actual": actual,
                      "gap": gap,
                      "source": outcome.get("source"),
                  })

          # ------------------------------------------------------------
          # VALUE ASSESSMENT
          # ------------------------------------------------------------

          value_assessment = {
              "status": "not_yet_measurable",
              "reason": (
                  "Strategy value requires observed consequences and "
                  "cannot be inferred from confidence or predictions alone."
              ),
          }

          if strategy_state == "validated":
              value_assessment = {
                  "status": "positive_evidence",
                  "reason": (
                      "Observed results provide evidence that the strategy "
                      "can produce useful outcomes."
                  ),
              }

          elif strategy_state == "weakened":
              value_assessment = {
                  "status": "negative_evidence",
                  "reason": (
                      "Observed results provide evidence that the current "
                      "strategy may require modification."
                  ),
              }

          # ------------------------------------------------------------
          # WHAT NØX LEARNS
          # ------------------------------------------------------------

          lessons = []

          if actual_count == 0:
              lessons.append(
                  "A prediction is not an outcome."
              )
              lessons.append(
                  "A plausible strategy cannot be validated without observing its consequences."
              )
              lessons.append(
                  "The next useful step is to create or capture a real verification experience."
              )

          if expected_count > 0 and actual_count == 0:
              lessons.append(
                  "Expected outcomes can define what to measure before an action is taken."
              )

          if measurable_gaps:
              lessons.append(
                  "Expected-versus-actual gaps can be used to update future strategy selection."
              )

          if strategy_state == "validated":
              lessons.append(
                  "Strategies should gain weight only when observed evidence supports their expected value."
              )

          if strategy_state == "weakened":
              lessons.append(
                  "A weakened strategy should not remain preferred merely because it was previously selected."
              )

          if not lessons:
              lessons.append(
                  "More outcome evidence is required before learning from the strategy."
              )

          # ------------------------------------------------------------
          # FEEDBACK TO ACT30
          # ------------------------------------------------------------

          feedback = {
              "strategy": preferred_strategy,
              "evaluation_status": evaluation_status,
              "strategy_state": strategy_state,
              "should_remain_preferred": (
                  strategy_state == "validated"
              ),
              "requires_reselection": (
                  strategy_state == "weakened"
              ),
              "requires_more_evidence": (
                  strategy_state == "inconclusive"
                  or strategy_state == "needs_more_evidence"
              ),
          }

          next_action = (
              "collect_real_outcomes"
              if strategy_state in {
                  "inconclusive",
                  "needs_more_evidence",
              }
              else "return_to_ACT30_with_evidence"
          )

          if strategy_state == "weakened":
              next_action = "reconsider_strategy_in_ACT30"

          if strategy_state == "validated":
              next_action = "continue_and_compare_again"

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          memory = {
              "act": "ACT31",
              "name": "Strategy Evaluation",
              "timestamp": timestamp,
              "gemini_used": False,
              "project_cost_eur": 0,
              "purpose": (
                  "Evaluate whether the strategy selected by ACT30 "
                  "is supported, weakened, or not yet evaluable by observed outcomes."
              ),
              "principle": (
                  "Selection is not validation. NØX must compare expected "
                  "and observed consequences before treating a strategy as reliable."
              ),
              "source_act": "ACT30",
              "selected_strategy": preferred_strategy,
              "expected_outcomes": expected_outcomes,
              "expected_outcome_count": expected_count,
              "observed_outcomes": observed_outcomes,
              "observed_outcome_count": actual_count,
              "measurable_gaps": measurable_gaps,
              "evidence_quality": round(evidence_quality, 2),
              "evaluation_status": evaluation_status,
              "strategy_state": strategy_state,
              "result_summary": result_summary,
              "value_assessment": value_assessment,
              "lessons": lessons,
              "feedback_to_ACT30": feedback,
              "next_action": next_action,
              "epistemic_rules": [
                  "predictions_are_not_observations",
                  "scenarios_are_not_outcomes",
                  "confidence_is_not_accuracy",
                  "selection_is_not_validation",
                  "absence_of_outcomes_requires_inconclusive_status",
              ],
              "inputs": {
                  "ACT26_attention_items": len(
                      act26.get("attention_now", [])
                  ) if isinstance(act26.get("attention_now"), list) else 0,
                  "ACT27_relationships": num(
                      act27.get("relationships_found"), 0
                  ),
                  "ACT28_predictions": len(
                      act28.get("predictions", [])
                  ) if isinstance(act28.get("predictions"), list) else 0,
                  "ACT28_scenarios": len(
                      act28.get("scenarios", [])
                  ) if isinstance(act28.get("scenarios"), list) else 0,
                  "ACT29_self_awareness": num(
                      act29.get("self_awareness_score"), 0
                  ),
                  "ACT30_decision_confidence": num(
                      act30.get("decision_confidence"), 0
                  ),
              },
              "next_cognitive_step": (
                  "ACT32 should design controlled experiments that generate "
                  "the missing evidence needed to distinguish competing strategies."
              ),
          }

          output = MEMORY / "nox_act_31_strategy_evaluation.json"

          with output.open("w", encoding="utf-8") as f:
              json.dump(memory, f, indent=2, ensure_ascii=False)

          print("")
          print("========================================")
          print("NØX ACT31 - STRATEGY EVALUATION")
          print("========================================")
          print(f"Selected strategy: {preferred_strategy or 'UNKNOWN'}")
          print(f"Expected outcomes: {expected_count}")
          print(f"Observed outcomes: {actual_count}")
          print(f"Evidence quality: {evidence_quality:.2f}")
          print(f"Evaluation status: {evaluation_status}")
          print(f"Strategy state: {strategy_state}")
          print("")
          print("RESULT:")
          print(f"- {result_summary}")
          print("")
          print("VALUE:")
          print(f"- {value_assessment['status']}")
          print("")
          print("NEXT ACTION:")
          print(f"- {next_action}")
          print("")
          print("LESSONS:")
          for lesson in lessons:
              print(f"- {lesson}")
          print("")
          print(f"Memory written: {output}")
          print("ACT31 COMPLETE")
          PY

      - name: Commit ACT31 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_31_strategy_evaluation.json

          if git diff --cached --quiet; then
            echo "No ACT31 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT31 Strategy Evaluation"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --hard origin/main
              git add memory/nox_act_31_strategy_evaluation.json
              git commit -m "NØX ACT31 Strategy Evaluation" || true
            }

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep $((attempt * 3))
          done

          echo "ERROR: unable to push ACT31 after retries."
          exit 1
