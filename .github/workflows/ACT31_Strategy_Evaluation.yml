name: NØX ACT31 - Strategy Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  strategy-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Evaluate strategy
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          def load_json(path):
              try:
                  if not path.exists():
                      print(f"WARNING: missing memory file: {path}")
                      return {}
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"WARNING: unable to read {path}: {exc}")
                  return {}

          def as_number(value, default=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return default

          def as_list(value):
              return value if isinstance(value, list) else []

          def clean_text(value):
              return str(value).strip().lower() if value is not None else ""

          def extract_strategy(data):
              """
              ACT30 may store the selected strategy as:
              - a string
              - a dictionary
              - a Python-dict string from an earlier implementation
              """

              candidates = [
                  data.get("preferred_strategy"),
                  data.get("selected_strategy"),
                  data.get("strategy"),
              ]

              for candidate in candidates:
                  if isinstance(candidate, dict):
                      strategy = (
                          candidate.get("strategy")
                          or candidate.get("name")
                          or candidate.get("strategy_id")
                      )
                      if strategy:
                          return {
                              "strategy_id": candidate.get("strategy_id"),
                              "strategy": str(strategy),
                              "score": as_number(
                                  candidate.get("score")
                              ),
                              "decision_confidence": as_number(
                                  candidate.get("decision_confidence")
                              ),
                              "matched_needs": as_list(
                                  candidate.get("matched_needs")
                              ),
                              "reasons": as_list(
                                  candidate.get("reasons")
                              ),
                              "switch_conditions": as_list(
                                  candidate.get("switch_conditions")
                              ),
                          }

                  if isinstance(candidate, str):
                      text = candidate.strip()

                      if not text:
                          continue

                      # Normal string strategy.
                      known = [
                          "verify_predictions",
                          "calibrate_confidence",
                          "deepen_relationship_models",
                          "expand_active_attention",
                          "seek_actionable_opportunities",
                      ]

                      for name in known:
                          if name in text:
                              return {
                                  "strategy_id": None,
                                  "strategy": name,
                                  "score": 0.0,
                                  "decision_confidence": 0.0,
                                  "matched_needs": [],
                                  "reasons": [],
                                  "switch_conditions": [],
                              }

                      # Legacy Python-dict string.
                      try:
                          import ast

                          parsed = ast.literal_eval(text)

                          if isinstance(parsed, dict):
                              strategy = (
                                  parsed.get("strategy")
                                  or parsed.get("name")
                                  or parsed.get("strategy_id")
                              )

                              if strategy:
                                  return {
                                      "strategy_id": parsed.get(
                                          "strategy_id"
                                      ),
                                      "strategy": str(strategy),
                                      "score": as_number(
                                          parsed.get("score")
                                      ),
                                      "decision_confidence": as_number(
                                          parsed.get(
                                              "decision_confidence"
                                          )
                                      ),
                                      "matched_needs": as_list(
                                          parsed.get("matched_needs")
                                      ),
                                      "reasons": as_list(
                                          parsed.get("reasons")
                                      ),
                                      "switch_conditions": as_list(
                                          parsed.get(
                                              "switch_conditions"
                                          )
                                      ),
                                  }
                      except Exception:
                          pass

              return {
                  "strategy_id": None,
                  "strategy": "",
                  "score": 0.0,
                  "decision_confidence": 0.0,
                  "matched_needs": [],
                  "reasons": [],
                  "switch_conditions": [],
              }

          def find_numeric(data, keys, default=0.0):
              for key in keys:
                  if key in data:
                      value = data[key]
                      if isinstance(value, (int, float)):
                          return float(value)
              return default

          # ------------------------------------------------------------
          # LOAD PREVIOUS COGNITIVE MEMORY
          # ------------------------------------------------------------

          act26 = load_json(
              MEMORY / "nox_act_26_active_attention.json"
          )

          act27 = load_json(
              MEMORY / "nox_act_27_relational_understanding.json"
          )

          act28 = load_json(
              MEMORY / "nox_act_28_anticipation_simulation.json"
          )

          act29 = load_json(
              MEMORY / "nox_act_29_metacognition.json"
          )

          act30 = load_json(
              MEMORY / "nox_act_30_adaptive_strategy_selection.json"
          )

          timestamp = datetime.now(timezone.utc).isoformat()

          # ------------------------------------------------------------
          # MEMORY INTEGRITY
          # ------------------------------------------------------------

          memory_integrity = {
              "ACT26_loaded": bool(act26),
              "ACT27_loaded": bool(act27),
              "ACT28_loaded": bool(act28),
              "ACT29_loaded": bool(act29),
              "ACT30_loaded": bool(act30),
          }

          # ACT26 schema can contain attention_now, attention_items,
          # selected_items or monitored_items depending on version.
          attention_items = (
              act26.get("attention_now")
              if isinstance(act26.get("attention_now"), list)
              else act26.get("attention_items")
              if isinstance(act26.get("attention_items"), list)
              else act26.get("selected_items")
              if isinstance(act26.get("selected_items"), list)
              else []
          )

          monitored_items = (
              act26.get("monitor")
              if isinstance(act26.get("monitor"), list)
              else act26.get("monitored_items")
              if isinstance(act26.get("monitored_items"), list)
              else act26.get("monitoring")
              if isinstance(act26.get("monitoring"), list)
              else []
          )

          relationships_found = find_numeric(
              act27,
              [
                  "relationships_found",
                  "relationship_count",
              ],
              0.0,
          )

          predictions = as_list(act28.get("predictions"))
          scenarios = as_list(act28.get("scenarios"))
          verification_targets = as_list(
              act28.get("verification_targets")
          )

          self_awareness_score = find_numeric(
              act29,
              [
                  "self_awareness_score",
                  "self_awareness",
                  "score",
              ],
              0.0,
          )

          decision_confidence_from_act30 = find_numeric(
              act30,
              [
                  "decision_confidence",
                  "selected_decision_confidence",
              ],
              0.0,
          )

          strategy = extract_strategy(act30)

          # If the strategy extractor found the confidence inside the
          # strategy object, use it as the authoritative ACT30 value.
          if strategy["decision_confidence"] > 0:
              decision_confidence_from_act30 = (
                  strategy["decision_confidence"]
              )

          # ------------------------------------------------------------
          # ACT30 EXPECTED OUTCOMES
          # ------------------------------------------------------------

          expected_outcomes = []

          for key in [
              "expected_outcomes",
              "success_conditions",
              "evaluation_targets",
          ]:
              value = act30.get(key)

              if isinstance(value, list):
                  for item in value:
                      if isinstance(item, dict):
                          expected_outcomes.append({
                              "source": "ACT30",
                              **item,
                          })
                      else:
                          expected_outcomes.append({
                              "source": "ACT30",
                              "description": str(item),
                          })

          # ACT28 verification targets define what should eventually
          # be observed, but are NOT themselves observations.
          for target in verification_targets:
              if isinstance(target, dict):
                  expected_outcomes.append({
                      "source": "ACT28",
                      **target,
                  })

          # Remove duplicate expected outcomes.
          unique_expected = []
          seen = set()

          for item in expected_outcomes:
              fingerprint = json.dumps(
                  item,
                  sort_keys=True,
                  ensure_ascii=False,
              )

              if fingerprint not in seen:
                  seen.add(fingerprint)
                  unique_expected.append(item)

          expected_outcomes = unique_expected

          # ------------------------------------------------------------
          # OBSERVED OUTCOMES
          # ------------------------------------------------------------
          #
          # CRITICAL:
          # predictions, scenarios, hypotheses and confidence scores
          # are never considered observations.
          #
          # Only explicit outcome containers qualify.
          # ------------------------------------------------------------

          observed_outcomes = []

          outcome_fields = [
              "observed_outcomes",
              "actual_outcomes",
              "results_observed",
              "strategy_results",
              "execution_results",
              "experiment_results",
              "outcome_observations",
              "verified_outcomes",
          ]

          for source_name, data in [
              ("ACT26", act26),
              ("ACT27", act27),
              ("ACT28", act28),
              ("ACT29", act29),
              ("ACT30", act30),
          ]:
              if not isinstance(data, dict):
                  continue

              for field in outcome_fields:
                  value = data.get(field)

                  if isinstance(value, list):
                      for item in value:
                          if isinstance(item, dict):
                              observed_outcomes.append({
                                  "source": source_name,
                                  "field": field,
                                  **item,
                              })
                          else:
                              observed_outcomes.append({
                                  "source": source_name,
                                  "field": field,
                                  "observation": str(item),
                              })

                  elif isinstance(value, dict):
                      observed_outcomes.append({
                          "source": source_name,
                          "field": field,
                          **value,
                      })

          # ------------------------------------------------------------
          # STRATEGY PROFILE
          # ------------------------------------------------------------

          strategy_profiles = {
              "verify_predictions": {
                  "required_evidence": [
                      "real_prediction_outcomes",
                      "expected_vs_actual_comparison",
                      "repeated_observations",
                  ],
                  "success_signals": [
                      "prediction accuracy can be measured",
                      "prediction error can be quantified",
                      "repeated outcomes improve calibration",
                  ],
              },
              "calibrate_confidence": {
                  "required_evidence": [
                      "prediction_outcomes",
                      "confidence_values",
                      "actual_accuracy",
                  ],
                  "success_signals": [
                      "confidence can be compared with accuracy",
                      "overconfidence can be detected",
                      "confidence can be adjusted from outcomes",
                  ],
              },
              "deepen_relationship_models": {
                  "required_evidence": [
                      "relationship_outcomes",
                      "independent observations",
                  ],
                  "success_signals": [
                      "relationships receive outcome support",
                      "unsupported relationships are weakened",
                  ],
              },
              "expand_active_attention": {
                  "required_evidence": [
                      "attention_outcomes",
                      "value_of_attention_choices",
                  ],
                  "success_signals": [
                      "attention choices produce useful results",
                      "selection quality improves",
                  ],
              },
              "seek_actionable_opportunities": {
                  "required_evidence": [
                      "opportunity_outcomes",
                      "action_results",
                  ],
                  "success_signals": [
                      "selected opportunities produce useful results",
                      "action quality improves",
                  ],
              },
          }

          profile = strategy_profiles.get(
              strategy["strategy"],
              {
                  "required_evidence": [],
                  "success_signals": [],
              },
          )

          # ------------------------------------------------------------
          # EVIDENCE QUALITY
          # ------------------------------------------------------------

          evidence_quality = 0.0

          if act26:
              evidence_quality += 5.0

          if act27:
              evidence_quality += 10.0

          if act28:
              evidence_quality += 15.0

          if act29:
              evidence_quality += 15.0

          if act30:
              evidence_quality += 15.0

          # Real observations receive the strongest evidence weight.
          if observed_outcomes:
              evidence_quality += 40.0

          evidence_quality = min(100.0, evidence_quality)

          # ------------------------------------------------------------
          # EXPECTED VS ACTUAL
          # ------------------------------------------------------------

          measurable_gaps = []
          comparable_outcomes = 0
          positive_outcomes = 0
          negative_outcomes = 0

          for outcome in observed_outcomes:
              if not isinstance(outcome, dict):
                  continue

              expected = (
                  outcome.get("expected")
                  if "expected" in outcome
                  else outcome.get("expected_value")
              )

              actual = (
                  outcome.get("actual")
                  if "actual" in outcome
                  else outcome.get("actual_value")
              )

              if expected is not None and actual is not None:
                  comparable_outcomes += 1

                  gap = None

                  if isinstance(expected, (int, float)) and isinstance(
                      actual, (int, float)
                  ):
                      gap = float(actual) - float(expected)

                  measurable_gaps.append({
                      "expected": expected,
                      "actual": actual,
                      "gap": gap,
                      "source": outcome.get("source"),
                  })

              status = clean_text(
                  outcome.get("status")
                  or outcome.get("result")
                  or outcome.get("evaluation")
                  or ""
              )

              if status in {
                  "success",
                  "validated",
                  "positive",
                  "improved",
                  "met",
              }:
                  positive_outcomes += 1

              elif status in {
                  "failure",
                  "weakened",
                  "negative",
                  "declined",
                  "missed",
              }:
                  negative_outcomes += 1

          # ------------------------------------------------------------
          # EVALUATION
          # ------------------------------------------------------------

          observed_count = len(observed_outcomes)
          expected_count = len(expected_outcomes)

          if observed_count == 0:
              evaluation_status = "inconclusive"
              strategy_state = "needs_more_evidence"

              result_summary = (
                  "No explicit real-world outcome has yet been recorded "
                  "for the selected strategy. NØX cannot validate or "
                  "weaken the strategy from predictions alone."
              )

          elif comparable_outcomes == 0:
              evaluation_status = "inconclusive"
              strategy_state = "needs_more_evidence"

              result_summary = (
                  "Outcome observations exist, but there is not yet "
                  "enough explicit expected-versus-actual information "
                  "to evaluate strategy performance."
              )

          elif positive_outcomes > negative_outcomes:
              evaluation_status = "evaluated"
              strategy_state = "validated"

              result_summary = (
                  "Observed outcomes provide more positive than negative "
                  "evidence for the selected strategy."
              )

          elif negative_outcomes > positive_outcomes:
              evaluation_status = "evaluated"
              strategy_state = "weakened"

              result_summary = (
                  "Observed outcomes provide more negative than positive "
                  "evidence for the selected strategy."
              )

          else:
              evaluation_status = "evaluated"
              strategy_state = "inconclusive"

              result_summary = (
                  "Observed outcomes exist, but the evidence does not "
                  "establish a sufficiently clear advantage."
              )

          # ------------------------------------------------------------
          # VALUE ASSESSMENT
          # ------------------------------------------------------------

          if strategy_state == "validated":
              value_assessment = {
                  "status": "positive_evidence",
                  "reason": (
                      "Observed results support the usefulness of the "
                      "selected strategy."
                  ),
              }

          elif strategy_state == "weakened":
              value_assessment = {
                  "status": "negative_evidence",
                  "reason": (
                      "Observed results weaken confidence in the selected "
                      "strategy and should influence future selection."
                  ),
              }

          else:
              value_assessment = {
                  "status": "not_yet_measurable",
                  "reason": (
                      "Strategy value cannot be inferred from predictions, "
                      "confidence or selection alone."
                  ),
              }

          # ------------------------------------------------------------
          # METACOGNITIVE LESSONS
          # ------------------------------------------------------------

          lessons = []

          if observed_count == 0:
              lessons.extend([
                  "A prediction is not an outcome.",
                  "A plausible strategy cannot be validated without observing its consequences.",
                  "Expected outcomes define what should be measured before validation.",
                  "The next useful step is to create or capture a real verification experience.",
              ])

          elif comparable_outcomes == 0:
              lessons.extend([
                  "Having observations is not enough; outcomes must be comparable with expectations.",
                  "NØX must improve the structure of future outcome records.",
              ])

          if measurable_gaps:
              lessons.append(
                  "Expected-versus-actual gaps can update future strategy selection."
              )

          if strategy_state == "validated":
              lessons.append(
                  "A strategy should gain preference only when observed evidence supports its expected value."
              )

          if strategy_state == "weakened":
              lessons.append(
                  "A previously preferred strategy must be reconsidered when observed evidence contradicts it."
              )

          # ------------------------------------------------------------
          # FEEDBACK TO ACT30
          # ------------------------------------------------------------

          feedback = {
              "strategy_id": strategy["strategy_id"],
              "strategy": strategy["strategy"],
              "evaluation_status": evaluation_status,
              "strategy_state": strategy_state,
              "should_remain_preferred": (
                  strategy_state == "validated"
              ),
              "requires_reselection": (
                  strategy_state == "weakened"
              ),
              "requires_more_evidence": (
                  strategy_state in {
                      "inconclusive",
                      "needs_more_evidence",
                  }
              ),
          }

          if strategy_state == "validated":
              next_action = "continue_and_compare_again"
          elif strategy_state == "weakened":
              next_action = "reconsider_strategy_in_ACT30"
          else:
              next_action = "collect_real_outcomes"

          # ------------------------------------------------------------
          # MEMORY INTEGRITY SCORE
          # ------------------------------------------------------------

          integrity_checks = [
              memory_integrity["ACT26_loaded"],
              memory_integrity["ACT27_loaded"],
              memory_integrity["ACT28_loaded"],
              memory_integrity["ACT29_loaded"],
              memory_integrity["ACT30_loaded"],
              bool(strategy["strategy"]),
              self_awareness_score > 0,
              decision_confidence_from_act30 > 0,
          ]

          memory_integrity_score = round(
              100.0 * sum(integrity_checks) / len(integrity_checks),
              2,
          )

          # ------------------------------------------------------------
          # MEMORY
          # ------------------------------------------------------------

          memory = {
              "act": "ACT31",
              "name": "Strategy Evaluation",
              "timestamp": timestamp,
              "gemini_used": False,
              "project_cost_eur": 0,

              "purpose": (
                  "Evaluate whether the strategy selected by ACT30 "
                  "is supported, weakened, or not yet evaluable by "
                  "observed outcomes."
              ),

              "principle": (
                  "Selection is not validation. NØX must compare "
                  "expected and observed consequences before treating "
                  "a strategy as reliable."
              ),

              "source_act": "ACT30",

              "selected_strategy": strategy,

              "expected_outcomes": expected_outcomes,
              "expected_outcome_count": expected_count,

              "observed_outcomes": observed_outcomes,
              "observed_outcome_count": observed_count,

              "measurable_gaps": measurable_gaps,
              "comparable_outcomes": comparable_outcomes,

              "positive_outcomes": positive_outcomes,
              "negative_outcomes": negative_outcomes,

              "evidence_quality": round(
                  evidence_quality,
                  2,
              ),

              "evaluation_status": evaluation_status,
              "strategy_state": strategy_state,

              "result_summary": result_summary,

              "value_assessment": value_assessment,

              "lessons": lessons,

              "feedback_to_ACT30": feedback,

              "next_action": next_action,

              "memory_integrity": {
                  **memory_integrity,
                  "score": memory_integrity_score,
                  "strategy_read_correctly": bool(
                      strategy["strategy"]
                  ),
                  "ACT26_attention_count": len(attention_items),
                  "ACT26_monitor_count": len(monitored_items),
                  "ACT27_relationship_count": relationships_found,
                  "ACT28_prediction_count": len(predictions),
                  "ACT28_scenario_count": len(scenarios),
                  "ACT29_self_awareness_score": self_awareness_score,
                  "ACT30_decision_confidence": (
                      decision_confidence_from_act30
                  ),
              },

              "inputs": {
                  "ACT26_attention_items": len(attention_items),
                  "ACT26_monitored_items": len(monitored_items),
                  "ACT27_relationships": relationships_found,
                  "ACT28_predictions": len(predictions),
                  "ACT28_scenarios": len(scenarios),
                  "ACT28_verification_targets": len(
                      verification_targets
                  ),
                  "ACT29_self_awareness": self_awareness_score,
                  "ACT30_decision_confidence": (
                      decision_confidence_from_act30
                  ),
              },

              "epistemic_rules": [
                  "predictions_are_not_observations",
                  "scenarios_are_not_outcomes",
                  "confidence_is_not_accuracy",
                  "selection_is_not_validation",
                  "absence_of_outcomes_requires_inconclusive_status",
                  "observations_without_comparison_are_not_validation",
              ],

              "strategy_profile": profile,

              "next_cognitive_step": (
                  "ACT32 should design controlled experiments that "
                  "generate the missing evidence needed to distinguish "
                  "competing strategies."
              ),
          }

          output = (
              MEMORY /
              "nox_act_31_strategy_evaluation.json"
          )

          with output.open("w", encoding="utf-8") as f:
              json.dump(
                  memory,
                  f,
                  indent=2,
                  ensure_ascii=False,
              )

          # ------------------------------------------------------------
          # CONSOLE REPORT
          # ------------------------------------------------------------

          print("")
          print("========================================")
          print("NØX ACT31 - STRATEGY EVALUATION")
          print("========================================")

          print("")
          print("MEMORY INTEGRITY:")
          print(
              f"- Score: {memory_integrity_score:.2f}"
          )
          print(
              f"- ACT26 attention items: {len(attention_items)}"
          )
          print(
              f"- ACT26 monitored items: {len(monitored_items)}"
          )
          print(
              f"- ACT27 relationships: {relationships_found:.0f}"
          )
          print(
              f"- ACT28 predictions: {len(predictions)}"
          )
          print(
              f"- ACT28 scenarios: {len(scenarios)}"
          )
          print(
              f"- ACT29 self-awareness: "
              f"{self_awareness_score:.2f}"
          )
          print(
              f"- ACT30 decision confidence: "
              f"{decision_confidence_from_act30:.2f}"
          )

          print("")
          print("SELECTED STRATEGY:")
          print(
              f"- ID: {strategy['strategy_id'] or 'unknown'}"
          )
          print(
              f"- Strategy: "
              f"{strategy['strategy'] or 'UNKNOWN'}"
          )
          print(
              f"- Score: {strategy['score']:.2f}"
          )
          print(
              f"- Decision confidence: "
              f"{strategy['decision_confidence']:.2f}"
          )

          print("")
          print("EVIDENCE:")
          print(
              f"- Expected outcomes: {expected_count}"
          )
          print(
              f"- Observed outcomes: {observed_count}"
          )
          print(
              f"- Comparable outcomes: {comparable_outcomes}"
          )
          print(
              f"- Evidence quality: {evidence_quality:.2f}"
          )

          print("")
          print("EVALUATION:")
          print(
              f"- Status: {evaluation_status}"
          )
          print(
              f"- Strategy state: {strategy_state}"
          )

          print("")
          print("RESULT:")
          print(f"- {result_summary}")

          print("")
          print("VALUE:")
          print(
              f"- {value_assessment['status']}"
          )

          print("")
          print("NEXT ACTION:")
          print(f"- {next_action}")

          print("")
          print("LESSONS:")

          for lesson in lessons:
              print(f"- {lesson}")

          print("")
          print(
              f"Memory written: {output}"
          )
          print("ACT31 COMPLETE")
          PY

      - name: Commit ACT31 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_31_strategy_evaluation.json

          if git diff --cached --quiet; then
            echo "No ACT31 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT31 Strategy Evaluation"

      - name: Push with rebase retry
        run: |
          set -e

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              git reset --hard origin/main

              git add memory/nox_act_31_strategy_evaluation.json

              git commit \
                -m "NØX ACT31 Strategy Evaluation" || true
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep $((attempt * 3))
          done

          echo "ERROR: unable to push ACT31 after retries."
          exit 1
