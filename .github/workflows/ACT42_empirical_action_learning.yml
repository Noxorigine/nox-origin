name: "NØX ACT42 - Empirical Action Learning"

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  empirical-action-learning:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_USED: "false"
      PROJECT_COST_EUR: "0"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run ACT42 empirical action learning
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          MEMORY = ROOT / "memory"
          MEMORY.mkdir(parents=True, exist_ok=True)

          OUTPUT = MEMORY / "nox_act_42_empirical_action_learning.json"

          def load_json(path):
              path = Path(path)
              if not path.exists():
                  return None
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          def write_json(path, data):
              with Path(path).open("w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          def find_act_file(act_number):
              patterns = [
                  f"*act_{act_number}*.json",
                  f"*ACT{act_number}*.json",
                  f"*act{act_number}*.json",
                  f"nox_act_{act_number}_*.json",
              ]

              candidates = []
              for pattern in patterns:
                  candidates.extend(MEMORY.glob(pattern))

              unique = []
              seen = set()

              for path in candidates:
                  if path.resolve() not in seen:
                      seen.add(path.resolve())
                      unique.append(path)

              unique.sort(
                  key=lambda p: p.stat().st_mtime if p.exists() else 0,
                  reverse=True
              )

              return unique[0] if unique else None

          def numeric(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          def extract_observations(act41):
              """
              Only real observations explicitly present in ACT41 are accepted.
              No result is inferred from scores, expectations or selection quality.
              """
              if not isinstance(act41, dict):
                  return []

              evaluation = act41.get("outcome_evaluation", {})
              if not isinstance(evaluation, dict):
                  return []

              observed = numeric(
                  evaluation.get("observed_outcomes"),
                  0.0
              )

              comparable = numeric(
                  evaluation.get("comparable_outcomes"),
                  0.0
              )

              state = evaluation.get(
                  "outcome_state",
                  "no_real_outcome_observed"
              )

              if observed <= 0 or comparable <= 0:
                  return []

              prediction = act41.get("prediction_comparison", {})
              if not isinstance(prediction, dict):
                  prediction = {}

              return [{
                  "action_id": (
                      act41.get("action_memory", {})
                      .get("action_id")
                  ),
                  "action": (
                      act41.get("action_memory", {})
                      .get("action")
                  ),
                  "action_type": (
                      act41.get("action_memory", {})
                      .get("action_type")
                  ),
                  "prediction_id": prediction.get("prediction_id"),
                  "outcome_state": state,
                  "observed_outcomes": observed,
                  "comparable_outcomes": comparable,
                  "prediction_accuracy": prediction.get(
                      "prediction_accuracy"
                  ),
                  "action_effectiveness": act41.get(
                      "action_effectiveness"
                  ),
                  "outcome_quality": numeric(
                      evaluation.get("outcome_quality"),
                      0.0
                  ),
                  "timestamp": act41.get("timestamp"),
              }]

          act40_path = find_act_file(40)
          act41_path = find_act_file(41)
          previous_act42_path = find_act_file(42)

          act40 = load_json(act40_path) if act40_path else None
          act41 = load_json(act41_path) if act41_path else None
          previous_act42 = (
              load_json(previous_act42_path)
              if previous_act42_path and
              previous_act42_path.resolve() != OUTPUT.resolve()
              else None
          )

          sources = {
              "act40": bool(act40),
              "act41": bool(act41),
              "previous_act42": bool(previous_act42),
          }

          empirical_observations = extract_observations(act41)

          previous_history = []

          if isinstance(previous_act42, dict):
              history = previous_act42.get(
                  "empirical_history",
                  []
              )

              if isinstance(history, list):
                  previous_history = history

          combined_history = previous_history + empirical_observations

          # Remove exact duplicate observations while preserving order.
          deduplicated_history = []
          seen_keys = set()

          for item in combined_history:
              key = (
                  item.get("action_id"),
                  item.get("prediction_id"),
                  item.get("timestamp"),
                  item.get("outcome_state"),
              )

              if key in seen_keys:
                  continue

              seen_keys.add(key)
              deduplicated_history.append(item)

          empirical_history = deduplicated_history

          empirical_samples = len(empirical_history)

          learning_updates = []

          if empirical_samples > 0:
              for observation in empirical_history:
                  effectiveness = observation.get(
                      "action_effectiveness"
                  )

                  accuracy = observation.get(
                      "prediction_accuracy"
                  )

                  learning_updates.append({
                      "action_id": observation.get("action_id"),
                      "action": observation.get("action"),
                      "action_type": observation.get("action_type"),
                      "prediction_id": observation.get(
                          "prediction_id"
                      ),
                      "observed_outcome": observation.get(
                          "outcome_state"
                      ),
                      "prediction_accuracy": accuracy,
                      "action_effectiveness": effectiveness,
                      "learning_rule": (
                          "Use only the observed relationship between "
                          "the selected action, its expected result and "
                          "the real measured outcome."
                      ),
                  })

              learning_status = "empirical_learning_available"
              update_available = True
              learning_signal = (
                  "Real outcome evidence exists. Future action selection "
                  "can use empirical relationships between actions and "
                  "their observed results."
              )
          else:
              learning_status = "awaiting_real_outcomes"
              update_available = False
              learning_signal = (
                  "No real comparable outcome is currently available. "
                  "NØX must not infer success, failure, effectiveness "
                  "or prediction accuracy from selection scores alone."
              )

          current_confidence = 30.0

          if isinstance(act41, dict):
              confidence_update = act41.get(
                  "confidence_update",
                  {}
              )

              if isinstance(confidence_update, dict):
                  current_confidence = numeric(
                      confidence_update.get(
                          "current_confidence"
                      ),
                      current_confidence
                  )

          # ACT42 can learn from evidence, but does not arbitrarily
          # increase confidence. Confidence remains controlled by
          # explicit empirical evidence and later calibration logic.
          confidence_change = 0.0

          action_execution = False
          execution_authorization = False
          financial_permission = False
          payment_permission = False
          spending_permission = False

          selected_action = None
          expected_result = None

          if isinstance(act41, dict):
              selected_action = act41.get(
                  "selected_action"
              )
              expected_result = act41.get(
                  "expected_result"
              )

          next_evidence = (
              "Observe a real result produced by a selected action, "
              "record the result, compare it with the expected result, "
              "and only then update empirical action knowledge."
          )

          output = {
              "act": "ACT42",
              "version": "V1",
              "name": "Empirical Action Learning",
              "timestamp": utc_now(),

              "gemini_used": False,
              "project_cost_eur": 0,

              "source_completeness": round(
                  (
                      sum(
                          1 for value in sources.values()
                          if value
                      )
                      / len(sources)
                  ) * 100,
                  2
              ),

              "sources": {
                  "act40": str(act40_path) if act40_path else None,
                  "act41": str(act41_path) if act41_path else None,
                  "previous_act42": (
                      str(previous_act42_path)
                      if previous_act42_path
                      else None
                  ),
              },

              "action_context": {
                  "selected_action": selected_action,
                  "expected_result": expected_result,
                  "source": "ACT41",
              },

              "empirical_learning": {
                  "status": learning_status,
                  "learning_update_available": update_available,
                  "empirical_samples": empirical_samples,
                  "observed_outcomes": empirical_samples,
                  "comparable_outcomes": empirical_samples,
                  "learning_signal": learning_signal,
              },

              "empirical_history": empirical_history,

              "learning_updates": learning_updates,

              "decision_learning": {
                  "available": update_available,
                  "basis": (
                      "real_observed_outcomes"
                      if update_available
                      else "evidence_gap"
                  ),
                  "rules": [
                      "Never treat an action-selection score as a real outcome.",
                      "Never infer success without observable evidence.",
                      "Never infer failure without observable evidence.",
                      "Never fabricate prediction accuracy.",
                      "Never fabricate action effectiveness.",
                      "Only update empirical knowledge from comparable observations.",
                      "Preserve uncertainty when evidence is insufficient.",
                  ],
              },

              "confidence_update": {
                  "status": (
                      "evidence_based_learning_possible"
                      if update_available
                      else "no_update"
                  ),
                  "current_confidence": current_confidence,
                  "confidence_change": confidence_change,
                  "new_confidence": current_confidence,
                  "increase_allowed": False,
                  "reason": (
                      "ACT42 does not arbitrarily increase confidence. "
                      "Confidence calibration remains evidence-driven."
                  ),
              },

              "execution_state": {
                  "execution_permission": False,
                  "execution_authorization": False,
                  "action_execution": action_execution,
                  "status": (
                      "learning_only"
                      if not update_available
                      else "empirical_learning_only"
                  ),
              },

              "autonomy_state": {
                  "status": "learning_only",
                  "action_selection": True,
                  "action_outcome_evaluation": True,
                  "empirical_action_learning": True,
                  "action_execution": False,
                  "financial_actions": False,
                  "payments": False,
                  "spending": False,
                  "gemini": False,
              },

              "financial_boundary": {
                  "financial_permission": financial_permission,
                  "payment_permission": payment_permission,
                  "spending_permission": spending_permission,
                  "financial_limit": 0.0,
              },

              "cognitive_learning": {
                  "capability": (
                      "Transform real action outcomes into empirical "
                      "knowledge that can inform future action selection."
                  ),
                  "current_state": learning_status,
                  "what_nox_learned": (
                      "An internally preferred action is not evidence "
                      "that the action is effective. Empirical learning "
                      "requires observable outcomes."
                  ),
                  "future_use": (
                      "Use repeated real outcomes to discover which "
                      "actions reliably produce useful results in "
                      "specific contexts."
                  ),
              },

              "generalization_boundary": {
                  "generalization_allowed": False,
                  "reason": (
                      "A single or absent observation is insufficient "
                      "to establish a reliable general rule."
                  ),
                  "required_before_generalization": [
                      "multiple comparable observations",
                      "consistent outcome evidence",
                      "context awareness",
                      "measured prediction/result differences",
                  ],
              },

              "next_action": (
                  "Accumulate real comparable action outcomes and "
                  "record them without fabrication."
              ),

              "next_cognitive_step": (
                  "ACT43 should generalize validated empirical "
                  "action-learning patterns across comparable contexts "
                  "without overgeneralizing from weak evidence."
              ),

              "validation": {
                  "act40_present": bool(act40),
                  "act41_present": bool(act41),
                  "selected_action_tracked": (
                      selected_action is not None
                  ),
                  "expected_result_tracked": (
                      expected_result is not None
                  ),
                  "empirical_samples_counted": (
                      empirical_samples >= 0
                  ),
                  "no_outcome_invented": True,
                  "prediction_accuracy_not_fabricated": True,
                  "effectiveness_not_fabricated": True,
                  "learning_only_from_observed_evidence": True,
                  "generalization_not_forced": True,
                  "execution_not_authorized": True,
                  "financial_permission_false": (
                      financial_permission is False
                  ),
                  "payment_permission_false": (
                      payment_permission is False
                  ),
                  "spending_permission_false": (
                      spending_permission is False
                  ),
                  "confidence_not_artificially_increased": (
                      confidence_change == 0.0
                  ),
                  "gemini_false": (
                      os.environ.get("GEMINI_USED") == "false"
                  ),
                  "cost_zero": (
                      numeric(
                          os.environ.get("PROJECT_COST_EUR"),
                          -1
                      ) == 0.0
                  ),
              },
          }

          write_json(OUTPUT, output)

          # Final hard validation before Git commit.
          written = load_json(OUTPUT)

          assert written is not None
          assert written["act"] == "ACT42"
          assert written["version"] == "V1"
          assert written["gemini_used"] is False
          assert written["project_cost_eur"] == 0
          assert written["execution_state"][
              "execution_authorization"
          ] is False
          assert written["autonomy_state"][
              "action_execution"
          ] is False
          assert written["financial_boundary"][
              "financial_permission"
          ] is False
          assert written["financial_boundary"][
              "payment_permission"
          ] is False
          assert written["financial_boundary"][
              "spending_permission"
          ] is False
          assert written["confidence_update"][
              "confidence_change"
          ] == 0.0
          assert written["validation"][
              "no_outcome_invented"
          ] is True
          assert written["validation"][
              "prediction_accuracy_not_fabricated"
          ] is True
          assert written["validation"][
              "effectiveness_not_fabricated"
          ] is True

          print(json.dumps(written, ensure_ascii=False, indent=2))
          print(f"\nACT42 output written to {OUTPUT}")
          PY

      - name: Commit ACT42 memory
        shell: bash
        run: |
          git config user.name "NØX"
          git config user.email "nox@users.noreply.github.com"

          git add memory/nox_act_42_empirical_action_learning.json

          if git diff --cached --quiet; then
            echo "No ACT42 memory changes to commit."
            exit 0
          fi

          git commit -m "ACT42 V1 empirical action learning"

      - name: Push ACT42 safely
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "ACT42 successfully pushed."
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep $((attempt * 5))
          done

          echo "ACT42 push failed after 3 attempts."
          exit 1
