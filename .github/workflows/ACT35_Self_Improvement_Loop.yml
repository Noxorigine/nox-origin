name: NØX ACT35 - Self Improvement Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "57 */6 * * *"

concurrency:
  group: nox-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  self-improvement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Evaluate self improvement
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          BASE = Path("memory")
          BASE.mkdir(parents=True, exist_ok=True)

          def load_json(path, default):
              p = Path(path)
              if not p.exists():
                  return default
              try:
                  with p.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          def clamp(value, low=0.0, high=100.0):
              try:
                  return max(low, min(high, float(value)))
              except Exception:
                  return low

          # ------------------------------------------------------------
          # Load the cognitive chain.
          # ------------------------------------------------------------

          act26 = load_json(
              BASE / "nox_act_26_active_attention.json",
              {}
          )

          act27 = load_json(
              BASE / "nox_act_27_relational_understanding.json",
              {}
          )

          act28 = load_json(
              BASE / "nox_act_28_anticipation_simulation.json",
              {}
          )

          act29 = load_json(
              BASE / "nox_act_29_metacognition.json",
              {}
          )

          act30 = load_json(
              BASE / "nox_act_30_adaptive_strategy_selection.json",
              {}
          )

          act31 = load_json(
              BASE / "nox_act_31_strategy_evaluation.json",
              {}
          )

          act32 = load_json(
              BASE / "nox_act_32_experiment_designer.json",
              {}
          )

          act33 = load_json(
              BASE / "nox_act_33_resource_allocation.json",
              {}
          )

          act34 = load_json(
              BASE / "nox_act_34_goal_formation.json",
              {}
          )

          # ------------------------------------------------------------
          # Extract metrics robustly from several possible schemas.
          # ------------------------------------------------------------

          def first_number(*values, default=0.0):
              for value in values:
                  if value is None:
                      continue
                  try:
                      return float(value)
                  except Exception:
                      continue
              return float(default)

          attention_items = act26.get("attention_items", [])
          monitored_items = act26.get("monitoring_items", [])

          if not isinstance(attention_items, list):
              attention_items = []

          if not isinstance(monitored_items, list):
              monitored_items = []

          attention_count = len(attention_items)
          monitor_count = len(monitored_items)

          if attention_count == 0:
              attention_count = first_number(
                  act26.get("attention_count"),
                  act26.get("items_selected"),
                  act26.get("selected_count"),
                  act26.get("metrics", {}).get("attention_items"),
                  default=0.0
              )

          relationship_count = first_number(
              act27.get("relationships_found"),
              act27.get("relationship_count"),
              act27.get("metrics", {}).get("relationships_found"),
              default=0.0
          )

          prediction_count = first_number(
              len(act28.get("predictions", []))
              if isinstance(act28.get("predictions", []), list)
              else None,
              act28.get("prediction_count"),
              default=0.0
          )

          scenario_count = first_number(
              len(act28.get("scenarios", []))
              if isinstance(act28.get("scenarios", []), list)
              else None,
              act28.get("scenario_count"),
              default=0.0
          )

          self_awareness = first_number(
              act29.get("self_awareness_score"),
              act29.get("metrics", {}).get("self_awareness_score"),
              default=0.0
          )

          decision_confidence = first_number(
              act30.get("decision_confidence"),
              act30.get("preferred_strategy", {}).get(
                  "decision_confidence"
              ),
              act30.get("selected_strategy", {}).get(
                  "decision_confidence"
              ),
              default=0.0
          )

          experiment_count = first_number(
              act32.get("candidate_experiment_count"),
              len(act32.get("candidate_experiments", []))
              if isinstance(
                  act32.get("candidate_experiments", []),
                  list
              )
              else None,
              default=0.0
          )

          allocation_quality = first_number(
              act33.get("allocation_quality"),
              default=0.0
          )

          goal_quality = first_number(
              act34.get("goal_quality"),
              default=0.0
          )

          observed_outcomes = first_number(
              act31.get("observed_outcome_count"),
              len(act31.get("observed_outcomes", []))
              if isinstance(
                  act31.get("observed_outcomes", []),
                  list
              )
              else None,
              default=0.0
          )

          comparable_outcomes = first_number(
              act31.get("comparable_outcomes"),
              default=0.0
          )

          evidence_quality = first_number(
              act31.get("evidence_quality"),
              default=0.0
          )

          # ------------------------------------------------------------
          # Current state
          # ------------------------------------------------------------

          current_metrics = {
              "attention_count": attention_count,
              "monitor_count": monitor_count,
              "relationship_count": relationship_count,
              "prediction_count": prediction_count,
              "scenario_count": scenario_count,
              "self_awareness": self_awareness,
              "decision_confidence": decision_confidence,
              "experiment_count": experiment_count,
              "allocation_quality": allocation_quality,
              "goal_quality": goal_quality,
              "observed_outcomes": observed_outcomes,
              "comparable_outcomes": comparable_outcomes,
              "evidence_quality": evidence_quality
          }

          # ------------------------------------------------------------
          # Establish a baseline from the current cognitive history.
          #
          # There may be no previous ACT35 result yet. In that case,
          # ACT35 must NOT pretend that improvement has already occurred.
          # It creates a baseline and marks improvement as unverified.
          # ------------------------------------------------------------

          previous = load_json(
              BASE / "nox_act_35_self_improvement.json",
              {}
          )

          previous_metrics = previous.get(
              "current_metrics",
              {}
          )

          has_previous_baseline = bool(previous_metrics)

          # ------------------------------------------------------------
          # Compare before / after where a valid baseline exists.
          # ------------------------------------------------------------

          metric_deltas = {}

          for key, current_value in current_metrics.items():
              previous_value = first_number(
                  previous_metrics.get(key),
                  default=0.0
              )

              metric_deltas[key] = {
                  "before": round(previous_value, 2),
                  "after": round(current_value, 2),
                  "delta": round(
                      current_value - previous_value,
                      2
                  ),
                  "comparison_available": has_previous_baseline
              }

          # ------------------------------------------------------------
          # Capability dimensions.
          #
          # These are not treated as objective "intelligence scores".
          # They are operational indicators derived from actual workflow
          # evidence.
          # ------------------------------------------------------------

          capability_dimensions = {
              "attention": clamp(
                  attention_count * 10.0
              ),
              "relational_modeling": clamp(
                  relationship_count * 4.0
              ),
              "anticipation": clamp(
                  prediction_count * 8.0
                  + scenario_count * 4.0
              ),
              "metacognition": clamp(
                  self_awareness
              ),
              "strategy_selection": clamp(
                  decision_confidence
              ),
              "experimentation": clamp(
                  experiment_count * 10.0
              ),
              "resource_management": clamp(
                  allocation_quality
              ),
              "goal_formation": clamp(
                  goal_quality
              ),
              "empirical_learning": clamp(
                  comparable_outcomes * 20.0
                  + evidence_quality * 0.80
              )
          }

          # ------------------------------------------------------------
          # Evidence of actual improvement.
          #
          # The system requires observed change, not workflow activity.
          # ------------------------------------------------------------

          positive_changes = []
          negative_changes = []
          unchanged = []

          for key, item in metric_deltas.items():
              if not item["comparison_available"]:
                  continue

              delta = item["delta"]

              if delta >= 5.0:
                  positive_changes.append(key)
              elif delta <= -5.0:
                  negative_changes.append(key)
              else:
                  unchanged.append(key)

          # Real empirical evidence gets special treatment.
          empirical_evidence_available = (
              observed_outcomes > 0
              and comparable_outcomes > 0
          )

          if empirical_evidence_available:
              positive_changes.append(
                  "empirical_learning"
              )

          # ------------------------------------------------------------
          # Determine improvement state.
          # ------------------------------------------------------------

          if not has_previous_baseline:
              improvement_state = "baseline_established"
              improvement_confidence = 25.0
              improvement_claim = (
                  "No previous ACT35 baseline exists. "
                  "NØX can establish a measurement baseline, "
                  "but cannot yet claim self-improvement."
              )

          elif positive_changes and not negative_changes:
              improvement_state = "improvement_detected"
              improvement_confidence = min(
                  95.0,
                  55.0 + len(positive_changes) * 8.0
              )
              improvement_claim = (
                  "One or more measured capabilities improved "
                  "relative to the previous ACT35 baseline."
              )

          elif negative_changes and not positive_changes:
              improvement_state = "regression_detected"
              improvement_confidence = min(
                  95.0,
                  55.0 + len(negative_changes) * 8.0
              )
              improvement_claim = (
                  "One or more measured capabilities decreased "
                  "relative to the previous ACT35 baseline."
              )

          elif positive_changes and negative_changes:
              improvement_state = "mixed_change"
              improvement_confidence = 70.0
              improvement_claim = (
                  "NØX shows both improvements and regressions. "
                  "No global improvement claim should be made."
              )

          else:
              improvement_state = "no_material_change"
              improvement_confidence = 65.0
              improvement_claim = (
                  "No material capability change was detected "
                  "relative to the previous baseline."
              )

          # ------------------------------------------------------------
          # Detect whether NØX is actually learning from outcomes.
          # ------------------------------------------------------------

          learning_state = "not_yet_verified"

          if comparable_outcomes > 0:
              learning_state = "empirical_learning_available"
          elif observed_outcomes > 0:
              learning_state = "observations_without_comparison"
          else:
              learning_state = "waiting_for_real_outcomes"

          # ------------------------------------------------------------
          # Detect self-improvement risks.
          # ------------------------------------------------------------

          risks = []

          if not empirical_evidence_available:
              risks.append(
                  "self_improvement_not_yet_supported_by_real_outcomes"
              )

          if decision_confidence >= 90.0 and evidence_quality < 70.0:
              risks.append(
                  "confidence_may_exceed_evidence"
              )

          if goal_quality >= 90.0 and observed_outcomes == 0:
              risks.append(
                  "goal_quality_is_structural_not_empirical"
              )

          if allocation_quality >= 90.0 and observed_outcomes == 0:
              risks.append(
                  "resource_allocation_has_not_yet_been_validated"
              )

          if experiment_count > 0 and observed_outcomes == 0:
              risks.append(
                  "experiments_exist_but_have_not_yet_generated_outcomes"
              )

          # ------------------------------------------------------------
          # Feedback to previous cognitive stages.
          # ------------------------------------------------------------

          feedback = {
              "ACT30_strategy_selection": {
                  "status": (
                      "continue_verification"
                      if not empirical_evidence_available
                      else "re_evaluate_with_outcomes"
                  ),
                  "message": (
                      "Strategy rankings should incorporate measured "
                      "outcomes once sufficient evidence exists."
                  )
              },
              "ACT31_strategy_evaluation": {
                  "status": (
                      "await_outcomes"
                      if observed_outcomes == 0
                      else "evaluate_again"
                  ),
                  "message": (
                      "Expected outcomes must be compared with actual "
                      "observations before strategy validation."
                  )
              },
              "ACT32_experiment_design": {
                  "status": (
                      "execute_or_observe"
                      if experiment_count > 0
                      else "design_needed"
                  ),
                  "message": (
                      "Experiments should be judged by the quality of "
                      "evidence they generate, not by their existence."
                  )
              },
              "ACT33_resource_allocation": {
                  "status": (
                      "preserve_current_allocation"
                      if not empirical_evidence_available
                      else "reallocate_from_results"
                  ),
                  "message": (
                      "Resource allocation should increasingly depend "
                      "on observed learning yield."
                  )
              },
              "ACT34_goal_formation": {
                  "status": (
                      "continue_current_goal"
                      if not empirical_evidence_available
                      else "review_goal"
                  ),
                  "message": (
                      "Goals should be revised when measured results "
                      "change the value of the current objective."
                  )
              }
          }

          # ------------------------------------------------------------
          # Self-improvement policy.
          # ------------------------------------------------------------

          self_improvement_rules = [
              "never infer improvement from workflow execution alone",
              "require before_and_after evidence when possible",
              "distinguish capability growth from activity volume",
              "distinguish confidence increase from accuracy increase",
              "reward measured learning rather than output quantity",
              "treat regression as useful information",
              "retain uncertainty when evidence is insufficient",
              "update strategies only when evidence justifies the change",
              "update goals when their expected value changes",
              "preserve reversibility during self-improvement",
              "never spend money to manufacture evidence",
              "never require Gemini or external paid AI",
              "do not modify core behavior solely because a metric moved once"
          ]

          # ------------------------------------------------------------
          # Next improvement target.
          # ------------------------------------------------------------

          if observed_outcomes == 0:
              improvement_target = {
                  "target": "empirical_evidence_generation",
                  "reason": (
                      "The largest current limitation is the absence "
                      "of comparable real-world outcomes."
                  ),
                  "linked_experiment": act32.get(
                      "selected_experiment",
                      {}
                  ).get("experiment_id"),
                  "linked_goal": act34.get(
                      "selected_goal",
                      {}
                  ).get("goal_id"),
                  "priority": 100.0
              }
          elif comparable_outcomes == 0:
              improvement_target = {
                  "target": "outcome_comparison",
                  "reason": (
                      "Observations exist but cannot yet be reliably "
                      "compared with expected outcomes."
                  ),
                  "linked_experiment": act32.get(
                      "selected_experiment",
                      {}
                  ).get("experiment_id"),
                  "linked_goal": act34.get(
                      "selected_goal",
                      {}
                  ).get("goal_id"),
                  "priority": 95.0
              }
          elif negative_changes:
              improvement_target = {
                  "target": "regression_analysis",
                  "reason": (
                      "A measured decrease requires investigation "
                      "before further optimization."
                  ),
                  "linked_experiment": None,
                  "linked_goal": act34.get(
                      "selected_goal",
                      {}
                  ).get("goal_id"),
                  "priority": 90.0
              }
          else:
              improvement_target = {
                  "target": "reinforce_evidence_supported_capabilities",
                  "reason": (
                      "Observed improvements should be tested repeatedly "
                      "before being treated as stable capability gains."
                  ),
                  "linked_experiment": None,
                  "linked_goal": act34.get(
                      "selected_goal",
                      {}
                  ).get("goal_id"),
                  "priority": 85.0
              }

          # ------------------------------------------------------------
          # Overall self-improvement score.
          #
          # This is NOT an intelligence score.
          # It measures the quality of the self-improvement process.
          # ------------------------------------------------------------

          process_quality = clamp(
              (
                  (35.0 if has_previous_baseline else 20.0)
                  + (25.0 if empirical_evidence_available else 5.0)
                  + (20.0 if evidence_quality >= 60.0 else 10.0)
                  + (10.0 if act34.get(
                      "goal_is_provisional",
                      False
                  ) else 0.0)
                  + (10.0 if act33.get(
                      "allocation_is_provisional",
                      False
                  ) else 0.0)
              )
          )

          result = {
              "act": "ACT35",
              "name": "Self-Improvement Loop",
              "timestamp": datetime.now(
                  timezone.utc
              ).isoformat(),
              "gemini_used": False,
              "project_cost_eur": 0,
              "purpose": (
                  "Measure whether pursuing goals and strategies "
                  "actually improves NØX's capabilities, learning "
                  "quality and decision process."
              ),
              "principle": (
                  "NØX should not assume that action produces improvement. "
                  "It must compare states before and after, identify "
                  "measured gains or regressions, preserve uncertainty "
                  "when evidence is insufficient and feed validated "
                  "learning back into future strategy and goal formation."
              ),
              "source_acts": [
                  "ACT26",
                  "ACT27",
                  "ACT28",
                  "ACT29",
                  "ACT30",
                  "ACT31",
                  "ACT32",
                  "ACT33",
                  "ACT34"
              ],
              "current_metrics": current_metrics,
              "previous_metrics": previous_metrics,
              "baseline": {
                  "available": has_previous_baseline,
                  "source": (
                      "previous ACT35 result"
                      if has_previous_baseline
                      else "new baseline"
                  )
              },
              "metric_deltas": metric_deltas,
              "capability_dimensions": capability_dimensions,
              "positive_changes": list(
                  dict.fromkeys(positive_changes)
              ),
              "negative_changes": list(
                  dict.fromkeys(negative_changes)
              ),
              "unchanged": unchanged,
              "improvement_state": improvement_state,
              "improvement_confidence": round(
                  improvement_confidence,
                  2
              ),
              "improvement_claim": improvement_claim,
              "learning_state": learning_state,
              "empirical_evidence_available": (
                  empirical_evidence_available
              ),
              "observed_outcomes": observed_outcomes,
              "comparable_outcomes": comparable_outcomes,
              "evidence_quality": evidence_quality,
              "risks": risks,
              "feedback": feedback,
              "self_improvement_rules": self_improvement_rules,
              "next_improvement_target": improvement_target,
              "process_quality": round(
                  process_quality,
                  2
              ),
              "goal_reference": act34.get(
                  "selected_goal",
                  {}
              ),
              "strategy_reference": act30.get(
                  "preferred_strategy",
                  act30.get(
                      "selected_strategy",
                      {}
                  )
              ),
              "experiment_reference": act32.get(
                  "selected_experiment",
                  {}
              ),
              "allocation_reference": act33.get(
                  "selected_allocation",
                  {}
              ),
              "self_improvement_is_provisional": True,
              "capability_gain_is_not_assumed": (
                  not has_previous_baseline
              ),
              "financial_spending_allowed": False,
              "gemini_allowed": False,
              "external_paid_ai_allowed": False,
              "next_action": (
                  "collect_real_outcomes_and_reassess"
                  if observed_outcomes == 0
                  else "compare_outcomes_and_reassess"
              ),
              "next_cognitive_step": (
                  "After repeated self-improvement cycles, NØX should "
                  "learn which types of goals, strategies, experiments "
                  "and resource allocations reliably improve its real "
                  "performance rather than merely increasing activity."
              )
          }

          output = BASE / "nox_act_35_self_improvement.json"

          with output.open("w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("==============================================")
          print("NØX ACT35 - SELF-IMPROVEMENT LOOP")
          print("==============================================")

          print("CURRENT METRICS:")
          for key, value in current_metrics.items():
              print(f"- {key}: {value}")

          print()
          print("BASELINE:")
          print(
              f"- Previous baseline available: "
              f"{has_previous_baseline}"
          )

          print()
          print("IMPROVEMENT STATE:")
          print(
              f"- State: {improvement_state}"
          )
          print(
              f"- Confidence: "
              f"{improvement_confidence:.2f}"
          )
          print(
              f"- Empirical evidence: "
              f"{empirical_evidence_available}"
          )

          print()
          print("POSITIVE CHANGES:")
          for item in dict.fromkeys(positive_changes):
              print(f"- {item}")

          if not positive_changes:
              print("- none")

          print()
          print("NEGATIVE CHANGES:")
          for item in dict.fromkeys(negative_changes):
              print(f"- {item}")

          if not negative_changes:
              print("- none")

          print()
          print("LEARNING STATE:")
          print(f"- {learning_state}")

          print()
          print("RISKS:")
          for item in risks:
              print(f"- {item}")

          if not risks:
              print("- none detected")

          print()
          print("NEXT IMPROVEMENT TARGET:")
          print(
              f"- {improvement_target['target']}"
          )
          print(
              f"- Priority: "
              f"{improvement_target['priority']:.2f}"
          )

          print()
          print(
              f"SELF-IMPROVEMENT PROCESS QUALITY: "
              f"{process_quality:.2f}"
          )
          print("Financial spending allowed: False")
          print("Gemini allowed: False")
          print("External paid AI allowed: False")
          print()
          print(f"Memory written: {output}")
          PY

      - name: Commit ACT35 memory
        run: |
          git config user.name "NØX"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_act_35_self_improvement.json

          git diff --cached --quiet && exit 0

          git commit -m "Add NØX ACT35 self improvement loop"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              git reset --hard origin/main

              git add memory/nox_act_35_self_improvement.json
              git commit -m "Add NØX ACT35 self improvement loop" || true
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            sleep 5
          done

          echo "Push failed after retries."
          exit 1
