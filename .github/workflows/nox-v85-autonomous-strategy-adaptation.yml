name: NØX V85 Autonomous Strategy Adaptation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-v85-autonomous-strategy-adaptation
  cancel-in-progress: false

jobs:
  adapt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run V85
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          import requests

          BASE = "https://thecolony.ai/api/v1"
          MEMORY = "memory"

          os.makedirs(MEMORY, exist_ok=True)

          def now():
              return datetime.now(timezone.utc).isoformat()

          def load(path, default=None):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {} if default is None else default

          def save(path, data):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          v75 = load(
              f"{MEMORY}/nox_v75_evidence_weighted_opportunity_detector.json"
          )

          v76 = load(
              f"{MEMORY}/nox_v76_contextual_opportunity_verifier.json"
          )

          v77 = load(
              f"{MEMORY}/nox_v77_action_readiness_engine.json"
          )

          v78 = load(
              f"{MEMORY}/nox_v78_controlled_useful_action.json"
          )

          v79 = load(
              f"{MEMORY}/nox_v79_action_result_learning.json"
          )

          v80 = load(
              f"{MEMORY}/nox_v80_adaptive_decision_learning.json"
          )

          v81 = load(
              f"{MEMORY}/nox_v81_adaptive_action_prioritization.json"
          )

          v82 = load(
              f"{MEMORY}/nox_v82_autonomous_action_selection.json"
          )

          v83 = load(
              f"{MEMORY}/nox_v83_autonomous_action_execution.json"
          )

          v84 = load(
              f"{MEMORY}/nox_v84_autonomous_action_result_learning.json"
          )

          adaptive_signal = v84.get("adaptive_signal") or {}

          direction = str(
              adaptive_signal.get("direction") or "MAINTAIN_WITH_CAUTION"
          )

          strength = str(
              adaptive_signal.get("strength") or "LOW"
          )

          outcome = v84.get("outcome") or {}
          outcome_status = str(
              outcome.get("status") or "UNKNOWN"
          )

          decision_quality = str(
              (v84.get("learning") or {}).get("decision_quality")
              or "NOT_EVALUABLE"
          )

          effectiveness = str(
              (v84.get("learning") or {}).get("action_effectiveness")
              or "NOT_EVALUABLE"
          )

          previous_direction = str(
              (v80.get("adaptation") or {}).get("direction")
              or (v80.get("adaptive_policy") or {}).get("direction")
              or "NO_CHANGE"
          )

          # ------------------------------------------------------------
          # Build adaptive strategy
          # ------------------------------------------------------------

          strategy = {
              "opportunity_detection": {
                  "priority": "HIGH",
                  "principle": "Evidence convergence remains more important than keyword volume."
              },
              "context_verification": {
                  "priority": "HIGH",
                  "principle": "Verify the primary source before autonomous action."
              },
              "action_selection": {
                  "priority": "HIGH",
                  "principle": "Prefer concrete delegated work with a useful deliverable."
              },
              "response_learning": {
                  "priority": "HIGH",
                  "principle": "Use observed outcomes without treating silence as failure."
              },
              "payment_evidence": {
                  "priority": "HIGH",
                  "principle": "Declared payment is not verified settlement."
              }
          }

          proposed_changes = []
          rejected_changes = []

          # ------------------------------------------------------------
          # Adaptation logic
          # ------------------------------------------------------------

          if direction == "INCREASE_PRIORITY":
              proposed_changes.append({
                  "change": "Increase priority of opportunity patterns similar to the successful action.",
                  "basis": outcome_status,
                  "strength": strength
              })

          elif direction == "DECREASE_PRIORITY":
              proposed_changes.append({
                  "change": "Decrease priority of patterns similar to the negatively received action.",
                  "basis": outcome_status,
                  "strength": strength
              })

          elif direction == "MAINTAIN_WITH_CAUTION":
              proposed_changes.append({
                  "change": "Maintain current strategy while collecting additional outcome evidence.",
                  "basis": outcome_status,
                  "strength": strength
              })

          else:
              proposed_changes.append({
                  "change": "Make no directional strategy change until stronger outcome evidence exists.",
                  "basis": outcome_status,
                  "strength": strength
              })

          # ------------------------------------------------------------
          # Explicit safeguards against bad learning
          # ------------------------------------------------------------

          rejected_changes.append(
              "Do not lower opportunity priority solely because an action received no response."
          )

          rejected_changes.append(
              "Do not increase opportunity priority solely because a post contains payment language."
          )

          rejected_changes.append(
              "Do not convert a single observed outcome into a permanent detection rule."
          )

          rejected_changes.append(
              "Do not replace primary-source evidence with local memory summaries."
          )

          rejected_changes.append(
              "Do not automatically deploy a new detection or action rule."
          )

          # ------------------------------------------------------------
          # Determine adaptation confidence
          # ------------------------------------------------------------

          if outcome_status == "POTENTIAL_WORK_OPPORTUNITY":
              confidence = 0.90

          elif outcome_status == "PAYMENT_SIGNAL":
              confidence = 0.78

          elif outcome_status == "POSITIVE_SIGNAL":
              confidence = 0.80

          elif outcome_status == "NEGATIVE_SIGNAL":
              confidence = 0.80

          elif outcome_status == "NO_RESPONSE":
              confidence = 0.55

          else:
              confidence = 0.60

          if strength == "HIGH":
              confidence = min(0.95, confidence + 0.03)

          # ------------------------------------------------------------
          # Strategy state
          # ------------------------------------------------------------

          if direction == "INCREASE_PRIORITY":
              strategy_state = "ADAPTIVE_PRIORITY_INCREASE_PROPOSED"

          elif direction == "DECREASE_PRIORITY":
              strategy_state = "ADAPTIVE_PRIORITY_DECREASE_PROPOSED"

          elif direction == "MAINTAIN_WITH_CAUTION":
              strategy_state = "STRATEGY_MAINTAINED_WITH_CAUTION"

          else:
              strategy_state = "NO_STRATEGIC_CHANGE"

          result = {
              "version": "V85",
              "generated_at": now(),
              "mode": "autonomous_strategy_adaptation",
              "agent": {
                  "username": "nox_origine"
              },
              "inputs": {
                  "v75": bool(v75),
                  "v76": bool(v76),
                  "v77": bool(v77),
                  "v78": bool(v78),
                  "v79": bool(v79),
                  "v80": bool(v80),
                  "v81": bool(v81),
                  "v82": bool(v82),
                  "v83": bool(v83),
                  "v84": bool(v84)
              },
              "observed_result": {
                  "status": outcome_status,
                  "decision_quality": decision_quality,
                  "action_effectiveness": effectiveness,
                  "adaptive_direction": direction,
                  "adaptive_strength": strength
              },
              "previous_strategy_signal": {
                  "v80_direction": previous_direction
              },
              "strategy_state": strategy_state,
              "strategy": strategy,
              "proposed_changes": proposed_changes,
              "rejected_changes": rejected_changes,
              "learning": {
                  "principles": [
                      "Observed outcomes can influence future priorities.",
                      "One outcome is evidence, not a permanent rule.",
                      "No response is not equivalent to failure.",
                      "Positive response is not automatically proof of economic value.",
                      "Payment language requires independent verification.",
                      "Primary-source verification remains mandatory before consequential decisions.",
                      "Past errors remain regression cases."
                  ],
                  "regression_cases": [
                      "REG-V62-GENERIC-DEMAND-FALSE-POSITIVE",
                      "REG-V64-ANALYSIS-FALSE-POSITIVE",
                      "REG-V67-OVER-PRUNING",
                      "REG-V69-TASK-WITHOUT-DEMAND",
                      "REG-V72-INPUT-RECOVERY-FAILURE",
                      "REG-V74-SELF-EVIDENCE-CONTAMINATION",
                      "REG-V79-NO-RESPONSE-IS-NOT-FAILURE",
                      "REG-V82-STALE-AUTONOMOUS-SELECTION",
                      "REG-V83-EXECUTION-RESULT-REQUIRES-PRIMARY-SOURCE",
                      "REG-V84-OUTCOME-MUST-BE-OBSERVED-BEFORE-ADAPTATION"
                  ]
              },
              "decision": {
                  "answer_status": "ADAPTATION_PROPOSED",
                  "confidence": confidence,
                  "automatic_strategy_change": False,
                  "human_review_required_for_major_change": True,
                  "future_versions_may_use_signal": True
              },
              "autonomy": {
                  "outcome_interpretation": True,
                  "strategy_generation": True,
                  "priority_adaptation_proposal": True,
                  "automatic_rule_deployment": False,
                  "external_action": False
              },
              "next_stage": {
                  "version": "V86",
                  "purpose": "Test adaptive strategy signals against new live opportunity data before allowing stronger autonomous prioritization."
              },
              "safety": {
                  "automatic_external_action": False,
                  "automatic_contact": False,
                  "automatic_bidding": False,
                  "automatic_payment": False,
                  "gemini_disabled": True,
                  "zero_cost_constraint": True
              }
          }

          save(
              f"{MEMORY}/nox_v85_autonomous_strategy_adaptation.json",
              result
          )

          md = []

          md.append("# NØX V85 — Autonomous Strategy Adaptation")
          md.append("")
          md.append(f"Generated: {result['generated_at']}")
          md.append("")
          md.append("## Observed V84 result")
          md.append("")
          md.append(f"- Outcome: {outcome_status}")
          md.append(f"- Decision quality: {decision_quality}")
          md.append(f"- Action effectiveness: {effectiveness}")
          md.append(f"- Direction: {direction}")
          md.append(f"- Strength: {strength}")
          md.append("")
          md.append("## Strategy state")
          md.append("")
          md.append(f"- {strategy_state}")
          md.append("")
          md.append("## Proposed adaptation")
          md.append("")

          for change in proposed_changes:
              md.append(
                  f"- {change['change']} "
                  f"(basis: {change['basis']}, strength: {change['strength']})"
              )

          md.append("")
          md.append("## Changes explicitly rejected")
          md.append("")

          for item in rejected_changes:
              md.append(f"- {item}")

          md.append("")
          md.append("## Learning principles")
          md.append("")

          for item in result["learning"]["principles"]:
              md.append(f"- {item}")

          md.append("")
          md.append("## Decision")
          md.append("")
          md.append("- Adaptation is generated autonomously.")
          md.append("- Major rule deployment remains disabled.")
          md.append("- Future versions may use this signal.")
          md.append(
              f"- Confidence: {result['decision']['confidence']}"
          )

          md.append("")
          md.append("## Next stage")
          md.append("")
          md.append(
              "V86 — Test adaptive strategy signals against new live opportunity data."
          )

          md.append("")
          md.append("## Safety")
          md.append("")
          md.append("- No automatic external action.")
          md.append("- No DM.")
          md.append("- No bidding.")
          md.append("- No payment.")
          md.append("- Gemini disabled.")
          md.append("- Project cost: €0.")
          md.append("")

          with open(
              f"{MEMORY}/nox_v85_autonomous_strategy_adaptation.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(md))

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Commit V85
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_v85_autonomous_strategy_adaptation.json
          git add memory/nox_v85_autonomous_strategy_adaptation.md

          git diff --cached --quiet || \
            git commit -m "NØX V85 autonomous strategy adaptation"

          git push
