name: NØX ACT 02 - SINCE / DM Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  since-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Run complete SINCE diagnostic
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: python -u <<'PY'
import json
import os
import sys
import time
from typing import Any

import requests


BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

if not API_KEY:
    print("FATAL: COLONY_API_KEY is missing")
    sys.exit(1)


session = requests.Session()
session.headers.update({
    "Accept": "application/json",
    "User-Agent": "Nox-Origin-ACT02-SINCE-Diagnostic/1.0",
})


def safe_error_payload(data: Any) -> Any:
    """
    Keep validation/error metadata while removing possible message content.
    This prevents private DM/post content from appearing in Actions logs.
    """
    sensitive_keys = {
        "body",
        "content",
        "text",
        "messages",
        "direct_messages",
        "dms",
        "posts",
        "notifications",
        "comments",
        "conversation",
        "conversation_data",
        "message_data",
    }

    if isinstance(data, dict):
        cleaned = {}
        for key, value in data.items():
            key_lower = str(key).lower()

            if key_lower in sensitive_keys:
                if isinstance(value, list):
                    cleaned[key] = f"<REDACTED LIST: {len(value)} items>"
                elif isinstance(value, dict):
                    cleaned[key] = "<REDACTED OBJECT>"
                else:
                    cleaned[key] = "<REDACTED>"
            else:
                cleaned[key] = safe_error_payload(value)

        return cleaned

    if isinstance(data, list):
        return [safe_error_payload(x) for x in data]

    return data


def print_response(label: str, response: requests.Response):
    print(f"\n--- {label} ---")
    print("STATUS:", response.status_code)
    print("CONTENT-TYPE:", response.headers.get("content-type"))
    print("REQUEST URL:", response.request.url)

    request_headers = dict(response.request.headers)
    if "Authorization" in request_headers:
        request_headers["Authorization"] = "<REDACTED>"
    if "X-API-Key" in request_headers:
        request_headers["X-API-Key"] = "<REDACTED>"

    print("REQUEST HEADERS:", json.dumps(request_headers, indent=2))

    try:
        data = response.json()
        safe = safe_error_payload(data)
        print("RESPONSE JSON:")
        print(json.dumps(safe, indent=2, ensure_ascii=False))
        return data
    except Exception:
        text = response.text or ""
        if len(text) > 4000:
            text = text[:4000] + "...<TRUNCATED>"
        print("RESPONSE TEXT:")
        print(text)
        return None


def auth():
    print("\n==================================================")
    print("1. AUTHENTICATION")
    print("==================================================")

    url = f"{BASE_URL}/auth/token"

    start = time.monotonic()

    try:
        response = session.post(
            url,
            headers={
                "Content-Type": "application/json",
            },
            json={
                "api_key": API_KEY
            },
            timeout=15,
        )
    except Exception as exc:
        print("AUTH EXCEPTION:", repr(exc))
        sys.exit(1)

    elapsed = time.monotonic() - start

    print_response("AUTH TOKEN", response)
    print("DURATION:", f"{elapsed:.2f}s")

    if response.status_code != 200:
        print("FATAL: authentication failed")
        sys.exit(1)

    try:
        data = response.json()
    except Exception:
        print("FATAL: auth response is not valid JSON")
        sys.exit(1)

    token = (
        data.get("access_token")
        or data.get("token")
        or data.get("jwt")
    )

    if not token:
        print("FATAL: authentication succeeded but no token was found")
        print("AUTH RESPONSE KEYS:", list(data.keys()))
        sys.exit(1)

    session.headers.update({
        "Authorization": f"Bearer {token}",
        "Content-Type": "application/json",
    })

    print("JWT: PRESENT")
    print("AUTHENTICATION: OK")

    return token


def get_identity():
    print("\n==================================================")
    print("2. IDENTITY")
    print("==================================================")

    start = time.monotonic()

    try:
        response = session.get(
            f"{BASE_URL}/users/me",
            timeout=15,
        )
    except Exception as exc:
        print("IDENTITY EXCEPTION:", repr(exc))
        return None

    elapsed = time.monotonic() - start

    print_response("IDENTITY", response)
    print("DURATION:", f"{elapsed:.2f}s")

    if response.status_code != 200:
        print("WARNING: identity endpoint did not return 200")
        return None

    try:
        data = response.json()
    except Exception:
        return None

    username = (
        data.get("username")
        or data.get("handle")
        or data.get("name")
    )

    print("NOX USERNAME:", username)
    return username


def call_since(label, params=None):
    print("\n==================================================")
    print(label)
    print("==================================================")

    if params is None:
        params = {}

    print("PARAMETERS:", json.dumps(params, indent=2))

    start = time.monotonic()

    try:
        response = session.get(
            f"{BASE_URL}/since",
            params=params,
            timeout=15,
        )
    except Exception as exc:
        print("SINCE EXCEPTION:", repr(exc))
        return None

    elapsed = time.monotonic() - start

    data = print_response("SINCE RESPONSE", response)
    print("DURATION:", f"{elapsed:.2f}s")

    if response.status_code == 200 and isinstance(data, dict):
        print("\nSINCE STRUCTURE:")

        for key in [
            "cursor",
            "next_cursor",
            "notifications",
            "messages",
            "direct_messages",
            "dms",
            "posts",
        ]:
            if key not in data:
                print(f"  {key}: ABSENT")
                continue

            value = data[key]

            if isinstance(value, list):
                print(f"  {key}: PRESENT ({len(value)} items)")
            elif value is None:
                print(f"  {key}: PRESENT (null)")
            else:
                print(f"  {key}: PRESENT ({type(value).__name__})")

        cursor = data.get("cursor") or data.get("next_cursor")

        if cursor:
            print("CURSOR: PRESENT")
            print("CURSOR TYPE:", type(cursor).__name__)
            print("CURSOR LENGTH:", len(str(cursor)))
        else:
            print("CURSOR: NONE")

    return response


def notification_diagnostic():
    print("\n==================================================")
    print("3. NOTIFICATION COMPARISON")
    print("==================================================")

    start = time.monotonic()

    try:
        response = session.get(
            f"{BASE_URL}/notifications",
            params={
                "unread_only": "true",
                "limit": "10",
            },
            timeout=15,
        )
    except Exception as exc:
        print("NOTIFICATION EXCEPTION:", repr(exc))
        return

    elapsed = time.monotonic() - start

    data = print_response("NOTIFICATIONS", response)
    print("DURATION:", f"{elapsed:.2f}s")

    if response.status_code != 200:
        print("NOTIFICATIONS STATUS:", response.status_code)
        return

    if isinstance(data, list):
        items = data
    elif isinstance(data, dict):
        items = (
            data.get("notifications")
            or data.get("items")
            or []
        )
    else:
        items = []

    print("NOTIFICATION ITEMS:", len(items))

    types = {}

    for item in items:
        if not isinstance(item, dict):
            continue

        notification_type = item.get("notification_type")

        types[notification_type] = types.get(notification_type, 0) + 1

    print("NOTIFICATION TYPES:")
    print(json.dumps(types, indent=2, ensure_ascii=False))

    for index, item in enumerate(items[:10], start=1):
        if not isinstance(item, dict):
            continue

        print(f"\nNOTIFICATION {index}")

        for key in [
            "id",
            "notification_type",
            "sender_username",
            "actor",
            "message_id",
            "conversation_id",
            "post_id",
            "comment_id",
            "is_read",
            "created_at",
        ]:
            if key in item:
                value = item[key]

                if key in {
                    "actor",
                }:
                    print(f"  {key}: <OBJECT REDACTED>")
                else:
                    print(f"  {key}: {value!r}")


def conversations_diagnostic():
    print("\n==================================================")
    print("4. CONVERSATION LIST COMPARISON")
    print("==================================================")

    start = time.monotonic()

    try:
        response = session.get(
            f"{BASE_URL}/messages/conversations",
            timeout=15,
        )
    except Exception as exc:
        print("CONVERSATIONS EXCEPTION:", repr(exc))
        return

    elapsed = time.monotonic() - start

    print_response("CONVERSATIONS", response)
    print("DURATION:", f"{elapsed:.2f}s")

    if response.status_code == 200:
        try:
            data = response.json()

            if isinstance(data, list):
                print("CONVERSATIONS COUNT:", len(data))
            elif isinstance(data, dict):
                for key in ["conversations", "items", "data"]:
                    value = data.get(key)

                    if isinstance(value, list):
                        print(f"CONVERSATIONS COUNT ({key}):", len(value))
                        break
        except Exception:
            pass


def main():
    print("==================================================")
    print("NØX ACT 02 - COMPLETE SINCE DIAGNOSTIC")
    print("==================================================")
    print("PURPOSE: diagnose /since without sending or modifying anything")
    print("PRIVATE CONTENT: REDACTED FROM ERROR/DIAGNOSTIC OUTPUT")
    print("GEMINI: OFF")
    print("PAYMENTS: OFF")
    print("MARKETPLACE ACTIONS: OFF")
    print("MEMORY WRITE: OFF")
    print("DM SEND: OFF")
    print("COMMENT SEND: OFF")
    print("NOTIFICATION MARK-AS-READ: OFF")

    auth()
    username = get_identity()

    # ----------------------------------------------------------
    # TEST A
    # Official documented first call:
    # GET /since WITHOUT cursor
    # ----------------------------------------------------------
    response_a = call_since(
        "5. SINCE TEST A - NO CURSOR (DOCUMENTED FIRST CALL)",
        params={}
    )

    # ----------------------------------------------------------
    # If A fails with 422, test an explicitly empty cursor.
    # This is diagnostic only; it does NOT assume this is correct.
    # ----------------------------------------------------------
    response_b = None

    if response_a is not None and response_a.status_code == 422:
        response_b = call_since(
            "6. SINCE TEST B - EXPLICIT EMPTY CURSOR",
            params={
                "cursor": ""
            }
        )

    # ----------------------------------------------------------
    # If still 422, test a small limit.
    # This checks whether the API currently requires pagination.
    # ----------------------------------------------------------
    response_c = None

    if (
        response_a is not None
        and response_a.status_code == 422
        and (
            response_b is None
            or response_b.status_code == 422
        )
    ):
        response_c = call_since(
            "7. SINCE TEST C - LIMIT=1",
            params={
                "limit": "1"
            }
        )

    # ----------------------------------------------------------
    # Comparison endpoints.
    # These are read-only.
    # ----------------------------------------------------------
    notification_diagnostic()
    conversations_diagnostic()

    print("\n==================================================")
    print("8. FINAL DIAGNOSTIC RESULT")
    print("==================================================")

    def status_of(response):
        if response is None:
            return "NOT RUN"
        return str(response.status_code)

    print("SINCE TEST A (no cursor):", status_of(response_a))
    print("SINCE TEST B (cursor=empty):", status_of(response_b))
    print("SINCE TEST C (limit=1):", status_of(response_c))

    statuses = [
        response_a.status_code if response_a else None,
        response_b.status_code if response_b else None,
        response_c.status_code if response_c else None,
    ]

    if 200 in statuses:
        print("\nRESULT: /since ACCEPTED AT LEAST ONE REQUEST FORM.")
        print("NEXT STEP: inspect the successful SINCE structure above.")
        print("A working messages array means ACT02 V11 can be corrected.")
    elif 401 in statuses or 403 in statuses:
        print("\nRESULT: AUTHORIZATION PROBLEM.")
        print("The API accepted the route but rejected authorization.")
    elif 404 in statuses:
        print("\nRESULT: /since ROUTE NOT FOUND.")
        print("The endpoint documented for the current API is not available at this base URL.")
    elif 422 in statuses:
        print("\nRESULT: /since VALIDATION ERROR.")
        print("The exact sanitized API validation response is printed above.")
        print("DO NOT CHANGE ACT02 YET.")
        print("Use the validation fields to determine the correct request shape.")
    elif any(statuses):
        print("\nRESULT: /since RETURNED ANOTHER HTTP ERROR.")
        print("Use the exact status and sanitized response above.")
    else:
        print("\nRESULT: /since COULD NOT BE REACHED.")

    print("\nNO ACTION WAS PERFORMED.")
    print("No DM sent.")
    print("No comment sent.")
    print("No notification marked read.")
    print("No memory file modified.")
    print("No git commit.")
    print("No git push.")

    print("\n==================================================")
    print("END DIAGNOSTIC")
    print("==================================================")


if __name__ == "__main__":
    main()
PY
