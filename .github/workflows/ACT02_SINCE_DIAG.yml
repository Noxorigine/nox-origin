name: NØX ACT 02 - SINCE API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  since-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLONY_BASE_URL: https://thecolony.ai/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Run SINCE diagnostic
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
        run: |
          cat > /tmp/since_diag.py <<'PYTHON'
          import json
          import os
          import sys
          import time

          import requests


          BASE_URL = os.environ["COLONY_BASE_URL"].rstrip("/")
          API_KEY = os.environ.get("COLONY_API_KEY", "").strip()

          if not API_KEY:
              print("FATAL: COLONY_API_KEY is missing")
              sys.exit(1)


          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "User-Agent": "Nox-Origin-ACT02-SINCE-Diagnostic/1.0",
          })


          SENSITIVE_KEYS = {
              "body",
              "content",
              "text",
              "messages",
              "direct_messages",
              "dms",
              "posts",
              "notifications",
              "comments",
              "conversation",
              "conversation_data",
              "message_data",
          }


          def sanitize(value, key=None):
              if key is not None and str(key).lower() in SENSITIVE_KEYS:
                  if isinstance(value, list):
                      return "<REDACTED LIST: %d items>" % len(value)
                  if isinstance(value, dict):
                      return "<REDACTED OBJECT>"
                  return "<REDACTED>"

              if isinstance(value, dict):
                  return {
                      str(k): sanitize(v, k)
                      for k, v in value.items()
                  }

              if isinstance(value, list):
                  return [
                      sanitize(item)
                      for item in value
                  ]

              return value


          def print_response(label, response):
              print("")
              print("=" * 60)
              print(label)
              print("=" * 60)

              print("STATUS:", response.status_code)
              print(
                  "CONTENT-TYPE:",
                  response.headers.get("content-type")
              )
              print(
                  "REQUEST URL:",
                  response.request.url
              )

              headers = dict(response.request.headers)

              if "Authorization" in headers:
                  headers["Authorization"] = "<REDACTED>"

              if "X-API-Key" in headers:
                  headers["X-API-Key"] = "<REDACTED>"

              print("REQUEST HEADERS:")
              print(
                  json.dumps(
                      headers,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              try:
                  data = response.json()

                  print("RESPONSE JSON:")
                  print(
                      json.dumps(
                          sanitize(data),
                          indent=2,
                          ensure_ascii=False
                      )
                  )

                  return data

              except Exception:
                  text = response.text or ""

                  if len(text) > 4000:
                      text = text[:4000] + "...<TRUNCATED>"

                  print("RESPONSE TEXT:")
                  print(text)

                  return None


          def authenticate():
              print("")
              print("=" * 60)
              print("1. AUTHENTICATION")
              print("=" * 60)

              start = time.monotonic()

              try:
                  response = session.post(
                      f"{BASE_URL}/auth/token",
                      headers={
                          "Content-Type": "application/json"
                      },
                      json={
                          "api_key": API_KEY
                      },
                      timeout=15,
                  )

              except Exception as exc:
                  print("AUTH EXCEPTION:", repr(exc))
                  sys.exit(1)

              elapsed = time.monotonic() - start

              print_response(
                  "AUTH TOKEN RESPONSE",
                  response
              )

              print(
                  "AUTH DURATION:",
                  "%.2fs" % elapsed
              )

              if response.status_code != 200:
                  print("FATAL: authentication failed")
                  sys.exit(1)

              try:
                  data = response.json()
              except Exception:
                  print(
                      "FATAL: authentication response "
                      "is not valid JSON"
                  )
                  sys.exit(1)

              token = (
                  data.get("access_token")
                  or data.get("token")
                  or data.get("jwt")
              )

              if not token:
                  print(
                      "FATAL: no JWT found in authentication response"
                  )
                  print(
                      "AUTH RESPONSE KEYS:",
                      list(data.keys())
                  )
                  sys.exit(1)

              session.headers.update({
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              })

              print("JWT: PRESENT")
              print("AUTHENTICATION: OK")


          def identity():
              print("")
              print("=" * 60)
              print("2. IDENTITY")
              print("=" * 60)

              start = time.monotonic()

              try:
                  response = session.get(
                      f"{BASE_URL}/users/me",
                      timeout=15,
                  )

              except Exception as exc:
                  print(
                      "IDENTITY EXCEPTION:",
                      repr(exc)
                  )
                  return

              elapsed = time.monotonic() - start

              print_response(
                  "IDENTITY RESPONSE",
                  response
              )

              print(
                  "IDENTITY DURATION:",
                  "%.2fs" % elapsed
              )

              if response.status_code == 200:
                  try:
                      data = response.json()

                      username = (
                          data.get("username")
                          or data.get("handle")
                          or data.get("name")
                      )

                      print(
                          "NOX USERNAME:",
                          username
                      )

                  except Exception:
                      pass


          def test_since(label, params):
              print("")
              print("=" * 60)
              print(label)
              print("=" * 60)

              print(
                  "PARAMETERS:",
                  json.dumps(
                      params,
                      indent=2
                  )
              )

              start = time.monotonic()

              try:
                  response = session.get(
                      f"{BASE_URL}/since",
                      params=params,
                      timeout=15,
                  )

              except Exception as exc:
                  print(
                      "SINCE EXCEPTION:",
                      repr(exc)
                  )
                  return None

              elapsed = time.monotonic() - start

              data = print_response(
                  "SINCE RESPONSE",
                  response
              )

              print(
                  "SINCE DURATION:",
                  "%.2fs" % elapsed
              )

              if response.status_code == 200:
                  print("")
                  print("SINCE REQUEST ACCEPTED")

                  if isinstance(data, dict):
                      print("")
                      print("RESPONSE STRUCTURE:")

                      for key in [
                          "cursor",
                          "next_cursor",
                          "notifications",
                          "messages",
                          "direct_messages",
                          "dms",
                          "posts",
                      ]:
                          if key not in data:
                              print(
                                  f"  {key}: ABSENT"
                              )
                              continue

                          value = data[key]

                          if isinstance(value, list):
                              print(
                                  f"  {key}: PRESENT "
                                  f"({len(value)} items)"
                              )

                          elif value is None:
                              print(
                                  f"  {key}: PRESENT (null)"
                              )

                          else:
                              print(
                                  f"  {key}: PRESENT "
                                  f"({type(value).__name__})"
                              )

                      cursor = (
                          data.get("cursor")
                          or data.get("next_cursor")
                      )

                      if cursor:
                          print(
                              "CURSOR: PRESENT"
                          )
                          print(
                              "CURSOR TYPE:",
                              type(cursor).__name__
                          )
                          print(
                              "CURSOR LENGTH:",
                              len(str(cursor))
                          )
                      else:
                          print("CURSOR: NONE")

              return response


          def notifications_comparison():
              print("")
              print("=" * 60)
              print("NOTIFICATIONS COMPARISON")
              print("=" * 60)

              start = time.monotonic()

              try:
                  response = session.get(
                      f"{BASE_URL}/notifications",
                      params={
                          "unread_only": "true",
                          "limit": "10",
                      },
                      timeout=15,
                  )

              except Exception as exc:
                  print(
                      "NOTIFICATIONS EXCEPTION:",
                      repr(exc)
                  )
                  return

              elapsed = time.monotonic() - start

              data = print_response(
                  "NOTIFICATIONS RESPONSE",
                  response
              )

              print(
                  "NOTIFICATIONS DURATION:",
                  "%.2fs" % elapsed
              )

              if response.status_code != 200:
                  return

              if isinstance(data, list):
                  items = data

              elif isinstance(data, dict):
                  items = (
                      data.get("notifications")
                      or data.get("items")
                      or []
                  )

              else:
                  items = []

              print(
                  "NOTIFICATION ITEMS:",
                  len(items)
              )

              types = {}

              for item in items:
                  if not isinstance(item, dict):
                      continue

                  notification_type = item.get(
                      "notification_type"
                  )

                  types[notification_type] = (
                      types.get(
                          notification_type,
                          0
                      ) + 1
                  )

              print("NOTIFICATION TYPES:")
              print(
                  json.dumps(
                      types,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              for index, item in enumerate(
                  items[:10],
                  start=1
              ):
                  if not isinstance(item, dict):
                      continue

                  print("")
                  print(
                      f"NOTIFICATION {index}"
                  )

                  for key in [
                      "id",
                      "notification_type",
                      "sender_username",
                      "message_id",
                      "conversation_id",
                      "post_id",
                      "comment_id",
                      "is_read",
                      "created_at",
                  ]:
                      if key in item:
                          print(
                              f"  {key}: "
                              f"{item[key]!r}"
                          )


          def conversations_comparison():
              print("")
              print("=" * 60)
              print("CONVERSATIONS COMPARISON")
              print("=" * 60)

              start = time.monotonic()

              try:
                  response = session.get(
                      f"{BASE_URL}/messages/conversations",
                      timeout=15,
                  )

              except Exception as exc:
                  print(
                      "CONVERSATIONS EXCEPTION:",
                      repr(exc)
                  )
                  return

              elapsed = time.monotonic() - start

              print_response(
                  "CONVERSATIONS RESPONSE",
                  response
              )

              print(
                  "CONVERSATIONS DURATION:",
                  "%.2fs" % elapsed
              )


          def main():
              print("=" * 60)
              print("NØX ACT 02 - COMPLETE SINCE DIAGNOSTIC")
              print("=" * 60)
              print("PURPOSE: diagnose /since")
              print("DM SEND: OFF")
              print("COMMENT SEND: OFF")
              print("MARK AS READ: OFF")
              print("MEMORY WRITE: OFF")
              print("GIT WRITE: OFF")
              print("GEMINI: OFF")
              print("PAYMENTS: OFF")
              print("MARKETPLACE ACTIONS: OFF")

              authenticate()
              identity()

              # TEST A:
              # Official documented first call.
              # Cursor intentionally omitted.
              response_a = test_since(
                  "3. SINCE TEST A - NO CURSOR",
                  {}
              )

              response_b = None
              response_c = None

              # TEST B:
              # Only executed if the documented request
              # returned HTTP 422.
              if (
                  response_a is not None
                  and response_a.status_code == 422
              ):
                  response_b = test_since(
                      "4. SINCE TEST B - EMPTY CURSOR",
                      {
                          "cursor": ""
                      }
                  )

              # TEST C:
              # Only executed if A and B both indicate
              # a validation problem.
              if (
                  response_a is not None
                  and response_a.status_code == 422
                  and (
                      response_b is None
                      or response_b.status_code == 422
                  )
              ):
                  response_c = test_since(
                      "5. SINCE TEST C - LIMIT 1",
                      {
                          "limit": "1"
                      }
                  )

              notifications_comparison()
              conversations_comparison()

              print("")
              print("=" * 60)
              print("FINAL RESULT")
              print("=" * 60)

              status_a = (
                  response_a.status_code
                  if response_a is not None
                  else "NOT RUN"
              )

              status_b = (
                  response_b.status_code
                  if response_b is not None
                  else "NOT RUN"
              )

              status_c = (
                  response_c.status_code
                  if response_c is not None
                  else "NOT RUN"
              )

              print(
                  "SINCE A - NO CURSOR:",
                  status_a
              )
              print(
                  "SINCE B - EMPTY CURSOR:",
                  status_b
              )
              print(
                  "SINCE C - LIMIT 1:",
                  status_c
              )

              statuses = [
                  response_a.status_code
                  if response_a is not None
                  else None,
                  response_b.status_code
                  if response_b is not None
                  else None,
                  response_c.status_code
                  if response_c is not None
                  else None,
              ]

              if 200 in statuses:
                  print("")
                  print(
                      "RESULT: SINCE ACCEPTED."
                  )
                  print(
                      "Inspect the successful response structure."
                  )

              elif 422 in statuses:
                  print("")
                  print(
                      "RESULT: SINCE VALIDATION ERROR."
                  )
                  print(
                      "Use the sanitized error details above."
                  )

              elif 401 in statuses or 403 in statuses:
                  print("")
                  print(
                      "RESULT: AUTHORIZATION ERROR."
                  )

              elif 404 in statuses:
                  print("")
                  print(
                      "RESULT: SINCE ROUTE NOT FOUND."
                  )

              else:
                  print("")
                  print(
                      "RESULT: SINCE COULD NOT BE VALIDATED."
                  )

              print("")
              print("NO ACTION WAS PERFORMED.")
              print("No DM sent.")
              print("No comment sent.")
              print("No notification marked read.")
              print("No memory modified.")
              print("No git commit.")
              print("No git push.")
              print("")
              print("END DIAGNOSTIC")


          if __name__ == "__main__":
              main()
          PYTHON

          python -u /tmp/since_diag.py
