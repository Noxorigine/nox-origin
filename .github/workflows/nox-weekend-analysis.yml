name: NØX Origin - Weekend Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  nox-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze NØX memory
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          MEMORY_FILE = "memory/nox_memory.json"
          REPORT_FILE = "memory/nox_weekend_report.md"

          print("====================================")
          print("NØX ORIGIN - WEEKEND ANALYSIS")
          print("====================================")

          # --------------------------------------------------
          # 1. LOAD MEMORY
          # --------------------------------------------------

          if not os.path.exists(MEMORY_FILE):
              raise RuntimeError(
                  "NØX memory file not found."
              )

          with open(
              MEMORY_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              memory = json.load(f)

          observations = memory.get("observations", [])
          decisions = memory.get("decisions", [])
          actions = memory.get("actions", [])
          learnings = memory.get("learnings", [])

          print(f"Observations: {len(observations)}")
          print(f"Decisions: {len(decisions)}")
          print(f"Actions: {len(actions)}")
          print(f"Learnings: {len(learnings)}")

          # --------------------------------------------------
          # 2. ANALYSE ACTIONS
          # --------------------------------------------------

          action_titles = Counter()
          action_kinds = Counter()
          action_categories = Counter()
          action_scores = defaultdict(list)

          for item in actions:
              action = item.get("action", {})

              title = action.get("title")
              kind = action.get("kind")
              category = action.get("category")
              score = action.get("score")

              if title:
                  action_titles[title] += 1

              if kind:
                  action_kinds[kind] += 1

              if category:
                  action_categories[category] += 1

              if isinstance(score, (int, float)):
                  if title:
                      action_scores[title].append(score)

          # --------------------------------------------------
          # 3. ANALYSE OBSERVATIONS
          # --------------------------------------------------

          authors = Counter()
          colonies = Counter()
          tags = Counter()

          for observation in observations:
              feed = observation.get("feed", {})

              items = []

              if isinstance(feed, dict):
                  items = feed.get("items", [])

              if not isinstance(items, list):
                  continue

              for item in items:
                  post = item.get("post", {})

                  author = post.get("author", {})
                  username = author.get("username")

                  if username:
                      authors[username] += 1

                  colony = post.get("colony_name")

                  if colony:
                      colonies[colony] += 1

                  post_tags = post.get("tags", [])

                  if isinstance(post_tags, list):
                      for tag in post_tags:
                          if isinstance(tag, str):
                              tags[tag] += 1

          # --------------------------------------------------
          # 4. DETECT REPETITION
          # --------------------------------------------------

          repeated_actions = [
              (title, count)
              for title, count in action_titles.items()
              if count > 1
          ]

          repeated_actions.sort(
              key=lambda x: x[1],
              reverse=True
          )

          # --------------------------------------------------
          # 5. DETECT DIVERSITY
          # --------------------------------------------------

          unique_action_types = len(action_kinds)
          unique_action_titles = len(action_titles)
          unique_agents = len(authors)

          # --------------------------------------------------
          # 6. BUILD REPORT
          # --------------------------------------------------

          now = datetime.now(
              timezone.utc
          ).isoformat()

          report = []

          report.append(
              "# NØX ORIGIN — WEEKEND INTELLIGENCE REPORT"
          )

          report.append("")
          report.append(
              f"Generated: {now}"
          )

          report.append("")
          report.append(
              "## 1. Executive Summary"
          )

          report.append("")

          report.append(
              f"- Observations recorded: {len(observations)}"
          )

          report.append(
              f"- Decisions recorded: {len(decisions)}"
          )

          report.append(
              f"- Actions recorded: {len(actions)}"
          )

          report.append(
              f"- Learning records: {len(learnings)}"
          )

          report.append(
              f"- Different action types: {unique_action_types}"
          )

          report.append(
              f"- Different action titles: {unique_action_titles}"
          )

          report.append(
              f"- Agents observed: {unique_agents}"
          )

          # --------------------------------------------------
          # 7. ACTION PATTERNS
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 2. Action Patterns"
          )

          if action_titles:
              for title, count in action_titles.most_common(10):
                  report.append(
                      f"- **{title}** — {count} occurrence(s)"
                  )
          else:
              report.append(
                  "- No actions recorded."
              )

          # --------------------------------------------------
          # 8. ACTION TYPES
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 3. Action Types"
          )

          if action_kinds:
              for kind, count in action_kinds.most_common(10):
                  report.append(
                      f"- `{kind}` — {count}"
                  )
          else:
              report.append(
                  "- No action types detected."
              )

          # --------------------------------------------------
          # 9. MOST OBSERVED AGENTS
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 4. Most Observed Agents"
          )

          if authors:
              for username, count in authors.most_common(15):
                  report.append(
                      f"- **@{username}** — {count} observation(s)"
                  )
          else:
              report.append(
                  "- No agents detected."
              )

          # --------------------------------------------------
          # 10. COLONIES
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 5. Most Observed Colonies"
          )

          if colonies:
              for colony, count in colonies.most_common(10):
                  report.append(
                      f"- **{colony}** — {count}"
                  )
          else:
              report.append(
                  "- No colonies detected."
              )

          # --------------------------------------------------
          # 11. TAGS
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 6. Recurrent Topics / Tags"
          )

          if tags:
              for tag, count in tags.most_common(15):
                  report.append(
                      f"- `{tag}` — {count}"
                  )
          else:
              report.append(
                  "- No tags detected."
              )

          # --------------------------------------------------
          # 12. REPETITION WARNING
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 7. Repetition Analysis"
          )

          if repeated_actions:
              report.append(
                  "NØX is repeating some actions:"
              )

              for title, count in repeated_actions[:10]:
                  report.append(
                      f"- **{title}** — repeated {count} times"
                  )

              report.append("")
              report.append(
                  "**Interpretation:** repeated actions should "
                  "be reviewed before being considered learning."
              )

          else:
              report.append(
                  "No repeated action pattern detected."
              )

          # --------------------------------------------------
          # 13. LEARNING QUALITY
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 8. Learning Quality"
          )

          if len(action_titles) <= 1:
              report.append(
                  "- **Low diversity:** NØX is still performing "
                  "a very narrow range of actions."
              )

          elif len(action_titles) <= 3:
              report.append(
                  "- **Developing:** NØX has begun exploring "
                  "multiple action types."
              )

          else:
              report.append(
                  "- **Growing diversity:** NØX is exploring "
                  "several different actions."
              )

          if repeated_actions:
              report.append(
                  "- Repetition detected: future versions should "
                  "learn to evaluate whether previous actions "
                  "actually produced useful results."
              )
          else:
              report.append(
                  "- No major action repetition detected."
              )

          # --------------------------------------------------
          # 14. IMPORTANT LIMITATION
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 9. Important Limitation"
          )

          report.append(
              "This report does NOT claim that NØX has learned "
              "something merely because an observation was stored."
          )

          report.append("")
          report.append(
              "A genuine learning signal requires:"
          )

          report.append(
              "1. observation"
          )

          report.append(
              "2. decision"
          )

          report.append(
              "3. action"
          )

          report.append(
              "4. measurable result"
          )

          report.append(
              "5. conclusion"
          )

          report.append(
              "6. change in a future decision"
          )

          # --------------------------------------------------
          # 15. NEXT DEVELOPMENT TARGET
          # --------------------------------------------------

          report.append("")
          report.append(
              "## 10. Recommended Next Development"
          )

          report.append(
              "The next major improvement should connect "
              "actions to their results."
          )

          report.append("")
          report.append(
              "NØX should eventually be able to answer:"
          )

          report.append(
              "- What did I do?"
          )

          report.append(
              "- What happened afterward?"
          )

          report.append(
              "- Did it work?"
          )

          report.append(
              "- Why?"
          )

          report.append(
              "- Should I repeat it?"
          )

          report.append(
              "- Should I avoid it?"
          )

          report.append(
              "- What should I try next?"
          )

          # --------------------------------------------------
          # 16. SAVE REPORT
          # --------------------------------------------------

          os.makedirs(
              "memory",
              exist_ok=True
          )

          with open(
              REPORT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(report)
              )

          print()
          print("====================================")
          print("NØX WEEKEND REPORT CREATED")
          print("====================================")

          print(
              f"Report: {REPORT_FILE}"
          )

          print(
              f"Report lines: {len(report)}"
          )

          PY

      - name: Save NØX report
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_weekend_report.md

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "NØX: generate intelligence report"
            git push
          fi
