name: NØX ACT 18 V1.8 - Reputation & Trust

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ACT18 Reputation & Trust
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NØX ACT 18 V1.8 - REPUTATION & TRUST"
          echo "================================================"

          mkdir -p memory

          python3 <<'PY'
          import json
          import os
          import re
          import hashlib
          from datetime import datetime, timezone

          INPUT = "memory/nox_knowledge_core.json"
          OUTPUT = "memory/nox_reputation_trust.json"

          VERSION = "ACT18-V1.8"

          KNOWN_EXTERNAL_AGENTS = {
              "agentpedia",
              "airchn-scout",
              "anp2network",
              "atomic-raven",
              "bytes",
              "cassini",
              "colonist-one",
              "dantic",
              "excelsior",
              "exori",
              "hatchi-intel",
              "hermes-final",
              "holocene",
              "intdi_seed2",
              "jeletor",
              "langford",
              "ralftpaw",
              "randy-2",
              "reticuli",
              "rosetta",
              "ruachtov",
              "shahidi-zvisinei",
              "smolag",
              "vina",
          }

          INTERNAL_AGENTS = {
              "nox_origine",
              "nox-origin",
              "nøx origin",
              "nox origin",
          }

          GENERIC_NAMES = {
              "agent",
              "agents",
              "unknown",
              "none",
              "null",
              "the",
              "them",
              "follow",
              "comment",
              "reply",
              "post",
              "discussion",
              "proposal",
              "measurement",
              "receipts",
              "pay",
              "coinos.io",
              "machine-native payments",
              "resilience",
              "sovereign rails",
              "success",
              "failure",
              "true",
              "false",
          }

          STRUCTURED_ACTOR_KEYS = {
              "performed_by",
              "executed_by",
              "actor",
              "actor_agent",
              "result_by",
              "result_agent",
              "attributed_to",
              "attributed_agent",
              "responsible_agent",
              "agent",
          }

          STRUCTURED_RESULT_MAP_KEYS = {
              "results_by_agent",
              "agent_results",
              "results",
              "outcomes_by_agent",
              "agent_outcomes",
          }

          STRUCTURED_IDENTITY_KEYS = {
              "username",
              "handle",
              "agent_username",
              "agent_handle",
              "profile_username",
              "profile_handle",
              "identity",
          }

          INTERACTION_TYPES = {
              "FOLLOW",
              "FOLLOW_USER",
              "COMMENT",
              "REPLY",
              "MESSAGE",
              "DIRECT_MESSAGE",
              "POST",
              "MENTION",
              "INTERACTION",
          }

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def normalize(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize_agent(value):
              value = normalize(value)

              if not value:
                  return None

              if value.startswith("@"):
                  value = value[1:]

              value = value.strip().lower()

              if value in INTERNAL_AGENTS:
                  return None

              if value in GENERIC_NAMES:
                  return None

              if value in KNOWN_EXTERNAL_AGENTS:
                  return value

              return None

          def stable_id(*parts):
              raw = "|".join(normalize(p) for p in parts)
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:20]

          def load_json(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          if not os.path.exists(INPUT):
              raise RuntimeError(f"Missing required input: {INPUT}")

          source = load_json(INPUT)

          knowledge = source.get("knowledge", [])

          if not isinstance(knowledge, list):
              raise RuntimeError("ACT17 knowledge must be a list")

          profiles = {}
          observations = []

          stats = {
              "knowledge_entries": len(knowledge),
              "identity_observations": 0,
              "interaction_observations": 0,
              "behavioral_evidence_observations": 0,
              "result_observations": 0,
              "successful_results": 0,
              "failed_results": 0,
              "unattributed_result_candidates": 0,
              "rejected_result_candidates": 0,
              "external_agents": 0,
              "agent_profiles": 0,
              "HIGH": 0,
              "MEDIUM": 0,
              "LOW": 0,
              "UNKNOWN": 0,
          }

          def ensure_profile(agent):
              if agent not in profiles:
                  profiles[agent] = {
                      "agent": agent,
                      "identity_observations": 0,
                      "interaction_observations": 0,
                      "behavioral_evidence_observations": 0,
                      "result_observations": 0,
                      "successful_results": 0,
                      "failed_results": 0,
                      "trust_score": 0.0,
                      "trust_level": "UNKNOWN",
                      "trust_basis": "NO_ATTRIBUTED_EVIDENCE",
                      "domains": [],
                      "claims": [],
                      "attribution_methods": [],
                  }

              return profiles[agent]

          def register_domain(profile, domain):
              domain = normalize(domain)
              if domain and domain not in profile["domains"]:
                  profile["domains"].append(domain)

          def register_claim(profile, claim_id):
              claim_id = normalize(claim_id)
              if claim_id and claim_id not in profile["claims"]:
                  profile["claims"].append(claim_id)

          def add_attribution_method(profile, method):
              if method and method not in profile["attribution_methods"]:
                  profile["attribution_methods"].append(method)

          def inspect_structured_actor(obj):
              """
              IMPORTANT:
              Only structured attribution is accepted.
              Natural-language proximity is NEVER accepted.
              """

              if not isinstance(obj, dict):
                  return None, None

              for key in STRUCTURED_ACTOR_KEYS:
                  if key not in obj:
                      continue

                  value = obj.get(key)

                  if isinstance(value, dict):
                      for nested_key in (
                          "username",
                          "handle",
                          "agent",
                          "name",
                          "id",
                      ):
                          candidate = normalize_agent(value.get(nested_key))
                          if candidate:
                              return candidate, f"structured_actor:{key}.{nested_key}"

                  elif isinstance(value, list):
                      for item in value:
                          candidate, method = inspect_structured_actor(
                              {key: item}
                          )
                          if candidate:
                              return candidate, method

                  else:
                      candidate = normalize_agent(value)
                      if candidate:
                          return candidate, f"structured_actor:{key}"

              return None, None

          def inspect_structured_result_mapping(obj):
              """
              Accept only a per-agent structured result mapping.
              Example:
                results_by_agent:
                  agentpedia:
                    result: SUCCESS
              """

              if not isinstance(obj, dict):
                  return []

              found = []

              for key in STRUCTURED_RESULT_MAP_KEYS:
                  mapping = obj.get(key)

                  if not isinstance(mapping, dict):
                      continue

                  for raw_agent, result_value in mapping.items():
                      agent = normalize_agent(raw_agent)

                      if not agent:
                          continue

                      result = None

                      if isinstance(result_value, dict):
                          result = normalize(
                              result_value.get("result")
                              or result_value.get("status")
                              or result_value.get("outcome")
                          ).upper()

                      else:
                          result = normalize(result_value).upper()

                      if result not in {"SUCCESS", "FAILURE"}:
                          continue

                      found.append(
                          {
                              "agent": agent,
                              "result": result,
                              "method": f"structured_result_map:{key}",
                          }
                      )

              return found

          def inspect_explicit_identity(obj):
              if not isinstance(obj, dict):
                  return []

              found = []

              for key in STRUCTURED_IDENTITY_KEYS:
                  if key not in obj:
                      continue

                  value = obj.get(key)

                  if isinstance(value, dict):
                      candidate = (
                          normalize_agent(value.get("username"))
                          or normalize_agent(value.get("handle"))
                          or normalize_agent(value.get("agent"))
                      )

                      if candidate:
                          found.append(
                              (
                                  candidate,
                                  f"structured_identity:{key}",
                              )
                          )

                  elif isinstance(value, str):
                      candidate = normalize_agent(value)

                      if candidate:
                          found.append(
                              (
                                  candidate,
                                  f"structured_identity:{key}",
                              )
                          )

              return found

          def inspect_interaction(entry):
              """
              Interaction is accepted only when the entry itself
              contains an explicit interaction type AND a structured
              actor/target reference.
              """

              if not isinstance(entry, dict):
                  return []

              raw_type = normalize(
                  entry.get("type")
                  or entry.get("action_type")
                  or entry.get("interaction_type")
              ).upper()

              if raw_type not in INTERACTION_TYPES:
                  return []

              found = []

              actor, method = inspect_structured_actor(entry)

              if actor:
                  found.append(
                      {
                          "agent": actor,
                          "method": method,
                          "interaction_type": raw_type,
                      }
                  )

              for key in (
                  "target_agent",
                  "target",
                  "recipient",
                  "mentioned_agent",
                  "with_agent",
              ):
                  if key not in entry:
                      continue

                  value = entry.get(key)

                  if isinstance(value, dict):
                      candidate = (
                          normalize_agent(value.get("username"))
                          or normalize_agent(value.get("handle"))
                          or normalize_agent(value.get("agent"))
                      )
                  else:
                      candidate = normalize_agent(value)

                  if candidate:
                      found.append(
                          {
                              "agent": candidate,
                              "method": f"structured_interaction_target:{key}",
                              "interaction_type": raw_type,
                          }
                      )

              return found

          def explicit_behavioral_evidence(entry):
              """
              Behavioral evidence requires explicit structured attribution.
              evidence[] by itself is NOT enough.
              """

              if not isinstance(entry, dict):
                  return []

              actor, method = inspect_structured_actor(entry)

              if not actor:
                  return []

              behavior = (
                  entry.get("behavior")
                  or entry.get("behavioral_evidence")
                  or entry.get("action")
                  or entry.get("observed_behavior")
              )

              if not behavior:
                  return []

              return [
                  {
                      "agent": actor,
                      "behavior": behavior,
                      "method": method,
                  }
              ]

          def explicit_results(entry):
              """
              THE CORE RULE OF V1.8:

              No natural-language attribution.
              No "agent name + SUCCESS".
              No nearby words.
              No source_agent inference.
              No evidence[] inference.

              Only:
                1. structured actor + explicit result field
                2. per-agent structured result mapping
              """

              if not isinstance(entry, dict):
                  return []

              found = []

              mapped = inspect_structured_result_mapping(entry)

              for item in mapped:
                  found.append(
                      {
                          "agent": item["agent"],
                          "result": item["result"],
                          "method": item["method"],
                      }
                  )

              explicit_result = normalize(
                  entry.get("result")
                  or entry.get("outcome")
                  or entry.get("execution_result")
                  or entry.get("action_result")
              ).upper()

              actor, actor_method = inspect_structured_actor(entry)

              if actor and explicit_result in {"SUCCESS", "FAILURE"}:
                  found.append(
                      {
                          "agent": actor,
                          "result": explicit_result,
                          "method": f"{actor_method}+structured_result_field",
                      }
                  )

              return found

          def candidate_result_without_attribution(entry):
              """
              Counts result-like entries that were intentionally rejected
              because they lacked structured agent attribution.

              This is diagnostic only.
              It NEVER contributes to trust.
              """

              if not isinstance(entry, dict):
                  return False

              possible = normalize(
                  entry.get("result")
                  or entry.get("outcome")
                  or entry.get("status")
              ).upper()

              if possible in {"SUCCESS", "FAILURE"}:
                  attributed, _ = inspect_structured_actor(entry)

                  if not attributed:
                      mapped = inspect_structured_result_mapping(entry)

                      if not mapped:
                          return True

              return False

          # ------------------------------------------------------------
          # MAIN PROCESSING
          # ------------------------------------------------------------

          for index, entry in enumerate(knowledge):

              if not isinstance(entry, dict):
                  continue

              claim_id = normalize(
                  entry.get("claim_id")
                  or entry.get("id")
                  or stable_id(index, entry.get("information", ""))
              )

              domain = normalize(
                  entry.get("domain")
                  or "unknown"
              )

              source_info = entry.get("sources", [])
              if not isinstance(source_info, list):
                  source_info = []

              # --------------------------------------------------------
              # IDENTITY
              # --------------------------------------------------------

              identities = inspect_explicit_identity(entry)

              for agent, method in identities:
                  profile = ensure_profile(agent)

                  profile["identity_observations"] += 1
                  register_domain(profile, domain)
                  register_claim(profile, claim_id)
                  add_attribution_method(profile, method)

                  stats["identity_observations"] += 1

                  observations.append(
                      {
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "IDENTITY",
                          "identity_method": method,
                          "attribution": {
                              "status": "EXPLICIT",
                              "method": method,
                              "field": "structured",
                          },
                          "source": {
                              "knowledge_index": index,
                              "claim_id": claim_id,
                          },
                      }
                  )

              # --------------------------------------------------------
              # INTERACTION
              # --------------------------------------------------------

              interactions = inspect_interaction(entry)

              for item in interactions:
                  agent = item["agent"]
                  profile = ensure_profile(agent)

                  profile["interaction_observations"] += 1
                  register_domain(profile, domain)
                  register_claim(profile, claim_id)
                  add_attribution_method(profile, item["method"])

                  stats["interaction_observations"] += 1

                  observations.append(
                      {
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "INTERACTION",
                          "interaction_type": item["interaction_type"],
                          "identity_method": item["method"],
                          "attribution": {
                              "status": "EXPLICIT",
                              "method": item["method"],
                              "field": "structured",
                          },
                          "source": {
                              "knowledge_index": index,
                              "claim_id": claim_id,
                          },
                      }
                  )

              # --------------------------------------------------------
              # BEHAVIORAL EVIDENCE
              # --------------------------------------------------------

              behaviors = explicit_behavioral_evidence(entry)

              for item in behaviors:
                  agent = item["agent"]
                  profile = ensure_profile(agent)

                  profile["behavioral_evidence_observations"] += 1
                  register_domain(profile, domain)
                  register_claim(profile, claim_id)
                  add_attribution_method(profile, item["method"])

                  stats["behavioral_evidence_observations"] += 1

                  observations.append(
                      {
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "BEHAVIORAL_EVIDENCE",
                          "behavior": item["behavior"],
                          "identity_method": item["method"],
                          "attribution": {
                              "status": "EXPLICIT",
                              "method": item["method"],
                              "field": "structured_behavior",
                          },
                          "source": {
                              "knowledge_index": index,
                              "claim_id": claim_id,
                          },
                      }
                  )

              # --------------------------------------------------------
              # RESULT
              # --------------------------------------------------------

              results = explicit_results(entry)

              if candidate_result_without_attribution(entry):
                  stats["unattributed_result_candidates"] += 1
                  stats["rejected_result_candidates"] += 1

              for item in results:
                  agent = item["agent"]
                  result = item["result"]
                  method = item["method"]

                  profile = ensure_profile(agent)

                  profile["result_observations"] += 1
                  register_domain(profile, domain)
                  register_claim(profile, claim_id)
                  add_attribution_method(profile, method)

                  stats["result_observations"] += 1

                  if result == "SUCCESS":
                      profile["successful_results"] += 1
                      stats["successful_results"] += 1
                  elif result == "FAILURE":
                      profile["failed_results"] += 1
                      stats["failed_results"] += 1

                  observations.append(
                      {
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "RESULT",
                          "result": result,
                          "identity_method": method,
                          "attribution": {
                              "result": result,
                              "status": "EXPLICIT",
                              "method": method,
                              "field": "structured_result",
                          },
                          "source": {
                              "knowledge_index": index,
                              "claim_id": claim_id,
                          },
                      }
                  )

          # ------------------------------------------------------------
          # TRUST CALCULATION
          # ------------------------------------------------------------

          for agent, profile in profiles.items():

              results = profile["result_observations"]
              successes = profile["successful_results"]
              failures = profile["failed_results"]
              behaviors = profile["behavioral_evidence_observations"]

              if results == 0 and behaviors == 0:
                  profile["trust_score"] = 0.0
                  profile["trust_level"] = "UNKNOWN"
                  profile["trust_basis"] = "IDENTITY_OR_INTERACTION_ONLY"

              elif results == 0 and behaviors > 0:
                  profile["trust_score"] = 0.0
                  profile["trust_level"] = "UNKNOWN"
                  profile["trust_basis"] = "BEHAVIOR_WITHOUT_ATTRIBUTED_RESULT"

              else:
                  success_rate = successes / results

                  # Conservative trust model.
                  # Results are the strongest signal.
                  # Failures are explicitly retained.
                  score = (
                      (success_rate * 0.75)
                      + (min(behaviors, 5) / 5 * 0.25)
                  )

                  if failures > 0:
                      score *= max(
                          0.0,
                          1.0 - (failures / max(results, 1) * 0.50)
                      )

                  profile["trust_score"] = round(
                      max(0.0, min(1.0, score)),
                      4
                  )

                  profile["trust_basis"] = (
                      "ATTRIBUTED_RESULTS_AND_BEHAVIOR"
                      if behaviors > 0
                      else "ATTRIBUTED_RESULTS_ONLY"
                  )

                  if profile["trust_score"] >= 0.80:
                      profile["trust_level"] = "HIGH"
                  elif profile["trust_score"] >= 0.55:
                      profile["trust_level"] = "MEDIUM"
                  elif profile["trust_score"] > 0:
                      profile["trust_level"] = "LOW"
                  else:
                      profile["trust_level"] = "UNKNOWN"

              stats[profile["trust_level"]] += 1

          # ------------------------------------------------------------
          # SORT / FINALIZE
          # ------------------------------------------------------------

          for profile in profiles.values():
              profile["domains"] = sorted(profile["domains"])
              profile["claims"] = sorted(profile["claims"])
              profile["attribution_methods"] = sorted(
                  profile["attribution_methods"]
              )

          observations.sort(
              key=lambda x: (
                  x.get("agent", ""),
                  x.get("type", ""),
                  x.get("claim_id", ""),
              )
          )

          stats["external_agents"] = len(profiles)
          stats["agent_profiles"] = len(profiles)

          output = {
              "version": VERSION,
              "generated_at": now_iso(),

              "source": {
                  "file": INPUT,
                  "knowledge_entries_processed": len(knowledge),
              },

              "statistics": stats,

              "trust_policy": {
                  "version": "V1.8",
                  "principle": (
                      "Trust is earned from explicitly attributed "
                      "behavior and results, never from proximity of "
                      "names and natural-language result words."
                  ),
                  "identity_is_not_trust": True,
                  "interaction_is_not_trust": True,
                  "evidence_array_alone_is_not_behavior": True,
                  "natural_language_result_attribution": False,
                  "source_agent_is_not_subject_agent": True,
                  "multi_agent_result_inheritance": False,
                  "unknown_preferred_over_false_trust": True,
                  "karma_used_for_trust": False,
                  "post_count_used_for_trust": False,
                  "follower_count_used_for_trust": False,
                  "external_api_used": False,
                  "gemini_used": False,
                  "cost_eur": 0,
              },

              "profiles": profiles,

              "observations": observations,

              "attribution_audit": {
                  "natural_language_result_attribution_used": False,
                  "unattributed_result_candidates": (
                      stats["unattributed_result_candidates"]
                  ),
                  "rejected_result_candidates": (
                      stats["rejected_result_candidates"]
                  ),
              },

              "validation": {
                  "status": "PENDING"
              },

              "last_run": now_iso(),
          }

          # ------------------------------------------------------------
          # HARD VALIDATION
          # ------------------------------------------------------------

          errors = []

          forbidden_methods = {
              "natural_language_result_attribution",
              "nearby_text_result_attribution",
              "name_proximity_result_attribution",
              "source_agent_result_attribution",
          }

          for agent, profile in profiles.items():

              if agent in INTERNAL_AGENTS:
                  errors.append(
                      f"Internal agent leaked into profiles: {agent}"
                  )

              if agent not in KNOWN_EXTERNAL_AGENTS:
                  errors.append(
                      f"Unknown external agent in profiles: {agent}"
                  )

              if profile["successful_results"] + profile["failed_results"] != profile["result_observations"]:
                  errors.append(
                      f"Result accounting mismatch for {agent}"
                  )

              if profile["result_observations"] == 0:
                  if profile["trust_level"] != "UNKNOWN":
                      errors.append(
                          f"Agent without results is not UNKNOWN: {agent}"
                      )

                  if profile["trust_score"] != 0.0:
                      errors.append(
                          f"Agent without results has non-zero trust: {agent}"
                      )

              for method in profile["attribution_methods"]:
                  if method in forbidden_methods:
                      errors.append(
                          f"Forbidden attribution method for {agent}: {method}"
                      )

          for obs in observations:

              agent = obs.get("agent")

              if agent not in KNOWN_EXTERNAL_AGENTS:
                  errors.append(
                      f"Invalid observation agent: {agent}"
                  )

              if obs.get("type") == "RESULT":

                  attribution = obs.get("attribution", {})

                  if attribution.get("status") != "EXPLICIT":
                      errors.append(
                          f"Result without EXPLICIT attribution: {agent}"
                      )

                  method = attribution.get("method", "")

                  if (
                      "structured" not in method
                      and "structured_actor" not in method
                  ):
                      errors.append(
                          f"Non-structured result attribution: {agent}"
                      )

                  if method in forbidden_methods:
                      errors.append(
                          f"Forbidden result attribution method: {method}"
                      )

              if obs.get("type") == "BEHAVIORAL_EVIDENCE":

                  attribution = obs.get("attribution", {})

                  if attribution.get("status") != "EXPLICIT":
                      errors.append(
                          f"Behavior without EXPLICIT attribution: {agent}"
                      )

          # Detect duplicate result attribution on same agent + claim.
          result_keys = set()

          for obs in observations:

              if obs.get("type") != "RESULT":
                  continue

              key = (
                  obs.get("agent"),
                  obs.get("claim_id"),
                  obs.get("result"),
              )

              if key in result_keys:
                  errors.append(
                      f"Duplicate attributed result: {key}"
                  )

              result_keys.add(key)

          # Verify no natural-language result method exists anywhere.
          serialized = json.dumps(
              output,
              ensure_ascii=False
          ).lower()

          if "natural_language_result_attribution" in serialized:
              errors.append(
                  "Forbidden natural-language attribution string found"
              )

          # The policy itself contains the phrase as a boolean key,
          # so remove the false-positive caused by the policy declaration.
          # Re-check only actual observations/profile methods.
          for profile in profiles.values():
              for method in profile["attribution_methods"]:
                  if "natural_language" in method.lower():
                      errors.append(
                          "Natural-language method leaked into profile"
                      )

          for obs in observations:
              method = str(
                  obs.get("attribution", {}).get("method", "")
              ).lower()

              if "natural_language" in method:
                  errors.append(
                      "Natural-language method leaked into observation"
                  )

          if errors:
              output["validation"] = {
                  "status": "FAILED",
                  "errors": errors,
              }

              with open(
                  OUTPUT,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      output,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print("VALIDATION FAILED")
              for error in errors:
                  print(" -", error)

              raise SystemExit(1)

          output["validation"] = {
              "status": "PASSED",
              "rules": [
                  "identity_is_not_trust",
                  "interaction_is_not_trust",
                  "behavior_requires_explicit_attribution",
                  "result_requires_explicit_structured_attribution",
                  "natural_language_result_attribution_forbidden",
                  "multi_agent_result_inheritance_forbidden",
                  "source_agent_not_used_as_subject_agent",
                  "unknown_preferred_over_false_trust",
