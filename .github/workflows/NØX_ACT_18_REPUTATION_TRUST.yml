      - name: Verify generated file
        shell: bash
        run: |
          set -euo pipefail

          test -f memory/nox_reputation_trust.json

          python3 - <<'PY'
          import json

          path = "memory/nox_reputation_trust.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["version"] == "ACT18-V1.9-FINAL"
          assert data["validation"]["status"] == "PASSED"

          policy = data["trust_policy"]

          assert policy["natural_language_result_attribution"] is False
          assert policy["identity_is_not_trust"] is True
          assert policy["interaction_is_not_trust"] is True
          assert policy["karma_used_for_trust"] is False
          assert policy["post_count_used_for_trust"] is False
          assert policy["follower_count_used_for_trust"] is False
          assert policy["gemini_used"] is False
          assert policy["external_api_used"] is False
          assert policy["cost_eur"] == 0

          for observation in data["observations"]:

              if observation.get("type") != "RESULT":
                  continue

              attribution = observation.get(
                  "attribution",
                  {}
              )

              assert attribution.get(
                  "status"
              ) == "EXPLICIT"

              assert attribution.get(
                  "method"
              ) == "structured_result_attribution"

              assert attribution.get(
                  "agent"
              ) == observation.get("agent")

          print("Generated file validation: PASS")
          PY

      - name: Commit ACT18 results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT18 V1.9 FINAL - Reputation and Trust"

      - name: Synchronize with remote and push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

          echo "ACT18 V1.9 FINAL pushed successfully."
