name: NØX ACT 18 - Reputation & Trust V1.9 FINAL

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  act18-reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ACT18 Reputation & Trust
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NØX ACT 18 - REPUTATION & TRUST V1.9 FINAL"
          echo "================================================"

          mkdir -p memory

          python3 <<'PY'
          import json
          import os
          import re
          import hashlib
          from datetime import datetime, timezone

          INPUT = "memory/nox_knowledge_core.json"
          OUTPUT = "memory/nox_reputation_trust.json"

          VERSION = "ACT18-V1.9-FINAL"

          if not os.path.exists(INPUT):
              raise SystemExit(f"ERROR: Missing input file: {INPUT}")

          with open(INPUT, "r", encoding="utf-8") as f:
              core = json.load(f)

          knowledge = core.get("knowledge", [])

          if not isinstance(knowledge, list):
              raise SystemExit("ERROR: knowledge must be a list")

          now = datetime.now(timezone.utc).isoformat()

          # ------------------------------------------------------------
          # NØX INTERNAL IDENTITY
          # ------------------------------------------------------------

          NOX_NAMES = {
              "nox",
              "nox origin",
              "nox_origine",
              "@nox_origine",
              "nøx origin"
          }

          # ------------------------------------------------------------
          # KNOWN EXTERNAL AGENTS
          #
          # This list is intentionally conservative.
          # It is NOT a trust list.
          # It is only an identity anchor when the ACT17 data contains
          # a corresponding explicit handle / UUID / profile identity.
          # ------------------------------------------------------------

          KNOWN_HANDLES = {
              "agentpedia",
              "exori",
              "vina",
              "atomic-raven",
              "bytes",
              "hermes-final",
              "randy-2",
              "colonist-one",
              "anp2network",
              "ralftpaw",
              "rosetta",
              "holocene",
              "reticuli",
              "cyrene-agent"
          }

          KNOWN_UUIDS = {
              "35cd060",
              "591350dd",
              "0cc73ef",
              "92411569",
              "8f8f736b",
              "68e1db29",
              "c76a2a82",
              "324ab98e",
              "5a01463",
              "8ce16642",
              "dbc024a7",
              "646d9d00",
              "2acbabeb"
          }

          # ------------------------------------------------------------
          # INVALID / GENERIC TOKENS
          # ------------------------------------------------------------

          INVALID_NAMES = {
              "",
              "unknown",
              "none",
              "null",
              "n/a",
              "na",
              "agent",
              "agents",
              "the",
              "them",
              "this",
              "that",
              "follow",
              "comment",
              "reply",
              "discussion",
              "measurement",
              "proposal",
              "receipts",
              "pay",
              "coinos.io",
              "machine-native payments",
              "resilience",
              "sovereign rails",
              "what i can actually finish",
              "what i will not do",
              "success",
              "failure",
              "action_executed",
              "action",
              "hash",
              "...",
              "deep-seeker",
              "deep seeker",
              "wiener",
              "hermes"
          }

          INVALID_METHODS = {
              "natural_language_result_attribution",
              "name_near_success",
              "nearby_success",
              "generic_result_attribution"
          }

          # ------------------------------------------------------------
          # HELPERS
          # ------------------------------------------------------------

          def norm(value):
              if value is None:
                  return ""
              return str(value).strip()

          def lower(value):
              return norm(value).lower()

          def stable_id(*parts):
              raw = "|".join(norm(x) for x in parts)
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:16]

          def text_of(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  try:
                      return json.dumps(value, ensure_ascii=False)
                  except Exception:
                      return str(value)
              if isinstance(value, list):
                  try:
                      return json.dumps(value, ensure_ascii=False)
                  except Exception:
                      return str(value)
              return str(value)

          def is_nox(name):
              n = lower(name)
              return (
                  n in NOX_NAMES
                  or n.replace("@", "") == "nox_origine"
                  or "nox origin" == n
              )

          def valid_agent_name(name):
              n = lower(name)

              if not n:
                  return False

              if n in INVALID_NAMES:
                  return False

              if is_nox(n):
                  return False

              # Generic prose is not an identity.
              if len(n) < 3 or len(n) > 80:
                  return False

              # Reject sentences / fragments.
              if len(n.split()) > 4:
                  return False

              if any(x in n for x in [
                  "what i ",
                  "what i can",
                  "what i will",
                  "machine-native",
                  "sovereign rails"
              ]):
                  return False

              return True

          def normalize_agent(name):
              n = norm(name)

              if n.startswith("@"):
                  n = n[1:]

              n = re.sub(r"\s+", " ", n).strip()

              return n

          def extract_handles(text):
              if not text:
                  return []

              found = []

              for m in re.findall(r"@[A-Za-z0-9][A-Za-z0-9_-]{2,50}", text):
                  h = m[1:].lower()

                  if h in KNOWN_HANDLES:
                      found.append(h)

              return sorted(set(found))

          def extract_known_names(text):
              if not text:
                  return []

              found = []

              for handle in KNOWN_HANDLES:
                  pattern = r"(?<![A-Za-z0-9_-])" + re.escape(handle) + r"(?![A-Za-z0-9_-])"

                  if re.search(pattern, text, flags=re.IGNORECASE):
                      found.append(handle)

              return sorted(set(found))

          def explicit_identity_from_entry(entry, information):
              """
              Identity is accepted only from explicit structured identity
              or a known external handle appearing in an identity-oriented
              structure.

              A normal prose mention is NOT enough.
              """

              candidates = []

              # Explicit top-level / nested fields.
              for key in [
                  "agent",
                  "username",
                  "handle",
                  "subject_agent",
                  "target_agent",
                  "external_agent",
                  "author"
              ]:
                  value = entry.get(key)

                  if isinstance(value, str):
                      candidates.append((value, f"structured_{key}"))

                  elif isinstance(value, dict):
                      for subkey in ["username", "handle", "name", "agent"]:
                          sub = value.get(subkey)
                          if isinstance(sub, str):
                              candidates.append((sub, f"structured_{key}_{subkey}"))

              # Structured sources.
              sources = entry.get("sources")

              if isinstance(sources, list):
                  for source in sources:
                      if not isinstance(source, dict):
                          continue

                      for key in ["agent", "username", "handle", "subject_agent"]:
                          value = source.get(key)

                          if isinstance(value, str):
                              candidates.append(
                                  (value, f"structured_source_{key}")
                              )

              # Known handles in information are accepted only as identity
              # when the text clearly identifies the external actor.
              info = lower(information)

              for handle in extract_handles(information):
                  identity_markers = [
                      "followed @",
                      "following @",
                      "commented on",
                      "replied to",
                      "response from",
                      "reply from",
                      "author:",
                      "username:",
                      "agent:",
                      "posted by",
                      "created by",
                      "interaction with",
                      "interacted with"
                  ]

                  if any(marker in info for marker in identity_markers):
                      candidates.append(
                          (handle, "known_handle_explicit_context")
                      )

              results = []

              for name, method in candidates:
                  name = normalize_agent(name)

                  if not valid_agent_name(name):
                      continue

                  lname = lower(name)

                  # Only known external identities are accepted.
                  if lname not in KNOWN_HANDLES:
                      continue

                  results.append({
                      "agent": lname,
                      "method": method
                  })

              # Deduplicate.
              unique = {}
              for item in results:
                  unique[item["agent"]] = item

              return list(unique.values())

          def get_domain(entry):
              return norm(entry.get("domain")) or "unknown"

          def get_claim_id(entry):
              return (
                  norm(entry.get("claim_id"))
                  or norm(entry.get("id"))
                  or stable_id(
                      entry.get("information"),
                      entry.get("domain"),
                      entry.get("first_seen")
                  )
              )

          def get_information(entry):
              parts = []

              for key in [
                  "information",
                  "claim",
                  "content",
                  "title",
                  "response",
                  "result",
                  "action"
              ]:
                  value = entry.get(key)

                  if value is not None:
                      parts.append(text_of(value))

              return " | ".join(parts)

          def explicit_interaction(entry, information, agent):
              """
              Interaction is only recorded when the ACT17 information or
              structure explicitly describes an interaction with this agent.
              Interaction NEVER creates trust.
              """

              info = lower(information)

              patterns = [
                  rf"\bcomment(?:ed|ing)?\b.*\b{re.escape(agent)}\b",
                  rf"\brepl(?:y|ied|ying)\b.*\b{re.escape(agent)}\b",
                  rf"\bfollow(?:ed|ing)?\b.*\b{re.escape(agent)}\b",
                  rf"\binteract(?:ed|ion|ing)?\b.*\b{re.escape(agent)}\b",
                  rf"\bresponse\b.*\b{re.escape(agent)}\b",
                  rf"\b{re.escape(agent)}\b.*\bresponse\b",
                  rf"\b{re.escape(agent)}\b.*\bcomment\b",
                  rf"\b{re.escape(agent)}\b.*\breply\b",
                  rf"\b{re.escape(agent)}\b.*\bfollow\b"
              ]

              if any(re.search(p, info) for p in patterns):
                  return True

              # Structured action fields.
              for key in ["action", "interaction", "activity", "type"]:
                  value = lower(entry.get(key))

                  if value in {
                      "follow",
                      "follow_user",
                      "comment",
                      "reply",
                      "response",
                      "interaction"
                  }:
                      return True

              return False

          def structured_behavior(entry, information, agent):
              """
              Behavioral evidence requires explicit attribution to the
              external agent AND an actual behavior/content/action.

              A mere mention of the agent is rejected.
              """

              info = lower(information)

              # Explicit action verbs / content creation markers.
              behavior_markers = [
                  "published",
                  "posted",
                  "created",
                  "built",
                  "implemented",
                  "answered",
                  "commented",
                  "replied",
                  "responded",
                  "proposed",
                  "explained",
                  "provided",
                  "verified",
                  "tested",
                  "demonstrated",
                  "completed",
                  "delivered",
                  "solved",
                  "analyzed",
                  "contributed"
              ]

              # The actor must occur in the same evidence context.
              actor_present = (
                  re.search(
                      rf"(?<![A-Za-z0-9_-])@?{re.escape(agent)}(?![A-Za-z0-9_-})",
                      information,
                      flags=re.IGNORECASE
                  )
                  is not None
              )

              if not actor_present:
                  return False

              return any(marker in info for marker in behavior_markers)

          def explicit_result_for_agent(entry, information, agent):
              """
              IMPORTANT:
              Never infer:
                  agent + nearby SUCCESS = agent success.

              Result is accepted only when the ACT17 structure itself
              explicitly links the result to the same agent.
              """

              # Structured result object.
              result_obj = entry.get("result")

              if isinstance(result_obj, dict):
                  actor = (
                      result_obj.get("agent")
                      or result_obj.get("subject_agent")
                      or result_obj.get("actor")
                  )

                  result = (
                      result_obj.get("result")
                      or result_obj.get("status")
                      or result_obj.get("outcome")
                  )

                  if (
                      isinstance(actor, str)
                      and lower(actor).lstrip("@") == lower(agent)
                      and isinstance(result, str)
                      and lower(result) in {"success", "successful", "failure", "failed"}
                  ):
                      return lower(result)

              # Structured attribution object.
              attribution = entry.get("attribution")

              if isinstance(attribution, dict):
                  actor = (
                      attribution.get("agent")
                      or attribution.get("subject_agent")
                      or attribution.get("actor")
                  )

                  result = (
                      attribution.get("result")
                      or attribution.get("status")
                  )

                  if (
                      isinstance(actor, str)
                      and lower(actor).lstrip("@") == lower(agent)
                      and isinstance(result, str)
                  ):
                      r = lower(result)

                      if r in {"success", "successful"}:
                          return "success"

                      if r in {"failure", "failed"}:
                          return "failure"

              # Structured actor/result fields.
              actor_fields = [
                  entry.get("result_agent"),
                  entry.get("result_subject"),
                  entry.get("outcome_agent"),
                  entry.get("actor")
              ]

              for actor in actor_fields:
                  if isinstance(actor, str):
                      if lower(actor).lstrip("@") == lower(agent):
                          result = lower(
                              entry.get("result")
                              or entry.get("outcome")
                              or entry.get("status")
                          )

                          if result in {"success", "successful"}:
                              return "success"

                          if result in {"failure", "failed"}:
                              return "failure"

              # NO natural-language inference here.
              return None

          # ------------------------------------------------------------
          # COLLECTION
          # ------------------------------------------------------------

          profiles = {}
          observations = []

          stats = {
              "knowledge_entries": len(knowledge),
              "identity_observations": 0,
              "interaction_observations": 0,
              "behavioral_evidence_observations": 0,
              "result_observations": 0,
              "successful_results": 0,
              "failed_results": 0,
              "unattributed_result_candidates": 0,
              "rejected_result_candidates": 0
          }

          processed_claims = set()

          for entry in knowledge:
              if not isinstance(entry, dict):
                  continue

              information = get_information(entry)
              domain = get_domain(entry)
              claim_id = get_claim_id(entry)

              if not information:
                  continue

              identities = explicit_identity_from_entry(
                  entry,
                  information
              )

              # --------------------------------------------------------
              # FALLBACK FOR KNOWN EXPLICIT HANDLES IN ACT17
              #
              # Only known handles are considered.
              # No arbitrary names from prose are accepted.
              # --------------------------------------------------------

              if not identities:
                  for handle in extract_handles(information):
                      info_lower = lower(information)

                      explicit_context = [
                          "followed",
                          "following",
                          "commented",
                          "comment",
                          "replied",
                          "reply",
                          "response from",
                          "posted by",
                          "author:",
                          "username:",
                          "agent:"
                      ]

                      if any(x in info_lower for x in explicit_context):
                          identities.append({
                              "agent": handle,
                              "method": "known_handle_explicit_context"
                          })

              unique_agents = sorted(
                  set(
                      x["agent"]
                      for x in identities
                      if valid_agent_name(x["agent"])
                  )
              )

              for agent in unique_agents:

                  if agent not in profiles:
                      profiles[agent] = {
                          "agent": agent,
                          "domains": {},
                          "identity": {
                              "observations": 0,
                              "methods": []
                          },
                          "interaction": {
                              "observations": 0
                          },
                          "behavioral_evidence": {
                              "observations": 0,
                              "successful": 0,
                              "failed": 0
                          },
                          "results": {
                              "observations": 0,
                              "successful": 0,
                              "failed": 0
                          },
                          "trust": {
                              "score": 0.0,
                              "level": "UNKNOWN",
                              "basis": "NO_BEHAVIORAL_EVIDENCE"
                          }
                      }

                  profile = profiles[agent]

                  profile["domains"].setdefault(
                      domain,
                      {
                          "identity": 0,
                          "interaction": 0,
                          "behavioral_evidence": 0,
                          "success": 0,
                          "failure": 0
                      }
                  )

                  domain_stats = profile["domains"][domain]

                  # ----------------------------------------------------
                  # IDENTITY
                  # ----------------------------------------------------

                  profile["identity"]["observations"] += 1
                  stats["identity_observations"] += 1

                  for ident in identities:
                      method = ident.get("method")

                      if method and method not in profile["identity"]["methods"]:
                          profile["identity"]["methods"].append(method)

                  observations.append({
                      "observation_id": stable_id(
                          "identity",
                          agent,
                          claim_id
                      ),
                      "agent": agent,
                      "domain": domain,
                      "claim_id": claim_id,
                      "type": "IDENTITY",
                      "identity": {
                          "status": "EXPLICIT",
                          "method": next(
                              (
                                  x["method"]
                                  for x in identities
                                  if x["agent"] == agent
                              ),
                              "known_external_identity"
                          )
                      }
                  })

                  # ----------------------------------------------------
                  # INTERACTION
                  # ----------------------------------------------------

                  interaction = explicit_interaction(
                      entry,
                      information,
                      agent
                  )

                  if interaction:
                      profile["interaction"]["observations"] += 1
                      domain_stats["interaction"] += 1
                      stats["interaction_observations"] += 1

                      observations.append({
                          "observation_id": stable_id(
                              "interaction",
                              agent,
                              claim_id
                          ),
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "INTERACTION",
                          "interaction": "EXPLICIT"
                      })

                  # ----------------------------------------------------
                  # BEHAVIORAL EVIDENCE
                  # ----------------------------------------------------

                  behavior = structured_behavior(
                      entry,
                      information,
                      agent
                  )

                  if behavior:
                      profile["behavioral_evidence"]["observations"] += 1
                      domain_stats["behavioral_evidence"] += 1
                      stats["behavioral_evidence_observations"] += 1

                      observations.append({
                          "observation_id": stable_id(
                              "behavior",
                              agent,
                              claim_id
                          ),
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "BEHAVIORAL_EVIDENCE",
                          "attribution": {
                              "status": "EXPLICIT",
                              "method": "structured_or_explicit_behavior",
                              "agent": agent
                          }
                      })

                  # ----------------------------------------------------
                  # RESULT
                  # ----------------------------------------------------

                  result = explicit_result_for_agent(
                      entry,
                      information,
                      agent
                  )

                  # A generic result exists, but cannot be safely linked.
                  generic_result = lower(
                      entry.get("result")
                      or entry.get("status")
                      or ""
                  )

                  if generic_result in {
                      "success",
                      "successful",
                      "failure",
                      "failed"
                  } and result is None:
                      stats["unattributed_result_candidates"] += 1
                      stats["rejected_result_candidates"] += 1

                  if result is not None:
                      profile["results"]["observations"] += 1
                      stats["result_observations"] += 1

                      if result == "success":
                          profile["results"]["successful"] += 1
                          profile["behavioral_evidence"]["successful"] += 1
                          domain_stats["success"] += 1
                          stats["successful_results"] += 1

                      elif result == "failure":
                          profile["results"]["failed"] += 1
                          profile["behavioral_evidence"]["failed"] += 1
                          domain_stats["failure"] += 1
                          stats["failed_results"] += 1

                      observations.append({
                          "observation_id": stable_id(
                              "result",
                              agent,
                              claim_id,
                              result
                          ),
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "RESULT",
                          "result": result,
                          "attribution": {
                              "status": "EXPLICIT",
                              "method": "structured_result_attribution",
                              "agent": agent
                          }
                      })

          # ------------------------------------------------------------
          # TRUST CALCULATION
          # ------------------------------------------------------------

          high = 0
          medium = 0
          low = 0
          unknown = 0

          for agent, profile in profiles.items():

              behavioral = profile["behavioral_evidence"]["observations"]
              success = profile["results"]["successful"]
              failure = profile["results"]["failed"]

              # Trust is impossible without behavioral/result evidence.
              if behavioral == 0 and success == 0 and failure == 0:
                  score = 0.0
                  level = "UNKNOWN"
                  basis = "IDENTITY_OR_INTERACTION_ONLY"

              else:
                  total_results = success + failure

                  if total_results > 0:
                      result_rate = success / total_results
                  else:
                      result_rate = 0.0

                  behavior_component = min(
                      0.30,
                      behavioral * 0.10
                  )

                  result_component = min(
                      0.50,
                      result_rate * 0.50
                  )

                  failure_penalty = min(
                      0.30,
                      failure * 0.15
                  )

                  score = max(
                      0.0,
                      min(
                          1.0,
                          0.20 + behavior_component + result_component - failure_penalty
                      )
                  )

                  # Conservative levels.
                  if total_results == 0:
                      level = "UNKNOWN"

                  elif score >= 0.80 and success >= 3 and failure == 0:
                      level = "HIGH"

                  elif score >= 0.60 and success >= 2:
                      level = "MEDIUM"

                  else:
                      level = "LOW"

                  if total_results > 0:
                      basis = "EXPLICIT_ATTRIBUTED_RESULTS"

                  else:
                      basis = "EXPLICIT_BEHAVIOR_ONLY"

              profile["trust"] = {
                  "score": round(score, 4),
                  "level": level,
                  "basis": basis
              }

              if level == "HIGH":
                  high += 1
              elif level == "MEDIUM":
                  medium += 1
              elif level == "LOW":
                  low += 1
              else:
                  unknown += 1

          stats["external_agents"] = len(profiles)
          stats["agent_profiles"] = len(profiles)
          stats["HIGH"] = high
          stats["MEDIUM"] = medium
          stats["LOW"] = low
          stats["UNKNOWN"] = unknown

          # ------------------------------------------------------------
          # HARD VALIDATION
          # ------------------------------------------------------------

          errors
