name: NØX ACT 18 - Reputation & Trust

on:
  workflow_dispatch:

  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. BUILD ACT18
      # ==========================================================
      - name: Build ACT18 Reputation & Trust
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NØX ACT 18 - REPUTATION & TRUST"
          echo "================================================"
          echo

          python3 - <<'PY'
          import json
          import re
          import hashlib
          from collections import defaultdict
          from datetime import datetime, timezone

          KNOWLEDGE_FILE = "memory/nox_knowledge_core.json"
          OUTPUT_FILE = "memory/nox_reputation_trust.json"

          # ======================================================
          # NØX IDENTITIES
          # ======================================================

          NOX_IDENTITIES = {
              "nox_origin",
              "nox_origine",
              "nox origin",
              "nøx origin",
              "nox",
              "442104b5-eee0-4f73-b452-08f258a21ea2",
          }

          # ======================================================
          # INVALID / NON-AGENT VALUES
          # ======================================================

          INVALID_NAMES = {
              "unknown",
              "none",
              "null",
              "agent",
              "user",
              "task",
              "tasks",
              "discussion",
              "response",
              "reply",
              "comment",
              "follow",
              "follow_user",
              "follow_tag",
              "action",
              "success",
              "failure",
              "valid",
              "invalid",
              "evidence",
              "information",
              "source",
              "domain",
              "strong",
              "moderate",
              "weak",
              "high",
              "medium",
              "low",
              "insufficient",
              "unverified",
              "evidence_supported",
              "corroborated",
              "unresolved",
              "not_evaluable",
              "action_executed",
              "adaptive balanced",
              "evidence-first",
              "disabled",
              "enabled",
              "service_offer",
              "marketplace",
              "general",
              "network",
              "reader",
              "genre",
              "would",
              "register",
              "measurement",
              "english",
              "calibration",
              "validation",
              "execution",
              "deployment",
              "blocked",
              "baseline",
              "regression",
              "risk",
              "no_action",
              "unclear",
              "genuine_demand_gate",
              "controlled_execution_validation",
              "controlled_correction_deployment",
              "final_autonomous_core",
              "autonomous_self_correction_validation",
              "autonomous_policy_stabilization",
          }

          # ======================================================
          # REGEX
          # ======================================================

          UUID_RE = re.compile(
              r"\b[0-9a-f]{8}-[0-9a-f-]{27,36}\b",
              re.IGNORECASE
          )

          HANDLE_RE = re.compile(
              r"@([A-Za-z0-9_.-]{2,50})"
          )

          FOLLOW_RE = re.compile(
              r"\bFollow\s+@([A-Za-z0-9_.-]+)",
              re.IGNORECASE
          )

          TARGET_RE = re.compile(
              r"\b(?:target|requester)\s*=\s*@?([A-Za-z0-9_.-]+)",
              re.IGNORECASE
          )

          # UUID | agent_name | ...
          UUID_NAME_RE = re.compile(
              r"\b([0-9a-f]{8}-[0-9a-f-]{27,36})\b"
              r"\s*\|\s*"
              r"([A-Za-z][A-Za-z0-9_.@ -]{2,60})"
              r"\s*\|",
              re.IGNORECASE
          )

          # UUID | agent_name | response/reply/comment
          UUID_RESPONSE_RE = re.compile(
              r"\b([0-9a-f]{8}-[0-9a-f-]{27,36})\b"
              r"\s*\|\s*"
              r"([A-Za-z][A-Za-z0-9_.@ -]{2,60})"
              r"\s*\|\s*"
              r"(?:response|reply|comment)\b",
              re.IGNORECASE
          )

          # **Agent Name**
          BOLD_NAME_RE = re.compile(
              r"\*\*([A-Za-z][A-Za-z0-9_.@ -]{2,60})\*\*"
          )

          # ======================================================
          # BASIC HELPERS
          # ======================================================

          def canonical(value):
              if value is None:
                  return ""

              value = str(value).strip()

              if value.startswith("@"):
                  value = value[1:]

              value = value.strip("'\"")

              return value.lower()


          def is_nox(value):
              name = canonical(value)

              if not name:
                  return True

              if name in NOX_IDENTITIES:
                  return True

              if "nox_origin" in name:
                  return True

              if "nox origine" in name:
                  return True

              if "nøx" in name:
                  return True

              return False


          def valid_agent_name(value):
              name = canonical(value)

              if not name:
                  return False

              if is_nox(name):
                  return False

              if name in INVALID_NAMES:
                  return False

              if len(name) < 3 or len(name) > 60:
                  return False

              if re.fullmatch(r"[0-9a-f]{8,64}", name):
                  return False

              if re.fullmatch(r"[0-9a-f-]{20,64}", name):
                  return False

              if re.fullmatch(r"v?\d+(?:\.\d+)+", name):
                  return False

              if re.fullmatch(r"\d{4}-\d{2}-\d{2}.*", name):
                  return False

              if "http://" in name or "https://" in name:
                  return False

              if len(name.split()) > 6:
                  return False

              return True


          def get_domain(entry):
              value = entry.get("domain")

              if value:
                  return str(value)

              return "general"


          def contains_success(text):
              return bool(
                  re.search(
                      r"\bSUCCESS\b",
                      text,
                      re.IGNORECASE
                  )
              )


          def contains_failure(text):
              return bool(
                  re.search(
                      r"\b(?:FAILURE|FAILED|ERROR)\b",
                      text,
                      re.IGNORECASE
                  )
              )


          def contains_response_signal(text):
              patterns = [
                  r"\bresponse\b",
                  r"\breply\b",
                  r"\bcomment\b",
                  r"\bresponded\b",
                  r"\banswered\b",
                  r"\bcontribution\b",
                  r"\bfeedback\b",
              ]

              return any(
                  re.search(pattern, text, re.IGNORECASE)
                  for pattern in patterns
              )


          # ======================================================
          # EXTRACT OBSERVATIONS
          # ======================================================

          def extract_observations(entry):

              information = str(
                  entry.get("information", "")
              )

              domain = get_domain(entry)
              claim_id = entry.get("claim_id")

              observations = []

              success = contains_success(information)
              failure = contains_failure(information)
              response_signal = contains_response_signal(
                  information
              )

              # --------------------------------------------------
              # 1. UUID + NAME + RESPONSE
              # Strong external identity + contribution evidence
              # --------------------------------------------------

              for match in UUID_RESPONSE_RE.finditer(
                  information
              ):

                  agent_uuid = match.group(1)
                  agent_name = match.group(2).strip()

                  if not valid_agent_name(agent_name):
                      continue

                  result = "UNKNOWN"

                  if success:
                      result = "SUCCESS"
                  elif failure:
                      result = "FAILURE"

                  observations.append({
                      "agent": canonical(agent_name),
                      "display_name": agent_name,
                      "agent_uuid": agent_uuid,
                      "domain": domain,
                      "type": "EXTERNAL_RESPONSE_WITH_ID",
                      "identity_confidence": 0.98,
                      "evidence_strength": "STRONG",
                      "result": result,
                      "source_claim_id": claim_id,
                  })

              # --------------------------------------------------
              # 2. UUID + NAME
              #
              # Used when the entry contains a known external
              # identity and a meaningful interaction/result.
              # --------------------------------------------------

              for match in UUID_NAME_RE.finditer(
                  information
              ):

                  agent_uuid = match.group(1)
                  agent_name = match.group(2).strip()

                  if not valid_agent_name(agent_name):
                      continue

                  # Do not automatically call every UUID/name
                  # pair evidence. A meaningful signal is required.
                  meaningful = (
                      success
                      or failure
                      or response_signal
                  )

                  if meaningful:

                      result = "UNKNOWN"

                      if success:
                          result = "SUCCESS"
                      elif failure:
                          result = "FAILURE"

                      observations.append({
                          "agent": canonical(agent_name),
                          "display_name": agent_name,
                          "agent_uuid": agent_uuid,
                          "domain": domain,
                          "type": "EXTERNAL_ID_WITH_BEHAVIOR",
                          "identity_confidence": 0.95,
                          "evidence_strength": "STRONG",
                          "result": result,
                          "source_claim_id": claim_id,
                      })

                  else:

                      observations.append({
                          "agent": canonical(agent_name),
                          "display_name": agent_name,
                          "agent_uuid": agent_uuid,
                          "domain": domain,
                          "type": "IDENTITY_REFERENCE",
                          "identity_confidence": 0.90,
                          "evidence_strength": "IDENTITY_ONLY",
                          "result": "UNKNOWN",
                          "source_claim_id": claim_id,
                      })

              # --------------------------------------------------
              # 3. @handle from explicit interaction
              # --------------------------------------------------

              for match in FOLLOW_RE.finditer(information):

                  agent_name = match.group(1)

                  if not valid_agent_name(agent_name):
                      continue

                  observations.append({
                      "agent": canonical(agent_name),
                      "display_name": agent_name,
                      "agent_uuid": None,
                      "domain": domain,
                      "type": "INTERACTION_TARGET",
                      "identity_confidence": 0.95,
                      "evidence_strength": "IDENTITY_ONLY",
                      "result": "UNKNOWN",
                      "source_claim_id": claim_id,
                  })

              # --------------------------------------------------
              # 4. target / requester
              # --------------------------------------------------

              for match in TARGET_RE.finditer(information):

                  agent_name = match.group(1)

                  if not valid_agent_name(agent_name):
                      continue

                  observations.append({
                      "agent": canonical(agent_name),
                      "display_name": agent_name,
                      "agent_uuid": None,
                      "domain": domain,
                      "type": "INTERACTION_TARGET",
                      "identity_confidence": 0.90,
                      "evidence_strength": "IDENTITY_ONLY",
                      "result": "UNKNOWN",
                      "source_claim_id": claim_id,
                  })

              # --------------------------------------------------
              # 5. @handles in explicit response/comment context
              # --------------------------------------------------

              if response_signal:

                  for match in HANDLE_RE.finditer(
                      information
                  ):

                      agent_name = match.group(1)

                      if not valid_agent_name(agent_name):
                          continue

                      result = "UNKNOWN"

                      if success:
                          result = "SUCCESS"
                      elif failure:
                          result = "FAILURE"

                      observations.append({
                          "agent": canonical(agent_name),
                          "display_name": agent_name,
                          "agent_uuid": None,
                          "domain": domain,
                          "type": "EXTERNAL_RESPONSE_HANDLE",
                          "identity_confidence": 0.85,
                          "evidence_strength": "STRONG",
                          "result": result,
                          "source_claim_id": claim_id,
                      })

              # --------------------------------------------------
              # 6. Bold external names
              #
              # Example:
              # **Wiener**
              #
              # Only evidence if the same entry contains a
              # meaningful behavioral/result signal.
              # --------------------------------------------------

              if success or failure or response_signal:

                  for match in BOLD_NAME_RE.finditer(
                      information
                  ):

                      agent_name = match.group(1).strip()

                      if not valid_agent_name(agent_name):
                          continue

                      result = "UNKNOWN"

                      if success:
                          result = "SUCCESS"
                      elif failure:
                          result = "FAILURE"

                      observations.append({
                          "agent": canonical(agent_name),
                          "display_name": agent_name,
                          "agent_uuid": None,
                          "domain": domain,
                          "type": "EXTERNAL_NAMED_CONTRIBUTION",
                          "identity_confidence": 0.80,
                          "evidence_strength": "STRONG",
                          "result": result,
                          "source_claim_id": claim_id,
                      })

              return observations


          # ======================================================
          # LOAD ACT17
          # ======================================================

          with open(
              KNOWLEDGE_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              knowledge = json.load(f)

          entries = knowledge.get(
              "knowledge",
              []
          )

          print(
              f"Knowledge entries processed: {len(entries)}"
          )

          # ======================================================
          # EXTRACT
          # ======================================================

          raw_observations = []

          for entry in entries:

              raw_observations.extend(
                  extract_observations(entry)
              )

          # ======================================================
          # DEDUPLICATION
          # ======================================================

          observations = []
          seen = set()

          for obs in raw_observations:

              key = (
                  obs["agent"],
                  obs["domain"],
                  obs["type"],
                  obs.get("agent_uuid"),
                  obs.get("source_claim_id"),
              )

              if key in seen:
                  continue

              seen.add(key)
              observations.append(obs)

          # ======================================================
          # GROUP BY AGENT + DOMAIN
          # ======================================================

          grouped = defaultdict(list)

          for obs in observations:

              grouped[
                  (
                      obs["agent"],
                      obs["domain"]
                  )
              ].append(obs)

          profiles = []

          # ======================================================
          # BUILD TRUST PROFILES
          # ======================================================

          for (
              agent,
              domain
          ), obs_list in sorted(grouped.items()):

              evidence = [
                  obs
                  for obs in obs_list
                  if obs["evidence_strength"] == "STRONG"
              ]

              identity_only = [
                  obs
                  for obs in obs_list
                  if obs["evidence_strength"]
                  == "IDENTITY_ONLY"
              ]

              successful = [
                  obs
                  for obs in evidence
                  if obs["result"] == "SUCCESS"
              ]

              failures = [
                  obs
                  for obs in evidence
                  if obs["result"] == "FAILURE"
              ]

              claim_ids = sorted({
                  obs["source_claim_id"]
                  for obs in obs_list
                  if obs.get("source_claim_id")
              })

              total = len(obs_list)
              evidence_count = len(evidence)
              identity_count = len(identity_only)
              success_count = len(successful)
              failure_count = len(failures)

              # --------------------------------------------------
              # Independent corroboration
              # --------------------------------------------------

              corroborations = max(
                  0,
                  len(claim_ids) - 1
              )

              # --------------------------------------------------
              # Trust calculation
              #
              # IMPORTANT:
              # - karma = never used
              # - followers = never used
              # - posts = never used
              # - identity-only = never creates trust
              # --------------------------------------------------

              if evidence_count == 0:

                  trust_score = 0.0
                  trust_level = "UNKNOWN"

              else:

                  evidence_ratio = (
                      evidence_count
                      / max(1, total)
                  )

                  evidence_depth = min(
                      1.0,
                      evidence_count / 3.0
                  )

                  success_ratio = (
                      success_count
                      / max(1, evidence_count)
                  )

                  failure_penalty = min(
                      0.20,
                      failure_count * 0.05
                  )

                  corroboration_bonus = min(
                      0.20,
                      corroborations * 0.05
                  )

                  trust_score = (
                      0.35 * evidence_ratio
                      + 0.25 * evidence_depth
                      + 0.20 * success_ratio
                      + corroboration_bonus
                      - failure_penalty
                  )

                  trust_score = round(
                      max(
                          0.0,
                          min(
                              1.0,
                              trust_score
                          )
                      ),
                      3
                  )

                  if (
                      evidence_count >= 3
                      and success_count >= 2
                      and trust_score >= 0.75
                  ):

                      trust_level = "HIGH"

                  elif (
                      evidence_count >= 2
                      and trust_score >= 0.55
                  ):

                      trust_level = "MEDIUM"

                  else:

                      trust_level = "LOW"

              # --------------------------------------------------
              # Decision
              # --------------------------------------------------

              if evidence_count == 0:

                  decision = (
                      "IDENTITY_ONLY_NOT_RELIABLE_FOR_TRUST"
                  )

              elif trust_level == "HIGH":

                  decision = "SIGNIFICANT_TRUST"

              elif trust_level == "MEDIUM":

                  decision = "SUPPORTING_TRUST"

              else:

                  decision = "CAUTIOUS_USE"

              profile_id = hashlib.sha256(
                  f"{agent}|{domain}".encode(
                      "utf-8"
                  )
              ).hexdigest()[:16]

              profiles.append({

                  "profile_id": profile_id,

                  "agent": agent,

                  "domain": domain,

                  "observations": total,

                  "evidence_observations":
                      evidence_count,

                  "interaction_observations":
                      identity_count,

                  "successful_observations":
                      success_count,

                  "failed_observations":
                      failure_count,

                  "corroborations":
                      corroborations,

                  "trust_score":
                      trust_score,

                  "trust_level":
                      trust_level,

                  "decision":
                      decision,

                  "evidence_claim_ids":
                      claim_ids[:20],

                  "policy": {

                      "karma_used": False,

                      "post_count_used": False,

                      "followers_used": False,

                      "identity_only_observations_counted_as_trust":
                          False,

                      "success_result_used_as_evidence":
                          True,

                      "failure_result_used_as_negative_evidence":
                          True,

                      "domain_specific":
                          True
                  }
              })

          # ======================================================
          # GLOBAL STATISTICS
          # ======================================================

          agents = sorted({
              profile["agent"]
              for profile in profiles
          })

          evidence_count = sum(
              1
              for obs in observations
              if obs["evidence_strength"] == "STRONG"
          )

          identity_only_count = sum(
              1
              for obs in observations
              if obs["evidence_strength"]
              == "IDENTITY_ONLY"
          )

          success_count = sum(
              1
              for obs in observations
              if obs.get("result") == "SUCCESS"
          )

          failure_count = sum(
              1
              for obs in observations
              if obs.get("result") == "FAILURE"
          )

          high_count = sum(
              1
              for profile in profiles
              if profile["trust_level"] == "HIGH"
          )

          medium_count = sum(
              1
              for profile in profiles
              if profile["trust_level"] == "MEDIUM"
          )

          low_count = sum(
              1
              for profile in profiles
              if profile["trust_level"] == "LOW"
          )

          unknown_count = sum(
              1
              for profile in profiles
              if profile["trust_level"] == "UNKNOWN"
          )

          now = datetime.now(
              timezone.utc
          ).isoformat()

          # ======================================================
          # OUTPUT
          # ======================================================

          output = {

              "version":
                  "ACT18-V1.4",

              "generated_at":
                  now,

              "purpose":
                  (
                      "Domain-specific reputation and trust "
                      "layer built from evidence already stored "
                      "by ACT17."
                  ),

              "knowledge_source":
                  KNOWLEDGE_FILE,

              "policy": {

                  "karma_is_not_reputation":
                      True,

                  "post_count_is_not_reputation":
                      True,

                  "followers_are_not_reputation":
                      True,

                  "interaction_identity_is_not_trust":
                      True,

                  "trust_requires_evidence":
                      True,

                  "trust_is_domain_specific":
                      True,

                  "nox_identity_excluded":
                      True,

                  "success_can_strengthen_evidence":
                      True,

                  "failure_can_reduce_confidence":
                      True
              },

              "agents":
                  agents,

              "profiles":
                  profiles,

              "statistics": {

                  "knowledge_entries_processed":
                      len(entries),

                  "observations_extracted":
                      len(observations),

                  "external_agents_detected":
                      len(agents),

                  "agent_domain_profiles":
                      len(profiles),

                  "evidence_observations":
                      evidence_count,

                  "interaction_only_observations":
                      identity_only_count,

                  "successful_evidence_observations":
                      success_count,

                  "failed_evidence_observations":
                      failure_count,

                  "high_trust_profiles":
                      high_count,

                  "medium_trust_profiles":
                      medium_count,

                  "low_trust_profiles":
                      low_count,

                  "unknown_trust_profiles":
                      unknown_count
              },

              "decision_rules": {

                  "HIGH":
                      (
                          "Strong and repeated evidence "
                          "with relevant successful observations."
                      ),

                  "MEDIUM":
                      (
                          "Multiple useful evidence observations; "
                          "supporting corroboration is preferred."
                      ),

                  "LOW":
                      (
                          "Some evidence exists, but the profile "
                          "must be used cautiously."
                      ),

                  "UNKNOWN":
                      (
                          "Identity is known, but there is "
                          "insufficient behavioral evidence "
                          "to establish trust."
                      )
              },

              "last_run":
                  now
          }

          # ======================================================
          # WRITE MEMORY
          # ======================================================

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ======================================================
          # CONSOLE REPORT
          # ======================================================

          print()
          print("================================================")
          print("ACT18 BUILD COMPLETE")
          print("================================================")
          print(
              f"Knowledge entries processed: "
              f"{len(entries)}"
          )
          print(
              f"Observations extracted: "
              f"{len(observations)}"
          )
          print(
              f"External agents detected: "
              f"{len(agents)}"
          )
          print(
              f"Agent/domain profiles: "
              f"{len(profiles)}"
          )
          print(
              f"Evidence observations: "
              f"{evidence_count}"
          )
          print(
              f"Interaction-only observations: "
              f"{identity_only_count}"
          )
          print(
              f"Successful evidence: "
              f"{success_count}"
          )
          print(
              f"Failed evidence: "
              f"{failure_count}"
          )
          print(
              f"HIGH: {high_count}"
          )
          print(
              f"MEDIUM: {medium_count}"
          )
          print(
              f"LOW: {low_count}"
          )
          print(
              f"UNKNOWN: {unknown_count}"
          )
          print(
              f"Output: {OUTPUT_FILE}"
          )
          print("================================================")

          PY

      # ==========================================================
      # 3. VALIDATION
      # ==========================================================
      - name: Validate ACT18
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys

          path = "memory/nox_reputation_trust.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          required = [
              "version",
              "generated_at",
              "knowledge_source",
              "policy",
              "agents",
              "profiles",
              "statistics",
              "decision_rules",
              "last_run"
          ]

          missing = [
              key
              for key in required
              if key not in data
          ]

          if missing:

              print(
                  "VALIDATION FAILED - missing:",
                  missing
              )

              sys.exit(1)

          stats = data["statistics"]

          if (
              stats["external_agents_detected"]
              != len(data["agents"])
          ):

              print(
                  "VALIDATION FAILED - agent count mismatch"
              )

              sys.exit(1)

          if (
              stats["agent_domain_profiles"]
              != len(data["profiles"])
          ):

              print(
                  "VALIDATION FAILED - profile count mismatch"
              )

              sys.exit(1)

          for profile in data["profiles"]:

              agent = profile["agent"]

              if agent in {
                  "nox_origin",
                  "nox_origine",
                  "nox origin",
                  "nøx origin",
                  "nox"
              }:

                  print(
                      "VALIDATION FAILED - NØX detected"
                  )

                  sys.exit(1)

              if profile["trust_level"] not in {
                  "HIGH",
                  "MEDIUM",
                  "LOW",
                  "UNKNOWN"
              }:

                  print(
                      "VALIDATION FAILED - invalid trust level"
                  )

                  sys.exit(1)

              score = profile["trust_score"]

              if score < 0 or score > 1:

                  print(
                      "VALIDATION FAILED - invalid trust score"
                  )

                  sys.exit(1)

              policy = profile["policy"]

              if policy["karma_used"] is not False:
                  print("VALIDATION FAILED - karma used")
                  sys.exit(1)

              if policy["post_count_used"] is not False:
                  print("VALIDATION FAILED - post count used")
                  sys.exit(1)

              if policy["followers_used"] is not False:
                  print("VALIDATION FAILED - followers used")
                  sys.exit(1)

              if (
                  policy[
                      "identity_only_observations_counted_as_trust"
                  ]
                  is not False
              ):

                  print(
                      "VALIDATION FAILED - identity-only "
                      "observations counted as trust"
                  )

                  sys.exit(1)

          print()
          print("================================================")
          print("ACT18 VALIDATION PASSED")
          print("================================================")
          print(
              "Version:",
              data["version"]
          )
          print(
              "External agents:",
              stats["external_agents_detected"]
          )
          print(
