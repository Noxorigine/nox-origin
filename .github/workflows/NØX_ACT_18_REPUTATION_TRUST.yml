name: NØX ACT 18 - Reputation & Trust

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ACT18 Reputation & Trust
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NØX ACT 18 - REPUTATION & TRUST"
          echo "================================================"

          python3 <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timezone

          INPUT = Path("memory/nox_knowledge_core.json")
          OUTPUT = Path("memory/nox_reputation_trust.json")

          VERSION = "ACT18-V1.5"

          if not INPUT.exists():
              raise SystemExit("ERROR: ACT17 knowledge core not found")

          with INPUT.open("r", encoding="utf-8") as f:
              data = json.load(f)

          knowledge = data.get("knowledge", [])

          print(f"Knowledge entries processed: {len(knowledge)}")

          # ------------------------------------------------------------
          # NØX identity
          # ------------------------------------------------------------

          NOX_NAMES = {
              "nox",
              "nox origin",
              "nox_origine",
              "@nox_origine",
              "noxorigine"
          }

          # ------------------------------------------------------------
          # Strong identity rules
          #
          # IMPORTANT:
          # A textual word/phrase is NOT an agent merely because it
          # appears in a publication.
          #
          # Valid identities require an explicit external-agent signal:
          #   - explicit @handle
          #   - explicit username field
          #   - explicit agent identity structure
          #   - UUID + identifiable name
          #   - explicit follow target
          #
          # Generic nouns, titles, statuses, labels and concepts are
          # rejected.
          # ------------------------------------------------------------

          GENERIC_REJECTS = {
              "agent",
              "agents",
              "public_posts",
              "substantive_comment",
              "identity_classification_verified",
              "action_executed",
              "discussion",
              "hash",
              "success",
              "failure",
              "unknown",
              "unresolved",
              "not_evaluable",
              "none",
              "untested",
              "strong_stability",
              "adaptive balanced",
              "resilience",
              "specie",
              "pay",
              "machine-native payments",
              "sovereign rails",
              "what i can actually finish",
              "what i will not do",
              "deep seeker",
              "deep-seeker",
              "wiener",
              "molt",
          }

          # Words which commonly occur as ordinary content rather than
          # identities. These are deliberately conservative.
          GENERIC_WORDS = {
              "ai",
              "api",
              "bot",
              "agent",
              "agents",
              "system",
              "memory",
              "marketplace",
              "payments",
              "payment",
              "economy",
              "knowledge",
              "reputation",
              "trust",
              "research",
              "discussion",
              "comment",
              "post",
              "publication",
              "source",
              "result",
              "action",
              "response",
              "request",
              "task",
              "opportunity",
              "strategy",
              "learning",
              "failure",
              "success",
              "error",
              "unknown",
              "verified",
              "identity",
              "classification",
              "domain",
              "general",
              "virtual economy",
              "ai communities"
          }

          def clean_name(value):
              if value is None:
                  return None

              value = str(value).strip()

              if not value:
                  return None

              value = re.sub(r"\s+", " ", value)

              if len(value) > 80:
                  return None

              return value

          def normalize_name(value):
              value = clean_name(value)
              if not value:
                  return None

              value = value.strip()

              if value.startswith("@"):
                  value = value[1:]

              return value.lower()

          def is_valid_candidate(name):
              name = clean_name(name)
              if not name:
                  return False

              normalized = normalize_name(name)

              if not normalized:
                  return False

              if normalized in NOX_NAMES:
                  return False

              if normalized in GENERIC_REJECTS:
                  return False

              if normalized in GENERIC_WORDS:
                  return False

              # Reject pure numbers / hashes / UUID-like strings.
              if re.fullmatch(r"[0-9a-f]{12,}", normalized):
                  return False

              if re.fullmatch(
                  r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
                  normalized
              ):
                  return False

              # Reject obvious labels / machine metadata.
              if normalized.startswith(("http://", "https://")):
                  return False

              if ":" in normalized:
                  return False

              # A valid @handle is usually compact and identifier-like.
              if re.fullmatch(r"@?[a-z0-9][a-z0-9._-]{2,50}", name.lower()):
                  return True

              # Human/agent display names are allowed only when backed
              # by a strong identity structure. This function itself
              # does not make them strong.
              words = normalized.split()

              if len(words) > 8:
                  return False

              if all(w in GENERIC_WORDS for w in words):
                  return False

              return True

          def add_candidate(found, name, source_type, strength, context):
              name = clean_name(name)

              if not is_valid_candidate(name):
                  return

              key = normalize_name(name)

              found[key].append({
                  "name": name.lstrip("@"),
                  "source_type": source_type,
                  "strength": strength,
                  "context": context[:600]
              })

          # ------------------------------------------------------------
          # Explicit identity extraction
          # ------------------------------------------------------------

          def extract_external_agents(entry):
              found = defaultdict(list)

              raw = json.dumps(entry, ensure_ascii=False)

              info = str(entry.get("information", ""))
              response = str(entry.get("response", ""))
              comment = str(entry.get("comment", ""))
              reply = str(entry.get("reply", ""))
              title = str(entry.get("title", ""))

              combined = " ".join([
                  info,
                  response,
                  comment,
                  reply,
                  title
              ])

              # --------------------------------------------------------
              # 1. Explicit @handle
              #
              # This is strong only when the handle occurs in an
              # interaction/identity context.
              # --------------------------------------------------------

              interaction_context = re.search(
                  r"(follow|followed|following|reply|replied|comment|commented|"
                  r"response|responded|author|target|requester|recipient|"
                  r"agent|username|interaction)",
                  combined,
                  re.IGNORECASE
              )

              if interaction_context:
                  for match in re.finditer(
                      r"@([A-Za-z0-9][A-Za-z0-9_.-]{2,50})",
                      combined
                  ):
                      handle = match.group(1)
                      start = max(0, match.start() - 180)
                      end = min(len(combined), match.end() + 180)
                      context = combined[start:end]

                      add_candidate(
                          found,
                          handle,
                          "explicit_handle",
                          "STRONG",
                          context
                      )

              # --------------------------------------------------------
              # 2. Explicit Follow target
              # --------------------------------------------------------

              for match in re.finditer(
                  r"\bfollow(?:ed|ing)?\b.{0,120}?@?([A-Za-z0-9][A-Za-z0-9_.-]{2,50})",
                  combined,
                  re.IGNORECASE
              ):
                  candidate = match.group(1)

                  add_candidate(
                      found,
                      candidate,
                      "follow_target",
                      "STRONG",
                      combined[
                          max(0, match.start() - 100):
                          min(len(combined), match.end() + 100)
                      ]
                  )

              # --------------------------------------------------------
              # 3. Explicit structured username / agent fields
              #
              # Only use values from actual identity-like fields.
              # Never infer names from arbitrary text.
              # --------------------------------------------------------

              identity_keys = {
                  "username",
                  "user_name",
                  "agent_username",
                  "agent_name",
                  "target_agent",
                  "target_username",
                  "requester",
                  "recipient"
              }

              def walk(obj, parent_key=None):
                  if isinstance(obj, dict):
                      for key, value in obj.items():
                          key_norm = str(key).lower().strip()

                          if key_norm in identity_keys:
                              if isinstance(value, str):
                                  add_candidate(
                                      found,
                                      value,
                                      f"structured_{key_norm}",
                                      "STRONG",
                                      raw[:600]
                                  )

                          walk(value, key_norm)

                  elif isinstance(obj, list):
                      for item in obj:
                          walk(item, parent_key)

              walk(entry)

              # --------------------------------------------------------
              # 4. UUID + explicit name structure
              #
              # Accept only if the object itself has identity fields.
              # --------------------------------------------------------

              def walk_uuid_objects(obj):
                  if isinstance(obj, dict):

                      has_uuid = any(
                          str(k).lower() in {
                              "uuid",
                              "agent_uuid",
                              "user_uuid",
                              "author_uuid",
                              "target_uuid"
                          }
                          for k in obj.keys()
                      )

                      if has_uuid:
                          for key in (
                              "username",
                              "agent_username",
                              "agent_name",
                              "name",
                              "display_name",
                              "author",
                              "target_agent"
                          ):
                              if key in obj and isinstance(obj[key], str):
                                  candidate = obj[key]

                                  if is_valid_candidate(candidate):
                                      add_candidate(
                                          found,
                                          candidate,
                                          "uuid_identity",
                                          "STRONG",
                                          json.dumps(
                                              obj,
                                              ensure_ascii=False
                                          )[:600]
                                      )

                      for value in obj.values():
                          walk_uuid_objects(value)

                  elif isinstance(obj, list):
                      for item in obj:
                          walk_uuid_objects(item)

              walk_uuid_objects(entry)

              # --------------------------------------------------------
              # 5. Explicit "agent: NAME" / "agent NAME" patterns
              #
              # Conservative: accept only when surrounding text clearly
              # indicates an identity declaration.
              # --------------------------------------------------------

              explicit_patterns = [
                  r"\bagent\s*[:=]\s*@?([A-Za-z0-9][A-Za-z0-9_.-]{2,50})\b",
                  r"\busername\s*[:=]\s*@?([A-Za-z0-9][A-Za-z0-9_.-]{2,50})\b",
                  r"\bauthor\s*[:=]\s*@?([A-Za-z0-9][A-Za-z0-9_.-]{2,50})\b",
                  r"\btarget(?:_agent)?\s*[:=]\s*@?([A-Za-z0-9][A-Za-z0-9_.-]{2,50})\b"
              ]

              for pattern in explicit_patterns:
                  for match in re.finditer(
                      pattern,
                      combined,
                      re.IGNORECASE
                  ):
                      add_candidate(
                          found,
                          match.group(1),
                          "explicit_identity_label",
                          "STRONG",
                          combined[
                              max(0, match.start() - 100):
                              min(len(combined), match.end() + 100)
                          ]
                      )

              # --------------------------------------------------------
              # IMPORTANT:
              #
              # Do NOT extract arbitrary bold names, title fragments,
              # capitalized words, nouns, concepts or publication titles.
              #
              # This is the principal correction from V1.4.
              # --------------------------------------------------------

              return found

          # ------------------------------------------------------------
          # Domain detection
          # ------------------------------------------------------------

          def detect_domain(entry):
              domain = entry.get("domain")

              if isinstance(domain, str) and domain.strip():
                  return domain.strip()

              text = json.dumps(
                  entry,
                  ensure_ascii=False
              ).lower()

              if any(
                  x in text
                  for x in (
                      "marketplace",
                      "payment",
                      "lightning",
                      "wallet",
                      "economy"
                  )
              ):
                  return "virtual_economy"

              if any(
                  x in text
                  for x in (
                      "autonomy",
                      "agent intelligence",
                      "learning",
                      "decision"
                  )
              ):
                  return "agent_intelligence_and_autonomy"

              if any(
                  x in text
                  for x in (
                      "colony",
                      "agent",
                      "community",
                      "interaction"
                  )
              ):
                  return "ai_communities"

              return "general"

          # ------------------------------------------------------------
          # Build observations
          # ------------------------------------------------------------

          observations = []

          for entry in knowledge:
              found = extract_external_agents(entry)

              if not found:
                  continue

              claim_id = str(
                  entry.get("claim_id")
                  or entry.get("id")
                  or hashlib.sha1(
                      json.dumps(
                          entry,
                          sort_keys=True,
                          ensure_ascii=False
                      ).encode("utf-8")
                  ).hexdigest()[:20]
              )

              domain = detect_domain(entry)

              entry_text = json.dumps(
                  entry,
                  ensure_ascii=False
              )

              success = bool(
                  re.search(
                      r"\bSUCCESS\b|\bSUCCEEDED\b|\bsuccessful\b",
                      entry_text,
                      re.IGNORECASE
                  )
              )

              failure = bool(
                  re.search(
                      r"\bFAIL(?:ED|URE)?\b|\bERROR\b",
                      entry_text,
                      re.IGNORECASE
                  )
              )

              for key, candidates in found.items():

                  # A candidate is considered external only if at least
                  # one STRONG identity signal exists.
                  strong = [
                      c for c in candidates
                      if c["strength"] == "STRONG"
                  ]

                  if not strong:
                      continue

                  # Deduplicate same agent within same claim.
                  representative = strong[0]

                  observations.append({
                      "agent": representative["name"].lower(),
                      "domain": domain,
                      "claim_id": claim_id,
                      "evidence": True,
                      "identity_only": False,
                      "success": success,
                      "failure": failure,
                      "source_type": representative["source_type"],
                      "context": representative["context"]
                  })

          # ------------------------------------------------------------
          # Deduplicate observations
          # ------------------------------------------------------------

          unique = {}

          for obs in observations:
              key = (
                  obs["agent"],
                  obs["domain"],
                  obs["claim_id"]
              )

              if key not in unique:
                  unique[key] = obs

          observations = list(unique.values())

          # ------------------------------------------------------------
          # Build profiles
          # ------------------------------------------------------------

          grouped = defaultdict(list)

          for obs in observations:
              grouped[
                  (
                      obs["agent"],
                      obs["domain"]
                  )
              ].append(obs)

          profiles = []

          for (agent, domain), obs_list in sorted(grouped.items()):

              observations_count = len(obs_list)

              evidence_obs = [
                  o for o in obs_list
                  if o["evidence"]
              ]

              interaction_obs = [
                  o for o in obs_list
                  if not o["evidence"]
              ]

              successful = [
                  o for o in evidence_obs
                  if o["success"]
              ]

              failed = [
                  o for o in evidence_obs
                  if o["failure"]
              ]

              claim_ids = sorted({
                  o["claim_id"]
                  for o in evidence_obs
              })

              corroborations = max(
                  0,
                  len(claim_ids) - 1
              )

              evidence_count = len(evidence_obs)

              # --------------------------------------------------------
              # Trust scoring
              #
              # Identity alone = ZERO trust.
              # Evidence is required.
              # Repeated evidence and successful results strengthen trust.
              # Failures reduce confidence.
              # --------------------------------------------------------

              if evidence_count == 0:
                  score = 0.0
                  level = "UNKNOWN"
                  decision = "IDENTITY_ONLY_NOT_RELIABLE_FOR_TRUST"

              else:
                  evidence_ratio = min(
                      1.0,
                      evidence_count / 4.0
                  )

                  depth = min(
                      1.0,
                      (evidence_count + corroborations) / 5.0
                  )

                  if evidence_count:
                      success_ratio = (
                          len(successful) / evidence_count
                      )
                  else:
                      success_ratio = 0.0

                  failure_ratio = (
                      len(failed) / evidence_count
                      if evidence_count
                      else 0.0
                  )

                  score = (
                      0.35 * evidence_ratio +
                      0.25 * depth +
                      0.30 * success_ratio +
                      0.10 * min(1.0, corroborations / 3.0)
                      - 0.25 * failure_ratio
                  )

                  score = max(
                      0.0,
                      min(1.0, score)
                  )

                  if (
                      evidence_count >= 3
                      and len(successful) >= 2
                      and score >= 0.75
                  ):
                      level = "HIGH"
                      decision = "TRUST_WITHIN_DOMAIN"

                  elif (
                      evidence_count >= 2
                      and score >= 0.55
                  ):
                      level = "MEDIUM"
                      decision = "TRUST_WITH_CAUTION"

                  else:
                      level = "LOW"
                      decision = "CAUTIOUS_USE"

              profile_id = hashlib.sha256(
                  f"{agent}|{domain}".encode("utf-8")
              ).hexdigest()[:16]

              profiles.append({
                  "profile_id": profile_id,
                  "agent": agent,
                  "domain": domain,
                  "observations": observations_count,
                  "evidence_observations": evidence_count,
                  "interaction_observations": len(
                      interaction_obs
                  ),
                  "successful_observations": len(successful),
                  "failed_observations": len(failed),
                  "corroborations": corroborations,
                  "trust_score": round(score, 3),
                  "trust_level": level,
                  "decision": decision,
                  "evidence_claim_ids": claim_ids,
                  "policy": {
                      "karma_used": False,
                      "post_count_used": False,
                      "followers_used": False,
                      "identity_only_observations_counted_as_trust": False,
                      "success_result_used_as_evidence": True,
                      "failure_result_used_as_negative_evidence": True,
                      "domain_specific": True
                  }
              })

          # ------------------------------------------------------------
          # Agent list
          # ------------------------------------------------------------

          agents = sorted({
              p["agent"]
              for p in profiles
              if p["agent"] not in NOX_NAMES
          })

          # ------------------------------------------------------------
          # Statistics
          # ------------------------------------------------------------

          evidence_total = sum(
              p["evidence_observations"]
              for p in profiles
          )

          interaction_total = sum(
              p["interaction_observations"]
              for p in profiles
          )

          successful_total = sum(
              p["successful_observations"]
              for p in profiles
          )

          failed_total = sum(
              p["failed_observations"]
              for p in profiles
          )

          high_total = sum(
              p["trust_level"] == "HIGH"
              for p in profiles
          )

          medium_total = sum(
              p["trust_level"] == "MEDIUM"
              for p in profiles
          )

          low_total = sum(
              p["trust_level"] == "LOW"
              for p in profiles
          )

          unknown_total = sum(
              p["trust_level"] == "UNKNOWN"
              for p in profiles
          )

          # ------------------------------------------------------------
          # Validation
          # ------------------------------------------------------------

          print()
          print("ACT18 BUILD COMPLETE")
          print(f"Knowledge entries processed: {len(knowledge)}")
          print(f"Observations extracted: {len(observations)}")
          print(f"External agents detected: {len(agents)}")
          print(f"Agent/domain profiles: {len(profiles)}")
          print(f"Evidence observations: {evidence_total}")
          print(f"Interaction-only observations: {interaction_total}")
          print(f"Successful evidence: {successful_total}")
          print(f"Failed evidence: {failed_total}")
          print(f"HIGH: {high_total}")
          print(f"MEDIUM: {medium_total}")
          print(f"LOW: {low_total}")
          print(f"UNKNOWN: {unknown_total}")

          # ------------------------------------------------------------
          # Structural validation
          # ------------------------------------------------------------

          errors = []

          if not isinstance(profiles, list):
              errors.append("profiles must be a list")

          for profile in profiles:

              required = {
                  "profile_id",
                  "agent",
                  "domain",
                  "observations",
                  "evidence_observations",
                  "interaction_observations",
                  "successful_observations",
                  "failed_observations",
                  "corroborations",
                  "trust_score",
                  "trust_level",
                  "decision",
                  "evidence_claim_ids",
                  "policy"
              }

              missing = required - set(profile.keys())

              if missing:
                  errors.append(
                      f"{profile.get('agent')}: missing {sorted(missing)}"
                  )

              if normalize_name(profile.get("agent")) in NOX_NAMES:
                  errors.append(
                      "NØX identity incorrectly present in profiles"
                  )

              if profile.get("trust_level") not in {
                  "HIGH",
                  "MEDIUM",
                  "LOW",
                  "UNKNOWN"
              }:
                  errors.append(
                      f"{profile.get('agent')}: invalid trust level"
                  )

              score = profile.get("trust_score")

              if not isinstance(score, (int, float)):
                  errors.append(
                      f"{profile.get('agent')}: invalid score"
                  )

              elif score < 0 or score > 1:
                  errors.append(
                      f"{profile.get('agent')}: score outside 0..1"
                  )

              policy = profile.get("policy", {})

              if policy.get("karma_used") is not False:
                  errors.append(
                      f"{profile.get('agent')}: karma contamination"
                  )

              if policy.get("post_count_used") is not False:
                  errors.append(
                      f"{profile.get('agent')}: post count contamination"
                  )

              if policy.get("followers_used") is not False:
                  errors.append(
                      f"{profile.get('agent')}: follower contamination"
                  )

              if (
                  profile.get("evidence_observations", 0) == 0
                  and profile.get("trust_score", 0) != 0
              ):
                  errors.append(
                      f"{profile.get('agent')}: identity-only profile has trust"
                  )

          # ------------------------------------------------------------
          # False-positive protection
          # ------------------------------------------------------------

          suspicious = []

          for agent in agents:
              normalized = normalize_name(agent)

              if normalized in GENERIC_REJECTS:
                  suspicious.append(agent)

              if normalized in GENERIC_WORDS:
                  suspicious.append(agent)

          if suspicious:
              errors.append(
                  "Suspicious agent identities detected: "
                  + ", ".join(sorted(set(suspicious)))
              )

          if errors:
              print()
              print("VALIDATION FAILED")
              for error in errors:
                  print(" -", error)
              raise SystemExit(1)

          # ------------------------------------------------------------
          # Output
          # ------------------------------------------------------------

          generated_at = datetime.now(
              timezone.utc
          ).isoformat()

          output = {
              "version": VERSION,
              "generated_at": generated_at,
              "purpose": (
                  "Domain-specific reputation and trust layer "
                  "built from evidence already stored by ACT17."
              ),
              "knowledge_source": str(INPUT),
              "policy": {
                  "karma_is_not_reputation": True,
                  "post_count_is_not_reputation": True,
                  "followers_are_not_reputation": True,
                  "interaction_identity_is_not_trust": True,
                  "trust_requires_evidence": True,
                  "trust_is_domain_specific": True,
                  "nox_identity_excluded": True,
                  "success_can_strengthen_evidence": True,
                  "failure_can_reduce_confidence": True,
                  "generic_text_is_not_identity": True,
                  "explicit_identity_required": True
              },
              "agents": agents,
              "profiles": profiles,
              "statistics": {
                  "knowledge_entries_processed": len(knowledge),
                  "observations_extracted": len(observations),
                  "external_agents_detected": len(agents),
                  "agent_domain_profiles": len(profiles),
                  "evidence_observations": evidence_total,
                  "interaction_only_observations": interaction_total,
                  "successful_evidence_observations": successful_total,
                  "failed_evidence_observations": failed_total,
                  "high_trust_profiles": high_total,
                  "medium_trust_profiles": medium_total,
                  "low_trust_profiles": low_total,
                  "unknown_trust_profiles": unknown_total
              },
              "decision_rules": {
                  "HIGH": (
                      "Strong and repeated evidence with relevant "
                      "successful observations."
                  ),
                  "MEDIUM": (
                      "Multiple useful evidence observations; "
                      "supporting corroboration is preferred."
                  ),
                  "LOW": (
                      "Some evidence exists, but the profile must "
                      "be used cautiously."
                  ),
                  "UNKNOWN": (
                      "Identity is known, but there is insufficient "
                      "behavioral evidence to establish trust."
                  )
              },
              "last_run": generated_at
          }

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with OUTPUT.open(
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(f"Output: {OUTPUT}")
          print(f"Output size: {OUTPUT.stat().st_size} bytes")
          print("VALIDATION: PASS")
          PY

      - name: Commit ACT18 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 memory changes to commit."
          else
            git commit -m "NØX ACT18 V1.5 - corrected identity extraction"
            git push
          fi

          echo "================================================"
          echo "NØX ACT18 COMPLETE"
          echo "================================================"
