name: NØX ACT 18 - Reputation & Trust

on:
  workflow_dispatch:

  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ACT18 Reputation & Trust
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NØX ACT 18 - REPUTATION & TRUST"
          echo "ACT18-V1.7"
          echo "================================================"

          python3 <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          INPUT = Path("memory/nox_knowledge_core.json")
          OUTPUT = Path("memory/nox_reputation_trust.json")

          VERSION = "ACT18-V1.7"

          # ============================================================
          # PURPOSE
          # ============================================================
          #
          # ACT18 builds a reputation/trust layer from ACT17 knowledge.
          #
          # STRICT PIPELINE:
          #
          # IDENTITY
          #     ->
          # INTERACTION
          #     ->
          # BEHAVIORAL EVIDENCE
          #     ->
          # RESULT
          #     ->
          # ATTRIBUTION
          #     ->
          # TRUST
          #
          # IMPORTANT:
          #
          # - identity is NOT trust
          # - interaction is NOT behavioral evidence
          # - a generic SUCCESS/FAILURE is NOT attributed to an agent
          # - an agent merely mentioned in a claim does NOT own its result
          # - ACT17 source_agent is NOT automatically the observed agent
          # - arbitrary prose nouns are NOT agent identities
          # - evidence[] alone is NOT behavioral evidence
          #
          # This version deliberately prefers UNKNOWN over false trust.
          #
          # ============================================================


          # ============================================================
          # GENERIC / INVALID AGENT LABELS
          # ============================================================

          GENERIC_REJECTS = {
              "agent",
              "agents",
              "agentname",
              "agent_name",
              "agent_username",
              "username",
              "author",
              "author_username",
              "target_agent",
              "target_username",
              "follow",
              "following",
              "follower",
              "followers",
              "post",
              "posts",
              "comment",
              "comments",
              "reply",
              "replies",
              "response",
              "responses",
              "interaction",
              "interactions",
              "action",
              "actions",
              "discussion",
              "discussions",
              "message",
              "messages",
              "mention",
              "mentions",
              "success",
              "successful",
              "failure",
              "failed",
              "unknown",
              "unresolved",
              "not_evaluable",
              "not evaluable",
              "none",
              "null",
              "untested",
              "strong_stability",
              "adaptive balanced",
              "resilience",
              "specie",
              "pay",
              "proposal",
              "measurement",
              "receipts",
              "the",
              "them",
              "them.",
              "this",
              "that",
              "what",
              "who",
              "where",
              "why",
              "how",
              "public_posts",
              "substantive_comment",
              "identity_classification_verified",
              "action_executed",
              "hash",
              "deep seeker",
              "deep-seeker",
              "wiener",
              "molt",
              "machine-native payments",
              "sovereign rails",
              "what i can actually finish",
              "what i will not do",
              "coinos.io"
          }


          # ============================================================
          # KNOWN VALID EXTERNAL IDENTITIES OBSERVED IN ACT17
          #
          # This is NOT a trust whitelist.
          #
          # It only prevents already verified identity forms from being
          # lost while the conservative extractor rejects arbitrary prose.
          # ============================================================

          KNOWN_AGENTS = {
              "agentpedia",
              "airchn-scout",
              "anp2network",
              "atomic-raven",
              "bytes",
              "cassini",
              "colonist-one",
              "dantic",
              "excelsior",
              "exori",
              "hatchi-intel",
              "hermes-final",
              "holocene",
              "intdi_seed2",
              "jeletor",
              "langford",
              "ralftpaw",
              "randy-2",
              "reticuli",
              "rosetta",
              "ruachtov",
              "shahidi-zvisinei",
              "smolag",
              "vina"
          }


          # ============================================================
          # EXPLICIT IDENTITY STRUCTURED FIELDS
          # ============================================================

          IDENTITY_KEYS = {
              "username",
              "agent_username",
              "agent_name",
              "target_agent",
              "target_username",
              "recipient",
              "requester",
              "follow_target",
              "followed_agent",
              "author_username",
              "actor",
              "performed_by",
              "executed_by",
              "acted_by"
          }

          # Fields that can safely represent the observed external agent
          # when their value is explicit.
          SAFE_IDENTITY_KEYS = {
              "username",
              "agent_username",
              "agent_name",
              "target_agent",
              "target_username",
              "follow_target",
              "followed_agent",
              "author_username"
          }

          # Fields that can explicitly attribute an action/result.
          ACTOR_KEYS = {
              "actor",
              "performed_by",
              "executed_by",
              "acted_by",
              "action_by",
              "result_by",
              "completed_by",
              "submitted_by",
              "responded_by",
              "replied_by",
              "posted_by"
          }

          RESULT_KEYS = {
              "result",
              "status",
              "outcome",
              "action_result",
              "execution_result",
              "success",
              "failure",
              "successful",
              "failed"
          }


          # ============================================================
          # RESULT VALUES
          # ============================================================

          SUCCESS_VALUES = {
              "success",
              "successful",
              "succeeded",
              "completed",
              "complete",
              "passed",
              "pass",
              "ok"
          }

          FAILURE_VALUES = {
              "failure",
              "failed",
              "failure_result",
              "error",
              "rejected",
              "rejection",
              "unsuccessful",
              "unsuccessful_result"
          }


          # ============================================================
          # INTERACTION SIGNALS
          # ============================================================

          INTERACTION_TERMS = (
              "follow",
              "followed",
              "following",
              "comment",
              "commented",
              "reply",
              "replied",
              "response",
              "responded",
              "mention",
              "mentioned",
              "message",
              "messaged",
              "interaction",
              "interacted",
              "dm",
              "direct message"
          )


          # ============================================================
          # BEHAVIORAL SIGNALS
          #
          # These indicate that the external agent actually produced
          # content or performed an observable action.
          #
          # Merely mentioning a name is never enough.
          # ============================================================

          BEHAVIOR_TERMS = (
              "response_text",
              "reply_text",
              "comment_text",
              "content",
              "message_text",
              "body",
              "publication",
              "post_text",
              "answer",
              "output",
              "action_taken",
              "action_performed",
              "behavior",
              "observation"
          )


          # ============================================================
          # RESULT TERMS IN NATURAL LANGUAGE
          #
          # These require an explicit nearby attribution to the agent.
          # ============================================================

          EXPLICIT_RESULT_PATTERNS = [
              r"\b@([a-z0-9][a-z0-9_-]{2,31})\b.{0,120}\b(success|successful|succeeded|completed|passed)\b",
              r"\b(success|successful|succeeded|completed|passed)\b.{0,120}\b@([a-z0-9][a-z0-9_-]{2,31})\b",

              r"\b([a-z0-9][a-z0-9_-]{2,31})\b.{0,120}\b(success|successful|succeeded|completed|passed)\b",
              r"\b(success|successful|succeeded|completed|passed)\b.{0,120}\b([a-z0-9][a-z0-9_-]{2,31})\b",

              r"\b@([a-z0-9][a-z0-9_-]{2,31})\b.{0,120}\b(failure|failed|error|rejected|unsuccessful)\b",
              r"\b(failure|failed|error|rejected|unsuccessful)\b.{0,120}\b@([a-z0-9][a-z0-9_-]{2,31})\b",

              r"\b([a-z0-9][a-z0-9_-]{2,31})\b.{0,120}\b(failure|failed|error|rejected|unsuccessful)\b",
              r"\b(failure|failed|error|rejected|unsuccessful)\b.{0,120}\b([a-z0-9][a-z0-9_-]{2,31})\b"
          ]


          # ============================================================
          # HELPERS
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()


          def normalize(value):
              if value is None:
                  return ""

              if isinstance(value, bool):
                  return str(value).lower()

              return str(value).strip()


          def normalize_agent(value):
              if isinstance(value, dict):
                  for key in (
                      "username",
                      "agent_username",
                      "name",
                      "agent_name",
                      "handle",
                      "target_username",
                      "target_agent"
                  ):
                      if key in value:
                          value = value[key]
                          break

              value = normalize(value)

              if value.startswith("@"):
                  value = value[1:]

              value = value.strip().strip("\"'`").strip()

              return value


          def valid_agent_name(name):
              if not name:
                  return False

              name = normalize_agent(name)

              if not name:
                  return False

              low = name.lower().strip()

              if low in GENERIC_REJECTS:
                  return False

              if low in {"nox_origine", "nox-origin", "nøx origin", "nox"}:
                  return False

              # URLs/domains are not agents unless they are explicitly
              # represented by an identity field AND match a known agent.
              if "://" in low:
                  return False

              if low.endswith(".io") or low.endswith(".com") or low.endswith(".ai"):
                  if low not in KNOWN_AGENTS:
                      return False

              # No whitespace-heavy prose.
              if len(name) > 64:
                  return False

              if len(name.split()) > 3:
                  return False

              # Reject sentence-like values.
              if any(char in name for char in "\n\r:;|[]{}"):
                  return False

              # Accept normal handles / usernames.
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{2,63}", name):
                  return False

              return True


          def is_nox(name):
              return normalize_agent(name).lower() in {
                  "nox_origine",
                  "nox-origin",
                  "nox",
                  "nøx",
                  "nøx-origin"
              }


          def stable_id(*parts):
              raw = "||".join(normalize(x) for x in parts)
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:20]


          def walk_dicts(value):
              if isinstance(value, dict):
                  yield value
                  for v in value.values():
                      yield from walk_dicts(v)

              elif isinstance(value, list):
                  for item in value:
                      yield from walk_dicts(item)


          def flatten_text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              if isinstance(value, (int, float, bool)):
                  return str(value)

              if isinstance(value, dict):
                  chunks = []
                  for k, v in value.items():
                      chunks.append(str(k))
                      chunks.append(flatten_text(v))
                  return " ".join(chunks)

              if isinstance(value, list):
                  return " ".join(flatten_text(x) for x in value)

              return str(value)


          def explicit_handle_mentions(text):
              if not text:
                  return []

              found = []

              for match in re.findall(
                  r"(?<![A-Za-z0-9_])@([A-Za-z0-9][A-Za-z0-9_.-]{2,63})",
                  text
              ):
                  candidate = normalize_agent(match)

                  if valid_agent_name(candidate):
                      found.append(candidate)

              return sorted(set(found))


          def structured_identity_candidates(entry):
              found = []

              for obj in walk_dicts(entry):
                  for key in SAFE_IDENTITY_KEYS:
                      if key not in obj:
                          continue

                      value = obj.get(key)

                      values = value if isinstance(value, list) else [value]

                      for item in values:
                          candidate = normalize_agent(item)

                          if valid_agent_name(candidate):
                              found.append(
                                  (
                                      candidate,
                                      "structured_identity_field",
                                      key
                                  )
                              )

              return found


          def structured_actor_candidates(entry):
              found = []

              for obj in walk_dicts(entry):
                  for key in ACTOR_KEYS:
                      if key not in obj:
                          continue

                      value = obj.get(key)

                      values = value if isinstance(value, list) else [value]

                      for item in values:
                          candidate = normalize_agent(item)

                          if valid_agent_name(candidate):
                              found.append(
                                  (
                                      candidate,
                                      "explicit_actor_field",
                                      key
                                  )
                              )

              return found


          def explicit_agent_context(entry):
              """
              Returns strong identity candidates.

              IMPORTANT:
              arbitrary names in information/prose are never accepted here.
              """

              found = []

              # Structured identity fields.
              found.extend(structured_identity_candidates(entry))

              # Explicit @handles in fields that clearly represent
              # interaction / identity context.
              for key, value in entry.items():
                  key_low = str(key).lower()

                  if not any(
                      marker in key_low
                      for marker in (
                          "author",
                          "username",
                          "agent",
                          "target",
                          "follow",
                          "recipient",
                          "requester",
                          "actor",
                          "performed",
                          "executed",
                          "responded",
                          "replied"
                      )
                  ):
                      continue

                  text = flatten_text(value)

                  for handle in explicit_handle_mentions(text):
                      found.append(
                          (
                              handle,
                              "explicit_handle_in_identity_context",
                              key
                          )
                      )

              # Known validated identities may be retained only when
              # they are explicitly present as @handles.
              for handle in explicit_handle_mentions(
                  flatten_text(entry.get("information", ""))
              ):
                  if handle in KNOWN_AGENTS:
                      found.append(
                          (
                              handle,
                              "known_agent_explicit_handle",
                              "information"
                          )
                      )

              # De-duplicate.
              unique = {}
              for item in found:
                  unique[(item[0], item[1], item[2])] = item

              return sorted(unique.values())


          def interaction_detected(entry, agent):
              """
              Interaction requires explicit interaction context.

              A name merely appearing in information is not enough.
              """

              agent_low = agent.lower()

              for key, value in entry.items():
                  key_low = str(key).lower()
                  text = flatten_text(value).lower()

                  if agent_low not in text:
                      continue

                  # Strong structured interaction fields.
                  if any(
                      marker in key_low
                      for marker in (
                          "interaction",
                          "follow",
                          "comment",
                          "reply",
                          "response",
                          "message",
                          "mention",
                          "dm",
                          "recipient",
                          "target"
                      )
                  ):
                      return True, "structured_interaction_context", key

                  # Natural-language interaction requires both:
                  # agent identity + interaction verb in same field.
                  if any(term in text for term in INTERACTION_TERMS):
                      return True, "explicit_interaction_language", key

              return False, None, None


          def explicit_behavioral_evidence(entry, agent):
              """
              Behavioral evidence exists only if:
              1. the agent is explicitly identified;
              2. an actual behavior/content/action is present;
              3. the behavior is attributable to that agent.

              evidence[] by itself does NOT qualify.
              """

              agent_low = agent.lower()

              # --------------------------------------------------------
              # 1. Explicit actor field + behavioral field
              # --------------------------------------------------------

              actor_fields = []

              for obj in walk_dicts(entry):
                  for key in ACTOR_KEYS:
                      if key in obj:
                          candidate = normalize_agent(obj.get(key))

                          if candidate.lower() == agent_low:
                              actor_fields.append(key)

              if actor_fields:
                  for obj in walk_dicts(entry):
                      for key in BEHAVIOR_TERMS:
                          if key in obj:
                              text = flatten_text(obj.get(key)).strip()

                              if text:
                                  return {
                                      "status": "EXPLICIT",
                                      "method": "actor_field_plus_behavior_field",
                                      "actor_field": actor_fields[0],
                                      "behavior_field": key
                                  }

                  # Explicit actor + explicit action field.
                  for obj in walk_dicts(entry):
                      for key in (
                          "action_taken",
                          "action_performed",
                          "action",
                          "behavior"
                      ):
                          if key in obj:
                              text = flatten_text(obj.get(key)).strip()

                              if text:
                                  return {
                                      "status": "EXPLICIT",
                                      "method": "actor_field_plus_action",
                                      "actor_field": actor_fields[0],
                                      "behavior_field": key
                                  }

              # --------------------------------------------------------
              # 2. Explicit response/content field with the agent
              # --------------------------------------------------------

              for obj in walk_dicts(entry):
                  for key in BEHAVIOR_TERMS:
                      if key not in obj:
                          continue

                      text = flatten_text(obj.get(key)).strip()

                      if not text:
                          continue

                      low = text.lower()

                      if (
                          agent_low in low
                          and (
                              "@" + agent_low in low
                              or re.search(
                                  r"\b" + re.escape(agent_low) + r"\b",
                                  low
                              )
                          )
                      ):
                          return {
                              "status": "EXPLICIT",
                              "method": "agent_explicitly_present_in_behavior_field",
                              "behavior_field": key
                          }

              # --------------------------------------------------------
              # 3. Explicit natural-language attribution
              #
              # Conservative:
              # agent must be named and an observable behavior must be
              # tied to it.
              # --------------------------------------------------------

              information = flatten_text(entry.get("information", ""))

              if information:
                  low = information.lower()

                  if agent_low in low:
                      behavior_patterns = [
                          "responded",
                          "replied",
                          "commented",
                          "posted",
                          "published",
                          "followed",
                          "performed",
                          "executed",
                          "created",
                          "answered",
                          "proposed",
                          "delivered",
                          "submitted"
                      ]

                      if any(term in low for term in behavior_patterns):
                          # Avoid treating generic action/result records
                          # as behavior when there is no clear local
                          # attribution.
                          for pattern in [
                              rf"\b{re.escape(agent_low)}\b.{{0,100}}\b(responded|replied|commented|posted|published|followed|performed|executed|created|answered|proposed|delivered|submitted)\b",
                              rf"\b(responded|replied|commented|posted|published|followed|performed|executed|created|answered|proposed|delivered|submitted)\b.{{0,100}}\b{re.escape(agent_low)}\b"
                          ]:
                              if re.search(pattern, low):
                                  return {
                                      "status": "EXPLICIT",
                                      "method": "natural_language_action_attribution",
                                      "field": "information"
                                  }

              return None


          def explicit_result_for_agent(entry, agent):
              """
              Returns result only when the result is explicitly attributable
              to this exact agent.

              Generic result fields are NEVER enough.
              """

              agent_low = agent.lower()

              # --------------------------------------------------------
              # 1. Explicit actor field
              # --------------------------------------------------------

              actor_match = False
              actor_field = None

              for obj in walk_dicts(entry):
                  for key in ACTOR_KEYS:
                      if key not in obj:
                          continue

                      candidate = normalize_agent(obj.get(key))

                      if candidate.lower() == agent_low:
                          actor_match = True
                          actor_field = key
                          break

                  if actor_match:
                      break

              if actor_match:
                  for obj in walk_dicts(entry):
                      for key in RESULT_KEYS:
                          if key not in obj:
                              continue

                          raw = obj.get(key)

                          if isinstance(raw, bool):
                              value = "success" if raw else "failure"
                          else:
                              value = normalize(raw).lower()

                          if value in SUCCESS_VALUES:
                              return {
                                  "result": "SUCCESS",
                                  "status": "EXPLICIT",
                                  "method": "explicit_actor_field",
                                  "actor_field": actor_field,
                                  "result_field": key
                              }

                          if value in FAILURE_VALUES:
                              return {
                                  "result": "FAILURE",
                                  "status": "EXPLICIT",
                                  "method": "explicit_actor_field",
                                  "actor_field": actor_field,
                                  "result_field": key
                              }

              # --------------------------------------------------------
              # 2. Explicit per-agent result mapping
              # --------------------------------------------------------

              for obj in walk_dicts(entry):
                  for key in (
                      "results_by_agent",
                      "agent_results",
                      "outcomes_by_agent",
                      "agent_outcomes"
                  ):
                      if key not in obj:
                          continue

                      mapping = obj.get(key)

                      if not isinstance(mapping, dict):
                          continue

                      for raw_name, raw_result in mapping.items():
                          candidate = normalize_agent(raw_name)

                          if candidate.lower() != agent_low:
                              continue

                          value = normalize(raw_result).lower()

                          if value in SUCCESS_VALUES:
                              return {
                                  "result": "SUCCESS",
                                  "status": "EXPLICIT",
                                  "method": "per_agent_result_mapping",
                                  "result_field": key
                              }

                          if value in FAILURE_VALUES:
                              return {
                                  "result": "FAILURE",
                                  "status": "EXPLICIT",
                                  "method": "per_agent_result_mapping",
                                  "result_field": key
                              }

              # --------------------------------------------------------
              # 3. Natural language result attribution
              #
              # Only explicit nearby attribution.
              # --------------------------------------------------------

              information = flatten_text(entry.get("information", ""))

              if information and agent_low in information.lower():
                  low = information.lower()

                  # Use word-boundary attribution.
                  agent_pattern = rf"\b{re.escape(agent_low)}\b"

                  for pattern in EXPLICIT_RESULT_PATTERNS:
                      match = re.search(pattern, low)

                      if not match:
                          continue

                      # Pattern matched something, but verify that the
                      # exact target agent is involved in the matched span.
                      span = low[match.start():match.end()]

                      if re.search(agent_pattern, span):
                          if any(
                              term in span
                              for term in SUCCESS_VALUES
                          ):
                              return {
                                  "result": "SUCCESS",
                                  "status": "EXPLICIT",
                                  "method": "natural_language_result_attribution",
                                  "field": "information"
                              }

                          if any(
                              term in span
                              for term in FAILURE_VALUES
                          ):
                              return {
                                  "result": "FAILURE",
                                  "status": "EXPLICIT",
                                  "method": "natural_language_result_attribution",
                                  "field": "information"
                              }

              # --------------------------------------------------------
              # 4. Generic result is deliberately ignored.
              # --------------------------------------------------------

              return None


          def classify_observation(entry, agent):
              """
              Produces at most one primary observation per agent/claim.

              Priority:
                  RESULT
                  BEHAVIORAL_EVIDENCE
                  INTERACTION
                  IDENTITY

              But RESULT requires explicit attribution.
              """

              result = explicit_result_for_agent(entry, agent)

              if result:
                  return {
                      "type": "RESULT",
                      "result": result["result"],
                      "attribution": result
                  }

              behavior = explicit_behavioral_evidence(entry, agent)

              if behavior:
                  return {
                      "type": "BEHAVIORAL_EVIDENCE",
                      "result": None,
                      "attribution": behavior
                  }

              interaction, method, field = interaction_detected(
                  entry,
                  agent
              )

              if interaction:
                  return {
                      "type": "INTERACTION",
                      "result": None,
                      "attribution": {
                          "status": "EXPLICIT",
                          "method": method,
                          "field": field
                      }
                  }

              return {
                  "type": "IDENTITY",
                  "result": None,
                  "attribution": {
                      "status": "IDENTITY_ONLY",
                      "method": "explicit_identity"
                  }
              }


          # ============================================================
          # LOAD ACT17
          # ============================================================

          if not INPUT.exists():
              raise SystemExit(
                  "ERROR: memory/nox_knowledge_core.json not found."
              )

          with INPUT.open("r", encoding="utf-8") as f:
              data = json.load(f)

          knowledge = data.get("knowledge", [])

          if not isinstance(knowledge, list):
              raise SystemExit(
                  "ERROR: ACT17 knowledge is not a list."
              )


          # ============================================================
          # BUILD OBSERVATIONS
          # ============================================================

          profiles = {}
          observations = []

          identity_observations = 0
          interaction_observations = 0
          behavioral_evidence_observations = 0
          result_observations = 0

          successful_results = 0
          failed_results = 0

          claim_agent_pairs = set()

          for entry_index, entry in enumerate(knowledge):

              if not isinstance(entry, dict):
                  continue

              claim_id = normalize(
                  entry.get("claim_id")
                  or entry.get("id")
                  or stable_id(
                      entry.get("information", ""),
                      entry_index
                  )
              )

              domain = normalize(
                  entry.get("domain") or "general"
              )

              # --------------------------------------------------------
              # IMPORTANT:
              #
              # source_agent is intentionally NOT used as behavioral
              # attribution.
              #
              # ACT17 often stores NØX as source_agent.
              # Even when it does not, source ownership does not prove
              # that the external agent performed the behavior.
              # --------------------------------------------------------

              identity_candidates = explicit_agent_context(entry)

              # Remove NØX.
              identity_candidates = [
                  item
                  for item in identity_candidates
                  if not is_nox(item[0])
              ]

              # Remove duplicates by agent.
              unique_agents = {}

              for candidate, method, field in identity_candidates:
                  if valid_agent_name(candidate):
                      unique_agents[candidate.lower()] = (
                          candidate,
                          method,
                          field
                      )

              for agent_key in sorted(unique_agents):

                  agent, identity_method, identity_field = (
                      unique_agents[agent_key]
                  )

                  pair = (agent.lower(), claim_id)

                  if pair in claim_agent_pairs:
                      continue

                  claim_agent_pairs.add(pair)

                  classified = classify_observation(
                      entry,
                      agent
                  )

                  obs_type = classified["type"]

                  result = classified.get("result")

                  attribution = classified.get(
                      "attribution",
                      {}
                  )

                  observation_id = stable_id(
                      VERSION,
                      agent,
                      claim_id,
                      obs_type,
                      result or ""
                  )

                  observation = {
                      "observation_id": observation_id,
                      "agent": agent,
                      "domain": domain,
                      "claim_id": claim_id,
                      "type": obs_type,
                      "result": result,
                      "identity_method": identity_method,
                      "identity_field": identity_field,
                      "attribution": attribution,
                      "source": {
                          "knowledge_index": entry_index,
                          "source_file": "memory/nox_knowledge_core.json"
                      }
                  }

                  observations.append(observation)

                  profile = profiles.setdefault(
                      agent,
                      {
                          "agent": agent,
                          "domains": set(),
                          "identity_observations": 0,
                          "interaction_observations": 0,
                          "behavioral_evidence_observations": 0,
                          "result_observations": 0,
                          "successful_results": 0,
                          "failed_results": 0,
                          "claims": set(),
                          "attribution_methods": set()
                      }
                  )

                  profile["domains"].add(domain)
                  profile["claims"].add(claim_id)

                  if attribution.get("method"):
                      profile["attribution_methods"].add(
                          attribution["method"]
                      )

                  if obs_type == "IDENTITY":
                      profile["identity_observations"] += 1
                      identity_observations += 1

                  elif obs_type == "INTERACTION":
                      profile["interaction_observations"] += 1
                      interaction_observations += 1

                  elif obs_type == "BEHAVIORAL_EVIDENCE":
                      profile["behavioral_evidence_observations"] += 1
                      behavioral_evidence_observations += 1

                  elif obs_type == "RESULT":
                      profile["result_observations"] += 1
                      result_observations += 1

                      if result == "SUCCESS":
                          profile["successful_results"] += 1
                          successful_results += 1

                      elif result == "FAILURE":
                          profile["failed_results"] += 1
                          failed_results += 1


          # ============================================================
          # TRUST CALCULATION
          # ============================================================
          #
          # IMPORTANT:
          #
          # Trust is calculated ONLY from:
          #
          # - behavioral evidence
          # - explicitly attributed results
          # - successful/failure history
          #
          # Identity and interaction do not generate trust.
          #
          # There is intentionally no trust inflation from:
          # - karma
          # - posts
          # - followers
          # - mentions
          # - generic evidence[]
          # - generic SUCCESS/FAILURE
          #
          # ============================================================

          final_profiles = []

          HIGH_COUNT = 0
          MEDIUM_COUNT = 0
          LOW_COUNT = 0
          UNKNOWN_COUNT = 0

          for agent in sorted(
              profiles,
              key=lambda x: x.lower()
          ):

              profile = profiles[agent]

              behavioral = profile[
                  "behavioral_evidence_observations"
              ]

              results = profile[
                  "result_observations"
              ]

              successes = profile[
                  "successful_results"
              ]

              failures = profile[
                  "failed_results"
              ]

              # --------------------------------------------
              # No actual evidence/result.
              # --------------------------------------------

              if behavioral == 0 and results == 0:

                  trust_score = 0.0
                  trust_level = "UNKNOWN"
                  trust_basis = (
                      "IDENTITY_OR_INTERACTION_ONLY"
                  )

              else:

                  evidence_base = behavioral + results

                  evidence_ratio = min(
                      evidence_base / 5.0,
                      1.0
                  )

                  success_ratio = (
                      successes / results
                      if results > 0
                      else 0.0
                  )

                  failure_penalty = min(
                      failures * 0.15,
                      0.30
                  )

                  # Behavioral evidence alone gives only a small
                  # foundation. Explicit results carry more weight.
                  behavior_component = min(
                      behavioral / 4.0,
                      1.0
                  ) * 0.25

                  result_component = min(
                      results / 4.0,
                      1.0
                  ) * 0.35

                  success_component = (
                      success_ratio * 0.30
                  )

                  stability_component = (
                      min(
                          max(
                              results - failures,
                              0
                          ) / 4.0,
                          1.0
                      ) * 0.10
                  )

                  trust_score = (
                      behavior_component
                      + result_component
                      + success_component
                      + stability_component
                      - failure_penalty
                  )

                  trust_score = max(
                      0.0,
                      min(
                          1.0,
                          trust_score
                      )
                  )

                  # Conservative thresholds.
                  if (
                      results >= 3
                      and successes >= 2
                      and trust_score >= 0.75
                  ):
                      trust_level = "HIGH"

                  elif (
                      results >= 2
                      and trust_score >= 0.55
                  ):
                      trust_level = "MEDIUM"

                  else:
                      trust_level = "LOW"

                  if behavioral > 0 and results > 0:
                      trust_basis = (
                          "BEHAVIORAL_EVIDENCE_AND_ATTRIBUTED_RESULTS"
                      )

                  elif results > 0:
                      trust_basis = (
                          "ATTRIBUTED_RESULTS_ONLY"
                      )

                  else:
                      trust_basis = (
                          "BEHAVIORAL_EVIDENCE_ONLY"
                      )

              if trust_level == "HIGH":
                  HIGH_COUNT += 1

              elif trust_level == "MEDIUM":
                  MEDIUM_COUNT += 1

              elif trust_level == "LOW":
                  LOW_COUNT += 1

              else:
                  UNKNOWN_COUNT += 1

              final_profiles.append(
                  {
                      "agent": agent,
                      "domains": sorted(
                          profile["domains"]
                      ),
                      "identity_observations": profile[
                          "identity_observations"
                      ],
                      "interaction_observations": profile[
                          "interaction_observations"
                      ],
                      "behavioral_evidence_observations": behavioral,
                      "result_observations": results,
                      "successful_results": successes,
                      "failed_results": failures,
                      "claims_observed": len(
                          profile["claims"]
                      ),
                      "attribution_methods": sorted(
                          profile["attribution_methods"]
                      ),
                      "trust_score": round(
                          trust_score,
                          4
                      ),
                      "trust_level": trust_level,
                      "trust_basis": trust_basis
                  }
              )


          # ============================================================
          # DOMAIN SUMMARY
          # ============================================================

          domains = {}

          for obs in observations:

              domain = obs["domain"]

              item = domains.setdefault(
                  domain,
                  {
                      "agent_count": set(),
                      "observation_count": 0,
                      "identity": 0,
                      "interaction": 0,
                      "behavioral_evidence": 0,
                      "results": 0,
                      "successes": 0,
                      "failures": 0
                  }
              )

              item["agent_count"].add(
                  obs["agent"]
              )

              item["observation_count"] += 1

              if obs["type"] == "IDENTITY":
                  item["identity"] += 1

              elif obs["type"] == "INTERACTION":
                  item["interaction"] += 1

              elif obs["type"] == "BEHAVIORAL_EVIDENCE":
                  item["behavioral_evidence"] += 1

              elif obs["type"] == "RESULT":
                  item["results"] += 1

                  if obs["result"] == "SUCCESS":
                      item["successes"] += 1

                  elif obs["result"] == "FAILURE":
                      item["failures"] += 1


          domain_output = {}

          for domain in sorted(domains):

              item = domains[domain]

              domain_output[domain] = {
                  "agent_count": len(
                      item["agent_count"]
                  ),
                  "observation_count": item[
                      "observation_count"
                  ],
                  "identity": item["identity"],
                  "interaction": item["interaction"],
                  "behavioral_evidence": item[
                      "behavioral_evidence"
                  ],
                  "results": item["results"],
                  "successes": item["successes"],
                  "failures": item["failures"]
              }


          # ============================================================
          # VALIDATION
          # ============================================================

          validation_errors = []

          valid_levels = {
              "HIGH",
              "MEDIUM",
              "LOW",
              "UNKNOWN"
          }

          valid_types = {
              "IDENTITY",
              "INTERACTION",
              "BEHAVIORAL_EVIDENCE",
              "RESULT"
          }

          seen_observation_ids = set()

          for obs in observations:

              # Unique observation IDs.
              if obs["observation_id"] in seen_observation_ids:
                  validation_errors.append(
                      "Duplicate observation_id: "
                      + obs["observation_id"]
                  )

              seen_observation_ids.add(
                  obs["observation_id"]
              )

              agent = obs["agent"]

              # NØX may never become an external reputation profile.
              if is_nox(agent):
                  validation_errors.append(
                      "NØX incorrectly included as external agent."
                  )

              # Generic names forbidden.
              if agent.lower() in GENERIC_REJECTS:
                  validation_errors.append(
                      "Generic label incorrectly included: "
                      + agent
                  )

              if not valid_agent_name(agent):
                  validation_errors.append(
                      "Invalid agent identity: "
                      + agent
                  )

              # Observation type.
              if obs["type"] not in valid_types:
                  validation_errors.append(
                      "Invalid observation type for "
                      + agent
                  )

              # --------------------------------------------------------
              # IDENTITY RULE
              # --------------------------------------------------------

              if obs["type"] == "IDENTITY":

                  if obs["result"] is not None:
                      validation_errors.append(
                          "Identity observation has result: "
                          + agent
                      )

              # --------------------------------------------------------
              # INTERACTION RULE
              # --------------------------------------------------------

              if obs["type"] == "INTERACTION":

                  if obs["result"] is not None:
                      validation_errors.append(
                          "Interaction observation has result: "
                          + agent
                      )

              # --------------------------------------------------------
              # BEHAVIORAL EVIDENCE RULE
              # --------------------------------------------------------

              if obs["type"] == "BEHAVIORAL_EVIDENCE":

                  if obs["result"] is not None:
                      validation_errors.append(
                          "Behavioral evidence directly contains result: "
                          + agent
                      )

                  if (
                      obs["attribution"].get("status")
                      != "EXPLICIT"
                  ):
                      validation_errors.append(
                          "Behavioral evidence lacks explicit attribution: "
                          + agent
                      )

              # --------------------------------------------------------
              # RESULT RULE
              # --------------------------------------------------------

              if obs["type"] == "RESULT":

                  if obs["result"] not in {
                      "SUCCESS",
                      "FAILURE"
                  }:
                      validation_errors.append(
                          "Invalid result for "
                          + agent
                      )

                  if (
                      obs["attribution"].get("status")
                      != "EXPLICIT"
                  ):
                      validation_errors.append(
                          "Result lacks explicit attribution: "
                          + agent
                      )

                  method = obs["attribution"].get(
                      "method",
                      ""
                  )

                  if method not in {
                      "explicit_actor_field",
                      "per_agent_result_mapping",
                      "natural_language_result_attribution"
                  }:
                      validation_errors.append(
                          "Unsafe result attribution method for "
                          + agent
                      )

          # ------------------------------------------------------------
          # PROFILE VALIDATION
          # ------------------------------------------------------------

          for profile in final_profiles:

              agent = profile["agent"]

              behavioral = profile[
                  "behavioral_evidence_observations"
              ]

              results = profile[
                  "result_observations"
              ]

              successes = profile[
                  "successful_results"
              ]

              failures = profile[
                  "failed_results"
              ]

              level = profile[
                  "trust_level"
              ]

              score = profile[
                  "trust_score"
              ]

              basis = profile[
                  "trust_basis"
              ]

              # Valid range.
              if not (
                  0.0 <= score <= 1.0
              ):
                  validation_errors.append(
                      "Trust score outside [0,1]: "
                      + agent
                  )

              if level not in valid_levels:
                  validation_errors.append(
                      "Invalid trust level: "
                      + agent
                  )

              # Result arithmetic.
              if successes + failures > results:
                  validation_errors.append(
                      "Success/failure count exceeds results: "
                      + agent
                  )

              # Identity / interaction alone MUST be UNKNOWN.
              if (
                  behavioral == 0
                  and results == 0
              ):

                  if level != "UNKNOWN":
                      validation_errors.append(
                          "Identity/interaction-only agent is not UNKNOWN: "
                          + agent
                      )

                  if score != 0.0:
                      validation_errors.append(
                          "Identity/interaction-only agent has non-zero trust: "
                          + agent
                      )

              # Trust basis must match actual evidence.
              if (
                  basis
                  == "BEHAVIORAL_EVIDENCE_ONLY"
                  and behavioral == 0
              ):
                  validation_errors.append(
                      "Invalid behavioral-only trust basis: "
                      + agent
                  )

              if (
                  basis
                  == "BEHAVIORAL_EVIDENCE_AND_ATTRIBUTED_RESULTS"
                  and (
                      behavioral == 0
                      or results == 0
                  )
              ):
                  validation_errors.append(
                      "Invalid mixed trust basis: "
                      + agent
                  )

              if (
                  basis
                  == "ATTRIBUTED_RESULTS_ONLY"
                  and results == 0
              ):
                  validation_errors.append(
                      "Invalid result-only trust basis: "
                      + agent
                  )

              # UNKNOWN may not contain trust evidence.
              if level == "UNKNOWN" and score != 0.0:
                  validation_errors.append(
                      "UNKNOWN profile has non-zero score: "
                      + agent
                  )

          # ------------------------------------------------------------
          # GLOBAL VALIDATION
          # ------------------------------------------------------------

          if successful_results + failed_results != result_observations:
              validation_errors.append(
                  "Global result arithmetic mismatch."
              )

          if len(observations) == 0 and len(knowledge) > 0:
              validation_errors.append(
                  "No observations extracted from non-empty ACT17 knowledge."
              )

          # Strong protection against the V1.6 failure mode:
          #
          # If multiple agents receive the same RESULT from the same claim,
          # each must have an explicit actor attribution. Otherwise fail.
          #
          result_claim_groups = {}

          for obs in observations:

              if obs["type"] != "RESULT":
                  continue

              key = (
                  obs["claim_id"],
                  obs["result"]
              )

              result_claim_groups.setdefault(
                  key,
                  []
              ).append(obs)

          for key, group in result_claim_groups.items():

              if len(group) <= 1:
                  continue

              for obs in group:

                  method = obs[
                      "attribution"
                  ].get(
                      "method",
                      ""
                  )

                  if method not in {
                      "explicit_actor_field",
                      "per_agent_result_mapping"
                  }:

                      validation_errors.append(
                          "Multiple agents share a result without individual "
                          "structured attribution: "
                          + str(key)
                      )

          # ------------------------------------------------------------
          # VALIDATION STATUS
          # ------------------------------------------------------------

          validation_status = (
              "PASS"
              if not validation_errors
              else "FAIL"
          )


          # ============================================================
          # OUTPUT
          # ============================================================

          output = {
              "version": VERSION,
              "generated_at": now_iso(),

              "source": {
                  "file": "memory/nox_knowledge_core.json",
                  "knowledge_entries_processed": len(knowledge)
              },

              "methodology": {
                  "principle": (
                      "IDENTITY -> INTERACTION -> "
                      "BEHAVIORAL_EVIDENCE -> RESULT -> "
                      "ATTRIBUTION -> TRUST"
                  ),
                  "identity_is_not_trust": True,
                  "interaction_is_not_evidence": True,
                  "evidence_array_alone_is_not_behavioral_evidence": True,
                  "generic_result_is_not_attribution": True,
                  "source_agent_is_not_behavioral_attribution": True,
                  "explicit_actor_required_for_result": True,
                  "multiple_agents_cannot_share_result_without_individual_attribution": True,
                  "karma_used": False,
                  "post_count_used": False,
                  "follower_count_used": False,
                  "gemini_used": False,
                  "external_api_used": False,
                  "cost": "€0",
                  "nox_excluded": True,
                  "arbitrary_prose_names_rejected": True,
                  "unknown_preferred_over_false_trust": True
              },

              "statistics": {
                  "knowledge_entries": len(knowledge),
                  "identity_observations": identity_observations,
                  "interaction_observations": interaction_observations,
                  "behavioral_evidence_observations": behavioral_evidence_observations,
                  "result_observations": result_observations,
                  "successful_results": successful_results,
                  "failed_results": failed_results,
                  "external_agents": len(final_profiles),
                  "agent_profiles": len(final_profiles),
                  "HIGH": HIGH_COUNT,
                  "MEDIUM": MEDIUM_COUNT,
                  "LOW": LOW_COUNT,
                  "UNKNOWN": UNKNOWN_COUNT
              },

              "agents": [
                  profile["agent"]
                  for profile in final_profiles
              ],

              "profiles": final_profiles,

              "domains": domain_output,

              "observations": observations,

              "validation": {
                  "status": validation_status,
                  "errors": validation_errors
              },

              "last_run": now_iso()
          }


          # ============================================================
          # FAIL HARD IF VALIDATION FAILS
          #
          # ACT18 must never publish invalid reputation memory.
          # ============================================================

          if validation_status != "PASS":

              print("")
              print("================================================")
              print("ACT18 VALIDATION: FAIL")
              print("================================================")

              for error in validation_errors:
                  print("ERROR:", error)

              raise SystemExit(
                  "ACT18 V1.7 validation failed."
              )


          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with OUTPUT.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("================================================")
          print("ACT18 BUILD COMPLETE")
          print("================================================")
          print(
              "Knowledge entries processed:",
              len(knowledge)
          )
          print(
              "Identity observations:",
              identity_observations
          )
          print(
              "Interaction observations:",
              interaction_observations
          )
          print(
              "Behavioral evidence observations:",
              behavioral_evidence_observations
          )
          print(
              "Result observations:",
              result_observations
          )
          print(
              "Successful results:",
              successful_results
          )
          print(
              "Failed results:",
              failed_results
          )
          print(
              "External agents:",
              len(final_profiles)
          )
          print(
              "HIGH:",
              HIGH_COUNT
          )
          print(
              "MEDIUM:",
              MEDIUM_COUNT
          )
          print(
              "LOW:",
              LOW_COUNT
          )
          print(
              "UNKNOWN:",
              UNKNOWN_COUNT
          )
          print(
              "Output:",
              OUTPUT
          )
          print(
              "Output size:",
              OUTPUT.stat().st_size,
              "bytes"
          )
          print("")
          print("VALIDATION: PASS")
          print("")
          print("ACT18 V1.7 rules:")
          print("- Identity != trust")
          print("- Interaction != evidence")
          print("- evidence[] alone != behavioral evidence")
          print("- Generic SUCCESS/FAILURE != attributed result")
          print("- Explicit actor attribution required for results")
          print("- Multiple agents cannot inherit one result")
          print("- UNKNOWN is preferred over false trust")
          print("- Karma/posts/followers ignored")
          print("- Gemini disabled")
          print("- External APIs disabled")
          print("- Cost: €0")
          print("================================================")
          PY

      - name: Validate generated memory
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("memory/nox_reputation_trust.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: reputation trust memory was not created."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          required = {
              "version",
              "generated_at",
              "source",
              "methodology",
              "statistics",
              "agents",
              "profiles",
              "domains",
              "observations",
              "validation",
              "last_run"
          }

          missing = required - set(data.keys())

          if missing:
              raise SystemExit(
                  "ERROR: missing keys: "
                  + ", ".join(sorted(missing))
              )

          if data["version"] != "ACT18-V1.7":
              raise SystemExit(
                  "ERROR: wrong ACT18 version."
              )

          if data["validation"]["status"] != "PASS":
              raise SystemExit(
                  "ERROR: internal validation is not PASS."
              )

          agents = data["agents"]

          if len(agents) != len(set(agents)):
              raise SystemExit(
                  "ERROR: duplicate agents detected."
              )

          forbidden = {
              "agent",
              "agents",
              "follow",
              "the",
              "them",
              "proposal",
              "measurement",
              "receipts",
              "pay",
              "coinos.io",
              "wiener",
              "molt",
              "deep seeker",
              "deep-seeker"
          }

          for agent in agents:
              if agent.lower() in forbidden:
                  raise SystemExit(
                      "ERROR: forbidden generic agent detected: "
                      + agent
                  )

              if agent.lower() in {
                  "nox",
                  "nox-origin",
                  "nox_origine",
                  "nøx",
                  "nøx-origin"
              }:
                  raise SystemExit(
                      "ERROR: NØX incorrectly appears as external agent."
                  )

          observations = data["observations"]

          result_count = 0
          success_count = 0
          failure_count = 0

          for obs in observations:

              if obs["type"] == "RESULT":

                  result_count += 1

                  if obs["result"] == "SUCCESS":
                      success_count += 1

                  elif obs["result"] == "FAILURE":
                      failure_count += 1

                  if obs["attribution"]["status"] != "EXPLICIT":
                      raise SystemExit(
                          "ERROR: RESULT without explicit attribution."
                      )

          stats = data["statistics"]

          if result_count != stats["result_observations"]:
              raise SystemExit(
                  "ERROR: result count mismatch."
              )

          if success_count != stats["successful_results"]:
              raise SystemExit(
                  "ERROR: success count mismatch."
              )

          if failure_count != stats["failed_results"]:
              raise SystemExit(
                  "ERROR: failure count mismatch."
              )

          for profile in data["profiles"]:

              if (
                  profile["behavioral_evidence_observations"] == 0
                  and profile["result_observations"] == 0
              ):

                  if profile["trust_level"] != "UNKNOWN":
                      raise SystemExit(
                          "ERROR: identity/interaction-only profile "
                          "has non-UNKNOWN trust."
                      )

                  if profile["trust_score"] != 0:
                      raise SystemExit(
                          "ERROR: identity/interaction-only profile "
                          "has non-zero score."
                      )

          print("FINAL MEMORY VALIDATION: PASS")
          print("Profiles:", len(data["profiles"]))
          print("Observations:", len(observations))
          print("Attributed results:", result_count)
          print("Successes:", success_count)
          print("Failures:", failure_count)
          PY

      - name: Commit ACT18 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT18 V1.7 - strict reputation attribution"

      - name: Synchronize and push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

          echo "================================================"
          echo "NØX ACT18 V1.7 COMPLETE"
          echo "================================================"
