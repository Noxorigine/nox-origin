name: NØX ACT 18 - Reputation & Trust

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run ACT18
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nox_act18.py

      - name: Validate ACT18
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          path = "memory/nox_reputation_trust.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["version"] == "ACT18-V1.3.1"
          assert isinstance(data["profiles"], list)

          nox_names = {
              "nox",
              "nox origin",
              "nox_origine",
              "nox-origin",
              "noxorigine",
              "nøx",
              "nøx origin",
              "nøx_origine",
          }

          invalid = {
              "unknown",
              "none",
              "null",
              "unclear",
              "unresolved",
              "untested",
              "agent",
              "discussion",
              "user",
              "system",
          }

          for profile in data["profiles"]:
              agent = profile["agent"].lower()

              assert agent not in nox_names
              assert agent not in invalid

              for domain, record in profile["domains"].items():
                  assert 0 <= record["trust_score"] <= 1

                  assert record["trust_level"] in {
                      "STRONG",
                      "MODERATE",
                      "WEAK",
                      "UNKNOWN",
                  }

                  if record["evidence_observations"] == 0:
                      assert record["trust_score"] == 0
                      assert record["trust_level"] == "UNKNOWN"

          print("ACT18 validation: PASS")
          print(
              "Profiles:",
              len(data["profiles"])
          )
          print(
              "Evidence observations:",
              data["statistics"]["evidence_observations"]
          )
          print(
              "Identity-only observations:",
              data["statistics"]["identity_only_observations"]
          )
          PY

      - name: Commit ACT18 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add scripts/nox_act18.py
          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT18 V1.3.1 - Reputation and Trust"
          git push
