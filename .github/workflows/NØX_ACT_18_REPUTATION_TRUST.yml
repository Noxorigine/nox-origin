name: NØX ACT 18 - Reputation & Trust V1.9 FINAL

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  act18-reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ACT18 Reputation & Trust
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NØX ACT 18 - REPUTATION & TRUST V1.9 FINAL"
          echo "================================================"

          mkdir -p memory

          python3 <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone

          INPUT = "memory/nox_knowledge_core.json"
          OUTPUT = "memory/nox_reputation_trust.json"

          VERSION = "ACT18-V1.9-FINAL"

          if not os.path.exists(INPUT):
              raise SystemExit("ERROR: ACT17 knowledge file not found")

          with open(INPUT, "r", encoding="utf-8") as f:
              core = json.load(f)

          knowledge = core.get("knowledge", [])

          if not isinstance(knowledge, list):
              raise SystemExit("ERROR: knowledge is not a list")

          now = datetime.now(timezone.utc).isoformat()

          # ============================================================
          # NØX IDENTITY
          # ============================================================

          NOX_NAMES = {
              "nox",
              "nox origin",
              "nox_origine",
              "@nox_origine",
              "nøx origin"
          }

          # ============================================================
          # KNOWN EXTERNAL IDENTITIES
          #
          # These names are identity anchors only.
          # They do NOT represent trust or competence.
          # ============================================================

          KNOWN_HANDLES = {
              "agentpedia",
              "exori",
              "vina",
              "atomic-raven",
              "bytes",
              "hermes-final",
              "randy-2",
              "colonist-one",
              "anp2network",
              "ralftpaw",
              "rosetta",
              "holocene",
              "reticuli",
              "cyrene-agent"
          }

          INVALID_NAMES = {
              "",
              "unknown",
              "none",
              "null",
              "n/a",
              "na",
              "agent",
              "agents",
              "the",
              "them",
              "this",
              "that",
              "follow",
              "comment",
              "reply",
              "discussion",
              "measurement",
              "proposal",
              "receipts",
              "pay",
              "coinos.io",
              "machine-native payments",
              "resilience",
              "sovereign rails",
              "success",
              "failure",
              "action_executed",
              "action",
              "hash",
              "...",
              "deep-seeker",
              "deep seeker",
              "wiener",
              "hermes"
          }

          FORBIDDEN_METHODS = {
              "natural_language_result_attribution",
              "name_near_success",
              "nearby_success",
              "generic_result_attribution"
          }

          # ============================================================
          # HELPERS
          # ============================================================

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value

              try:
                  return json.dumps(value, ensure_ascii=False)
              except Exception:
                  return str(value)

          def norm(value):
              return str(value).strip() if value is not None else ""

          def lower(value):
              return norm(value).lower()

          def is_nox(name):
              n = lower(name)
              return n in NOX_NAMES or n.lstrip("@") == "nox_origine"

          def valid_agent(name):
              n = lower(name)

              if n in INVALID_NAMES:
                  return False

              if is_nox(n):
                  return False

              if n not in KNOWN_HANDLES:
                  return False

              return True

          def normalize_agent(name):
              n = norm(name)

              if n.startswith("@"):
                  n = n[1:]

              return n.lower()

          def get_information(entry):
              values = []

              for key in [
                  "information",
                  "claim",
                  "content",
                  "title",
                  "response",
                  "result",
                  "action"
              ]:
                  if key in entry and entry[key] is not None:
                      values.append(text(entry[key]))

              return " | ".join(values)

          def get_domain(entry):
              domain = norm(entry.get("domain"))

              if domain:
                  return domain

              return "unknown"

          def get_claim_id(entry, index):
              claim = norm(entry.get("claim_id"))

              if claim:
                  return claim

              entry_id = norm(entry.get("id"))

              if entry_id:
                  return entry_id

              return "knowledge-" + str(index)

          def extract_known_handles(value):
              result = []

              source = text(value)

              for handle in KNOWN_HANDLES:
                  pattern = (
                      r"(?<![A-Za-z0-9_-])@?"
                      + re.escape(handle)
                      + r"(?![A-Za-z0-9_-])"
                  )

                  if re.search(
                      pattern,
                      source,
                      flags=re.IGNORECASE
                  ):
                      result.append(handle)

              return sorted(set(result))

          # ============================================================
          # EXPLICIT IDENTITY
          # ============================================================

          def find_identities(entry, information):
              found = []

              structured_fields = [
                  "agent",
                  "username",
                  "handle",
                  "subject_agent",
                  "target_agent",
                  "external_agent",
                  "author"
              ]

              for key in structured_fields:
                  value = entry.get(key)

                  if isinstance(value, str):
                      agent = normalize_agent(value)

                      if valid_agent(agent):
                          found.append(
                              {
                                  "agent": agent,
                                  "method": "structured_" + key
                              }
                          )

                  elif isinstance(value, dict):
                      for subkey in [
                          "username",
                          "handle",
                          "agent",
                          "name"
                      ]:
                          subvalue = value.get(subkey)

                          if isinstance(subvalue, str):
                              agent = normalize_agent(subvalue)

                              if valid_agent(agent):
                                  found.append(
                                      {
                                          "agent": agent,
                                          "method": (
                                              "structured_"
                                              + key
                                              + "_"
                                              + subkey
                                          )
                                      }
                                  )

              # Sources can contain explicit agent identity.
              sources = entry.get("sources")

              if isinstance(sources, list):
                  for source in sources:
                      if not isinstance(source, dict):
                          continue

                      for key in [
                          "agent",
                          "username",
                          "handle",
                          "subject_agent"
                      ]:
                          value = source.get(key)

                          if isinstance(value, str):
                              agent = normalize_agent(value)

                              if valid_agent(agent):
                                  found.append(
                                      {
                                          "agent": agent,
                                          "method": (
                                              "structured_source_"
                                              + key
                                          )
                                      }
                                  )

              # Explicit interaction context.
              info_lower = lower(information)

              identity_context = [
                  "followed @",
                  "following @",
                  "commented on",
                  "replied to",
                  "response from",
                  "reply from",
                  "author:",
                  "username:",
                  "agent:",
                  "posted by",
                  "created by",
                  "interaction with",
                  "interacted with"
              ]

              if any(
                  marker in info_lower
                  for marker in identity_context
              ):
                  for handle in extract_known_handles(information):
                      found.append(
                          {
                              "agent": handle,
                              "method": "known_handle_explicit_context"
                          }
                      )

              unique = {}

              for item in found:
                  unique[item["agent"]] = item

              return list(unique.values())

          # ============================================================
          # INTERACTION
          # ============================================================

          def has_interaction(entry, information, agent):
              info = lower(information)
              a = re.escape(agent)

              patterns = [
                  rf"\bcomment(?:ed|ing)?\b.*\b{a}\b",
                  rf"\brepl(?:y|ied|ying)\b.*\b{a}\b",
                  rf"\bfollow(?:ed|ing)?\b.*\b{a}\b",
                  rf"\bresponse\b.*\b{a}\b",
                  rf"\b{a}\b.*\bresponse\b",
                  rf"\b{a}\b.*\bcomment\b",
                  rf"\b{a}\b.*\breply\b",
                  rf"\b{a}\b.*\bfollow\b"
              ]

              for pattern in patterns:
                  if re.search(pattern, info):
                      return True

              for key in [
                  "action",
                  "interaction",
                  "activity",
                  "type"
              ]:
                  value = lower(entry.get(key))

                  if value in {
                      "follow",
                      "follow_user",
                      "comment",
                      "reply",
                      "response",
                      "interaction"
                  }:
                      return True

              return False

          # ============================================================
          # BEHAVIORAL EVIDENCE
          # ============================================================

          def has_behavior(information, agent):
              info = lower(information)

              actor_pattern = (
                  r"(?<![A-Za-z0-9_-])@?"
                  + re.escape(agent)
                  + r"(?![A-Za-z0-9_-])"
              )

              if not re.search(
                  actor_pattern,
                  information,
                  flags=re.IGNORECASE
              ):
                  return False

              behavior_words = [
                  "published",
                  "posted",
                  "created",
                  "built",
                  "implemented",
                  "answered",
                  "commented",
                  "replied",
                  "responded",
                  "proposed",
                  "explained",
                  "provided",
                  "verified",
                  "tested",
                  "demonstrated",
                  "completed",
                  "delivered",
                  "solved",
                  "analyzed",
                  "contributed"
              ]

              return any(
                  word in info
                  for word in behavior_words
              )

          # ============================================================
          # EXPLICIT RESULT
          #
          # NEVER infer:
          # agent + SUCCESS = agent success
          # ============================================================

          def get_explicit_result(entry, agent):

              result = entry.get("result")

              if isinstance(result, dict):
                  actor = (
                      result.get("agent")
                      or result.get("subject_agent")
                      or result.get("actor")
                  )

                  value = (
                      result.get("result")
                      or result.get("status")
                      or result.get("outcome")
                  )

                  if (
                      isinstance(actor, str)
                      and normalize_agent(actor) == agent
                      and isinstance(value, str)
                  ):
                      value = lower(value)

                      if value in {
                          "success",
                          "successful"
                      }:
                          return "success"

                      if value in {
                          "failure",
                          "failed"
                      }:
                          return "failure"

              attribution = entry.get("attribution")

              if isinstance(attribution, dict):
                  actor = (
                      attribution.get("agent")
                      or attribution.get("subject_agent")
                      or attribution.get("actor")
                  )

                  value = (
                      attribution.get("result")
                      or attribution.get("status")
                  )

                  if (
                      isinstance(actor, str)
                      and normalize_agent(actor) == agent
                      and isinstance(value, str)
                  ):
                      value = lower(value)

                      if value in {
                          "success",
                          "successful"
                      }:
                          return "success"

                      if value in {
                          "failure",
                          "failed"
                      }:
                          return "failure"

              for key in [
                  "result_agent",
                  "result_subject",
                  "outcome_agent",
                  "actor"
              ]:
                  actor = entry.get(key)

                  if not isinstance(actor, str):
                      continue

                  if normalize_agent(actor) != agent:
                      continue

                  value = lower(
                      entry.get("result")
                      or entry.get("outcome")
                      or entry.get("status")
                  )

                  if value in {
                      "success",
                      "successful"
                  }:
                      return "success"

                  if value in {
                      "failure",
                      "failed"
                  }:
                      return "failure"

              return None

          # ============================================================
          # COLLECTION
          # ============================================================

          profiles = {}
          observations = []

          stats = {
              "knowledge_entries": len(knowledge),
              "identity_observations": 0,
              "interaction_observations": 0,
              "behavioral_evidence_observations": 0,
              "result_observations": 0,
              "successful_results": 0,
              "failed_results": 0,
              "unattributed_result_candidates": 0,
              "rejected_result_candidates": 0
          }

          observation_number = 0

          for index, entry in enumerate(knowledge):

              if not isinstance(entry, dict):
                  continue

              information = get_information(entry)

              if not information:
                  continue

              domain = get_domain(entry)

              claim_id = get_claim_id(
                  entry,
                  index
              )

              identities = find_identities(
                  entry,
                  information
              )

              for identity in identities:

                  agent = identity["agent"]

                  if agent not in profiles:
                      profiles[agent] = {
                          "agent": agent,
                          "domains": {},
                          "identity": {
                              "observations": 0,
                              "methods": []
                          },
                          "interaction": {
                              "observations": 0
                          },
                          "behavioral_evidence": {
                              "observations": 0,
                              "successful": 0,
                              "failed": 0
                          },
                          "results": {
                              "observations": 0,
                              "successful": 0,
                              "failed": 0
                          },
                          "trust": {
                              "score": 0.0,
                              "level": "UNKNOWN",
                              "basis": "NO_BEHAVIORAL_EVIDENCE"
                          }
                      }

                  profile = profiles[agent]

                  if domain not in profile["domains"]:
                      profile["domains"][domain] = {
                          "identity": 0,
                          "interaction": 0,
                          "behavioral_evidence": 0,
                          "success": 0,
                          "failure": 0
                      }

                  domain_data = profile["domains"][domain]

                  # ----------------------------------------------------
                  # IDENTITY
                  # ----------------------------------------------------

                  profile["identity"]["observations"] += 1

                  stats["identity_observations"] += 1

                  method = identity["method"]

                  if method not in profile["identity"]["methods"]:
                      profile["identity"]["methods"].append(
                          method
                      )

                  observation_number += 1

                  observations.append(
                      {
                          "observation_id": (
                              "identity-"
                              + str(observation_number)
                          ),
                          "agent": agent,
                          "domain": domain,
                          "claim_id": claim_id,
                          "type": "IDENTITY",
                          "identity": {
                              "status": "EXPLICIT",
                              "method": method
                          }
                      }
                  )

                  # ----------------------------------------------------
                  # INTERACTION
                  # ----------------------------------------------------

                  if has_interaction(
                      entry,
                      information,
                      agent
                  ):

                      profile[
                          "interaction"
                      ]["observations"] += 1

                      domain_data["interaction"] += 1

                      stats[
                          "interaction_observations"
                      ] += 1

                      observation_number += 1

                      observations.append(
                          {
                              "observation_id": (
                                  "interaction-"
                                  + str(observation_number)
                              ),
                              "agent": agent,
                              "domain": domain,
                              "claim_id": claim_id,
                              "type": "INTERACTION",
                              "interaction": "EXPLICIT"
                          }
                      )

                  # ----------------------------------------------------
                  # BEHAVIOR
                  # ----------------------------------------------------

                  if has_behavior(
                      information,
                      agent
                  ):

                      profile[
                          "behavioral_evidence"
                      ]["observations"] += 1

                      domain_data[
                          "behavioral_evidence"
                      ] += 1

                      stats[
                          "behavioral_evidence_observations"
                      ] += 1

                      observation_number += 1

                      observations.append(
                          {
                              "observation_id": (
                                  "behavior-"
                                  + str(observation_number)
                              ),
                              "agent": agent,
                              "domain": domain,
                              "claim_id": claim_id,
                              "type": "BEHAVIORAL_EVIDENCE",
                              "attribution": {
                                  "status": "EXPLICIT",
                                  "method": (
                                      "explicit_behavior_attribution"
                                  ),
                                  "agent": agent
                              }
                          }
                      )

                  # ----------------------------------------------------
                  # RESULT
                  # ----------------------------------------------------

                  explicit_result = get_explicit_result(
                      entry,
                      agent
                  )

                  generic_result = lower(
                      entry.get("result")
                      or entry.get("status")
                      or ""
                  )

                  if (
                      generic_result in {
                          "success",
                          "successful",
                          "failure",
                          "failed"
                      }
                      and explicit_result is None
                  ):

                      stats[
                          "unattributed_result_candidates"
                      ] += 1

                      stats[
                          "rejected_result_candidates"
                      ] += 1

                  if explicit_result is not None:

                      profile[
                          "results"
                      ]["observations"] += 1

                      stats[
                          "result_observations"
                      ] += 1

                      if explicit_result == "success":

                          profile[
                              "results"
                          ]["successful"] += 1

                          profile[
                              "behavioral_evidence"
                          ]["successful"] += 1

                          domain_data["success"] += 1

                          stats[
                              "successful_results"
                          ] += 1

                      elif explicit_result == "failure":

                          profile[
                              "results"
                          ]["failed"] += 1

                          profile[
                              "behavioral_evidence"
                          ]["failed"] += 1

                          domain_data["failure"] += 1

                          stats[
                              "failed_results"
                          ] += 1

                      observation_number += 1

                      observations.append(
                          {
                              "observation_id": (
                                  "result-"
                                  + str(observation_number)
                              ),
                              "agent": agent,
                              "domain": domain,
                              "claim_id": claim_id,
                              "type": "RESULT",
                              "result": explicit_result,
                              "attribution": {
                                  "status": "EXPLICIT",
                                  "method": (
                                      "structured_result_attribution"
                                  ),
                                  "agent": agent
                              }
                          }
                      )

          # ============================================================
          # TRUST CALCULATION
          # ============================================================

          high = 0
          medium = 0
          low = 0
          unknown = 0

          for agent, profile in profiles.items():

              behavioral = (
                  profile[
                      "behavioral_evidence"
                  ]["observations"]
              )

              success = (
                  profile[
                      "results"
                  ]["successful"]
              )

              failure = (
                  profile[
                      "results"
                  ]["failed"]
              )

              total_results = success + failure

              # Identity and interaction alone = UNKNOWN.
              if behavioral == 0 and total_results == 0:

                  profile["trust"] = {
                      "score": 0.0,
                      "level": "UNKNOWN",
                      "basis": (
                          "IDENTITY_OR_INTERACTION_ONLY"
                      )
                  }

                  unknown += 1

                  continue

              if total_results > 0:
                  success_rate = (
                      success / total_results
                  )
              else:
                  success_rate = 0.0

              behavior_component = min(
                  0.30,
                  behavioral * 0.10
              )

              result_component = min(
                  0.50,
                  success_rate * 0.50
              )

              failure_penalty = min(
                  0.30,
                  failure * 0.15
              )

              score = max(
                  0.0,
                  min(
                      1.0,
                      0.20
                      + behavior_component
                      + result_component
                      - failure_penalty
                  )
              )

              if total_results == 0:
                  level = "UNKNOWN"

              elif (
                  score >= 0.80
                  and success >= 3
                  and failure == 0
              ):
                  level = "HIGH"

              elif (
                  score >= 0.60
                  and success >= 2
              ):
                  level = "MEDIUM"

              else:
                  level = "LOW"

              if total_results > 0:
                  basis = (
                      "EXPLICIT_ATTRIBUTED_RESULTS"
                  )
              else:
                  basis = (
                      "EXPLICIT_BEHAVIOR_ONLY"
                  )

              profile["trust"] = {
                  "score": round(score, 4),
                  "level": level,
                  "basis": basis
              }

              if level == "HIGH":
                  high += 1
              elif level == "MEDIUM":
                  medium += 1
              else:
                  low += 1

          stats["external_agents"] = len(profiles)
          stats["agent_profiles"] = len(profiles)
          stats["HIGH"] = high
          stats["MEDIUM"] = medium
          stats["LOW"] = low
          stats["UNKNOWN"] = unknown

          # ============================================================
          # HARD VALIDATION
          # ============================================================

          errors = []

          for agent in profiles:

              if is_nox(agent):
                  errors.append(
                      "NØX classified as external agent: "
                      + agent
                  )

              if not valid_agent(agent):
                  errors.append(
                      "Invalid external agent: "
                      + agent
                  )

          for agent, profile in profiles.items():

              behavioral = (
                  profile[
                      "behavioral_evidence"
                  ]["observations"]
              )

              results = (
                  profile[
                      "results"
                  ]["observations"]
              )

              level = profile[
                  "trust"
              ]["level"]

              if (
                  level != "UNKNOWN"
                  and behavioral == 0
                  and results == 0
              ):
                  errors.append(
                      "Trust without evidence: "
                      + agent
                  )

          for observation in observations:

              attribution = observation.get(
                  "attribution",
                  {}
              )

              method = attribution.get(
                  "method"
              )

              if method in FORBIDDEN_METHODS:
                  errors.append(
                      "Forbidden attribution method: "
                      + str(method)
                  )

              if observation.get("type") == "RESULT":

                  if (
                      attribution.get("status")
                      != "EXPLICIT"
                  ):
                      errors.append(
                          "Result without explicit attribution"
                      )

                  if (
                      attribution.get("method")
                      != "structured_result_attribution"
                  ):
                      errors.append(
                          "Result without structured attribution"
                      )

                  if (
                      attribution.get("agent")
                      != observation.get("agent")
                  ):
                      errors.append(
                          "Result agent mismatch"
                      )

          # ============================================================
          # NO NATURAL LANGUAGE ATTRIBUTION
          # ============================================================

          observation_text = json.dumps(
              observations,
              ensure_ascii=False
          ).lower()

          for forbidden in FORBIDDEN_METHODS:

              if forbidden in observation_text:
                  errors.append(
                      "Forbidden attribution marker in observations: "
                      + forbidden
                  )

          # ============================================================
          # RESULT INHERITANCE CHECK
          # ============================================================

          claim_result_agents = {}

          for observation in observations:

              if observation.get("type") != "RESULT":
                  continue

              claim = observation.get(
                  "claim_id"
              )

              agent = observation.get(
                  "agent"
              )

              if claim not in claim_result_agents:
                  claim_result_agents[claim] = set()

              claim_result_agents[claim].add(agent)

          # Multiple agents are allowed only when each result explicitly
          # names its own agent.
          for claim, agents in claim_result_agents.items():

              if len(agents) <= 1:
                  continue

              for agent in agents:

                  valid_result = False

                  for observation in observations:

                      if (
                          observation.get("type")
                          == "RESULT"
                          and observation.get(
                              "claim_id"
                          ) == claim
                          and observation.get(
                              "agent"
                          ) == agent
                          and observation.get(
                              "attribution",
                              {}
                          ).get("agent")
                          == agent
                      ):
                          valid_result = True
                          break

                  if not valid_result:
                      errors.append(
                          "Possible result inheritance: "
                          + str(claim)
                          + " / "
                          + str(agent)
                      )

          if errors:

              print("")
              print("==============================================")
              print("VALIDATION FAILED")
              print("==============================================")

              for error in errors:
                  print(" - " + error)

              raise SystemExit(1)

          # ============================================================
          # FINAL OUTPUT
          # ============================================================

          output = {
              "version": VERSION,

              "generated_at": now,

              "source": {
                  "file": INPUT,
                  "knowledge_entries_processed": len(
                      knowledge
                  )
              },

              "statistics": stats,

              "trust_policy": {
                  "version": "V1.9-FINAL",

                  "principle": (
                      "Trust is earned only from explicitly "
                      "attributed behavior and explicitly "
                      "attributed results."
                  ),

                  "identity_is_not_trust": True,

                  "interaction_is_not_trust": True,

                  "evidence_array_alone_is_not_behavior": True,

                  "natural_language_result_attribution": False,

                  "source_agent_is_not_subject_agent": True,

                  "multi_agent_result_inheritance": False,

                  "unknown_preferred_over_false_trust": True,

                  "known_agent_allowlist_used_for_identity_only": True,

                  "karma_used_for_trust": False,

                  "post_count_used_for_trust": False,

                  "follower_count_used_for_trust": False,

                  "external_api_used": False,

                  "gemini_used": False,

                  "cost_eur": 0
              },

              "profiles": profiles,

              "observations": observations,

              "attribution_audit": {
                  "natural_language_result_attribution_used": False,

