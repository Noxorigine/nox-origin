name: NØX ACT 18 - Reputation & Trust Core

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ACT18 Reputation & Trust Core
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================================"
          echo "NØX ACT18 — REPUTATION & TRUST CORE"
          echo "================================================================"

          python3 <<'PY'
          import json
          import os
          import re
          from collections import defaultdict
          from datetime import datetime, timezone

          INPUT_FILE = "memory/nox_knowledge_core.json"
          OUTPUT_FILE = "memory/nox_reputation_trust.json"

          # ============================================================
          # Helpers
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def clamp(value, minimum=0.0, maximum=1.0):
              return max(minimum, min(maximum, float(value)))

          def safe_float(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def safe_int(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def normalize_text(value):
              if not isinstance(value, str):
                  return ""
              return re.sub(r"\s+", " ", value.strip())

          # ============================================================
          # Agent identification
          #
          # IMPORTANT:
          # ACT17 stores some observations in a compact "|" format.
          # The position of the external agent is NOT fixed.
          #
          # Example:
          # V74 | date | event | nox_origine | UUID | ... | Deep Seeker | ...
          #
          # We therefore scan every segment and reject technical/NØX
          # identifiers before accepting an external agent name.
          # ============================================================

          UUID_RE = re.compile(
              r"^[0-9a-f]{8}-"
              r"[0-9a-f]{4}-"
              r"[0-9a-f]{4}-"
              r"[0-9a-f]{4}-"
              r"[0-9a-f]{12}$",
              re.IGNORECASE,
          )

          TIMESTAMP_RE = re.compile(
              r"^\d{4}-\d{2}-\d{2}"
          )

          VERSION_RE = re.compile(
              r"^v\d+$",
              re.IGNORECASE,
          )

          URL_RE = re.compile(
              r"^(https?://|www\.)",
              re.IGNORECASE,
          )

          Nox_IDENTITIES = {
              "nox",
              "nox_origin",
              "nox origine",
              "nøx origin",
              "nøx origine",
              "nox-origin",
              "nøx-origin",
              "noxorigin",
          }

          SYSTEM_WORDS = {
              "proposal",
              "evidence",
              "audit",
              "research",
              "learning",
              "opportunity",
              "detection",
              "marketplace",
              "community",
              "autonomous",
              "observation",
              "reflection",
              "verification",
              "knowledge",
              "memory",
              "signal",
              "strategy",
              "decision",
              "synthesis",
              "priority",
              "analysis",
              "monitor",
              "monitoring",
              "evaluation",
              "performance",
              "corroboration",
              "contradiction",
          }

          def canonical_agent_name(value):
              """
              Normalize an external agent name while preserving readability.
              """

              value = normalize_text(value)

              if not value:
                  return ""

              # Remove common leading @ from handles.
              if value.startswith("@"):
                  value = value[1:].strip()

              return value

          def looks_like_agent(value):
              if not isinstance(value, str):
                  return False

              value = canonical_agent_name(value)

              if not value:
                  return False

              lower = value.lower()

              # Never attribute reputation to NØX itself.
              if lower in Nox_IDENTITIES:
                  return False

              # Technical identifiers.
              if UUID_RE.fullmatch(value):
                  return False

              if TIMESTAMP_RE.match(value):
                  return False

              if VERSION_RE.fullmatch(value):
                  return False

              if URL_RE.match(value):
                  return False

              # Serialized dictionaries / technical objects.
              if value.startswith("{") or value.startswith("["):
                  return False

              # Excessively long text is almost certainly evidence,
              # not an agent identity.
              if len(value) > 80:
                  return False

              # Sentences are not agent names.
              if value.count(" ") > 8:
                  return False

              # Must contain letters.
              if not re.search(r"[A-Za-zÀ-ÿ]", value):
                  return False

              # Reject obvious long technical identifiers.
              if re.fullmatch(r"[A-Za-z0-9_-]{20,}", value):
                  return False

              # Reject simple system/event labels.
              words = set(re.findall(r"[a-z0-9_-]+", lower))

              if words and words.issubset(SYSTEM_WORDS):
                  return False

              if len(words) <= 4 and words.intersection(SYSTEM_WORDS):
                  return False

              return True

          def extract_agent(entry):
              """
              Extract a real external agent from an ACT17 entry.

              Priority:
              1. Explicit structured fields.
              2. All segments of compact information.
              3. Unknown if no reliable external agent exists.
              """

              candidates = []

              # Explicit fields first.
              for key in (
                  "agent",
                  "agent_name",
                  "source_agent",
                  "author",
                  "source_agent_name",
                  "author_name",
                  "username",
              ):
                  value = entry.get(key)
                  if isinstance(value, str):
                      candidates.append(value)

              # Some ACT17 entries may contain nested source objects.
              source = entry.get("source")

              if isinstance(source, dict):
                  for key in (
                      "agent",
                      "agent_name",
                      "username",
                      "name",
                      "display_name",
                      "author",
                  ):
                      value = source.get(key)
                      if isinstance(value, str):
                          candidates.append(value)

              # Compact ACT17 information.
              information = entry.get("information", "")

              if isinstance(information, str):
                  parts = [
                      normalize_text(part)
                      for part in information.split("|")
                  ]

                  # Scan all fields, NOT a fixed index.
                  candidates.extend(parts)

              # Try candidates in order.
              for candidate in candidates:
                  if looks_like_agent(candidate):
                      return canonical_agent_name(candidate)

              return "unknown"

          # ============================================================
          # Domain extraction
          # ============================================================

          VALID_DOMAINS = {
              "virtual_economy",
              "cybersecurity",
              "ai_communities",
              "agent_intelligence_and_autonomy",
              "emerging_technologies_and_opportunities",
              "general",
          }

          def extract_domain(entry):
              domain = entry.get("domain")

              if isinstance(domain, str):
                  domain = domain.strip()

                  if domain in VALID_DOMAINS:
                      return domain

              information = normalize_text(entry.get("information", ""))

              text = information.lower()

              scores = {
                  "virtual_economy": 0,
                  "cybersecurity": 0,
                  "ai_communities": 0,
                  "agent_intelligence_and_autonomy": 0,
                  "emerging_technologies_and_opportunities": 0,
              }

              keyword_map = {
                  "virtual_economy": [
                      "marketplace",
                      "opportunity",
                      "work request",
                      "task",
                      "payment",
                      "economy",
                      "bidding",
                      "offer",
                  ],
                  "cybersecurity": [
                      "cyber",
                      "security",
                      "authentication",
                      "credential",
                      "attack",
                      "vulnerability",
                      "privacy",
                  ],
                  "ai_communities": [
                      "community",
                      "agent community",
                      "colony",
                      "discussion",
                      "collaboration",
                  ],
                  "agent_intelligence_and_autonomy": [
                      "autonomy",
                      "autonomous",
                      "agent",
                      "reasoning",
                      "learning",
                      "decision",
                      "intelligence",
                  ],
                  "emerging_technologies_and_opportunities": [
                      "emerging",
                      "technology",
                      "innovation",
                      "new technology",
                  ],
              }

              for domain, keywords in keyword_map.items():
                  for keyword in keywords:
                      if keyword in text:
                          scores[domain] += 1

              best_domain = max(scores, key=scores.get)

              if scores[best_domain] > 0:
                  return best_domain

              return "general"

          # ============================================================
          # Evidence
          # ============================================================

          def has_evidence(entry):
              """
              Evidence must be more than merely having an information field.
              """

              evidence = entry.get("evidence")

              if isinstance(evidence, list):
                  if any(normalize_text(x) for x in evidence):
                      return True

              if isinstance(evidence, str) and normalize_text(evidence):
                  return True

              # Structured source/reference fields.
              for key in (
                  "source",
                  "source_url",
                  "source_id",
                  "reference",
                  "reference_id",
                  "post_id",
              ):
                  value = entry.get(key)

                  if isinstance(value, str) and normalize_text(value):
                      return True

              # Compact ACT17 records normally contain identifiers and
              # evidence text inside information.
              information = normalize_text(entry.get("information", ""))

              if "|" in information:
                  parts = [
                      normalize_text(x)
                      for x in information.split("|")
                  ]

                  # A compact record containing several meaningful fields
                  # is considered evidence-bearing.
                  meaningful = [
                      p for p in parts
                      if p and not UUID_RE.fullmatch(p)
                  ]

                  if len(meaningful) >= 5:
                      return True

              return False

          # ============================================================
          # Load ACT17
          # ============================================================

          if not os.path.exists(INPUT_FILE):
              raise SystemExit(
                  f"Missing required input file: {INPUT_FILE}"
              )

          with open(INPUT_FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          knowledge = data.get("knowledge", [])

          if not isinstance(knowledge, list):
              raise SystemExit(
                  "ACT17 knowledge field is not a list."
              )

          # ============================================================
          # Aggregate by agent + domain
          # ============================================================

          profiles = defaultdict(lambda: {
              "observations": 0,
              "evidence": 0,
              "corroborations": 0,
              "contradictions": 0,
              "confidence_sum": 0.0,
              "usefulness_sum": 0.0,
              "claims": [],
          })

          agents_seen = set()

          global_contradictions = data.get("contradictions", [])

          contradiction_by_claim = defaultdict(int)

          if isinstance(global_contradictions, list):
              for item in global_contradictions:
                  if isinstance(item, dict):
                      claim_id = item.get("claim_id")

                      if claim_id:
                          contradiction_by_claim[str(claim_id)] += 1

          for entry in knowledge:
              if not isinstance(entry, dict):
                  continue

              agent = extract_agent(entry)

              # Do not create reputation profiles for unknown identities.
              if agent == "unknown":
                  continue

              # Absolute protection against NØX contamination.
              if agent.lower() in Nox_IDENTITIES:
                  continue

              domain = extract_domain(entry)

              key = (agent, domain)

              profile = profiles[key]

              profile["observations"] += 1
              agents_seen.add(agent)

              confidence = clamp(
                  safe_float(
                      entry.get("confidence"),
                      0.32
                  )
              )

              usefulness = clamp(
                  safe_float(
                      entry.get("operational_usefulness"),
                      0.0
                  ) / 10.0
              )

              profile["confidence_sum"] += confidence
              profile["usefulness_sum"] += usefulness

              if has_evidence(entry):
                  profile["evidence"] += 1

              claim_id = str(entry.get("claim_id", ""))

              if claim_id:
                  profile["claims"].append(claim_id)

              # Corroboration can be represented in the entry itself.
              confirmations = safe_int(
                  entry.get("confirmations"),
                  0
              )

              corroborated = entry.get("status") == "CORROBORATED"

              if corroborated:
                  profile["corroborations"] += 1
              elif confirmations > 0:
                  profile["corroborations"] += min(
                      confirmations,
                      3
                  )

              # Contradictions from ACT17.
              contradiction_count = contradiction_by_claim.get(
                  claim_id,
                  0
              )

              if contradiction_count:
                  profile["contradictions"] += contradiction_count

              entry_contradictions = entry.get("contradictions")

              if isinstance(entry_contradictions, list):
                  profile["contradictions"] += len(
                      entry_contradictions
                  )

          # ============================================================
          # Calculate agent/domain trust
          # ============================================================

          def calculate_profile(profile):
              observations = profile["observations"]

              if observations <= 0:
                  return {
                      "trust_score": 0.0,
                      "trust_level": "UNKNOWN",
                  }

              avg_confidence = (
                  profile["confidence_sum"] / observations
              )

              evidence_ratio = (
                  profile["evidence"] / observations
              )

              # Corroboration is normalized conservatively.
              corroboration_ratio = clamp(
                  profile["corroborations"] / max(
                      1,
                      observations
                  )
              )

              avg_usefulness = (
                  profile["usefulness_sum"] / observations
              )

              # Evidence-weighted trust.
              base_score = (
                  avg_confidence * 0.40
                  + evidence_ratio * 0.25
                  + corroboration_ratio * 0.15
                  + avg_usefulness * 0.20
              )

              # Contradictions reduce trust progressively.
              contradiction_penalty = clamp(
                  1.0
                  - min(
                      0.50,
                      profile["contradictions"]
                      / max(1, observations)
                      * 0.10
                  )
              )

              trust_score = clamp(
                  base_score * contradiction_penalty
              )

              if observations < 2:
                  trust_level = "INSUFFICIENT"
              elif (
                  trust_score >= 0.75
                  and profile["contradictions"] == 0
              ):
                  trust_level = "STRONG"
              elif trust_score >= 0.55:
                  trust_level = "MODERATE"
              else:
                  trust_level = "WEAK"

              return {
                  "trust_score": round(trust_score, 4),
                  "trust_level": trust_level,
                  "avg_confidence": round(
                      avg_confidence,
                      4
                  ),
                  "evidence_ratio": round(
                      evidence_ratio,
                      4
                  ),
                  "corroboration_ratio": round(
                      corroboration_ratio,
                      4
                  ),
                  "avg_operational_usefulness": round(
                      avg_usefulness,
                      4
                  ),
                  "contradiction_penalty": round(
                      contradiction_penalty,
                      4
                  ),
              }

          # ============================================================
          # Build profiles
          # ============================================================

          agent_domain_profiles = {}

          for (agent, domain), profile in sorted(
              profiles.items(),
              key=lambda item: (
                  item[0][0].lower(),
                  item[0][1],
              )
          ):
              metrics = calculate_profile(profile)

              agent_domain_profiles.setdefault(
                  agent,
                  {}
              )[domain] = {
                  **metrics,
                  "observations": profile["observations"],
                  "evidence": profile["evidence"],
                  "corroborations": profile["corroborations"],
                  "contradictions": profile["contradictions"],
                  "claims": profile["claims"][-50:],
              }

          # ============================================================
          # Overall agent trust
          # ============================================================

          agent_summaries = {}

          for agent, domains in agent_domain_profiles.items():

              weighted_score = 0.0
              total_weight = 0

              total_observations = 0
              total_evidence = 0
              total_corroborations = 0
              total_contradictions = 0

              for domain_metrics in domains.values():
                  observations = domain_metrics["observations"]

                  # Cap each domain contribution to avoid one domain
                  # completely dominating the overall reputation.
                  weight = min(observations, 20)

                  weighted_score += (
                      domain_metrics["trust_score"]
                      * weight
                  )

                  total_weight += weight

                  total_observations += observations
                  total_evidence += domain_metrics["evidence"]
                  total_corroborations += (
                      domain_metrics["corroborations"]
                  )
                  total_contradictions += (
                      domain_metrics["contradictions"]
                  )

              if total_weight:
                  overall_score = (
                      weighted_score / total_weight
                  )
              else:
                  overall_score = 0.0

              if (
                  total_observations >= 10
                  and overall_score >= 0.75
              ):
                  overall_level = "HIGH"
              elif (
                  total_observations >= 5
                  and overall_score >= 0.55
              ):
                  overall_level = "MEDIUM"
              elif total_observations >= 2:
                  overall_level = "LOW"
              else:
                  overall_level = "UNKNOWN"

              agent_summaries[agent] = {
                  "trust_score": round(
                      overall_score,
                      4
                  ),
                  "trust_level": overall_level,
                  "observations": total_observations,
                  "evidence": total_evidence,
                  "corroborations": total_corroborations,
                  "contradictions": total_contradictions,
                  "domains": domains,
              }

          # ============================================================
          # Decision policy
          # ============================================================

          decision_policy = {
              "purpose": (
                  "Evaluate trust by agent and domain using "
                  "evidence, confidence, corroboration, usefulness "
                  "and contradictions."
              ),
              "principles": [
                  "Trust is domain-specific.",
                  "Trust is evidence-based.",
                  "Karma and post count are not used as trust signals.",
                  "Unknown does not mean unreliable.",
                  "Contradictions reduce trust.",
                  "Important decisions should seek corroboration.",
                  "NØX must never assign reputation to itself.",
              ],
              "levels": {
                  "HIGH": (
                      "Strong supporting signal for significant decisions, "
                      "provided the relevant domain profile is also strong."
                  ),
                  "MEDIUM": (
                      "Useful supporting evidence; corroboration is preferred "
                      "for important decisions."
                  ),
                  "LOW": (
                      "Use cautiously and seek independent evidence."
                  ),
                  "UNKNOWN": (
                      "Do not rely on reputation; gather evidence first."
                  ),
              },
          }

          # ============================================================
          # Statistics
          # ============================================================

          total_observations = sum(
              profile["observations"]
              for profile in profiles.values()
          )

          total_evidence = sum(
              profile["evidence"]
              for profile in profiles.values()
          )

          total_corroborations = sum(
              profile["corroborations"]
              for profile in profiles.values()
          )

          total_contradictions = sum(
              profile["contradictions"]
              for profile in profiles.values()
          )

          output = {
              "version": "ACT18-V1.1",
              "purpose": (
                  "Domain-specific reputation and trust layer "
                  "for NØX Origin."
              ),
              "generated_at": now_iso(),

              "statistics": {
                  "knowledge_entries_processed": len(knowledge),
                  "observations_with_identified_external_agent":
                      total_observations,
                  "agents_detected": len(agent_summaries),
                  "agent_domain_profiles": len(profiles),
                  "evidence": total_evidence,
                  "corroborations": total_corroborations,
                  "contradictions": total_contradictions,
              },

              "agents": agent_summaries,

              "agent_domain_profiles": agent_domain_profiles,

              "decision_policy": decision_policy,

              "source": {
                  "knowledge_core": INPUT_FILE,
                  "knowledge_core_version":
                      data.get("version"),
              },

              "last_run": now_iso(),
          }

          os.makedirs("memory", exist_ok=True)

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("ACT18 BUILD COMPLETE")
          print("----------------------------------------------------------------")
          print(
              f"Knowledge entries processed: {len(knowledge)}"
          )
          print(
              "External-agent observations: "
              f"{total_observations}"
          )
          print(
              f"Agents detected: {len(agent_summaries)}"
          )
          print(
              f"Agent/domain profiles: {len(profiles)}"
          )
          print(
              f"Evidence: {total_evidence}"
          )
          print(
              f"Corroborations: {total_corroborations}"
          )
          print(
              f"Contradictions: {total_contradictions}"
          )

          print("")
          print("AGENT TRUST SUMMARY")
          print("----------------------------------------------------------------")

          if not agent_summaries:
              print(
                  "WARNING: No external agents could be identified."
              )
          else:
              for agent, summary in sorted(
                  agent_summaries.items(),
                  key=lambda item: (
                      -item[1]["trust_score"],
                      item[0].lower(),
                  )
              ):
                  print(
                      f"{agent}: "
                      f"{summary['trust_score']:.4f} "
                      f"[{summary['trust_level']}] "
                      f"observations={summary['observations']} "
                      f"evidence={summary['evidence']} "
                      f"corroborations={summary['corroborations']} "
                      f"contradictions={summary['contradictions']}"
                  )

          print("")
          print(f"Output: {OUTPUT_FILE}")
          print("================================================================")
          PY

      - name: Commit ACT18 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT18 Reputation Trust Core"
          git push
