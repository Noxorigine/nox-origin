name: NØX ACT 18 - Reputation & Trust

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ACT18 V1.6
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "NØX ACT 18 - REPUTATION & TRUST V1.6"
          echo "IDENTITY / INTERACTION / EVIDENCE SEPARATION"
          echo "================================================"

          python3 <<'PY'
          import json
          import hashlib
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          VERSION = "ACT18-V1.6"

          INPUT = Path("memory/nox_knowledge_core.json")
          OUTPUT = Path("memory/nox_reputation_trust.json")

          if not INPUT.exists():
              raise SystemExit(f"Missing input file: {INPUT}")

          with INPUT.open("r", encoding="utf-8") as f:
              data = json.load(f)

          knowledge = data.get("knowledge", [])

          NOX_HANDLES = {
              "nox_origine",
              "nox_origin",
              "nøx_origin",
          }

          # ------------------------------------------------------------
          # Generic words / concepts that must NEVER become agents.
          # This is intentionally conservative.
          # ------------------------------------------------------------

          GENERIC_REJECTS = {
              "agent",
              "agents",
              "agentic",
              "follow",
              "following",
              "follower",
              "followers",
              "post",
              "posts",
              "comment",
              "comments",
              "public_posts",
              "substantive_comment",
              "identity_classification_verified",
              "action_executed",
              "action",
              "discussion",
              "hash",
              "success",
              "failure",
              "unknown",
              "unresolved",
              "not_evaluable",
              "none",
              "untested",
              "strong_stability",
              "adaptive balanced",
              "resilience",
              "specie",
              "pay",
              "proposal",
              "measurement",
              "receipts",
              "the",
              "them",
              "them.",
              "this",
              "that",
              "what",
              "what i can actually finish",
              "what i will not do",
              "deep seeker",
              "deep-seeker",
              "wiener",
              "molt",
              "machine-native payments",
              "sovereign rails",
              "coinos.io",
          }

          # ------------------------------------------------------------
          # Fields that can contain genuine identity information.
          # ------------------------------------------------------------

          IDENTITY_KEYS = {
              "username",
              "agent_username",
              "agent_name",
              "target_agent",
              "target_username",
              "recipient",
              "requester",
              "follow_target",
              "followed_agent",
              "author_username",
          }

          # Fields that can contain an explicit external agent identity.
          # "author" alone is NOT trusted because ACT17 contains many
          # internal authorship fields belonging to NØX.
          SAFE_AUTHOR_KEYS = {
              "author_username",
              "agent_username",
              "target_username",
              "target_agent",
              "follow_target",
              "followed_agent",
          }

          EXPLICIT_LABEL_PATTERNS = [
              r"\bagent\s*:\s*@?([a-zA-Z0-9][a-zA-Z0-9_.-]{1,63})",
              r"\busername\s*:\s*@?([a-zA-Z0-9][a-zA-Z0-9_.-]{1,63})",
              r"\btarget[_ -]?agent\s*:\s*@?([a-zA-Z0-9][a-zA-Z0-9_.-]{1,63})",
              r"\btarget[_ -]?username\s*:\s*@?([a-zA-Z0-9][a-zA-Z0-9_.-]{1,63})",
          ]

          HANDLE_RE = re.compile(
              r"(?<![A-Za-z0-9_])@([a-zA-Z0-9][a-zA-Z0-9_.-]{1,63})"
          )

          UUID_RE = re.compile(
              r"\b[0-9a-fA-F]{8}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{12}\b"
          )

          # ------------------------------------------------------------
          # Strong signals that an observation is actually an interaction.
          # ------------------------------------------------------------

          INTERACTION_TERMS = (
              "follow",
              "followed",
              "following",
              "commented",
              "comment",
              "reply",
              "replied",
              "response",
              "responded",
              "mentioned",
              "mention",
              "interaction",
              "message",
              "dm",
              "direct message",
          )

          RESULT_SUCCESS_TERMS = {
              "success",
              "successful",
              "succeeded",
              "completed",
              "accepted",
              "published",
              "delivered",
              "executed successfully",
          }

          RESULT_FAILURE_TERMS = {
              "failure",
              "failed",
              "error",
              "rejected",
              "declined",
              "unsuccessful",
          }

          # ------------------------------------------------------------
          # Utilities
          # ------------------------------------------------------------

          def normalize(value):
              if value is None:
                  return ""
              return str(value).strip()

          def normalize_agent(value):
              value = normalize(value)
              value = value.lstrip("@").strip().lower()

              if not value:
                  return None

              if value in NOX_HANDLES:
                  return None

              if value in GENERIC_REJECTS:
                  return None

              # Never accept obvious sentence fragments.
              if len(value) > 64:
                  return None

              if " " in value:
                  return None

              if value.startswith(("http://", "https://")):
                  return None

              if value.endswith((".", ",", ":", ";", "!", "?")):
                  value = value.rstrip(".,:;!?")

              if not value:
                  return None

              # Agent handles are deliberately conservative.
              if not re.fullmatch(
                  r"[a-z0-9][a-z0-9_.-]{1,63}",
                  value
              ):
                  return None

              return value

          def text_of(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float, bool)):
                  return str(value)
              return ""

          def flatten_text(obj, limit=12000):
              parts = []

              def walk(x, depth=0):
                  if len(" ".join(parts)) >= limit:
                      return

                  if depth > 5:
                      return

                  if isinstance(x, dict):
                      for k, v in x.items():
                          if isinstance(v, (str, int, float, bool)):
                              parts.append(f"{k}: {v}")
                          elif isinstance(v, (dict, list)):
                              walk(v, depth + 1)

                  elif isinstance(x, list):
                      for item in x[:100]:
                          walk(item, depth + 1)

                  elif isinstance(x, (str, int, float, bool)):
                      parts.append(str(x))

              walk(obj)
              return " ".join(parts)[:limit]

          def claim_id(entry):
              value = normalize(
                  entry.get("claim_id")
                  or entry.get("id")
                  or entry.get("information")
                  or json.dumps(entry, sort_keys=True, ensure_ascii=False)
              )
              return hashlib.sha1(value.encode("utf-8")).hexdigest()[:20]

          def source_blob(entry):
              chunks = []

              for key in (
                  "information",
                  "claim",
                  "title",
                  "content",
                  "text",
                  "response",
                  "result",
                  "action",
                  "interaction",
                  "evidence",
              ):
                  if key in entry:
                      chunks.append(text_of(entry[key]))

              if not chunks:
                  chunks.append(flatten_text(entry))

              return " ".join(chunks)

          # ------------------------------------------------------------
          # Identity extraction
          #
          # IMPORTANT:
          # We do not scan arbitrary capitalized words.
          # We do not treat publication titles as agents.
          # We do not treat arbitrary nouns as agents.
          # We do not treat source_agent as the subject agent.
          # ------------------------------------------------------------

          def extract_identity_candidates(entry):
              candidates = []

              def add(value, reason, strength):
                  agent = normalize_agent(value)

                  if not agent:
                      return

                  candidates.append({
                      "agent": agent,
                      "identity_reason": reason,
                      "identity_strength": strength,
                  })

              # 1. Structured identity fields.
              for key in IDENTITY_KEYS:
                  if key not in entry:
                      continue

                  value = entry.get(key)

                  if isinstance(value, str):
                      add(value, f"structured:{key}", "STRONG")

                  elif isinstance(value, dict):
                      for subkey in (
                          "username",
                          "agent_username",
                          "name",
                          "handle",
                      ):
                          if subkey in value:
                              add(
                                  value.get(subkey),
                                  f"structured:{key}.{subkey}",
                                  "STRONG",
                              )

              # 2. Explicit @handle.
              blob = source_blob(entry)

              for match in HANDLE_RE.finditer(blob):
                  add(match.group(1), "explicit:@handle", "STRONG")

              # 3. Explicit agent labels.
              for pattern in EXPLICIT_LABEL_PATTERNS:
                  for match in re.finditer(pattern, blob, re.IGNORECASE):
                      add(match.group(1), "explicit:label", "STRONG")

              # 4. UUID + explicit identity structure.
              #
              # UUID alone is NOT enough.
              #
              has_uuid = bool(UUID_RE.search(blob))

              if has_uuid:
                  for key in (
                      "username",
                      "agent_username",
                      "target_agent",
                      "target_username",
                  ):
                      if key in entry and isinstance(entry[key], str):
                          add(
                              entry[key],
                              f"uuid+structured:{key}",
                              "STRONG",
                          )

              # Deduplicate.
              unique = {}
              for item in candidates:
                  key = item["agent"]
                  if key not in unique:
                      unique[key] = item

              return list(unique.values())

          # ------------------------------------------------------------
          # Determine whether a candidate is actually involved in an
          # interaction.
          # ------------------------------------------------------------

          def is_interaction(entry, blob):
              lower = blob.lower()

              if any(term in lower for term in INTERACTION_TERMS):
                  return True

              for key in (
                  "interaction",
                  "action",
                  "event",
                  "operation",
                  "type",
              ):
                  if key in entry:
                      value = text_of(entry[key]).lower()
                      if any(term in value for term in INTERACTION_TERMS):
                          return True

              return False

          # ------------------------------------------------------------
          # Determine whether there is behavioral evidence.
          #
          # Evidence requires explicit attribution:
          #
          # - structured evidence attached to the candidate
          # - explicit authored response/content
          # - explicit action/result relation
          #
          # Mere mention of an agent is NEVER behavioral evidence.
          # ------------------------------------------------------------

          def behavioral_evidence_for(entry, agent, blob):
              lower = blob.lower()

              structured_evidence = any(
                  key in entry
                  for key in (
                      "evidence",
                      "evidence_type",
                      "evidence_value",
                      "behavior",
                      "behavioral_evidence",
                      "observed_behavior",
                  )
              )

              explicit_agent_context = (
                  f"@{agent}" in lower
                  or f"agent: {agent}" in lower
                  or f"username: {agent}" in lower
                  or f"target_agent: {agent}" in lower
                  or f"target_username: {agent}" in lower
              )

              # An explicit response/content attributed to an external
              # agent is potentially behavioral evidence.
              authored_content = any(
                  key in entry
                  for key in (
                      "agent_response",
                      "agent_content",
                      "external_response",
                      "response_from_agent",
                  )
              )

              # Explicit structured source attribution.
              attributed = False

              for key in SAFE_AUTHOR_KEYS:
                  value = entry.get(key)
                  if isinstance(value, str):
                      normalized = normalize_agent(value)
                      if normalized == agent:
                          attributed = True

              # Never consider generic "source_agent" attribution as
              # external behavioral evidence because ACT17 often stores
              # NØX as the source of the memory.
              source_agent = normalize_agent(entry.get("source_agent"))
              if source_agent == agent and agent in NOX_HANDLES:
                  attributed = False

              if structured_evidence and (explicit_agent_context or attributed):
                  return True

              if authored_content and (explicit_agent_context or attributed):
                  return True

              # Explicit action performed BY the external agent.
              action_by_agent = False

              for key in (
                  "performed_by",
                  "executed_by",
                  "actor",
                  "actor_username",
                  "agent",
              ):
                  value = entry.get(key)
                  if isinstance(value, str):
                      normalized = normalize_agent(value)
                      if normalized == agent:
                          action_by_agent = True

              if action_by_agent:
                  return True

              return False

          # ------------------------------------------------------------
          # Result attribution
          #
          # A SUCCESS/FAILURE in an ACT17 entry is NOT automatically the
          # external agent's result.
          # It must be explicitly linked to that agent.
          # ------------------------------------------------------------

          def result_for_agent(entry, agent, blob):
              lower = blob.lower()

              explicit_actor = False

              for key in (
                  "performed_by",
                  "executed_by",
                  "actor",
                  "actor_username",
                  "agent",
                  "agent_username",
              ):
                  value = entry.get(key)

                  if isinstance(value, str):
                      normalized = normalize_agent(value)

                      if normalized == agent:
                          explicit_actor = True

              if not explicit_actor:
                  # Look for explicit natural-language attribution.
                  patterns = [
                      rf"\b{re.escape(agent)}\b.*\b(success|successful|succeeded|failed|failure|error)\b",
                      rf"\b(success|successful|succeeded|failed|failure|error)\b.*\b{re.escape(agent)}\b",
                      rf"@{re.escape(agent)}.*\b(success|successful|succeeded|failed|failure|error)\b",
                  ]

                  explicit_actor = any(
                      re.search(pattern, lower)
                      for pattern in patterns
                  )

              if not explicit_actor:
                  return None

              if any(term in lower for term in RESULT_SUCCESS_TERMS):
                  return "SUCCESS"

              if any(term in lower for term in RESULT_FAILURE_TERMS):
                  return "FAILURE"

              return None

          # ------------------------------------------------------------
          # Build observations
          # ------------------------------------------------------------

          observations = []

          for entry in knowledge:
              if not isinstance(entry, dict):
                  continue

              cid = claim_id(entry)
              blob = source_blob(entry)

              identities = extract_identity_candidates(entry)

              if not identities:
                  continue

              interaction = is_interaction(entry, blob)

              for identity in identities:
                  agent = identity["agent"]

                  if agent in NOX_HANDLES:
                      continue

                  behavioral = behavioral_evidence_for(
                      entry,
                      agent,
                      blob
                  )

                  result = result_for_agent(
                      entry,
                      agent,
                      blob
                  )

                  if behavioral:
                      observation_type = "BEHAVIORAL_EVIDENCE"
                  elif result:
                      observation_type = "RESULT"
                  elif interaction:
                      observation_type = "INTERACTION"
                  else:
                      observation_type = "IDENTITY"

                  observations.append({
                      "agent": agent,
                      "domain": normalize(
                          entry.get("domain") or "general"
                      ).lower(),
                      "claim_id": cid,
                      "observation_type": observation_type,
                      "identity_reason": identity["identity_reason"],
                      "identity_strength": identity["identity_strength"],
                      "result": result,
                  })

          # ------------------------------------------------------------
          # Deduplicate observations.
          # ------------------------------------------------------------

          dedup = {}

          for obs in observations:
              key = (
                  obs["agent"],
                  obs["domain"],
                  obs["claim_id"],
                  obs["observation_type"],
                  obs.get("result"),
              )

              dedup[key] = obs

          observations = list(dedup.values())

          # ------------------------------------------------------------
          # Aggregate profiles.
          # ------------------------------------------------------------

          profiles = {}

          for obs in observations:
              key = (
                  obs["agent"],
                  obs["domain"],
              )

              if key not in profiles:
                  profiles[key] = {
                      "profile_id": hashlib.sha1(
                          f"{obs['agent']}|{obs['domain']}".encode(
                              "utf-8"
                          )
                      ).hexdigest()[:16],
                      "agent": obs["agent"],
                      "domain": obs["domain"],
                      "observations": 0,
                      "identity_observations": 0,
                      "interaction_observations": 0,
                      "behavioral_evidence_observations": 0,
                      "result_observations": 0,
                      "successful_observations": 0,
                      "failed_observations": 0,
                      "corroborations": 0,
                      "evidence_claim_ids": [],
                      "interaction_claim_ids": [],
                      "identity_claim_ids": [],
                  }

              p = profiles[key]

              p["observations"] += 1

              typ = obs["observation_type"]
              cid = obs["claim_id"]

              if typ == "IDENTITY":
                  p["identity_observations"] += 1
                  p["identity_claim_ids"].append(cid)

              elif typ == "INTERACTION":
                  p["interaction_observations"] += 1
                  p["interaction_claim_ids"].append(cid)

              elif typ == "BEHAVIORAL_EVIDENCE":
                  p["behavioral_evidence_observations"] += 1
                  p["evidence_claim_ids"].append(cid)

              elif typ == "RESULT":
                  p["result_observations"] += 1
                  p["evidence_claim_ids"].append(cid)

              result = obs.get("result")

              if result == "SUCCESS":
                  p["successful_observations"] += 1

              elif result == "FAILURE":
                  p["failed_observations"] += 1

          # ------------------------------------------------------------
          # Corroboration
          #
          # Same agent + domain supported by different claim IDs.
          # This is deliberately capped and does not use popularity.
          # ------------------------------------------------------------

          for p in profiles.values():
              unique_claims = set(
                  p["evidence_claim_ids"]
              )

              p["evidence_claim_ids"] = sorted(unique_claims)
              p["interaction_claim_ids"] = sorted(
                  set(p["interaction_claim_ids"])
              )
              p["identity_claim_ids"] = sorted(
                  set(p["identity_claim_ids"])
              )

              evidence_count = len(unique_claims)

              p["corroborations"] = max(
                  0,
                  min(
                      evidence_count - 1,
                      5
                  )
              )

          # ------------------------------------------------------------
          # Trust scoring
          #
          # Identity and interaction NEVER generate trust.
          #
          # Behavioral evidence is the minimum requirement.
          #
          # Results strengthen or weaken evidence only when explicitly
          # attributable to the external agent.
          # ------------------------------------------------------------

          final_profiles = []

          for p in profiles.values():

              evidence = p["behavioral_evidence_observations"] + \
                         p["result_observations"]

              success = p["successful_observations"]
              failure = p["failed_observations"]
              corroborations = p["corroborations"]

              if evidence == 0:
                  score = 0.0
                  level = "UNKNOWN"
                  decision = "IDENTITY_ONLY"

              else:
                  evidence_ratio = min(
                      evidence / 5.0,
                      1.0
                  )

                  success_ratio = (
                      success / evidence
                      if evidence > 0
                      else 0.0
                  )

                  corroboration_ratio = min(
                      corroborations / 3.0,
                      1.0
                  )

                  score = (
                      0.45 * evidence_ratio
                      + 0.30 * success_ratio
                      + 0.15 * corroboration_ratio
                  )

                  if failure > 0:
                      score -= min(
                          0.25,
                          0.10 * failure
                      )

                  score = max(
                      0.0,
                      min(1.0, score)
                  )

                  if (
                      evidence >= 3
                      and success >= 2
                      and score >= 0.75
                  ):
                      level = "HIGH"
                      decision = "TRUST_WITHIN_DOMAIN"

                  elif (
                      evidence >= 2
                      and score >= 0.55
                  ):
                      level = "MEDIUM"
                      decision = "TRUST_WITH_CAUTION"

                  else:
                      level = "LOW"
                      decision = "CAUTIOUS_USE"

              p["trust_score"] = round(score, 3)
              p["trust_level"] = level
              p["decision"] = decision

              p["policy"] = {
                  "karma_used": False,
                  "post_count_used": False,
                  "followers_used": False,
                  "identity_only_observations_counted_as_trust": False,
                  "interaction_only_observations_counted_as_trust": False,
                  "behavioral_evidence_required": True,
                  "success_requires_explicit_attribution": True,
                  "failure_requires_explicit_attribution": True,
                  "domain_specific": True,
              }

              final_profiles.append(p)

          final_profiles.sort(
              key=lambda x: (
                  -x["trust_score"],
                  x["agent"],
                  x["domain"],
              )
          )

          agents = sorted(
              {
                  p["agent"]
                  for p in final_profiles
              }
          )

          # ------------------------------------------------------------
          # Statistics
          # ------------------------------------------------------------

          identity_only = sum(
              1
              for o in observations
              if o["observation_type"] == "IDENTITY"
          )

          interaction_only = sum(
              1
              for o in observations
              if o["observation_type"] == "INTERACTION"
          )

          behavioral = sum(
              1
              for o in observations
              if o["observation_type"] == "BEHAVIORAL_EVIDENCE"
          )

          result_obs = sum(
              1
              for o in observations
              if o["observation_type"] == "RESULT"
          )

          success_count = sum(
              1
              for o in observations
              if o.get("result") == "SUCCESS"
          )

          failure_count = sum(
              1
              for o in observations
              if o.get("result") == "FAILURE"
          )

          high = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "HIGH"
          )

          medium = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "MEDIUM"
          )

          low = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "LOW"
          )

          unknown = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "UNKNOWN"
          )

          # ------------------------------------------------------------
          # Validation
          # ------------------------------------------------------------

          invalid = []

          for agent in agents:
              if agent in NOX_HANDLES:
                  invalid.append(
                      f"NØX leaked into external agents: {agent}"
                  )

              if agent in GENERIC_REJECTS:
                  invalid.append(
                      f"generic term classified as agent: {agent}"
                  )

          for p in final_profiles:
              if p["trust_level"] not in {
                  "HIGH",
                  "MEDIUM",
                  "LOW",
                  "UNKNOWN",
              }:
                  invalid.append(
                      f"invalid trust level: {p['agent']}"
                  )

              if not (
                  0.0 <= p["trust_score"] <= 1.0
              ):
                  invalid.append(
                      f"invalid trust score: {p['agent']}"
                  )

              if (
                  p["behavioral_evidence_observations"] == 0
                  and p["result_observations"] == 0
                  and p["trust_level"] != "UNKNOWN"
              ):
                  invalid.append(
                      f"identity/interaction profile has trust: {p['agent']}"
                  )

              if (
                  p["interaction_observations"] > 0
                  and p["behavioral_evidence_observations"] == 0
                  and p["result_observations"] == 0
                  and p["trust_score"] != 0.0
              ):
                  invalid.append(
                      f"interaction-only profile has non-zero trust: {p['agent']}"
                  )

          if invalid:
              print("VALIDATION: FAIL")
              for error in invalid[:50]:
                  print(" -", error)
              raise SystemExit(1)

          now = datetime.now(timezone.utc).isoformat()

          output = {
              "version": VERSION,
              "generated_at": now,
              "purpose": (
                  "Domain-specific reputation and trust layer "
                  "built from evidence already stored by ACT17, "
                  "with strict separation between identity, "
                  "interaction, behavioral evidence and results."
              ),
              "knowledge_source": str(INPUT),

              "policy": {
                  "karma_is_not_reputation": True,
                  "post_count_is_not_reputation": True,
                  "followers_are_not_reputation": True,
                  "identity_is_not_trust": True,
                  "interaction_is_not_trust": True,
                  "trust_requires_behavioral_evidence": True,
                  "trust_is_domain_specific": True,
                  "nox_identity_excluded": True,
                  "success_requires_explicit_attribution": True,
                  "failure_requires_explicit_attribution": True,
                  "generic_text_is_not_identity": True,
                  "explicit_identity_required": True,
                  "identity_interaction_evidence_result_separated": True,
              },

              "agents": agents,
              "profiles": final_profiles,

              "statistics": {
                  "knowledge_entries_processed": len(knowledge),
                  "observations_extracted": len(observations),
                  "external_agents_detected": len(agents),
                  "agent_domain_profiles": len(final_profiles),

                  "identity_observations": identity_only,
                  "interaction_only_observations": interaction_only,
                  "behavioral_evidence_observations": behavioral,
                  "result_observations": result_obs,

                  "evidence_observations": behavioral + result_obs,
                  "successful_evidence_observations": success_count,
                  "failed_evidence_observations": failure_count,

                  "high_trust_profiles": high,
                  "medium_trust_profiles": medium,
                  "low_trust_profiles": low,
                  "unknown_trust_profiles": unknown,
              },

              "decision_rules": {
                  "IDENTITY": (
                      "Confirms that an external agent identity "
                      "was explicitly observed. No trust."
                  ),
                  "INTERACTION": (
                      "Confirms an interaction with an external "
                      "agent. No trust."
                  ),
