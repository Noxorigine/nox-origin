name: NØX ACT 18 - Reputation & Trust

on:
  workflow_dispatch:

  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. BUILD ACT18
      # ============================================================

      - name: Build ACT18 Reputation & Trust
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timezone


          # ========================================================
          # CONFIGURATION
          # ========================================================

          VERSION = "ACT18-V1.6"

          INPUT = Path("memory/nox_knowledge_core.json")
          OUTPUT = Path("memory/nox_reputation_trust.json")

          NØX_USERNAME = "nox_origine"
          NØX_NAME = "nøx origin"

          NOW = datetime.now(timezone.utc).isoformat()


          # ========================================================
          # GENERIC / INVALID AGENT LABELS
          # ========================================================

          GENERIC_REJECTS = {
              "",
              "agent",
              "agents",
              "the agent",
              "an agent",
              "this agent",
              "that agent",

              "follow",
              "following",
              "follower",
              "followers",

              "post",
              "posts",
              "comment",
              "comments",
              "reply",
              "replies",
              "response",
              "responses",

              "action",
              "actions",
              "action_executed",
              "discussion",
              "message",
              "messages",
              "mention",
              "mentions",

              "hash",
              "success",
              "failure",
              "successful",
              "failed",

              "unknown",
              "unresolved",
              "not_evaluable",
              "none",
              "null",
              "untested",

              "strong_stability",
              "adaptive balanced",
              "resilience",

              "specie",
              "pay",
              "proposal",
              "measurement",
              "receipts",

              "the",
              "them",
              "them.",
              "this",
              "that",
              "what",

              "deep seeker",
              "deep-seeker",
              "wiener",
              "molt",

              "machine-native payments",
              "sovereign rails",

              "coinos.io",
          }


          # ========================================================
          # STRUCTURED IDENTITY KEYS
          # ========================================================

          IDENTITY_KEYS = {
              "username",
              "agent_username",
              "agent_name",
              "target_agent",
              "target_username",
              "recipient",
              "requester",
              "follow_target",
              "followed_agent",
              "author_username",
          }


          # Keys that are safe when used as explicit external identity
          SAFE_AUTHOR_KEYS = {
              "author_username",
              "agent_username",
              "target_username",
              "target_agent",
              "follow_target",
              "followed_agent",
          }


          # Keys which can explicitly attribute an action/result
          ACTOR_KEYS = {
              "actor",
              "performed_by",
              "executed_by",
              "completed_by",
              "created_by",
              "posted_by",
              "commented_by",
              "responded_by",
              "author_username",
              "agent_username",
              "target_agent",
          }


          # ========================================================
          # REGEX
          # ========================================================

          HANDLE_RE = re.compile(
              r"(?<![A-Za-z0-9_])@([A-Za-z0-9][A-Za-z0-9_-]{1,48})"
          )

          EXPLICIT_LABEL_RE = re.compile(
              r"\b(?:agent|username|target_agent|target_username)"
              r"\s*[:=]\s*[\"']?([A-Za-z0-9][A-Za-z0-9_.-]{1,80})",
              re.IGNORECASE
          )

          UUID_RE = re.compile(
              r"\b[0-9a-fA-F]{8}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{4}-"
              r"[0-9a-fA-F]{12}\b"
          )


          # ========================================================
          # HELPERS
          # ========================================================

          def normalize_name(value):
              if value is None:
                  return None

              value = str(value).strip()

              if not value:
                  return None

              value = value.strip("\"'`")
              value = value.strip()

              if value.startswith("@"):
                  value = value[1:]

              if not value:
                  return None

              return value


          def is_nox(name):
              if not name:
                  return False

              n = normalize_name(name)

              if not n:
                  return False

              low = n.lower()

              return (
                  low == NØX_USERNAME
                  or low == NØX_NAME
                  or "nox_origin" == low
                  or low == "nøx"
                  or low == "nøx origin"
              )


          def is_rejected(name):
              if not name:
                  return True

              n = normalize_name(name)

              if not n:
                  return True

              low = n.lower().strip()

              if low in GENERIC_REJECTS:
                  return True

              if len(low) < 2:
                  return True

              # Pure UUID is not an identity.
              if UUID_RE.fullmatch(low):
                  return True

              # Avoid obvious sentence fragments.
              if len(low.split()) > 4:
                  return True

              return False


          def valid_external(name):
              n = normalize_name(name)

              if not n:
                  return None

              if is_rejected(n):
                  return None

              if is_nox(n):
                  return None

              return n


          def flatten(value, prefix=""):
              """
              Recursively flatten dictionaries/lists into
              (path, value) pairs.
              """

              items = []

              if isinstance(value, dict):
                  for key, val in value.items():
                      path = f"{prefix}.{key}" if prefix else str(key)
                      items.extend(flatten(val, path))

              elif isinstance(value, list):
                  for index, val in enumerate(value):
                      path = f"{prefix}[{index}]"
                      items.extend(flatten(val, path))

              else:
                  items.append((prefix, value))

              return items


          def get_context_text(entry):
              """
              Collect textual fields without treating arbitrary text
              as an identity.
              """

              chunks = []

              for key, value in flatten(entry):
                  if isinstance(value, str):
                      chunks.append(value)

              return " ".join(chunks)


          def explicit_identity_from_key(key, value):
              """
              Extract only from explicitly structured identity fields.
              """

              if not isinstance(value, (str, int)):
                  return None

              base = key.split(".")[-1]
              base = re.sub(r"\[\d+\]", "", base).lower()

              if base not in IDENTITY_KEYS:
                  return None

              return valid_external(value)


          def extract_explicit_identities(entry):
              """
              Conservative identity extraction.

              IMPORTANT:
              Arbitrary names inside prose, titles, concepts or
              publication content are NEVER considered agents.
              """

              found = set()

              # ----------------------------------------------
              # Structured fields
              # ----------------------------------------------

              for key, value in flatten(entry):

                  base = key.split(".")[-1]
                  base = re.sub(r"\[\d+\]", "", base).lower()

                  if base in IDENTITY_KEYS:

                      candidate = explicit_identity_from_key(key, value)

                      if candidate:
                          found.add(candidate)


              # ----------------------------------------------
              # Explicit @handles
              # ----------------------------------------------

              context = get_context_text(entry)

              for match in HANDLE_RE.findall(context):

                  candidate = valid_external(match)

                  if candidate:
                      found.add(candidate)


              # ----------------------------------------------
              # Explicit identity labels
              # ----------------------------------------------

              for match in EXPLICIT_LABEL_RE.findall(context):

                  candidate = valid_external(match)

                  if candidate:
                      found.add(candidate)


              # ----------------------------------------------
              # Explicit UUID + structured identity
              #
              # UUID alone is NOT enough.
              # ----------------------------------------------

              has_uuid = bool(UUID_RE.search(context))

              if has_uuid:

                  for key, value in flatten(entry):

                      base = key.split(".")[-1]
                      base = re.sub(r"\[\d+\]", "", base).lower()

                      if base in IDENTITY_KEYS:

                          candidate = explicit_identity_from_key(
                              key,
                              value
                          )

                          if candidate:
                              found.add(candidate)


              return sorted(found, key=str.lower)


          def is_interaction(entry):
              """
              Interaction means NØX had an identifiable relationship
              with the external agent.

              Interaction alone is NOT behavioral evidence.
              """

              context = get_context_text(entry).lower()

              interaction_terms = [
                  "follow",
                  "following",
                  "followed",
                  "comment",
                  "commented",
                  "reply",
                  "replied",
                  "response",
                  "responded",
                  "interaction",
                  "message",
                  "dm",
                  "direct message",
                  "mention",
                  "mentioned",
              ]

              return any(term in context for term in interaction_terms)


          def explicit_behavioral_evidence(entry):
              """
              Behavioral evidence requires an explicit evidence/
              behavior/result structure.

              Merely mentioning an agent is NOT evidence.
              """

              if not isinstance(entry, dict):
                  return False

              evidence_keys = {
                  "evidence",
                  "behavior",
                  "behaviour",
                  "behavioral_evidence",
                  "observed_behavior",
                  "observed_behaviour",
                  "capability_evidence",
                  "proof",
                  "result_evidence",
              }

              for key, value in flatten(entry):

                  base = key.split(".")[-1]
                  base = re.sub(r"\[\d+\]", "", base).lower()

                  if base in evidence_keys:

                      if value not in (None, "", [], {}):
                          return True

              return False


          def explicit_agent_attribution(entry, agent):
              """
              Determines whether the behavioral/result data is
              explicitly attributed to this agent.
              """

              target = normalize_name(agent)

              if not target:
                  return False

              low_target = target.lower()

              # ----------------------------------------------
              # Structured actor fields
              # ----------------------------------------------

              for key, value in flatten(entry):

                  base = key.split(".")[-1]
                  base = re.sub(r"\[\d+\]", "", base).lower()

                  if base in ACTOR_KEYS:

                      if isinstance(value, str):

                          normalized = normalize_name(value)

                          if normalized and normalized.lower() == low_target:
                              return True

                          if normalized and normalized.lower().lstrip("@") == low_target.lstrip("@"):
                              return True

              # ----------------------------------------------
              # Explicit handle attribution
              # ----------------------------------------------

              context = get_context_text(entry)

              handle = "@" + low_target.lstrip("@")

              if handle in context.lower():

                  # Handle is enough for attribution only when
                  # behavioral/result context exists.
                  return True

              return False


          def result_for_agent(entry, agent):
              """
              Detect SUCCESS / FAILURE only when the result is
              explicitly connected to the agent.
              """

              context = get_context_text(entry).lower()

              if not explicit_agent_attribution(entry, agent):
                  return None

              success_terms = [
                  "success",
                  "successful",
                  "succeeded",
                  "completed successfully",
                  "passed",
                  "completed",
              ]

              failure_terms = [
                  "failure",
                  "failed",
                  "error",
                  "rejected",
                  "unsuccessful",
                  "did not succeed",
              ]

              if any(term in context for term in success_terms):
                  return "SUCCESS"

              if any(term in context for term in failure_terms):
                  return "FAILURE"

              return None


          def domain_for_entry(entry):
              if isinstance(entry, dict):

                  for key in (
                      "domain",
                      "topic",
                      "category",
                      "area",
                  ):

                      value = entry.get(key)

                      if isinstance(value, str) and value.strip():
                          return value.strip()

              return "general"


          def stable_claim_id(entry):
              """
              Prefer the ACT17 claim_id.
              Otherwise create a deterministic ID.
              """

              if isinstance(entry, dict):

                  claim_id = entry.get("claim_id")

                  if claim_id:
                      return str(claim_id)

              raw = json.dumps(
                  entry,
                  sort_keys=True,
                  ensure_ascii=False
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()[:20]


          def evidence_depth(entry):
              """
              Estimate evidence depth conservatively.
              """

              depth = 0

              if not isinstance(entry, dict):
                  return 0

              for key in (
                  "evidence",
                  "sources",
                  "confirmations",
                  "contradictions",
                  "result",
                  "outcome",
              ):

                  if key in entry:

                      value = entry[key]

                      if value not in (None, "", [], {}):
                          depth += 1

              return min(depth, 4)


          # ========================================================
          # LOAD ACT17
          # ========================================================

          if not INPUT.exists():
              raise SystemExit(
                  f"ERROR: Missing ACT17 memory: {INPUT}"
              )

          with INPUT.open(
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          knowledge = data.get("knowledge", [])

          if not isinstance(knowledge, list):
              raise SystemExit(
                  "ERROR: ACT17 knowledge is not a list."
              )


          # ========================================================
          # PROFILE STRUCTURE
          # ========================================================

          profiles = defaultdict(
              lambda: {
                  "agent": None,
                  "domains": set(),

                  "identity_observations": 0,
                  "interaction_observations": 0,
                  "behavioral_evidence_observations": 0,
                  "result_observations": 0,

                  "successful_observations": 0,
                  "failed_observations": 0,

                  "corroborated_observations": 0,
                  "contradicted_observations": 0,

                  "claim_ids": set(),

                  "observations": [],
              }
          )


          observation_records = []

          agent_set = set()


          counters = {
              "IDENTITY": 0,
              "INTERACTION": 0,
              "BEHAVIORAL_EVIDENCE": 0,
              "RESULT": 0,
              "SUCCESS": 0,
              "FAILURE": 0,
          }


          # ========================================================
          # PROCESS KNOWLEDGE
          # ========================================================

          for entry in knowledge:

              if not isinstance(entry, dict):
                  continue

              claim_id = stable_claim_id(entry)
              domain = domain_for_entry(entry)

              identities = extract_explicit_identities(entry)

              if not identities:
                  continue

              interaction = is_interaction(entry)
              behavioral = explicit_behavioral_evidence(entry)

              for agent in identities:

                  if not valid_external(agent):
                      continue

                  low = agent.lower()

                  agent_set.add(agent)

                  profile = profiles[low]

                  profile["agent"] = agent
                  profile["domains"].add(domain)
                  profile["claim_ids"].add(claim_id)

                  # ----------------------------------------------
                  # IDENTITY
                  # ----------------------------------------------

                  profile["identity_observations"] += 1
                  counters["IDENTITY"] += 1

                  observation_type = "IDENTITY"

                  # ----------------------------------------------
                  # INTERACTION
                  # ----------------------------------------------

                  if interaction:

                      profile["interaction_observations"] += 1
                      counters["INTERACTION"] += 1

                      if observation_type == "IDENTITY":
                          observation_type = "INTERACTION"

                  # ----------------------------------------------
                  # BEHAVIORAL EVIDENCE
                  # ----------------------------------------------

                  attributed_behavior = (
                      behavioral
                      and explicit_agent_attribution(
                          entry,
                          agent
                      )
                  )

                  if attributed_behavior:

                      profile[
                          "behavioral_evidence_observations"
                      ] += 1

                      counters[
                          "BEHAVIORAL_EVIDENCE"
                      ] += 1

                      observation_type = (
                          "BEHAVIORAL_EVIDENCE"
                      )

                  # ----------------------------------------------
                  # RESULT
                  # ----------------------------------------------

                  result = result_for_agent(
                      entry,
                      agent
                  )

                  if result:

                      profile[
                          "result_observations"
                      ] += 1

                      counters["RESULT"] += 1

                      if result == "SUCCESS":

                          profile[
                              "successful_observations"
                          ] += 1

                          counters["SUCCESS"] += 1

                      elif result == "FAILURE":

                          profile[
                              "failed_observations"
                          ] += 1

                          counters["FAILURE"] += 1

                      observation_type = "RESULT"

                  # ----------------------------------------------
                  # CORROBORATION / CONTRADICTION
                  # ----------------------------------------------

                  try:
                      confirmations = int(
                          entry.get(
                              "confirmations",
                              0
                          ) or 0
                      )
                  except Exception:
                      confirmations = 0

                  try:
                      contradictions = int(
                          entry.get(
                              "contradictions",
                              0
                          ) or 0
                      )
                  except Exception:
                      contradictions = 0

                  profile[
                      "corroborated_observations"
                  ] += max(
                      0,
                      confirmations
                  )

                  profile[
                      "contradicted_observations"
                  ] += max(
                      0,
                      contradictions
                  )

                  observation_records.append({
                      "agent": agent,
                      "domain": domain,
                      "claim_id": claim_id,
                      "type": observation_type,
                      "result": result,
                      "evidence_depth": evidence_depth(entry),
                  })


          # ========================================================
          # BUILD FINAL PROFILES
          # ========================================================

          final_profiles = []


          for key in sorted(
              profiles.keys(),
              key=str.lower
          ):

              profile = profiles[key]

              identity_count = (
                  profile[
                      "identity_observations"
                  ]
              )

              interaction_count = (
                  profile[
                      "interaction_observations"
                  ]
              )

              evidence_count = (
                  profile[
                      "behavioral_evidence_observations"
                  ]
              )

              result_count = (
                  profile[
                      "result_observations"
                  ]
              )

              success_count = (
                  profile[
                      "successful_observations"
                  ]
              )

              failure_count = (
                  profile[
                      "failed_observations"
                  ]
              )

              corroborated = (
                  profile[
                      "corroborated_observations"
                  ]
              )

              contradicted = (
                  profile[
                      "contradicted_observations"
                  ]
              )


              # ----------------------------------------------------
              # TRUST
              # ----------------------------------------------------

              behavioral_total = (
                  evidence_count
                  + result_count
              )


              if behavioral_total == 0:

                  trust_score = 0.0
                  trust_level = "UNKNOWN"
                  trust_basis = "IDENTITY_ONLY"

              elif evidence_count == 0 and result_count == 0:

                  trust_score = 0.0
                  trust_level = "UNKNOWN"
                  trust_basis = "INTERACTION_ONLY"

              else:

                  # Evidence quality.
                  evidence_ratio = min(
                      evidence_count / 5.0,
                      1.0
                  )

                  # Success quality.
                  success_ratio = (
                      success_count
                      / max(
                          behavioral_total,
                          1
                      )
                  )

                  # Corroboration.
                  corroboration_ratio = min(
                      corroborated / 5.0,
                      1.0
                  )

                  # Contradiction penalty.
                  contradiction_ratio = min(
                      contradicted / 5.0,
                      1.0
                  )

                  trust_score = (
                      evidence_ratio * 0.45
                      + success_ratio * 0.30
                      + corroboration_ratio * 0.15
                      - contradiction_ratio * 0.25
                  )

                  trust_score = max(
                      0.0,
                      min(
                          1.0,
                          trust_score
                      )
                  )

                  # Require real evidence for trust.
                  if (
                      evidence_count >= 3
                      and success_count >= 2
                      and trust_score >= 0.75
                  ):

                      trust_level = "HIGH"

                  elif (
                      evidence_count >= 2
                      and trust_score >= 0.55
                  ):

                      trust_level = "MEDIUM"

                  else:

                      trust_level = "LOW"

                  trust_basis = (
                      "BEHAVIORAL_EVIDENCE"
                  )


              # ----------------------------------------------------
              # DOMAIN PROFILES
              # ----------------------------------------------------

              domains = sorted(
                  profile["domains"]
              )


              # ----------------------------------------------------
              # PROFILE
              # ----------------------------------------------------

              final_profiles.append({
                  "agent": profile["agent"],

                  "domains": domains,

                  "identity_observations":
                      identity_count,

                  "interaction_observations":
                      interaction_count,

                  "behavioral_evidence_observations":
                      evidence_count,

                  "result_observations":
                      result_count,

                  "successful_observations":
                      success_count,

                  "failed_observations":
                      failure_count,

                  "corroborated_observations":
                      corroborated,

                  "contradicted_observations":
                      contradicted,

                  "claim_count":
                      len(
                          profile["claim_ids"]
                      ),

                  "trust_score":
                      round(
                          trust_score,
                          3
                      ),

                  "trust_level":
                      trust_level,

                  "trust_basis":
                      trust_basis,
              })


          # ========================================================
          # COUNTS
          # ========================================================

          high_count = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "HIGH"
          )

          medium_count = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "MEDIUM"
          )

          low_count = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "LOW"
          )

          unknown_count = sum(
              1
              for p in final_profiles
              if p["trust_level"] == "UNKNOWN"
          )


          # ========================================================
          # DOMAIN SUMMARY
          # ========================================================

          domain_summary = defaultdict(
              lambda: {
                  "agents": set(),
                  "observations": 0,
                  "behavioral_evidence": 0,
                  "results": 0,
                  "successes": 0,
                  "failures": 0,
              }
          )


          for observation in observation_records:

              domain = observation["domain"]
              agent = observation["agent"]

              d = domain_summary[domain]

              d["agents"].add(agent)
              d["observations"] += 1

              if observation["type"] in (
                  "BEHAVIORAL_EVIDENCE",
                  "RESULT"
              ):
                  d["behavioral_evidence"] += 1

              if observation["type"] == "RESULT":
                  d["results"] += 1

              if observation["result"] == "SUCCESS":
                  d["successes"] += 1

              if observation["result"] == "FAILURE":
                  d["failures"] += 1


          final_domains = {}

          for domain in sorted(
              domain_summary.keys()
          ):

              d = domain_summary[domain]

              final_domains[domain] = {
                  "agent_count":
                      len(d["agents"]),

                  "observation_count":
                      d["observations"],

                  "behavioral_evidence":
                      d["behavioral_evidence"],

                  "results":
                      d["results"],

                  "successes":
                      d["successes"],

                  "failures":
                      d["failures"],
              }


          # ========================================================
          # VALIDATION
          # ========================================================

          validation_errors = []


          # --------------------------------------------------------
          # Required fields
          # --------------------------------------------------------

          required_profile_keys = {
              "agent",
              "domains",
              "identity_observations",
              "interaction_observations",
              "behavioral_evidence_observations",
              "result_observations",
              "successful_observations",
              "failed_observations",
              "corroborated_observations",
              "contradicted_observations",
              "claim_count",
              "trust_score",
              "trust_level",
              "trust_basis",
          }


          for profile in final_profiles:

              missing = (
                  required_profile_keys
                  - set(profile.keys())
              )

              if missing:

                  validation_errors.append(
                      f"Missing fields for "
                      f"{profile.get('agent')}: "
                      f"{sorted(missing)}"
                  )


          # --------------------------------------------------------
          # No NØX
          # --------------------------------------------------------

          for profile in final_profiles:

              if is_nox(
                  profile["agent"]
              ):

                  validation_errors.append(
                      "NØX detected in external profiles."
                  )


          # --------------------------------------------------------
          # No generic labels
          # --------------------------------------------------------

          for profile in final_profiles:

              if is_rejected(
                  profile["agent"]
              ):

                  validation_errors.append(
                      "Rejected agent label present: "
                      + str(profile["agent"])
                  )


          # --------------------------------------------------------
          # Valid trust levels
          # --------------------------------------------------------

          valid_levels = {
              "HIGH",
              "MEDIUM",
              "LOW",
              "UNKNOWN",
          }


          for profile in final_profiles:

              if profile["trust_level"] not in valid_levels:

                  validation_errors.append(
                      "Invalid trust level for "
                      + str(profile["agent"])
                  )


          # --------------------------------------------------------
          # Score range
          # --------------------------------------------------------

          for profile in final_profiles:

              score = profile["trust_score"]

              if not (
                  isinstance(score, (int, float))
                  and 0.0 <= score <= 1.0
              ):

                  validation_errors.append(
                      "Invalid trust score for "
                      + str(profile["agent"])
                  )


          # --------------------------------------------------------
          # Identity-only MUST remain UNKNOWN
          # --------------------------------------------------------

          for profile in final_profiles:

              behavioral_total = (
                  profile[
                      "behavioral_evidence_observations"
                  ]
                  +
                  profile[
                      "result_observations"
                  ]
              )

              if behavioral_total == 0:

                  if profile["trust_level"] != "UNKNOWN":

                      validation_errors.append(
                          "Identity-only profile "
                          "has non-UNKNOWN trust: "
                          + str(profile["agent"])
                      )

                  if profile["trust_score"] != 0.0:

                      validation_errors.append(
                          "Identity-only profile "
                          "has non-zero trust: "
                          + str(profile["agent"])
                      )


          # --------------------------------------------------------
          # Interaction-only MUST NOT receive trust
          # --------------------------------------------------------

          for profile in final_profiles:

              if (
                  profile[
                      "interaction_observations"
                  ] > 0
                  and
                  profile[
                      "behavioral_evidence_observations"
                  ] == 0
                  and
                  profile[
                      "result_observations"
                  ] == 0
              ):

                  if profile["trust_score"] != 0.0:

                      validation_errors.append(
                          "Interaction-only profile "
                          "has non-zero trust: "
                          + str(profile["agent"])
                      )

                  if profile["trust_level"] != "UNKNOWN":

                      validation_errors.append(
                          "Interaction-only profile "
                          "is not UNKNOWN: "
                          + str(profile["agent"])
                      )


          # --------------------------------------------------------
          # Success/failure cannot exceed results
          # --------------------------------------------------------

          for profile in final_profiles:

              if (
                  profile[
                      "successful_observations"
                  ]
                  +
                  profile[
                      "failed_observations"
                  ]
                  >
                  profile[
                      "result_observations"
                  ]
              ):

                  validation_errors.append(
                      "Result accounting invalid for "
                      + str(profile["agent"])
                  )


          # --------------------------------------------------------
          # Behavioral evidence must be smaller than or equal
          # to total identity observations.
          # --------------------------------------------------------

          for profile in final_profiles:

              if (
                  profile[
                      "behavioral_evidence_observations"
                  ]
                  >
                  profile[
                      "identity_observations"
                  ]
              ):

                  validation_errors.append(
                      "Behavioral evidence exceeds "
                      "identity observations for "
                      + str(profile["agent"])
                  )


          # ========================================================
          # FINAL MEMORY
          # ========================================================

          output = {

              "version": VERSION,

              "generated_at": NOW,

              "source": {
                  "file": str(INPUT),
                  "knowledge_entries_processed": len(knowledge),
              },

              "methodology": {

                  "principle":
                      "IDENTITY -> INTERACTION -> "
                      "BEHAVIORAL_EVIDENCE -> RESULT -> TRUST",

                  "identity_is_not_trust":
                      True,

                  "interaction_is_not_evidence":
                      True,

                  "karma_used":
                      False,

                  "post_count_used":
                      False,

                  "follower_count_used":
                      False,

                  "gemini_used":
                      False,

                  "external_api_used":
                      False,

                  "cost":
                      "€0",

                  "nox_excluded":
                      True,

                  "arbitrary_prose_names_rejected":
                      True,
              },

              "statistics": {

                  "knowledge_entries":
                      len(knowledge),

                  "identity_observations":
                      counters["IDENTITY"],

                  "interaction_observations":
                      counters["INTERACTION"],

                  "behavioral_evidence_observations":
                      counters[
                          "BEHAVIORAL_EVIDENCE"
                      ],

                  "result_observations":
                      counters["RESULT"],

                  "successful_results":
                      counters["SUCCESS"],

                  "failed_results":
                      counters["FAILURE"],

                  "external_agents":
                      len(agent_set),

                  "agent_profiles":
                      len(final_profiles),

                  "HIGH":
                      high_count,

                  "MEDIUM":
                      medium_count,

                  "LOW":
                      low_count,

                  "UNKNOWN":
                      unknown_count,
              },

              "agents":
                  sorted(
                      agent_set,
                      key=str.lower
                  ),

              "profiles":
                  final_profiles,

              "domains":
                  final_domains,

              "observations":
                  observation_records,

              "validation": {

                  "status":
                      "PASS"
                      if not validation_errors
                      else "FAIL",

                  "errors":
                      validation_errors,
              },

              "last_run": NOW,
          }


          # ========================================================
          # WRITE
          # ========================================================

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with OUTPUT.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ========================================================
          # TERMINAL SUMMARY
          # ========================================================

          print("")
          print("================================================")
          print("NØX ACT 18 - REPUTATION & TRUST")
          print("================================================")
          print("")
          print(
              f"Knowledge entries processed: "
              f"{len(knowledge)}"
          )

          print("")
          print("ACT18 BUILD COMPLETE")
          print(
              f"Identity observations: "
              f"{counters['IDENTITY']}"
          )

          print(
              f"Interaction-only observations: "
              f"{counters['INTERACTION']}"
          )

          print(
              f"Behavioral evidence observations: "
              f"{counters['BEHAVIORAL_EVIDENCE']}"
          )

          print(
              f"Result observations: "
              f"{counters['RESULT']}"
          )

          print(
              f"Successful results: "
              f"{counters['SUCCESS']}"
          )

          print(
              f"Failed results: "
              f"{counters['FAILURE']}"
          )

          print(
              f"External agents detected: "
              f"{len(agent_set)}"
          )

          print(
              f"Agent/domain profiles: "
              f"{len(final_profiles)}"
          )

          print(
              f"HIGH: {high_count}"
          )

          print(
              f"MEDIUM: {medium_count}"
          )

          print(
              f"LOW: {low_count}"
          )

          print(
              f"UNKNOWN: {unknown_count}"
          )

          print("")
          print(
              f"Output: {OUTPUT}"
          )

          print(
              f"Output size: "
              f"{OUTPUT.stat().st_size} bytes"
          )

          print("")

          if validation_errors:

              print("VALIDATION: FAIL")

              for error in validation_errors:
                  print(
                      " - " + error
                  )

              raise SystemExit(
                  1
              )

          else:

              print("VALIDATION: PASS")

          print("")
          print("ACT18 BUILD FINISHED")
          PY


      # ============================================================
      # 3. DISPLAY IMPORTANT RESULTS
      # ============================================================

      - name: Display ACT18 validation summary
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "memory/nox_reputation_trust.json"
          )

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          stats = data.get(
              "statistics",
              {}
          )

          validation = data.get(
              "validation",
              {}
          )

          print("")
          print("================================================")
          print("ACT18 FINAL SUMMARY")
          print("================================================")
          print("")

          for key in (
              "knowledge_entries",
              "identity_observations",
              "interaction_observations",
              "behavioral_evidence_observations",
              "result_observations",
              "successful_results",
              "failed_results",
              "external_agents",
              "agent_profiles",
              "HIGH",
              "MEDIUM",
              "LOW",
              "UNKNOWN",
          ):

              print(
                  f"{key}: "
                  f"{stats.get(key, 0)}"
              )

          print("")
          print(
              "VALIDATION: "
              + str(
                  validation.get(
                      "status",
                      "UNKNOWN"
                  )
              )
          )

          print("")

          if validation.get("errors"):
              for error in validation["errors"]:
                  print(
                      "ERROR: "
                      + str(error)
                  )

          print("")

          print("EXTERNAL AGENTS:")

          for agent in data.get(
              "agents",
              []
          ):

              print(
                  f" - {agent}"
              )

          print("")
          print("================================================")
          PY


      # ============================================================
      # 4. COMMIT + SAFE REBASE + PUSH
      # ============================================================

      - name: Commit ACT18 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 memory changes to commit."
          else

            git commit -m "NØX ACT18 V1.6 - separate identity interaction evidence"

            echo "Synchronizing with remote main..."

            git fetch origin main

            git rebase origin/main

            echo "Pushing ACT18..."

            git push origin HEAD:main

          fi

          echo ""
          echo "NØX ACT18 V1.6 COMPLETE"
