          )
          print(
              "Interaction-only observations:",
              stats["interaction_only_observations"]
          )
          print(
              "Successful evidence:",
              stats["successful_evidence_observations"]
          )
          print(
              "Failed evidence:",
              stats["failed_evidence_observations"]
          )
          print(
              "HIGH:",
              stats["high_trust_profiles"]
          )
          print(
              "MEDIUM:",
              stats["medium_trust_profiles"]
          )
          print(
              "LOW:",
              stats["low_trust_profiles"]
          )
          print(
              "UNKNOWN:",
              stats["unknown_trust_profiles"]
          )
          print("================================================")

          PY

