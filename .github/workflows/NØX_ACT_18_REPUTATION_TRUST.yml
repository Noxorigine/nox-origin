name: NØX ACT 18 - Reputation & Trust Core

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nox-act18-reputation-trust
  cancel-in-progress: false

jobs:
  reputation-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ACT18 Reputation & Trust Core
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================================"
          echo "NØX ACT18 — REPUTATION & TRUST CORE"
          echo "================================================================"

          python3 <<'PY'
          import json
          import os
          import re
          from collections import defaultdict
          from datetime import datetime, timezone

          INPUT_FILE = "memory/nox_knowledge_core.json"
          OUTPUT_FILE = "memory/nox_reputation_trust.json"

          # ============================================================
          # BASIC HELPERS
          # ============================================================

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def normalize_text(value):
              if not isinstance(value, str):
                  return ""
              return re.sub(r"\s+", " ", value.strip())

          def safe_float(value, default=0.0):
              try:
                  return float(value)
              except Exception:
                  return default

          def safe_int(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def clamp(value, minimum=0.0, maximum=1.0):
              try:
                  value = float(value)
              except Exception:
                  value = minimum
              return max(minimum, min(maximum, value))

          # ============================================================
          # IDENTITY SAFETY
          #
          # ACT18 MUST NOT assign reputation to NØX itself.
          # ACT18 MUST NOT infer an agent from arbitrary sentences.
          # ============================================================

          NOX_IDENTITIES = {
              "nox",
              "nox_origin",
              "nox origine",
              "nøx origin",
              "nøx origine",
              "nox-origin",
              "nøx-origin",
              "noxorigin",
              "@nox_origin",
              "@nox_origine",
              "@noxorigine",
              "@nøxorigin",
              "nøxorigin",
          }

          # NØX UUID from The Colony.
          NOX_UUID = "442104b5-eee0-4f73-b452-08f258a21ea2"

          UUID_RE = re.compile(
              r"^[0-9a-f]{8}-"
              r"[0-9a-f]{4}-"
              r"[0-9a-f]{4}-"
              r"[0-9a-f]{4}-"
              r"[0-9a-f]{12}$",
              re.IGNORECASE,
          )

          VERSION_RE = re.compile(
              r"^v\d+(?:\.\d+)*$",
              re.IGNORECASE,
          )

          DATE_RE = re.compile(
              r"^\d{4}-\d{2}-\d{2}"
          )

          URL_RE = re.compile(
              r"^(https?://|www\.)",
              re.IGNORECASE,
          )

          # Technical/event vocabulary that must never become an identity.
          SYSTEM_TERMS = {
              "proposal",
              "evidence",
              "audit",
              "research",
              "learning",
              "opportunity",
              "detection",
              "marketplace",
              "community",
              "autonomous",
              "observation",
              "reflection",
              "verification",
              "knowledge",
              "memory",
              "signal",
              "strategy",
              "decision",
              "synthesis",
              "priority",
              "analysis",
              "monitor",
              "monitoring",
              "evaluation",
              "performance",
              "corroboration",
              "contradiction",
              "delegation",
              "generic task vocabulary",
          }

          def normalize_identity(value):
              if not isinstance(value, str):
                  return ""

              value = normalize_text(value)

              if not value:
                  return ""

              # Remove common handle prefix.
              value = value.lstrip("@").strip()

              return value

          def identity_key(value):
              """
              Canonical comparison key.

              This is intentionally conservative.
              """

              value = normalize_identity(value)

              value = value.lower()

              value = value.replace("ø", "o")
              value = value.replace("-", "_")
              value = re.sub(r"\s+", "_", value)

              return value

          def is_nox_identity(value):
              """
              Detect NØX in many representations, including serialized
              structures such as {'username': 'nox_origine'}.
              """

              if not isinstance(value, str):
                  return False

              raw = normalize_text(value)
              key = identity_key(raw)

              if key in {
                  "nox",
                  "nox_origin",
                  "nox_origine",
                  "nox_origine",
                  "noxorigin",
              }:
                  return True

              # Explicit NØX UUID.
              if NOX_UUID.lower() in raw.lower():
                  return True

              # Serialized identity objects.
              if (
                  "nox_origine" in raw.lower()
                  or '"username": "nox_origine"' in raw.lower()
                  or "'username': 'nox_origine'" in raw.lower()
              ):
                  return True

              if (
                  "nøx origin" in raw.lower()
                  or "nox origin" in raw.lower()
              ):
                  return True

              return False

          # ============================================================
          # STRICT AGENT CANDIDATE VALIDATION
          # ============================================================

          def is_valid_agent_candidate(value):
              """
              Only accept short, identity-like values.

              We deliberately reject free-form sentences, versions,
              UUIDs, dates, URLs, event descriptions and NØX.
              """

              if not isinstance(value, str):
                  return False

              value = normalize_identity(value)

              if not value:
                  return False

              if is_nox_identity(value):
                  return False

              if UUID_RE.fullmatch(value):
                  return False

              if VERSION_RE.fullmatch(value):
                  return False

              if DATE_RE.match(value):
                  return False

              if URL_RE.match(value):
                  return False

              if value.startswith("{") or value.startswith("["):
                  return False

              # Agent names should be reasonably short.
              if len(value) > 50:
                  return False

              # Reject sentences.
              if value.count(" ") > 4:
                  return False

              # Reject punctuation-heavy prose.
              if value.endswith("."):
                  return False

              # Must contain alphabetic characters.
              if not re.search(r"[A-Za-zÀ-ÿ]", value):
                  return False

              # Reject obvious system terms.
              words = set(
                  re.findall(
                      r"[a-z0-9_-]+",
                      value.lower()
                  )
              )

              if words.intersection(SYSTEM_TERMS):
                  return False

              # Reject obvious long machine identifiers.
              if re.fullmatch(
                  r"[A-Za-z0-9_-]{18,}",
                  value
              ):
                  return False

              return True

          # ============================================================
          # STRONG AGENT DETECTION
          #
          # IMPORTANT:
          # We DO NOT treat arbitrary information text as an agent.
          #
          # We only accept:
          #   - explicit agent fields
          #   - explicit source/author structures
          #   - compact fields that look exactly like handles/names
          #
          # Free-form evidence sentences are ignored.
          # ============================================================

          def extract_agent(entry):

              strong_candidates = []

              # --------------------------------------------------------
              # 1. Explicit top-level identity fields.
              # --------------------------------------------------------

              for key in (
                  "agent",
                  "agent_name",
                  "source_agent",
                  "source_agent_name",
                  "author",
                  "author_name",
              ):
                  value = entry.get(key)

                  if isinstance(value, str):
                      strong_candidates.append(value)

              # --------------------------------------------------------
              # 2. Structured source object.
              # --------------------------------------------------------

              source = entry.get("source")

              if isinstance(source, dict):
                  for key in (
                      "agent",
                      "agent_name",
                      "username",
                      "name",
                      "display_name",
                      "author",
                  ):
                      value = source.get(key)

                      if isinstance(value, str):
                          strong_candidates.append(value)

              # --------------------------------------------------------
              # 3. Structured author object.
              # --------------------------------------------------------

              author = entry.get("author")

              if isinstance(author, dict):
                  for key in (
                      "username",
                      "name",
                      "display_name",
                      "agent",
                      "agent_name",
                  ):
                      value = author.get(key)

                      if isinstance(value, str):
                          strong_candidates.append(value)

              # --------------------------------------------------------
              # 4. Compact ACT17 information.
              #
              # We DO NOT accept arbitrary fields anymore.
              #
              # Only values that look like an identity are considered.
              # --------------------------------------------------------

              information = entry.get("information")

              if isinstance(information, str):
                  parts = [
                      normalize_text(x)
                      for x in information.split("|")
                  ]

                  # First identify whether this is the compact format.
                  if len(parts) >= 5:

                      for part in parts:

                          if not part:
                              continue

                          # Reject obvious metadata fields first.
                          if UUID_RE.fullmatch(part):
                              continue

                          if VERSION_RE.fullmatch(part):
                              continue

                          if DATE_RE.match(part):
                              continue

                          if is_nox_identity(part):
                              continue

                          # Only short identity-like candidates.
                          if is_valid_agent_candidate(part):
                              strong_candidates.append(part)

              # --------------------------------------------------------
              # 5. Deduplicate candidates.
              # --------------------------------------------------------

              seen = set()

              for candidate in strong_candidates:

                  candidate = normalize_identity(candidate)

                  if not candidate:
                      continue

                  key = identity_key(candidate)

                  if key in seen:
                      continue

                  seen.add(key)

                  if not is_valid_agent_candidate(candidate):
                      continue

                  # Never allow NØX.
                  if is_nox_identity(candidate):
                      continue

                  return candidate

              return "unknown"

          # ============================================================
          # DOMAIN EXTRACTION
          # ============================================================

          VALID_DOMAINS = {
              "virtual_economy",
              "cybersecurity",
              "ai_communities",
              "agent_intelligence_and_autonomy",
              "emerging_technologies_and_opportunities",
              "general",
          }

          def extract_domain(entry):

              domain = entry.get("domain")

              if isinstance(domain, str):
                  domain = domain.strip()

                  if domain in VALID_DOMAINS:
                      return domain

              information = normalize_text(
                  entry.get("information", "")
              ).lower()

              scores = defaultdict(int)

              keyword_map = {
                  "virtual_economy": [
                      "marketplace",
                      "opportunity",
                      "work request",
                      "task",
                      "payment",
                      "economy",
                      "bidding",
                      "offer",
                      "delegation",
                  ],

                  "cybersecurity": [
                      "cyber",
                      "security",
                      "authentication",
                      "credential",
                      "attack",
                      "vulnerability",
                      "privacy",
                  ],

                  "ai_communities": [
                      "community",
                      "agent community",
                      "colony",
                      "discussion",
                      "collaboration",
                  ],

                  "agent_intelligence_and_autonomy": [
                      "autonomy",
                      "autonomous",
                      "agent",
                      "reasoning",
                      "learning",
                      "decision",
                      "intelligence",
                  ],

                  "emerging_technologies_and_opportunities": [
                      "emerging",
                      "technology",
                      "innovation",
                      "new technology",
                  ],
              }

              for domain, keywords in keyword_map.items():

                  for keyword in keywords:

                      if keyword in information:
                          scores[domain] += 1

              if not scores:
                  return "general"

              return max(
                  scores,
                  key=scores.get
              )

          # ============================================================
          # EVIDENCE
          # ============================================================

          def has_evidence(entry):

              evidence = entry.get("evidence")

              if isinstance(evidence, list):
                  if any(
                      normalize_text(x)
                      for x in evidence
                  ):
                      return True

              if isinstance(evidence, str):
                  if normalize_text(evidence):
                      return True

              for key in (
                  "source_url",
                  "source_id",
                  "reference",
                  "reference_id",
                  "post_id",
              ):
                  value = entry.get(key)

                  if isinstance(value, str):
                      if normalize_text(value):
                          return True

              # Compact ACT17 structure.
              information = normalize_text(
                  entry.get("information", "")
              )

              if "|" in information:

                  parts = [
                      normalize_text(x)
                      for x in information.split("|")
                      if normalize_text(x)
                  ]

                  # A sufficiently structured ACT17 record is evidence.
                  if len(parts) >= 5:
                      return True

              return False

          # ============================================================
          # LOAD ACT17
          # ============================================================

          if not os.path.exists(INPUT_FILE):
              raise SystemExit(
                  f"Missing required input file: {INPUT_FILE}"
              )

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          knowledge = data.get(
              "knowledge",
              []
          )

          if not isinstance(knowledge, list):
              raise SystemExit(
                  "ACT17 knowledge field is not a list."
              )

          # ============================================================
          # AGGREGATION
          # ============================================================

          profiles = defaultdict(
              lambda: {
                  "observations": 0,
                  "evidence": 0,
                  "corroborations": 0,
                  "contradictions": 0,
                  "confidence_sum": 0.0,
                  "usefulness_sum": 0.0,
                  "claims": [],
              }
          )

          contradiction_by_claim = defaultdict(int)

          contradictions = data.get(
              "contradictions",
              []
          )

          if isinstance(
              contradictions,
              list
          ):

              for item in contradictions:

                  if not isinstance(item, dict):
                      continue

                  claim_id = item.get(
                      "claim_id"
                  )

                  if claim_id:
                      contradiction_by_claim[
                          str(claim_id)
                      ] += 1

          identified_count = 0
          rejected_unknown_count = 0
          rejected_nox_count = 0

          for entry in knowledge:

              if not isinstance(entry, dict):
                  continue

              agent = extract_agent(entry)

              # --------------------------------------------------------
              # Unknown = do not build a reputation profile.
              # --------------------------------------------------------

              if agent == "unknown":
                  rejected_unknown_count += 1
                  continue

              # --------------------------------------------------------
              # Absolute NØX protection.
              # --------------------------------------------------------

              if is_nox_identity(agent):
                  rejected_nox_count += 1
                  continue

              identified_count += 1

              domain = extract_domain(entry)

              key = (
                  agent,
                  domain
              )

              profile = profiles[key]

              profile["observations"] += 1

              confidence = clamp(
                  safe_float(
                      entry.get(
                          "confidence",
                          0.32
                      ),
                      0.32
                  )
              )

              usefulness = clamp(
                  safe_float(
                      entry.get(
                          "operational_usefulness",
                          0
                      ),
                      0
                  ) / 10.0
              )

              profile["confidence_sum"] += (
                  confidence
              )

              profile["usefulness_sum"] += (
                  usefulness
              )

              if has_evidence(entry):
                  profile["evidence"] += 1

              claim_id = str(
                  entry.get(
                      "claim_id",
                      ""
                  )
              )

              if claim_id:
                  profile["claims"].append(
                      claim_id
                  )

              confirmations = safe_int(
                  entry.get(
                      "confirmations",
                      0
                  ),
                  0
              )

              if entry.get(
                  "status"
              ) == "CORROBORATED":

                  profile[
                      "corroborations"
                  ] += 1

              elif confirmations > 0:

                  profile[
                      "corroborations"
                  ] += min(
                      confirmations,
                      3
                  )

              contradiction_count = (
                  contradiction_by_claim.get(
                      claim_id,
                      0
                  )
              )

              profile[
                  "contradictions"
              ] += contradiction_count

              entry_contradictions = (
                  entry.get(
                      "contradictions"
                  )
              )

              if isinstance(
                  entry_contradictions,
                  list
              ):
                  profile[
                      "contradictions"
                  ] += len(
                      entry_contradictions
                  )

          # ============================================================
          # TRUST CALCULATION
          # ============================================================

          def calculate_profile(profile):

              observations = (
                  profile["observations"]
              )

              if observations <= 0:

                  return {
                      "trust_score": 0.0,
                      "trust_level": "UNKNOWN",
                      "avg_confidence": 0.0,
                      "evidence_ratio": 0.0,
                      "corroboration_ratio": 0.0,
                      "avg_operational_usefulness": 0.0,
                      "contradiction_penalty": 1.0,
                  }

              avg_confidence = (
                  profile[
                      "confidence_sum"
                  ]
                  / observations
              )

              evidence_ratio = (
                  profile[
                      "evidence"
                  ]
                  / observations
              )

              corroboration_ratio = clamp(
                  profile[
                      "corroborations"
                  ]
                  / max(
                      1,
                      observations
                  )
              )

              avg_usefulness = (
                  profile[
                      "usefulness_sum"
                  ]
                  / observations
              )

              base_score = (
                  avg_confidence * 0.40
                  + evidence_ratio * 0.25
                  + corroboration_ratio * 0.15
                  + avg_usefulness * 0.20
              )

              contradiction_ratio = (
                  profile[
                      "contradictions"
                  ]
                  / max(
                      1,
                      observations
                  )
              )

              contradiction_penalty = clamp(
                  1.0
                  - min(
                      0.50,
                      contradiction_ratio
                      * 0.10
                  )
              )

              trust_score = clamp(
                  base_score
                  * contradiction_penalty
              )

              if observations < 2:

                  trust_level = (
                      "INSUFFICIENT"
                  )

              elif (
                  trust_score >= 0.75
                  and profile[
                      "contradictions"
                  ] == 0
              ):

                  trust_level = "STRONG"

              elif trust_score >= 0.55:

                  trust_level = "MODERATE"

              else:

                  trust_level = "WEAK"

              return {
                  "trust_score": round(
                      trust_score,
                      4
                  ),
                  "trust_level": trust_level,
                  "avg_confidence": round(
                      avg_confidence,
                      4
                  ),
                  "evidence_ratio": round(
                      evidence_ratio,
                      4
                  ),
                  "corroboration_ratio": round(
                      corroboration_ratio,
                      4
                  ),
                  "avg_operational_usefulness": round(
                      avg_usefulness,
                      4
                  ),
                  "contradiction_penalty": round(
                      contradiction_penalty,
                      4
                  ),
              }

          # ============================================================
          # BUILD DOMAIN PROFILES
          # ============================================================

          agent_domain_profiles = {}

          for (
              agent,
              domain
          ), profile in sorted(
              profiles.items(),
              key=lambda item: (
                  item[0][0].lower(),
                  item[0][1],
              )
          ):

              metrics = calculate_profile(
                  profile
              )

              if agent not in agent_domain_profiles:
                  agent_domain_profiles[
                      agent
                  ] = {}

              agent_domain_profiles[
                  agent
              ][domain] = {
                  **metrics,
                  "observations": profile[
                      "observations"
                  ],
                  "evidence": profile[
                      "evidence"
                  ],
                  "corroborations": profile[
                      "corroborations"
                  ],
                  "contradictions": profile[
                      "contradictions"
                  ],
                  "claims": profile[
                      "claims"
                  ][-50:],
              }

          # ============================================================
          # OVERALL AGENT TRUST
          # ============================================================

          agent_summaries = {}

          for agent, domains in (
              agent_domain_profiles.items()
          ):

              weighted_score = 0.0
              total_weight = 0

              total_observations = 0
              total_evidence = 0
              total_corroborations = 0
              total_contradictions = 0

              for metrics in domains.values():

                  observations = metrics[
                      "observations"
                  ]

                  weight = min(
                      observations,
                      20
                  )

                  weighted_score += (
                      metrics[
                          "trust_score"
                      ]
                      * weight
                  )

                  total_weight += weight

                  total_observations += (
                      observations
                  )

                  total_evidence += (
                      metrics[
                          "evidence"
                      ]
                  )

                  total_corroborations += (
                      metrics[
                          "corroborations"
                      ]
                  )

                  total_contradictions += (
                      metrics[
                          "contradictions"
                      ]
                  )

              if total_weight > 0:

                  overall_score = (
                      weighted_score
                      / total_weight
                  )

              else:

                  overall_score = 0.0

              if (
                  total_observations >= 10
                  and overall_score >= 0.75
              ):

                  overall_level = "HIGH"

              elif (
                  total_observations >= 5
                  and overall_score >= 0.55
              ):

                  overall_level = "MEDIUM"

              elif total_observations >= 2:

                  overall_level = "LOW"

              else:

                  overall_level = "UNKNOWN"

              agent_summaries[
                  agent
              ] = {
                  "trust_score": round(
                      overall_score,
                      4
                  ),
                  "trust_level": overall_level,
                  "observations": total_observations,
                  "evidence": total_evidence,
                  "corroborations": total_corroborations,
                  "contradictions": total_contradictions,
                  "domains": domains,
              }

          # ============================================================
          # POLICY
          # ============================================================

          decision_policy = {

              "purpose": (
                  "Build domain-specific reputation and trust "
                  "from observed external agents."
              ),

              "principles": [
                  "Trust is domain-specific.",
                  "Trust is evidence-based.",
                  "Karma and post count are not trust signals.",
                  "Unknown does not mean unreliable.",
                  "Contradictions reduce trust.",
                  "Important decisions should seek corroboration.",
                  "NØX itself must never receive a reputation profile.",
                  "Free-form evidence text must never be interpreted as an agent identity.",
              ],

              "levels": {

                  "HIGH": (
                      "Strong supporting signal for significant decisions "
                      "when the relevant domain is also strong."
                  ),

                  "MEDIUM": (
                      "Useful supporting evidence; corroboration is "
                      "preferred for important decisions."
                  ),

                  "LOW": (
                      "Use cautiously and seek independent evidence."
                  ),

                  "UNKNOWN": (
                      "Do not rely on reputation; gather evidence first."
                  ),

                  "INSUFFICIENT": (
                      "Insufficient observations to establish reputation."
                  ),
              },
          }

          # ============================================================
          # STATISTICS
          # ============================================================

          total_observations = sum(
              profile[
                  "observations"
              ]
              for profile in profiles.values()
          )

          total_evidence = sum(
              profile[
                  "evidence"
              ]
              for profile in profiles.values()
          )

          total_corroborations = sum(
              profile[
                  "corroborations"
              ]
              for profile in profiles.values()
          )

          total_contradictions = sum(
              profile[
                  "contradictions"
              ]
              for profile in profiles.values()
          )

          output = {

              "version": "ACT18-V1.2",

              "purpose": (
                  "Domain-specific reputation and trust layer "
                  "for NØX Origin."
              ),

              "generated_at": now_iso(),

              "statistics": {

                  "knowledge_entries_processed": len(
                      knowledge
                  ),

                  "external_agent_observations": (
                      total_observations
                  ),

                  "unknown_observations_rejected": (
                      rejected_unknown_count
                  ),

                  "nox_observations_rejected": (
                      rejected_nox_count
                  ),

                  "agents_detected": len(
                      agent_summaries
                  ),

                  "agent_domain_profiles": len(
                      profiles
                  ),

                  "evidence": total_evidence,

                  "corroborations": (
                      total_corroborations
                  ),

                  "contradictions": (
                      total_contradictions
                  ),
              },

              "agents": agent_summaries,

              "agent_domain_profiles": (
                  agent_domain_profiles
              ),

              "decision_policy": decision_policy,

              "source": {

                  "knowledge_core": INPUT_FILE,

                  "knowledge_core_version": (
                      data.get("version")
                  ),
              },

              "last_run": now_iso(),
          }

          os.makedirs(
              "memory",
              exist_ok=True
          )

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # CONSOLE OUTPUT
          # ============================================================

          print("")
          print("ACT18 BUILD COMPLETE")
          print("----------------------------------------------------------------")
          print(
              f"Knowledge entries processed: "
              f"{len(knowledge)}"
          )
          print(
              f"External-agent observations: "
              f"{total_observations}"
          )
          print(
              f"Unknown observations rejected: "
              f"{rejected_unknown_count}"
          )
          print(
              f"NØX observations rejected: "
              f"{rejected_nox_count}"
          )
          print(
              f"Agents detected: "
              f"{len(agent_summaries)}"
          )
          print(
              f"Agent/domain profiles: "
              f"{len(profiles)}"
          )
          print(
              f"Evidence: "
              f"{total_evidence}"
          )
          print(
              f"Corroborations: "
              f"{total_corroborations}"
          )
          print(
              f"Contradictions: "
              f"{total_contradictions}"
          )

          print("")
          print("AGENT TRUST SUMMARY")
          print("----------------------------------------------------------------")

          if not agent_summaries:

              print(
                  "NO EXTERNAL AGENTS IDENTIFIED"
              )

          else:

              for agent, summary in sorted(
                  agent_summaries.items(),
                  key=lambda item: (
                      -item[1][
                          "trust_score"
                      ],
                      item[0].lower(),
                  )
              ):

                  print(
                      f"{agent}: "
                      f"{summary['trust_score']:.4f} "
                      f"[{summary['trust_level']}] "
                      f"observations={summary['observations']} "
                      f"evidence={summary['evidence']} "
                      f"corroborations={summary['corroborations']} "
                      f"contradictions={summary['contradictions']}"
                  )

          print("")
          print(
              f"Output: {OUTPUT_FILE}"
          )
          print(
              "================================================================"
          )
          PY

      - name: Commit ACT18 memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add memory/nox_reputation_trust.json

          if git diff --cached --quiet; then
            echo "No ACT18 memory changes to commit."
            exit 0
          fi

          git commit -m "NØX ACT18 Reputation Trust Core"
          git push
