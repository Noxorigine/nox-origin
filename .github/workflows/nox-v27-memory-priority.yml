name: NØX Origin - V27 Memory Priority

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memory-priority:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate memory priorities locally
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          MEMORY_FILE = Path("nox_memory.json")

          if not MEMORY_FILE.exists():
              raise SystemExit("nox_memory.json not found")

          try:
              memory = json.loads(
                  MEMORY_FILE.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(f"Invalid memory file: {exc}")

          observations = memory.get("observations", [])
          knowledge = memory.get("knowledge", [])
          patterns = memory.get("patterns", [])
          contradictions = memory.get("contradictions", [])
          history = memory.get("history", [])

          if not isinstance(observations, list):
              observations = []

          if not isinstance(knowledge, list):
              knowledge = []

          if not isinstance(patterns, list):
              patterns = []

          if not isinstance(contradictions, list):
              contradictions = []

          if not isinstance(history, list):
              history = []

          now = datetime.now(timezone.utc).isoformat()

          def clean(text):
              return re.sub(
                  r"\s+",
                  " ",
                  str(text).strip().lower()
              )

          # ---------------------------------------------------------
          # 1. Construire les thèmes récurrents
          # ---------------------------------------------------------

          topic_counts = {}

          for pattern in patterns:
              if not isinstance(pattern, dict):
                  continue

              topic = clean(pattern.get("topic", ""))

              if not topic:
                  continue

              try:
                  count = int(
                      pattern.get("signal_count", 1)
                  )
              except Exception:
                  count = 1

              topic_counts[topic] = (
                  topic_counts.get(topic, 0) + count
              )

          # ---------------------------------------------------------
          # 2. Compter les occurrences d'une connaissance
          #    dans les observations
          # ---------------------------------------------------------

          observation_texts = []

          for observation in observations:
              if not isinstance(observation, dict):
                  continue

              text = observation.get("text", "")

              if text:
                  observation_texts.append(
                      clean(text)
                  )

          # ---------------------------------------------------------
          # 3. Compter les contradictions associées
          # ---------------------------------------------------------

          def contradiction_count(text):
              value = clean(text)

              count = 0

              for item in contradictions:

                  if not isinstance(item, dict):
                      continue

                  source_a = clean(
                      item.get("source_a", "")
                  )

                  source_b = clean(
                      item.get("source_b", "")
                  )

                  if value == source_a or value == source_b:
                      count += 1

              return count

          # ---------------------------------------------------------
          # 4. Définir la priorité
          #
          # Score :
          # + récurrence
          # + présence dans les observations
          # + confiance
          # - contradictions
          #
          # La priorité n'autorise PAS encore une action.
          # ---------------------------------------------------------

          priority_results = []

          counts = {
              "critical": 0,
              "high": 0,
              "normal": 0,
              "low": 0
          }

          for index, item in enumerate(knowledge):

              if isinstance(item, str):

                  text = item

                  confidence = 0.80
                  status = "stable"

              elif isinstance(item, dict):

                  text = (
                      item.get("text")
                      or item.get("knowledge")
                      or item.get("statement")
                      or ""
                  )

                  try:
                      confidence = float(
                          item.get(
                              "confidence",
                              0.80
                          )
                      )
                  except Exception:
                      confidence = 0.80

                  status = item.get(
                      "status",
                      "stable"
                  )

              else:
                  continue

              if not text:
                  continue

              normalized = clean(text)

              # -----------------------------------------------------
              # Occurrences dans les observations
              # -----------------------------------------------------

              observation_hits = 0

              for observation_text in observation_texts:

                  words = [
                      word
                      for word in normalized.split()
                      if len(word) >= 5
                  ]

                  if not words:
                      continue

                  matches = sum(
                      1
                      for word in words
                      if word in observation_text
                  )

                  if matches >= 2:
                      observation_hits += 1

              # -----------------------------------------------------
              # Récurrence thématique
              # -----------------------------------------------------

              topic_score = 0

              for topic, count in topic_counts.items():

                  if topic and topic in normalized:
                      topic_score += min(count, 20)

              # -----------------------------------------------------
              # Contradictions
              # -----------------------------------------------------

              conflicts = contradiction_count(text)

              # -----------------------------------------------------
              # Score final
              # -----------------------------------------------------

              score = 0.0

              score += min(observation_hits * 2.0, 20.0)
              score += min(topic_score * 0.5, 15.0)
              score += confidence * 20.0
              score -= conflicts * 8.0

              # Une connaissance explicitement conflictuelle
              # ne peut pas devenir critical.
              if status == "conflicted":
                  score = min(score, 49.0)

              # -----------------------------------------------------
              # Classification prudente
              # -----------------------------------------------------

              if score >= 75:
                  priority = "critical"

              elif score >= 55:
                  priority = "high"

              elif score >= 30:
                  priority = "normal"

              else:
                  priority = "low"

              counts[priority] += 1

              priority_results.append({
                  "index": index,
                  "text": text,
                  "score": round(score, 2),
                  "priority": priority,
                  "confidence": round(
                      confidence,
                      3
                  ),
                  "status": status,
                  "observation_hits": observation_hits,
                  "topic_score": topic_score,
                  "contradictions": conflicts,
                  "evaluated_at": now,
                  "method": (
                      "local_memory_priority_v27"
                  )
              })

              # -----------------------------------------------------
              # Mise à jour de la connaissance
              # -----------------------------------------------------

              if isinstance(knowledge[index], dict):

                  knowledge[index]["priority"] = priority
                  knowledge[index]["priority_score"] = round(
                      score,
                      2
                  )
                  knowledge[index]["priority_updated_at"] = now

              else:

                  knowledge[index] = {
                      "text": text,
                      "status": status,
                      "confidence": confidence,
                      "priority": priority,
                      "priority_score": round(
                          score,
                          2
                      ),
                      "priority_updated_at": now,
                      "review_method": (
                          "local_memory_priority_v27"
                      )
                  }

          # ---------------------------------------------------------
          # 5. Trier les connaissances par importance
          #
          # IMPORTANT :
          # On ne supprime rien.
          # On ne change pas le contenu.
          # On ajoute seulement des métadonnées.
          # ---------------------------------------------------------

          priority_order = {
              "critical": 0,
              "high": 1,
              "normal": 2,
              "low": 3
          }

          indexed_knowledge = list(
              enumerate(knowledge)
          )

          indexed_knowledge.sort(
              key=lambda pair: (
                  priority_order.get(
                      pair[1].get("priority", "normal")
                      if isinstance(pair[1], dict)
                      else "normal",
                      2
                  ),
                  -(
                      pair[1].get(
                          "priority_score",
                          0
                      )
                      if isinstance(pair[1], dict)
                      else 0
                  )
              )
          )

          # ---------------------------------------------------------
          # 6. Etat global
          # ---------------------------------------------------------

          memory_priority_state = {
              "updated_at": now,
              "total": len(knowledge),
              "critical": counts["critical"],
              "high": counts["high"],
              "normal": counts["normal"],
              "low": counts["low"],
              "method": "local_memory_priority"
          }

          # ---------------------------------------------------------
          # 7. Historique V27
          # ---------------------------------------------------------

          history.append({
              "version": "V27",
              "timestamp": now,
              "knowledge_total": len(knowledge),
              "critical": counts["critical"],
              "high": counts["high"],
              "normal": counts["normal"],
              "low": counts["low"],
              "contradictions_considered": len(
                  contradictions
              ),
              "gemini_used": False,
              "cost_eur": 0,
              "method": "local_memory_priority"
          })

          # ---------------------------------------------------------
          # 8. Sauvegarde
          # ---------------------------------------------------------

          memory["version"] = "V27"
          memory["updated_at"] = now
          memory["knowledge"] = knowledge
          memory["memory_priority"] = priority_results
          memory["memory_priority_state"] = (
              memory_priority_state
          )
          memory["history"] = history

          MEMORY_FILE.write_text(
              json.dumps(
                  memory,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # 9. Rapport GitHub Actions
          # ---------------------------------------------------------

          print("==========================================")
          print("NØX ORIGIN - V27")
          print("==========================================")
          print(f"Knowledge total : {len(knowledge)}")
          print("------------------------------------------")
          print(f"CRITICAL        : {counts['critical']}")
          print(f"HIGH            : {counts['high']}")
          print(f"NORMAL          : {counts['normal']}")
          print(f"LOW             : {counts['low']}")
          print("------------------------------------------")
          print("Priority        : LOCAL")
          print("Gemini          : NON REQUIS")
          print("Cost            : 0 EUR")
          print("------------------------------------------")
          print("No knowledge deleted.")
          print("No external action executed.")
          print("Priority does NOT authorize action.")
          print("==========================================")
          PY

      - name: Commit V27 memory
        run: |
          git config user.name "NØX Origin"
          git config user.email "nox-origin@users.noreply.github.com"

          git add nox_memory.json

          git diff --cached --quiet || git commit -m "NØX V27 memory priority"

          git push
