name: NØX ACT 08 V7 - Opportunity Intelligence

on:
workflow_dispatch:
schedule:
- cron: "15 * * * *"

permissions:
contents: write

concurrency:
group: nox-main-writer
cancel-in-progress: false

jobs:
opportunity-intelligence:
runs-on: ubuntu-latest

env:
  COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
  MAX_RESULTS: "100"

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Run ACT 08 V7
    shell: bash
    run: |
      python <<'PY'
      import json
      import os
      import re
      from datetime import datetime, timezone

      import requests


      VERSION = "ACT 08 V7"
      ENDPOINT = "https://thecolony.cc/api/v1/marketplace/tasks"
      MAX_RESULTS = int(os.getenv("MAX_RESULTS", "100"))

      API_KEY = os.getenv("COLONY_API_KEY", "")

      if not API_KEY:
          raise RuntimeError("COLONY_API_KEY is missing")


      session = requests.Session()
      session.headers.update({
          "Accept": "application/json",
          "User-Agent": "Nox-Origin-ACT08-V7",
      })


      # ------------------------------------------------------------
      # Authentication
      # ------------------------------------------------------------

      auth_response = session.post(
          "https://thecolony.cc/api/v1/auth/token",
          json={"api_key": API_KEY},
          timeout=30,
      )

      auth_response.raise_for_status()

      auth_data = auth_response.json()

      token = (
          auth_data.get("access_token")
          or auth_data.get("token")
          or auth_data.get("jwt")
      )

      if not token:
          raise RuntimeError("No JWT token returned by The Colony")

      session.headers.update({
          "Authorization": f"Bearer {token}",
      })


      # ------------------------------------------------------------
      # Marketplace retrieval
      # ------------------------------------------------------------

      attempts = [
          {
              "status": "open",
              "sort": "new",
              "limit": MAX_RESULTS,
              "offset": 0,
          },
          {
              "status": "open",
              "limit": MAX_RESULTS,
              "offset": 0,
          },
          {
              "limit": MAX_RESULTS,
              "offset": 0,
          },
      ]

      tasks = []
      diagnostic_attempts = []
      final_status = None
      final_structure = None
      final_params = None

      for params in attempts:
          response = session.get(
              ENDPOINT,
              params=params,
              timeout=30,
          )

          final_status = response.status_code

          attempt_info = {
              "parameters": params,
              "status": response.status_code,
          }

          try:
              payload = response.json()
          except Exception:
              payload = None

          if isinstance(payload, list):
              extracted = payload
              structure = "list"

          elif isinstance(payload, dict):
              extracted = None
              structure = None

              for key in (
                  "tasks",
                  "data",
                  "results",
                  "items",
                  "marketplace",
              ):
                  value = payload.get(key)

                  if isinstance(value, list):
                      extracted = value
                      structure = key
                      break

              if extracted is None:
                  for value in payload.values():
                      if isinstance(value, dict):
                          for key in (
                              "tasks",
                              "data",
                              "results",
                              "items",
                              "marketplace",
                          ):
                              nested = value.get(key)

                              if isinstance(nested, list):
                                  extracted = nested
                                  structure = f"nested.{key}"
                                  break

                          if extracted is not None:
                              break

              if extracted is None:
                  extracted = []

          else:
              extracted = []
              structure = type(payload).__name__

          attempt_info["response_structure"] = structure
          attempt_info["tasks_received"] = len(extracted)
          diagnostic_attempts.append(attempt_info)

          if extracted:
              tasks = extracted
              final_structure = structure
              final_params = params
              break

      tasks = tasks[:MAX_RESULTS]


      # ------------------------------------------------------------
      # Text normalization
      # ------------------------------------------------------------

      def task_text(task):
          if not isinstance(task, dict):
              return ""

          fields = [
              task.get("title"),
              task.get("description"),
              task.get("body"),
              task.get("content"),
              task.get("details"),
          ]

          return " ".join(
              str(value)
              for value in fields
              if value is not None
          )


      # ------------------------------------------------------------
      # Classification patterns
      # ------------------------------------------------------------

      SERVICE_PATTERNS = [
          r"\bfor\s+hire\b",
          r"\boffering\b",
          r"\boffer\b",
          r"\bavailable\s+for\s+hire\b",
          r"\bavailable\s+to\s+help\b",
          r"\bi\s+can\s+(?:build|write|code|create|develop|help|do)\b",
          r"\bi\s+offer\b",
          r"\bmy\s+services\b",
          r"\bservices?\s+(?:available|offered)\b",
          r"\bwill\s+(?:write|build|create|develop|code)\b",
      ]

      REQUEST_PATTERNS = [
          r"\bneed(?:s|ed)?\b",
          r"\blooking\s+for\b",
          r"\bseeking\b",
          r"\bwe\s+need\b",
          r"\bi\s+need\b",
          r"\bplease\s+(?:build|write|create|develop|code|fix)\b",
          r"\bcan\s+someone\b",
          r"\bwho\s+can\b",
          r"\bhelp\s+needed\b",
          r"\bpaid\s+task\b",
          r"\btask\s+request\b",
          r"\bjob\s+request\b",
          r"\bhiring\b",
      ]

      TRADE_PATTERNS = [
          r"\bexchange\b",
          r"\bswap\b",
          r"\btrade\b",
          r"\btrading\b",
          r"\bbelow\s+market\s+rate\b",
          r"\bmarket\s+rate\b",
          r"\bsats?\s+for\s+\d",
          r"\busdc\s+for\s+\d",
          r"\beth\s+for\s+\d",
          r"\busdt\s+for\s+\d",
          r"\b\d+(?:[.,]\d+)?\s+(?:sats?|satoshis?)\s+for\s+",
          r"\b\d+(?:[.,]\d+)?\s+(?:usdc|usdt|eth|btc)\s+for\s+",
      ]

      CAPTURED_ACTION_PATTERNS = [
          r"\bprovide\s+(?:your|my)\s+(?:private\s+key|seed\s+phrase|secret)\b",
          r"\bprivate\s+key\b",
          r"\bseed\s+phrase\b",
          r"\bsecret\s+key\b",
          r"\bsolve\s+(?:the\s+)?captcha\b",
          r"\bcomplete\s+(?:the\s+)?captcha\b",
          r"\bpay\s+upfront\b",
          r"\bdeposit\s+(?:funds|money|usdc|usdt|btc|eth|sats?)\b",
          r"\bsend\s+(?:me|us|to\s+me)\s+\$?\d",
          r"\btransfer\s+\$?\d",
          r"\bsend\s+(?:me|us|to\s+me)\s+(?:usdc|usdt|btc|eth|sats?)\b",
          r"\btransfer\s+(?:usdc|usdt|btc|eth|sats?)\b",
      ]


      def matches_any(patterns, text):
          return any(
              re.search(pattern, text, re.IGNORECASE)
              for pattern in patterns
          )


      # ------------------------------------------------------------
      # Reward parser
      # ------------------------------------------------------------

      CURRENCY_PATTERN = (
          r"(?:USDC|USDT|USD|BTC|ETH|SATS?|SATOSHIS?)"
      )

      NEGATIVE_RE = re.compile(
          rf"(?<![\w])-\$?"
          rf"(?P<amount>\d+(?:[.,]\d+)?)\s*"
          rf"(?P<currency>{CURRENCY_PATTERN})\b",
          re.IGNORECASE,
      )

      POSITIVE_RE = re.compile(
          rf"(?:(?P<prefix>from|starting\s+at|minimum(?:\s+of)?)\s+)?"
          rf"\$?(?P<amount>\d+(?:[.,]\d+)?)(?P<plus>\+)?\s*"
          rf"(?P<currency>{CURRENCY_PATTERN})\b",
          re.IGNORECASE,
      )

      REVERSE_RE = re.compile(
          rf"(?P<currency>{CURRENCY_PATTERN})"
          rf"\s*\$?(?P<amount>\d+(?:[.,]\d+)?)",
          re.IGNORECASE,
      )


      def normalize_amount(raw_amount, currency):
          value = raw_amount.replace(",", ".")

          # For sats/satoshis, dot-separated thousands such as
          # 2.000 sats are interpreted as 2000 sats.
          if currency.lower() in ("sat", "sats", "satoshi", "satoshis"):
              if re.fullmatch(r"\d{1,3}(?:\.\d{3})+", raw_amount):
                  value = raw_amount.replace(".", "")

          try:
              return float(value)
          except ValueError:
              return None


      def parse_reward(text):
          negative = NEGATIVE_RE.search(text)

          if negative:
              currency = negative.group("currency").upper()
              amount = normalize_amount(
                  negative.group("amount"),
                  currency,
              )

              return {
                  "status": "NEGATIVE_COST",
                  "amount": amount,
                  "currency": currency,
                  "plus": False,
                  "from_or_minimum": False,
              }

          positive = POSITIVE_RE.search(text)

          if positive:
              currency = positive.group("currency").upper()
              amount = normalize_amount(
                  positive.group("amount"),
                  currency,
              )

              return {
                  "status": "CONFIRMED_REWARD",
                  "amount": amount,
                  "currency": currency,
                  "plus": bool(positive.group("plus")),
                  "from_or_minimum": bool(positive.group("prefix")),
              }

          reverse = REVERSE_RE.search(text)

          if reverse:
              currency = reverse.group("currency").upper()
              amount = normalize_amount(
                  reverse.group("amount"),
                  currency,
              )

              return {
                  "status": "CONFIRMED_REWARD",
                  "amount": amount,
                  "currency": currency,
                  "plus": False,
                  "from_or_minimum": False,
              }

          if re.search(
              r"\b(pay|paid|payout|reward|bounty|compensation)\b",
              text,
              re.IGNORECASE,
          ):
              return {
                  "status": "REWARD_AMBIGUOUS",
                  "amount": None,
                  "currency": None,
                  "plus": False,
                  "from_or_minimum": False,
              }

          return {
              "status": "REWARD_UNKNOWN",
              "amount": None,
              "currency": None,
              "plus": False,
              "from_or_minimum": False,
          }


      # ------------------------------------------------------------
      # Compatibility
      # ------------------------------------------------------------

      COMPATIBILITY_TERMS = [
          "python",
          "api",
          "automation",
          "research",
          "analysis",
          "technical writing",
          "coding",
          "developer",
          "data",
          "web scraping",
          "agent",
          "documentation",
          "github",
          "javascript",
          "js",
          "rag",
          "langchain",
      ]


      def compatibility_score(text):
          lowered = text.lower()

          hits = sum(
              1
              for term in COMPATIBILITY_TERMS
              if term in lowered
          )

          return min(10, hits)


      # ------------------------------------------------------------
      # Risk evaluation
      # ------------------------------------------------------------

      def risk_level(text, listing_type):
          if listing_type == "TRADE_OFFER":
              return "HIGH"

          if matches_any(CAPTURED_ACTION_PATTERNS, text):
              return "HIGH"

          mention_only_patterns = [
              r"\bcaptcha\b",
              r"\bwallet\b",
              r"\bpayment\b",
          ]

          if matches_any(mention_only_patterns, text):
              return "LOW"

          return "LOW"


      # ------------------------------------------------------------
      # Opportunity scoring
      # ------------------------------------------------------------

      def opportunity_score(
          listing_type,
          reward,
          risk,
          compatibility,
      ):
          if listing_type != "TASK_REQUEST":
              return 0

          if risk == "HIGH":
              return 0

          if reward["status"] != "CONFIRMED_REWARD":
              return 0

          score = 4

          if compatibility >= 7:
              score += 4
          elif compatibility >= 4:
              score += 2
          elif compatibility >= 2:
              score += 1

          if reward["currency"] in (
              "USDC",
              "USDT",
              "BTC",
              "ETH",
              "SATS",
              "SAT",
              "SATOSHI",
              "SATOSHIS",
          ):
              score += 1

          if reward["plus"]:
              score += 1

          return min(10, score)


      # ------------------------------------------------------------
      # Evaluate each listing
      # ------------------------------------------------------------

      evaluated_tasks = {}
      top_opportunities = []

      statistics = {
          "runs": 1,
          "tasks_seen": len(tasks),
          "tasks_evaluated": 0,
          "qualified": 0,
          "review": 0,
          "observe": 0,
          "service_offer": 0,
          "trade_offer": 0,
          "reward_unclear": 0,
          "rejected": 0,
      }


      for task in tasks:
          if not isinstance(task, dict):
              continue

          task_id = str(
              task.get("id")
              or task.get("task_id")
              or task.get("uuid")
              or ""
          )

          if not task_id:
              continue

          text = task_text(task).strip()

          if not text:
              continue

          # Trade detection has priority.
          if matches_any(TRADE_PATTERNS, text):
              listing_type = "TRADE_OFFER"

          else:
              service_match = matches_any(
                  SERVICE_PATTERNS,
                  text,
              )

              request_match = matches_any(
                  REQUEST_PATTERNS,
                  text,
              )

              if service_match and not request_match:
                  listing_type = "SERVICE_OFFER"

              elif request_match and not service_match:
                  listing_type = "TASK_REQUEST"

              elif service_match and request_match:
                  # Explicit seller/service language wins when both
                  # appear, preventing service advertisements from
                  # becoming false opportunities.
                  listing_type = "SERVICE_OFFER"

              else:
                  listing_type = "AMBIGUOUS"

          reward = parse_reward(text)
          compatibility = compatibility_score(text)
          risk = risk_level(text, listing_type)

          score = opportunity_score(
              listing_type,
              reward,
              risk,
              compatibility,
          )

          if listing_type == "TRADE_OFFER":
              category = "REJECT"
              statistics["trade_offer"] += 1
              statistics["rejected"] += 1

          elif listing_type == "SERVICE_OFFER":
              category = "SERVICE_OFFER"
              statistics["service_offer"] += 1

          elif reward["status"] in (
              "REWARD_UNKNOWN",
              "REWARD_AMBIGUOUS",
          ):
              category = "REWARD_UNCLEAR"
              statistics["reward_unclear"] += 1

          elif reward["status"] == "NEGATIVE_COST":
              category = "REJECT"
              statistics["rejected"] += 1

          elif risk == "HIGH":
              category = "REJECT"
              statistics["rejected"] += 1

          elif listing_type == "TASK_REQUEST":
              if score >= 7:
                  category = "QUALIFIED"
                  statistics["qualified"] += 1
              else:
                  category = "REVIEW"
                  statistics["review"] += 1

          else:
              category = "OBSERVE"
              statistics["observe"] += 1

          if listing_type == "TASK_REQUEST" and reward["status"] in (
              "REWARD_UNKNOWN",
              "REWARD_AMBIGUOUS",
          ):
              category = "REWARD_UNCLEAR"

          evaluated = {
              "task_id": task_id,
              "title": task.get("title"),
              "listing_type": listing_type,
              "category": category,
              "reward": reward,
              "risk": risk,
              "compatibility": compatibility,
              "opportunity_score": score,
          }

          evaluated_tasks[task_id] = evaluated
          statistics["tasks_evaluated"] += 1

          if category == "QUALIFIED":
              top_opportunities.append(evaluated)


      top_opportunities.sort(
          key=lambda item: (
              item["opportunity_score"],
              item["compatibility"],
              item["reward"].get("amount") or 0,
          ),
          reverse=True,
      )

      top_opportunities = top_opportunities[:10]


      # ------------------------------------------------------------
      # Diagnostic output
      # ------------------------------------------------------------

      generated_at = datetime.now(
          timezone.utc
      ).isoformat()

      diagnostic = {
          "version": VERSION,
          "generated_at": generated_at,
          "endpoint": ENDPOINT,
          "status": final_status,
          "response_structure": final_structure,
          "parameters_used": final_params,
          "fetch_attempts": len(diagnostic_attempts),
          "tasks_received": len(tasks),
          "attempts": diagnostic_attempts,
          "problem_detected": len(tasks) == 0,
      }


      result = {
          "version": VERSION,
          "generated_at": generated_at,
          "mode": "opportunity_intelligence_read_only",

          "scope": {
              "personalized_feed": True,
              "public_recent_posts": True,
              "marketplace_actions": False,
              "comments": False,
              "dm": False,
              "payments": False,
              "gemini": False,
              "max_results": MAX_RESULTS,
          },

          "marketplace_diagnostic": {
              "endpoint": ENDPOINT,
              "status": final_status,
              "response_structure": final_structure,
              "parameters_used": final_params,
              "fetch_attempts": len(diagnostic_attempts),
              "tasks_received": len(tasks),
              "problem_detected": len(tasks) == 0,
          },

          "evaluated_tasks": evaluated_tasks,
          "top_opportunities": top_opportunities,
          "statistics": statistics,

          "last_run": {
              "timestamp": generated_at,
              "marketplace_status": final_status,
              "open_tasks_received": len(tasks),
              "tasks_evaluated": statistics["tasks_evaluated"],
              "actions_performed": False,
              "bid": False,
              "comment": False,
              "dm": False,
              "payment": False,
              "purchase": False,
              "transfer": False,
              "gemini_used": False,
              "project_cost_eur": 0,
          },
      }


      os.makedirs("memory", exist_ok=True)

      with open(
          "memory/nox_act_08_opportunity_evaluator_v7.json",
          "w",
          encoding="utf-8",
      ) as file:
          json.dump(
              result,
              file,
              ensure_ascii=False,
              indent=2,
          )

      with open(
          "memory/nox_act_08_marketplace_diagnostic_v7.json",
          "w",
          encoding="utf-8",
      ) as file:
          json.dump(
              diagnostic,
              file,
              ensure_ascii=False,
              indent=2,
          )

      print(json.dumps(
          result,
          ensure_ascii=False,
          indent=2,
      ))
      PY

  - name: Commit ACT 08 V7 results
    shell: bash
    run: |
      git config user.name "NØX Origin"
      git config user.email "nox-origin@users.noreply.github.com"

      git add memory/nox_act_08_opportunity_evaluator_v7.json
      git add memory/nox_act_08_marketplace_diagnostic_v7.json

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "ACT 08 V7 opportunity intelligence"

      git fetch origin main

      if git rebase origin/main; then
        git push origin HEAD:main
      else
        git rebase --abort
        echo "Rebase failed. No push performed."
        exit 1
      fi
