name: NØX ACT 08 V7 - Opportunity Intelligence

on:
workflow_dispatch:
schedule:
- cron: "15 * * * *"

permissions:
contents: write

concurrency:
group: nox-main-writer
cancel-in-progress: false

jobs:
opportunity-intelligence:
runs-on: ubuntu-latest

env:
  COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
  MARKETPLACE_ENDPOINT: https://thecolony.cc/api/v1/marketplace/tasks
  MAX_RESULTS: "100"

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Run ACT 08 V7
    run: |
      cat > /tmp/act08_v7.py <<'PY'
      import json
      import os
      import re
      import unicodedata
      from datetime import datetime, timezone

      import requests

      VERSION = "ACT 08 V7"
      ENDPOINT = os.environ["MARKETPLACE_ENDPOINT"]
      API_KEY = os.environ["COLONY_API_KEY"]
      MAX_RESULTS = int(os.environ.get("MAX_RESULTS", "100"))

      GENERATED_AT = datetime.now(timezone.utc).isoformat()

      HEADERS = {
          "Authorization": f"Bearer {API_KEY}",
          "Accept": "application/json",
          "User-Agent": "Nox-Origin-ACT08-V7",
      }

      # ============================================================
      # NORMALISATION
      # ============================================================

      def normalize(value):
          if value is None:
              return ""

          text = unicodedata.normalize("NFKC", str(value))

          replacements = {
              "−": "-",
              "–": "-",
              "—": "-",
              "-": "-",
              "﹣": "-",
              "＋": "+",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          return text.strip()

      # ============================================================
      # MARKETPLACE EXTRACTION
      # ============================================================

      def extract_tasks(payload):
          if isinstance(payload, list):
              return payload

          if not isinstance(payload, dict):
              return []

          keys = [
              "items",
              "tasks",
              "data",
              "results",
              "marketplace",
          ]

          for key in keys:
              value = payload.get(key)

              if isinstance(value, list):
                  return value

              if isinstance(value, dict):
                  for nested_key in keys:
                      nested = value.get(nested_key)

                      if isinstance(nested, list):
                          return nested

          return []

      def get_task_text(task):
          title = normalize(
              task.get("title")
              or task.get("name")
              or task.get("subject")
              or ""
          )

          body = normalize(
              task.get("body")
              or task.get("description")
              or task.get("content")
              or ""
          )

          tags = task.get("tags") or []

          if isinstance(tags, list):
              tags = " ".join(normalize(x) for x in tags)
          else:
              tags = normalize(tags)

          return title, body, tags

      # ============================================================
      # REWARD PARSER
      # ============================================================

      CURRENCY = r"(USDC|USDT|USD|BTC|ETH|SATS?|SATOSHIS?)"

      # Negative ONLY when '-' is directly attached to the number.
      # Example: -30 USDC
      #
      # This intentionally does NOT interpret:
      # "For hire - 1000 sats"
      # as a negative reward.
      NEGATIVE_RE = re.compile(
          r"(?<![\w])-\$?"
          r"(\d+(?:[.,]\d+)?)"
          r"\s*"
          + CURRENCY
          + r"\b",
          re.IGNORECASE,
      )

      POSITIVE_RE = re.compile(
          r"(?:(from|starting\s+at|minimum(?:\s+of)?)\s+)?"
          r"\$?"
          r"(\d+(?:[.,]\d+)?)"
          r"(\+)?"
          r"\s*"
          + CURRENCY
          + r"\b",
          re.IGNORECASE,
      )

      REVERSE_RE = re.compile(
          CURRENCY
          + r"\s*\$?"
          r"(\d+(?:[.,]\d+)?)",
          re.IGNORECASE,
      )

      def parse_amount(raw, currency):
          raw = raw.strip()
          currency = currency.lower()

          if currency in {
              "sat",
              "sats",
              "satoshi",
              "satoshis",
          }:
              if re.fullmatch(r"\d{1,3}(?:\.\d{3})+", raw):
                  try:
                      return float(raw.replace(".", ""))
                  except ValueError:
                      return None

          try:
              return float(raw.replace(",", ""))
          except ValueError:
              return None

      def parse_reward(title, body):
          sources = [
              ("title", normalize(title)),
              ("body", normalize(body)),
          ]

          # --------------------------------------------------------
          # Explicit negative
          # --------------------------------------------------------

          for source, text in sources:
              match = NEGATIVE_RE.search(text)

              if match:
                  amount = parse_amount(
                      match.group(1),
                      match.group(2),
                  )

                  if amount is not None:
                      return {
                          "status": "NEGATIVE_COST",
                          "amount": amount,
                          "currency": match.group(2).upper(),
                          "minimum_or_from": False,
                          "plus": False,
                          "source": source,
                          "evidence": match.group(0),
                      }

          # --------------------------------------------------------
          # Positive reward
          # --------------------------------------------------------

          for source, text in sources:
              for match in POSITIVE_RE.finditer(text):
                  amount = parse_amount(
                      match.group(2),
                      match.group(4),
                  )

                  if amount is None:
                      continue

                  prefix = (match.group(1) or "").lower()

                  return {
                      "status": "CONFIRMED_REWARD",
                      "amount": amount,
                      "currency": match.group(4).upper(),
                      "minimum_or_from": prefix in {
                          "from",
                          "starting at",
                          "minimum",
                          "minimum of",
                      },
                      "plus": bool(match.group(3)),
                      "source": source,
                      "evidence": match.group(0),
                  }

          # --------------------------------------------------------
          # Currency before amount
          # Example: USDC 5
          # --------------------------------------------------------

          for source, text in sources:
              match = REVERSE_RE.search(text)

              if match:
                  amount = parse_amount(
                      match.group(2),
                      match.group(1),
                  )

                  if amount is not None:
                      return {
                          "status": "CONFIRMED_REWARD",
                          "amount": amount,
                          "currency": match.group(1).upper(),
                          "minimum_or_from": False,
                          "plus": False,
                          "source": source,
                          "evidence": match.group(0),
                      }

          # --------------------------------------------------------
          # Explicit ambiguity
          # --------------------------------------------------------

          combined = f"{title} {body}".lower()

          ambiguous_patterns = [
              r"\bpay\s+what\s+you\s+want\b",
              r"\bnegotiable\b",
              r"\bnegotiated\b",
              r"\bdepends\s+on\b",
              r"\bpay\s+in\s+crypto\b",
              r"\bpay\s+in\s+eth\b",
          ]

          for pattern in ambiguous_patterns:
              if re.search(pattern, combined):
                  return {
                      "status": "REWARD_AMBIGUOUS",
                      "amount": None,
                      "currency": None,
                      "minimum_or_from": False,
                      "plus": False,
                      "source": "semantic",
                      "evidence": pattern,
                  }

          return {
              "status": "REWARD_UNKNOWN",
              "amount": None,
              "currency": None,
              "minimum_or_from": False,
              "plus": False,
              "source": None,
              "evidence": None,
          }

      # ============================================================
      # LISTING CLASSIFICATION
      # ============================================================

      TRADE_PATTERNS = [
          r"\b\d+(?:[.,]\d+)?\s+sats?\s+for\s+\d",
          r"\b\d+(?:[.,]\d+)?\s+satoshis?\s+for\s+\d",
          r"\b\d+(?:[.,]\d+)?\s+(?:usdc|usdt|usd|btc|eth)\s+for\s+\d",
          r"\b(?:usdc|usdt|usd|btc|eth)\s+for\s+\d",
          r"\bexchange\b",
          r"\bswap\b",
          r"\btrade\b",
          r"\btrading\b",
          r"\bbelow\s+market\s+rate\b",
          r"\bconvert\b",
      ]

      SERVICE_PATTERNS = [
          r"^\s*for\s+hire\b",
          r"^\s*offering\b",
          r"\bavailable\s+for\s+hire\b",
          r"\bmy\s+services\b",
          r"\bi\s+can\s+(?:build|create|write|research|deliver)\b",
      ]

      REQUEST_PATTERNS = [
          r"\bneed\s+(?:someone|an?\s+(?:agent|developer|writer|researcher|designer|person))\b",
          r"\blooking\s+for\b",
          r"\bseeking\b",
          r"\bwe\s+need\b",
          r"\bi\s+need\b",
          r"\btask\s+is\b",
          r"\bplease\s+(?:build|write|create|research|verify|test|analy[sz]e)\b",
          r"\bcan\s+someone\b",
          r"\bwho\s+can\b",
          r"\bwant\s+someone\s+to\b",
          r"\bhelp\s+needed\b",
          r"\bpaid\s+task\b",
          r"\bpaid_task\b",
          r"^\s*will\s+(?:write|build|create|research|develop|make)\b",
      ]

      def has_pattern(text, patterns):
          return any(
              re.search(pattern, text, re.IGNORECASE)
              for pattern in patterns
          )

      def classify_listing(title, body, tags):
          combined = " ".join(
              value
              for value in [title, body, tags]
              if value
          )

          lower = combined.lower()

          # Financial exchange takes absolute priority.
          if has_pattern(lower, TRADE_PATTERNS):
              return "TRADE_OFFER"

          request = has_pattern(
              lower,
              REQUEST_PATTERNS,
          )

          service = has_pattern(
              lower,
              SERVICE_PATTERNS,
          )

          if "paid_task" in lower:
              return "TASK_REQUEST"

          if request:
              return "TASK_REQUEST"

          if service:
              return "SERVICE_OFFER"

          return "AMBIGUOUS"

      # ============================================================
      # RISK ANALYSIS
      # ============================================================

      HIGH_RISK_PATTERNS = [
          r"\bprivate\s+key\b",
          r"\bseed\s+phrase\b",
          r"\bsecret\s+key\b",
          r"\bmnemonic\b",
          r"\bexport\s+(?:your\s+)?wallet\b",
          r"\btransfer\s+(?:usdc|usdt|btc|eth|crypto)\b",
          r"\bsend\s+(?:usdc|usdt|btc|eth|crypto)\b",
          r"\bpay\s+upfront\b",
          r"\bdeposit\b",
          r"\bsolve\s+(?:a\s+)?captcha\b",
          r"\bcomplete\s+(?:a\s+)?captcha\b",
          r"\bverification\s+code\b",
      ]

      MENTION_PATTERNS = [
          r"\bcaptcha\b",
          r"\bwallet\b",
          r"\bcrypto\b",
          r"\busdc\b",
          r"\busdt\b",
          r"\blightning\b",
      ]

      def analyze_risk(title, body):
          combined = f"{title}\n{body}".lower()

          high = [
              pattern
              for pattern in HIGH_RISK_PATTERNS
              if re.search(pattern, combined)
          ]

          if high:
              return {
                  "level": "HIGH",
                  "action_required": True,
                  "signals": high,
              }

          mentions = [
              pattern
              for pattern in MENTION_PATTERNS
              if re.search(pattern, combined)
          ]

          if mentions:
              return {
                  "level": "MENTION_ONLY",
                  "action_required": False,
                  "signals": mentions,
              }

          return {
              "level": "LOW",
              "action_required": False,
              "signals": [],
          }

      # ============================================================
      # COMPATIBILITY
      # ============================================================

      NOX_CAPABILITIES = [
          ("python", "python"),
          ("api", "api"),
          ("automation", "automation"),
          ("research", "research"),
          ("analysis", "analysis"),
          ("data", "data"),
          ("csv", "csv"),
          ("json", "json"),
          ("writing", "writing"),
          ("technical writing", "technical writing"),
          ("documentation", "documentation"),
          ("testing", "testing"),
          ("verification", "verification"),
          ("qa", "qa"),
      ]

      def compatibility(title, body):
          combined = f"{title} {body}".lower()

          matched = []

          for label, keyword in NOX_CAPABILITIES:
              if keyword in combined:
                  matched.append(label)

          score = min(
              10,
              2 + len(matched),
          )

          return score, matched

      # ============================================================
      # OPPORTUNITY SCORE
      # ============================================================

      def opportunity_score(
          listing_type,
          reward,
          risk,
          compatibility_score,
      ):
          if listing_type != "TASK_REQUEST":
              return 0

          if reward["status"] != "CONFIRMED_REWARD":
              return 0

          if reward["status"] == "NEGATIVE_COST":
              return 0

          if risk["level"] == "HIGH":
              return 0

          if compatibility_score < 5:
              return 0

          score = compatibility_score

          if reward["currency"] in {
              "USDC",
              "USD",
          }:
              score += 1

          if reward["currency"] in {
              "SAT",
              "SATS",
              "SATOSHIS",
          }:
              score += 1

          if reward["minimum_or_from"]:
              score -= 1

          return max(
              0,
              min(10, score),
          )

      # ============================================================
      # FETCH
      # ============================================================

      attempts = [
          {
              "status": "open",
              "sort": "new",
              "limit": MAX_RESULTS,
              "offset": 0,
          },
          {
              "status": "open",
              "limit": MAX_RESULTS,
              "offset": 0,
          },
          {
              "limit": MAX_RESULTS,
              "offset": 0,
          },
      ]

      tasks = []
      diagnostic_attempts = []

      for params in attempts:
          try:
              response = requests.get(
                  ENDPOINT,
                  headers=HEADERS,
                  params=params,
                  timeout=30,
              )

              try:
                  payload = response.json()
              except Exception:
                  payload = None

              if isinstance(payload, list):
                  structure = "list"
              elif isinstance(payload, dict):
                  structure = "unknown"

                  for key in [
                      "items",
                      "tasks",
                      "data",
                      "results",
                      "marketplace",
                  ]:
                      if key in payload:
                          structure = key
                          break
              else:
                  structure = "unknown"

              candidate_tasks = extract_tasks(payload)

              diagnostic_attempts.append({
                  "params": params,
                  "status": response.status_code,
                  "response_structure": structure,
                  "tasks_received": len(candidate_tasks),
              })

              if response.ok and candidate_tasks:
                  tasks = candidate_tasks
                  break

              if response.ok and not tasks:
                  tasks = candidate_tasks

          except Exception as exc:
              diagnostic_attempts.append({
                  "params": params,
                  "status": None,
                  "response_structure": "exception",
                  "tasks_received": 0,
                  "error": str(exc),
              })

      # ============================================================
      # DEDUPLICATION
      # ============================================================

      unique_tasks = []
      seen = set()

      for task in tasks:
          task_id = (
              task.get("id")
              or task.get("task_id")
              or task.get("post_id")
              or task.get("uuid")
          )

          if task_id is None:
              key = json.dumps(
                  task,
                  sort_keys=True,
                  ensure_ascii=False,
              )
          else:
              key = str(task_id)

          if key in seen:
              continue

          seen.add(key)
          unique_tasks.append(task)

      tasks = unique_tasks[:MAX_RESULTS]

      # ============================================================
      # EVALUATION
      # ============================================================

      evaluated_tasks = {}
      top_opportunities = []

      statistics = {
          "runs": 1,
          "tasks_seen": len(tasks),
          "tasks_evaluated": 0,
          "qualified": 0,
          "review": 0,
          "observe": 0,
          "service_offer": 0,
          "trade_offer": 0,
          "reward_unclear": 0,
          "rejected": 0,
      }

      for task in tasks:
          title, body, tags = get_task_text(task)

          task_id = (
              task.get("id")
              or task.get("task_id")
              or task.get("post_id")
              or task.get("uuid")
              or f"unknown-{len(evaluated_tasks) + 1}"
          )

          task_id = str(task_id)

          listing_type = classify_listing(
              title,
              body,
              tags,
          )

          reward = parse_reward(
              title,
              body,
          )

          risk = analyze_risk(
              title,
              body,
          )

          compatibility_score, matched = compatibility(
              title,
              body,
          )

          score = opportunity_score(
              listing_type,
              reward,
              risk,
              compatibility_score,
          )

          # --------------------------------------------------------
          # CATEGORY
          # --------------------------------------------------------

          if listing_type == "TRADE_OFFER":
              category = "REJECT"
              statistics["trade_offer"] += 1
              statistics["rejected"] += 1

          elif listing_type == "SERVICE_OFFER":
              category = "SERVICE_OFFER"
              statistics["service_offer"] += 1

          elif risk["level"] == "HIGH":
              category = "REJECT"
              statistics["rejected"] += 1

          elif reward["status"] == "NEGATIVE_COST":
              category = "REJECT"
              statistics["rejected"] += 1

          elif reward["status"] in {
              "REWARD_UNKNOWN",
              "REWARD_AMBIGUOUS",
          }:
              category = "REVIEW"
              statistics["review"] += 1
              statistics["reward_unclear"] += 1

          elif listing_type == "TASK_REQUEST":
              if (
                  reward["status"] == "CONFIRMED_REWARD"
                  and compatibility_score >= 5
              ):
                  category = "QUALIFIED"
                  statistics["qualified"] += 1
              else:
                  category = "REVIEW"
                  statistics["review"] += 1

          else:
              category = "OBSERVE"
              statistics["observe"] += 1

          record = {
              "id": task_id,
              "title": title,
              "listing_type": listing_type,
              "category": category,
              "reward": reward,
              "risk": risk,
              "compatibility": {
                  "score": compatibility_score,
                  "matched_capabilities": matched,
              },
              "opportunity_score": score,
              "actionable": False,
              "actions_performed": False,
              "bid": False,
              "comment": False,
              "dm": False,
              "payment": False,
              "purchase": False,
              "transfer": False,
          }

          evaluated_tasks[task_id] = record
          statistics["tasks_evaluated"] += 1

          if (
              category == "QUALIFIED"
              and score > 0
          ):
              top_opportunities.append(record)

      top_opportunities.sort(
          key=lambda item: (
              item["opportunity_score"],
              item["compatibility"]["score"],
              item["reward"]["amount"] or 0,
          ),
          reverse=True,
      )

      # ============================================================
      # DIAGNOSTIC
      # ============================================================

      marketplace_status = None

      for attempt in diagnostic_attempts:
          if attempt.get("status") is not None:
              marketplace_status = attempt["status"]

              if attempt.get("tasks_received", 0) > 0:
                  break

      diagnostic = {
          "endpoint": ENDPOINT,
          "status": marketplace_status,
          "response_structure": (
              diagnostic_attempts[0]["response_structure"]
              if diagnostic_attempts
              else "unknown"
          ),
          "parameters_used": (
              diagnostic_attempts[0]["params"]
              if diagnostic_attempts
              else None
          ),
          "fetch_attempts": len(diagnostic_attempts),
          "tasks_received": len(tasks),
          "problem_detected": (
              marketplace_status != 200
              or len(tasks) == 0
          ),
          "attempt_details": diagnostic_attempts,
      }

      # ============================================================
      # SAFETY
      # ============================================================

      safety = {
          "read_only": True,
          "public_action": False,
          "bid": False,
          "comment": False,
          "dm": False,
          "payment": False,
          "purchase": False,
          "transfer": False,
          "gemini_used": False,
          "project_cost_eur": 0,
      }

      # ============================================================
      # FINAL OUTPUT
      # ============================================================

      output = {
          "version": VERSION,
          "generated_at": GENERATED_AT,
          "mode": "opportunity_intelligence_read_only",

          "scope": {
              "personalized_feed": True,
              "public_recent_posts": True,
              "marketplace_actions": False,
              "comments": False,
              "dm": False,
              "payments": False,
              "gemini": False,
              "max_results": MAX_RESULTS,
          },

          "marketplace_diagnostic": diagnostic,

          "evaluated_tasks": evaluated_tasks,

          "top_opportunities": top_opportunities[:10],

          "statistics": statistics,

          "safety": safety,

          "last_run": {
              "timestamp": GENERATED_AT,
              "marketplace_status": marketplace_status,
              "open_tasks_received": len(tasks),
              "tasks_evaluated": len(evaluated_tasks),
              "actions_performed": False,
              "bid": False,
              "comment": False,
              "dm": False,
              "payment": False,
              "purchase": False,
              "transfer": False,
              "gemini_used": False,
              "project_cost_eur": 0,
          },
      }

      os.makedirs("memory", exist_ok=True)

      with open(
          "memory/nox_act_08_opportunity_evaluator_v7.json",
          "w",
          encoding="utf-8",
      ) as file:
          json.dump(
              output,
              file,
              ensure_ascii=False,
              indent=2,
          )

      with open(
          "memory/nox_act_08_marketplace_diagnostic_v7.json",
          "w",
          encoding="utf-8",
      ) as file:
          json.dump(
              diagnostic,
              file,
              ensure_ascii=False,
              indent=2,
          )

      print(
          json.dumps(
              output,
              ensure_ascii=False,
              indent=2,
          )
      )

      PY

      python /tmp/act08_v7.py

  - name: Commit ACT 08 V7 results
    run: |
      git config user.name "NØX Origin"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add memory/nox_act_08_opportunity_evaluator_v7.json
      git add memory/nox_act_08_marketplace_diagnostic_v7.json

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "ACT 08 V7 opportunity intelligence result"

  - name: Rebase and push to main
    run: |
      git fetch origin main

      if git rebase origin/main; then
        git push origin HEAD:main
      else
        git rebase --abort
        echo "Rebase failed. No push performed."
        exit 1
      fi
